<div id="vis-container"><h2 class="sr-only">Meaning of Panchayati Raj and the Balwantrai Mehta Committee.</h2>
<svg class="n" width="100%" viewBox="0 0 680 1134" role="img"><title>CHAPTER 39 Panchayati Raj</title><desc>Meaning of Panchayati Raj and the Balwantrai Mehta Committee.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="203" y="26" width="275" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 39 Panchayati Raj</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Rural local self-government:</tspan><tspan class="k"> The term</tspan><tspan class="r"> Panchayati Raj</tspan><tspan class="k"> in India signifies the system of</tspan></text>
<text x="56" y="116"><tspan class="r">rural local self-government</tspan><tspan class="k">. It has been established in all the states of India by the</tspan><tspan class="b"> Acts</tspan></text>
<text x="56" y="138"><tspan class="b">of the state legislatures</tspan><tspan class="k"> to build</tspan><tspan class="r"> democracy at the grass root level</tspan><tspan class="k">. It is entrusted with</tspan></text>
<text x="56" y="160"><tspan class="r">rural development</tspan><tspan class="k">. It was</tspan><tspan class="r"> constitutionalised</tspan><tspan class="k"> through the</tspan><tspan class="r"> 73rd Constitutional Amendment</tspan></text>
<text x="56" y="182"><tspan class="r">Act of 1992</tspan><tspan class="k">.</tspan></text>
<text x="44" y="210"><tspan class="h" style="font-weight:700">Local government – State List (Entry 5):</tspan><tspan class="k"> In the scheme of division of powers between</tspan></text>
<text x="56" y="232"><tspan class="k">the Centre and the states in the Indian federal system, the item of ‘</tspan><tspan class="r">local Government</tspan><tspan class="k">’</tspan></text>
<text x="56" y="254"><tspan class="k">is given to the</tspan><tspan class="r"> states</tspan><tspan class="k">. Thus, the</tspan><tspan class="r"> fifth entry of the State List</tspan><tspan class="k"> of the Seventh Schedule to</tspan></text>
<text x="56" y="276"><tspan class="k">the Constitution of India deals with ‘local government’.</tspan></text>
<text class="lb" x="40" y="308">Evolution of Panchayati Raj</text>
<text class="sh" x="40" y="338"><tspan class="r" style="font-weight:700">Balwantrai Mehta Committee</tspan></text>
<text x="44" y="368"><tspan class="h" style="font-weight:700">Democratic decentralisation (1957):</tspan><tspan class="k"> In</tspan><tspan class="r"> January 1957</tspan><tspan class="k">, the Government of India</tspan></text>
<text x="56" y="390"><tspan class="k">appointed a committee to examine the working of the</tspan><tspan class="b"> Community Development</tspan></text>
<text x="56" y="412"><tspan class="b">Programme (1952)</tspan><tspan class="k"> and the</tspan><tspan class="b"> National Extension Service (1953)</tspan><tspan class="k"> and to suggest measures</tspan></text>
<text x="56" y="434"><tspan class="k">for their better working. The chairman of this committee was</tspan><tspan class="r"> Balwantrai G Mehta</tspan><tspan class="k">. The</tspan></text>
<text x="56" y="456"><tspan class="k">committee submitted its report in</tspan><tspan class="r"> November 1957</tspan><tspan class="k"> and recommended the establishment</tspan></text>
<text x="56" y="478"><tspan class="k">of the scheme of ‘</tspan><tspan class="r">democratic decentralisation</tspan><tspan class="k">’, which ultimately came to be known as</tspan></text>
<text x="56" y="500"><tspan class="r">Panchayati Raj</tspan><tspan class="k">. The specific recommendations made by it are:</tspan></text>
<text x="56" y="526" class="r" style="font-weight:700">1.</text>
<text x="78" y="526"><tspan class="h" style="font-weight:700">Three-tier system:</tspan><tspan class="k"> Establishment of a</tspan><tspan class="r"> three-tier panchayati raj system</tspan><tspan class="k">—</tspan><tspan class="b">gram</tspan></text>
<text x="78" y="548"><tspan class="b">panchayat at the village level, panchayat samiti at the block level and zila parishad</tspan></text>
<text x="78" y="570"><tspan class="b">at the district level</tspan><tspan class="k">. These tiers should be</tspan><tspan class="r"> organically linked</tspan><tspan class="k"> through a device of</tspan></text>
<text x="78" y="592"><tspan class="r">indirect elections</tspan><tspan class="k">.</tspan></text>
<text x="56" y="618" class="r" style="font-weight:700">2.</text>
<text x="78" y="618"><tspan class="h" style="font-weight:700">Direct + indirect elections:</tspan><tspan class="k"> The</tspan><tspan class="r"> village panchayat</tspan><tspan class="k"> should be constituted with</tspan></text>
<text x="78" y="640"><tspan class="r">directly elected</tspan><tspan class="k"> representatives, whereas the</tspan><tspan class="r"> panchayat samiti and zila parishad</tspan></text>
<text x="78" y="662"><tspan class="k">should be constituted with</tspan><tspan class="r"> indirectly elected</tspan><tspan class="k"> members.</tspan></text>
<text x="56" y="688" class="r" style="font-weight:700">3.</text>
<text x="78" y="688"><tspan class="h" style="font-weight:700">Planning &amp; development:</tspan><tspan class="k"> All</tspan><tspan class="r"> planning and development activities</tspan><tspan class="k"> should be</tspan></text>
<text x="78" y="710"><tspan class="k">entrusted to these bodies.</tspan></text>
<text x="56" y="736" class="r" style="font-weight:700">4.</text>
<text x="78" y="736"><tspan class="h" style="font-weight:700">Samiti executive, parishad advisory:</tspan><tspan class="k"> The</tspan><tspan class="r"> panchayat samiti should be the executive</tspan></text>
<text x="78" y="758"><tspan class="r">body</tspan><tspan class="k"> while the</tspan><tspan class="r"> zila parishad should be the advisory, coordinating and supervisory</tspan></text>
<text x="78" y="780"><tspan class="r">body</tspan><tspan class="k">.</tspan></text>
<text x="56" y="806" class="r" style="font-weight:700">5.</text>
<text x="78" y="806"><tspan class="h" style="font-weight:700">Collector as chairman:</tspan><tspan class="k"> The</tspan><tspan class="r"> district collector</tspan><tspan class="k"> should be the</tspan><tspan class="r"> chairman of the zila</tspan></text>
<text x="78" y="828"><tspan class="r">parishad</tspan><tspan class="k">.</tspan></text>
<text x="56" y="854" class="r" style="font-weight:700">6.</text>
<text x="78" y="854"><tspan class="h" style="font-weight:700">Genuine transfer of power:</tspan><tspan class="k"> There should be a</tspan><tspan class="r"> genuine transfer of power and</tspan></text>
<text x="78" y="876"><tspan class="r">responsibility</tspan><tspan class="k"> to these democratic bodies.</tspan></text>
<text x="56" y="902" class="r" style="font-weight:700">7.</text>
<text x="78" y="902"><tspan class="h" style="font-weight:700">Adequate resources:</tspan><tspan class="r"> Adequate resources</tspan><tspan class="k"> should be transferred to these bodies to</tspan></text>
<text x="78" y="924"><tspan class="k">enable them to discharge their functions and fulfil their responsibilities.</tspan></text>
<text x="56" y="950" class="r" style="font-weight:700">8.</text>
<text x="78" y="950"><tspan class="h" style="font-weight:700">Further devolution:</tspan><tspan class="k"> A system should be evolved to effect</tspan><tspan class="r"> further devolution of</tspan></text>
<text x="78" y="972"><tspan class="r">authority</tspan><tspan class="k"> in future.</tspan></text>

<text class="sm" x="201" y="1012" text-anchor="middle"><tspan class="r" style="font-weight:700">Zila Parishad</tspan><tspan class="k"> (district) – advisory</tspan></text>
<line class="ln" x1="319" y1="1008" x2="339" y2="1008" marker-end="url(#ah)"/>

<text class="sm" x="469" y="1003" text-anchor="middle"><tspan class="r" style="font-weight:700">Panchayat Samiti</tspan><tspan class="k"> (block) –</tspan></text>
<text class="sm" x="469" y="1021" text-anchor="middle"><tspan class="k">executive</tspan></text>
<line class="ln" x1="340" y1="1033" x2="340" y2="1054" marker-end="url(#ah)"/>
<rect class="bx" x="210" y="1056" width="260" height="48" rx="3"/>
<text class="sm" x="340" y="1075" text-anchor="middle"><tspan class="r" style="font-weight:700">Gram Panchayat</tspan><tspan class="k"> (village) – direct</tspan></text>
<text class="sm" x="340" y="1093" text-anchor="middle"><tspan class="k">election</tspan></text>
