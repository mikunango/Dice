<div id="vis-container"><h2 class="sr-only">73rd Amendment Act – Salient Features III and Eleventh Schedule</h2>
<svg class="n" width="100%" viewBox="0 0 680 1785" role="img"><title>73rd Amendment Act – Salient Features III and Eleventh Schedule</title><desc>73rd Amendment Act – Salient Features III and Eleventh Schedule</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="55" y="26" width="570" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">73rd Amendment Act – Salient Features III and Eleventh Schedule</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Audit of Accounts:</tspan><tspan class="k"> The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> may make provisions with respect to the</tspan></text>
<text x="56" y="116"><tspan class="r">maintenance of accounts</tspan><tspan class="k"> by the panchayats and the</tspan><tspan class="r"> auditing</tspan><tspan class="k"> of such accounts.</tspan></text>
<text x="44" y="144"><tspan class="h" style="font-weight:700">Application to Union Territories:</tspan><tspan class="k"> The provisions of this Part are</tspan><tspan class="r"> applicable to the Union</tspan></text>
<text x="56" y="166"><tspan class="r">territories</tspan><tspan class="k">. But, the</tspan><tspan class="r"> President</tspan><tspan class="k"> may direct that they would apply to a Union territory</tspan></text>
<text x="56" y="188"><tspan class="k">subject to such</tspan><tspan class="b"> exceptions and modifications</tspan><tspan class="k"> as he/she may specify.</tspan></text>
<text x="44" y="216"><tspan class="h" style="font-weight:700">Exempted States and Areas:</tspan><tspan class="k"> The act</tspan><tspan class="r"> does not apply to the states of Nagaland,</tspan></text>
<text x="56" y="238"><tspan class="r">Meghalaya and Mizoram</tspan><tspan class="k"> and certain other areas. These areas include, (a) the</tspan><tspan class="r"> scheduled</tspan></text>
<text x="56" y="260"><tspan class="r">areas and the tribal areas</tspan><tspan class="k"> in the states⁴; (b) the</tspan><tspan class="r"> hill areas of Manipur</tspan><tspan class="k"> for which</tspan></text>
<text x="56" y="282"><tspan class="k">district councils exist; and (c)</tspan><tspan class="r"> Darjeeling district of West Bengal</tspan><tspan class="k"> for which Darjeeling</tspan></text>
<text x="56" y="304"><tspan class="k">Gorkha Hill Council exists.</tspan></text>
<rect class="bx" x="40" y="316" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="336" text-anchor="middle"><tspan class="r" style="font-weight:700">States</tspan></text>
<text class="xs" x="111" y="354" text-anchor="middle"><tspan class="k">Nagaland, Meghalaya,</tspan></text>
<text class="xs" x="111" y="372" text-anchor="middle"><tspan class="k">Mizoram</tspan></text>
<rect class="bx" x="192" y="316" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="336" text-anchor="middle"><tspan class="r" style="font-weight:700">Areas</tspan></text>
<text class="xs" x="264" y="354" text-anchor="middle"><tspan class="k">scheduled &amp; tribal</tspan></text>
<text class="xs" x="264" y="372" text-anchor="middle"><tspan class="k">areas</tspan></text>
<rect class="bx" x="345" y="316" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="345" text-anchor="middle"><tspan class="r" style="font-weight:700">Manipur</tspan></text>
<text class="xs" x="416" y="363" text-anchor="middle"><tspan class="k">hill areas</tspan></text>
<rect class="bx" x="498" y="316" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="345" text-anchor="middle"><tspan class="r" style="font-weight:700">West Bengal</tspan></text>
<text class="xs" x="569" y="363" text-anchor="middle"><tspan class="k">Darjeeling</tspan></text>
<text x="44" y="412"><tspan class="h" style="font-weight:700">PESA extension:</tspan><tspan class="k"> However, the</tspan><tspan class="r"> Parliament may extend</tspan><tspan class="k"> the provisions of this Part to the</tspan></text>
<text x="56" y="434"><tspan class="k">scheduled areas and tribal areas subject to such exceptions and modifications as it may</tspan></text>
<text x="56" y="456"><tspan class="k">specify. Under this provision, the Parliament has enacted the “</tspan><tspan class="r">Provisions of the</tspan></text>
<text x="56" y="478"><tspan class="r">Panchayats (Extension to the Scheduled Areas) Act</tspan><tspan class="k">”,</tspan><tspan class="r"> 1996</tspan><tspan class="k">, popularly known as the</tspan><tspan class="r"> PESA</tspan></text>
<text x="56" y="500"><tspan class="r">Act or the Extension Act</tspan><tspan class="k">.</tspan></text>
<text x="44" y="528"><tspan class="h" style="font-weight:700">Continuance of Existing Laws and Panchayats:</tspan><tspan class="k"> All the state laws relating to</tspan></text>
<text x="56" y="550"><tspan class="k">panchayats shall continue to be in force until the</tspan><tspan class="r"> expiry of one year</tspan><tspan class="k"> from the</tspan></text>
<text x="56" y="572"><tspan class="k">commencement of this act. In other words, the states have to adopt the new panchayati</tspan></text>
<text x="56" y="594"><tspan class="k">raj system based on this act within the maximum period of one year from</tspan><tspan class="r"> 24 April,</tspan></text>
<text x="56" y="616"><tspan class="r">1993</tspan><tspan class="k">, which was the date of the commencement of this act. However, all the panchayats</tspan></text>
<text x="56" y="638"><tspan class="k">existing immediately before the commencement of act shall</tspan><tspan class="b"> continue till the expiry of</tspan></text>
<text x="56" y="660"><tspan class="b">their term</tspan><tspan class="k">, unless dissolved by the state legislature sooner.</tspan></text>
<text x="44" y="688"><tspan class="h" style="font-weight:700">State acts 1993–94:</tspan><tspan class="k"> Consequently, majority of states passed the panchayati raj acts in</tspan></text>
<text x="56" y="710"><tspan class="r">1993 and 1994</tspan><tspan class="k"> to adopt the new system in accordance with the 73rd Constitutional</tspan></text>
<text x="56" y="732"><tspan class="k">Amendment Act of 1992.</tspan></text>
<text x="44" y="760"><tspan class="h" style="font-weight:700">Bar to Interference by Courts in Electoral Matters:</tspan><tspan class="k"> The act</tspan><tspan class="r"> bars the interference by</tspan></text>
<text x="56" y="782"><tspan class="r">courts</tspan><tspan class="k"> in the electoral matters of panchayats. It declares that the validity of any law</tspan></text>
<text x="56" y="804"><tspan class="k">relating to the</tspan><tspan class="r"> delimitation of constituencies</tspan><tspan class="k"> or the</tspan><tspan class="r"> allotment of seats</tspan><tspan class="k"> to such</tspan></text>
<text x="56" y="826"><tspan class="k">constituencies</tspan><tspan class="r"> cannot be questioned in any court</tspan><tspan class="k">. It further lays down that no election</tspan></text>
<text x="56" y="848"><tspan class="k">to any panchayat is to be questioned except by an</tspan><tspan class="r"> election petition</tspan><tspan class="k"> presented to such</tspan></text>
<text x="56" y="870"><tspan class="k">authority and in such manner as provided by the state legislature.</tspan></text>
<text x="44" y="898"><tspan class="h" style="font-weight:700">Eleventh Schedule:</tspan><tspan class="k"> It contains the following</tspan><tspan class="r"> 29 functional items</tspan><tspan class="k"> placed within the</tspan></text>
<text x="56" y="920"><tspan class="k">purview of panchayats:</tspan></text>
<text x="56" y="944" class="r" style="font-weight:700">1.</text>
<text class="sm" x="85" y="944"><tspan class="k">Agriculture, including agricultural extension</tspan></text>
<text x="56" y="968" class="r" style="font-weight:700">2.</text>
<text class="sm" x="85" y="968"><tspan class="k">Land improvement, implementation of land reforms, land consolidation and soil</tspan></text>
<text class="sm" x="85" y="988"><tspan class="k">conservation</tspan></text>
<text x="56" y="1012" class="r" style="font-weight:700">3.</text>
<text class="sm" x="85" y="1012"><tspan class="k">Minor irrigation, water management and watershed development</tspan></text>
<text x="56" y="1036" class="r" style="font-weight:700">4.</text>
<text class="sm" x="85" y="1036"><tspan class="k">Animal husbandry, dairying and poultry</tspan></text>
<text x="56" y="1060" class="r" style="font-weight:700">5.</text>
<text class="sm" x="85" y="1060"><tspan class="k">Fisheries</tspan></text>
<text x="56" y="1084" class="r" style="font-weight:700">6.</text>
<text class="sm" x="85" y="1084"><tspan class="k">Social forestry and farm forestry</tspan></text>
<text x="56" y="1108" class="r" style="font-weight:700">7.</text>
<text class="sm" x="85" y="1108"><tspan class="k">Minor forest produce</tspan></text>
<text x="56" y="1132" class="r" style="font-weight:700">8.</text>
<text class="sm" x="85" y="1132"><tspan class="k">Small-scale industries, including food processing industries</tspan></text>
<text x="56" y="1156" class="r" style="font-weight:700">9.</text>
<text class="sm" x="85" y="1156"><tspan class="k">Khadi, village and cottage industries</tspan></text>
<text x="56" y="1180" class="r" style="font-weight:700">10.</text>
<text class="sm" x="85" y="1180"><tspan class="k">Rural housing</tspan></text>
<text x="56" y="1204" class="r" style="font-weight:700">11.</text>
<text class="sm" x="85" y="1204"><tspan class="k">Drinking water</tspan></text>
<text x="56" y="1228" class="r" style="font-weight:700">12.</text>
<text class="sm" x="85" y="1228"><tspan class="k">Fuel and fodder</tspan></text>
<text x="56" y="1252" class="r" style="font-weight:700">13.</text>
<text class="sm" x="85" y="1252"><tspan class="k">Roads, culverts, bridges, ferries, waterways and other means of communication</tspan></text>
<text x="56" y="1276" class="r" style="font-weight:700">14.</text>
<text class="sm" x="85" y="1276"><tspan class="k">Rural electrification, including distribution of electricity</tspan></text>
<text x="56" y="1300" class="r" style="font-weight:700">15.</text>
<text class="sm" x="85" y="1300"><tspan class="k">Non-conventional energy sources</tspan></text>
<text x="56" y="1324" class="r" style="font-weight:700">16.</text>
<text class="sm" x="85" y="1324"><tspan class="k">Poverty alleviation programme</tspan></text>
<text x="56" y="1348" class="r" style="font-weight:700">17.</text>
<text class="sm" x="85" y="1348"><tspan class="k">Education, including primary and secondary schools</tspan></text>
<text x="56" y="1372" class="r" style="font-weight:700">18.</text>
<text class="sm" x="85" y="1372"><tspan class="k">Technical training and vocational education</tspan></text>
<text x="56" y="1396" class="r" style="font-weight:700">19.</text>
<text class="sm" x="85" y="1396"><tspan class="k">Adult and non-formal education</tspan></text>
<text x="56" y="1420" class="r" style="font-weight:700">20.</text>
<text class="sm" x="85" y="1420"><tspan class="k">Libraries</tspan></text>
<text x="56" y="1444" class="r" style="font-weight:700">21.</text>
<text class="sm" x="85" y="1444"><tspan class="k">Cultural activities</tspan></text>
<text x="56" y="1468" class="r" style="font-weight:700">22.</text>
<text class="sm" x="85" y="1468"><tspan class="k">Markets and fairs</tspan></text>
<text x="56" y="1492" class="r" style="font-weight:700">23.</text>
<text class="sm" x="85" y="1492"><tspan class="k">Health and sanitation including hospitals, primary health centres and dispensaries</tspan></text>
<text x="56" y="1516" class="r" style="font-weight:700">24.</text>
<text class="sm" x="85" y="1516"><tspan class="k">Family welfare</tspan></text>
<text x="56" y="1540" class="r" style="font-weight:700">25.</text>
<text class="sm" x="85" y="1540"><tspan class="k">Women and child development</tspan></text>
<text x="56" y="1564" class="r" style="font-weight:700">26.</text>
<text class="sm" x="85" y="1564"><tspan class="k">Social welfare, including welfare of the handicapped and mentally retarded</tspan></text>
<text x="56" y="1588" class="r" style="font-weight:700">27.</text>
<text class="sm" x="85" y="1588"><tspan class="k">Welfare of the weaker sections, and in particular, of the scheduled castes and the</tspan></text>
<text class="sm" x="85" y="1608"><tspan class="k">scheduled tribes</tspan></text>
<text x="56" y="1632" class="r" style="font-weight:700">28.</text>
<text class="sm" x="85" y="1632"><tspan class="k">Public distribution system</tspan></text>
<text x="56" y="1656" class="r" style="font-weight:700">29.</text>
<text class="sm" x="85" y="1656"><tspan class="k">Maintenance of community assets.</tspan></text>
<path d="M50 926 L44 926 L44 1662 L50 1662" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1692"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> At present, ten states of India have scheduled areas. These are: Andhra Pradesh, Telangana,</tspan></text>
<text class="xs" x="50" y="1710"><tspan class="k">Jharkhand, Chhatisgarh, Gujarat, Himachal Pradesh, Madhya Pradesh, Maharashtra, Odisha and</tspan></text>
<text class="xs" x="50" y="1728"><tspan class="k">Rajasthan. Presently, there are a total of ten tribal areas (autonomous districts) in the four states</tspan></text>
<text class="xs" x="50" y="1746"><tspan class="k">of Assam (3), Meghalaya (3), Tripura (1) and Mizoram (3).</tspan></text>
<rect x="40" y="1670" width="600" height="85" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
