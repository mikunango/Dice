<div id="vis-container"><h2 class="sr-only">Ashok Mehta Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1396" role="img"><title>Ashok Mehta Committee</title><desc>Ashok Mehta Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="217" y="26" width="247" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Ashok Mehta Committee</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Ashok Mehta Committee</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Janata Government (1977):</tspan><tspan class="k"> In</tspan><tspan class="r"> December 1977</tspan><tspan class="k">, the</tspan><tspan class="r"> Janata Government</tspan><tspan class="k"> appointed a</tspan></text>
<text x="56" y="146"><tspan class="k">committee on panchayati raj institutions under the chairmanship of</tspan><tspan class="r"> Ashok Mehta</tspan><tspan class="k">. It</tspan></text>
<text x="56" y="168"><tspan class="k">submitted its report in</tspan><tspan class="r"> August 1978</tspan><tspan class="k"> and made</tspan><tspan class="r"> 132 recommendations</tspan><tspan class="k"> to</tspan><tspan class="b"> revive and</tspan></text>
<text x="56" y="190"><tspan class="b">strengthen the declining panchayati raj system</tspan><tspan class="k"> in the country. Its main</tspan></text>
<text x="56" y="212"><tspan class="k">recommendations were:</tspan></text>
<text x="56" y="238" class="r" style="font-weight:700">1.</text>
<text x="83" y="238"><tspan class="h" style="font-weight:700">Two-tier system:</tspan><tspan class="k"> The</tspan><tspan class="r"> three-tier system</tspan><tspan class="k"> of panchayati raj should be</tspan><tspan class="r"> replaced by</tspan></text>
<text x="83" y="260"><tspan class="r">the two-tier system</tspan><tspan class="k">, that is,</tspan><tspan class="b"> zila parishad at the district level</tspan><tspan class="k">, and below it, the</tspan></text>
<text x="83" y="282"><tspan class="b">mandal panchayat</tspan><tspan class="k"> consisting of a group of villages with a total population of</tspan><tspan class="r"> 15,000</tspan></text>
<text x="83" y="304"><tspan class="r">to 20,000</tspan><tspan class="k">.</tspan></text>
<text x="56" y="330" class="r" style="font-weight:700">2.</text>
<text x="83" y="330"><tspan class="h" style="font-weight:700">District as first point:</tspan><tspan class="k"> A</tspan><tspan class="r"> district should be the first point for decentralisation</tspan></text>
<text x="83" y="352"><tspan class="k">under popular supervision below the state level.</tspan></text>
<text x="56" y="378" class="r" style="font-weight:700">3.</text>
<text x="83" y="378"><tspan class="h" style="font-weight:700">Zila parishad executive:</tspan><tspan class="r"> Zila parishad should be the executive body</tspan><tspan class="k"> and made</tspan></text>
<text x="83" y="400"><tspan class="k">responsible for</tspan><tspan class="b"> planning at the district level</tspan><tspan class="k">.</tspan></text>
<text x="56" y="426" class="r" style="font-weight:700">4.</text>
<text x="83" y="426"><tspan class="h" style="font-weight:700">Political parties:</tspan><tspan class="k"> There should be an</tspan><tspan class="r"> official participation of political parties</tspan><tspan class="k"> at all</tspan></text>
<text x="83" y="448"><tspan class="k">levels of panchayat elections.</tspan></text>
<text x="56" y="474" class="r" style="font-weight:700">5.</text>
<text x="83" y="474"><tspan class="h" style="font-weight:700">Compulsory taxation:</tspan><tspan class="k"> The panchayati raj institutions should have</tspan><tspan class="r"> compulsory</tspan></text>
<text x="83" y="496"><tspan class="r">powers of taxation</tspan><tspan class="k"> to mobilise their own financial resources.</tspan></text>
<text x="56" y="522" class="r" style="font-weight:700">6.</text>
<text x="83" y="522"><tspan class="h" style="font-weight:700">Social audit:</tspan><tspan class="k"> There should be a regular</tspan><tspan class="r"> social audit</tspan><tspan class="k"> by a district level agency and</tspan></text>
<text x="83" y="544"><tspan class="k">by a committee of legislators to check whether the funds allotted for the</tspan></text>
<text x="83" y="566"><tspan class="k">vulnerable social and economic groups are actually spent on them.</tspan></text>
<text x="56" y="592" class="r" style="font-weight:700">7.</text>
<text x="83" y="592"><tspan class="h" style="font-weight:700">No supersession – elections in 6 months:</tspan><tspan class="k"> The state government</tspan><tspan class="r"> should not</tspan></text>
<text x="83" y="614"><tspan class="r">supersede</tspan><tspan class="k"> the panchayati raj institutions. In case of an imperative supersession,</tspan></text>
<text x="83" y="636"><tspan class="r">elections should be held within six months</tspan><tspan class="k"> from the date of supersession.</tspan></text>
<text x="56" y="662" class="r" style="font-weight:700">8.</text>
<text x="83" y="662"><tspan class="h" style="font-weight:700">Separate nyaya panchayats:</tspan><tspan class="k"> The</tspan><tspan class="r"> nyaya panchayats should be kept as separate</tspan></text>
<text x="83" y="684"><tspan class="r">bodies</tspan><tspan class="k"> from that of development panchayats. They should be presided over by a</tspan></text>
<text x="83" y="706"><tspan class="b">qualified judge</tspan><tspan class="k">.</tspan></text>
<text x="56" y="732" class="r" style="font-weight:700">9.</text>
<text x="83" y="732"><tspan class="h" style="font-weight:700">Elections by CEO:</tspan><tspan class="k"> The</tspan><tspan class="r"> chief electoral officer of a state</tspan><tspan class="k"> in consultation with the</tspan></text>
<text x="83" y="754"><tspan class="k">chief election commissioner should organise and conduct the panchayati raj</tspan></text>
<text x="83" y="776"><tspan class="k">elections.</tspan></text>
<text x="56" y="802" class="r" style="font-weight:700">10.</text>
<text x="83" y="802"><tspan class="h" style="font-weight:700">Development to zila parishad:</tspan><tspan class="r"> Development functions should be transferred to the</tspan></text>
<text x="83" y="824"><tspan class="r">zila parishad</tspan><tspan class="k"> and all development staff should work under its control and</tspan></text>
<text x="83" y="846"><tspan class="k">supervision.</tspan></text>
<text x="56" y="872" class="r" style="font-weight:700">11.</text>
<text x="83" y="872"><tspan class="h" style="font-weight:700">Voluntary agencies:</tspan><tspan class="k"> The</tspan><tspan class="r"> voluntary agencies</tspan><tspan class="k"> should play an important role in</tspan></text>
<text x="83" y="894"><tspan class="k">mobilising the support of the people for panchayati raj.</tspan></text>
<text x="56" y="920" class="r" style="font-weight:700">12.</text>
<text x="83" y="920"><tspan class="h" style="font-weight:700">Minister for PR:</tspan><tspan class="k"> A</tspan><tspan class="r"> minister for panchayati raj</tspan><tspan class="k"> should be appointed in the state</tspan></text>
<text x="83" y="942"><tspan class="k">council of ministers to look after the affairs of the panchayati raj institutions.</tspan></text>
<text x="56" y="968" class="r" style="font-weight:700">13.</text>
<text x="83" y="968"><tspan class="h" style="font-weight:700">SC/ST reservation:</tspan><tspan class="k"> Seats for</tspan><tspan class="r"> SCs and STs should be reserved</tspan><tspan class="k"> on the basis of their</tspan></text>
<text x="83" y="990"><tspan class="k">population.</tspan></text>
<text x="56" y="1016" class="r" style="font-weight:700">14.</text>
<text x="83" y="1016"><tspan class="h" style="font-weight:700">Constitutional recognition:</tspan><tspan class="k"> A</tspan><tspan class="r"> constitutional recognition</tspan><tspan class="k"> should be accorded to the</tspan></text>
<text x="83" y="1038"><tspan class="k">Panchayati Raj institutions. This would give them the requisite status (</tspan><tspan class="b">sanctity</tspan></text>
<text x="83" y="1060"><tspan class="b">and stature</tspan><tspan class="k">) and an assurance of continuous functioning.</tspan></text>

<rect class="bx" x="119" y="1072" width="177" height="48" rx="3"/>
<text class="sm" x="207" y="1100" text-anchor="middle"><tspan class="r" style="font-weight:700">Zila Parishad</tspan><tspan class="k"> (executive)</tspan></text>
<line class="ln" x1="299" y1="1096" x2="319" y2="1096" marker-end="url(#ah)"/>
<rect class="bx" x="322" y="1072" width="240" height="48" rx="3"/>
<text class="sm" x="441" y="1091" text-anchor="middle"><tspan class="r" style="font-weight:700">Mandal Panchayat</tspan></text>
<text class="sm" x="441" y="1109" text-anchor="middle"><tspan class="k">(15,000–20,000)</tspan></text>
<text x="44" y="1148"><tspan class="h" style="font-weight:700">No action at Centre – 3 states acted:</tspan><tspan class="k"> Due to the</tspan><tspan class="r"> collapse of the Janata Government</tspan></text>
<text x="56" y="1170"><tspan class="k">before the completion of its term,</tspan><tspan class="r"> no action</tspan><tspan class="k"> could be taken on the recommendations of</tspan></text>
<text x="56" y="1192"><tspan class="k">the Ashok Mehta Committee at the central level. However, the three states of</tspan></text>
<text x="56" y="1214"><tspan class="r">Karnataka, West Bengal and Andhra Pradesh</tspan><tspan class="k"> took steps to revitalise the panchayati raj,</tspan></text>
<text x="56" y="1236"><tspan class="k">keeping in view some of the recommendations of the Ashok Mehta Committee.</tspan></text>
<rect class="bx" x="46" y="1250" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1268" text-anchor="middle"><tspan class="r" style="font-weight:700">Balwantrai Mehta (1957)</tspan></text>
<line class="ln" x1="190" y1="1278" x2="190" y2="1292" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1313" text-anchor="middle"><tspan class="k">three-tier</tspan></text>
<text class="sm" x="190" y="1335" text-anchor="middle"><tspan class="k">samiti executive</tspan></text>
<text class="sm" x="190" y="1357" text-anchor="middle"><tspan class="k">collector chairs ZP</tspan></text>
<rect class="bx" x="346" y="1250" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1268" text-anchor="middle"><tspan class="r" style="font-weight:700">Ashok Mehta (1978)</tspan></text>
<line class="ln" x1="490" y1="1278" x2="490" y2="1292" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1313" text-anchor="middle"><tspan class="k">two-tier</tspan></text>
<text class="sm" x="490" y="1335" text-anchor="middle"><tspan class="k">ZP executive</tspan></text>
<text class="sm" x="490" y="1357" text-anchor="middle"><tspan class="k">party participation, constitutional status</tspan></text>
