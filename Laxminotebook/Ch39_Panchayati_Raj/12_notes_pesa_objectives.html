<div id="vis-container"><h2 class="sr-only">PESA Act of 1996 – Objectives</h2>
<svg class="n" width="100%" viewBox="0 0 680 801" role="img"><title>PESA Act of 1996 – Objectives</title><desc>PESA Act of 1996 – Objectives</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="194" y="26" width="292" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">PESA Act of 1996 – Objectives</text>
<text class="lb" x="40" y="98">Pesa Act of 1996 (Extension Act)</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Fifth Schedule areas:</tspan><tspan class="k"> The provisions of</tspan><tspan class="r"> Part IX</tspan><tspan class="k"> of the constitution relating to the</tspan></text>
<text x="56" y="150"><tspan class="k">Panchayats are</tspan><tspan class="r"> not applicable to the Fifth Schedule areas</tspan><tspan class="k">. However, the</tspan><tspan class="r"> Parliament may</tspan></text>
<text x="56" y="172"><tspan class="r">extend</tspan><tspan class="k"> these provisions to such areas, subject to such exceptions and modifications as it</tspan></text>
<text x="56" y="194"><tspan class="k">may specify. Under this provision, the Parliament has enacted the “</tspan><tspan class="r">Provisions of the</tspan></text>
<text x="56" y="216"><tspan class="r">Panchayats (Extension to the Scheduled Areas) Act</tspan><tspan class="k">”,</tspan><tspan class="r"> 1996</tspan><tspan class="k">, popularly known as the</tspan><tspan class="r"> PESA</tspan></text>
<text x="56" y="238"><tspan class="r">Act or the Extension Act</tspan><tspan class="k">.</tspan></text>
<text x="44" y="266"><tspan class="h" style="font-weight:700">Ten Fifth Schedule states:</tspan><tspan class="k"> At present,</tspan><tspan class="r"> ten states have Fifth Schedule Areas</tspan><tspan class="k">. These are:</tspan></text>
<text x="56" y="288"><tspan class="b">Andhra Pradesh, Telangana, Chhatisgarh, Gujarat, Himachal Pradesh, Jharkhand, Madhya</tspan></text>
<text x="56" y="310"><tspan class="b">Pradesh, Maharashtra, Odisha and Rajasthan</tspan><tspan class="k">. All the ten states have enacted requisite</tspan></text>
<text x="56" y="332"><tspan class="r">compliance legislations</tspan><tspan class="k"> by amending the respective Panchayati Raj Acts.</tspan></text>
<text class="sh" x="40" y="360"><tspan class="r" style="font-weight:700">Objectives of the Act</tspan></text>
<text x="44" y="390"><tspan class="h" style="font-weight:700">Objectives:</tspan><tspan class="k"> The objectives of the PESA Act are as follows⁵:</tspan></text>
<text x="56" y="416" class="r" style="font-weight:700">1.</text>
<text x="78" y="416"><tspan class="h" style="font-weight:700">Extend Part IX:</tspan><tspan class="k"> To</tspan><tspan class="r"> extend the provisions of Part IX</tspan><tspan class="k"> of the Constitution relating to</tspan></text>
<text x="78" y="438"><tspan class="k">the panchayats to the scheduled areas with certain modifications</tspan></text>
<text x="56" y="464" class="r" style="font-weight:700">2.</text>
<text x="78" y="464"><tspan class="h" style="font-weight:700">Tribal self-rule:</tspan><tspan class="k"> To provide</tspan><tspan class="r"> self-rule</tspan><tspan class="k"> for the bulk of the</tspan><tspan class="r"> tribal population</tspan></text>
<text x="56" y="490" class="r" style="font-weight:700">3.</text>
<text x="78" y="490"><tspan class="h" style="font-weight:700">Gram sabha as nucleus:</tspan><tspan class="k"> To have</tspan><tspan class="r"> village governance with participatory democracy</tspan></text>
<text x="78" y="512"><tspan class="k">and to make the</tspan><tspan class="r"> gram sabha a nucleus</tspan><tspan class="k"> of all activities</tspan></text>
<text x="56" y="538" class="r" style="font-weight:700">4.</text>
<text x="78" y="538"><tspan class="h" style="font-weight:700">Traditional framework:</tspan><tspan class="k"> To evolve a suitable</tspan><tspan class="r"> administrative framework consistent</tspan></text>
<text x="78" y="560"><tspan class="r">with traditional practices</tspan></text>
<text x="56" y="586" class="r" style="font-weight:700">5.</text>
<text x="78" y="586"><tspan class="h" style="font-weight:700">Preserve customs:</tspan><tspan class="k"> To</tspan><tspan class="r"> safeguard and to preserve the traditions and customs</tspan><tspan class="k"> of</tspan></text>
<text x="78" y="608"><tspan class="k">tribal communities</tspan></text>
<text x="56" y="634" class="r" style="font-weight:700">6.</text>
<text x="78" y="634"><tspan class="h" style="font-weight:700">Tribal-specific powers:</tspan><tspan class="k"> To</tspan><tspan class="r"> empower panchayats</tspan><tspan class="k"> at the appropriate levels with</tspan></text>
<text x="78" y="656"><tspan class="k">specific powers conducive to</tspan><tspan class="r"> tribal requirements</tspan></text>
<text x="56" y="682" class="r" style="font-weight:700">7.</text>
<text x="78" y="682"><tspan class="h" style="font-weight:700">No usurpation from above:</tspan><tspan class="k"> To</tspan><tspan class="r"> prevent panchayats at the higher level from</tspan></text>
<text x="78" y="704"><tspan class="r">assuming the powers</tspan><tspan class="k"> and authority of panchayats at the lower level of the gram</tspan></text>
<text x="78" y="726"><tspan class="k">sabha</tspan></text>
<path d="M50 396 L44 396 L44 732 L50 732" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
