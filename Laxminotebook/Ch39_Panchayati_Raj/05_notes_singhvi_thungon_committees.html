<div id="vis-container"><h2 class="sr-only">L.M. Singhvi and Thungon Committees</h2>
<svg class="n" width="100%" viewBox="0 0 680 1240" role="img"><title>L.M. Singhvi and Thungon Committees</title><desc>L.M. Singhvi and Thungon Committees</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="166" y="26" width="348" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">L.M. Singhvi and Thungon Committees</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">L M Singhvi Committee</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Singhvi Committee (1986):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1986</tspan><tspan class="k">,</tspan><tspan class="r"> Rajiv Gandhi government</tspan><tspan class="k"> appointed a committee to</tspan></text>
<text x="56" y="146"><tspan class="k">prepare a concept paper on ‘</tspan><tspan class="b">Revitalisation of Panchayati Raj Institutions for Democracy</tspan></text>
<text x="56" y="168"><tspan class="b">and Development</tspan><tspan class="k">’ under the chairmanship of</tspan><tspan class="r"> L.M. Singhvi</tspan><tspan class="k">. It made the following</tspan></text>
<text x="56" y="190"><tspan class="k">recommendations.</tspan></text>
<text x="56" y="216" class="r" style="font-weight:700">(i)</text>
<text x="93" y="216"><tspan class="h" style="font-weight:700">Constitutional recognition – new chapter:</tspan><tspan class="k"> The Panchayati Raj institutions</tspan></text>
<text x="93" y="238"><tspan class="k">should be</tspan><tspan class="r"> constitutionally recognised, protected and preserved</tspan><tspan class="k">. For this purpose, a</tspan></text>
<text x="93" y="260"><tspan class="r">new chapter should be added in the Constitution</tspan><tspan class="k"> of India. This will make their</tspan></text>
<text x="93" y="282"><tspan class="k">identity and integrity reasonably and substantially inviolate. It also suggested</tspan></text>
<text x="93" y="304"><tspan class="k">constitutional provisions to ensure</tspan><tspan class="r"> regular, free and fair elections</tspan><tspan class="k"> to the</tspan></text>
<text x="93" y="326"><tspan class="k">Panchayati Raj bodies.</tspan></text>
<text x="56" y="352" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="352"><tspan class="h" style="font-weight:700">Nyaya panchayats:</tspan><tspan class="r"> Nyaya Panchayats</tspan><tspan class="k"> should be established for a</tspan><tspan class="b"> cluster of</tspan></text>
<text x="93" y="374"><tspan class="b">villages</tspan><tspan class="k">.</tspan></text>
<text x="56" y="400" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="400"><tspan class="h" style="font-weight:700">Gram Sabha – direct democracy:</tspan><tspan class="k"> The villages should be reorganised to make</tspan></text>
<text x="93" y="422"><tspan class="r">Gram Panchayats more viable</tspan><tspan class="k">. It also emphasised the importance of the</tspan><tspan class="r"> Gram</tspan></text>
<text x="93" y="444"><tspan class="r">Sabha</tspan><tspan class="k"> and called it as the</tspan><tspan class="r"> embodiment of direct democracy</tspan><tspan class="k">.</tspan></text>
<text x="56" y="470" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="470"><tspan class="h" style="font-weight:700">More finances:</tspan><tspan class="k"> The Village Panchayats should have</tspan><tspan class="r"> more financial resources</tspan><tspan class="k">.</tspan></text>
<text x="56" y="496" class="r" style="font-weight:700">(v)</text>
<text x="93" y="496"><tspan class="h" style="font-weight:700">Judicial tribunals:</tspan><tspan class="k"> The</tspan><tspan class="r"> judicial tribunals</tspan><tspan class="k"> should be established in each state to</tspan></text>
<text x="93" y="518"><tspan class="k">adjudicate controversies about election to the Panchayati Raj institutions, their</tspan></text>
<text x="93" y="540"><tspan class="k">dissolution and other matters related to their functioning.</tspan></text>
<path d="M50 196 L44 196 L44 546 L50 546" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="568"><tspan class="r" style="font-weight:700">Thungon Committee</tspan></text>
<text x="44" y="598"><tspan class="h" style="font-weight:700">Thungon Committee (1988):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1988</tspan><tspan class="k">, a</tspan><tspan class="r"> sub-committee of the Consultative Committee</tspan></text>
<text x="56" y="620"><tspan class="r">of Parliament</tspan><tspan class="k"> was constituted under the chairmanship of</tspan><tspan class="r"> P.K. Thungon</tspan><tspan class="k"> to examine the</tspan></text>
<text x="56" y="642"><tspan class="k">political and administrative structure in the district for the purpose of</tspan><tspan class="b"> district planning</tspan><tspan class="k">.</tspan></text>
<text x="56" y="664"><tspan class="k">This committee suggested for the strengthening of the Panchayati Raj system. It made</tspan></text>
<text x="56" y="686"><tspan class="k">the following recommendations:</tspan></text>
<text x="56" y="712" class="r" style="font-weight:700">1.</text>
<text x="82" y="712"><tspan class="h" style="font-weight:700">Constitutional recognition:</tspan><tspan class="k"> The Panchayati Raj bodies should be</tspan><tspan class="r"> constitutionally</tspan></text>
<text x="82" y="734"><tspan class="r">recognized</tspan><tspan class="k">.</tspan></text>
<text x="56" y="760" class="r" style="font-weight:700">2.</text>
<text x="82" y="760"><tspan class="h" style="font-weight:700">Three-tier:</tspan><tspan class="k"> A</tspan><tspan class="r"> three-tier system</tspan><tspan class="k"> of Panchayati Raj with panchayats at the village,</tspan></text>
<text x="82" y="782"><tspan class="k">block and district levels.</tspan></text>
<text x="56" y="808" class="r" style="font-weight:700">3.</text>
<text x="82" y="808"><tspan class="h" style="font-weight:700">Zilla Parishad as pivot:</tspan><tspan class="r"> Zilla Parishad should be the pivot</tspan><tspan class="k"> of the Panchayati Raj</tspan></text>
<text x="82" y="830"><tspan class="k">system. It should act as the planning and development agency in the district.</tspan></text>
<text x="56" y="856" class="r" style="font-weight:700">4.</text>
<text x="82" y="856"><tspan class="h" style="font-weight:700">Five-year tenure:</tspan><tspan class="k"> The Panchayati Raj bodies should have a</tspan><tspan class="r"> fixed tenure of five</tspan></text>
<text x="82" y="878"><tspan class="r">years</tspan><tspan class="k">.</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">5.</text>
<text x="82" y="904"><tspan class="h" style="font-weight:700">Supersession – 6 months:</tspan><tspan class="k"> The maximum period of</tspan><tspan class="r"> super session</tspan><tspan class="k"> of a body should</tspan></text>
<text x="82" y="926"><tspan class="k">be</tspan><tspan class="r"> six months</tspan><tspan class="k">.</tspan></text>
<text x="56" y="952" class="r" style="font-weight:700">6.</text>
<text x="82" y="952"><tspan class="h" style="font-weight:700">State planning committee:</tspan><tspan class="k"> A</tspan><tspan class="r"> planning and co-ordination committee</tspan><tspan class="k"> should be</tspan></text>
<text x="82" y="974"><tspan class="k">set-up at the state level under the chairmanship of the</tspan><tspan class="b"> minister for planning</tspan><tspan class="k">. The</tspan></text>
<text x="82" y="996"><tspan class="k">presidents of Zilla Parishads should be its members.</tspan></text>
<text x="56" y="1022" class="r" style="font-weight:700">7.</text>
<text x="82" y="1022"><tspan class="h" style="font-weight:700">List of subjects:</tspan><tspan class="k"> A</tspan><tspan class="r"> detailed list of subjects</tspan><tspan class="k"> for Panchayati Raj should be prepared</tspan></text>
<text x="82" y="1044"><tspan class="k">and incorporated in the Constitution.</tspan></text>
<text x="56" y="1070" class="r" style="font-weight:700">8.</text>
<text x="82" y="1070"><tspan class="h" style="font-weight:700">Reservation incl. women:</tspan><tspan class="r"> Reservation of seats</tspan><tspan class="k"> in all the three-tiers should be on</tspan></text>
<text x="82" y="1092"><tspan class="k">the basis of population. There should also be</tspan><tspan class="r"> reservation for women</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1118" class="r" style="font-weight:700">9.</text>
<text x="82" y="1118"><tspan class="h" style="font-weight:700">State Finance Commission:</tspan><tspan class="k"> A</tspan><tspan class="r"> state finance commission</tspan><tspan class="k"> should be set-up in each</tspan></text>
<text x="82" y="1140"><tspan class="k">state. It would lay down the criteria and guidelines for the devolution of finances</tspan></text>
<text x="82" y="1162"><tspan class="k">to the Panchayati Raj institutions.</tspan></text>
<text x="56" y="1188" class="r" style="font-weight:700">10.</text>
<text x="82" y="1188"><tspan class="h" style="font-weight:700">Collector as CEO:</tspan><tspan class="k"> The</tspan><tspan class="r"> district collector should be the chief executive officer</tspan><tspan class="k"> of the</tspan></text>
<text x="82" y="1210"><tspan class="k">Zilla Parishad.</tspan></text>
