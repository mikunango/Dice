<div id="vis-container"><h2 class="sr-only">Compulsory and Voluntary Provisions</h2>
<svg class="n" width="100%" viewBox="0 0 680 1430" role="img"><title>Compulsory and Voluntary Provisions</title><desc>Compulsory and Voluntary Provisions</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="173" y="26" width="334" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Compulsory and Voluntary Provisions</text>
<text class="lb" x="40" y="98">Compulsory and Voluntary Provisions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Mandatory vs discretionary features:</tspan><tspan class="k"> Now, we will identify separately the</tspan><tspan class="r"> compulsory</tspan></text>
<text x="56" y="150"><tspan class="k">(obligatory or mandatory) and</tspan><tspan class="r"> voluntary</tspan><tspan class="k"> (discretionary or optional) provisions (features)</tspan></text>
<text x="56" y="172"><tspan class="k">of the 73rd Constitutional Amendment Act (1992) or the Part IX of the Constitution:</tspan></text>
<text class="sh" x="40" y="200"><tspan class="r" style="font-weight:700">A. Compulsory Provisions</tspan></text>
<text x="56" y="228" class="r" style="font-weight:700">1.</text>
<text x="82" y="228"><tspan class="k">Organisation of</tspan><tspan class="r"> Gram Sabha</tspan><tspan class="k"> in a village or group of villages.</tspan></text>
<text x="56" y="254" class="r" style="font-weight:700">2.</text>
<text x="82" y="254"><tspan class="k">Establishment of panchayats at the</tspan><tspan class="r"> village, intermediate and district levels</tspan><tspan class="k">.</tspan></text>
<text x="56" y="280" class="r" style="font-weight:700">3.</text>
<text x="82" y="280"><tspan class="r">Direct elections</tspan><tspan class="k"> to all seats in panchayats at the village, intermediate and district</tspan></text>
<text x="82" y="302"><tspan class="k">levels.</tspan></text>
<text x="56" y="328" class="r" style="font-weight:700">4.</text>
<text x="82" y="328"><tspan class="r">Indirect elections</tspan><tspan class="k"> to the post of chairperson of panchayats at the intermediate and</tspan></text>
<text x="82" y="350"><tspan class="k">district levels.</tspan></text>
<text x="56" y="376" class="r" style="font-weight:700">5.</text>
<text x="82" y="376"><tspan class="r">Voting rights</tspan><tspan class="k"> of the chairperson and other members of a panchayat elected directly</tspan></text>
<text x="82" y="398"><tspan class="k">or indirectly.</tspan></text>
<text x="56" y="424" class="r" style="font-weight:700">6.</text>
<text x="82" y="424"><tspan class="r">21 years</tspan><tspan class="k"> to be the minimum age for contesting elections to panchayats.</tspan></text>
<text x="56" y="450" class="r" style="font-weight:700">7.</text>
<text x="82" y="450"><tspan class="k">Reservation of seats (both members and chairpersons) for</tspan><tspan class="r"> SCs and STs</tspan><tspan class="k"> in</tspan></text>
<text x="82" y="472"><tspan class="k">panchayats at all the three levels.</tspan></text>
<text x="56" y="498" class="r" style="font-weight:700">8.</text>
<text x="82" y="498"><tspan class="k">Reservation of</tspan><tspan class="r"> one-third seats</tspan><tspan class="k"> (both members and chairpersons) for</tspan><tspan class="r"> women</tspan><tspan class="k"> in</tspan></text>
<text x="82" y="520"><tspan class="k">panchayats at all the three levels.</tspan></text>
<text x="56" y="546" class="r" style="font-weight:700">9.</text>
<text x="82" y="546"><tspan class="k">Fixing</tspan><tspan class="r"> tenure of five years</tspan><tspan class="k"> for panchayats at all levels and holding fresh elections</tspan></text>
<text x="82" y="568"><tspan class="k">within</tspan><tspan class="r"> six months</tspan><tspan class="k"> in the event of supersession of any panchayat.</tspan></text>
<text x="56" y="594" class="r" style="font-weight:700">10.</text>
<text x="82" y="594"><tspan class="k">Establishment of a</tspan><tspan class="r"> State Election Commission</tspan><tspan class="k"> for conducting elections to the</tspan></text>
<text x="82" y="616"><tspan class="k">panchayats.</tspan></text>
<text x="56" y="642" class="r" style="font-weight:700">11.</text>
<text x="82" y="642"><tspan class="k">Constitution of a</tspan><tspan class="r"> State Finance Commission</tspan><tspan class="k"> after every five years to review the</tspan></text>
<text x="82" y="664"><tspan class="k">financial position of the panchayats.</tspan></text>
<path d="M50 208 L44 208 L44 670 L50 670" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="692"><tspan class="r" style="font-weight:700">B. Voluntary Provisions</tspan></text>
<text x="56" y="720" class="r" style="font-weight:700">1.</text>
<text x="83" y="720"><tspan class="k">Endowing the</tspan><tspan class="r"> Gram Sabha with powers</tspan><tspan class="k"> and functions at the village level.</tspan></text>
<text x="56" y="746" class="r" style="font-weight:700">2.</text>
<text x="83" y="746"><tspan class="k">Determining the</tspan><tspan class="r"> manner of election of the chairperson of the village panchayat</tspan><tspan class="k">.</tspan></text>
<text x="56" y="772" class="r" style="font-weight:700">3.</text>
<text x="83" y="772"><tspan class="k">Giving</tspan><tspan class="r"> representation to the chairpersons of the village panchayats</tspan><tspan class="k"> in the</tspan></text>
<text x="83" y="794"><tspan class="k">intermediate panchayats or in the case of a state not having intermediate</tspan></text>
<text x="83" y="816"><tspan class="k">panchayats, in the district panchayats.</tspan></text>
<text x="56" y="842" class="r" style="font-weight:700">4.</text>
<text x="83" y="842"><tspan class="k">Giving representation to the</tspan><tspan class="r"> chairpersons of the intermediate panchayats</tspan><tspan class="k"> in the</tspan></text>
<text x="83" y="864"><tspan class="k">district panchayats.</tspan></text>
<text x="56" y="890" class="r" style="font-weight:700">5.</text>
<text x="83" y="890"><tspan class="k">Giving representation to</tspan><tspan class="r"> members of the Parliament</tspan><tspan class="k"> (both the Houses) and the</tspan></text>
<text x="83" y="912"><tspan class="r">state legislature</tspan><tspan class="k"> (both the Houses) in the panchayats at different levels falling</tspan></text>
<text x="83" y="934"><tspan class="k">within their constituencies.</tspan></text>
<text x="56" y="960" class="r" style="font-weight:700">6.</text>
<text x="83" y="960"><tspan class="k">Providing reservation of seats (both members and chairpersons) for</tspan><tspan class="r"> backward</tspan></text>
<text x="83" y="982"><tspan class="r">classes</tspan><tspan class="k"> in panchayats at any level.</tspan></text>
<text x="56" y="1008" class="r" style="font-weight:700">7.</text>
<text x="83" y="1008"><tspan class="k">Granting</tspan><tspan class="r"> powers and authority</tspan><tspan class="k"> to the panchayats to enable them to function as</tspan></text>
<text x="83" y="1030"><tspan class="k">institutions of self-government (in brief, making them</tspan><tspan class="b"> autonomous bodies</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1056" class="r" style="font-weight:700">8.</text>
<text x="83" y="1056"><tspan class="r">Devolution of powers and responsibilities</tspan><tspan class="k"> upon panchayats to prepare plans for</tspan></text>
<text x="83" y="1078"><tspan class="k">economic development and social justice; and to perform some or all of the</tspan><tspan class="r"> 29</tspan></text>
<text x="83" y="1100"><tspan class="r">functions</tspan><tspan class="k"> listed in the Eleventh Schedule of the Constitution.</tspan></text>
<text x="56" y="1126" class="r" style="font-weight:700">9.</text>
<text x="83" y="1126"><tspan class="k">Granting</tspan><tspan class="r"> financial powers</tspan><tspan class="k"> to the panchayats, that is, authorizing them to levy,</tspan></text>
<text x="83" y="1148"><tspan class="k">collect and appropriate taxes, duties, tolls and fees.</tspan></text>
<text x="56" y="1174" class="r" style="font-weight:700">10.</text>
<text x="83" y="1174"><tspan class="r">Assigning to a panchayat the taxes</tspan><tspan class="k">, duties, tolls and fees levied and collected by</tspan></text>
<text x="83" y="1196"><tspan class="k">the state government.</tspan></text>
<text x="56" y="1222" class="r" style="font-weight:700">11.</text>
<text x="83" y="1222"><tspan class="k">Making the</tspan><tspan class="r"> grants-in-aid</tspan><tspan class="k"> to the panchayats from the consolidated fund of the</tspan></text>
<text x="83" y="1244"><tspan class="k">state.</tspan></text>
<text x="56" y="1270" class="r" style="font-weight:700">12.</text>
<text x="83" y="1270"><tspan class="k">Providing for</tspan><tspan class="r"> constitution of funds</tspan><tspan class="k"> for crediting all moneys of the panchayats.</tspan></text>
<path d="M50 700 L44 700 L44 1276 L50 1276" fill="none" stroke="#D93A3A" stroke-width="1.6"/>

<text class="sm" x="190" y="1302" text-anchor="middle"><tspan class="r" style="font-weight:700">Compulsory</tspan></text>
<line class="ln" x1="190" y1="1312" x2="190" y2="1326" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1347" text-anchor="middle"><tspan class="k">structure, elections</tspan></text>
<text class="sm" x="190" y="1369" text-anchor="middle"><tspan class="k">reservation SC/ST/women</tspan></text>
<text class="sm" x="190" y="1391" text-anchor="middle"><tspan class="k">tenure, SEC, SFC</tspan></text>
<rect class="bx" x="346" y="1284" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1302" text-anchor="middle"><tspan class="r" style="font-weight:700">Voluntary</tspan></text>
<line class="ln" x1="490" y1="1312" x2="490" y2="1326" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1347" text-anchor="middle"><tspan class="k">powers, functions, finances</tspan></text>
<text class="sm" x="490" y="1369" text-anchor="middle"><tspan class="k">OBC reservation</tspan></text>
<text class="sm" x="490" y="1391" text-anchor="middle"><tspan class="k">MP/MLA representation</tspan></text>
