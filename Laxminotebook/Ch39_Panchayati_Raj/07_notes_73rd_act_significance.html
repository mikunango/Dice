<div id="vis-container"><h2 class="sr-only">73rd Amendment Act – Significance</h2>
<svg class="n" width="100%" viewBox="0 0 680 924" role="img"><title>73rd Amendment Act – Significance</title><desc>73rd Amendment Act – Significance</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="173" y="26" width="335" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">73rd Amendment Act – Significance</text>
<text class="lb" x="40" y="98">73rd Constitutional Amendment Act of 1992</text>
<text class="sh" x="40" y="128"><tspan class="r" style="font-weight:700">Significance of the Act</tspan></text>
<text x="44" y="158"><tspan class="h" style="font-weight:700">Part IX &amp; Eleventh Schedule:</tspan><tspan class="k"> This act has added a new</tspan><tspan class="r"> Part-IX</tspan><tspan class="k"> to the Constitution of</tspan></text>
<text x="56" y="180"><tspan class="k">India. This part is entitled as ‘</tspan><tspan class="r">The Panchayats</tspan><tspan class="k">’ and consists of provisions from</tspan><tspan class="r"> Articles</tspan></text>
<text x="56" y="202"><tspan class="r">243 to 243-O</tspan><tspan class="k">. In addition, the act has also added a new</tspan><tspan class="r"> Eleventh Schedule</tspan><tspan class="k"> to the</tspan></text>
<text x="56" y="224"><tspan class="k">Constitution. This schedule contains</tspan><tspan class="r"> 29 functional items</tspan><tspan class="k"> of the panchayats. It deals with</tspan></text>
<text x="56" y="246"><tspan class="r">Article 243-G</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="258" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="188" y="278" text-anchor="middle"><tspan class="r" style="font-weight:700">Part IX</tspan></text>
<text class="sm" x="188" y="296" text-anchor="middle"><tspan class="k">‘The Panchayats’</tspan></text>
<text class="sm" x="188" y="314" text-anchor="middle"><tspan class="k">Arts. 243 – 243-O</tspan></text>
<rect class="bx" x="345" y="258" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="278" text-anchor="middle"><tspan class="r" style="font-weight:700">Eleventh Schedule</tspan></text>
<text class="sm" x="492" y="296" text-anchor="middle"><tspan class="k">29 functional items</tspan></text>
<text class="sm" x="492" y="314" text-anchor="middle"><tspan class="k">Art. 243-G</tspan></text>
<text x="44" y="354"><tspan class="h" style="font-weight:700">Article 40 (DPSP) given shape:</tspan><tspan class="k"> The act has given a practical shape to</tspan><tspan class="r"> Article 40</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="376"><tspan class="k">Constitution which says that, “</tspan><tspan class="b">The State shall take steps to organise village panchayats</tspan></text>
<text x="56" y="398"><tspan class="b">and endow them with such powers and authority as may be necessary to enable them to</tspan></text>
<text x="56" y="420"><tspan class="b">function as units of self-government.</tspan><tspan class="k">” This article forms a part of the</tspan><tspan class="r"> Directive</tspan></text>
<text x="56" y="442"><tspan class="r">Principles of State Policy</tspan><tspan class="k">.</tspan></text>
<text x="44" y="470"><tspan class="h" style="font-weight:700">Justiciable constitutional status:</tspan><tspan class="k"> The act gives a</tspan><tspan class="r"> constitutional status</tspan><tspan class="k"> to the</tspan></text>
<text x="56" y="492"><tspan class="k">panchayati raj institutions. It has brought them under the purview of the</tspan><tspan class="r"> justiciable part</tspan></text>
<text x="56" y="514"><tspan class="r">of the Constitution</tspan><tspan class="k">. In other words, the state governments are under</tspan><tspan class="r"> constitutional</tspan></text>
<text x="56" y="536"><tspan class="r">obligation</tspan><tspan class="k"> to adopt the new panchayati raj system in accordance with the provisions of</tspan></text>
<text x="56" y="558"><tspan class="k">the act. Consequently, neither the formation of panchayats nor the holding of elections</tspan></text>
<text x="56" y="580"><tspan class="k">at regular intervals</tspan><tspan class="r"> depend on the will of the state government</tspan><tspan class="k"> any more.</tspan></text>
<text x="44" y="608"><tspan class="h" style="font-weight:700">Compulsory vs voluntary provisions:</tspan><tspan class="k"> The provisions of the act can be grouped into two</tspan></text>
<text x="56" y="630"><tspan class="k">categories—</tspan><tspan class="r">compulsory and voluntary</tspan><tspan class="k">. The</tspan><tspan class="r"> compulsory</tspan><tspan class="k"> (mandatory or obligatory)</tspan></text>
<text x="56" y="652"><tspan class="k">provisions of the act</tspan><tspan class="b"> have to be included</tspan><tspan class="k"> in the state laws creating the new panchayati</tspan></text>
<text x="56" y="674"><tspan class="k">raj system. The</tspan><tspan class="r"> voluntary</tspan><tspan class="k"> provisions, on the other hand, may be included at the</tspan></text>
<text x="56" y="696"><tspan class="b">discretion of the states</tspan><tspan class="k">. Thus the voluntary provisions of the act ensures the right of the</tspan></text>
<text x="56" y="718"><tspan class="k">states to take local factors like geographical, politico–administrative and others, into</tspan></text>
<text x="56" y="740"><tspan class="k">consideration while adopting the new panchayati raj system.</tspan></text>
<text x="44" y="768"><tspan class="h" style="font-weight:700">Participatory democracy:</tspan><tspan class="k"> The act is a</tspan><tspan class="r"> significant landmark</tspan><tspan class="k"> in the evolution of grassroot</tspan></text>
<text x="56" y="790"><tspan class="k">democratic institutions in the country. It transfers the</tspan><tspan class="r"> representative democracy into</tspan></text>
<text x="56" y="812"><tspan class="r">participatory democracy</tspan><tspan class="k">. It is a</tspan><tspan class="r"> revolutionary concept</tspan><tspan class="k"> to build democracy at the grassroot</tspan></text>
<text x="56" y="834"><tspan class="k">level in the country.</tspan></text>
<rect class="bx" x="156" y="846" width="176" height="48" rx="3"/>
<text class="sm" x="243" y="874" text-anchor="middle"><tspan class="k">representative democracy</tspan></text>
<line class="ln" x1="334" y1="870" x2="354" y2="870" marker-end="url(#ah)"/>
<rect class="bx" x="357" y="846" width="167" height="48" rx="3"/>
<text class="sm" x="441" y="865" text-anchor="middle"><tspan class="r" style="font-weight:700">participatory</tspan></text>
<text class="sm" x="441" y="883" text-anchor="middle"><tspan class="r" style="font-weight:700">democracy</tspan></text>
