<div id="vis-container"><h2 class="sr-only">PESA Act of 1996 – Features</h2>
<svg class="n" width="100%" viewBox="0 0 680 1869" role="img"><title>PESA Act of 1996 – Features</title><desc>PESA Act of 1996 – Features</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="200" y="26" width="280" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">PESA Act of 1996 – Features</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Features of the Act</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Features of PESA:</tspan><tspan class="k"> The features (or the provisions) of the PESA Act are as follows:</tspan></text>
<text x="56" y="150" class="r" style="font-weight:700">1.</text>
<text x="83" y="150"><tspan class="h" style="font-weight:700">Customary law:</tspan><tspan class="k"> A state legislation on the Panchayats in the Scheduled Areas shall</tspan></text>
<text x="83" y="172"><tspan class="k">be in consonance with the</tspan><tspan class="r"> customary law, social and religious practices and</tspan></text>
<text x="83" y="194"><tspan class="r">traditional management practices</tspan><tspan class="k"> of community resources.</tspan></text>
<text x="56" y="220" class="r" style="font-weight:700">2.</text>
<text x="83" y="220"><tspan class="h" style="font-weight:700">Village as habitation:</tspan><tspan class="k"> A</tspan><tspan class="r"> village</tspan><tspan class="k"> shall ordinarily consist of a</tspan><tspan class="r"> habitation or a group of</tspan></text>
<text x="83" y="242"><tspan class="r">habitations or a hamlet</tspan><tspan class="k"> or a group of hamlets comprising a community and</tspan></text>
<text x="83" y="264"><tspan class="k">managing its affairs in accordance with traditions and customs.</tspan></text>
<text x="56" y="290" class="r" style="font-weight:700">3.</text>
<text x="83" y="290"><tspan class="h" style="font-weight:700">Gram Sabha in every village:</tspan><tspan class="k"> Every village shall have a</tspan><tspan class="r"> Gram Sabha</tspan><tspan class="k"> consisting of</tspan></text>
<text x="83" y="312"><tspan class="k">persons whose names are included in the electoral rolls for the Panchayat at the</tspan></text>
<text x="83" y="334"><tspan class="k">village level.</tspan></text>
<text x="56" y="360" class="r" style="font-weight:700">4.</text>
<text x="83" y="360"><tspan class="h" style="font-weight:700">Gram Sabha preserves culture:</tspan><tspan class="k"> Every Gram Sabha shall be competent to</tspan><tspan class="r"> safeguard</tspan></text>
<text x="83" y="382"><tspan class="r">and preserve the traditions and customs</tspan><tspan class="k"> of the people, their cultural identity,</tspan></text>
<text x="83" y="404"><tspan class="k">community resources and the customary mode of dispute resolution.</tspan></text>
<text x="56" y="430" class="r" style="font-weight:700">5.</text>
<text x="83" y="430"><tspan class="h" style="font-weight:700">Approves plans, identifies beneficiaries:</tspan><tspan class="k"> Every Gram Sabha shall— (i)</tspan><tspan class="r"> approve of</tspan></text>
<text x="83" y="452"><tspan class="r">the plans, programmes and projects</tspan><tspan class="k"> for social and economic development before</tspan></text>
<text x="83" y="474"><tspan class="k">they are taken up for implementation by the Panchayat at the village level; and</tspan></text>
<text x="83" y="496"><tspan class="k">(ii) be responsible for the</tspan><tspan class="r"> identification of beneficiaries</tspan><tspan class="k"> under the poverty</tspan></text>
<text x="83" y="518"><tspan class="k">alleviation and other programmes.</tspan></text>
<text x="56" y="544" class="r" style="font-weight:700">6.</text>
<text x="83" y="544"><tspan class="h" style="font-weight:700">Utilisation certificate:</tspan><tspan class="k"> Every Panchayat at the village level shall be required to</tspan></text>
<text x="83" y="566"><tspan class="k">obtain from the Gram Sabha a</tspan><tspan class="r"> certification of utilisation of funds</tspan><tspan class="k"> for the above</tspan></text>
<text x="83" y="588"><tspan class="k">plans, programmes and projects.</tspan></text>
<text x="56" y="614" class="r" style="font-weight:700">7.</text>
<text x="83" y="614"><tspan class="h" style="font-weight:700">ST reservation ≥ 1/2, all chairpersons:</tspan><tspan class="k"> The reservation of seats in the Scheduled</tspan></text>
<text x="83" y="636"><tspan class="k">Areas in every Panchayat shall be in proportion to the population of the</tspan></text>
<text x="83" y="658"><tspan class="k">communities for whom reservation is sought to be given under Part IX of the</tspan></text>
<text x="83" y="680"><tspan class="k">Constitution. However, the reservation for the</tspan><tspan class="r"> Scheduled Tribes shall not be less</tspan></text>
<text x="83" y="702"><tspan class="r">than one-half</tspan><tspan class="k"> of the total number of seats. Further,</tspan><tspan class="r"> all seats of Chairpersons</tspan><tspan class="k"> of</tspan></text>
<text x="83" y="724"><tspan class="k">Panchayats at all levels shall be</tspan><tspan class="r"> reserved for the Scheduled Tribes</tspan><tspan class="k">.</tspan></text>
<text x="56" y="750" class="r" style="font-weight:700">8.</text>
<text x="83" y="750"><tspan class="h" style="font-weight:700">Nomination ≤ 1/10:</tspan><tspan class="k"> The state government may</tspan><tspan class="r"> nominate</tspan><tspan class="k"> such Scheduled Tribes</tspan></text>
<text x="83" y="772"><tspan class="k">which have no representation in the Panchayat at the intermediate level or the</tspan></text>
<text x="83" y="794"><tspan class="k">Panchayat at the district level. But such nomination shall</tspan><tspan class="r"> not exceed one-tenth</tspan><tspan class="k"> of</tspan></text>
<text x="83" y="816"><tspan class="k">the total members to be elected in that Panchayat.</tspan></text>
<text x="56" y="842" class="r" style="font-weight:700">9.</text>
<text x="83" y="842"><tspan class="h" style="font-weight:700">Consultation on land acquisition:</tspan><tspan class="k"> The Gram Sabha or the Panchayats at the</tspan></text>
<text x="83" y="864"><tspan class="k">appropriate level shall be</tspan><tspan class="r"> consulted before making the acquisition of land</tspan><tspan class="k"> in the</tspan></text>
<text x="83" y="886"><tspan class="k">Scheduled Areas for development projects and before</tspan><tspan class="r"> resettling or rehabilitating</tspan></text>
<text x="83" y="908"><tspan class="k">persons affected by such projects in the Scheduled Areas. However, the actual</tspan></text>
<text x="83" y="930"><tspan class="k">planning and implementation of the projects in the Scheduled Areas shall be</tspan></text>
<text x="83" y="952"><tspan class="k">coordinated at the</tspan><tspan class="b"> state level</tspan><tspan class="k">.</tspan></text>
<text x="56" y="978" class="r" style="font-weight:700">10.</text>
<text x="83" y="978"><tspan class="h" style="font-weight:700">Minor water bodies:</tspan><tspan class="k"> Planning and management of</tspan><tspan class="r"> minor water bodies</tspan><tspan class="k"> in the</tspan></text>
<text x="83" y="1000"><tspan class="k">Scheduled Areas shall be entrusted to Panchayats at the appropriate level.</tspan></text>
<text x="56" y="1026" class="r" style="font-weight:700">11.</text>
<text x="83" y="1026"><tspan class="h" style="font-weight:700">Mining lease – recommendation mandatory:</tspan><tspan class="k"> The recommendations of the Gram</tspan></text>
<text x="83" y="1048"><tspan class="k">Sabha or the Panchayats at the appropriate level shall be</tspan><tspan class="r"> mandatory for grant of</tspan></text>
<text x="83" y="1070"><tspan class="r">prospecting licence or mining lease for minor minerals</tspan><tspan class="k"> in the Scheduled Areas.</tspan></text>
<text x="56" y="1096" class="r" style="font-weight:700">12.</text>
<text x="83" y="1096"><tspan class="h" style="font-weight:700">Auction of minor minerals:</tspan><tspan class="k"> The</tspan><tspan class="r"> prior recommendation</tspan><tspan class="k"> of the Gram Sabha or the</tspan></text>
<text x="83" y="1118"><tspan class="k">Panchayats at the appropriate level shall be mandatory for grant of</tspan><tspan class="r"> concession for</tspan></text>
<text x="83" y="1140"><tspan class="r">the exploitation of minor minerals by auction</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1166" class="r" style="font-weight:700">13.</text>
<text x="83" y="1166"><tspan class="h" style="font-weight:700">Specific powers to Gram Sabha:</tspan><tspan class="k"> While endowing Panchayats in the Scheduled</tspan></text>
<text x="83" y="1188"><tspan class="k">Areas with such powers and authority as may be necessary to enable them to</tspan></text>
<text x="83" y="1210"><tspan class="k">function as institutions of self-government, a State Legislature shall ensure that</tspan></text>
<text x="83" y="1232"><tspan class="k">the Panchayats at the appropriate level and the Gram Sabha are endowed</tspan></text>
<text x="83" y="1254"><tspan class="k">specifically with— (i) the power to</tspan><tspan class="r"> enforce prohibition</tspan><tspan class="k"> or to regulate or restrict the</tspan></text>
<text x="83" y="1276"><tspan class="k">sale and consumption of any intoxicant (ii) the</tspan><tspan class="r"> ownership of minor forest produce</tspan></text>
<text x="83" y="1298"><tspan class="k">(iii) the power to</tspan><tspan class="r"> prevent alienation of land</tspan><tspan class="k"> in the Scheduled Areas and to take</tspan></text>
<text x="83" y="1320"><tspan class="k">appropriate action to restore any unlawfully alienated land of a Scheduled Tribe</tspan></text>
<text x="83" y="1342"><tspan class="k">(iv) the power to</tspan><tspan class="r"> manage village markets</tspan><tspan class="k"> (v) the power to exercise</tspan><tspan class="r"> control over</tspan></text>
<text x="83" y="1364"><tspan class="r">money lending</tspan><tspan class="k"> to the Scheduled Tribes (vi) the power to exercise</tspan><tspan class="r"> control over</tspan></text>
<text x="83" y="1386"><tspan class="r">institutions and functionaries</tspan><tspan class="k"> in all social sectors (vii) the power to</tspan><tspan class="r"> control local</tspan></text>
<text x="83" y="1408"><tspan class="r">plans and resources</tspan><tspan class="k"> for such plans including tribal sub-plans</tspan></text>
<text x="56" y="1434" class="r" style="font-weight:700">14.</text>
<text x="83" y="1434"><tspan class="h" style="font-weight:700">No usurpation:</tspan><tspan class="k"> The State Legislations shall contain</tspan><tspan class="r"> safeguards</tspan><tspan class="k"> to ensure that</tspan></text>
<text x="83" y="1456"><tspan class="k">Panchayats at the higher level</tspan><tspan class="r"> do not assume the powers</tspan><tspan class="k"> and authority of any</tspan></text>
<text x="83" y="1478"><tspan class="k">Panchayat at the lower level or of the Gram Sabha.</tspan></text>
<text x="56" y="1504" class="r" style="font-weight:700">15.</text>
<text x="83" y="1504"><tspan class="h" style="font-weight:700">Sixth Schedule pattern:</tspan><tspan class="k"> The State Legislature shall endeavour to follow the</tspan></text>
<text x="83" y="1526"><tspan class="r">pattern of the Sixth Schedule</tspan><tspan class="k"> to the Constitution while designing the</tspan></text>
<text x="83" y="1548"><tspan class="k">administrative arrangements in the Panchayats at district levels in the Scheduled</tspan></text>
<text x="83" y="1570"><tspan class="k">Areas.</tspan></text>
<text x="56" y="1596" class="r" style="font-weight:700">16.</text>
<text x="83" y="1596"><tspan class="h" style="font-weight:700">Inconsistent laws lapse in one year:</tspan><tspan class="k"> Any provision of any law (relating to</tspan></text>
<text x="83" y="1618"><tspan class="k">Panchayats in the Scheduled Areas) which is</tspan><tspan class="r"> inconsistent</tspan><tspan class="k"> with the provisions of</tspan></text>
<text x="83" y="1640"><tspan class="k">this Act shall</tspan><tspan class="r"> cease to be in force at the expiry of one year</tspan><tspan class="k"> from the date on</tspan></text>
<text x="83" y="1662"><tspan class="k">which this Act receives the assent of the President ⁶. However, all the Panchayats</tspan></text>
<text x="83" y="1684"><tspan class="k">existing immediately before such date shall continue till the expiry of their term,</tspan></text>
<text x="83" y="1706"><tspan class="k">unless dissolved by the State Legislature sooner.</tspan></text>

<text class="xs" x="111" y="1738" text-anchor="middle"><tspan class="r">prohibition</tspan></text>

<text class="xs" x="416" y="1738" text-anchor="middle"><tspan class="r">land alienation</tspan></text>

<text class="xs" x="569" y="1738" text-anchor="middle"><tspan class="r">village markets</tspan></text>

<rect class="bx" x="243" y="1762" width="193" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="1782" text-anchor="middle"><tspan class="r">social sector institutions</tspan></text>
<rect class="bx" x="447" y="1762" width="193" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="543" y="1782" text-anchor="middle"><tspan class="r">local plans &amp; tribal sub-plans</tspan></text>
<text class="xs" x="50" y="1830"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> This Act received the assent of the President on 24 December, 1996.</tspan></text>
