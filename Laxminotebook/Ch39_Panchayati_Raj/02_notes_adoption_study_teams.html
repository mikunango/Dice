<div id="vis-container"><h2 class="sr-only">Adoption of Panchayati Raj and Study Teams</h2>
<svg class="n" width="100%" viewBox="0 0 680 1521" role="img"><title>Adoption of Panchayati Raj and Study Teams</title><desc>Adoption of Panchayati Raj and Study Teams</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="137" y="26" width="406" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Adoption of Panchayati Raj and Study Teams</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">NDC acceptance (1958):</tspan><tspan class="k"> These recommendations of the committee were accepted by</tspan></text>
<text x="56" y="116"><tspan class="k">the</tspan><tspan class="r"> National Development Council in January 1958</tspan><tspan class="k">. The council</tspan><tspan class="r"> did not insist on a single</tspan></text>
<text x="56" y="138"><tspan class="r">rigid pattern</tspan><tspan class="k"> and left it to the states to evolve their own patterns suitable to local</tspan></text>
<text x="56" y="160"><tspan class="k">conditions. But the</tspan><tspan class="b"> basic principles and broad fundamentals should be identical</tspan></text>
<text x="56" y="182"><tspan class="k">throughout the country.</tspan></text>
<text x="44" y="210"><tspan class="h" style="font-weight:700">Rajasthan first (1959):</tspan><tspan class="r"> Rajasthan was the first state</tspan><tspan class="k"> to establish Panchayati Raj. The</tspan></text>
<text x="56" y="232"><tspan class="k">scheme was inaugurated by the</tspan><tspan class="r"> prime minister on October 2, 1959</tspan><tspan class="k">, in</tspan><tspan class="r"> Nagaur district</tspan><tspan class="k">.</tspan></text>
<text x="56" y="254"><tspan class="k">Rajasthan was followed by</tspan><tspan class="r"> Andhra Pradesh</tspan><tspan class="k">, which also adopted the system in</tspan><tspan class="r"> 1959</tspan><tspan class="k">.</tspan></text>
<text x="56" y="276"><tspan class="k">Thereafter, most of the states adopted the system.</tspan></text>
<rect class="bx" x="67" y="288" width="163" height="30" rx="3"/>
<text class="sm" x="149" y="307" text-anchor="middle"><tspan class="k">Mehta report</tspan><tspan class="r"> Nov 1957</tspan></text>
<line class="ln" x1="233" y1="303" x2="253" y2="303" marker-end="url(#ah)"/>
<rect class="bx" x="256" y="288" width="114" height="30" rx="3"/>
<text class="sm" x="313" y="307" text-anchor="middle"><tspan class="k">NDC</tspan><tspan class="r"> Jan 1958</tspan></text>
<line class="ln" x1="373" y1="303" x2="393" y2="303" marker-end="url(#ah)"/>
<rect class="bx" x="396" y="288" width="217" height="30" rx="3"/>
<text class="sm" x="504" y="307" text-anchor="middle"><tspan class="k">Rajasthan – Nagaur</tspan><tspan class="r"> 2 Oct 1959</tspan></text>
<line class="ln" x1="340" y1="319" x2="340" y2="340" marker-end="url(#ah)"/>
<rect class="bx" x="264" y="342" width="152" height="30" rx="3"/>
<text class="sm" x="340" y="361" text-anchor="middle"><tspan class="k">Andhra Pradesh</tspan><tspan class="r"> 1959</tspan></text>
<text x="44" y="400"><tspan class="h" style="font-weight:700">Variations among states:</tspan><tspan class="k"> Though most of the states created Panchayati Raj institutions</tspan></text>
<text x="56" y="422"><tspan class="k">by the</tspan><tspan class="r"> mid 1960s</tspan><tspan class="k">, there were</tspan><tspan class="r"> differences</tspan><tspan class="k"> from one state to another with regard to the</tspan></text>
<text x="56" y="444"><tspan class="b">number of tiers, relative position of samiti and parishad, their tenure, composition,</tspan></text>
<text x="56" y="466"><tspan class="b">functions, finances</tspan><tspan class="k"> and so on. For example,</tspan><tspan class="r"> Rajasthan adopted the three-tier</tspan><tspan class="k"> system</tspan></text>
<text x="56" y="488"><tspan class="k">while</tspan><tspan class="r"> Tamil Nadu adopted the two-tier</tspan><tspan class="k"> system.</tspan><tspan class="r"> West Bengal</tspan><tspan class="k">, on the other hand, adopted</tspan></text>
<text x="56" y="510"><tspan class="k">the</tspan><tspan class="r"> four-tier</tspan><tspan class="k"> system. Further, in the</tspan><tspan class="r"> Rajasthan–Andhra Pradesh pattern</tspan><tspan class="k">,</tspan><tspan class="b"> panchayat</tspan></text>
<text x="56" y="532"><tspan class="b">samiti was powerful</tspan><tspan class="k"> as the block was the unit of planning and development, while in</tspan></text>
<text x="56" y="554"><tspan class="r">Maharashtra–Gujarat pattern</tspan><tspan class="k">,</tspan><tspan class="b"> zila parishad was powerful</tspan><tspan class="k"> as the district was the unit of</tspan></text>
<text x="56" y="576"><tspan class="k">planning and development. Some states also established</tspan><tspan class="r"> nyaya panchayats</tspan><tspan class="k">, that is,</tspan></text>
<text x="56" y="598"><tspan class="b">judicial panchayats</tspan><tspan class="k"> to try petty civil and criminal cases.</tspan></text>
<rect class="bx" x="46" y="612" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="630" text-anchor="middle"><tspan class="r" style="font-weight:700">Rajasthan–AP pattern</tspan></text>
<line class="ln" x1="190" y1="640" x2="190" y2="654" marker-end="url(#ah)"/>
<text class="sm" x="190" y="675" text-anchor="middle"><tspan class="k">block = unit</tspan></text>
<text class="sm" x="190" y="697" text-anchor="middle"><tspan class="r">samiti powerful</tspan></text>
<rect class="bx" x="346" y="612" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="630" text-anchor="middle"><tspan class="r" style="font-weight:700">Maharashtra–Gujarat pattern</tspan></text>
<line class="ln" x1="490" y1="640" x2="490" y2="654" marker-end="url(#ah)"/>
<text class="sm" x="490" y="675" text-anchor="middle"><tspan class="k">district = unit</tspan></text>
<text class="sm" x="490" y="697" text-anchor="middle"><tspan class="r">zila parishad powerful</tspan></text>

<text x="44" y="764"><tspan class="h" style="font-weight:700">Study teams since 1960:</tspan><tspan class="k"> Since</tspan><tspan class="r"> 1960</tspan><tspan class="k">, many</tspan><tspan class="r"> study teams, committees and working groups</tspan></text>
<text x="56" y="786"><tspan class="k">have been appointed to examine the various aspects of functioning of Panchayati Raj</tspan></text>
