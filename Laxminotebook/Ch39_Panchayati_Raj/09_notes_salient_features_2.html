<div id="vis-container"><h2 class="sr-only">73rd Amendment Act – Salient Features II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1976" role="img"><title>73rd Amendment Act – Salient Features II</title><desc>73rd Amendment Act – Salient Features II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="146" y="26" width="387" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">73rd Amendment Act – Salient Features II</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Duration of Panchayats:</tspan><tspan class="k"> The act provides for a</tspan><tspan class="r"> five-year term</tspan><tspan class="k"> of office to the</tspan></text>
<text x="56" y="116"><tspan class="k">panchayat at every level from the date of it’s first meeting. However, it</tspan><tspan class="r"> can be dissolved</tspan></text>
<text x="56" y="138"><tspan class="k">before the completion of its term. Further, fresh elections to constitute a panchayat</tspan></text>
<text x="56" y="160"><tspan class="k">shall be completed (a)</tspan><tspan class="b"> before the expiry of its duration of five years</tspan><tspan class="k">; or (b) in case of</tspan></text>
<text x="56" y="182"><tspan class="k">dissolution,</tspan><tspan class="r"> before the expiry of a period of six months</tspan><tspan class="k"> from the date of its dissolution.</tspan></text>
<text x="44" y="210"><tspan class="h" style="font-weight:700">No election if &lt; 6 months left:</tspan><tspan class="k"> But, where the</tspan><tspan class="r"> remainder of the period</tspan><tspan class="k"> (for which the</tspan></text>
<text x="56" y="232"><tspan class="k">dissolved panchayat would have continued) is</tspan><tspan class="r"> less than six months</tspan><tspan class="k">, it shall</tspan><tspan class="r"> not be</tspan></text>
<text x="56" y="254"><tspan class="r">necessary to hold any election</tspan><tspan class="k"> for constituting the new panchayat for such period.</tspan></text>
<text x="44" y="282"><tspan class="h" style="font-weight:700">Reconstituted – remainder only:</tspan><tspan class="k"> Moreover, a panchayat constituted upon the dissolution</tspan></text>
<text x="56" y="304"><tspan class="k">of a panchayat before the expiration of its duration shall continue</tspan><tspan class="r"> only for the remainder</tspan></text>
<text x="56" y="326"><tspan class="r">of the period</tspan><tspan class="k"> for which the dissolved panchayat would have continued had it not been so</tspan></text>
<text x="56" y="348"><tspan class="k">dissolved. In other words, a panchayat reconstituted after premature dissolution</tspan><tspan class="b"> does not</tspan></text>
<text x="56" y="370"><tspan class="b">enjoy the full period of five years</tspan><tspan class="k"> but remains in office only for the remainder of the</tspan></text>
<text x="56" y="392"><tspan class="k">period.</tspan></text>
<rect class="bx" x="119" y="404" width="99" height="30" rx="3"/>
<text class="sm" x="169" y="423" text-anchor="middle"><tspan class="k">5-year term</tspan></text>
<line class="ln" x1="222" y1="419" x2="242" y2="419" marker-end="url(#ah)"/>
<rect class="bx" x="245" y="404" width="112" height="30" rx="3"/>
<text class="sm" x="301" y="423" text-anchor="middle"><tspan class="k">dissolved early</tspan></text>
<line class="ln" x1="360" y1="419" x2="380" y2="419" marker-end="url(#ah)"/>
<rect class="bx" x="383" y="404" width="178" height="30" rx="3"/>
<text class="sm" x="472" y="423" text-anchor="middle"><tspan class="k">election within</tspan><tspan class="r"> 6 months</tspan></text>
<line class="ln" x1="340" y1="435" x2="340" y2="456" marker-end="url(#ah)"/>
<rect class="bx" x="250" y="458" width="180" height="30" rx="3"/>
<text class="sm" x="340" y="477" text-anchor="middle"><tspan class="k">new body:</tspan><tspan class="r"> remainder only</tspan></text>
<line x1="98" y1="546" x2="259" y2="546" stroke="#D93A3A" stroke-width="1.6"/>
<line x1="259" y1="546" x2="421" y2="546" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="340" y="539" text-anchor="middle"><tspan class="k">within</tspan><tspan class="r"> 6 months</tspan></text>
<line x1="421" y1="546" x2="582" y2="546" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="501" y="539" text-anchor="middle"><tspan class="r">only the remainder</tspan></text>
<circle cx="98" cy="546" r="5" fill="#2F6FDB"/>
<text class="xs" x="98" y="568" text-anchor="middle"><tspan class="k">first meeting</tspan></text>
<circle cx="259" cy="546" r="5" fill="#2F6FDB"/>
<text class="xs" x="259" y="568" text-anchor="middle"><tspan class="k">premature</tspan></text>
<text class="xs" x="259" y="585" text-anchor="middle"><tspan class="k">dissolution</tspan></text>
<circle cx="421" cy="546" r="5" fill="#2F6FDB"/>
<text class="xs" x="421" y="568" text-anchor="middle"><tspan class="k">fresh election</tspan></text>
<circle cx="582" cy="546" r="5" fill="#2F6FDB"/>
<text class="xs" x="582" y="568" text-anchor="middle"><tspan class="k">original 5-year</tspan></text>
<text class="xs" x="582" y="585" text-anchor="middle"><tspan class="k">term ends</tspan></text>
<text class="xs" x="340" y="614" text-anchor="middle"><tspan class="b">if the remainder is less than six months, no election is necessary for that period</tspan></text>
<text x="44" y="647"><tspan class="h" style="font-weight:700">Disqualifications:</tspan><tspan class="k"> A person shall be disqualified for being chosen as or for being a</tspan></text>
<text x="56" y="669"><tspan class="k">member of panchayat if he/she is so disqualified, (a) under any law for the time being</tspan></text>
<text x="56" y="691"><tspan class="k">in force for the purpose of</tspan><tspan class="b"> elections to the legislature of the state</tspan><tspan class="k"> concerned, or (b)</tspan></text>
<text x="56" y="713"><tspan class="k">under any</tspan><tspan class="b"> law made by the state legislature</tspan><tspan class="k">. However, no person shall be disqualified on</tspan></text>
<text x="56" y="735"><tspan class="k">the ground that he/she is less than 25 years of age if he/she has attained the</tspan><tspan class="r"> age of 21</tspan></text>
<text x="56" y="757"><tspan class="r">years</tspan><tspan class="k">. Further, all questions of disqualifications shall be referred to such authority as the</tspan></text>
<text x="56" y="779"><tspan class="r">state legislature determines</tspan><tspan class="k">.</tspan></text>
<text x="44" y="807"><tspan class="h" style="font-weight:700">State Election Commission:</tspan><tspan class="k"> The superintendence, direction and control of the</tspan></text>
<text x="56" y="829"><tspan class="k">preparation of electoral rolls and the conduct of all elections to the panchayats shall be</tspan></text>
<text x="56" y="851"><tspan class="k">vested in the</tspan><tspan class="r"> state election commission</tspan><tspan class="k">. It consists of a</tspan><tspan class="r"> state election commissioner</tspan><tspan class="k"> to</tspan></text>
<text x="56" y="873"><tspan class="k">be</tspan><tspan class="r"> appointed by the governor</tspan><tspan class="k">. His/her conditions of service and tenure of office shall also</tspan></text>
<text x="56" y="895"><tspan class="k">be determined by the governor. He/she shall</tspan><tspan class="r"> not be removed</tspan><tspan class="k"> from the office except in</tspan></text>
<text x="56" y="917"><tspan class="k">the manner and on the grounds prescribed for the</tspan><tspan class="r"> removal of a judge of the state high</tspan></text>
<text x="56" y="939"><tspan class="r">court</tspan><tspan class="k"> ³. His/her conditions of service shall</tspan><tspan class="b"> not be varied to his/her disadvantage</tspan><tspan class="k"> after</tspan></text>
<text x="56" y="961"><tspan class="k">his/her appointment.</tspan></text>
<text x="44" y="989"><tspan class="h" style="font-weight:700">Election law by state:</tspan><tspan class="k"> The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> may make provision with respect to all</tspan></text>
<text x="56" y="1011"><tspan class="k">matters relating to</tspan><tspan class="r"> elections to the panchayats</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1039"><tspan class="h" style="font-weight:700">Powers and Functions:</tspan><tspan class="k"> The state legislature may endow the Panchayats with such</tspan></text>
<text x="56" y="1061"><tspan class="k">powers and authority as may be necessary to enable them to function as</tspan><tspan class="r"> institutions of</tspan></text>
<text x="56" y="1083"><tspan class="r">self-government</tspan><tspan class="k">. Such a scheme may contain provisions for the</tspan><tspan class="r"> devolution of powers and</tspan></text>
<text x="56" y="1105"><tspan class="r">responsibilities</tspan><tspan class="k"> upon Panchayats at the appropriate level with respect to (a) the</tspan></text>
<text x="56" y="1127"><tspan class="b">preparation of plans for economic development and social justice</tspan><tspan class="k"> and (b) the</tspan></text>
<text x="56" y="1149"><tspan class="b">implementation of schemes for economic development and social justice</tspan><tspan class="k"> as may be</tspan></text>
<text x="56" y="1171"><tspan class="k">entrusted to them, including those in relation to the</tspan><tspan class="r"> 29 matters listed in the Eleventh</tspan></text>
<text x="56" y="1193"><tspan class="r">Schedule</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1221"><tspan class="h" style="font-weight:700">Finances:</tspan><tspan class="k"> The state legislature may (a)</tspan><tspan class="r"> authorise a panchayat to levy, collect and</tspan></text>
<text x="56" y="1243"><tspan class="r">appropriate</tspan><tspan class="k"> taxes, duties, tolls and fees; (b)</tspan><tspan class="r"> assign to a panchayat</tspan><tspan class="k"> taxes, duties, tolls</tspan></text>
<text x="56" y="1265"><tspan class="k">and fees levied and collected by the state government; (c) provide for making</tspan></text>
<text x="56" y="1287"><tspan class="r">grants-in-aid</tspan><tspan class="k"> to the panchayats from the consolidated fund of the state; and (d)</tspan></text>
<text x="56" y="1309"><tspan class="k">provide for</tspan><tspan class="r"> constitution of funds</tspan><tspan class="k"> for crediting all moneys of the panchayats.</tspan></text>
<line class="ln" x1="340" y1="1315" x2="340" y2="1327"/>
<line class="ln" x1="115" y1="1327" x2="565" y2="1327"/>
<line class="ln" x1="115" y1="1327" x2="115" y2="1343" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1327" x2="265" y2="1343" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1327" x2="415" y2="1343" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1327" x2="565" y2="1343" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1363" text-anchor="middle"><tspan class="r">own taxes</tspan></text>
<text class="sm" x="265" y="1363" text-anchor="middle"><tspan class="r">assigned taxes</tspan></text>
<text class="sm" x="415" y="1363" text-anchor="middle"><tspan class="r">grants-in-aid</tspan></text>
<text class="sm" x="565" y="1363" text-anchor="middle"><tspan class="r">panchayat funds</tspan></text>
<text x="44" y="1395"><tspan class="h" style="font-weight:700">Finance Commission:</tspan><tspan class="k"> The</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state shall,</tspan><tspan class="r"> after every five years</tspan><tspan class="k">, constitute a</tspan></text>
<text x="56" y="1417"><tspan class="r">finance commission</tspan><tspan class="k"> to review the financial position of the panchayats. It shall make the</tspan></text>
<text x="56" y="1439"><tspan class="k">following recommendations to the Governor:</tspan></text>
<text x="56" y="1465" class="r" style="font-weight:700">1.</text>
<text x="78" y="1465"><tspan class="h" style="font-weight:700">Principles of devolution:</tspan><tspan class="k"> The principles that should govern: (a) The</tspan><tspan class="r"> distribution</tspan></text>
<text x="78" y="1487"><tspan class="r">between the state and the panchayats</tspan><tspan class="k"> of the net proceeds of the taxes, duties,</tspan></text>
<text x="78" y="1509"><tspan class="k">tolls and fees levied by the state and allocation of shares amongst the panchayats</tspan></text>
<text x="78" y="1531"><tspan class="k">at all levels. (b) The</tspan><tspan class="r"> determination of taxes</tspan><tspan class="k">, duties, tolls and fees that may be</tspan></text>
<text x="78" y="1553"><tspan class="k">assigned to the panchayats. (c) The</tspan><tspan class="r"> grants-in-aid</tspan><tspan class="k"> to the panchayats from the</tspan></text>
<text x="78" y="1575"><tspan class="k">consolidated fund of the state.</tspan></text>
<text x="56" y="1601" class="r" style="font-weight:700">2.</text>
<text x="78" y="1601"><tspan class="h" style="font-weight:700">Improve finances:</tspan><tspan class="k"> The</tspan><tspan class="r"> measures needed to improve the financial position</tspan><tspan class="k"> of the</tspan></text>
<text x="78" y="1623"><tspan class="k">panchayats.</tspan></text>
<text x="56" y="1649" class="r" style="font-weight:700">3.</text>
<text x="78" y="1649"><tspan class="h" style="font-weight:700">Other matters:</tspan><tspan class="k"> Any other matter referred to it by the governor in the interests of</tspan></text>
<text x="78" y="1671"><tspan class="r">sound finance</tspan><tspan class="k"> of the panchayats.</tspan></text>
<path d="M50 1445 L44 1445 L44 1677 L50 1677" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1699"><tspan class="h" style="font-weight:700">Composition by state law:</tspan><tspan class="k"> The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> may provide for the</tspan><tspan class="r"> composition of the</tspan></text>
<text x="56" y="1721"><tspan class="r">commission</tspan><tspan class="k">, the required qualifications of its members and the manner of their selection.</tspan></text>
<text x="44" y="1749"><tspan class="h" style="font-weight:700">Action taken report:</tspan><tspan class="k"> The</tspan><tspan class="r"> governor shall place the recommendations</tspan><tspan class="k"> of the commission</tspan></text>
<text x="56" y="1771"><tspan class="k">along with the</tspan><tspan class="r"> action taken report</tspan><tspan class="k"> before the state legislature.</tspan></text>
<text x="44" y="1799"><tspan class="h" style="font-weight:700">Central Finance Commission role:</tspan><tspan class="k"> The</tspan><tspan class="r"> Central Finance Commission</tspan><tspan class="k"> shall also suggest</tspan></text>
<text x="56" y="1821"><tspan class="k">the measures needed to</tspan><tspan class="r"> augment the consolidated fund of a state</tspan><tspan class="k"> to supplement the</tspan></text>
<text x="56" y="1843"><tspan class="k">resources of the panchayats in the states (</tspan><tspan class="b">on the basis of the recommendations made</tspan></text>
<text x="56" y="1865"><tspan class="b">by the finance commission of the state</tspan><tspan class="k">).</tspan></text>
<text class="xs" x="50" y="1901"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> A judge of a high court can be removed from his/her office by the President on the</tspan></text>
<text class="xs" x="50" y="1919"><tspan class="k">recommendation of the Parliament. This means that a state election commissioner cannot be</tspan></text>
<text class="xs" x="50" y="1937"><tspan class="k">removed by the governor, though appointed by him/her.</tspan></text>
