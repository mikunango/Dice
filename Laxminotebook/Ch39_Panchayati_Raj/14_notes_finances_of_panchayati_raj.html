<div id="vis-container"><h2 class="sr-only">Finances of Panchayati Raj</h2>
<svg class="n" width="100%" viewBox="0 0 680 1443" role="img"><title>Finances of Panchayati Raj</title><desc>Finances of Panchayati Raj</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="206" y="26" width="267" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Finances of Panchayati Raj</text>
<text class="lb" x="40" y="98">Finances of Panchayati Raj</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">2nd ARC on PRI finances:</tspan><tspan class="k"> The</tspan><tspan class="r"> Second Administrative Reforms Commission</tspan><tspan class="k"> of India</tspan></text>
<text x="56" y="150"><tspan class="k">(2005–2009) has summarized the</tspan><tspan class="r"> sources of revenue</tspan><tspan class="k"> of the Panchayati Raj Institutions</tspan></text>
<text x="56" y="172"><tspan class="k">(PRIs) and their</tspan><tspan class="r"> financial problems</tspan><tspan class="k"> in the following way⁷:</tspan></text>
<text x="56" y="198" class="r" style="font-weight:700">1.</text>
<text x="78" y="198"><tspan class="h" style="font-weight:700">Sources of funds:</tspan><tspan class="k"> A major portion of Part IX of the Constitution deals with</tspan></text>
<text x="78" y="220"><tspan class="r">structural empowerment</tspan><tspan class="k"> of the PRIs but the real strength in terms of both</tspan></text>
<text x="78" y="242"><tspan class="b">autonomy and efficiency</tspan><tspan class="k"> of these institutions is dependent on their</tspan><tspan class="r"> financial</tspan></text>
<text x="78" y="264"><tspan class="r">position</tspan><tspan class="k"> (including their capacity to generate own resources). In general, Panchayats</tspan></text>
<text x="78" y="286"><tspan class="k">in our country receive funds in the following ways: (i)</tspan><tspan class="r"> Grants from the Union</tspan></text>
<text x="78" y="308"><tspan class="r">Government</tspan><tspan class="k"> based on the recommendations of the</tspan><tspan class="b"> Central Finance Commission</tspan><tspan class="k"> as</tspan></text>
<text x="78" y="330"><tspan class="k">per</tspan><tspan class="r"> Article 280</tspan><tspan class="k"> of the Constitution. (ii)</tspan><tspan class="r"> Devolution from the State Government</tspan></text>
<text x="78" y="352"><tspan class="k">based on the recommendations of the</tspan><tspan class="b"> State Finance Commission</tspan><tspan class="k"> as per</tspan><tspan class="r"> Article</tspan></text>
<text x="78" y="374"><tspan class="r">243-I</tspan><tspan class="k">. (iii)</tspan><tspan class="r"> Loans / grants</tspan><tspan class="k"> from the State Government. (iv)</tspan><tspan class="r"> Programme-specific</tspan></text>
<text x="78" y="396"><tspan class="r">allocation</tspan><tspan class="k"> under Centrally Sponsored Schemes and Additional Central Assistance. (v)</tspan></text>
<text x="78" y="418"><tspan class="r">Internal Resource Generation</tspan><tspan class="k"> (tax and non-tax).</tspan></text>
<text x="56" y="444" class="r" style="font-weight:700">2.</text>
<text x="78" y="444"><tspan class="h" style="font-weight:700">Weak fiscal empowerment:</tspan><tspan class="k"> Across the country, States have</tspan><tspan class="r"> not given adequate</tspan></text>
<text x="78" y="466"><tspan class="r">attention to fiscal empowerment</tspan><tspan class="k"> of the Panchayats. The Panchayats own resources</tspan></text>
<text x="78" y="488"><tspan class="k">are</tspan><tspan class="r"> meager</tspan><tspan class="k">.</tspan><tspan class="b"> Kerala, Karnataka and Tamil Nadu</tspan><tspan class="k"> are the states which are considered</tspan></text>
<text x="78" y="510"><tspan class="k">to be progressive in PRIs empowerment but even there, the Panchayats are</tspan><tspan class="r"> heavily</tspan></text>
<text x="78" y="532"><tspan class="r">dependent on government grants</tspan><tspan class="k">. One can draw the following broad conclusions: (i)</tspan></text>
<text x="78" y="554"><tspan class="r">Internal resource generation</tspan><tspan class="k"> at the Panchayat level is</tspan><tspan class="r"> weak</tspan><tspan class="k">. This is partly due to a</tspan></text>
<text x="78" y="576"><tspan class="b">thin tax domain</tspan><tspan class="k"> and partly due to Panchayats own</tspan><tspan class="b"> reluctance in collecting revenue</tspan><tspan class="k">.</tspan></text>
<text x="78" y="598"><tspan class="k">(ii) Panchayats are</tspan><tspan class="r"> heavily dependent on grants</tspan><tspan class="k"> from Union and State</tspan></text>
<text x="78" y="620"><tspan class="k">Governments. (iii) A major portion of the grants both from Union as well as the</tspan></text>
<text x="78" y="642"><tspan class="k">State Governments is</tspan><tspan class="r"> scheme specific</tspan><tspan class="k">. Panchayats have</tspan><tspan class="b"> limited discretion and</tspan></text>
<text x="78" y="664"><tspan class="b">flexibility</tspan><tspan class="k"> in incurring expenditure. (iv) In view of their own tight fiscal position,</tspan></text>
<text x="78" y="686"><tspan class="k">State Governments are</tspan><tspan class="r"> not keen to devolve funds</tspan><tspan class="k"> to Panchayats. (v) In most of</tspan></text>
<text x="78" y="708"><tspan class="k">the critical Eleventh Schedule matters like</tspan><tspan class="b"> primary education, healthcare, water</tspan></text>
<text x="78" y="730"><tspan class="b">supply, sanitation and minor irrigation</tspan><tspan class="k"> even now, it is the</tspan><tspan class="r"> State Government which</tspan></text>
<text x="78" y="752"><tspan class="r">is directly responsible</tspan><tspan class="k"> for implementation of these programmes and hence</tspan></text>
<text x="78" y="774"><tspan class="k">expenditure. (vi) Overall, a situation has been created where Panchayats have</tspan></text>
<text x="78" y="796"><tspan class="r">responsibility but grossly inadequate resources</tspan><tspan class="k">.</tspan></text>
<text x="56" y="822" class="r" style="font-weight:700">3.</text>
<text x="78" y="822"><tspan class="h" style="font-weight:700">Own resources – the soul:</tspan><tspan class="k"> Though, in absolute terms, the quantum of funds the</tspan></text>
<text x="78" y="844"><tspan class="k">Union/State Government transfers to a Panchayat forms the major component of</tspan></text>
<text x="78" y="866"><tspan class="k">its receipt, the</tspan><tspan class="r"> PRI’s own resource generation is the soul</tspan><tspan class="k"> behind its financial</tspan></text>
<text x="78" y="888"><tspan class="k">standing. It is not only a question of resources; it is the existence of a</tspan><tspan class="r"> local</tspan></text>
<text x="78" y="910"><tspan class="r">taxation system</tspan><tspan class="k"> which ensures</tspan><tspan class="b"> people’s involvement</tspan><tspan class="k"> in the affairs of an elected</tspan></text>
<text x="78" y="932"><tspan class="k">body. It also makes the institution</tspan><tspan class="r"> accountable to its citizens</tspan><tspan class="k">.</tspan></text>
<text x="56" y="958" class="r" style="font-weight:700">4.</text>
<text x="78" y="958"><tspan class="h" style="font-weight:700">Gram Panchayats better placed:</tspan><tspan class="k"> In terms of own resource collection, the</tspan><tspan class="r"> Gram</tspan></text>
<text x="78" y="980"><tspan class="r">Panchayats are comparatively in a better position</tspan><tspan class="k"> because they have a</tspan><tspan class="r"> tax domain</tspan></text>
<text x="78" y="1002"><tspan class="r">of their own</tspan><tspan class="k">, while the other two tiers are dependent only on</tspan><tspan class="b"> tolls, fees and</tspan></text>
<text x="78" y="1024"><tspan class="b">non-tax revenue</tspan><tspan class="k"> for generating internal resources.</tspan></text>
<text x="56" y="1050" class="r" style="font-weight:700">5.</text>
<text x="78" y="1050"><tspan class="h" style="font-weight:700">Taxation mostly with village level:</tspan><tspan class="k"> State Panchayati Raj Acts have given</tspan><tspan class="r"> most of</tspan></text>
<text x="78" y="1072"><tspan class="r">the taxation powers to Village Panchayats</tspan><tspan class="k">. The revenue domain of the intermediate</tspan></text>
<text x="78" y="1094"><tspan class="k">and District Panchayats (both tax as well as non-tax) has been kept</tspan><tspan class="r"> much smaller</tspan></text>
<text x="78" y="1116"><tspan class="k">and remains confined to secondary areas like</tspan><tspan class="b"> ferry services, markets, water and</tspan></text>
<text x="78" y="1138"><tspan class="b">conservancy services, registration of vehicles, cess on stamp duty</tspan><tspan class="k"> and a few others.</tspan></text>
<text x="56" y="1164" class="r" style="font-weight:700">6.</text>
<text x="78" y="1164"><tspan class="h" style="font-weight:700">Village Panchayat taxes:</tspan><tspan class="k"> A study of various State Legislations indicates that a</tspan></text>
<text x="78" y="1186"><tspan class="k">number of taxes, duties, tolls and fees come under the jurisdiction of the</tspan><tspan class="r"> Village</tspan></text>
<text x="78" y="1208"><tspan class="r">Panchayats</tspan><tspan class="k">. These interalia include</tspan><tspan class="b"> property/house tax, profession tax, land tax/cess,</tspan></text>
<text x="78" y="1230"><tspan class="b">taxes/tolls on vehicles, entertainment tax/fees, license fees, tax on non-agriculture</tspan></text>
<text x="78" y="1252"><tspan class="b">land, fee on registration of cattle, sanitation/drainage/conservancy tax, water rate/</tspan></text>
<text x="78" y="1274"><tspan class="b">tax, lighting rate/tax, education cess and tax on fairs and festivals</tspan><tspan class="k">.</tspan></text>
