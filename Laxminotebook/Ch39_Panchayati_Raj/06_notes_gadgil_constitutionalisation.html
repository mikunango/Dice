<div id="vis-container"><h2 class="sr-only">Gadgil Committee and Constitutionalisation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1433" role="img"><title>Gadgil Committee and Constitutionalisation</title><desc>Gadgil Committee and Constitutionalisation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="145" y="26" width="391" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Gadgil Committee and Constitutionalisation</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Gadgil Committee</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Gadgil Committee (1988):</tspan><tspan class="k"> The</tspan><tspan class="r"> Committee on Policy and Programmes</tspan><tspan class="k"> was constituted in</tspan></text>
<text x="56" y="146"><tspan class="r">1988</tspan><tspan class="k"> by the</tspan><tspan class="r"> Congress party</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> V.N. Gadgil</tspan><tspan class="k">. This committee was</tspan></text>
<text x="56" y="168"><tspan class="k">asked to consider the question of “</tspan><tspan class="b">how best Panchayati Raj institutions could be made</tspan></text>
<text x="56" y="190"><tspan class="b">effective</tspan><tspan class="k">”. In this context, the committee made the following recommendations:</tspan></text>
<text x="56" y="216" class="r" style="font-weight:700">1.</text>
<text x="78" y="216"><tspan class="h" style="font-weight:700">Constitutional status:</tspan><tspan class="k"> A</tspan><tspan class="r"> constitutional status</tspan><tspan class="k"> should be bestowed on the</tspan></text>
<text x="78" y="238"><tspan class="k">Panchayati Raj institutions.</tspan></text>
<text x="56" y="264" class="r" style="font-weight:700">2.</text>
<text x="78" y="264"><tspan class="h" style="font-weight:700">Three-tier:</tspan><tspan class="k"> A</tspan><tspan class="r"> three-tier system</tspan><tspan class="k"> of Panchayati Raj with panchayats at the village,</tspan></text>
<text x="78" y="286"><tspan class="k">block and district levels.</tspan></text>
<text x="56" y="312" class="r" style="font-weight:700">3.</text>
<text x="78" y="312"><tspan class="h" style="font-weight:700">Five-year term:</tspan><tspan class="k"> The term of Panchayati Raj institutions should be fixed at</tspan><tspan class="r"> five</tspan></text>
<text x="78" y="334"><tspan class="r">years</tspan><tspan class="k">.</tspan></text>
<text x="56" y="360" class="r" style="font-weight:700">4.</text>
<text x="78" y="360"><tspan class="h" style="font-weight:700">Direct elections:</tspan><tspan class="k"> The members of the Panchayats at all the three levels should be</tspan></text>
<text x="78" y="382"><tspan class="r">directly elected</tspan><tspan class="k">.</tspan></text>
<text x="56" y="408" class="r" style="font-weight:700">5.</text>
<text x="78" y="408"><tspan class="h" style="font-weight:700">Reservation:</tspan><tspan class="r"> Reservation for SCs, STs and women</tspan><tspan class="k">.</tspan></text>
<text x="56" y="434" class="r" style="font-weight:700">6.</text>
<text x="78" y="434"><tspan class="h" style="font-weight:700">Planning role – list of subjects:</tspan><tspan class="k"> The Panchayati Raj bodies should have the</tspan></text>
<text x="78" y="456"><tspan class="k">responsibility of</tspan><tspan class="r"> preparation and implementation of plans</tspan><tspan class="k"> for socio-economic</tspan></text>
<text x="78" y="478"><tspan class="k">development. For this purpose, a</tspan><tspan class="r"> list of subjects should be specified in the</tspan></text>
<text x="78" y="500"><tspan class="r">constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="526" class="r" style="font-weight:700">7.</text>
<text x="78" y="526"><tspan class="h" style="font-weight:700">Taxation powers:</tspan><tspan class="k"> The Panchayat Raj bodies should be empowered to</tspan><tspan class="r"> levy, collect</tspan></text>
<text x="78" y="548"><tspan class="r">and appropriate taxes</tspan><tspan class="k"> and duties.</tspan></text>
<text x="56" y="574" class="r" style="font-weight:700">8.</text>
<text x="78" y="574"><tspan class="h" style="font-weight:700">State Finance Commission:</tspan><tspan class="k"> Establishment of a</tspan><tspan class="r"> State Finance Commission</tspan><tspan class="k"> for the</tspan></text>
<text x="78" y="596"><tspan class="k">allocation of finances to the Panchayats.</tspan></text>
<text x="56" y="622" class="r" style="font-weight:700">9.</text>
<text x="78" y="622"><tspan class="h" style="font-weight:700">State Election Commission:</tspan><tspan class="k"> Establishment of a</tspan><tspan class="r"> State Election Commission</tspan><tspan class="k"> for the</tspan></text>
<text x="78" y="644"><tspan class="k">conduction of elections to the panchayats.</tspan></text>
<path d="M50 196 L44 196 L44 650 L50 650" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="672"><tspan class="h" style="font-weight:700">Basis of the amendment bill:</tspan><tspan class="k"> The above recommendations of the</tspan><tspan class="r"> Gadgil Committee</tspan></text>
<text x="56" y="694"><tspan class="k">became the</tspan><tspan class="r"> basis for drafting an amendment bill</tspan><tspan class="k"> aimed at conferring the constitutional</tspan></text>
<text x="56" y="716"><tspan class="k">status and protection to the Panchayati Raj institutions.</tspan></text>
<text class="lb" x="40" y="748">Constitutionalisation</text>
<text x="44" y="778"><tspan class="h" style="font-weight:700">Rajiv Gandhi Government:</tspan><tspan class="k"> The Rajiv Gandhi Government introduced the</tspan><tspan class="r"> 64th</tspan></text>
<text x="56" y="800"><tspan class="r">Constitutional Amendment Bill</tspan><tspan class="k"> in the Lok Sabha in</tspan><tspan class="r"> July 1989</tspan><tspan class="k"> to constitutionalise</tspan></text>
<text x="56" y="822"><tspan class="k">panchayati raj institutions and make them more powerful and broad based. Although, the</tspan></text>
<text x="56" y="844"><tspan class="b">Lok Sabha passed the bill in August 1989</tspan><tspan class="k">, it was</tspan><tspan class="r"> not approved by the Rajya Sabha</tspan><tspan class="k">. The</tspan></text>
<text x="56" y="866"><tspan class="k">bill was vehemently opposed by the Opposition on the ground that it sought to</tspan></text>
<text x="56" y="888"><tspan class="b">strengthen centralisation</tspan><tspan class="k"> in the federal system.</tspan></text>
<text x="44" y="916"><tspan class="h" style="font-weight:700">V.P. Singh Government:</tspan><tspan class="k"> The</tspan><tspan class="r"> National Front Government</tspan><tspan class="k">, soon after assuming office in</tspan></text>
<text x="56" y="938"><tspan class="r">November 1989</tspan><tspan class="k"> under the Prime Ministership of V.P. Singh, announced that it would take</tspan></text>
<text x="56" y="960"><tspan class="k">steps to strengthen the panchayati raj institutions. In</tspan><tspan class="r"> June 1990</tspan><tspan class="k">, a two-day</tspan><tspan class="r"> conference</tspan></text>
<text x="56" y="982"><tspan class="r">of the state chief ministers</tspan><tspan class="k"> under the chairmanship of V.P. Singh was held to discuss</tspan></text>
<text x="56" y="1004"><tspan class="k">the issues relating to the strengthening of the panchayati raj bodies. The conference</tspan></text>
<text x="56" y="1026"><tspan class="k">approved the proposals for the introduction of a fresh constitutional amendment bill.</tspan></text>
<text x="56" y="1048"><tspan class="k">Consequently, a constitutional amendment bill was introduced in the Lok Sabha in</tspan></text>
<text x="56" y="1070"><tspan class="r">September 1990</tspan><tspan class="k">. However, the</tspan><tspan class="r"> fall of the government resulted in the lapse of the bill</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1098"><tspan class="h" style="font-weight:700">Narasimha Rao Government:</tspan><tspan class="k"> The Congress Government under the prime ministership of</tspan></text>
<text x="56" y="1120"><tspan class="r">P.V. Narasimha Rao</tspan><tspan class="k"> once again considered the matter of the constitutionalisation of</tspan></text>
<text x="56" y="1142"><tspan class="k">panchayati raj bodies. It drastically modified the proposals in this regard to</tspan><tspan class="b"> delete the</tspan></text>
<text x="56" y="1164"><tspan class="b">controversial aspects</tspan><tspan class="k"> and introduced a constitutional amendment bill in the Lok sabha in</tspan></text>
<text x="56" y="1186"><tspan class="r">September, 1991</tspan><tspan class="k">. This bill finally emerged as the</tspan><tspan class="r"> 73rd Constitutional Amendment Act,</tspan></text>
<text x="56" y="1208"><tspan class="r">1992</tspan><tspan class="k"> and came into force on</tspan><tspan class="r"> 24 April, 1993¹</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="127" y="1220" width="202" height="30" rx="3"/>
<text class="sm" x="228" y="1239" text-anchor="middle"><tspan class="r">64th Bill</tspan><tspan class="k"> 1989 – failed in RS</tspan></text>
<line class="ln" x1="333" y1="1235" x2="353" y2="1235" marker-end="url(#ah)"/>
<rect class="bx" x="356" y="1220" width="197" height="30" rx="3"/>
<text class="sm" x="454" y="1239" text-anchor="middle"><tspan class="k">V.P. Singh bill</tspan><tspan class="r"> 1990</tspan><tspan class="k"> – lapsed</tspan></text>
<line class="ln" x1="340" y1="1251" x2="340" y2="1272" marker-end="url(#ah)"/>
<rect class="bx" x="113" y="1274" width="168" height="48" rx="3"/>
<text class="sm" x="197" y="1302" text-anchor="middle"><tspan class="k">Narasimha Rao bill</tspan><tspan class="r"> 1991</tspan></text>
<line class="ln" x1="284" y1="1298" x2="304" y2="1298" marker-end="url(#ah)"/>
<rect class="bx" x="307" y="1274" width="260" height="48" rx="3"/>
<text class="sm" x="437" y="1293" text-anchor="middle"><tspan class="r" style="font-weight:700">73rd Amdt 1992 · in force 24 Apr</tspan></text>
<text class="sm" x="437" y="1311" text-anchor="middle"><tspan class="r" style="font-weight:700">1993</tspan></text>
<text class="xs" x="50" y="1358"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> This bill was passed by the Lok Sabha on 22 December, 1992, and by the Rajya Sabha on 23</tspan></text>
<text class="xs" x="50" y="1376"><tspan class="k">December, 1992. Later, it was approved by the 17 state assemblies and received the assent of the</tspan></text>
<text class="xs" x="50" y="1394"><tspan class="k">President on 20 April, 1993.</tspan></text>
