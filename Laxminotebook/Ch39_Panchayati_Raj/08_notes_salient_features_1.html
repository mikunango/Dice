<div id="vis-container"><h2 class="sr-only">73rd Amendment Act – Salient Features I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1583" role="img"><title>73rd Amendment Act – Salient Features I</title><desc>73rd Amendment Act – Salient Features I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="149" y="26" width="382" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">73rd Amendment Act – Salient Features I</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Salient Features</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Salient features:</tspan><tspan class="k"> The salient features of the act are:</tspan></text>
<text x="44" y="152"><tspan class="h" style="font-weight:700">Gram Sabha:</tspan><tspan class="k"> The act provides for a</tspan><tspan class="r"> Gram Sabha</tspan><tspan class="k"> as the</tspan><tspan class="r"> foundation of the panchayati raj</tspan></text>
<text x="56" y="174"><tspan class="r">system</tspan><tspan class="k">. It is a body consisting of persons</tspan><tspan class="b"> registered in the electoral rolls</tspan><tspan class="k"> of a village</tspan></text>
<text x="56" y="196"><tspan class="k">comprised within the area of Panchayat at the village level. Thus, it is a</tspan><tspan class="r"> village assembly</tspan></text>
<text x="56" y="218"><tspan class="r">consisting of all the registered voters</tspan><tspan class="k"> in the area of a panchayat. It may exercise such</tspan></text>
<text x="56" y="240"><tspan class="k">powers and perform such functions at the village level as the</tspan><tspan class="r"> legislature of a state</tspan></text>
<text x="56" y="262"><tspan class="r">determines</tspan><tspan class="k">.</tspan></text>
<text x="44" y="290"><tspan class="h" style="font-weight:700">Three-Tier System:</tspan><tspan class="k"> The act provides for a</tspan><tspan class="r"> three-tier system</tspan><tspan class="k"> of panchayati raj in every</tspan></text>
<text x="56" y="312"><tspan class="k">state, that is, panchayats at the</tspan><tspan class="b"> village, intermediate, and district levels</tspan><tspan class="k"> ². Thus, the act</tspan></text>
<text x="56" y="334"><tspan class="k">brings about</tspan><tspan class="r"> uniformity in the structure</tspan><tspan class="k"> of panchayati raj throughout the country.</tspan></text>
<text x="56" y="356"><tspan class="k">However, a state having a population</tspan><tspan class="r"> not exceeding 20 lakh</tspan><tspan class="k"> may not constitute</tspan></text>
<text x="56" y="378"><tspan class="k">panchayats at the</tspan><tspan class="r"> intermediate level</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="97" y="390" width="137" height="48" rx="3"/>
<text class="sm" x="165" y="409" text-anchor="middle"><tspan class="r" style="font-weight:700">District</tspan></text>
<text class="sm" x="165" y="427" text-anchor="middle"><tspan class="r" style="font-weight:700">panchayat</tspan></text>
<line class="ln" x1="236" y1="414" x2="256" y2="414" marker-end="url(#ah)"/>
<rect class="bx" x="259" y="390" width="167" height="48" rx="3"/>
<text class="sm" x="343" y="409" text-anchor="middle"><tspan class="r" style="font-weight:700">Intermediate</tspan></text>
<text class="sm" x="343" y="427" text-anchor="middle"><tspan class="r" style="font-weight:700">panchayat</tspan></text>
<line class="ln" x1="430" y1="414" x2="450" y2="414" marker-end="url(#ah)"/>
<rect class="bx" x="453" y="390" width="130" height="48" rx="3"/>
<text class="sm" x="518" y="418" text-anchor="middle"><tspan class="r" style="font-weight:700">Village panchayat</tspan></text>
<line class="ln" x1="340" y1="439" x2="340" y2="460" marker-end="url(#ah)"/>
<rect class="bx" x="290" y="462" width="100" height="30" rx="3"/>
<text class="sm" x="340" y="481" text-anchor="middle"><tspan class="b">Gram Sabha</tspan></text>
<text x="44" y="520"><tspan class="h" style="font-weight:700">Election of Members and Chairpersons:</tspan><tspan class="k"> All the</tspan><tspan class="r"> members</tspan><tspan class="k"> of panchayats at the village,</tspan></text>
<text x="56" y="542"><tspan class="k">intermediate and district levels shall be</tspan><tspan class="r"> elected directly</tspan><tspan class="k"> by the people. Further, the</tspan></text>
<text x="56" y="564"><tspan class="r">chairperson of panchayats at the intermediate and district levels</tspan><tspan class="k"> shall be</tspan><tspan class="r"> elected</tspan></text>
<text x="56" y="586"><tspan class="r">indirectly</tspan><tspan class="k">—by and from amongst the elected members thereof. However, the</tspan><tspan class="r"> chairperson</tspan></text>
<text x="56" y="608"><tspan class="r">of a panchayat at the village level</tspan><tspan class="k"> shall be elected in such manner as the</tspan><tspan class="r"> state</tspan></text>
<text x="56" y="630"><tspan class="r">legislature determines</tspan><tspan class="k">.</tspan></text>
<text x="44" y="658"><tspan class="h" style="font-weight:700">Right to vote:</tspan><tspan class="k"> The chairperson of a panchayat and other members of a panchayat</tspan></text>
<text x="56" y="680"><tspan class="k">elected directly or indirectly shall have the</tspan><tspan class="r"> right to vote</tspan><tspan class="k"> in the meetings of the</tspan></text>
<text x="56" y="702"><tspan class="k">panchayats.</tspan></text>
<text x="44" y="730"><tspan class="h" style="font-weight:700">Reservation of Seats:</tspan><tspan class="k"> The act provides for the reservation of seats for</tspan><tspan class="r"> scheduled castes</tspan></text>
<text x="56" y="752"><tspan class="r">and scheduled tribes</tspan><tspan class="k"> in every panchayat (</tspan><tspan class="b">i.e., at all the three levels</tspan><tspan class="k">) in</tspan><tspan class="r"> proportion of</tspan></text>
<text x="56" y="774"><tspan class="r">their population</tspan><tspan class="k"> to the total population in the panchayat area. Further, the state</tspan></text>
<text x="56" y="796"><tspan class="k">legislature shall provide for the reservation of offices of</tspan><tspan class="r"> chairperson</tspan><tspan class="k"> in the panchayat at</tspan></text>
<text x="56" y="818"><tspan class="k">the village or any other level for the SCs and STs.</tspan></text>
<text x="44" y="846"><tspan class="h" style="font-weight:700">One-third for women:</tspan><tspan class="k"> The act provides for the reservation of</tspan><tspan class="r"> not less than one-third</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="868"><tspan class="k">the total number of seats for</tspan><tspan class="r"> women</tspan><tspan class="k"> (</tspan><tspan class="b">including the number of seats reserved for women</tspan></text>
<text x="56" y="890"><tspan class="b">belonging the SCs and STs</tspan><tspan class="k">). Further, not less than one-third of the total number of</tspan></text>
<text x="56" y="912"><tspan class="k">offices of</tspan><tspan class="r"> chairpersons</tspan><tspan class="k"> in the panchayats at each level shall be reserved for women.</tspan></text>
<ellipse cx="340" cy="990" rx="250" ry="58" fill="none" stroke="#2F6FDB" stroke-width="1.5"/>
<ellipse cx="435" cy="990" rx="125" ry="38" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="sm" x="190" y="986" text-anchor="middle"><tspan class="r" style="font-weight:700">Seats for women</tspan><tspan class="k"> – not</tspan></text>
<text class="sm" x="190" y="1004" text-anchor="middle"><tspan class="k">less than 1/3 of total seats</tspan></text>
<text class="sm" x="435" y="986" text-anchor="middle"><tspan class="r" style="font-weight:700">Seats of SC/ST women</tspan><tspan class="k"> – counted</tspan></text>
<text class="sm" x="435" y="1004" text-anchor="middle"><tspan class="k">within</tspan></text>
<text class="xs" x="340" y="1069" text-anchor="middle"><tspan class="b">same rule for offices of chairpersons: not less than one-third reserved for women at each level</tspan></text>
<text x="44" y="1102"><tspan class="h" style="font-weight:700">Backward classes – optional:</tspan><tspan class="k"> The act also authorises the legislature of a state to make</tspan></text>
<text x="56" y="1124"><tspan class="k">any provision for reservation of seats in any panchayat or offices of chairperson in the</tspan></text>
<text x="56" y="1146"><tspan class="k">panchayat at any level in favour of</tspan><tspan class="r"> backward classes</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1174"><tspan class="h" style="font-weight:700">SC/ST reservation till 2030:</tspan><tspan class="k"> The reservation of seats as well as the reservation of</tspan></text>
<text x="56" y="1196"><tspan class="k">offices of chairpersons in the panchayats for the scheduled castes and scheduled tribes</tspan></text>
<text x="56" y="1218"><tspan class="k">shall cease to have effect after the expiration of the period specified in</tspan><tspan class="r"> Article 334</tspan></text>
<text x="56" y="1240"><tspan class="k">(</tspan><tspan class="b">which is presently eighty years, that is, till 2030</tspan><tspan class="k">).</tspan></text>
<text x="44" y="1268"><tspan class="h" style="font-weight:700">Arunachal – no SC reservation:</tspan><tspan class="k"> It must be noted here that the above provision relating</tspan></text>
<text x="56" y="1290"><tspan class="k">to the reservation of seats in panchayats (both members and chairpersons) for the</tspan></text>
<text x="56" y="1312"><tspan class="k">scheduled castes is</tspan><tspan class="r"> not applicable to the state of Arunachal Pradesh</tspan><tspan class="k">. This is because the</tspan></text>
<text x="56" y="1334"><tspan class="k">state is inhabited fully by</tspan><tspan class="b"> indigenous tribal people</tspan><tspan class="k"> and there are</tspan><tspan class="r"> no scheduled castes</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1356"><tspan class="k">This provision was added later by the</tspan><tspan class="r"> 83rd Constitutional Amendment Act of 2000</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="1368" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="1388" text-anchor="middle"><tspan class="r" style="font-weight:700">SC/ST</tspan></text>
<text class="sm" x="137" y="1406" text-anchor="middle"><tspan class="k">by population</tspan></text>
<text class="sm" x="137" y="1424" text-anchor="middle"><tspan class="k">till 2030</tspan></text>
<rect class="bx" x="243" y="1368" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="1388" text-anchor="middle"><tspan class="r" style="font-weight:700">Women</tspan></text>
<text class="sm" x="340" y="1406" text-anchor="middle"><tspan class="k">≥ 1/3 seats</tspan></text>
<text class="sm" x="340" y="1424" text-anchor="middle"><tspan class="k">+ chairpersons</tspan></text>
<rect class="bx" x="447" y="1368" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="1397" text-anchor="middle"><tspan class="r" style="font-weight:700">Backward classes</tspan></text>
<text class="sm" x="543" y="1415" text-anchor="middle"><tspan class="k">optional (state)</tspan></text>
<text class="xs" x="50" y="1472"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> The Act defines all these terms in the following manner: (a) Panchayat means an institution (by</tspan></text>
<text class="xs" x="50" y="1490"><tspan class="k">whatever name called) of self-government for rural areas. (b) Village means a village specified by</tspan></text>
<text class="xs" x="50" y="1508"><tspan class="k">the governor by public notification to be a village for this purpose, and includes a group of villages</tspan></text>
<text class="xs" x="50" y="1526"><tspan class="k">so specified. (c) Intermediate level means a level between the village and district levels specified by</tspan></text>
<text class="xs" x="50" y="1544"><tspan class="k">the governor by public notification for this purpose. (d) District means a district in a state.</tspan></text>
<rect x="40" y="1450" width="600" height="103" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
