<div id="vis-container"><h2 class="sr-only">G.V.K. Rao Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1256" role="img"><title>G.V.K. Rao Committee</title><desc>G.V.K. Rao Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="228" y="26" width="224" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">G.V.K. Rao Committee</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">G.V.K. Rao Committee</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">‘Grass without roots’ (1985):</tspan><tspan class="k"> The Committee to review the existing</tspan><tspan class="b"> Administrative</tspan></text>
<text x="56" y="146"><tspan class="b">Arrangements for Rural Development and Poverty Alleviation Programmes</tspan><tspan class="k"> under the</tspan></text>
<text x="56" y="168"><tspan class="k">chairmanship of</tspan><tspan class="r"> G.V.K. Rao</tspan><tspan class="k"> was appointed by the erstwhile</tspan><tspan class="r"> Planning Commission in 1985</tspan><tspan class="k">.</tspan></text>
<text x="56" y="190"><tspan class="k">The Committee came to the conclusion that the developmental process was gradually</tspan></text>
<text x="56" y="212"><tspan class="r">bureaucratised and divorced from the Panchayati Raj</tspan><tspan class="k">. This phenomena of</tspan></text>
<text x="56" y="234"><tspan class="b">bureaucratisation of development administration as against the democratisation</tspan><tspan class="k"> weakened</tspan></text>
<text x="56" y="256"><tspan class="k">the Panchayati Raj institutions resulting in what is aptly called as ‘</tspan><tspan class="r">grass without roots</tspan><tspan class="k">’.</tspan></text>
<text x="56" y="278"><tspan class="k">Hence, the Committee made the following recommendations to strengthen and revitalise</tspan></text>
<text x="56" y="300"><tspan class="k">the Panchayati Raj system:</tspan></text>
<text x="56" y="326" class="r" style="font-weight:700">(i)</text>
<text x="93" y="326"><tspan class="h" style="font-weight:700">Zila Parishad pivotal:</tspan><tspan class="k"> The district level body, that is, the</tspan><tspan class="r"> Zila Parishad should be</tspan></text>
<text x="93" y="348"><tspan class="r">of pivotal importance</tspan><tspan class="k"> in the scheme of democratic decentralisation. It stated that</tspan></text>
<text x="93" y="370"><tspan class="k">“</tspan><tspan class="b">the district is the proper unit for planning and development and the Zila</tspan></text>
<text x="93" y="392"><tspan class="b">Parishad should become the principal body for management of all development</tspan></text>
<text x="93" y="414"><tspan class="b">programmes which can be handled at that level.</tspan><tspan class="k">”</tspan></text>
<text x="56" y="440" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="440"><tspan class="h" style="font-weight:700">Role in rural development:</tspan><tspan class="k"> The Panchayati Raj institutions at the district and</tspan></text>
<text x="93" y="462"><tspan class="k">lower levels should be assigned an important role with respect to</tspan><tspan class="r"> planning,</tspan></text>
<text x="93" y="484"><tspan class="r">implementation and monitoring</tspan><tspan class="k"> of rural development programmes.</tspan></text>
<text x="56" y="510" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="510"><tspan class="h" style="font-weight:700">District planning:</tspan><tspan class="k"> Some of the</tspan><tspan class="r"> planning functions at the state level should be</tspan></text>
<text x="93" y="532"><tspan class="r">transferred to the district level</tspan><tspan class="k"> planning units for effective decentralized district</tspan></text>
<text x="93" y="554"><tspan class="k">planning.</tspan></text>
<text x="56" y="580" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="580"><tspan class="h" style="font-weight:700">District Development Commissioner:</tspan><tspan class="k"> A post of</tspan><tspan class="r"> District Development</tspan></text>
<text x="93" y="602"><tspan class="r">Commissioner</tspan><tspan class="k"> should be created. He/she should act as the</tspan><tspan class="b"> chief executive officer</tspan></text>
<text x="93" y="624"><tspan class="b">of the Zila Parishad</tspan><tspan class="k"> and should be in charge of all the development departments</tspan></text>
<text x="93" y="646"><tspan class="k">at the district level.</tspan></text>
<text x="56" y="672" class="r" style="font-weight:700">(v)</text>
<text x="93" y="672"><tspan class="h" style="font-weight:700">Regular elections:</tspan><tspan class="r"> Elections</tspan><tspan class="k"> to the Panchayati Raj institutions should be</tspan><tspan class="r"> held</tspan></text>
<text x="93" y="694"><tspan class="r">regularly</tspan><tspan class="k">. It found that elections became overdue for one or more tiers in</tspan><tspan class="r"> 11</tspan></text>
<text x="93" y="716"><tspan class="r">states</tspan><tspan class="k">.</tspan></text>
<path d="M50 306 L44 306 L44 722 L50 722" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="744"><tspan class="h" style="font-weight:700">GVK Rao vs Dantwala &amp; Hanumantha Rao:</tspan><tspan class="k"> Thus the committee, in its scheme of</tspan></text>
<text x="56" y="766"><tspan class="k">decentralised system of field administration, assigned a</tspan><tspan class="r"> leading role to the Panchayati</tspan></text>
<text x="56" y="788"><tspan class="r">Raj</tspan><tspan class="k"> in local planning and development. It is in this respect that the recommendations of</tspan></text>
<text x="56" y="810"><tspan class="k">the</tspan><tspan class="r"> G.V.K. Rao Committee Report (1986)</tspan><tspan class="k"> differed from those of the</tspan><tspan class="r"> Dantwala</tspan></text>
<text x="56" y="832"><tspan class="r">Committee Report on Block-Level Planning (1978)</tspan><tspan class="k"> and the</tspan><tspan class="r"> Hanumantha Rao Committee</tspan></text>
<text x="56" y="854"><tspan class="r">Report on District Planning (1984)</tspan><tspan class="k">. Both the committees have suggested that the basic</tspan></text>
<text x="56" y="876"><tspan class="k">decentralised planning function should be done at the</tspan><tspan class="r"> district level</tspan><tspan class="k">. The Hanumantha Rao</tspan></text>
<text x="56" y="898"><tspan class="k">Committee advocated</tspan><tspan class="r"> separate district planning bodies</tspan><tspan class="k"> under either the</tspan><tspan class="b"> District Collector</tspan></text>
<text x="56" y="920"><tspan class="b">or a minister</tspan><tspan class="k">. In both the models, the</tspan><tspan class="r"> Collector should play a significant role</tspan><tspan class="k"> in the</tspan></text>
<text x="56" y="942"><tspan class="k">decentralised planning though the Committee stated that Panchayati Raj institutions</tspan></text>
<text x="56" y="964"><tspan class="k">would also be associated with this process (of decentralised planning). The committee</tspan></text>
<text x="56" y="986"><tspan class="k">recommended that the</tspan><tspan class="r"> Collector should be the coordinator</tspan><tspan class="k">, at the district level, of all</tspan></text>
<text x="56" y="1008"><tspan class="k">developmental and planning activities. Thus, the Hanumantha Rao Committee differed in</tspan></text>
<text x="56" y="1030"><tspan class="k">this respect from those of the</tspan><tspan class="b"> Balwantrai Mehta Committee, the First Administrative</tspan></text>
<text x="56" y="1052"><tspan class="b">Reforms Commission of India, the Ashok Mehta Committee and finally the G.V.K. Rao</tspan></text>
<text x="56" y="1074"><tspan class="b">Committee</tspan><tspan class="k"> which recommended</tspan><tspan class="r"> reduction in the developmental role of the District</tspan></text>
<text x="56" y="1096"><tspan class="r">Collector</tspan><tspan class="k"> and which assigned a</tspan><tspan class="r"> major role to the Panchayati Raj</tspan><tspan class="k"> in development</tspan></text>
<text x="56" y="1118"><tspan class="k">administration.</tspan></text>
<rect class="bx" x="46" y="1132" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1150" text-anchor="middle"><tspan class="r" style="font-weight:700">Hanumantha Rao (1984)</tspan></text>
<line class="ln" x1="190" y1="1160" x2="190" y2="1174" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1195" text-anchor="middle"><tspan class="k">separate district planning body</tspan></text>
<text class="sm" x="190" y="1217" text-anchor="middle"><tspan class="r">Collector</tspan><tspan class="k"> as coordinator</tspan></text>
<rect class="bx" x="346" y="1132" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1150" text-anchor="middle"><tspan class="r" style="font-weight:700">Mehta, ARC, Ashok Mehta, GVK Rao</tspan></text>
<line class="ln" x1="490" y1="1160" x2="490" y2="1174" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1195" text-anchor="middle"><tspan class="k">reduce Collector’s role</tspan></text>
<text class="sm" x="490" y="1217" text-anchor="middle"><tspan class="r">PRIs</tspan><tspan class="k"> lead development</tspan></text>
<line x1="340" y1="1132" x2="340" y2="1220" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
</svg>
