<div id="vis-container"><h2 class="sr-only">Reasons for Ineffective Performance</h2>
<svg class="n" width="100%" viewBox="0 0 680 1403" role="img"><title>Reasons for Ineffective Performance</title><desc>Reasons for Ineffective Performance</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="172" y="26" width="337" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Reasons for Ineffective Performance</text>
<text class="lb" x="40" y="98">Reasons for Ineffective Performance</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Sub-optimal performance:</tspan><tspan class="k"> Even after conferring the constitutional status and protection</tspan></text>
<text x="56" y="150"><tspan class="k">through the 73rd Amendment Act (1992), the performance of the Panchayati Raj</tspan></text>
<text x="56" y="172"><tspan class="k">Institutions (PRIs) has</tspan><tspan class="r"> not been satisfactory</tspan><tspan class="k"> and not upto the expected level. The</tspan></text>
<text x="56" y="194"><tspan class="k">various reasons for this</tspan><tspan class="r"> sub-optimal performance</tspan><tspan class="k"> are as follows⁸:</tspan></text>
<text x="56" y="220" class="r" style="font-weight:700">1.</text>
<text x="78" y="220"><tspan class="h" style="font-weight:700">Lack of adequate devolution:</tspan><tspan class="k"> Many States have not taken adequate steps to</tspan></text>
<text x="78" y="242"><tspan class="k">devolve</tspan><tspan class="r"> 3Fs (i.e., functions, funds and functionaries)</tspan><tspan class="k"> to the PRIs to enable them to</tspan></text>
<text x="78" y="264"><tspan class="k">discharge their constitutionally stipulated function. Further, it is imperative that the</tspan></text>
<text x="78" y="286"><tspan class="k">PRIs have</tspan><tspan class="b"> resources to match the responsibilities</tspan><tspan class="k"> entrusted to them. While SFCs</tspan></text>
<text x="78" y="308"><tspan class="k">(state finance commissions) have submitted their recommendations,</tspan><tspan class="r"> not many few</tspan></text>
<text x="78" y="330"><tspan class="r">States have implemented</tspan><tspan class="k"> these or taken steps to ensure the fiscal viability of the</tspan></text>
<text x="78" y="352"><tspan class="k">PRIs.</tspan></text>
<text x="56" y="378" class="r" style="font-weight:700">2.</text>
<text x="78" y="378"><tspan class="h" style="font-weight:700">Excessive control by bureaucracy:</tspan><tspan class="k"> In some States, the Gram Panchayats have been</tspan></text>
<text x="78" y="400"><tspan class="k">placed in a</tspan><tspan class="r"> position of subordination</tspan><tspan class="k">. Hence, the Gram Panchayat Sarpanches have</tspan></text>
<text x="78" y="422"><tspan class="k">to spend extraordinary amount of time visiting</tspan><tspan class="b"> Block Offices for funds and/or</tspan></text>
<text x="78" y="444"><tspan class="b">technical approval</tspan><tspan class="k">. These interactions with the Block staff office</tspan><tspan class="r"> distort the role of</tspan></text>
<text x="78" y="466"><tspan class="r">Sarpanches</tspan><tspan class="k"> as elected representatives.</tspan></text>
<text x="56" y="492" class="r" style="font-weight:700">3.</text>
<text x="78" y="492"><tspan class="h" style="font-weight:700">Tied nature of funds:</tspan><tspan class="k"> This has two implications. The activities stated under a</tspan></text>
<text x="78" y="514"><tspan class="k">certain scheme are</tspan><tspan class="r"> not always appropriate for all parts of the district</tspan><tspan class="k">. This results</tspan></text>
<text x="78" y="536"><tspan class="k">in</tspan><tspan class="r"> unsuitable activities being promoted or an under-spend</tspan><tspan class="k"> of the funds.</tspan></text>
<text x="56" y="562" class="r" style="font-weight:700">4.</text>
<text x="78" y="562"><tspan class="h" style="font-weight:700">Overwhelming dependency on government funding:</tspan><tspan class="k"> A review of money received</tspan></text>
<text x="78" y="584"><tspan class="k">and own source funds shows the</tspan><tspan class="r"> overwhelming dependence of Panchayats on</tspan></text>
<text x="78" y="606"><tspan class="r">government funding</tspan><tspan class="k">. When Panchayats do not raise resources and instead receive</tspan></text>
<text x="78" y="628"><tspan class="k">funds from outside, people are</tspan><tspan class="r"> less likely to request a social audit</tspan><tspan class="k">.</tspan></text>
<text x="56" y="654" class="r" style="font-weight:700">5.</text>
<text x="78" y="654"><tspan class="h" style="font-weight:700">Reluctance to use fiscal powers:</tspan><tspan class="k"> An important power devolved to GP (Gram</tspan></text>
<text x="78" y="676"><tspan class="k">Panchayat) is the right to</tspan><tspan class="b"> levy tax on property, business, markets, fairs</tspan><tspan class="k"> and also</tspan></text>
<text x="78" y="698"><tspan class="k">for services provided, like street lighting or public toilets, etc.</tspan><tspan class="r"> Very few Panchayats</tspan></text>
<text x="78" y="720"><tspan class="r">use their fiscal power</tspan><tspan class="k"> to levy and collect taxes. The argument pushed by Panchayat</tspan></text>
<text x="78" y="742"><tspan class="k">heads is that it is</tspan><tspan class="r"> difficult to levy tax on your own constituency</tspan><tspan class="k">, especially when</tspan></text>
<text x="78" y="764"><tspan class="k">you live in the community.</tspan></text>
<text x="56" y="790" class="r" style="font-weight:700">6.</text>
<text x="78" y="790"><tspan class="h" style="font-weight:700">Status of the Gram Sabha:</tspan><tspan class="k"> Empowering the Gram Sabhas could have been a</tspan></text>
<text x="78" y="812"><tspan class="k">powerful weapon for</tspan><tspan class="b"> transparency, accountability and for involvement of the</tspan></text>
<text x="78" y="834"><tspan class="b">marginalized sections</tspan><tspan class="k">. However, a number of the State Acts have</tspan><tspan class="r"> not spelt the</tspan></text>
<text x="78" y="856"><tspan class="r">powers of Gram Sabhas</tspan><tspan class="k"> nor have any procedures been laid down for the functioning</tspan></text>
<text x="78" y="878"><tspan class="k">of these bodies or penalties for the officials.</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">7.</text>
<text x="78" y="904"><tspan class="h" style="font-weight:700">Creation of Parallel Bodies:</tspan><tspan class="k"> Often,</tspan><tspan class="r"> Parallel Bodies (PBs)</tspan><tspan class="k"> are created for supposedly</tspan></text>
<text x="78" y="926"><tspan class="k">speedy implementation and greater accountability. However, there is little evidence</tspan></text>
<text x="78" y="948"><tspan class="k">to show that such PBs have avoided the evils including that of</tspan><tspan class="b"> partisan politics,</tspan></text>
<text x="78" y="970"><tspan class="b">sharing of spoils, corruption and elite capture</tspan><tspan class="k">. Missions (in particular) often</tspan></text>
<text x="78" y="992"><tspan class="k">bypassing mainstream programmes, create</tspan><tspan class="r"> disconnect, duality, and alienation</tspan></text>
<text x="78" y="1014"><tspan class="k">between the existing and the new structures and functions. PBs</tspan><tspan class="r"> usurp the</tspan></text>
<text x="78" y="1036"><tspan class="r">legitimate space of PRIs</tspan><tspan class="k"> and demoralize the PRIs by virtue of their superior resource</tspan></text>
<text x="78" y="1058"><tspan class="k">endowments.</tspan></text>
<text x="56" y="1084" class="r" style="font-weight:700">8.</text>
<text x="78" y="1084"><tspan class="h" style="font-weight:700">Poor Infrastructure:</tspan><tspan class="k"> A number of Gram Panchayats in the country do not have</tspan></text>
<text x="78" y="1106"><tspan class="k">even</tspan><tspan class="r"> full time Secretary and also basic office buildings</tspan><tspan class="k">. The</tspan><tspan class="r"> database for planning,</tspan></text>
<text x="78" y="1128"><tspan class="r">monitoring</tspan><tspan class="k"> etc., are lacking in most of the cases.</tspan></text>
<path d="M50 200 L44 200 L44 1134 L50 1134" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1156"><tspan class="h" style="font-weight:700">Capacity deficit of representatives:</tspan><tspan class="k"> A large number of elected representatives of PRIs</tspan></text>
<text x="56" y="1178"><tspan class="k">are</tspan><tspan class="r"> semi-literate or illiterate</tspan><tspan class="k"> and know little about their roles &amp; responsibilities,</tspan></text>
<text x="56" y="1200"><tspan class="k">programmes, procedures, systems. Often for want of</tspan><tspan class="r"> good, relevant and periodic training</tspan><tspan class="k">,</tspan></text>
<text x="56" y="1222"><tspan class="k">they are not able to perform their functions properly.</tspan></text>
<rect class="bx" x="40" y="1234" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="1254" text-anchor="middle"><tspan class="r">3Fs not devolved</tspan></text>
<rect class="bx" x="192" y="1234" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="1254" text-anchor="middle"><tspan class="r">bureaucratic control</tspan></text>
<rect class="bx" x="345" y="1234" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="1254" text-anchor="middle"><tspan class="r">tied funds</tspan></text>
<rect class="bx" x="498" y="1234" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="1254" text-anchor="middle"><tspan class="r">grant dependence</tspan></text>
<rect class="bx" x="40" y="1278" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="1298" text-anchor="middle"><tspan class="r">no own taxes</tspan></text>
<rect class="bx" x="192" y="1278" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="1298" text-anchor="middle"><tspan class="r">weak Gram Sabha</tspan></text>
<rect class="bx" x="345" y="1278" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="1298" text-anchor="middle"><tspan class="r">parallel bodies</tspan></text>
<rect class="bx" x="498" y="1278" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="1298" text-anchor="middle"><tspan class="r">poor infrastructure</tspan></text>
