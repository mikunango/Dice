<text x="44" y="289"><tspan class="h" style="font-weight:700">Section 66A struck down:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It struck down</tspan><tspan class="r"> section 66A</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="311"><tspan class="k">the Information Technology Act (2000), which provides punishment for sending offensive</tspan></text>
<text x="56" y="333"><tspan class="k">messages by any person through a computer resource or a communication device. It held</tspan></text>
<text x="56" y="355"><tspan class="k">that the section in its entirety is violative of the freedom of speech and expression</tspan></text>
<text x="56" y="377"><tspan class="k">guaranteed under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k">. It further held that the section is not saved by</tspan></text>
<text x="56" y="399"><tspan class="r">Article 19(2)</tspan><tspan class="k"> as it creates an offence which is vague and over-broad. It also held that</tspan></text>
<text x="56" y="421"><tspan class="k">the wider range of circulation over the internet cannot restrict the content of the right</tspan></text>
<text x="56" y="443"><tspan class="k">under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> nor can it justify the denial of that right.</tspan></text>
<text class="sh" x="40" y="471"><tspan class="r" style="font-weight:700">SUPREME COURT ADVOCATES-ON-RECORD ASSOCIATION CASE (2015)</tspan></text>

<text x="44" y="685"><tspan class="h" style="font-weight:700">NJAC unconstitutional:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It declared the</tspan><tspan class="r"> 99th Amendment</tspan></text>
<text x="56" y="707"><tspan class="r">Act (2014)</tspan><tspan class="k"> as unconstitutional and void on the ground that it affects the independence</tspan></text>
<text x="56" y="729"><tspan class="k">of judiciary which is one of the components of the basic structure of the constitution. It</tspan></text>
<text x="56" y="751"><tspan class="k">also declared the National Judicial Appointments Commission Act (2014) as</tspan></text>
<text x="56" y="773"><tspan class="k">unconstitutional and void. Further, it declared the earlier</tspan><tspan class="b"> ‘collegium system’</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="795"><tspan class="k">appointment of judges to the Supreme Court and the High Courts to be operative. It</tspan></text>
<text x="56" y="817"><tspan class="k">ordered to list the case to consider introduction of appropriate measures, if any, for an</tspan></text>
<text x="56" y="839"><tspan class="k">improved working of the</tspan><tspan class="b"> ‘collegium system’</tspan><tspan class="k">.</tspan></text>
<text x="44" y="867"><tspan class="h" style="font-weight:700">Collegium revived:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Consequent to this judgement, both the</tspan></text>
<text x="56" y="889"><tspan class="r">99th Amendment Act (2014)</tspan><tspan class="k"> as well as the National Judicial Appointments Commission</tspan></text>
<text x="56" y="911"><tspan class="k">Act (2014) became invalid. Therefore, the earlier collegium system of appointment of</tspan></text>
<text x="56" y="933"><tspan class="k">judges to the Supreme Court and the High Courts was restored.</tspan></text>

<text class="sm" x="237" y="1151"><tspan class="k">Triple Talaq case</tspan></text>

<text class="sm" x="47" y="1182"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1182"><tspan class="k">Divorce in the muslim community</tspan></text>

<text x="44" y="1252"><tspan class="h" style="font-weight:700">Triple talaq void:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It declared triple talaq i.e.,</tspan></text>
<text x="56" y="1274"><tspan class="b">‘talaq-e-biddat’</tspan><tspan class="k"> (the Muslim practice that allows men to instantly divorce their wives)</tspan></text>
<text x="56" y="1296"><tspan class="k">as unconstitutional. It held that this form of talaq is manifestly arbitrary in the sense</tspan></text>
<text x="56" y="1318"><tspan class="k">that the marital tie can be broken capriciously and whimsically by a muslim man</tspan></text>
<text x="56" y="1340"><tspan class="k">without any attempt at reconciliation so as to save it. Therefore, the court held this</tspan></text>
<text x="56" y="1362"><tspan class="k">form of talaq to be violative of the fundamental right contained under</tspan><tspan class="r"> Article 14</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="1384"><tspan class="k">Constitution. Similarly, it declared</tspan><tspan class="r"> Section 2</tspan><tspan class="k"> of the Muslim Personal Law (Shariat)</tspan></text>
<text x="56" y="1406"><tspan class="k">Application Act, 1937, as void to the extent that it recognizes and enforces triple talaq.</tspan></text>
<text x="56" y="1428"><tspan class="k">Further, it ruled that triple talaq is against the basic tenets of the Holy Quran and what</tspan></text>
<text x="56" y="1450"><tspan class="k">is held to be bad in the Holy Quran, cannot be good in Shariat and, in that sense, what</tspan></text>
<text x="56" y="1472"><tspan class="k">is bad in theology is bad in law as well. Moreover, the court directed the central</tspan></text>
<text x="56" y="1494"><tspan class="k">government to make a law within six months to govern divorce in the muslim</tspan></text>
<text x="56" y="1516"><tspan class="k">community. Till then, an injunction order of the court against the pronouncement of</tspan></text>
<text x="56" y="1538"><tspan class="k">triple talaq would be in force.</tspan></text>
<text x="44" y="1566"><tspan class="h" style="font-weight:700">Triple Talaq Act 2019:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the enactment</tspan></text>
<text x="56" y="1588"><tspan class="k">of the Muslim Women (Protection of Rights on Marriage) Act, 2019. This act is popularly</tspan></text>
<text x="56" y="1610"><tspan class="k">known as the Triple Talaq Act. It protects the rights of married Muslim women and</tspan></text>
<text x="56" y="1632"><tspan class="k">prohibits divorce by pronouncing talaq by their husbands.</tspan></text>
