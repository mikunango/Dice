<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">I.C. GOLAK NATH CASE (1967)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">I.C. Golak Nath vs. State of Punjab</tspan></text>

<text x="44" y="289"><tspan class="h" style="font-weight:700">FRs not amendable – prospective overruling:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It overruled</tspan></text>
<text x="56" y="311"><tspan class="k">its two earlier verdicts delivered in the Shankari Prasad case⁶ (1951) and the Sajjan</tspan></text>
<text x="56" y="333"><tspan class="k">Singh case⁷ (1964). It held that the amending power under</tspan><tspan class="r"> Article 368</tspan><tspan class="k"> can not be</tspan></text>
<text x="56" y="355"><tspan class="k">used to abridge or take away the fundamental rights guaranteed in Part III of the</tspan></text>
<text x="56" y="377"><tspan class="k">constitution. Further, it said that a constitutional amendment act is a law within the</tspan></text>
<text x="56" y="399"><tspan class="k">meaning of</tspan><tspan class="r"> Article 13(2)</tspan><tspan class="k">. But, the court ruled that the</tspan><tspan class="r"> 1st Amendment Act (1951)</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="421"><tspan class="r">4th Amendment Act (1955)</tspan><tspan class="k"> and the</tspan><tspan class="r"> 17th Amendment Act (1964)</tspan><tspan class="k"> will continue to be</tspan></text>
<text x="56" y="443"><tspan class="k">valid for the future. In other words, the Supreme Court applied the doctrine of</tspan></text>
<text x="56" y="465"><tspan class="k">prospective overruling and declared that this judgement will have only prospective</tspan></text>
<text x="56" y="487"><tspan class="k">operation and not retrospective operation.</tspan></text>
<text x="44" y="515"><tspan class="h" style="font-weight:700">24th Amendment response:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> As a sequel to this judgement,</tspan></text>
<text x="56" y="537"><tspan class="k">the</tspan><tspan class="r"> 24th Amendment Act (1971)</tspan><tspan class="k"> was enacted. This amendment provided that the</tspan></text>
<text x="56" y="559"><tspan class="k">Parliament has the power to amend any part of the constitution including the</tspan></text>
<text x="56" y="581"><tspan class="k">fundamental rights in accordance with the procedure laid down in</tspan><tspan class="r"> Article 368</tspan><tspan class="k">. It also</tspan></text>
<text x="56" y="603"><tspan class="k">provided that a constitutional amendment act will not be a law within the meaning of</tspan></text>
<text x="56" y="625"><tspan class="r">Article 13(2)</tspan><tspan class="k">. Thus, this amendment was aimed at overriding the above judgement.</tspan></text>
<text class="xs" x="50" y="661"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> Shankari Prasad vs. Union of India (1951).</tspan></text>
<rect x="40" y="639" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="706"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> Sajjan Singh vs. State of Rajasthan (1964).</tspan></text>
<rect x="40" y="684" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sh" x="40" y="743"><tspan class="r" style="font-weight:700">Kesavananda Bharati Case (1973)</tspan></text>
<text class="sm" x="135" y="775" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="775" text-anchor="middle"><tspan class="r" style="font-weight:700">Kesavananda Bharati vs. State of Kerala</tspan></text>
<line class="gx" x1="40" y1="786" x2="640" y2="786"/>
<text class="sm" x="47" y="806"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="806"><tspan class="r">1973</tspan></text>
<line class="gx" x1="40" y1="817" x2="640" y2="817"/>
<text class="sm" x="47" y="837"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="837"><tspan class="k">Fundamental Rights case</tspan></text>
<line class="gx" x1="40" y1="848" x2="640" y2="848"/>
<text class="sm" x="47" y="868"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="868"><tspan class="k">Parliament’s power to amend the constitution</tspan></text>
<line class="gx" x1="40" y1="879" x2="640" y2="879"/>

<text class="sm" x="237" y="899"><tspan class="r">13 &amp; 368</tspan></text>
<line class="gx" x1="40" y1="910" x2="640" y2="910"/>
<rect class="gx" x="40" y="755" width="600" height="155"/>
<line class="gx" x1="230" y1="755" x2="230" y2="786"/>

<text x="44" y="938"><tspan class="h" style="font-weight:700">Basic structure doctrine:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It overruled its earlier verdict</tspan></text>
<text x="56" y="960"><tspan class="k">delivered in the Golak Nath case⁸ (1967). It held that the Parliament, by exercising its</tspan></text>
<text x="56" y="982"><tspan class="k">constituent power under</tspan><tspan class="r"> Article 368</tspan><tspan class="k">, can amend any or all the provisions of the</tspan></text>
<text x="56" y="1004"><tspan class="k">Constitution including those relating to the fundamental rights, but except the</tspan><tspan class="b"> ‘basic</tspan></text>
<text x="56" y="1026"><tspan class="b">structure’</tspan><tspan class="k"> of the constitution. It upheld the validity of the</tspan><tspan class="r"> 24th Amendment Act (1971)</tspan></text>
<text x="56" y="1048"><tspan class="k">which inserted Clause (4) in</tspan><tspan class="r"> Article 13</tspan><tspan class="k"> and Clause (3) in</tspan><tspan class="r"> Article 368</tspan><tspan class="k">. Further, the court</tspan></text>
<text x="56" y="1070"><tspan class="k">held that Sections 2(a) and 2(b) of the</tspan><tspan class="r"> 25th Amendment Act (1971)</tspan><tspan class="k"> as valid. On the</tspan></text>
<text x="56" y="1092"><tspan class="k">other hand, it declared the first part of</tspan><tspan class="r"> Section 3</tspan><tspan class="k"> of the</tspan><tspan class="r"> 25th Amendment Act (1971)</tspan><tspan class="k"> as</tspan></text>
<text x="56" y="1114"><tspan class="k">valid and the second part⁹, as invalid. Moreover, the court validated the</tspan><tspan class="r"> 29th</tspan></text>
<text x="56" y="1136"><tspan class="r">Amendment Act (1971)</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1164"><tspan class="h" style="font-weight:700">Limit on amending power:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="1186"><tspan class="k">emergence of the doctrine of basic structure of the constitution as a limitation on the</tspan></text>
<text x="56" y="1208"><tspan class="k">amending power of the Parliament. The Supreme Court has applied this doctrine in</tspan></text>
<text x="56" y="1230"><tspan class="k">subsequent cases in examining and deciding the validity of amendments to the</tspan></text>
<text x="56" y="1252"><tspan class="k">constitution. It also enlarged the list of elements of the basic structure in various cases.</tspan></text>
<text x="56" y="1274"><tspan class="k">Further, as a follow-up of this judgement, the</tspan><tspan class="r"> 42nd Amendment Act (1976)</tspan><tspan class="k"> gave the</tspan></text>
<text x="56" y="1296"><tspan class="k">Parliament an unlimited and uncontrolled power to amend the constitution. This is</tspan></text>
<text x="56" y="1318"><tspan class="k">explained below in the next case.</tspan></text>
<rect class="bx" x="136" y="1330" width="249" height="30" rx="3"/>
<text class="sm" x="260" y="1349" text-anchor="middle"><tspan class="k">Shankari Prasad 1951:</tspan><tspan class="r"> FRs amendable</tspan></text>
<line class="ln" x1="388" y1="1345" x2="408" y2="1345" marker-end="url(#ah)"/>

<text class="sm" x="477" y="1349" text-anchor="middle"><tspan class="k">Sajjan Singh 1964</tspan></text>

<text class="sm" x="266" y="1403" text-anchor="middle"><tspan class="k">Golak Nath 1967:</tspan><tspan class="r"> not amendable</tspan></text>

<text class="sm" x="340" y="1457" text-anchor="middle"><tspan class="r" style="font-weight:700">Kesavananda 1973: basic</tspan></text>
<text class="sm" x="340" y="1475" text-anchor="middle"><tspan class="r" style="font-weight:700">structure</tspan></text>
<text class="xs" x="50" y="1522"><tspan class="r" style="font-weight:700">8</tspan><tspan class="k"> I.C. Golak Nath vs. State of Punjab (1967).</tspan></text>
<rect x="40" y="1500" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1567"><tspan class="r" style="font-weight:700">9</tspan><tspan class="k"> The second part stood as follows: “No law containing a declaration that it is for giving effect to</tspan></text>
<text class="xs" x="50" y="1585"><tspan class="k">such policy shall be called in question</tspan></text>
<rect x="40" y="1545" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sh" x="40" y="1622"><tspan class="r" style="font-weight:700">Indira Nehru Gandhi Case (1975)</tspan></text>
<text class="sm" x="135" y="1654" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1654" text-anchor="middle"><tspan class="r" style="font-weight:700">Indira Nehru Gandhi vs. Raj Narain</tspan></text>
<line class="gx" x1="40" y1="1665" x2="640" y2="1665"/>

<text class="sm" x="237" y="1685"><tspan class="r">1975</tspan></text>
<line class="gx" x1="40" y1="1696" x2="640" y2="1696"/>

<text class="sm" x="237" y="1716"><tspan class="k">Election case</tspan></text>
<line class="gx" x1="40" y1="1727" x2="640" y2="1727"/>
<text class="sm" x="47" y="1747"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1747"><tspan class="k">Basic structure of the constitution</tspan></text>
<line class="gx" x1="40" y1="1758" x2="640" y2="1758"/>

<text class="sm" x="237" y="1778"><tspan class="r">329A (Repealed)⁹ᵃ</tspan></text>
<line class="gx" x1="40" y1="1789" x2="640" y2="1789"/>
<rect class="gx" x="40" y="1634" width="600" height="155"/>
<line class="gx" x1="230" y1="1634" x2="230" y2="1665"/>

<text x="44" y="1817"><tspan class="h" style="font-weight:700">Art. 329A(4) struck down:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It reaffirmed the applicability of</tspan></text>
<text x="56" y="1839"><tspan class="k">the doctrine of basic structure of the constitution. Accordingly, it struck down clause (4)</tspan></text>
<text x="56" y="1861"><tspan class="k">of</tspan><tspan class="r"> Article 329A</tspan><tspan class="k"> that was inserted by the</tspan><tspan class="r"> 39th Amendment Act (1975)</tspan><tspan class="k">. This provision</tspan></text>
<text x="56" y="1883"><tspan class="k">had kept the election disputes involving the Prime Minister and the Speaker of Lok</tspan></text>
<text x="56" y="1905"><tspan class="k">Sabha outside the jurisdiction of all courts. The Supreme Court held that this provision</tspan></text>
<text x="56" y="1927"><tspan class="k">was beyond the amending power of the Parliament because it affected the basic</tspan></text>
<text x="56" y="1949"><tspan class="k">structure of the constitution.</tspan></text>
<text x="44" y="1977"><tspan class="h" style="font-weight:700">42nd Amendment – Art. 368(4), (5):</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Following the above</tspan></text>
<text x="56" y="1999"><tspan class="k">two judgements of the Supreme Court in Kesavananda Bharati and Indira Nehru Gandhi</tspan></text>
<text x="56" y="2021"><tspan class="k">cases, the</tspan><tspan class="r"> 42nd Amendment Act (1976)</tspan><tspan class="k"> inserted two new Clauses (4) and (5) in</tspan></text>
<text x="56" y="2043"><tspan class="r">Article 368</tspan><tspan class="k">. The Clause (4) provided that an amendment of the Constitution (including</tspan></text>
<text x="56" y="2065"><tspan class="k">the provisions relating to the fundamental rights) made under</tspan><tspan class="r"> Article 368</tspan><tspan class="k"> shall not be</tspan></text>
<text x="56" y="2087"><tspan class="k">called in question in any court on any ground. While the Clause (5) declared that there</tspan></text>
<text x="56" y="2109"><tspan class="k">shall be no limitation whatever on the constituent power of Parliament under</tspan><tspan class="r"> Article</tspan></text>
<text x="56" y="2131"><tspan class="r">368</tspan><tspan class="k">. Thus, it is clear that these two Clauses were inserted in order to dilute the above</tspan></text>
<text x="56" y="2153"><tspan class="k">doctrine of basic structure that has been held to be a limitation on the amending power</tspan></text>
<text x="56" y="2175"><tspan class="k">of the Parliament.</tspan></text>
