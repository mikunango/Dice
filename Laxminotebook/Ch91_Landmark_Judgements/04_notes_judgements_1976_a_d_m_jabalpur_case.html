<text class="r hd" x="340" y="53" text-anchor="middle">Landmark Judgements – 4 (1976–1980)</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">A.D.M. Jabalpur Case (1976)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">A.D.M. Jabalpur vs. Shivakant Shukla</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">1976</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="188"><tspan class="k">Habeas Corpus case</tspan></text>
<line class="gx" x1="40" y1="199" x2="640" y2="199"/>
<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Right to life and personal liberty during the emergency</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">21 &amp; 359</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>
<line class="gx" x1="230" y1="168" x2="230" y2="199"/>
<line class="gx" x1="230" y1="199" x2="230" y2="230"/>
<line class="gx" x1="230" y1="230" x2="230" y2="261"/>
<text x="44" y="289"><tspan class="h" style="font-weight:700">Habeas corpus suspended:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> is the</tspan></text>
<text x="56" y="311"><tspan class="k">sole repository of the right to life and personal liberty against the state. If the</tspan></text>
<text x="56" y="333"><tspan class="k">enforcement of that right is suspended by a Presidential Order under</tspan><tspan class="r"> Article 359</tspan><tspan class="k">, then</tspan></text>
<text x="56" y="355"><tspan class="k">the detenu will have no locus standi to a writ petition for challenging the legality of his</tspan></text>
<text x="56" y="377"><tspan class="k">detention. In view of the Presidential Order dated 27th June 1975, no person has any</tspan></text>
<text x="56" y="399"><tspan class="k">locus standi to move any petition before a High Court under</tspan><tspan class="r"> Article 226</tspan><tspan class="k"> for a writ of</tspan></text>
<text x="56" y="421"><tspan class="k">habeas corpus or any other writ to challenge the legality of a detention order on any</tspan></text>
<text x="56" y="443"><tspan class="k">ground. Accordingly, the court upheld the constitutional validity of</tspan><tspan class="r"> Section 16A(9)</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="465"><tspan class="k">Maintenance of Internal Security Act (MISA), 1971.</tspan></text>
<text x="44" y="493"><tspan class="h" style="font-weight:700">44th Amendment – Art. 21 non-suspendable:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> In this case,</tspan></text>
<text x="56" y="515"><tspan class="k">the Supreme Court took a restrictive meaning of right to life and personal liberty under</tspan></text>
<text x="56" y="537"><tspan class="r">Article 21</tspan><tspan class="k"> and gave a seriously flawed judgement. The court argued that any claim to a</tspan></text>
<text x="56" y="559"><tspan class="k">writ of habeas corpus on any ground amounted to the enforcement of the right to life</tspan></text>
<text x="56" y="581"><tspan class="k">and personal liberty which had been suspended by the Presidential Order. Consequently,</tspan></text>
<text x="56" y="603"><tspan class="k">it failed to fulfill its role as the defender and guarantor of the fundamental rights of the</tspan></text>
<text x="56" y="625"><tspan class="k">citizens during the period of emergency (1975–77). Later, the</tspan><tspan class="r"> 44th Amendment Act</tspan></text>
<text x="56" y="647"><tspan class="r">(1978)</tspan><tspan class="k"> amended</tspan><tspan class="r"> Article 359</tspan><tspan class="k"> to the effect that the enforcement of the right to life and</tspan></text>
<text x="56" y="669"><tspan class="k">personal liberty under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> can not be suspended by a Presidential Order. In view of</tspan></text>
<text x="56" y="691"><tspan class="k">this amendment, the judgement delivered in this case is no longer a good law and is left</tspan></text>
<text x="56" y="713"><tspan class="k">only of academic importance.</tspan></text>
<text class="sh" x="40" y="741"><tspan class="r" style="font-weight:700">Maneka Gandhi Case (1978)</tspan></text>
<text class="sm" x="135" y="773" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="773" text-anchor="middle"><tspan class="r" style="font-weight:700">Maneka Gandhi vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="784" x2="640" y2="784"/>
<text class="sm" x="47" y="804"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="804"><tspan class="r">1978</tspan></text>
<line class="gx" x1="40" y1="815" x2="640" y2="815"/>
<text class="sm" x="47" y="835"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="835"><tspan class="k">Personal Liberty case</tspan></text>
<line class="gx" x1="40" y1="846" x2="640" y2="846"/>
<text class="sm" x="47" y="866"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="866"><tspan class="k">Procedure established by law</tspan></text>
<line class="gx" x1="40" y1="877" x2="640" y2="877"/>
<text class="sm" x="47" y="897"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="897"><tspan class="r">21</tspan></text>
<line class="gx" x1="40" y1="908" x2="640" y2="908"/>
<rect class="gx" x="40" y="753" width="600" height="155"/>
<line class="gx" x1="230" y1="753" x2="230" y2="784"/>
<line class="gx" x1="230" y1="784" x2="230" y2="815"/>
<line class="gx" x1="230" y1="815" x2="230" y2="846"/>
<line class="gx" x1="230" y1="846" x2="230" y2="877"/>
<line class="gx" x1="230" y1="877" x2="230" y2="908"/>
<text x="44" y="936"><tspan class="h" style="font-weight:700">Just, fair and reasonable procedure:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It overruled its earlier</tspan></text>
<text x="56" y="958"><tspan class="k">judgement delivered in the A.K. Gopalan case¹⁰ (1950). It declared</tspan><tspan class="r"> section 10(3)(c)</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="980"><tspan class="k">the Passport Act (1967) as not violative of</tspan><tspan class="r"> Articles 14, 19(1)(a)</tspan><tspan class="k"> or (g) and 21 and</tspan></text>
<text x="56" y="1002"><tspan class="k">hence, valid. But, it laid down the following propositions: (a)</tspan><tspan class="r"> Articles 14, 19 and 21</tspan><tspan class="k"> are</tspan></text>
<text x="56" y="1024"><tspan class="k">not mutually exclusive which means that a law depriving a person of</tspan><tspan class="b"> ‘personal liberty’</tspan></text>
<text x="56" y="1046"><tspan class="k">has not only to stand the test of</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> but it must also stand the test of</tspan><tspan class="r"> Articles</tspan></text>
<text x="56" y="1068"><tspan class="r">14 and 19</tspan><tspan class="k">; (b) The expression</tspan><tspan class="b"> ‘personal liberty’</tspan><tspan class="k"> in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> is of the widest amplitude</tspan></text>
<text x="56" y="1090"><tspan class="k">and it covers a variety of rights which go to constitute the personal liberty of a man and</tspan></text>
<text x="56" y="1112"><tspan class="k">some of them have been raised to the status of distinct fundamental rights and given</tspan></text>
<text x="56" y="1134"><tspan class="k">additional protection under</tspan><tspan class="r"> Article 19</tspan><tspan class="k">; (c) The right to life under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> includes all</tspan></text>
<text x="56" y="1156"><tspan class="k">those aspects of life which go to make a man’s life meaningful, complete and worth</tspan></text>
<text x="56" y="1178"><tspan class="k">living. Further, the right to</tspan><tspan class="b"> ‘live’</tspan><tspan class="k"> is not merely confined to physical existence but it</tspan></text>
<text x="56" y="1200"><tspan class="k">includes within its ambit the right to live with human dignity; and (d) The expression</tspan></text>
<text x="56" y="1222"><tspan class="b">‘procedure established by law’</tspan><tspan class="k"> in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> means that the procedure prescribed by law</tspan></text>
<text x="56" y="1244"><tspan class="k">must be just, fair and reasonable and not arbitrary, fanciful or oppressive. In order that</tspan></text>
<text x="56" y="1266"><tspan class="k">the procedure is just, fair and reasonable, the procedure should confirm to the principles</tspan></text>
<text x="56" y="1288"><tspan class="k">of</tspan><tspan class="b"> “natural justice”</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1316"><tspan class="h" style="font-weight:700">Due process &amp; golden triangle:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> By taking a wider</tspan></text>
<text x="56" y="1338"><tspan class="k">interpretation of the</tspan><tspan class="r"> Article 21</tspan><tspan class="k">, this judgement led to the following: (i) It introduced the</tspan></text>
<text x="56" y="1360"><tspan class="k">American concept of</tspan><tspan class="b"> ‘due process of law’</tspan><tspan class="k"> in Indian judicial interpretation; (ii) It firmly</tspan></text>
<text x="56" y="1382"><tspan class="k">established the</tspan><tspan class="b"> ‘golden triangle’</tspan><tspan class="k"> rule i.e., inter-relation of</tspan><tspan class="r"> Articles 14, 19 and 21</tspan><tspan class="k">; and (iii)</tspan></text>
<text x="56" y="1404"><tspan class="k">It expanded the scope of</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and paved the way for declaring a number of rights</tspan></text>
<text x="56" y="1426"><tspan class="k">as integral part of</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> in the subsequent cases.</tspan></text>
<rect class="bx" x="108" y="1438" width="228" height="30" rx="3"/>
<text class="sm" x="222" y="1457" text-anchor="middle"><tspan class="k">A.K. Gopalan 1950:</tspan><tspan class="r"> narrow Art. 21</tspan></text>
<line class="ln" x1="339" y1="1453" x2="359" y2="1453" marker-end="url(#ah)"/>
<rect class="bx" x="362" y="1438" width="210" height="30" rx="3"/>
<text class="sm" x="467" y="1457" text-anchor="middle"><tspan class="k">ADM Jabalpur 1976:</tspan><tspan class="r"> suspended</tspan></text>
<line class="ln" x1="340" y1="1469" x2="340" y2="1490" marker-end="url(#ah)"/>
<rect class="bx" x="174" y="1492" width="181" height="30" rx="3"/>
<text class="sm" x="264" y="1511" text-anchor="middle"><tspan class="r" style="font-weight:700">Maneka 1978: due process</tspan></text>
<line class="ln" x1="358" y1="1507" x2="378" y2="1507" marker-end="url(#ah)"/>
<rect class="bx" x="381" y="1492" width="126" height="30" rx="3"/>
<text class="sm" x="444" y="1511" text-anchor="middle"><tspan class="k">44th Amdt 1978</tspan></text>
<text class="sh" x="40" y="1550"><tspan class="r" style="font-weight:700">Bachan Singh Case (1980)</tspan></text>
<text class="sm" x="135" y="1582" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1582" text-anchor="middle"><tspan class="r" style="font-weight:700">Bachan Singh vs. State of Punjab</tspan></text>
<line class="gx" x1="40" y1="1593" x2="640" y2="1593"/>
<text class="sm" x="47" y="1613"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1613"><tspan class="r">1980</tspan></text>
<line class="gx" x1="40" y1="1624" x2="640" y2="1624"/>
<text class="sm" x="47" y="1644"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1644"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1655" x2="640" y2="1655"/>
<text class="sm" x="47" y="1675"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1675"><tspan class="k">Constitutional validity of death penalty</tspan></text>
<line class="gx" x1="40" y1="1686" x2="640" y2="1686"/>
<text class="sm" x="47" y="1706"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1706"><tspan class="r">19 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="1717" x2="640" y2="1717"/>
<rect class="gx" x="40" y="1562" width="600" height="155"/>
<line class="gx" x1="230" y1="1562" x2="230" y2="1593"/>
<line class="gx" x1="230" y1="1593" x2="230" y2="1624"/>
<line class="gx" x1="230" y1="1624" x2="230" y2="1655"/>
<line class="gx" x1="230" y1="1655" x2="230" y2="1686"/>
<line class="gx" x1="230" y1="1686" x2="230" y2="1717"/>
<text x="44" y="1745"><tspan class="h" style="font-weight:700">Death penalty valid:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It ruled that the provision of death</tspan></text>
<text x="56" y="1767"><tspan class="k">penalty (capital punishment) in</tspan><tspan class="r"> Section 302</tspan><tspan class="k"> of the Indian Penal Code, as an alternative</tspan></text>
<text x="56" y="1789"><tspan class="k">punishment for murder, is not unreasonable. Hence, this provision does not violate the</tspan></text>
<text x="56" y="1811"><tspan class="k">letter or the ethos of</tspan><tspan class="r"> Article 19</tspan><tspan class="k">. It stated that</tspan><tspan class="r"> Article 19(1)</tspan><tspan class="k"> does not guarantee the</tspan></text>
<text x="56" y="1833"><tspan class="k">activity of committing a murder. Further, it held that the provision of death penalty also</tspan></text>
<text x="56" y="1855"><tspan class="k">does not violate</tspan><tspan class="r"> Article 21</tspan><tspan class="k">. It observed that</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> recognises the right of the State</tspan></text>
<text x="56" y="1877"><tspan class="k">to deprive a person of his life or personal liberty in accordance with fair, just and</tspan></text>
<text x="56" y="1899"><tspan class="k">reasonable procedure established by a valid law. However, the court held that the death</tspan></text>
<text x="56" y="1921"><tspan class="k">penalty for murder should be an exception rather than the rule. It said that this penalty</tspan></text>
<text x="56" y="1943"><tspan class="k">must be confined to the</tspan><tspan class="b"> ‘rarest of rare cases’</tspan><tspan class="k">, when the alternative option is</tspan></text>
<text x="56" y="1965"><tspan class="k">unquestionably foreclosed. Further, it said that while making the choice of death penalty,</tspan></text>
<text x="56" y="1987"><tspan class="k">the exceptional and grave circumstances of both the crime as well as the criminal should</tspan></text>
<text x="56" y="2009"><tspan class="k">be taken into consideration.</tspan></text>
<text x="44" y="2037"><tspan class="h" style="font-weight:700">Rarest of rare doctrine:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the laying</tspan></text>
<text x="56" y="2059"><tspan class="k">down of the doctrine of</tspan><tspan class="b"> ‘rarest of rare cases’</tspan><tspan class="k"> for awarding the death penalty. This</tspan></text>
<text x="56" y="2081"><tspan class="k">doctrine influenced the later judgements delivered by the Supreme Court in various</tspan></text>
<text x="56" y="2103"><tspan class="k">subsequent cases.</tspan></text>
