<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">LILY THOMAS CASE (2013)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Lily Thomas vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">2013</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>

<text class="sm" x="237" y="219"><tspan class="k">Criminalization of politics</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">102 &amp; 191</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Sec. 8(4) RPA struck down:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the members of</tspan></text>
<text x="56" y="311"><tspan class="k">the Parliament and the State Legislatures, who have been convicted for offences, will</tspan></text>
<text x="56" y="333"><tspan class="k">loose their membership of the House immediately (i.e., the disqualification takes place</tspan></text>
<text x="56" y="355"><tspan class="k">from the date of conviction). It struck down</tspan><tspan class="r"> Section 8(4)</tspan><tspan class="k"> of the Representation of the</tspan></text>
<text x="56" y="377"><tspan class="k">People Act, 1951 and declared the same as unconstitutional. Under this Section, the</tspan></text>
<text x="56" y="399"><tspan class="k">convicted members of the Parliament and the State Legislatures are given three months</tspan></text>
<text x="56" y="421"><tspan class="k">time to appeal in the higher court and get a stay on their conviction and sentence by</tspan></text>
<text x="56" y="443"><tspan class="k">the trial court. The court ruled that the Parliament does not have the power under</tspan></text>
<text x="56" y="465"><tspan class="r">Articles 102 and 191</tspan><tspan class="k"> to make different laws for a person to be disqualified for being</tspan></text>
<text x="56" y="487"><tspan class="k">chosen as a member and for a person to be disqualified for continuing as a member of</tspan></text>
<text x="56" y="509"><tspan class="k">the Parliament or the State Legislature. Hence, the above</tspan><tspan class="r"> Section 8(4)</tspan><tspan class="k">, which carved</tspan></text>
<text x="56" y="531"><tspan class="k">out a saving in the case of a sitting member from disqualification, is beyond the powers</tspan></text>
<text x="56" y="553"><tspan class="k">conferred on the Parliament and is ultra vires the constitution.</tspan></text>
<text x="44" y="581"><tspan class="h" style="font-weight:700">Immediate disqualification of convicted legislators:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This</tspan></text>
<text x="56" y="603"><tspan class="k">judgement led to the immediate disqualification of a number of convicted members of</tspan></text>
<text x="56" y="625"><tspan class="k">the Parliament and the State Legislatures. In order to nullify this ruling of the Supreme</tspan></text>
<text x="56" y="647"><tspan class="k">Court, the Representation of the People (Second Amendment and Validation) Bill, 2013</tspan></text>
<text x="56" y="669"><tspan class="k">was introduced in the Parliament. However, this Bill was later withdrawn by the</tspan></text>
<text x="56" y="691"><tspan class="k">Government.</tspan></text>
<text class="sh" x="40" y="719"><tspan class="r" style="font-weight:700">T.S.R. Subramanian Case (2013)</tspan></text>
<text class="sm" x="135" y="751" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="751" text-anchor="middle"><tspan class="r" style="font-weight:700">T.S.R. Subramanian vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="762" x2="640" y2="762"/>
<text class="sm" x="47" y="782"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="782"><tspan class="r">2013</tspan></text>
<line class="gx" x1="40" y1="793" x2="640" y2="793"/>

<text class="sm" x="237" y="844"><tspan class="k">Civil service reforms</tspan></text>
<line class="gx" x1="40" y1="855" x2="640" y2="855"/>
<text class="sm" x="47" y="875"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="875"><tspan class="r">—</tspan></text>
<line class="gx" x1="40" y1="886" x2="640" y2="886"/>
<rect class="gx" x="40" y="731" width="600" height="155"/>

<text x="44" y="914"><tspan class="h" style="font-weight:700">Civil service reforms:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It issued various directions to the</tspan></text>
<text x="56" y="936"><tspan class="k">central government, state governments and union territories aimed at bringing in civil</tspan></text>
<text x="56" y="958"><tspan class="k">service reforms for the effective, efficient and transparent administration as well as the</tspan></text>
<text x="56" y="980"><tspan class="k">accountability and stability of civil servants. These are (i) constitution of the Civil</tspan></text>
<text x="56" y="1002"><tspan class="k">Service Boards to guide and advice the governments on transfers, postings, disciplinary</tspan></text>
<text x="56" y="1024"><tspan class="k">action and other service matters, (ii) providing a fixed minimum tenure of service to</tspan></text>
<text x="56" y="1046"><tspan class="k">various civil servants, and (iii) mandating that the civil servants should not act on the</tspan></text>
<text x="56" y="1068"><tspan class="k">basis of verbal or oral instructions, orders, suggestions, proposals and directions and these</tspan></text>
<text x="56" y="1090"><tspan class="k">should be in writing and also formally recorded if given orally.</tspan></text>
<text x="44" y="1118"><tspan class="h" style="font-weight:700">Cadre Rules amended (2014):</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="1140"><tspan class="k">making of amendments in Rule 7 of the IAS, IPS and IFoS (Cadre) Rules vide a</tspan></text>
<text x="56" y="1162"><tspan class="k">notification issued in 2014. For the Central Services, the respective Cadre Controlling</tspan></text>
<text x="56" y="1184"><tspan class="k">Authorities have been directed to implement the above directions of the Supreme Court.</tspan></text>
<text x="56" y="1206"><tspan class="k">However, the Civil Service Boards in the States/UTs are not functioning effectively.</tspan></text>
<text class="sh" x="40" y="1234"><tspan class="r" style="font-weight:700">NATIONAL LEGAL SERVICES AUTHORITY CASE (2014)</tspan></text>
<text class="sm" x="135" y="1266" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1266" text-anchor="middle"><tspan class="r" style="font-weight:700">National Legal Services Authority vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="1277" x2="640" y2="1277"/>
<text class="sm" x="47" y="1297"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1297"><tspan class="r">2014</tspan></text>
<line class="gx" x1="40" y1="1308" x2="640" y2="1308"/>
<text class="sm" x="47" y="1328"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1328"><tspan class="k">—</tspan></text>

<text class="sm" x="47" y="1359"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1359"><tspan class="k">Rights of transgender persons</tspan></text>
<line class="gx" x1="40" y1="1370" x2="640" y2="1370"/>
<text class="sm" x="47" y="1390"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1390"><tspan class="r">14 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="1401" x2="640" y2="1401"/>
<rect class="gx" x="40" y="1246" width="600" height="155"/>
<line class="gx" x1="230" y1="1246" x2="230" y2="1277"/>
<line class="gx" x1="230" y1="1277" x2="230" y2="1308"/>
<line class="gx" x1="230" y1="1308" x2="230" y2="1339"/>

<text x="44" y="1429"><tspan class="h" style="font-weight:700">Third gender recognised:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It declared Transgenders along</tspan></text>
<text x="56" y="1451"><tspan class="k">with Hijaras/Eunuchs as</tspan><tspan class="b"> ‘third gender’</tspan><tspan class="k"> and held that the fundamental rights granted</tspan></text>
<text x="56" y="1473"><tspan class="k">under Part III of the constitution are equally applicable to them. It also upheld</tspan></text>
<text x="56" y="1495"><tspan class="k">Transgender persons’ right to decide their self-identified gender and directed the Central</tspan></text>
<text x="56" y="1517"><tspan class="k">and State Governments to grant legal recognition of their gender identity such as male,</tspan></text>
<text x="56" y="1539"><tspan class="k">female or as third gender. It also directed the Central and State Governments to take</tspan></text>
<text x="56" y="1561"><tspan class="k">steps to treat them as socially and educationally backward classes of citizens and extend</tspan></text>
<text x="56" y="1583"><tspan class="k">all kinds of reservation in cases of admission in educational institutions and for public</tspan></text>
<text x="56" y="1605"><tspan class="k">appointments. The court held that non-recognition of Transgender denies them equal</tspan></text>
<text x="56" y="1627"><tspan class="k">protection of law under</tspan><tspan class="r"> Article 14</tspan><tspan class="k">. If further held that</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> protects one’s right of</tspan></text>
<text x="56" y="1649"><tspan class="k">self-determination of the gender to which a person belongs. In other words, gender</tspan></text>
<text x="56" y="1671"><tspan class="k">identify is integral to the dignity of an individual and is at the core of</tspan><tspan class="b"> ‘personal</tspan></text>
<text x="56" y="1693"><tspan class="b">autonomy’</tspan><tspan class="k"> and</tspan><tspan class="b"> ‘self-determination’</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1721"><tspan class="h" style="font-weight:700">Transgender Persons Act 2019:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="1743"><tspan class="k">enactment of the Transgender Persons (Protection of Rights) Act, 2019. The objective of</tspan></text>
<text x="56" y="1765"><tspan class="k">this act is to provide for protection of rights of transgender persons and their welfare.</tspan></text>
<text x="56" y="1787"><tspan class="k">This act prohibits discrimination against transgender persons and confers right upon</tspan></text>
<text x="56" y="1809"><tspan class="k">them to be recognized as such, and a right to self-perceived gender identity.</tspan></text>
