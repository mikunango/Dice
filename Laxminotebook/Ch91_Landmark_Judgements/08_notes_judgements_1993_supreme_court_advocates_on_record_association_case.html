<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Supreme Court Advocates-on-Record Association Case (1993)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court Advocates- on-Record Association vs. Union</tspan></text>
<text class="sm" x="435" y="145" text-anchor="middle"><tspan class="r" style="font-weight:700">of India</tspan></text>
<line class="gx" x1="40" y1="156" x2="640" y2="156"/>
<text class="sm" x="47" y="176"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="176"><tspan class="r">1993</tspan></text>
<line class="gx" x1="40" y1="187" x2="640" y2="187"/>
<text class="sm" x="47" y="207"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="207"><tspan class="k">Second Judges case</tspan></text>
<line class="gx" x1="40" y1="218" x2="640" y2="218"/>
<text class="sm" x="47" y="238"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="238"><tspan class="k">Appointment of Supreme Court and High Court Judges</tspan></text>
<line class="gx" x1="40" y1="249" x2="640" y2="249"/>
<text class="sm" x="47" y="269"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="269"><tspan class="r">124 &amp; 217</tspan></text>
<line class="gx" x1="40" y1="280" x2="640" y2="280"/>
<rect class="gx" x="40" y="106" width="600" height="174"/>
<line class="gx" x1="230" y1="106" x2="230" y2="156"/>
<line class="gx" x1="230" y1="156" x2="230" y2="187"/>
<line class="gx" x1="230" y1="187" x2="230" y2="218"/>

<line class="gx" x1="230" y1="249" x2="230" y2="280"/>
<text x="44" y="308"><tspan class="h" style="font-weight:700">Collegium – CJI primacy:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It overruled its earlier judgement</tspan></text>
<text x="56" y="330"><tspan class="k">delivered in the S.P. Gupta case¹⁵ (1981) which is popularly known as the First Judges</tspan></text>
<text x="56" y="352"><tspan class="k">case. It held that the judges of the Supreme Court and High Courts shall be appointed</tspan></text>
<text x="56" y="374"><tspan class="k">by the President in accordance with the advice tendered by the Chief Justice of India.</tspan></text>
<text x="56" y="396"><tspan class="k">But the Chief Justice of India shall tender such advice after taking into consideration</tspan></text>
<text x="56" y="418"><tspan class="k">the views of two of his senior most colleagues. This means that the court has changed</tspan></text>
<text x="56" y="440"><tspan class="k">the meaning of the word</tspan><tspan class="b"> ‘consultation’</tspan><tspan class="k"> in</tspan><tspan class="r"> Articles 124</tspan><tspan class="k"> (2) and 217(1) to that of</tspan></text>
<text x="56" y="462"><tspan class="b">‘concurrence’</tspan><tspan class="k">. Further, it held that the senior-most judge of the Supreme Court should</tspan></text>
<text x="56" y="484"><tspan class="k">be appointed as the Chief Justice of India.</tspan></text>
<text x="44" y="512"><tspan class="h" style="font-weight:700">Memorandum of Procedure:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Consequent to this judgement</tspan></text>
<text x="56" y="534"><tspan class="k">and also the Advisory Opinion tendered in the Third Judges case¹⁶ (1998), a</tspan></text>
<text x="56" y="556"><tspan class="k">Memorandum of Procedure for appointment of judges to the Supreme Court and the High</tspan></text>
<text x="56" y="578"><tspan class="k">Courts was formulated, and is being followed for appointment. This procedure, invented</tspan></text>
<text x="56" y="600"><tspan class="k">by the judiciary, is known as the</tspan><tspan class="b"> “collegium system”</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="628"><tspan class="r" style="font-weight:700">S.R. Bommai Case (1994)</tspan></text>
<text class="sm" x="135" y="660" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="660" text-anchor="middle"><tspan class="r" style="font-weight:700">S.R. Bommai vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="671" x2="640" y2="671"/>
<text class="sm" x="47" y="691"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="691"><tspan class="r">1994</tspan></text>
<line class="gx" x1="40" y1="702" x2="640" y2="702"/>
<text class="sm" x="47" y="722"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="722"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="733" x2="640" y2="733"/>
<text class="sm" x="47" y="753"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="753"><tspan class="k">President’s rule</tspan></text>
<line class="gx" x1="40" y1="764" x2="640" y2="764"/>
<text class="sm" x="47" y="784"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="784"><tspan class="r">356</tspan></text>
<line class="gx" x1="40" y1="795" x2="640" y2="795"/>
<rect class="gx" x="40" y="640" width="600" height="155"/>
<line class="gx" x1="230" y1="640" x2="230" y2="671"/>
<line class="gx" x1="230" y1="671" x2="230" y2="702"/>
<line class="gx" x1="230" y1="702" x2="230" y2="733"/>
<line class="gx" x1="230" y1="733" x2="230" y2="764"/>
<line class="gx" x1="230" y1="764" x2="230" y2="795"/>
<text x="44" y="823"><tspan class="h" style="font-weight:700">Judicial review of President’s Rule:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It upheld the</tspan></text>
<text x="56" y="845"><tspan class="k">constitutional validity of the imposition of President’s rule under</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> in Madhya</tspan></text>
<text x="56" y="867"><tspan class="k">Pradesh, Himachal Pradesh and Rajasthan in 1992. On the other hand, it declared the</tspan></text>
<text x="56" y="889"><tspan class="k">imposition of President’s Rule in Nagaland in 1988, Karnataka in 1989 and Meghalaya in</tspan></text>
<text x="56" y="911"><tspan class="k">1991 as unconstitutional and invalid. Further, it laid down the following propositions with</tspan></text>
<text x="56" y="933"><tspan class="k">respect to</tspan><tspan class="r"> Article 356</tspan><tspan class="k">: (a) The validity of the proclamation issued by the President</tspan></text>
<text x="56" y="955"><tspan class="k">under</tspan><tspan class="r"> Article 356(1)</tspan><tspan class="k"> is subject to judicial review; (b) Burden lies on the Union</tspan></text>
<text x="56" y="977"><tspan class="k">Government to prove that the relevant material existed to justify the proclamation; (c)</tspan></text>
<text x="56" y="999"><tspan class="r">Article 74(2)</tspan><tspan class="k"> is not a bar against the scrutiny of the material on the basis of which the</tspan></text>
<text x="56" y="1021"><tspan class="k">President had arrived at his satisfaction; (d) If the proclamation issued by the President</tspan></text>
<text x="56" y="1043"><tspan class="k">is held invalid, then notwithstanding the fact that it is approved by both the Houses of</tspan></text>
<text x="56" y="1065"><tspan class="k">Parliament, it will be open for the court to restore the Legislative Assembly and the</tspan></text>
<text x="56" y="1087"><tspan class="k">Ministry; and (e) Secularism is a part of the basic structure of the constitution and</tspan></text>
<text x="56" y="1109"><tspan class="k">hence, the anti-secular acts of a State Government can lawfully be deemed to be a</tspan></text>
<text x="56" y="1131"><tspan class="k">ground for the imposition of the President’s Rule.</tspan></text>
<text x="44" y="1159"><tspan class="h" style="font-weight:700">Check on misuse of Art. 356:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement placed a</tspan></text>
<text x="56" y="1181"><tspan class="k">check on the arbitrary exercise of power under</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> by the Centre for the purpose</tspan></text>
<text x="56" y="1203"><tspan class="k">of imposing President’s Rule in the States.</tspan></text>
<text class="sh" x="40" y="1231"><tspan class="r" style="font-weight:700">Vishaka Case (1997)</tspan></text>
<text class="sm" x="135" y="1263" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1263" text-anchor="middle"><tspan class="r" style="font-weight:700">Vishaka vs. State of Rajasthan</tspan></text>
<line class="gx" x1="40" y1="1274" x2="640" y2="1274"/>
<text class="sm" x="47" y="1294"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1294"><tspan class="r">1997</tspan></text>
<line class="gx" x1="40" y1="1305" x2="640" y2="1305"/>
<text class="sm" x="47" y="1325"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1325"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1336" x2="640" y2="1336"/>
<text class="sm" x="47" y="1356"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1356"><tspan class="k">Sexual harassment of women at workplace</tspan></text>
<line class="gx" x1="40" y1="1367" x2="640" y2="1367"/>
<text class="sm" x="47" y="1387"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1387"><tspan class="r">15 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="1398" x2="640" y2="1398"/>
<rect class="gx" x="40" y="1243" width="600" height="155"/>
<line class="gx" x1="230" y1="1243" x2="230" y2="1274"/>
<line class="gx" x1="230" y1="1274" x2="230" y2="1305"/>
<line class="gx" x1="230" y1="1305" x2="230" y2="1336"/>
<line class="gx" x1="230" y1="1336" x2="230" y2="1367"/>
<line class="gx" x1="230" y1="1367" x2="230" y2="1398"/>
<text x="44" y="1426"><tspan class="h" style="font-weight:700">Sexual harassment violates Arts. 15 &amp; 21:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the</tspan></text>
<text x="56" y="1448"><tspan class="k">sexual harassment of women at the workplace is a violation of</tspan><tspan class="r"> Articles 15 and 21</tspan><tspan class="k">. It said</tspan></text>
<text x="56" y="1470"><tspan class="k">that it is the duty of the employer or other responsible person in workplaces or other</tspan></text>
<text x="56" y="1492"><tspan class="k">institutions, whether public or private, to prevent sexual harassment of working women.</tspan></text>
<text x="56" y="1514"><tspan class="k">It gave detailed directions on the subject, whose guidelines are to be strictly observed by</tspan></text>
<text x="56" y="1536"><tspan class="k">all employees, public or private, until suitable legislation is enacted on the subject.</tspan></text>
<text x="44" y="1564"><tspan class="h" style="font-weight:700">Vishaka Guidelines:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> By laying down a set of guidelines</tspan></text>
<text x="56" y="1586"><tspan class="k">(which came to be known as the</tspan><tspan class="b"> ‘Vishaka Guidelines’</tspan><tspan class="k">), this judgement filled the</tspan></text>
<text x="56" y="1608"><tspan class="k">legislative vacuum on the subject. Till this time, there was no domestic law to address</tspan></text>
<text x="56" y="1630"><tspan class="k">this issue except a few provisions of the Indian Penal Code. Later, the Sexual</tspan></text>
<text x="56" y="1652"><tspan class="k">Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013</tspan></text>
<text x="56" y="1674"><tspan class="k">was enacted to provide protection against sexual harassment of women at workplace and</tspan></text>
<text x="56" y="1696"><tspan class="k">for the prevention and redressal of complaints of sexual harassment.</tspan></text>
