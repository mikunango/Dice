<text x="44" y="289"><tspan class="h" style="font-weight:700">Flag hoisting – Art. 19(1)(a):</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the right to fly</tspan></text>
<text x="56" y="311"><tspan class="k">the national flag freely with respect and dignity is a fundamental right of a citizen</tspan></text>
<text x="56" y="333"><tspan class="k">within the meaning of the freedom of speech and expression guaranteed by</tspan><tspan class="r"> Article</tspan></text>
<text x="56" y="355"><tspan class="r">19(1)(a)</tspan><tspan class="k">. This right is an expression and manifestation of a citizen’s allegiance and</tspan></text>
<text x="56" y="377"><tspan class="k">feelings and sentiments of pride for the nation. However, it cannot be used for</tspan></text>
<text x="56" y="399"><tspan class="k">commercial purpose or otherwise.</tspan></text>
<text class="sh" x="40" y="427"><tspan class="r" style="font-weight:700">Prakash Singh Case (2006)</tspan></text>

<text class="sm" x="435" y="459" text-anchor="middle"><tspan class="r" style="font-weight:700">Prakash Singh vs. Union of India</tspan></text>

<text x="44" y="622"><tspan class="h" style="font-weight:700">Police reforms – seven directives:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It issued seven directives</tspan></text>
<text x="56" y="644"><tspan class="k">to the central government, state governments and union territories aimed at bringing in</tspan></text>
<text x="56" y="666"><tspan class="k">police reforms to ensure that the police machinery functions without any political</tspan></text>
<text x="56" y="688"><tspan class="k">interference. These are: (i) constitution of a State Security Commission; (ii) Selection of</tspan></text>
<text x="56" y="710"><tspan class="k">the DGP from amongst the three senior-most officers empanelled by the UPSC for the</tspan></text>
<text x="56" y="732"><tspan class="k">post and a minimum tenure of two years for the DGP, (iii) a minimum tenure of two</tspan></text>
<text x="56" y="754"><tspan class="k">years also for the police officers on operational duties, (iv) separation of the</tspan></text>
<text x="56" y="776"><tspan class="k">investigation police from the law and order police, (v) setting up a Police Establishment</tspan></text>
<text x="56" y="798"><tspan class="k">Board, (vi) setting up Police Complaints Authority at state and district levels, and (vii)</tspan></text>
<text x="56" y="820"><tspan class="k">setting up a National Security commission at the central level.</tspan></text>
<text x="44" y="848"><tspan class="h" style="font-weight:700">Partial police reforms:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="870"><tspan class="k">introduction of police reforms in the country but only partially and not fully. Also, it</tspan></text>
<text x="56" y="892"><tspan class="k">could not eliminate the political interference in the functioning of the police system,</tspan></text>
<text x="56" y="914"><tspan class="k">especially in the postings and transfers. Although State Security Commissions and Police</tspan></text>
<text x="56" y="936"><tspan class="k">Establishment Boards have been set-up in most of the states, they are not very</tspan></text>
<text x="56" y="958"><tspan class="k">effective in their functioning and lack the authority to make binding recommendations.</tspan></text>
<text x="56" y="980"><tspan class="k">However, in various cases, the High Courts have issued orders asking the statement</tspan></text>
<text x="56" y="1002"><tspan class="k">governments to comply with the above directives of the Supreme Court.</tspan></text>

<text x="44" y="1225"><tspan class="h" style="font-weight:700">Promotion quota amendments upheld:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It upheld the</tspan></text>
<text x="56" y="1247"><tspan class="k">constitutional validity of the</tspan><tspan class="r"> 77th Amendment Act (1995)</tspan><tspan class="k"> the</tspan><tspan class="r"> 81st Amendment Act</tspan></text>
<text x="56" y="1269"><tspan class="r">(2000)</tspan><tspan class="k">, the</tspan><tspan class="r"> 82nd Amendment Act (2000)</tspan><tspan class="k"> and the</tspan><tspan class="r"> 85th Amendment Act (2001)</tspan><tspan class="k">. It</tspan></text>
<text x="56" y="1291"><tspan class="k">said that the impugned Constitutional Amendment Acts by which</tspan><tspan class="r"> Article 16</tspan><tspan class="k">(4A) and</tspan></text>
<text x="56" y="1313"><tspan class="r">Article 16</tspan><tspan class="k">(4B) have been inserted flow from</tspan><tspan class="r"> Article 16(4)</tspan><tspan class="k">. They do not alter the</tspan></text>
<text x="56" y="1335"><tspan class="k">structure of</tspan><tspan class="r"> Article 16(4)</tspan><tspan class="k">. They retain the controlling factors or the compelling reasons,</tspan></text>
<text x="56" y="1357"><tspan class="k">namely, backwardness and inadequacy of representation which enable the State to</tspan></text>
<text x="56" y="1379"><tspan class="k">provide for reservation keeping in mind the overall efficiency of the State administration</tspan></text>
<text x="56" y="1401"><tspan class="k">under</tspan><tspan class="r"> Article 335</tspan><tspan class="k">. These impugned amendments are confined only to Scheduled Castes</tspan></text>
<text x="56" y="1423"><tspan class="k">and Scheduled Tribes. They do not obliterate any of the constitutional requirements,</tspan></text>
<text x="56" y="1445"><tspan class="k">namely, ceiling limit of 50% (quantitative limitation), the concept of creamy layer</tspan></text>
<text x="56" y="1467"><tspan class="k">(qualitative exclusion), the sub-classification between the OBCs on the one hand and</tspan></text>
<text x="56" y="1489"><tspan class="k">the SCs and the STs on the other hand as held in the Indra Sawhney case¹⁹ (1992) and</tspan></text>
<text x="56" y="1511"><tspan class="k">the concept of post-based roster with inbuilt concept of replacement as held in the R.K.</tspan></text>
<text x="56" y="1533"><tspan class="k">Sabharwal case²⁰ (1995).</tspan></text>
