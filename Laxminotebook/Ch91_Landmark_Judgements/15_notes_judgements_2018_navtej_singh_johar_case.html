<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Navtej Singh Johar Case (2018)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Navtej Singh Johar vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">2018</tspan></text>

<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>

<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Decriminalisation of homosexuality</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">14, 15, 19 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>
<line class="gx" x1="230" y1="168" x2="230" y2="199"/>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Section 377 read down:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It decriminalized homosexuality and</tspan></text>
<text x="56" y="311"><tspan class="k">partly struck down</tspan><tspan class="r"> Section 377</tspan><tspan class="k"> of the Indian Penal Code which criminalized carnal</tspan></text>
<text x="56" y="333"><tspan class="k">intercourse against the order of nature. It held that this Section is unconstitutional in so</tspan></text>
<text x="56" y="355"><tspan class="k">far as it criminalizes consensual sexual acts of adults of the same sex. It declared that</tspan></text>
<text x="56" y="377"><tspan class="k">this Section violates the right to equality under</tspan><tspan class="r"> Article 14</tspan><tspan class="k">, the right to non-discrimation</tspan></text>
<text x="56" y="399"><tspan class="k">under</tspan><tspan class="r"> Article 15</tspan><tspan class="k">, the right to freedom of expression under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> and the right</tspan></text>
<text x="56" y="421"><tspan class="k">to live a life of dignity and privacy under</tspan><tspan class="r"> Article 21</tspan><tspan class="k">. It said that the LGBT (lesbian, gay,</tspan></text>
<text x="56" y="443"><tspan class="k">bisexual and transgender) persons are entitled to the same fundamental rights as others.</tspan></text>
<text x="44" y="471"><tspan class="h" style="font-weight:700">Overruled Suresh Kumar Koushal:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement overruled</tspan></text>
<text x="56" y="493"><tspan class="k">the earlier judgement delivered in the Suresh Kumar Koushal case²⁹ (2013). In this case,</tspan></text>
<text x="56" y="515"><tspan class="k">the Supreme Court had upheld the constitutional validity of the above</tspan><tspan class="r"> Section 377</tspan><tspan class="k">.</tspan></text>
<text x="56" y="537"><tspan class="k">Before this judgement, the members of the LGBT community were compelled to live a</tspan></text>
<text x="56" y="559"><tspan class="k">life full of fear of reprisal and persecution. Now, they are legally permitted to engage in</tspan></text>
<text x="56" y="581"><tspan class="k">consensual sexual conduct. Notably, the provisions of the above</tspan><tspan class="r"> Section 377</tspan><tspan class="k"> will continue</tspan></text>
<text x="56" y="603"><tspan class="k">to govern non-consensual sexual acts against adults, all acts of carnal intercourse against</tspan></text>
<text x="56" y="625"><tspan class="k">minors and acts of bestiality.</tspan></text>
<text class="sh" x="40" y="653"><tspan class="r" style="font-weight:700">M. Siddiq Case (2019)</tspan></text>
<text class="sm" x="135" y="685" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="685" text-anchor="middle"><tspan class="r" style="font-weight:700">M. Siddiq vs. Mahant Suresh Das</tspan></text>
<line class="gx" x1="40" y1="696" x2="640" y2="696"/>
<text class="sm" x="47" y="716"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="716"><tspan class="r">2019</tspan></text>
<line class="gx" x1="40" y1="727" x2="640" y2="727"/>
<text class="sm" x="47" y="747"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="747"><tspan class="k">Ayodhya case</tspan></text>
<line class="gx" x1="40" y1="758" x2="640" y2="758"/>
<text class="sm" x="47" y="778"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="778"><tspan class="k">Ram Janmabhoomi-Babri Masjid land dispute</tspan></text>
<line class="gx" x1="40" y1="789" x2="640" y2="789"/>
<text class="sm" x="47" y="809"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="809"><tspan class="r">—</tspan></text>
<line class="gx" x1="40" y1="820" x2="640" y2="820"/>
<rect class="gx" x="40" y="665" width="600" height="155"/>
<line class="gx" x1="230" y1="665" x2="230" y2="696"/>
<line class="gx" x1="230" y1="696" x2="230" y2="727"/>
<line class="gx" x1="230" y1="727" x2="230" y2="758"/>
<line class="gx" x1="230" y1="758" x2="230" y2="789"/>
<line class="gx" x1="230" y1="789" x2="230" y2="820"/>
<text x="44" y="848"><tspan class="h" style="font-weight:700">Disputed land to Ram Lalla:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It awarded the entire 2.77</tspan></text>
<text x="56" y="870"><tspan class="k">acres of the disputed land in Ayodhya to the deity Ram Lalla virajman. It gave the</tspan></text>
<text x="56" y="892"><tspan class="k">following directions: (i) It directed the Centre to formulate a scheme for the setting-up</tspan></text>
<text x="56" y="914"><tspan class="k">of a trust for the construction of a Ram Mandir at the disputed site where the</tspan></text>
<text x="56" y="936"><tspan class="k">centuriesold Babri Masjid stood before its demolition in 1992; (ii) It directed the Centre</tspan></text>
<text x="56" y="958"><tspan class="k">and UP government to allot an alternative 5 acres of land to the UP Sunni Central Waqf</tspan></text>
<text x="56" y="980"><tspan class="k">Board at a suitable prominent place in Ayodhya for the construction of a mosque; (iii) It</tspan></text>
<text x="56" y="1002"><tspan class="k">directed that in framing the scheme for the setting-up of the trust, an appropriate</tspan></text>
<text x="56" y="1024"><tspan class="k">representation may be given to the Nirmoni Akhara in such manner as the Centre deems</tspan></text>
<text x="56" y="1046"><tspan class="k">fit. The suit filed by the Akhara claiming shebaiti rights has been held to be barred by</tspan></text>
<text x="56" y="1068"><tspan class="k">limitation and shall accordingly stand dismissed.</tspan></text>
<text x="44" y="1096"><tspan class="h" style="font-weight:700">End of Ayodhya dispute – temple trust:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement</tspan></text>
<text x="56" y="1118"><tspan class="k">has put an end to the more than a century-old dispute that has shook the communal</tspan></text>
<text x="56" y="1140"><tspan class="k">harmony dimension of the Indian society. Subsequent to this judgement, the Centre</tspan></text>
<text x="56" y="1162"><tspan class="k">announced the formation of the Ayodhya temple trust called as the Shri Ram</tspan></text>
<text x="56" y="1184"><tspan class="k">Janmabhoomi Teerth Kshetra. Similarly, the UP government announced the allocation of</tspan></text>
<text x="56" y="1206"><tspan class="k">5 acres of land to the UP Sunni Central Waqf Board in Dhannipur, Ayodhya. Further, this</tspan></text>
<text x="56" y="1228"><tspan class="k">judgement has overturned the 2010 Allahabad High Court judgement. The High Court had</tspan></text>
<text x="56" y="1250"><tspan class="k">equally divided the disputed land between the three parties, viz., one-third for Ram Lalla</tspan></text>
<text x="56" y="1272"><tspan class="k">Virajman, one-third for UP Sunni Central Waqf Board and one-third for Nirmohi Akhara.</tspan></text>
<text class="sh" x="40" y="1300"><tspan class="r" style="font-weight:700">Anuradha Bhasin Case (2020)</tspan></text>
<text class="sm" x="135" y="1332" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1332" text-anchor="middle"><tspan class="r" style="font-weight:700">Anuradha Bhasin vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="1343" x2="640" y2="1343"/>
<text class="sm" x="47" y="1363"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1363"><tspan class="r">2020</tspan></text>
<line class="gx" x1="40" y1="1374" x2="640" y2="1374"/>
<text class="sm" x="47" y="1394"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1394"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1405" x2="640" y2="1405"/>
<text class="sm" x="47" y="1425"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1425"><tspan class="k">Suspension of internet services</tspan></text>
<line class="gx" x1="40" y1="1436" x2="640" y2="1436"/>
<text class="sm" x="47" y="1456"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1456"><tspan class="r">19</tspan></text>
<line class="gx" x1="40" y1="1467" x2="640" y2="1467"/>
<rect class="gx" x="40" y="1312" width="600" height="155"/>
<line class="gx" x1="230" y1="1312" x2="230" y2="1343"/>
<line class="gx" x1="230" y1="1343" x2="230" y2="1374"/>
<line class="gx" x1="230" y1="1374" x2="230" y2="1405"/>
<line class="gx" x1="230" y1="1405" x2="230" y2="1436"/>
<line class="gx" x1="230" y1="1436" x2="230" y2="1467"/>
<text x="44" y="1495"><tspan class="h" style="font-weight:700">Internet &amp; proportionality:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held the following: (i) The</tspan></text>
<text x="56" y="1517"><tspan class="k">freedom of speech and expression and the freedom to practice any profession or carry on</tspan></text>
<text x="56" y="1539"><tspan class="k">any trade, business or occupation over the medium of internet enjoys constitutional</tspan></text>
<text x="56" y="1561"><tspan class="k">protection under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> and</tspan><tspan class="r"> Article 19(1)(g)</tspan><tspan class="k">. The restriction upon such</tspan></text>
<text x="56" y="1583"><tspan class="k">fundamental rights should be in consonance with the mandate under</tspan><tspan class="r"> Article 19(2)</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="1605"><tspan class="k">(6), inclusive of the test of proportionality; (ii) An order suspending internet services</tspan></text>
<text x="56" y="1627"><tspan class="k">indefinitely is impermissible under the Temporary Suspension of Telecom Services (Public</tspan></text>
<text x="56" y="1649"><tspan class="k">Emergency or Public Safety) Rules, 2017. Suspension can be utilized for temporary</tspan></text>
<text x="56" y="1671"><tspan class="k">duration only; (iii) Any order suspending internet issued under the Suspension Rules,</tspan></text>
<text x="56" y="1693"><tspan class="k">must adhere to the principle of proportionality and must not extend beyond necessary</tspan></text>
<text x="56" y="1715"><tspan class="k">duration.</tspan></text>
<text x="44" y="1743"><tspan class="h" style="font-weight:700">Right to internet access:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="1765"><tspan class="k">emergence of the right to access to the internet (or right to access to information via</tspan></text>
<text x="56" y="1787"><tspan class="k">the internet) as a fundamental right under the constitution. On the other hand, this</tspan></text>
<text x="56" y="1809"><tspan class="k">judgement also recognized the right of the government to shutdown the internet by</tspan></text>
<text x="56" y="1831"><tspan class="k">adhering to the principle of proportionality. These two situations may create conflicts in</tspan></text>
<text x="56" y="1853"><tspan class="k">the provision of internet services in the country.</tspan></text>
