<text class="sm" x="237" y="219"><tspan class="k">Reservation for OBCs in government jobs</tspan></text>

<text x="44" y="289"><tspan class="h" style="font-weight:700">27% OBC quota – with conditions:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It upheld the validity</tspan></text>
<text x="56" y="311"><tspan class="k">of the impugned executive order which provided 27% reservation of jobs to the OBCs</tspan></text>
<text x="56" y="333"><tspan class="k">under the provision of</tspan><tspan class="r"> Article 16(4)</tspan><tspan class="k">, with certain conditions like exclusion of creamy</tspan></text>
<text x="56" y="355"><tspan class="k">layer, no reservation in promotions, maximum reservation should not exceed 50%, ceiling</tspan></text>
<text x="56" y="377"><tspan class="k">of 50% on reservation in backlog vacancies, no relaxation in qualifying marks for</tspan></text>
<text x="56" y="399"><tspan class="k">promotions and so on. On the other hand, it invalidated another impugned executive order</tspan></text>
<text x="56" y="421"><tspan class="k">which provided 10% additional reservation of jobs for other economically backward</tspan></text>
<text x="56" y="443"><tspan class="k">sections who are not covered by any existing schemes of reservation.</tspan></text>
<text x="44" y="471"><tspan class="h" style="font-weight:700">Creamy layer &amp; National Commission for BCs:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This</tspan></text>
<text x="56" y="493"><tspan class="k">judgement led to the following: (i) Appointment of the Ram Nandan Committee to</tspan></text>
<text x="56" y="515"><tspan class="k">identify the creamy layer among the OBCs; (ii) Establishment of the statutory National</tspan></text>
<text x="56" y="537"><tspan class="k">Commission for BCs¹³ to examine the complaints of under-inclusion, over-inclusion or</tspan></text>
<text x="56" y="559"><tspan class="k">non-inclusion of any class of citizens in the list of BCs; and (iii) Enactment of five</tspan></text>
<text x="56" y="581"><tspan class="k">amendment acts, namely, the</tspan><tspan class="r"> 76th Amendment Act</tspan><tspan class="k">, 1994 that has placed the Tamil</tspan></text>
<text x="56" y="603"><tspan class="k">Nadu reservation act in the Ninth Schedule; the</tspan><tspan class="r"> 77th Amendment Act</tspan><tspan class="k">, 1995 that has</tspan></text>
<text x="56" y="625"><tspan class="k">nullified the ruling with regard to reservation in promotions; the</tspan><tspan class="r"> 81st Amendment Act</tspan><tspan class="k">,</tspan></text>
<text x="56" y="647"><tspan class="k">2000 that has nullified the ruling with regard to backlog vacancies; the</tspan><tspan class="r"> 82nd</tspan></text>
<text x="56" y="669"><tspan class="r">Amendment Act</tspan><tspan class="k">, 2000 that has provided for relaxations in qualifying marks and</tspan></text>
<text x="56" y="691"><tspan class="k">standards of evaluation in matters of reservation in promotions; and the</tspan><tspan class="r"> 85th</tspan></text>
<text x="56" y="713"><tspan class="r">Amendment Act</tspan><tspan class="k">, 2001 that has provided for consequential seniority in matters of</tspan></text>
<text x="56" y="735"><tspan class="k">promotion by virtue of rule of reservation for the SCs and STs.</tspan></text>
<rect class="bx" x="164" y="747" width="179" height="30" rx="3"/>
<text class="sm" x="254" y="766" text-anchor="middle"><tspan class="k">27% OBC executive order</tspan></text>

<rect class="bx" x="210" y="801" width="260" height="48" rx="3"/>
<text class="sm" x="340" y="820" text-anchor="middle"><tspan class="k">creamy layer excluded · no promotion</tspan></text>

<text class="sh" x="40" y="877"><tspan class="r" style="font-weight:700">Mohini Jain Case (1992)</tspan></text>
<text class="sm" x="135" y="909" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="909" text-anchor="middle"><tspan class="r" style="font-weight:700">Mohini Jain vs. State of Karnataka</tspan></text>
<line class="gx" x1="40" y1="920" x2="640" y2="920"/>
<text class="sm" x="47" y="940"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="940"><tspan class="r">1992</tspan></text>
<line class="gx" x1="40" y1="951" x2="640" y2="951"/>
<text class="sm" x="47" y="971"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="971"><tspan class="k">Capitation Fee case</tspan></text>
<line class="gx" x1="40" y1="982" x2="640" y2="982"/>
<text class="sm" x="47" y="1002"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1002"><tspan class="k">Right to education</tspan></text>
<line class="gx" x1="40" y1="1013" x2="640" y2="1013"/>
<text class="sm" x="47" y="1033"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1033"><tspan class="r">21 &amp; 41</tspan></text>
<line class="gx" x1="40" y1="1044" x2="640" y2="1044"/>
<rect class="gx" x="40" y="889" width="600" height="155"/>
<line class="gx" x1="230" y1="889" x2="230" y2="920"/>
<line class="gx" x1="230" y1="920" x2="230" y2="951"/>
<line class="gx" x1="230" y1="951" x2="230" y2="982"/>
<line class="gx" x1="230" y1="982" x2="230" y2="1013"/>
<line class="gx" x1="230" y1="1013" x2="230" y2="1044"/>
<text x="44" y="1072"><tspan class="h" style="font-weight:700">Right to education under Art. 21:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It ruled that the right to</tspan></text>
<text x="56" y="1094"><tspan class="k">education is a fundamental right under</tspan><tspan class="r"> Article 21</tspan><tspan class="k">. In fact, it declared that this right</tspan></text>
<text x="56" y="1116"><tspan class="k">extends up to any level including the professional education like engineering and</tspan></text>
<text x="56" y="1138"><tspan class="k">medicine. It observed that the right to life under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and the dignity of an</tspan></text>
<text x="56" y="1160"><tspan class="k">individual cannot be assured unless it is accompanied by the right to education. It argued</tspan></text>
<text x="56" y="1182"><tspan class="k">that without making right to education under</tspan><tspan class="r"> Article 41</tspan><tspan class="k"> a reality, the fundamental rights</tspan></text>
<text x="56" y="1204"><tspan class="k">enshrined under Part III shall remain beyond the reach of the large majority which is</tspan></text>
<text x="56" y="1226"><tspan class="k">illiterate. It thus declared that the right to education is concomitant to the fundamental</tspan></text>
<text x="56" y="1248"><tspan class="k">rights. It further observed that the state is under a constitutional mandate to provide</tspan></text>
<text x="56" y="1270"><tspan class="k">educational institutions at all levels for the benefit of the citizens. It declared that</tspan></text>
<text x="56" y="1292"><tspan class="k">charging capitation fee for admission amounted to a patent denial of a citizen’s right to</tspan></text>
<text x="56" y="1314"><tspan class="k">education and is wholly arbitrary and as such violative of</tspan><tspan class="r"> Article 14</tspan><tspan class="k">. It described the</tspan></text>
<text x="56" y="1336"><tspan class="k">capitation fee as nothing but a price for selling education. It opined that the concept of</tspan></text>
<text x="56" y="1358"><tspan class="b">“teaching shops”</tspan><tspan class="k"> is contrary to the constitutional scheme.</tspan></text>
<text x="44" y="1386"><tspan class="h" style="font-weight:700">Basis for Unni Krishnan:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement formed the basis</tspan></text>
<text x="56" y="1408"><tspan class="k">for the later judgement delivered by the Supreme Court in the Unni Krishnan case¹⁴</tspan></text>
<text x="56" y="1430"><tspan class="k">(1993) that led to the passing of the</tspan><tspan class="r"> 86th Amendment Act (2002)</tspan><tspan class="k">. In this case, the</tspan></text>
<text x="56" y="1452"><tspan class="k">Supreme Court was asked to examine the correctness of the Mohini Jain’s judgement.</tspan></text>
<text x="56" y="1474"><tspan class="k">The petitioners contended that if the Mohini Jain’s judgement was followed by the state</tspan></text>
<text x="56" y="1496"><tspan class="k">governments, they would have to close down their engineering and medical colleges. In</tspan></text>
<text x="56" y="1518"><tspan class="k">this later judgement, the Supreme Court party upheld and partly overruled the Mohini</tspan></text>
<text x="56" y="1540"><tspan class="k">Jain’s judgement. This is explained below in the next case.</tspan></text>
<text class="sh" x="40" y="1568"><tspan class="r" style="font-weight:700">Unni Krishnan Case (1993)</tspan></text>
<text class="sm" x="135" y="1600" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1600" text-anchor="middle"><tspan class="r" style="font-weight:700">Unni Krishnan vs. State of A.P.</tspan></text>
<line class="gx" x1="40" y1="1611" x2="640" y2="1611"/>
<text class="sm" x="47" y="1631"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1631"><tspan class="r">1993</tspan></text>
<line class="gx" x1="40" y1="1642" x2="640" y2="1642"/>
<text class="sm" x="47" y="1662"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1662"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1673" x2="640" y2="1673"/>
<text class="sm" x="47" y="1693"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1693"><tspan class="k">Right to education</tspan></text>
<line class="gx" x1="40" y1="1704" x2="640" y2="1704"/>
<text class="sm" x="47" y="1724"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1724"><tspan class="r">21 &amp; 45</tspan></text>
<line class="gx" x1="40" y1="1735" x2="640" y2="1735"/>
<rect class="gx" x="40" y="1580" width="600" height="155"/>
<line class="gx" x1="230" y1="1580" x2="230" y2="1611"/>
<line class="gx" x1="230" y1="1611" x2="230" y2="1642"/>
<line class="gx" x1="230" y1="1642" x2="230" y2="1673"/>
<line class="gx" x1="230" y1="1673" x2="230" y2="1704"/>
<line class="gx" x1="230" y1="1704" x2="230" y2="1735"/>
<text x="44" y="1763"><tspan class="h" style="font-weight:700">Free education till 14:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the right to education is</tspan></text>
<text x="56" y="1785"><tspan class="k">a fundamental right under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and that this right directly flows from the right to</tspan></text>
<text x="56" y="1807"><tspan class="k">life. But, it declared that only children have right to free education until they complete</tspan></text>
<text x="56" y="1829"><tspan class="k">the age of 14 years. After that age, the obligation of the state to provide education</tspan></text>
<text x="56" y="1851"><tspan class="k">depends on its economic capacity and development. The court also said that the state is</tspan></text>
<text x="56" y="1873"><tspan class="k">obliged to follow directions contained in</tspan><tspan class="r"> Article 45</tspan><tspan class="k"> which originally (prior to its</tspan></text>
<text x="56" y="1895"><tspan class="k">amendment in 2002) provided for free and compulsory education for all children upto the</tspan></text>
<text x="56" y="1917"><tspan class="k">age of 14 years. The</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> is to be construed in the light of</tspan><tspan class="r"> Articles 41, 45 and 46</tspan></text>
<text x="56" y="1939"><tspan class="k">contained in Part IV dealing with the Directive Principles of State Policy. The obligations</tspan></text>
<text x="56" y="1961"><tspan class="k">created by</tspan><tspan class="r"> Articles 41, 45 and 46</tspan><tspan class="k"> can be discharged by the state either by establishing</tspan></text>
<text x="56" y="1983"><tspan class="k">its own institutions or by aiding, recognising or granting affiliation to private educational</tspan></text>
<text x="56" y="2005"><tspan class="k">institutions. Further, the court held that the private unaided educational institutions</tspan></text>
<text x="56" y="2027"><tspan class="k">running professional courses like engineering and medical are entitled to charge a higher</tspan></text>
<text x="56" y="2049"><tspan class="k">fee than that of the government institutions. But such a fee cannot exceed the ceiling</tspan></text>
<text x="56" y="2071"><tspan class="k">fixed in this regard and commercialisation of education is not permissible.</tspan></text>
<text x="44" y="2099"><tspan class="h" style="font-weight:700">86th Amendment – Art. 21A:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Subsequent to this</tspan></text>
<text x="56" y="2121"><tspan class="k">judgement, the</tspan><tspan class="r"> 86th Amendment Act (2002)</tspan><tspan class="k"> was passed. This amendment added a new</tspan></text>
<text x="56" y="2143"><tspan class="r">Article 21A</tspan><tspan class="k"> which makes the right to education an independent fundamental right. This</tspan></text>
<text x="56" y="2165"><tspan class="k">Article declares that the state shall provide free and compulsory education to all children</tspan></text>
<text x="56" y="2187"><tspan class="k">of the age of six to fourteen years in such a manner as the state may determine. To</tspan></text>
<text x="56" y="2209"><tspan class="k">give effect to this Article, the Parliament enacted the Right of children to Free and</tspan></text>
<text x="56" y="2231"><tspan class="k">Compulsory Education (RTE) Act, 2009.</tspan></text>
