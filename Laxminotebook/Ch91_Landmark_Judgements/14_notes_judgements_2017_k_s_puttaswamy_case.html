<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">K.S. PUTTASWAMY CASE (2017)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">K.S. Puttaswamy vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">2017</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="188"><tspan class="k">Right to privacy case</tspan></text>
<line class="gx" x1="40" y1="199" x2="640" y2="199"/>
<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Fundamental right to privacy</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">21</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>
<line class="gx" x1="230" y1="168" x2="230" y2="199"/>
<line class="gx" x1="230" y1="199" x2="230" y2="230"/>
<line class="gx" x1="230" y1="230" x2="230" y2="261"/>
<text x="44" y="289"><tspan class="h" style="font-weight:700">Privacy a fundamental right:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It declared right to privacy as</tspan></text>
<text x="56" y="311"><tspan class="k">a fundamental right. It ruled that right to privacy is protected as an intrinsic part of</tspan></text>
<text x="56" y="333"><tspan class="k">right to life and personal liberty under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and as a part of the freedoms</tspan></text>
<text x="56" y="355"><tspan class="k">guaranteed by Part III of the Constitution. It said that privacy safeguards individual</tspan></text>
<text x="56" y="377"><tspan class="k">autonomy and recognizes the ability of the individual to control vital aspects of his life.</tspan></text>
<text x="56" y="399"><tspan class="k">However, it also stated that the right to privacy is not an absolute right and hence, is</tspan></text>
<text x="56" y="421"><tspan class="k">subject to reasonable restrictions which are placed on fundamental freedoms under Part</tspan></text>
<text x="56" y="443"><tspan class="k">III of the Constitution. This means that a law which encroaches upon privacy will have</tspan></text>
<text x="56" y="465"><tspan class="k">to withstand the touchstone of permissible restrictions on fundamental freedoms. In the</tspan></text>
<text x="56" y="487"><tspan class="k">context of</tspan><tspan class="r"> Article 21</tspan><tspan class="k">, an invasion of privacy must be justified on the basis of a law</tspan></text>
<text x="56" y="509"><tspan class="k">which stipulates a procedure which is fair, just and reasonable. The law must also be</tspan></text>
<text x="56" y="531"><tspan class="k">valid with reference to the encroachment on life and personal liberty under</tspan><tspan class="r"> Article 21</tspan><tspan class="k">. An</tspan></text>
<text x="56" y="553"><tspan class="k">invasion of life or personal liberty must meet the three-fold requirement of: (i) legality,</tspan></text>
<text x="56" y="575"><tspan class="k">which stipulates the existence of law; (ii) need, defined in terms of a legitimate state</tspan></text>
<text x="56" y="597"><tspan class="k">aim; and (iii) proportionality, which ensures a rational nexus between the objects and</tspan></text>
<text x="56" y="619"><tspan class="k">the means adopted to achieve them.</tspan></text>
<text x="44" y="647"><tspan class="h" style="font-weight:700">Overruled M.P. Sharma &amp; Kharak Singh:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement</tspan></text>
<text x="56" y="669"><tspan class="k">over-ruled the two earlier judgements delivered in M.P. Sharma case²⁴ (1954) and</tspan></text>
<text x="56" y="691"><tspan class="k">Kharak Singh case²⁵ (1962). In both the cases, the Supreme Court had held that the</tspan></text>
<text x="56" y="713"><tspan class="k">right to privacy is not protected by the Constitution. This judgement also clarified that</tspan></text>
<text x="56" y="735"><tspan class="k">the various judgements subsequent to Kharak Singh, which have recognized the</tspan></text>
<text x="56" y="757"><tspan class="k">fundamental right to privacy, lay down the correct position of law. Further, this</tspan></text>
<text x="56" y="779"><tspan class="k">judgement influenced the later judgements delivered by the Supreme Court in Indian</tspan></text>
<text x="56" y="801"><tspan class="k">Young Lawyers Association case26(2018), Joseph Shine case²⁷ (2018), Navtej Singh</tspan></text>
<text x="56" y="823"><tspan class="k">Johar case²⁸ (2018) and other cases. Based on this judgement, the Supreme Court</tspan></text>
<text x="56" y="845"><tspan class="k">delivered (in 2018) a separate judgement on the validity of Aadhaar law. This judgement</tspan></text>
<text x="56" y="867"><tspan class="k">is popularly known as the Aadhaar judgement or Puttaswamy-II judgement. In this</tspan></text>
<text x="56" y="889"><tspan class="k">judgement, the Supreme Court upheld the constitutional validity of the Aadhaar</tspan></text>
<text x="56" y="911"><tspan class="k">(Targeted Delivery of Financial and Other Subsidies, Benefits and Services) Act, 2016. It</tspan></text>
<text x="56" y="933"><tspan class="k">ruled that the requirement under the Aadhaar Act to give one’s demographic and</tspan></text>
<text x="56" y="955"><tspan class="k">biometric information does not violate the fundamental right of privacy. It said that the</tspan></text>
<text x="56" y="977"><tspan class="k">Aadhaar Act does not create an architecture for pervasive surveillance and provides</tspan></text>
<text x="56" y="999"><tspan class="k">protection and safety of the data received from individuals. However, the court struck</tspan></text>
<text x="56" y="1021"><tspan class="k">down certain provisions of the Act and suggested changes. Accordingly, the Aadhaar and</tspan></text>
<text x="56" y="1043"><tspan class="k">Other Laws (Amendment) Act, 2019 was enacted.</tspan></text>
<rect class="bx" x="132" y="1055" width="260" height="30" rx="3"/>
<text class="sm" x="262" y="1074" text-anchor="middle"><tspan class="k">M.P. Sharma 1954 / Kharak Singh 1962</tspan></text>

<text class="sm" x="483" y="1074" text-anchor="middle"><tspan class="r" style="font-weight:700">Puttaswamy 2017</tspan></text>

<rect class="bx" x="245" y="1109" width="190" height="30" rx="3"/>
<text class="sm" x="340" y="1128" text-anchor="middle"><tspan class="b">privacy = Art. 21 + Part III</tspan></text>

<text class="sm" x="190" y="1230" text-anchor="middle"><tspan class="k">freedoms</tspan></text>
<text class="sm" x="435" y="1222" text-anchor="middle"><tspan class="r" style="font-weight:700">Right to privacy</tspan></text>
<text class="xs" x="340" y="1296" text-anchor="middle"><tspan class="b">privacy protected as an intrinsic part of Article 21 and of the freedoms in Part III (2017)</tspan></text>
<text class="sh" x="40" y="1329"><tspan class="r" style="font-weight:700">INDIAN YOUNG LAWYERS ASSOCIATION CASE (2018)</tspan></text>
<text class="sm" x="135" y="1361" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1361" text-anchor="middle"><tspan class="r" style="font-weight:700">Indian Young Lawyers Association vs. State of kerala</tspan></text>
<line class="gx" x1="40" y1="1372" x2="640" y2="1372"/>
<text class="sm" x="47" y="1392"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1392"><tspan class="r">2018</tspan></text>
<line class="gx" x1="40" y1="1403" x2="640" y2="1403"/>
<text class="sm" x="47" y="1423"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1423"><tspan class="k">Sabarimala case</tspan></text>
<line class="gx" x1="40" y1="1434" x2="640" y2="1434"/>
<text class="sm" x="47" y="1454"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1454"><tspan class="k">Women’s entry into Sabarimala temple</tspan></text>
<line class="gx" x1="40" y1="1465" x2="640" y2="1465"/>
<text class="sm" x="47" y="1485"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1485"><tspan class="r">14, 21 &amp; 25</tspan></text>
<line class="gx" x1="40" y1="1496" x2="640" y2="1496"/>
<rect class="gx" x="40" y="1341" width="600" height="155"/>
<line class="gx" x1="230" y1="1341" x2="230" y2="1372"/>
<line class="gx" x1="230" y1="1372" x2="230" y2="1403"/>
<line class="gx" x1="230" y1="1403" x2="230" y2="1434"/>
<line class="gx" x1="230" y1="1434" x2="230" y2="1465"/>
<line class="gx" x1="230" y1="1465" x2="230" y2="1496"/>
<text x="44" y="1524"><tspan class="h" style="font-weight:700">Sabarimala – women’s entry:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the women of</tspan></text>
<text x="56" y="1546"><tspan class="k">all ages can enter into the Sabarimal temple and worship Lord Ayyappa. It declared that</tspan></text>
<text x="56" y="1568"><tspan class="k">the ban on the entry of women of the age group of 10-50 years into the temple, is</tspan></text>
<text x="56" y="1590"><tspan class="k">unconstitutional. It held that the ban violates the right to equality under</tspan><tspan class="r"> Article 14</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="1612"><tspan class="k">right to personal liberty under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and the right to freedom of religion under</tspan></text>
<text x="56" y="1634"><tspan class="r">Article 25</tspan><tspan class="k">. Accordingly, it struck down Rule 3(b) of the Kerala Hindu places of Public</tspan></text>
<text x="56" y="1656"><tspan class="k">Worship (Authorisation of Entry) Rules, 1965 which prohibits the entry of women into</tspan></text>
<text x="56" y="1678"><tspan class="k">the temple.</tspan></text>
<text x="44" y="1706"><tspan class="h" style="font-weight:700">Protests and resistance:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the protests</tspan></text>
<text x="56" y="1728"><tspan class="k">and hartals by lakhs of devotees of Lord Ayyappa in Kerala. On the other hand, some</tspan></text>
<text x="56" y="1750"><tspan class="k">women made attempts to enter the temple. But they faced strong resistance from the</tspan></text>
<text x="56" y="1772"><tspan class="k">devotees as well as temple priests and authorities. However, there were some successful</tspan></text>
<text x="56" y="1794"><tspan class="k">attempts also. In November, 2019, the five-judge Sabarimala Review Bench has referred</tspan></text>
<text x="56" y="1816"><tspan class="k">this case to a larger bench for adjudication. Subsequently, a nine-judge Bench was</tspan></text>
<text x="56" y="1838"><tspan class="k">constituted to conduct the hearing on this reference.</tspan></text>
<text class="sh" x="40" y="1866"><tspan class="r" style="font-weight:700">JOSEPH SHINE CASE (2018)</tspan></text>
<text class="sm" x="135" y="1898" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1898" text-anchor="middle"><tspan class="r" style="font-weight:700">Joseph Shine vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="1909" x2="640" y2="1909"/>
<text class="sm" x="47" y="1929"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1929"><tspan class="r">2018</tspan></text>

<text class="sm" x="47" y="1960"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1960"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1971" x2="640" y2="1971"/>

<text class="sm" x="237" y="1991"><tspan class="k">Decriminalisation of adultery</tspan></text>
<line class="gx" x1="40" y1="2002" x2="640" y2="2002"/>
<text class="sm" x="47" y="2022"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="2022"><tspan class="r">14, 15 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="2033" x2="640" y2="2033"/>
<rect class="gx" x="40" y="1878" width="600" height="155"/>
<line class="gx" x1="230" y1="1878" x2="230" y2="1909"/>

<text x="44" y="2061"><tspan class="h" style="font-weight:700">Adultery decriminalised:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It decriminalised adultery and</tspan></text>
<text x="56" y="2083"><tspan class="k">struck down</tspan><tspan class="r"> section 497</tspan><tspan class="k"> of the Indian Penal Code. It declared that this section dealing</tspan></text>
<text x="56" y="2105"><tspan class="k">with the criminalization of adultery, is unconstitutional. It held that this section violates</tspan></text>
<text x="56" y="2127"><tspan class="r">Articles 14, 15 and 21</tspan><tspan class="k">. Further, the court declared that the</tspan><tspan class="r"> Section 198(2)</tspan><tspan class="k"> of the Code</tspan></text>
<text x="56" y="2149"><tspan class="k">of Criminal Procedure, is also unconstitutional to the extent that it is applicable to the</tspan></text>
<text x="56" y="2171"><tspan class="k">offence of adultery. It observed that when the substantive provision goes, the procedural</tspan></text>
<text x="56" y="2193"><tspan class="k">provision has to pave the same path.</tspan></text>
<text x="44" y="2221"><tspan class="h" style="font-weight:700">Adultery only a civil wrong:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement has overruled all</tspan></text>
<text x="56" y="2243"><tspan class="k">the previous judgements which had upheld the above</tspan><tspan class="r"> Section 497</tspan><tspan class="k"> as constitutionally</tspan></text>
<text x="56" y="2265"><tspan class="k">valid. After this judgement, adultery is no longer a criminal offence attracting up to 5</tspan></text>
<text x="56" y="2287"><tspan class="k">years’ imprisonment. However, it can be considered as a civil wrong and it is a ground</tspan></text>
<text x="56" y="2309"><tspan class="k">for the dissolution of marriage.</tspan></text>
