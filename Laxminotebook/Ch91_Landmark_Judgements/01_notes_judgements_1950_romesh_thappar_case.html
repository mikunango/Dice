<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Romesh Thappar Case (1950)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Romesh Thappar vs. State of Madras</tspan></text>

<text class="sm" x="237" y="250"><tspan class="r">19</tspan></text>

<line class="gx" x1="230" y1="168" x2="230" y2="199"/>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Freedom of circulation:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the freedom of speech</tspan></text>
<text x="56" y="311"><tspan class="k">and expression under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> includes freedom of propagation of ideas, and that</tspan></text>
<text x="56" y="333"><tspan class="k">freedom is ensured by the freedom of circulation. It also ruled that without liberty of</tspan></text>
<text x="56" y="355"><tspan class="k">circulation, the publication would be of little value. Therefore, the order of the Madras</tspan></text>
<text x="56" y="377"><tspan class="k">government banning the entry and circulation of the weekly English Journal Cross Roads</tspan></text>
<text x="56" y="399"><tspan class="k">published at Bombay was declared as unconstitutional and void. The Madras government</tspan></text>
<text x="56" y="421"><tspan class="k">had issued the banning order under the provisions of</tspan><tspan class="r"> Section 9</tspan><tspan class="k"> (1-A) of the Madras</tspan></text>
<text x="56" y="443"><tspan class="k">Maintenance of Public Order Act, 1949. The Supreme Court observed that the freedom of</tspan></text>
<text x="56" y="465"><tspan class="k">speech and freedom of the press lay at the foundation of all democratic organisations,</tspan></text>
<text x="56" y="487"><tspan class="k">because without free political discussion no public education (which is so essential for</tspan></text>
<text x="56" y="509"><tspan class="k">the proper functioning of the process of popular government) is possible.</tspan></text>
<text x="44" y="537"><tspan class="h" style="font-weight:700">Public order – 1st Amendment:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> As a sequel to this</tspan></text>
<text x="56" y="559"><tspan class="k">judgement, the</tspan><tspan class="r"> 1st Amendment Act (1951)</tspan><tspan class="k"> added</tspan><tspan class="b"> “public order”</tspan><tspan class="k"> as a reasonable</tspan></text>
<text x="56" y="581"><tspan class="k">restriction under</tspan><tspan class="r"> Article 19(2)</tspan><tspan class="k"> on the freedom of speech and expression. The Supreme</tspan></text>
<text x="56" y="603"><tspan class="k">Court held that restrictions on the freedom of speech and expression could be imposed</tspan></text>
<text x="56" y="625"><tspan class="k">only on the grounds mentioned in</tspan><tspan class="r"> Article 19(2)</tspan><tspan class="k">. Accordingly, the court refused to permit</tspan></text>
<text x="56" y="647"><tspan class="k">restrictions on the ground of public order because it was not mentioned in</tspan><tspan class="r"> Article 19(2)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="669"><tspan class="k">It said that the ordinary or local breaches of public order were no grounds for imposing</tspan></text>
<text x="56" y="691"><tspan class="k">restrictions on the freedom of speech and expression. It further observed that the term</tspan></text>
<text x="56" y="713"><tspan class="b">“public order”</tspan><tspan class="k"> has wide connotation and signifies that state of tranquility which prevails</tspan></text>
<text x="56" y="735"><tspan class="k">among the members of political society as a result of internal regulations enforced by</tspan></text>
<text x="56" y="757"><tspan class="k">the government which they have established.</tspan></text>
<text class="sh" x="40" y="785"><tspan class="r" style="font-weight:700">A.K. Gopalan Case (1950)</tspan></text>
<text class="sm" x="135" y="817" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="817" text-anchor="middle"><tspan class="r" style="font-weight:700">A.K. Gopalan vs. State of Madras</tspan></text>

<text class="sm" x="237" y="848"><tspan class="r">1950</tspan></text>
<line class="gx" x1="40" y1="859" x2="640" y2="859"/>
<text class="sm" x="47" y="879"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="879"><tspan class="k">Preventive Detention case</tspan></text>
<line class="gx" x1="40" y1="890" x2="640" y2="890"/>
<text class="sm" x="47" y="910"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="910"><tspan class="k">Procedure established by law</tspan></text>
<line class="gx" x1="40" y1="921" x2="640" y2="921"/>
<text class="sm" x="47" y="941"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="941"><tspan class="r">21 &amp; 22</tspan></text>
<line class="gx" x1="40" y1="952" x2="640" y2="952"/>
<rect class="gx" x="40" y="797" width="600" height="155"/>
<line class="gx" x1="230" y1="797" x2="230" y2="828"/>

<text x="44" y="980"><tspan class="h" style="font-weight:700">Personal liberty = physical body:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It invalidated</tspan><tspan class="r"> Section 14</tspan></text>
<text x="56" y="1002"><tspan class="k">of the impugned Preventive Detention Act (1950) on the ground that it violates the</tspan></text>
<text x="56" y="1024"><tspan class="k">fundamental right guaranteed under</tspan><tspan class="r"> Article 22</tspan><tspan class="k">. It said that the omission of this section</tspan></text>
<text x="56" y="1046"><tspan class="k">will not change the nature or the structure or the object of the legislation. Therefore, it</tspan></text>
<text x="56" y="1068"><tspan class="k">declared the rest of the Act as valid and effective. Further, it held that the expression</tspan></text>
<text x="56" y="1090"><tspan class="b">‘personal liberty’</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> means liberty of the physical body, i.e., freedom from</tspan></text>
<text x="56" y="1112"><tspan class="k">physical restraint or detention. Moreover, it ruled that</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> is a protection only</tspan></text>
<text x="56" y="1134"><tspan class="k">against the executive and not against the legislature.</tspan></text>
<text x="44" y="1162"><tspan class="h" style="font-weight:700">Textualist approach – no due process:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> In this judgement,</tspan></text>
<text x="56" y="1184"><tspan class="k">the Supreme Court has taken a narrow (restrictive) interpretation of the</tspan><tspan class="r"> Article 21</tspan><tspan class="k">. In</tspan></text>
<text x="56" y="1206"><tspan class="k">other words, the Supreme Court has adopted a</tspan><tspan class="b"> ‘textualist approach’</tspan><tspan class="k"> in the interpretation</tspan></text>
<text x="56" y="1228"><tspan class="k">of the constitution. It held that the word</tspan><tspan class="b"> ‘law’</tspan><tspan class="k"> in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> was used in the sense of</tspan></text>
<text x="56" y="1250"><tspan class="k">state-made law and not in the sense of jus naturale i.e., the principles of natural justice.</tspan></text>
<text x="56" y="1272"><tspan class="k">Hence, it declared that the expression</tspan><tspan class="b"> ‘procedure established by law’</tspan><tspan class="k"> in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> cannot</tspan></text>
<text x="56" y="1294"><tspan class="k">be interpreted to mean the same thing as that of the American expression of the</tspan><tspan class="b"> ‘due</tspan></text>
<text x="56" y="1316"><tspan class="b">process of law’</tspan><tspan class="k">. This declaration, in effect, amounted to holding that the protection</tspan></text>
<text x="56" y="1338"><tspan class="k">under</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> is available only against arbitrary executive action and not from arbitrary</tspan></text>
<text x="56" y="1360"><tspan class="k">legislative action. This judgement held the field for nearly three decades (1950 to 1978).</tspan></text>
<text x="56" y="1382"><tspan class="k">This judicial interpretation reached its logical end in A.D.M. Jabalpur case¹ (1976). But, in</tspan></text>
<text x="56" y="1404"><tspan class="k">Maneka Gandhi case² (1978), the Supreme Court overruled the above judgement by</tspan></text>
<text x="56" y="1426"><tspan class="k">taking a wider interpretation of the</tspan><tspan class="r"> Article 21</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1462"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> A.D.M. Jabalpur vs. Shivakant Shukla (1976). This case is popularly known as the Habeas Corpus</tspan></text>
<text class="xs" x="50" y="1480"><tspan class="k">case.</tspan></text>
<rect x="40" y="1440" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1525"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> Maneka Gandhi vs. Union of India (1978). This case is popularly known as the Personal Liberty</tspan></text>
<text class="xs" x="50" y="1543"><tspan class="k">case.</tspan></text>
<rect x="40" y="1503" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sh" x="40" y="1580"><tspan class="r" style="font-weight:700">Champakam Dorairajan Case (1951)</tspan></text>
<text class="sm" x="135" y="1612" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1612" text-anchor="middle"><tspan class="r" style="font-weight:700">State of Madras vs. Champakam Dorairajan</tspan></text>

<text class="sm" x="237" y="1643"><tspan class="r">1951</tspan></text>

<text class="sm" x="237" y="1674"><tspan class="k">—</tspan></text>

<text class="sm" x="237" y="1705"><tspan class="k">Communal reservation in admission to educational institutions</tspan></text>
<line class="gx" x1="40" y1="1716" x2="640" y2="1716"/>
<text class="sm" x="47" y="1736"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1736"><tspan class="r">15, 29 &amp; 46</tspan></text>
<line class="gx" x1="40" y1="1747" x2="640" y2="1747"/>

<line class="gx" x1="230" y1="1592" x2="230" y2="1623"/>

<text x="44" y="1775"><tspan class="h" style="font-weight:700">DPSP subsidiary to FRs:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It affirmed the judgement of the</tspan></text>
<text x="56" y="1797"><tspan class="k">Madras High Court. It struck down the order issued by the Madras Government (known</tspan></text>
<text x="56" y="1819"><tspan class="k">as the Communal GO) that had provided for the proportionate reservation of seats in the</tspan></text>
<text x="56" y="1841"><tspan class="k">government medical and engineering colleges for different communities with the object</tspan></text>
<text x="56" y="1863"><tspan class="k">of promoting the educational interest of the backward classes under</tspan><tspan class="r"> Article 46</tspan><tspan class="k">. It held</tspan></text>
<text x="56" y="1885"><tspan class="k">that the communal GO was based on religion, race and caste and hence was violative of</tspan></text>
<text x="56" y="1907"><tspan class="r">Articles 15(1) and 29(2)</tspan><tspan class="k">. Further, it declared that the directive principles cannot in any</tspan></text>
<text x="56" y="1929"><tspan class="k">way override or abridge the fundamental rights. It also stated that the directive</tspan></text>
<text x="56" y="1951"><tspan class="k">principles have to conform to and run as subsidiary to the fundamental rights.</tspan></text>
<text x="44" y="1979"><tspan class="h" style="font-weight:700">Article 15(4) – 1st Amendment:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="2001"><tspan class="k">insertion of a new Clause (4) in</tspan><tspan class="r"> Article 15</tspan><tspan class="k"> by the</tspan><tspan class="r"> 1st Amendment Act (1951)</tspan><tspan class="k">. This</tspan></text>
<text x="56" y="2023"><tspan class="k">clause permits the state to make any special provision for the advancement of any</tspan></text>
<text x="56" y="2045"><tspan class="k">socially and educationally backward classes of citizens or for the SCs and STs. In this</tspan></text>
<text x="56" y="2067"><tspan class="k">way, the effect of this judgement was nullified.</tspan></text>
