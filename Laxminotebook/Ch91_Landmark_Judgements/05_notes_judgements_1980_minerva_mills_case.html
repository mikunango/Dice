<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Minerva Mills Case (1980)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Minerva Mills vs. Union of India</tspan></text>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Limited amending power is basic structure:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It invalidated</tspan></text>
<text x="56" y="311"><tspan class="k">Clauses (4) and (5) of</tspan><tspan class="r"> Article 368</tspan><tspan class="k"> which were inserted by the</tspan><tspan class="r"> 42nd Amendment Act</tspan></text>
<text x="56" y="333"><tspan class="r">(1976)</tspan><tspan class="k">. Similarly, the amendment made to</tspan><tspan class="r"> Article 31C</tspan><tspan class="k"> by the</tspan><tspan class="r"> 42nd Amendment Act</tspan></text>
<text x="56" y="355"><tspan class="r">(1976)</tspan><tspan class="k"> was also declared as unconstitutional. The Court said that the above changes</tspan></text>
<text x="56" y="377"><tspan class="k">made by the</tspan><tspan class="r"> 42nd Amendment Act (1976)</tspan><tspan class="k"> destroyed the basic structure of the</tspan></text>
<text x="56" y="399"><tspan class="k">constitution. It held the limited power of Parliament to amend the constitution, judicial</tspan></text>
<text x="56" y="421"><tspan class="k">review and the harmony and balance between fundamental rights and directive principles</tspan></text>
<text x="56" y="443"><tspan class="k">as basic features of the constitution.</tspan></text>
<text x="44" y="471"><tspan class="h" style="font-weight:700">42nd Amendment dilution nullified:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement has</tspan></text>
<text x="56" y="493"><tspan class="k">nullified the attempt to dilute the doctrine of the basic structure by the</tspan><tspan class="r"> 42nd</tspan></text>
<text x="56" y="515"><tspan class="r">Amendment Act (1976)</tspan><tspan class="k">. This amendment had conferred an unlimited and uncontrolled</tspan></text>
<text x="56" y="537"><tspan class="k">amending power on the Parliament. The Supreme Court held that the Parliament cannot,</tspan></text>
<text x="56" y="559"><tspan class="k">under</tspan><tspan class="r"> Article 368</tspan><tspan class="k">, expand its amending power so as to acquire for itself the right to</tspan></text>
<text x="56" y="581"><tspan class="k">repeal or abrogate the constitution or to destroy its basic features. Further, this</tspan></text>
<text x="56" y="603"><tspan class="k">amendment also gave precedence to all directive principles over the fundamental rights</tspan></text>
<text x="56" y="625"><tspan class="k">conferred by</tspan><tspan class="r"> Articles 14, 19 and 3111</tspan><tspan class="k">. The Supreme Court, in this regard, held that</tspan></text>
<text x="56" y="647"><tspan class="k">anything that destroys the balance between the fundamental rights and the directive</tspan></text>
<text x="56" y="669"><tspan class="k">principles will ipso facto destroy an essential element of the basic structure of the</tspan></text>
<text x="56" y="691"><tspan class="k">constitution.</tspan></text>
<rect class="bx" x="116" y="703" width="203" height="30" rx="3"/>
<text class="sm" x="218" y="722" text-anchor="middle"><tspan class="k">42nd Amdt: Art. 368(4),(5)</tspan></text>

<text class="sm" x="340" y="776" text-anchor="middle"><tspan class="b">limited amending power = basic</tspan></text>
<text class="sm" x="340" y="794" text-anchor="middle"><tspan class="b">structure</tspan></text>
<text class="sh" x="40" y="833"><tspan class="r" style="font-weight:700">Waman Rao Case (1980)</tspan></text>
<text class="sm" x="135" y="865" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="865" text-anchor="middle"><tspan class="r" style="font-weight:700">Waman Rao vs. Union of India</tspan></text>

<text class="sm" x="47" y="896"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="896"><tspan class="r">1980</tspan></text>

<text class="sm" x="47" y="927"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>

<text class="sm" x="237" y="958"><tspan class="k">Judicial review of the ninth schedule</tspan></text>

<text class="sm" x="237" y="989"><tspan class="r">368 &amp; Ninth Schedule</tspan></text>

<text x="44" y="1028"><tspan class="h" style="font-weight:700">Ninth Schedule – 24 April 1973 cut-off:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that all</tspan></text>
<text x="56" y="1050"><tspan class="k">the amendments to the constitution which were made before 24 April 1973 (the date on</tspan></text>
<text x="56" y="1072"><tspan class="k">which the court delivered its verdict in the Kesavananda Bharati case) and by which the</tspan></text>
<text x="56" y="1094"><tspan class="k">Ninth Schedule was amended from time to time by the inclusion of various Acts and</tspan></text>
<text x="56" y="1116"><tspan class="k">Regulations therein are valid. But, all the amendments made after 24 April 1973 are open</tspan></text>
<text x="56" y="1138"><tspan class="k">to challenge on the ground that they are beyond the constituent power of the</tspan></text>
<text x="56" y="1160"><tspan class="k">Parliament, since they damage the basic structure of the Constitution. In other words,</tspan></text>
<text x="56" y="1182"><tspan class="k">the various amendments by which additions were made to the Ninth Schedule after 24</tspan></text>
<text x="56" y="1204"><tspan class="k">April 1973 will be valid only if they do not damage the basic structure of the</tspan></text>
<text x="56" y="1226"><tspan class="k">constitution.</tspan></text>
<text class="sh" x="40" y="1254"><tspan class="r" style="font-weight:700">Shah Bano Case (1985)</tspan></text>
<text class="sm" x="135" y="1286" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1286" text-anchor="middle"><tspan class="r" style="font-weight:700">Mohd. Ahmed Khan vs. Shah Bano</tspan></text>
<line class="gx" x1="40" y1="1297" x2="640" y2="1297"/>
<text class="sm" x="47" y="1317"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1317"><tspan class="r">1985</tspan></text>
<line class="gx" x1="40" y1="1328" x2="640" y2="1328"/>
<text class="sm" x="47" y="1348"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1348"><tspan class="k">—</tspan></text>

<text class="sm" x="47" y="1379"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1379"><tspan class="k">Maintenance of a divorced Muslim wife</tspan></text>
<line class="gx" x1="40" y1="1390" x2="640" y2="1390"/>
<text class="sm" x="47" y="1410"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1410"><tspan class="r">—</tspan></text>
<line class="gx" x1="40" y1="1421" x2="640" y2="1421"/>
<rect class="gx" x="40" y="1266" width="600" height="155"/>
<line class="gx" x1="230" y1="1266" x2="230" y2="1297"/>
<line class="gx" x1="230" y1="1297" x2="230" y2="1328"/>
<line class="gx" x1="230" y1="1328" x2="230" y2="1359"/>
<line class="gx" x1="230" y1="1359" x2="230" y2="1390"/>
<line class="gx" x1="230" y1="1390" x2="230" y2="1421"/>
<text x="44" y="1449"><tspan class="h" style="font-weight:700">Maintenance under Sec. 125 CrPC:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It upheld the judgement</tspan></text>
<text x="56" y="1471"><tspan class="k">of the High Court of Madhya Pradesh. It ruled that a Muslim husband is liable to pay</tspan></text>
<text x="56" y="1493"><tspan class="k">maintenance to the divorced wife beyond the period of iddat. It held that</tspan><tspan class="r"> Section 125</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="1515"><tspan class="k">the Code of Criminal Procedure, 1973 is secular in character and applies to all religions</tspan></text>
<text x="56" y="1537"><tspan class="k">and communities. It said that this section would prevail over the personal law, in case of</tspan></text>
<text x="56" y="1559"><tspan class="k">a conflict between the two. It also said that Mahr (or dower) does not absolve a Muslim</tspan></text>
<text x="56" y="1581"><tspan class="k">husband from payment of maintenance to the divorced wife. Further, it also emphasized</tspan></text>
<text x="56" y="1603"><tspan class="k">that a uniform civil code will help the cause of national integration by removing</tspan></text>
<text x="56" y="1625"><tspan class="k">disparate loyalties to laws which have conflicting ideologies.</tspan></text>
<text x="44" y="1653"><tspan class="h" style="font-weight:700">Muslim Women Act 1986:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="1675"><tspan class="k">enactment of a new law called the Muslim Women (Protection of Rights on Divorce)</tspan></text>
<text x="56" y="1697"><tspan class="k">Act, 1986. This Act overturned the above judgement by allowing the payment of</tspan></text>
<text x="56" y="1719"><tspan class="k">maintenance to a divorced wife only during the period of iddat. In Danial Latifi case¹²</tspan></text>
<text x="56" y="1741"><tspan class="k">(2001), the Supreme Court upheld the constitutional validity of this Act but held that a</tspan></text>
<text x="56" y="1763"><tspan class="k">Muslim husband is liable to pay the maintenance to the divorced wife even after the</tspan></text>
<text x="56" y="1785"><tspan class="k">period of iddat.</tspan></text>
