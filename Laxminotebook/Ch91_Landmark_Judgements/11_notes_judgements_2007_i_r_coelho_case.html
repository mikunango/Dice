<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">I.R. Coelho vs. State of Tamil Nadu</tspan></text>

<text class="sm" x="237" y="250"><tspan class="r">31B &amp; Ninth Schedule</tspan></text>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Ninth Schedule laws reviewable:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It reaffirmed its</tspan></text>
<text x="56" y="311"><tspan class="k">judgement delivered in the Waman Rao case²¹ (1980). Therefore, it held that the</tspan></text>
<text x="56" y="333"><tspan class="k">amendments to the Constitution made on or after 24 April 1973 (i.e., the date of verdict</tspan></text>
<text x="56" y="355"><tspan class="k">in the Kesavananda Bharati case²²) by which the Ninth Schedule is amended by</tspan></text>
<text x="56" y="377"><tspan class="k">inclusion of various laws therein would be open to challenge on the ground that they</tspan></text>
<text x="56" y="399"><tspan class="k">damage or destroy the basic structure of the Constitution. In addition, it laid down</tspan></text>
<text x="56" y="421"><tspan class="k">certain tests which are to be applied for deciding the validity of those constitutional</tspan></text>
<text x="56" y="443"><tspan class="k">amendments. The fundamental question before the court was whether on or after 24</tspan></text>
<text x="56" y="465"><tspan class="k">April 1973, when basic structure doctrine was propounded, it is permissible for the</tspan></text>
<text x="56" y="487"><tspan class="k">Parliament under</tspan><tspan class="r"> Article 31B</tspan><tspan class="k"> to immunize legislations from fundamental rights by</tspan></text>
<text x="56" y="509"><tspan class="k">inserting them into the Ninth Schedule and, if so, what is its effect on the power of</tspan></text>
<text x="56" y="531"><tspan class="k">judicial review of the court.</tspan></text>
<text class="sh" x="40" y="559"><tspan class="r" style="font-weight:700">Aruna Ramachandra Shanbaug Case (2011)</tspan></text>
<text class="sm" x="135" y="591" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="591" text-anchor="middle"><tspan class="r" style="font-weight:700">Aruna Ramachandra Shanbaug vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="602" x2="640" y2="602"/>
<text class="sm" x="47" y="622"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="622"><tspan class="r">2011</tspan></text>

<text class="sm" x="47" y="653"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="653"><tspan class="k">—</tspan></text>

<text class="sm" x="47" y="684"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="684"><tspan class="k">Euthanasia</tspan></text>
<line class="gx" x1="40" y1="695" x2="640" y2="695"/>
<text class="sm" x="47" y="715"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="715"><tspan class="r">21</tspan></text>
<line class="gx" x1="40" y1="726" x2="640" y2="726"/>
<rect class="gx" x="40" y="571" width="600" height="155"/>
<line class="gx" x1="230" y1="571" x2="230" y2="602"/>
<line class="gx" x1="230" y1="602" x2="230" y2="633"/>
<line class="gx" x1="230" y1="633" x2="230" y2="664"/>
<line class="gx" x1="230" y1="664" x2="230" y2="695"/>

<text x="44" y="754"><tspan class="h" style="font-weight:700">Passive euthanasia allowed:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that active euthanasia</tspan></text>
<text x="56" y="776"><tspan class="k">and assisted death are not permissible and hence, continue to be illegal, whereas passive</tspan></text>
<text x="56" y="798"><tspan class="k">euthanasia is permissible with certain conditions, safeguards and procedure laid down by</tspan></text>
<text x="56" y="820"><tspan class="k">the court: (i) A decision has to be taken to discontinue life support either by the</tspan></text>
<text x="56" y="842"><tspan class="k">parents or the spouse or other close relatives, or in the absence of any of them, such a</tspan></text>
<text x="56" y="864"><tspan class="k">decision can be taken even by a person acting as a next friend or by the doctors</tspan></text>
<text x="56" y="886"><tspan class="k">attending the patient; (ii) Even if a decision is taken by the near relatives or doctors or</tspan></text>
<text x="56" y="908"><tspan class="k">next friend to withdraw life support, such a decision requires approval from the High</tspan></text>
<text x="56" y="930"><tspan class="k">Court concerned; (iii) When such an application is filed, the Chief Justice of the High</tspan></text>
<text x="56" y="952"><tspan class="k">Court should forthwith constitute a Bench of at least two Judges who should decide to</tspan></text>
<text x="56" y="974"><tspan class="k">grant approval or not. Before doing so the Bench should seek the opinion of a committee</tspan></text>
<text x="56" y="996"><tspan class="k">of three reputed doctors to be nominated by the Bench; and (iv) The High Court Bench</tspan></text>
<text x="56" y="1018"><tspan class="k">shall also issue notice to the State and close relatives e.g. parents, spouse,</tspan></text>
<text x="56" y="1040"><tspan class="k">brothers/sisters etc. of the patient, and in their absence his/her next friend, and supply</tspan></text>
<text x="56" y="1062"><tspan class="k">a copy of the report of the doctor’s committee to them. After hearing them, the High</tspan></text>
<text x="56" y="1084"><tspan class="k">Court bench should give its verdict.</tspan></text>
<text class="sh" x="40" y="1112"><tspan class="r" style="font-weight:700">People’s Union for Civil Liberties Case (2013)</tspan></text>
<text class="sm" x="135" y="1144" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1144" text-anchor="middle"><tspan class="r" style="font-weight:700">People’s Union for Civil Liberties vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="1155" x2="640" y2="1155"/>
<text class="sm" x="47" y="1175"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1175"><tspan class="r">2013</tspan></text>
<line class="gx" x1="40" y1="1186" x2="640" y2="1186"/>
<text class="sm" x="47" y="1206"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1206"><tspan class="k">NOTA case</tspan></text>
<line class="gx" x1="40" y1="1217" x2="640" y2="1217"/>
<text class="sm" x="47" y="1237"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1237"><tspan class="k">Electoral reforms</tspan></text>
<line class="gx" x1="40" y1="1248" x2="640" y2="1248"/>
<text class="sm" x="47" y="1268"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1268"><tspan class="r">14, 19 &amp; 21</tspan></text>
<line class="gx" x1="40" y1="1279" x2="640" y2="1279"/>
<rect class="gx" x="40" y="1124" width="600" height="155"/>
<line class="gx" x1="230" y1="1124" x2="230" y2="1155"/>
<line class="gx" x1="230" y1="1155" x2="230" y2="1186"/>
<line class="gx" x1="230" y1="1186" x2="230" y2="1217"/>
<line class="gx" x1="230" y1="1217" x2="230" y2="1248"/>
<line class="gx" x1="230" y1="1248" x2="230" y2="1279"/>
<text x="44" y="1307"><tspan class="h" style="font-weight:700">Right not to vote – secrecy:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that Rules 41(2) &amp;</tspan></text>
<text x="56" y="1329"><tspan class="k">(3) and 49-O of the Conduct of Election Rules, 1961 (which recognize the right of a</tspan></text>
<text x="56" y="1351"><tspan class="k">voter not to vote) are ultra-vires</tspan><tspan class="r"> Section 128</tspan><tspan class="k"> of the Representation of the People Act,</tspan></text>
<text x="56" y="1373"><tspan class="k">1951 and</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> of the Constitution to the extent they violate secrecy of voting.</tspan></text>
<text x="56" y="1395"><tspan class="k">Therefore, it directed the Election Commission to provide necessary provision in the ballot</tspan></text>
<text x="56" y="1417"><tspan class="k">papers/EVMs and another button called</tspan><tspan class="b"> “None of the Above”</tspan><tspan class="k"> (NOTA) may be provided in</tspan></text>
<text x="56" y="1439"><tspan class="k">EVMs so that the voters, who come to the polling booth and decide not to vote for any</tspan></text>
<text x="56" y="1461"><tspan class="k">of the candidates in the fray, are able to exercise their right not to vote while</tspan></text>
<text x="56" y="1483"><tspan class="k">maintaining their right of secrecy. The court made the following observations: (i) In</tspan></text>
<text x="56" y="1505"><tspan class="k">order to protect the right in terms of</tspan><tspan class="r"> Section 79(d)</tspan><tspan class="k"> and Rule 49-O, viz.,</tspan><tspan class="b"> “right not to</tspan></text>
<text x="56" y="1527"><tspan class="b">vote”</tspan><tspan class="k">, this court is competent to issue directions that secrecy of a voter who decides not</tspan></text>
<text x="56" y="1549"><tspan class="k">to cast his vote has to be protected in the same manner as the Statute has protected</tspan></text>
<text x="56" y="1571"><tspan class="k">the right of a voter who decides to cast his vote in favour of a candidate; (ii) This court</tspan></text>
<text x="56" y="1593"><tspan class="k">is also justified in giving such directions in order to give effect to the right of expression</tspan></text>
<text x="56" y="1615"><tspan class="k">under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> and to avoid any discrimination by directing the Election</tspan></text>
<text x="56" y="1637"><tspan class="k">Commission to provide NOTA button in the EVMs; (iii)</tspan><tspan class="r"> Article 19</tspan><tspan class="k"> guarantees all</tspan></text>
<text x="56" y="1659"><tspan class="k">individuals the right to speak, criticize, and disagree on a particular issue. It stands on</tspan></text>
<text x="56" y="1681"><tspan class="k">the spirit of tolerance and allows people to have diverse views, ideas and ideologies. Not</tspan></text>
<text x="56" y="1703"><tspan class="k">allowing a person to cast vote negatively defeats the very freedom of expression and the</tspan></text>
<text x="56" y="1725"><tspan class="k">right ensured in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> i.e., the right to liberty; and (iv) Protection of elector’s</tspan></text>
<text x="56" y="1747"><tspan class="k">identity and affording secrecy is integral to free and fair elections and an arbitrary</tspan></text>
<text x="56" y="1769"><tspan class="k">distinction between the voter who casts his vote and the voter who does not cast his</tspan></text>
<text x="56" y="1791"><tspan class="k">vote is violative of</tspan><tspan class="r"> Article 14</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1819"><tspan class="h" style="font-weight:700">NOTA option:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Subsequent to this judgement, the Election</tspan></text>
<text x="56" y="1841"><tspan class="k">Commission made provision in the ballot papers/EVMs for None of the Above (NOTA)</tspan></text>
<text x="56" y="1863"><tspan class="k">option. The provision for NOTA has been made since General Election to State Legislative</tspan></text>
<text x="56" y="1885"><tspan class="k">Assemblies of Chhattisgarh, MP, Mizoram, NCT of Delhi and Rajasthan in 2013 and</tspan></text>
<text x="56" y="1907"><tspan class="k">continued in the General Election to State Legislative Assemblies of Andhra Pradesh,</tspan></text>
<text x="56" y="1929"><tspan class="k">Arunachal Pradesh, Odisha and Sikkim in 2014 along with the General Elections to the</tspan></text>
<text x="56" y="1951"><tspan class="k">Sixteenth Lok Sabha (2014)²³.</tspan></text>
