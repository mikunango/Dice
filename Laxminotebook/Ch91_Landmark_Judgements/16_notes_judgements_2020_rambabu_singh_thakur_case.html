<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Rambabu Singh Thakur Case (2020)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Rambabu Singh Thakur vs. Sunil Arora</tspan></text>

<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Criminalisation of politics</tspan></text>

<text x="44" y="289"><tspan class="h" style="font-weight:700">Disclose criminal antecedents:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It issued various directions</tspan></text>
<text x="56" y="311"><tspan class="k">aimed at curbing the growing incidence of criminals in politics. These are: (i) It shall be</tspan></text>
<text x="56" y="333"><tspan class="k">mandatory for political parties (at the central and state election level) to upload on their</tspan></text>
<text x="56" y="355"><tspan class="k">website detailed information regarding individuals (with pending criminal cases) who</tspan></text>
<text x="56" y="377"><tspan class="k">have been selected as candidates. This should include the nature of the offences and</tspan></text>
<text x="56" y="399"><tspan class="k">relevant particulars such as whether charges have been framed, the concerned court, the</tspan></text>
<text x="56" y="421"><tspan class="k">case number etc. The parties should also state the reasons for such selection as well as</tspan></text>
<text x="56" y="443"><tspan class="k">the reasons for such selection as well as the reasons as to why other individuals without</tspan></text>
<text x="56" y="465"><tspan class="k">criminal antecedents could not be selected as candidates; (ii) The reasons as to</tspan></text>
<text x="56" y="487"><tspan class="k">selection shall be with reference to the qualifications, achievements and merit of the</tspan></text>
<text x="56" y="509"><tspan class="k">candidate concerned and not mere winnability at the polls; (iii) This information shall</tspan></text>
<text x="56" y="531"><tspan class="k">also be published in one local vernacular newspaper and one national newspaper, and on</tspan></text>
<text x="56" y="553"><tspan class="k">the official social media platforms of the political party, including Facebook and Twitter.</tspan></text>
<text x="44" y="581"><tspan class="h" style="font-weight:700">Form C-7:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> Subsequent to this judgement, the Election</tspan></text>
<text x="56" y="603"><tspan class="k">Commission sent a communication to all the recognized political parties requiring them to</tspan></text>
<text x="56" y="625"><tspan class="k">follow the above directions. Further, it also released a new Form C-7 where in the</tspan></text>
<text x="56" y="647"><tspan class="k">political parties have to provide all the information regarding selected candidates having</tspan></text>
<text x="56" y="669"><tspan class="k">criminal background.</tspan></text>
<text class="sh" x="40" y="697"><tspan class="r" style="font-weight:700">INTERNET AND MOBILE ASSOCIATION OF INDIA CASE (2020)</tspan></text>
<text class="sm" x="135" y="729" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="729" text-anchor="middle"><tspan class="r" style="font-weight:700">Internet and Mobile Association of India vs. Reserve Bank of</tspan></text>
<text class="sm" x="435" y="748" text-anchor="middle"><tspan class="r" style="font-weight:700">India</tspan></text>
<line class="gx" x1="40" y1="759" x2="640" y2="759"/>

<text class="sm" x="47" y="810"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>

<text class="sm" x="47" y="841"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="841"><tspan class="k">Ban on crypto currency trading</tspan></text>
<line class="gx" x1="40" y1="852" x2="640" y2="852"/>

<line class="gx" x1="230" y1="709" x2="230" y2="759"/>
<line class="gx" x1="230" y1="759" x2="230" y2="790"/>
<line class="gx" x1="230" y1="790" x2="230" y2="821"/>

<text x="44" y="911"><tspan class="h" style="font-weight:700">Crypto ban struck down:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It struck down a circular issued</tspan></text>
<text x="56" y="933"><tspan class="k">by the Reserve Bank of India (RBI) that had directed the banks and financial</tspan></text>
<text x="56" y="955"><tspan class="k">institutions not to deal in virtual currencies (VCs) nor provide services in relation to VCs.</tspan></text>
<text x="56" y="977"><tspan class="k">It declared the circular as illegal and unenforceable on the ground of proportionality. It</tspan></text>
<text x="56" y="999"><tspan class="k">said that the RBI itself had not found that the banks and financial institutions have</tspan></text>
<text x="56" y="1021"><tspan class="k">suffered any loss or adversely effected on account of VC exchanges. Further, it also ruled</tspan></text>
<text x="56" y="1043"><tspan class="k">that the circular violates the freedom to carry on trade under</tspan><tspan class="r"> Article 19(1)(g)</tspan><tspan class="k">. Hence, it</tspan></text>
<text x="56" y="1065"><tspan class="k">declared the circular as unconstitutional.</tspan></text>
<text x="44" y="1093"><tspan class="h" style="font-weight:700">Crypto trading resumed:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement removed the ban</tspan></text>
<text x="56" y="1115"><tspan class="k">on crypto currency trading in India. This made the banks and financial institutions to</tspan></text>
<text x="56" y="1137"><tspan class="k">rejoin the virtual currency industry and do the trading. Further, this judgement also</tspan></text>
<text x="56" y="1159"><tspan class="k">brought into focus the need for creating a legal framework for regulating the crypto</tspan></text>
<text x="56" y="1181"><tspan class="k">currency trading and the various issues associated with this industry in India.</tspan></text>
