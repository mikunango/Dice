<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Vineet Narain Case (1997)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Vineet Narain vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">1997</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="188"><tspan class="k">Jain Hawala case</tspan></text>
<line class="gx" x1="40" y1="199" x2="640" y2="199"/>
<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Autonomy and efficient functioning of CBI</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">—</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>
<line class="gx" x1="230" y1="168" x2="230" y2="199"/>

<text x="44" y="289"><tspan class="h" style="font-weight:700">CVC supervision of CBI:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It directed that statutory status</tspan></text>
<text x="56" y="311"><tspan class="k">should be conferred upon the Central Vigilance Commission (CVC). It also issued</tspan></text>
<text x="56" y="333"><tspan class="k">directions to make the Central Bureau of Investigation (CBI) an autonomous body so</tspan></text>
<text x="56" y="355"><tspan class="k">that it can function effectively and efficiently and is viewed as a non-partisan agency. It</tspan></text>
<text x="56" y="377"><tspan class="k">issued the similar directions with respect to the Enforcement Directorate (ED). Further,</tspan></text>
<text x="56" y="399"><tspan class="k">it also struck down the validity of the arbitrary provision of Single Directive that required</tspan></text>
<text x="56" y="421"><tspan class="k">the CBI to obtain the prior permission of the Central Government before conducting an</tspan></text>
<text x="56" y="443"><tspan class="k">investigation against the officers of the rank of Joint Secretary and above.</tspan></text>
<text x="44" y="471"><tspan class="h" style="font-weight:700">CVC Act 2003:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the enactment of the</tspan></text>
<text x="56" y="493"><tspan class="k">CVC Act, 2003 that conferred the Statutory Status upon the CVC. Under this Act, the</tspan></text>
<text x="56" y="515"><tspan class="k">superintendence of the CBI in so far as it relates to the investigation of corruption cases</tspan></text>
<text x="56" y="537"><tspan class="k">has been vested in the CVC. Further, this Act also reinstated the provision of Single</tspan></text>
<text x="56" y="559"><tspan class="k">Directive that was again declared invalid by the Supreme Court in 2014 on the ground</tspan></text>
<text x="56" y="581"><tspan class="k">that it is violative of</tspan><tspan class="r"> Article 14</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="609"><tspan class="r" style="font-weight:700">Association for Democratic Reforms Case (2002)</tspan></text>
<text class="sm" x="135" y="641" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="641" text-anchor="middle"><tspan class="r" style="font-weight:700">Union of India vs. Association for Democratic Reforms</tspan></text>
<line class="gx" x1="40" y1="652" x2="640" y2="652"/>
<text class="sm" x="47" y="672"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="672"><tspan class="r">2002</tspan></text>
<line class="gx" x1="40" y1="683" x2="640" y2="683"/>
<text class="sm" x="47" y="703"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="703"><tspan class="k">Poll Reforms case</tspan></text>
<line class="gx" x1="40" y1="714" x2="640" y2="714"/>
<text class="sm" x="47" y="734"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="734"><tspan class="k">Criminalization of politics</tspan></text>
<line class="gx" x1="40" y1="745" x2="640" y2="745"/>
<text class="sm" x="47" y="765"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="765"><tspan class="r">19</tspan></text>
<line class="gx" x1="40" y1="776" x2="640" y2="776"/>
<rect class="gx" x="40" y="621" width="600" height="155"/>
<line class="gx" x1="230" y1="621" x2="230" y2="652"/>
<line class="gx" x1="230" y1="652" x2="230" y2="683"/>
<line class="gx" x1="230" y1="683" x2="230" y2="714"/>
<line class="gx" x1="230" y1="714" x2="230" y2="745"/>
<line class="gx" x1="230" y1="745" x2="230" y2="776"/>
<text x="44" y="804"><tspan class="h" style="font-weight:700">Voters’ right to know:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that a voter has a right to</tspan></text>
<text x="56" y="826"><tspan class="k">know about the antecedents including criminal past of his candidate as part of his right</tspan></text>
<text x="56" y="848"><tspan class="k">under</tspan><tspan class="r"> Article 19(1)(a)</tspan><tspan class="k"> i.e., freedom of speech and expression. Voter’s speech or expression</tspan></text>
<text x="56" y="870"><tspan class="k">in case of election would include casting of votes, that is to say voter speaks out or</tspan></text>
<text x="56" y="892"><tspan class="k">expresses by casting vote. For this purpose, information about the candidate to be</tspan></text>
<text x="56" y="914"><tspan class="k">selected is a must. Democracy cannot survive without free and fair elections, without</tspan></text>
<text x="56" y="936"><tspan class="k">free and fairly informed voters. Therefore, the court directed the Election Commission to</tspan></text>
<text x="56" y="958"><tspan class="k">make it mandatory for the candidates to furnish information on the following aspects:</tspan></text>
<text x="56" y="980"><tspan class="k">(a) Whether the candidate is convicted/acquitted/discharged of any criminal offence in</tspan></text>
<text x="56" y="1002"><tspan class="k">the past – if any, whether he is punished with imprisonment or fine; (b) Prior to six</tspan></text>
<text x="56" y="1024"><tspan class="k">months of filing of nomination, whether the candidate is accused in any pending case, of</tspan></text>
<text x="56" y="1046"><tspan class="k">any offence punishable with imprisonment for two years or more, and in which charge is</tspan></text>
<text x="56" y="1068"><tspan class="k">framed or cognizance is taken by the court of law. If so, the details thereof; (c) The</tspan></text>
<text x="56" y="1090"><tspan class="k">assets (immovable, movable, bank balance, etc.) of a candidate and of his/her spouse</tspan></text>
<text x="56" y="1112"><tspan class="k">and that of dependents; (d) Liabilities, if any, particularly whether there are any over</tspan></text>
<text x="56" y="1134"><tspan class="k">dues of any public financial institution or government dues; and (e) The educational</tspan></text>
<text x="56" y="1156"><tspan class="k">qualifications of the candidate.</tspan></text>
<text x="44" y="1184"><tspan class="h" style="font-weight:700">Candidate disclosure order (2003):</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> As a sequel to this</tspan></text>
<text x="56" y="1206"><tspan class="k">judgement, the Election Commission issued in 2003 an order¹⁷ directing every candidate</tspan></text>
<text x="56" y="1228"><tspan class="k">seeking election to the Parliament or a State Legislature to furnish on his nomination</tspan></text>
<text x="56" y="1250"><tspan class="k">paper the information on the above (a) to (e) matters. Furnishing of any false</tspan></text>
<text x="56" y="1272"><tspan class="k">information in the affidavit is now an electoral offence.</tspan></text>
<text class="sh" x="40" y="1300"><tspan class="r" style="font-weight:700">T.M.A. PAI Foundation Case (2002)</tspan></text>
<text class="sm" x="135" y="1332" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1332" text-anchor="middle"><tspan class="r" style="font-weight:700">T.M.A. Pai Foundation vs. State of Karnataka</tspan></text>
<line class="gx" x1="40" y1="1343" x2="640" y2="1343"/>
<text class="sm" x="47" y="1363"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1363"><tspan class="r">2002</tspan></text>
<line class="gx" x1="40" y1="1374" x2="640" y2="1374"/>
<text class="sm" x="47" y="1394"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1394"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="1405" x2="640" y2="1405"/>
<text class="sm" x="47" y="1425"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1425"><tspan class="k">Rights of minority educational institutions</tspan></text>
<line class="gx" x1="40" y1="1436" x2="640" y2="1436"/>
<text class="sm" x="47" y="1456"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1456"><tspan class="r">29 &amp; 30</tspan></text>
<line class="gx" x1="40" y1="1467" x2="640" y2="1467"/>
<rect class="gx" x="40" y="1312" width="600" height="155"/>
<line class="gx" x1="230" y1="1312" x2="230" y2="1343"/>
<line class="gx" x1="230" y1="1343" x2="230" y2="1374"/>
<line class="gx" x1="230" y1="1374" x2="230" y2="1405"/>
<line class="gx" x1="230" y1="1405" x2="230" y2="1436"/>
<line class="gx" x1="230" y1="1436" x2="230" y2="1467"/>
<text x="44" y="1495"><tspan class="h" style="font-weight:700">Minority institutions’ autonomy:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It laid down the following</tspan></text>
<text x="56" y="1517"><tspan class="k">propositions with respect to the rights of and the permissible restrictions upon minority</tspan></text>
<text x="56" y="1539"><tspan class="k">educational institutions (both aided and unaided): (a) Linguistic and religious minorities</tspan></text>
<text x="56" y="1561"><tspan class="k">are covered by the expression</tspan><tspan class="b"> “minority”</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 30</tspan><tspan class="k">. Since reorganization of the</tspan></text>
<text x="56" y="1583"><tspan class="k">states in India has been on linguistic lines, therefore, for the purpose of determining the</tspan></text>
<text x="56" y="1605"><tspan class="k">minority, the unit will be the State and not the whole of India. Thus, religious and</tspan></text>
<text x="56" y="1627"><tspan class="k">linguistic minorities, who have been put at par in</tspan><tspan class="r"> Article 30</tspan><tspan class="k">, have to be considered</tspan></text>
<text x="56" y="1649"><tspan class="k">state-wise; (b)</tspan><tspan class="r"> Article 30(1)</tspan><tspan class="k"> gives religious and linguistic minorities the right to</tspan></text>
<text x="56" y="1671"><tspan class="k">establish and administer educational institutions of their choice. The use of the words</tspan></text>
<text x="56" y="1693"><tspan class="b">“of their choice”</tspan><tspan class="k"> indicates that even professional educational institutions would be</tspan></text>
<text x="56" y="1715"><tspan class="k">covered by</tspan><tspan class="r"> Article 30</tspan><tspan class="k">; (c) Admission of students to unaided minority educational</tspan></text>
<text x="56" y="1737"><tspan class="k">institutions, cannot be regulated by the State government or the university (except for</tspan></text>
<text x="56" y="1759"><tspan class="k">providing the qualifications and minimum conditions of eligibility in the interest of</tspan></text>
<text x="56" y="1781"><tspan class="k">academic standards); (d) The right to administer, not being an absolute one, there could</tspan></text>
<text x="56" y="1803"><tspan class="k">be regulatory measures for ensuring educational standards and maintaining excellence</tspan></text>
<text x="56" y="1825"><tspan class="k">thereof; (e) The moment aid is received by a minority educational institution, it would</tspan></text>
<text x="56" y="1847"><tspan class="k">be governed by</tspan><tspan class="r"> Article 29(2)</tspan><tspan class="k"> and would then not be able to refuse admission on</tspan></text>
<text x="56" y="1869"><tspan class="k">grounds of religion, race, caste, language or any of them. In other words, it cannot then</tspan></text>
<text x="56" y="1891"><tspan class="k">give preference to students of its own community; (f) In the case of aided professional</tspan></text>
<text x="56" y="1913"><tspan class="k">institutions, it can also be stipulated that passing of common entrance test held by the</tspan></text>
<text x="56" y="1935"><tspan class="k">state agency is necessary to seek admission; and (g) A minority institution may have its</tspan></text>
<text x="56" y="1957"><tspan class="k">own procedure and method of admission as well as selection of students, but such</tspan></text>
<text x="56" y="1979"><tspan class="k">procedure must be fair and transparent and selection of students in professional and</tspan></text>
<text x="56" y="2001"><tspan class="k">higher educational colleges should be on the basis of merit.</tspan></text>
<text x="44" y="2029"><tspan class="h" style="font-weight:700">93rd Amendment – Art. 15(5):</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> In order to overcome the</tspan></text>
<text x="56" y="2051"><tspan class="k">effect of this judgement and also the judgement delivered in the Inamdar case¹⁸</tspan></text>
<text x="56" y="2073"><tspan class="k">(2005), the</tspan><tspan class="r"> 93rd Amendment Act (2005)</tspan><tspan class="k"> was enacted. This amendment inserted a new</tspan></text>
<text x="56" y="2095"><tspan class="k">Clause (5) in</tspan><tspan class="r"> Article 15</tspan><tspan class="k">. This clause empowered the state to make any special provision</tspan></text>
<text x="56" y="2117"><tspan class="k">for the advancement of any socially and educationally backward classes of citizens or for</tspan></text>
<text x="56" y="2139"><tspan class="k">the scheduled castes or the scheduled tribes regarding their admission to educational</tspan></text>
<text x="56" y="2161"><tspan class="k">institutions. This provision also includes private educational institutions, whether aided or</tspan></text>
<text x="56" y="2183"><tspan class="k">unaided by the state, except the minority educational institutions under</tspan><tspan class="r"> Article 30(1)</tspan><tspan class="k">.</tspan></text>
