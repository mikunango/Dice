<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Shankari Prasad Case (1951)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Shankari Prasad vs. Union of India</tspan></text>

<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">1951</tspan></text>

<text class="sm" x="237" y="219"><tspan class="k">Parliament’s power to amend the constitution</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">13 &amp; 368</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>

<text x="44" y="289"><tspan class="h" style="font-weight:700">FRs amendable:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that the parliament’s amending</tspan></text>
<text x="56" y="311"><tspan class="k">power under</tspan><tspan class="r"> Article 368</tspan><tspan class="k"> also includes the power to amend the fundamental rights</tspan></text>
<text x="56" y="333"><tspan class="k">guaranteed in Part III of the Constitution. Further, it said that a constitutional</tspan></text>
<text x="56" y="355"><tspan class="k">amendment act enacted to abridge or take away the fundamental rights is not void</tspan></text>
<text x="56" y="377"><tspan class="k">under</tspan><tspan class="r"> Article 13(2)</tspan><tspan class="k">. Therefore, the court upheld the validity of the</tspan><tspan class="r"> 1st Amendment Act</tspan></text>
<text x="56" y="399"><tspan class="r">(1951)</tspan><tspan class="k">, which curtailed the right to property by inserting</tspan><tspan class="r"> Articles 31A and 31B</tspan><tspan class="k">.</tspan></text>
<text x="44" y="427"><tspan class="h" style="font-weight:700">Legislative vs constituent law:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> In this judgement, the</tspan></text>
<text x="56" y="449"><tspan class="k">Supreme Court made a distinction between the legislative law (ordinary law) and the</tspan></text>
<text x="56" y="471"><tspan class="k">constituent law (constitutional amendment law). In other words, the court has separated</tspan></text>
<text x="56" y="493"><tspan class="k">the ordinary legislative power of the Parliament from that of its constituent power. It</tspan></text>
<text x="56" y="515"><tspan class="k">held that the word</tspan><tspan class="b"> ‘law’</tspan><tspan class="k"> in</tspan><tspan class="r"> Article 13(2)</tspan><tspan class="k"> refers to an ordinary law and does not include</tspan></text>
<text x="56" y="537"><tspan class="k">a constituent law made under</tspan><tspan class="r"> Article 368</tspan><tspan class="k">. Hence, it laid down that the Parliament can</tspan></text>
<text x="56" y="559"><tspan class="k">amend any provision of the constitution and rejected the view that the Fundamental</tspan></text>
<text x="56" y="581"><tspan class="k">Rights are inviolable. This judgement held the field for one and half decade (1951 to</tspan></text>
<text x="56" y="603"><tspan class="k">1967). The Supreme Court re-affirmed the above judgement in the Sajjan Singh case³</tspan></text>
<text x="56" y="625"><tspan class="k">(1964). But the court overruled the above stand in the Golak Nath case⁴ (1967).</tspan></text>
<text class="xs" x="50" y="661"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> Sajjan Singh vs. State of Rajasthan (1964).</tspan></text>
<rect x="40" y="639" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="706"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> I.C. Golak Nath vs. State of Punjab (1967).</tspan></text>
<rect x="40" y="684" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sh" x="40" y="743"><tspan class="r" style="font-weight:700">Berubari Union Case (1960)</tspan></text>
<text class="sm" x="135" y="775" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="775" text-anchor="middle"><tspan class="r" style="font-weight:700">Berubari Union vs. Unknown⁵</tspan></text>
<line class="gx" x1="40" y1="786" x2="640" y2="786"/>

<text class="sm" x="237" y="806"><tspan class="r">1960</tspan></text>
<line class="gx" x1="40" y1="817" x2="640" y2="817"/>
<text class="sm" x="47" y="837"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="837"><tspan class="k">—</tspan></text>

<text class="sm" x="237" y="868"><tspan class="k">Cession of Indian Territory to a foreign state</tspan></text>
<line class="gx" x1="40" y1="879" x2="640" y2="879"/>
<text class="sm" x="47" y="899"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="899"><tspan class="r">3, 368 &amp; First Schedule</tspan></text>
<line class="gx" x1="40" y1="910" x2="640" y2="910"/>
<rect class="gx" x="40" y="755" width="600" height="155"/>
<line class="gx" x1="230" y1="755" x2="230" y2="786"/>

<text x="44" y="938"><tspan class="h" style="font-weight:700">Cession needs Art. 368 amendment:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It ruled that the</tspan></text>
<text x="56" y="960"><tspan class="k">power of Parliament under</tspan><tspan class="r"> Article 3</tspan><tspan class="k"> to diminish the area of a state does not cover</tspan></text>
<text x="56" y="982"><tspan class="k">cession of Indian territory to a foreign country. It stated that</tspan><tspan class="r"> Article 3</tspan><tspan class="k"> deals with the</tspan></text>
<text x="56" y="1004"><tspan class="k">internal adjustment inter se of the territories of the constituent states of the Indian</tspan></text>
<text x="56" y="1026"><tspan class="k">Union. Hence, Indian territory can be ceded to a foreign state only by an amendment of</tspan></text>
<text x="56" y="1048"><tspan class="k">the constitution under</tspan><tspan class="r"> Article 368</tspan><tspan class="k">, providing for the alteration of the First Schedule.</tspan></text>
<text x="56" y="1070"><tspan class="k">Further, the court held that the Preamble is not a part of the constitution.</tspan></text>
<text x="44" y="1098"><tspan class="h" style="font-weight:700">9th Amendment – Berubari transfer:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led</tspan></text>
<text x="56" y="1120"><tspan class="k">to the enactment of the</tspan><tspan class="r"> 9th Amendment Act (1960)</tspan><tspan class="k">. This amendment gave effect to</tspan></text>
<text x="56" y="1142"><tspan class="k">the transfer of certain territory known as Berubari Union (West Bengal) to Pakistan.</tspan></text>
<text x="56" y="1164"><tspan class="k">This transfer was done as per the provisions of Indo-Pak Agreement (Nehru-Noon</tspan></text>
<text x="56" y="1186"><tspan class="k">Agreement) of 1958, relating to Berubari Union and Exchange of Cooch-Behar Enclaves.</tspan></text>
<text class="xs" x="50" y="1222"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> Reference by the President of India under Article 143 of the constitution on the implementation</tspan></text>
<text class="xs" x="50" y="1240"><tspan class="k">of the Indo-Pak Agreement of 1958, relating to Berubari Union and Exchange of Cooch-Behar</tspan></text>
<text class="xs" x="50" y="1258"><tspan class="k">Enclaves (1960).</tspan></text>
<rect x="40" y="1200" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sh" x="40" y="1295"><tspan class="r" style="font-weight:700">K.M. Nanavati Case (1961)</tspan></text>
<text class="sm" x="135" y="1327" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1327" text-anchor="middle"><tspan class="r" style="font-weight:700">K.M. Nanavati vs. State of Maharashtra</tspan></text>
<line class="gx" x1="40" y1="1338" x2="640" y2="1338"/>

<text class="sm" x="237" y="1358"><tspan class="r">1961</tspan></text>
<line class="gx" x1="40" y1="1369" x2="640" y2="1369"/>

<text class="sm" x="237" y="1389"><tspan class="k">—</tspan></text>

<text class="sm" x="237" y="1420"><tspan class="k">Jury System of trial</tspan></text>
<line class="gx" x1="40" y1="1431" x2="640" y2="1431"/>

<text class="sm" x="237" y="1451"><tspan class="r">—</tspan></text>
<line class="gx" x1="40" y1="1462" x2="640" y2="1462"/>
<rect class="gx" x="40" y="1307" width="600" height="155"/>
<line class="gx" x1="230" y1="1307" x2="230" y2="1338"/>
<line class="gx" x1="230" y1="1338" x2="230" y2="1369"/>
<line class="gx" x1="230" y1="1369" x2="230" y2="1400"/>

<text x="44" y="1490"><tspan class="h" style="font-weight:700">Conviction upheld:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It affirmed the judgement of the</tspan></text>
<text x="56" y="1512"><tspan class="k">Bombay High Court. It held that the conviction of the accused Nanavati under</tspan><tspan class="r"> Section</tspan></text>
<text x="56" y="1534"><tspan class="r">302</tspan><tspan class="k"> of the Indian Penal Code and the sentence of life imprisonment passed on him by</tspan></text>
<text x="56" y="1556"><tspan class="k">the High Court are correct. He was awarded the punishment for the murder of his wife’s</tspan></text>
<text x="56" y="1578"><tspan class="k">paramour.</tspan></text>
<text x="44" y="1606"><tspan class="h" style="font-weight:700">End of jury trials:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement brought out the</tspan></text>
<text x="56" y="1628"><tspan class="k">shortcomings in the working of Jury System and led to its abolition. However, even after</tspan></text>
<text x="56" y="1650"><tspan class="k">this case also, there were some cases of jury trials in the country. Finally, the new Code</tspan></text>
<text x="56" y="1672"><tspan class="k">of Criminal Procedure, 1973 completely removed the system of trial by jury in India.</tspan></text>
<text x="56" y="1694"><tspan class="k">Further, the sentenced Nanavati, after spending 3 years in prison, was granted pardon by</tspan></text>
<text x="56" y="1716"><tspan class="k">the Governor.</tspan></text>
