<text class="r hd" x="340" y="53" text-anchor="middle">Landmark Judgements – 6 (1986–1992)</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">D.C. Wadhwa Case (1986)</tspan></text>
<text class="sm" x="135" y="126" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">D.C. Wadhwa vs. State of Bihar</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="157"><tspan class="r">1986</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="188"><tspan class="k">—</tspan></text>
<line class="gx" x1="40" y1="199" x2="640" y2="199"/>
<text class="sm" x="47" y="219"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="219"><tspan class="k">Ordinance-making power of the Governor</tspan></text>
<line class="gx" x1="40" y1="230" x2="640" y2="230"/>
<text class="sm" x="47" y="250"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="250"><tspan class="r">213</tspan></text>
<line class="gx" x1="40" y1="261" x2="640" y2="261"/>
<rect class="gx" x="40" y="106" width="600" height="155"/>
<line class="gx" x1="230" y1="106" x2="230" y2="137"/>
<line class="gx" x1="230" y1="137" x2="230" y2="168"/>
<line class="gx" x1="230" y1="168" x2="230" y2="199"/>
<line class="gx" x1="230" y1="199" x2="230" y2="230"/>
<line class="gx" x1="230" y1="230" x2="230" y2="261"/>
<text x="44" y="289"><tspan class="h" style="font-weight:700">Re-promulgation is fraud on Constitution:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It pointed out</tspan></text>
<text x="56" y="311"><tspan class="k">that between 1967-1981, the Governor of Bihar promulgated 256 ordinances and all these</tspan></text>
<text x="56" y="333"><tspan class="k">were kept in force for periods ranging from 1 to 14 years by repromulgation from time to</tspan></text>
<text x="56" y="355"><tspan class="k">time. It held that the exceptional power under</tspan><tspan class="r"> Article 213</tspan><tspan class="k"> cannot be used as a substitute</tspan></text>
<text x="56" y="377"><tspan class="k">for the law-making power of the State Legislature. It ruled that such a practice would be</tspan></text>
<text x="56" y="399"><tspan class="k">a</tspan><tspan class="b"> ‘subversion of the democratic process’</tspan><tspan class="k"> and a</tspan><tspan class="b"> ‘fraud on the constitution’</tspan><tspan class="k">. It opined that</tspan></text>
<text x="56" y="421"><tspan class="k">the ordinancemaking power is meant for meeting an extraordinary situation and it cannot</tspan></text>
<text x="56" y="443"><tspan class="k">be allowed to be</tspan><tspan class="b"> ‘perverted to serve political ends’</tspan><tspan class="k">. Accordingly, it declared the</tspan></text>
<text x="56" y="465"><tspan class="k">re-promulgated Bihar Intermediate Education Council Ordinance, 1985 as unconstitutional</tspan></text>
<text x="56" y="487"><tspan class="k">and invalid.</tspan></text>
<text x="44" y="515"><tspan class="h" style="font-weight:700">Check on ordinance raj:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement clearly exposed the</tspan></text>
<text x="56" y="537"><tspan class="k">fact that the ordinance-making power can be misused by the executive government.</tspan></text>
<text class="sh" x="40" y="565"><tspan class="r" style="font-weight:700">M.C. Mehta Case (1986)</tspan></text>
<text class="sm" x="135" y="597" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="597" text-anchor="middle"><tspan class="r" style="font-weight:700">M.C. Mehta vs. Union of India</tspan></text>
<line class="gx" x1="40" y1="608" x2="640" y2="608"/>
<text class="sm" x="47" y="628"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="628"><tspan class="r">1986</tspan></text>
<line class="gx" x1="40" y1="639" x2="640" y2="639"/>
<text class="sm" x="47" y="659"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="659"><tspan class="k">Oleum Gas Leak case</tspan></text>
<line class="gx" x1="40" y1="670" x2="640" y2="670"/>
<text class="sm" x="47" y="690"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="690"><tspan class="k">Power of the Supreme Court to award compensation</tspan></text>
<line class="gx" x1="40" y1="701" x2="640" y2="701"/>
<text class="sm" x="47" y="721"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="721"><tspan class="r">21 &amp; 32</tspan></text>
<line class="gx" x1="40" y1="732" x2="640" y2="732"/>
<rect class="gx" x="40" y="577" width="600" height="155"/>
<line class="gx" x1="230" y1="577" x2="230" y2="608"/>
<line class="gx" x1="230" y1="608" x2="230" y2="639"/>
<line class="gx" x1="230" y1="639" x2="230" y2="670"/>
<line class="gx" x1="230" y1="670" x2="230" y2="701"/>
<line class="gx" x1="230" y1="701" x2="230" y2="732"/>
<text x="44" y="760"><tspan class="h" style="font-weight:700">Article 32 – remedial power:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It held that its power under</tspan></text>
<text x="56" y="782"><tspan class="r">Article 32</tspan><tspan class="k"> is not only injective in ambit, i.e., preventing the infringement of fundamental</tspan></text>
<text x="56" y="804"><tspan class="k">right but also remedial in scope and providing relief against a breach of the fundamental</tspan></text>
<text x="56" y="826"><tspan class="k">right already committed. It stated that its power to grant such remedial relief may</tspan></text>
<text x="56" y="848"><tspan class="k">include the power to award compensation in appropriate cases. It clarified that the</tspan></text>
<text x="56" y="870"><tspan class="k">infringement of the fundamental right must be gross and patent i.e., incontrovertible and</tspan></text>
<text x="56" y="892"><tspan class="k">ex facie glaring. It observed that the instant applications for compensation are for the</tspan></text>
<text x="56" y="914"><tspan class="k">enforcement of the fundamental right to life enshrined in</tspan><tspan class="r"> Article 21</tspan><tspan class="k"> and hence, they are</tspan></text>
<text x="56" y="936"><tspan class="k">maintainable under</tspan><tspan class="r"> Article 32</tspan><tspan class="k">.</tspan></text>
<text x="44" y="964"><tspan class="h" style="font-weight:700">Absolute (no-fault) liability:</tspan><tspan class="k" style="font-weight:700"> Impact of the Judgement:</tspan><tspan class="k"> This judgement led to the</tspan></text>
<text x="56" y="986"><tspan class="k">expansion of the ambit of Environmental Law in the country. It introduced the new</tspan></text>
<text x="56" y="1008"><tspan class="k">principle of absolute liability (no-fault liability) in the place of the earlier principle of</tspan></text>
<text x="56" y="1030"><tspan class="k">strict liability.</tspan></text>
<text class="sh" x="40" y="1058"><tspan class="r" style="font-weight:700">Kihoto Hollohan Case (1992)</tspan></text>
<text class="sm" x="135" y="1090" text-anchor="middle"><tspan class="k" style="font-weight:700">Name of the Case</tspan></text>
<text class="sm" x="435" y="1090" text-anchor="middle"><tspan class="r" style="font-weight:700">Kihoto Hollohan vs. Zachillhu</tspan></text>
<line class="gx" x1="40" y1="1101" x2="640" y2="1101"/>
<text class="sm" x="47" y="1121"><tspan class="k" style="font-weight:700">Year of Judgement</tspan></text>
<text class="sm" x="237" y="1121"><tspan class="r">1992</tspan></text>
<line class="gx" x1="40" y1="1132" x2="640" y2="1132"/>
<text class="sm" x="47" y="1152"><tspan class="k" style="font-weight:700">Popular Name</tspan></text>
<text class="sm" x="237" y="1152"><tspan class="k">Defection case</tspan></text>
<line class="gx" x1="40" y1="1163" x2="640" y2="1163"/>
<text class="sm" x="47" y="1183"><tspan class="k" style="font-weight:700">Related Topic/Issue</tspan></text>
<text class="sm" x="237" y="1183"><tspan class="k">Validity of anti- defection law</tspan></text>
<line class="gx" x1="40" y1="1194" x2="640" y2="1194"/>
<text class="sm" x="47" y="1214"><tspan class="k" style="font-weight:700">Related Article/Schedule</tspan></text>
<text class="sm" x="237" y="1214"><tspan class="r">368 &amp; Tenth Schedule</tspan></text>
<line class="gx" x1="40" y1="1225" x2="640" y2="1225"/>
<rect class="gx" x="40" y="1070" width="600" height="155"/>
<line class="gx" x1="230" y1="1070" x2="230" y2="1101"/>
<line class="gx" x1="230" y1="1101" x2="230" y2="1132"/>
<line class="gx" x1="230" y1="1132" x2="230" y2="1163"/>
<line class="gx" x1="230" y1="1163" x2="230" y2="1194"/>
<line class="gx" x1="230" y1="1194" x2="230" y2="1225"/>
<text x="44" y="1253"><tspan class="h" style="font-weight:700">Paragraph 7 invalid – rest of Tenth Schedule upheld:</tspan><tspan class="k" style="font-weight:700"> Supreme Court Judgement:</tspan><tspan class="k"> It</tspan></text>
<text x="56" y="1275"><tspan class="k">declared paragraph 7 of the Tenth Schedule (which was inserted by the</tspan><tspan class="r"> 52nd</tspan></text>
<text x="56" y="1297"><tspan class="r">Amendment Act</tspan><tspan class="k">, 1985) as unconstitutional for violating the provision under</tspan><tspan class="r"> Article</tspan></text>
<text x="56" y="1319"><tspan class="r">368(2)</tspan><tspan class="k">. It held that paragraph 7 required to be ratified by at least half of the State</tspan></text>
<text x="56" y="1341"><tspan class="k">Legislatures for excluding the jurisdiction of the Supreme Court under</tspan><tspan class="r"> Article 136</tspan><tspan class="k"> and the</tspan></text>
<text x="56" y="1363"><tspan class="k">High Courts under</tspan><tspan class="r"> Article 226</tspan><tspan class="k">. However, the court upheld the validity of the remaining</tspan></text>
<text x="56" y="1385"><tspan class="k">part of the Tenth Schedule.</tspan></text>
