<div id="vis-container"><h2 class="sr-only">Quorum, Voting, Language and Rights of Ministers</h2>
<svg class="n" width="100%" viewBox="0 0 680 1079" role="img"><title>Quorum, Voting, Language and Rights of Ministers</title><desc>Quorum, Voting, Language and Rights of Ministers</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="121" y="26" width="439" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Quorum, Voting, Language and Rights of Ministers</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Quorum</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Quorum – 10 or 1/10:</tspan><tspan class="r"> Quorum</tspan><tspan class="k"> is the minimum number of members required to be present</tspan></text>
<text x="56" y="146"><tspan class="k">in the House before it can transact any business. It is</tspan><tspan class="r"> ten members or one-tenth</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="168"><tspan class="k">total number of members of the House (</tspan><tspan class="b">including the presiding officer</tspan><tspan class="k">),</tspan><tspan class="r"> whichever is</tspan></text>
<text x="56" y="190"><tspan class="r">greater</tspan><tspan class="k">. If there is no quorum during a meeting of the House, it is the duty of the</tspan></text>
<text x="56" y="212"><tspan class="k">presiding officer either to</tspan><tspan class="b"> adjourn the House or to suspend the meeting</tspan><tspan class="k"> until there is a</tspan></text>
<text x="56" y="234"><tspan class="k">quorum.</tspan></text>
<text class="sh" x="40" y="262"><tspan class="r" style="font-weight:700">Voting in House</tspan></text>
<text x="44" y="292"><tspan class="h" style="font-weight:700">Simple majority &amp; casting vote:</tspan><tspan class="k"> All matters at any sitting of either House are decided</tspan></text>
<text x="56" y="314"><tspan class="k">by a</tspan><tspan class="r"> majority of votes of the members present and voting</tspan><tspan class="k"> excluding the presiding officer.</tspan></text>
<text x="56" y="336"><tspan class="k">Only a few matters which are specifically mentioned in the Constitution, require either</tspan></text>
<text x="56" y="358"><tspan class="b">effective majority or special majority</tspan><tspan class="k">, not simple majority. The presiding officer (i.e.,</tspan></text>
<text x="56" y="380"><tspan class="k">Speaker in the case of assembly or chairman in the case of council or the person acting</tspan></text>
<text x="56" y="402"><tspan class="k">as such)</tspan><tspan class="r"> does not vote in the first instance</tspan><tspan class="k">, but exercises a</tspan><tspan class="r"> casting vote</tspan><tspan class="k"> in the case of</tspan></text>
<text x="56" y="424"><tspan class="k">an equality of votes.</tspan></text>
<text class="sh" x="40" y="452"><tspan class="r" style="font-weight:700">Language in State Legislature</tspan></text>
<text x="44" y="482"><tspan class="h" style="font-weight:700">Official language, Hindi or English:</tspan><tspan class="k"> The Constitution has declared the</tspan><tspan class="r"> official</tspan></text>
<text x="56" y="504"><tspan class="r">language(s) of the state or Hindi or English</tspan><tspan class="k">, to be the languages for transacting</tspan></text>
<text x="56" y="526"><tspan class="k">business in the state legislature. However, the presiding officer can permit a member to</tspan></text>
<text x="56" y="548"><tspan class="k">address the House in his/her</tspan><tspan class="r"> mother-tongue</tspan><tspan class="k">.</tspan></text>
<text x="44" y="576"><tspan class="h" style="font-weight:700">English after 15 years:</tspan><tspan class="k"> The state legislature is authorised to decide whether to continue</tspan></text>
<text x="56" y="598"><tspan class="k">or discontinue</tspan><tspan class="r"> English as a floor language</tspan><tspan class="k"> after the completion of</tspan><tspan class="r"> fifteen years</tspan><tspan class="k"> from the</tspan></text>
<text x="56" y="620"><tspan class="k">commencement of the Constitution (</tspan><tspan class="b">i.e., from 1965</tspan><tspan class="k">). In case of</tspan><tspan class="r"> Himachal Pradesh,</tspan></text>
<text x="56" y="642"><tspan class="r">Manipur, Meghalaya and Tripura</tspan><tspan class="k">, this time limit is</tspan><tspan class="r"> twenty-five years</tspan><tspan class="k"> and that of</tspan></text>
<text x="56" y="664"><tspan class="r">Arunachal Pradesh, Goa and Mizoram</tspan><tspan class="k">, it is</tspan><tspan class="r"> forty years</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="676" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="705" text-anchor="middle"><tspan class="r">15 years</tspan></text>
<text class="sm" x="137" y="723" text-anchor="middle"><tspan class="k">general (1965)</tspan></text>
<rect class="bx" x="243" y="676" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="696" text-anchor="middle"><tspan class="r">25 years</tspan></text>
<text class="sm" x="340" y="714" text-anchor="middle"><tspan class="k">HP, Manipur, Meghalaya,</tspan></text>
<text class="sm" x="340" y="732" text-anchor="middle"><tspan class="k">Tripura</tspan></text>
<rect class="bx" x="447" y="676" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="705" text-anchor="middle"><tspan class="r">40 years</tspan></text>
<text class="sm" x="543" y="723" text-anchor="middle"><tspan class="k">Arunachal, Goa, Mizoram</tspan></text>
<text class="sh" x="40" y="772"><tspan class="r" style="font-weight:700">Rights of Ministers and Advocate General</tspan></text>
<text x="44" y="802"><tspan class="h" style="font-weight:700">Right to speak, not vote:</tspan><tspan class="k"> In addition to the members of a House, every</tspan><tspan class="r"> minister and</tspan></text>
<text x="56" y="824"><tspan class="r">the advocate general</tspan><tspan class="k"> of the state have the</tspan><tspan class="r"> right to speak and take part</tspan><tspan class="k"> in the</tspan></text>
<text x="56" y="846"><tspan class="k">proceedings of either House or any of its committees of which he/she is named a</tspan></text>
<text x="56" y="868"><tspan class="k">member,</tspan><tspan class="r"> without being entitled to vote</tspan><tspan class="k">. There are two reasons underlying this</tspan></text>
<text x="56" y="890"><tspan class="k">constitutional provision:</tspan></text>
<text x="56" y="916" class="r" style="font-weight:700">1.</text>
<text x="78" y="916"><tspan class="h" style="font-weight:700">Non-member House:</tspan><tspan class="k"> A minister can participate in the proceedings of a</tspan><tspan class="r"> House, of</tspan></text>
<text x="78" y="938"><tspan class="r">which he/she is not a member</tspan><tspan class="k">.</tspan></text>
<text x="56" y="964" class="r" style="font-weight:700">2.</text>
<text x="78" y="964"><tspan class="h" style="font-weight:700">Non-member minister:</tspan><tspan class="k"> A minister, who is</tspan><tspan class="r"> not a member of either House</tspan><tspan class="k">, can</tspan></text>
<text x="78" y="986"><tspan class="k">participate in the proceedings of both the Houses⁸.</tspan></text>
<path d="M50 896 L44 896 L44 992 L50 992" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1022"><tspan class="r" style="font-weight:700">8</tspan><tspan class="k"> A person can remain a minister for six months, without being a member of either house of the</tspan></text>
<text class="xs" x="50" y="1040"><tspan class="k">state legislature.</tspan></text>
<rect x="40" y="1000" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
