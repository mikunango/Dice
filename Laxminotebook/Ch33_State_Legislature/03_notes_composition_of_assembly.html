<div id="vis-container"><h2 class="sr-only">Composition of Legislative Assembly</h2>
<svg class="n" width="100%" viewBox="0 0 680 1796" role="img"><title>Composition of Legislative Assembly</title><desc>Composition of Legislative Assembly</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="172" y="26" width="336" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Composition of Legislative Assembly</text>
<text class="r hd" x="40" y="100">COMPOSITION OF TWO HOUSES</text>
<line x1="40" y1="106" x2="276" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="134"><tspan class="r" style="font-weight:700">Composition of Assembly</tspan></text>
<text x="44" y="164"><tspan class="h" style="font-weight:700">Strength:</tspan><tspan class="k"> The legislative assembly consists of representatives</tspan><tspan class="r"> directly elected</tspan><tspan class="k"> by the</tspan></text>
<text x="56" y="186"><tspan class="k">people on the basis of</tspan><tspan class="r"> universal adult franchise</tspan><tspan class="k">. Its</tspan><tspan class="r"> maximum strength is fixed at 500</tspan></text>
<text x="56" y="208"><tspan class="k">and</tspan><tspan class="r"> minimum strength at 60</tspan><tspan class="k">. It means that its strength varies from 60 to 500</tspan></text>
<text x="56" y="230"><tspan class="k">depending on the</tspan><tspan class="b"> population size</tspan><tspan class="k"> of the state. However, in case of</tspan><tspan class="r"> Arunachal Pradesh,</tspan></text>
<text x="56" y="252"><tspan class="r">Sikkim and Goa</tspan><tspan class="k">, the minimum number is fixed at</tspan><tspan class="r"> 30</tspan><tspan class="k"> and in case of</tspan><tspan class="r"> Mizoram and</tspan></text>
<text x="56" y="274"><tspan class="r">Nagaland</tspan><tspan class="k">, it is</tspan><tspan class="r"> 40 and 46</tspan><tspan class="k"> respectively. Further, some members of the legislative</tspan></text>
<text x="56" y="296"><tspan class="k">assemblies in</tspan><tspan class="b"> Sikkim and Nagaland</tspan><tspan class="k"> are also</tspan><tspan class="b"> elected indirectly</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="308" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="346" text-anchor="middle"><tspan class="r" style="font-weight:700">Max 500</tspan></text>
<rect class="bx" x="192" y="308" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="346" text-anchor="middle"><tspan class="r" style="font-weight:700">Min 60</tspan></text>
<rect class="bx" x="345" y="308" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="328" text-anchor="middle"><tspan class="r">30</tspan></text>
<text class="sm" x="416" y="346" text-anchor="middle"><tspan class="k">Arunachal, Sikkim,</tspan></text>
<text class="sm" x="416" y="364" text-anchor="middle"><tspan class="k">Goa</tspan></text>
<rect class="bx" x="498" y="308" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="337" text-anchor="middle"><tspan class="r">40 / 46</tspan></text>
<text class="sm" x="569" y="355" text-anchor="middle"><tspan class="k">Mizoram / Nagaland</tspan></text>
<text x="44" y="404"><tspan class="h" style="font-weight:700">Table 33.2 reference:</tspan><tspan class="k"> The strength of legislative assemblies is indicated in</tspan><tspan class="r"> Table 33.2</tspan><tspan class="k">.</tspan></text>
<text x="44" y="432"><tspan class="h" style="font-weight:700">Nominated Member:</tspan><tspan class="k"> Before</tspan><tspan class="r"> 2020</tspan><tspan class="k">, the</tspan><tspan class="r"> Governor</tspan><tspan class="k"> nominated</tspan><tspan class="r"> one member from the</tspan></text>
<text x="56" y="454"><tspan class="r">Anglo-Indian community³</tspan><tspan class="k"> to the assembly, if the community was not adequately</tspan></text>
<text x="56" y="476"><tspan class="k">represented. Originally, this provision was to operate for</tspan><tspan class="b"> ten years (i.e., upto 1960)</tspan><tspan class="k"> only.</tspan></text>
<text x="56" y="498"><tspan class="k">Later, this duration has been extended continuously since then by ten years each time.</tspan></text>
<text x="56" y="520"><tspan class="k">The last extension upto 2020 was made by the</tspan><tspan class="r"> 95th Amendment Act, 2009</tspan><tspan class="k">. But, the</tspan></text>
<text x="56" y="542"><tspan class="r">104th Amendment Act, 2019</tspan><tspan class="k">, has</tspan><tspan class="r"> not extended</tspan><tspan class="k"> further the operation of this provision. In</tspan></text>
<text x="56" y="564"><tspan class="k">other words, the Amendment</tspan><tspan class="b"> discontinued this provision</tspan><tspan class="k"> of special representation of the</tspan></text>
<text x="56" y="586"><tspan class="k">Anglo-Indian community in the Assembly by nomination. Consequently, this provision</tspan></text>
<text x="56" y="608"><tspan class="r">ceased to have effect on the 25th January, 2020</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="103" y="620" width="110" height="30" rx="3"/>
<text class="sm" x="158" y="639" text-anchor="middle"><tspan class="k">1950: 10 years</tspan></text>
<line class="ln" x1="216" y1="635" x2="236" y2="635" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="620" width="168" height="30" rx="3"/>
<text class="sm" x="322" y="639" text-anchor="middle"><tspan class="k">extended every 10 years</tspan></text>
<line class="ln" x1="409" y1="635" x2="429" y2="635" marker-end="url(#ah)"/>
<rect class="bx" x="432" y="620" width="145" height="30" rx="3"/>
<text class="sm" x="505" y="639" text-anchor="middle"><tspan class="r">95th Amdt</tspan><tspan class="k"> → 2020</tspan></text>
<line class="ln" x1="340" y1="651" x2="340" y2="672" marker-end="url(#ah)"/>
<rect class="bx" x="228" y="674" width="224" height="30" rx="3"/>
<text class="sm" x="340" y="693" text-anchor="middle"><tspan class="r">104th Amdt</tspan><tspan class="k">: ended</tspan><tspan class="r"> 25 Jan 2020</tspan></text>
<text x="44" y="732"><tspan class="h" style="font-weight:700">Territorial Constituencies:</tspan><tspan class="k"> For the purpose of holding direct elections to the assembly,</tspan></text>
<text x="56" y="754"><tspan class="k">each state is divided into</tspan><tspan class="r"> territorial constituencies</tspan><tspan class="k">. The demarcation of these</tspan></text>
<text x="56" y="776"><tspan class="k">constituencies is done in such a manner that the</tspan><tspan class="r"> ratio between the population of each</tspan></text>
<text x="56" y="798"><tspan class="r">constituency and the number of seats</tspan><tspan class="k"> allotted to it is the</tspan><tspan class="r"> same throughout the state</tspan><tspan class="k">. In</tspan></text>
<text x="56" y="820"><tspan class="k">other words, the Constitution ensures that there is</tspan><tspan class="r"> uniformity of representation</tspan><tspan class="k"> between</tspan></text>
<text x="56" y="842"><tspan class="k">different constituencies in the state. The expression ‘</tspan><tspan class="r">population</tspan><tspan class="k">’ means, the population</tspan></text>
<text x="56" y="864"><tspan class="k">as ascertained at the</tspan><tspan class="b"> last preceding census</tspan><tspan class="k"> of which the relevant figures have been</tspan></text>
<text x="56" y="886"><tspan class="k">published.</tspan></text>
<text x="44" y="914"><tspan class="h" style="font-weight:700">Readjustment after each census:</tspan><tspan class="k"> After each census, a readjustment is to be made in</tspan></text>
<text x="56" y="936"><tspan class="k">the (a)</tspan><tspan class="b"> total number of seats</tspan><tspan class="k"> in the assembly of each state and (b) the</tspan><tspan class="b"> division of</tspan></text>
<text x="56" y="958"><tspan class="b">each state into territorial constituencies</tspan><tspan class="k">. The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> is empowered to determine the</tspan></text>
<text x="56" y="980"><tspan class="k">authority and the manner in which it is to be made. Accordingly, Parliament has enacted</tspan></text>
<text x="56" y="1002"><tspan class="k">the</tspan><tspan class="r"> Delimitation Commission Acts in 1952, 1962, 1972 and 2002</tspan><tspan class="k"> for this purpose.</tspan></text>
<text x="44" y="1030"><tspan class="h" style="font-weight:700">Freeze till 2026:</tspan><tspan class="k"> The</tspan><tspan class="r"> 42nd Amendment Act of 1976</tspan><tspan class="k"> had</tspan><tspan class="r"> frozen</tspan><tspan class="k"> total number of seats in</tspan></text>
<text x="56" y="1052"><tspan class="k">the assembly of each state and the division of such state into territorial constituencies</tspan></text>
<text x="56" y="1074"><tspan class="r">till the year 2000 at the 1971 level</tspan><tspan class="k">. This ban on readjustment has been extended for</tspan></text>
<text x="56" y="1096"><tspan class="k">another years (</tspan><tspan class="r">i.e., upto year 2026</tspan><tspan class="k">) by the</tspan><tspan class="r"> 84th Amendment Act of 2001</tspan><tspan class="k"> with the</tspan></text>
<text x="56" y="1118"><tspan class="k">same objective of</tspan><tspan class="b"> encouraging population limiting measures</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1146"><tspan class="h" style="font-weight:700">Delimitation on 2001 census:</tspan><tspan class="k"> The 84th Amendment Act of 2001 also empowered the</tspan></text>
<text x="56" y="1168"><tspan class="k">government to undertake</tspan><tspan class="r"> readjustment and rationalisation</tspan><tspan class="k"> of territorial constituencies in</tspan></text>
<text x="56" y="1190"><tspan class="k">a state on the basis of the population figures of</tspan><tspan class="r"> 1991 census</tspan><tspan class="k">. Later, the</tspan><tspan class="r"> 87th</tspan></text>
<text x="56" y="1212"><tspan class="r">Amendment Act of 2003</tspan><tspan class="k"> provided for the delimitation of constituencies on the basis of</tspan></text>
<text x="56" y="1234"><tspan class="r">2001 census</tspan><tspan class="k"> and not 1991 census. However, this can be done</tspan><tspan class="b"> without altering the total</tspan></text>
<text x="56" y="1256"><tspan class="b">number of seats</tspan><tspan class="k"> in the assembly of each state.</tspan></text>
<rect class="bx" x="67" y="1268" width="260" height="48" rx="3"/>
<text class="sm" x="197" y="1287" text-anchor="middle"><tspan class="r">42nd Amdt 1976</tspan><tspan class="k">: freeze at 1971 till</tspan></text>
<text class="sm" x="197" y="1305" text-anchor="middle"><tspan class="k">2000</tspan></text>
<line class="ln" x1="330" y1="1292" x2="350" y2="1292" marker-end="url(#ah)"/>
<rect class="bx" x="353" y="1268" width="260" height="48" rx="3"/>
<text class="sm" x="483" y="1287" text-anchor="middle"><tspan class="r">84th Amdt 2001</tspan><tspan class="k">: till 2026 (1991</tspan></text>
<text class="sm" x="483" y="1305" text-anchor="middle"><tspan class="k">census)</tspan></text>
<line class="ln" x1="340" y1="1317" x2="340" y2="1338" marker-end="url(#ah)"/>
<rect class="bx" x="235" y="1340" width="209" height="30" rx="3"/>
<text class="sm" x="340" y="1359" text-anchor="middle"><tspan class="r">87th Amdt 2003</tspan><tspan class="k">: 2001 census</tspan></text>
<text x="44" y="1398"><tspan class="h" style="font-weight:700">Reservation of seats for SCs and STs:</tspan><tspan class="k"> The Constitution provided for the reservation of</tspan></text>
<text x="56" y="1420"><tspan class="k">seats for</tspan><tspan class="r"> scheduled castes and scheduled tribes</tspan><tspan class="k"> in the assembly of each state on the</tspan></text>
<text x="56" y="1442"><tspan class="k">basis of</tspan><tspan class="r"> population ratios</tspan><tspan class="k">.⁴</tspan></text>
<text x="44" y="1470"><tspan class="h" style="font-weight:700">Reservation till 2030:</tspan><tspan class="k"> Originally, this reservation was to operate for</tspan><tspan class="b"> ten years (i.e., up to</tspan></text>
<text x="56" y="1492"><tspan class="b">1960)</tspan><tspan class="k">. But this duration has been extended continuously since then by 10 years each</tspan></text>
<text x="56" y="1514"><tspan class="k">time. Now, under the</tspan><tspan class="r"> 104th Amendment Act of 2019</tspan><tspan class="k">, this reservation is to last</tspan><tspan class="r"> until</tspan></text>
<text x="56" y="1536"><tspan class="r">2030</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1564"><tspan class="h" style="font-weight:700">Reserved seats – Table 33.2:</tspan><tspan class="k"> The seats reserved for SCs and STs in the legislative</tspan></text>
<text x="56" y="1586"><tspan class="k">assemblies is indicated in</tspan><tspan class="r"> Table 33.2</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1622"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> An Anglo-Indian means a person whose father or any other male progenitor in the male line is or</tspan></text>
<text class="xs" x="50" y="1640"><tspan class="k">was of European descent, but who is domiciled within the territory of India and is or was born</tspan></text>
<text class="xs" x="50" y="1658"><tspan class="k">within such territory of parents habitually resident therein and not established there for temporary</tspan></text>
<text class="xs" x="50" y="1676"><tspan class="k">purposes only.</tspan></text>
<rect x="40" y="1600" width="600" height="85" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1721"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> This means that the number of assembly seats reserved in a state for such castes and tribes is</tspan></text>
<text class="xs" x="50" y="1739"><tspan class="k">to bear the same proportion to the total number of seats in the assembly as the population of such</tspan></text>
<text class="xs" x="50" y="1757"><tspan class="k">castes and tribes in the concerned state bears to the total population of the state.</tspan></text>
<rect x="40" y="1699" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
