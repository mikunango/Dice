<div id="vis-container"><h2 class="sr-only">Money Bills and Bills Reserved for President</h2>
<svg class="n" width="100%" viewBox="0 0 680 1622" role="img"><title>Money Bills and Bills Reserved for President</title><desc>Money Bills and Bills Reserved for President</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="142" y="26" width="395" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Money Bills and Bills Reserved for President</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Money Bills</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Special procedure:</tspan><tspan class="k"> The Constitution lays down a</tspan><tspan class="r"> special procedure</tspan><tspan class="k"> for the passing of</tspan></text>
<text x="56" y="146"><tspan class="k">Money Bills in the state legislature. This is as follows:</tspan></text>
<text x="44" y="174"><tspan class="h" style="font-weight:700">Assembly only – Governor’s recommendation:</tspan><tspan class="k"> A Money Bill</tspan><tspan class="r"> cannot be introduced in the</tspan></text>
<text x="56" y="196"><tspan class="r">legislative council</tspan><tspan class="k">. It can be introduced in the</tspan><tspan class="r"> legislative assembly only</tspan><tspan class="k"> and that too on</tspan></text>
<text x="56" y="218"><tspan class="k">the</tspan><tspan class="r"> recommendation of the governor</tspan><tspan class="k">. Every such bill is considered to be a</tspan><tspan class="r"> government</tspan></text>
<text x="56" y="240"><tspan class="r">bill</tspan><tspan class="k"> and can be introduced</tspan><tspan class="r"> only by a minister</tspan><tspan class="k">.</tspan></text>
<text x="44" y="268"><tspan class="h" style="font-weight:700">Council – 14 days, recommendations only:</tspan><tspan class="k"> After a Money Bill is passed by the</tspan></text>
<text x="56" y="290"><tspan class="k">legislative assembly, it is transmitted to the legislative council for its consideration. The</tspan></text>
<text x="56" y="312"><tspan class="k">legislative council has</tspan><tspan class="r"> restricted powers</tspan><tspan class="k"> with regard to a Money Bill. It</tspan><tspan class="r"> cannot reject or</tspan></text>
<text x="56" y="334"><tspan class="r">amend</tspan><tspan class="k"> a Money Bill. It can only</tspan><tspan class="r"> make recommendations</tspan><tspan class="k"> and must return the bill to the</tspan></text>
<text x="56" y="356"><tspan class="k">legislative assembly</tspan><tspan class="r"> within 14 days</tspan><tspan class="k">. The legislative assembly can either</tspan><tspan class="b"> accept or reject</tspan></text>
<text x="56" y="378"><tspan class="b">all or any</tspan><tspan class="k"> of the recommendations of the legislative council.</tspan></text>
<text x="44" y="406"><tspan class="h" style="font-weight:700">Deemed passed:</tspan><tspan class="k"> If the legislative assembly accepts any recommendation, the bill is then</tspan></text>
<text x="56" y="428"><tspan class="k">deemed to have been passed by both the Houses in the</tspan><tspan class="r"> modified form</tspan><tspan class="k">. If the legislative</tspan></text>
<text x="56" y="450"><tspan class="k">assembly does not accept any recommendation, the bill is then deemed to have been</tspan></text>
<text x="56" y="472"><tspan class="k">passed by both the Houses in the</tspan><tspan class="r"> form originally passed</tspan><tspan class="k"> by the legislative assembly</tspan></text>
<text x="56" y="494"><tspan class="k">without any change.</tspan></text>
<text x="44" y="522"><tspan class="h" style="font-weight:700">Delay of 14 days only:</tspan><tspan class="k"> If the legislative council</tspan><tspan class="r"> does not return the bill</tspan><tspan class="k"> to the legislative</tspan></text>
<text x="56" y="544"><tspan class="k">assembly</tspan><tspan class="r"> within 14 days</tspan><tspan class="k">, the bill is</tspan><tspan class="r"> deemed to have been passed</tspan><tspan class="k"> by both Houses at the</tspan></text>
<text x="56" y="566"><tspan class="k">expiry of the said period in the form originally passed by the legislative assembly. Thus,</tspan></text>
<text x="56" y="588"><tspan class="k">the legislative assembly has</tspan><tspan class="r"> more powers</tspan><tspan class="k"> than legislative council with regard to a money</tspan></text>
<text x="56" y="610"><tspan class="k">bill. At the most, the legislative council can detain or delay a money bill for a period of</tspan></text>
<text x="56" y="632"><tspan class="r">14 days</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="78" y="644" width="260" height="30" rx="3"/>
<text class="sm" x="208" y="663" text-anchor="middle"><tspan class="k">Assembly (</tspan><tspan class="r">Governor’s recommendation</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="341" y1="659" x2="361" y2="659" marker-end="url(#ah)"/>
<rect class="bx" x="364" y="644" width="237" height="30" rx="3"/>
<text class="sm" x="483" y="663" text-anchor="middle"><tspan class="k">Council: recommend within</tspan><tspan class="r"> 14 days</tspan></text>
<line class="ln" x1="340" y1="675" x2="340" y2="696" marker-end="url(#ah)"/>
<rect class="bx" x="176" y="698" width="187" height="30" rx="3"/>
<text class="sm" x="269" y="717" text-anchor="middle"><tspan class="k">Assembly accepts / rejects</tspan></text>
<line class="ln" x1="365" y1="713" x2="385" y2="713" marker-end="url(#ah)"/>
<rect class="bx" x="388" y="698" width="116" height="30" rx="3"/>
<text class="sm" x="446" y="717" text-anchor="middle"><tspan class="r" style="font-weight:700">deemed passed</tspan></text>
<text x="44" y="756"><tspan class="h" style="font-weight:700">Governor cannot return money bill:</tspan><tspan class="k"> Finally, when a Money Bill is presented to the</tspan></text>
<text x="56" y="778"><tspan class="k">governor, he/she may either</tspan><tspan class="r"> give his/her assent, withhold his/her assent or reserve</tspan><tspan class="k"> the</tspan></text>
<text x="56" y="800"><tspan class="k">bill for presidential assent but</tspan><tspan class="r"> cannot return the bill for reconsideration</tspan><tspan class="k"> of the state</tspan></text>
<text x="56" y="822"><tspan class="k">legislature. Normally, the governor gives his/her assent to a money bill as it is introduced</tspan></text>
<text x="56" y="844"><tspan class="k">in the state legislature with his/her</tspan><tspan class="b"> prior permission</tspan><tspan class="k">.</tspan></text>
<text x="44" y="872"><tspan class="h" style="font-weight:700">President cannot return money bill:</tspan><tspan class="k"> When a money bill is reserved for consideration of</tspan></text>
<text x="56" y="894"><tspan class="k">the President, the President may either</tspan><tspan class="r"> give his/her assent</tspan><tspan class="k"> to the bill or</tspan><tspan class="r"> withhold his/her</tspan></text>
<text x="56" y="916"><tspan class="r">assent</tspan><tspan class="k"> to the bill but</tspan><tspan class="r"> cannot return the bill</tspan><tspan class="k"> for reconsideration of the state legislature.</tspan></text>
<text class="r hd" x="40" y="950">BILLS RESERVED FOR PRESIDENT’S CONSIDERATION</text>
<line x1="40" y1="956" x2="442" y2="956" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="984"><tspan class="h" style="font-weight:700">Sarkaria – three categories:</tspan><tspan class="k"> The</tspan><tspan class="r"> Sarkaria Commission</tspan><tspan class="k"> on Centre-State Relations</tspan></text>
<text x="56" y="1006"><tspan class="k">(1983–88) classified the State Bills reserved for President’s consideration under the</tspan></text>
<text x="56" y="1028"><tspan class="k">Constitution in the following</tspan><tspan class="r"> three categories</tspan><tspan class="k">:</tspan></text>
<text x="56" y="1054" class="r" style="font-weight:700">1.</text>
<text x="78" y="1054"><tspan class="h" style="font-weight:700">Bills which must be reserved for President’s consideration:</tspan><tspan class="k"> In this category,</tspan></text>
<text x="78" y="1076"><tspan class="k">come Bills— 1. which so</tspan><tspan class="r"> derogate from the powers of the High Court</tspan><tspan class="k">, as to</tspan></text>
<text x="78" y="1098"><tspan class="k">endanger the position which that Court is under the Constitution designed to fill</tspan></text>
<text x="78" y="1120"><tspan class="k">(</tspan><tspan class="r">Article 200</tspan><tspan class="k">); 2. which relate to imposition of</tspan><tspan class="r"> taxes on water or electricity</tspan><tspan class="k"> in</tspan></text>
<text x="78" y="1142"><tspan class="k">certain cases, and attract the provisions of</tspan><tspan class="r"> Article 288</tspan><tspan class="k">; and 3. which fall within</tspan></text>
<text x="78" y="1164"><tspan class="r">Article 360</tspan><tspan class="k">, during a</tspan><tspan class="r"> financial emergency</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1190" class="r" style="font-weight:700">2.</text>
<text x="78" y="1190"><tspan class="h" style="font-weight:700">Bills which may be reserved for President’s consideration and assent for</tspan></text>
<text x="78" y="1212"><tspan class="h" style="font-weight:700">specific purposes:</tspan><tspan class="k"> In this category, the following Bills come— 1. To secure</tspan></text>
<text x="78" y="1234"><tspan class="r">immunity from operation of Articles 14 and 19</tspan><tspan class="k">. These are Bills for— 1.</tspan><tspan class="b"> acquisition of</tspan></text>
<text x="78" y="1256"><tspan class="b">estates, etc. (Article 31A)</tspan><tspan class="k">; 2.</tspan><tspan class="b"> giving effect to certain Directive Principles of State</tspan></text>
<text x="78" y="1278"><tspan class="b">Policy (Article 31C)</tspan><tspan class="k">. 2. A Bill relating to a subject enumerated in the</tspan><tspan class="r"> Concurrent</tspan></text>
<text x="78" y="1300"><tspan class="r">List</tspan><tspan class="k">, to ensure operation of its provisions despite their</tspan><tspan class="r"> repugnancy</tspan><tspan class="k"> to a Union law or</tspan></text>
<text x="78" y="1322"><tspan class="k">an existing law, by securing President’s assent in terms of</tspan><tspan class="r"> Article 254</tspan><tspan class="k">. 3. A bill</tspan></text>
<text x="78" y="1344"><tspan class="k">imposing</tspan><tspan class="r"> restrictions on trade and commerce</tspan><tspan class="k"> requiring prior Presidential sanction</tspan></text>
<text x="78" y="1366"><tspan class="k">which was not obtained under</tspan><tspan class="r"> Article 304</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1392" class="r" style="font-weight:700">3.</text>
<text x="78" y="1392"><tspan class="h" style="font-weight:700">Residuary category:</tspan><tspan class="k"> Bills which may not specifically fall under any of the above</tspan></text>
<text x="78" y="1414"><tspan class="k">categories, yet</tspan><tspan class="r"> may be reserved by the Governor</tspan><tspan class="k"> for President’s consideration under</tspan></text>
<text x="78" y="1436"><tspan class="r">Article 200</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="540" y="1490" text-anchor="middle"><tspan class="r" style="font-weight:700">May reserve – others</tspan></text>
