<div id="vis-container"><h2 class="sr-only">Intro and organisation of state legislatures.</h2>
<svg class="n" width="100%" viewBox="0 0 680 1229" role="img"><title>CHAPTER 33 State Legislature</title><desc>Intro and organisation of state legislatures.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="194" y="26" width="292" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 33 State Legislature</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Constitutional basis (Arts. 168–212):</tspan><tspan class="k"> The state legislature occupies a</tspan><tspan class="r"> pre-eminent and</tspan></text>
<text x="56" y="116"><tspan class="r">central position</tspan><tspan class="k"> in the political system of a state.</tspan><tspan class="r"> Articles 168 to 212</tspan><tspan class="k"> in</tspan><tspan class="r"> Part VI</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="138"><tspan class="k">Constitution deal with the</tspan><tspan class="b"> organisation, composition, duration, officers, procedures,</tspan></text>
<text x="56" y="160"><tspan class="b">privileges, powers</tspan><tspan class="k"> and so on of the state legislature. Though these are</tspan><tspan class="r"> similar to that of</tspan></text>
<text x="56" y="182"><tspan class="r">Parliament</tspan><tspan class="k">, there are some differences as well.</tspan></text>
<text class="r hd" x="40" y="216">ORGANISATION OF STATE LEGISLATURE</text>
<line x1="40" y1="222" x2="343" y2="222" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="250"><tspan class="h" style="font-weight:700">Six bicameral states:</tspan><tspan class="k"> There is</tspan><tspan class="r"> no uniformity</tspan><tspan class="k"> in the organisation of state legislatures.</tspan></text>
<text x="56" y="272"><tspan class="k">Most of the states have an</tspan><tspan class="r"> unicameral system</tspan><tspan class="k">, while others have a</tspan><tspan class="r"> bicameral system</tspan><tspan class="k">. At</tspan></text>
<text x="56" y="294"><tspan class="k">present,</tspan><tspan class="r"> only six states have two Houses</tspan><tspan class="k"> (bicameral). These are</tspan><tspan class="r"> Andhra Pradesh,</tspan></text>
<text x="56" y="316"><tspan class="r">Telangana, Uttar Pradesh, Bihar, Maharashtra and Karnataka</tspan><tspan class="k">. The</tspan><tspan class="b"> Jammu and Kashmir</tspan></text>
<text x="56" y="338"><tspan class="b">Legislative Council was abolished</tspan><tspan class="k"> by the Jammu and Kashmir Reorganisation Act, 2019.¹</tspan></text>
<text x="56" y="360"><tspan class="k">The</tspan><tspan class="b"> Tamil Nadu Legislative Council Act, 2010 has not come into force</tspan><tspan class="k">. The Legislative</tspan></text>
<text x="56" y="382"><tspan class="k">Council in</tspan><tspan class="b"> Andhra Pradesh was revived</tspan><tspan class="k"> by the Andhra Pradesh Legislative Council Act,</tspan></text>
<text x="56" y="404"><tspan class="k">2005. The</tspan><tspan class="r"> 7th Amendment Act of 1956</tspan><tspan class="k"> provided for a Legislative Council in</tspan><tspan class="r"> Madhya</tspan></text>
<text x="56" y="426"><tspan class="r">Pradesh</tspan><tspan class="k">. However, a notification to this effect has to be made by the President. So far,</tspan></text>
<text x="56" y="448"><tspan class="b">no such notification has been made</tspan><tspan class="k">. Hence, Madhya Pradesh continues to have one</tspan></text>
<text x="56" y="470"><tspan class="k">House only.</tspan></text>
<line class="ln" x1="340" y1="476" x2="340" y2="488"/>
<line class="ln" x1="90" y1="488" x2="590" y2="488"/>
<line class="ln" x1="90" y1="488" x2="90" y2="504" marker-end="url(#ah)"/>
<line class="ln" x1="190" y1="488" x2="190" y2="504" marker-end="url(#ah)"/>
<line class="ln" x1="290" y1="488" x2="290" y2="504" marker-end="url(#ah)"/>
<line class="ln" x1="390" y1="488" x2="390" y2="504" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="488" x2="490" y2="504" marker-end="url(#ah)"/>
<line class="ln" x1="590" y1="488" x2="590" y2="504" marker-end="url(#ah)"/>
<text class="xs" x="90" y="524" text-anchor="middle"><tspan class="r">Andhra</tspan></text>
<text class="xs" x="90" y="542" text-anchor="middle"><tspan class="r">Pradesh</tspan></text>
<text class="xs" x="190" y="524" text-anchor="middle"><tspan class="r">Telangana</tspan></text>
<text class="xs" x="290" y="524" text-anchor="middle"><tspan class="r">Uttar Pradesh</tspan></text>
<text class="xs" x="390" y="524" text-anchor="middle"><tspan class="r">Bihar</tspan></text>
<text class="xs" x="490" y="524" text-anchor="middle"><tspan class="r">Maharashtra</tspan></text>
<text class="xs" x="590" y="524" text-anchor="middle"><tspan class="r">Karnataka</tspan></text>
<text x="44" y="574"><tspan class="h" style="font-weight:700">Unicameral vs bicameral:</tspan><tspan class="k"> The</tspan><tspan class="r"> twenty-two states</tspan><tspan class="k"> have a</tspan><tspan class="r"> unicameral system</tspan><tspan class="k">. Here, the</tspan></text>
<text x="56" y="596"><tspan class="k">state legislature consists of the</tspan><tspan class="b"> governor and the legislative assembly</tspan><tspan class="k">. In the states</tspan></text>
<text x="56" y="618"><tspan class="k">having</tspan><tspan class="r"> bicameral system</tspan><tspan class="k">, the state legislature consists of the</tspan><tspan class="b"> governor, the legislative</tspan></text>
<text x="56" y="640"><tspan class="b">council and the legislative assembly</tspan><tspan class="k">. The</tspan><tspan class="r"> legislative council (Vidhan Parishad)</tspan><tspan class="k"> is the</tspan></text>
<text x="56" y="662"><tspan class="b">upper house (second chamber or house of elders)</tspan><tspan class="k">, while the</tspan><tspan class="r"> legislative assembly (Vidhan</tspan></text>
<text x="56" y="684"><tspan class="r">Sabha)</tspan><tspan class="k"> is the</tspan><tspan class="b"> lower house (first chamber or popular house)</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="698" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="716" text-anchor="middle"><tspan class="r" style="font-weight:700">Unicameral (22 states)</tspan></text>
<line class="ln" x1="190" y1="726" x2="190" y2="740" marker-end="url(#ah)"/>
<text class="sm" x="190" y="761" text-anchor="middle"><tspan class="k">Governor</tspan></text>
<text class="sm" x="190" y="783" text-anchor="middle"><tspan class="k">+ Legislative Assembly</tspan></text>
<rect class="bx" x="346" y="698" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="716" text-anchor="middle"><tspan class="r" style="font-weight:700">Bicameral (6 states)</tspan></text>
<line class="ln" x1="490" y1="726" x2="490" y2="740" marker-end="url(#ah)"/>
<text class="sm" x="490" y="761" text-anchor="middle"><tspan class="k">Governor</tspan></text>
<text class="sm" x="490" y="783" text-anchor="middle"><tspan class="k">+ Legislative Council (upper)</tspan></text>
<text class="sm" x="490" y="805" text-anchor="middle"><tspan class="k">+ Legislative Assembly (lower)</tspan></text>
<line x1="340" y1="698" x2="340" y2="808" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="842"><tspan class="h" style="font-weight:700">Creation / abolition of councils (Art. 169):</tspan><tspan class="k"> The Constitution (</tspan><tspan class="r">Article 169</tspan><tspan class="k">) provides for</tspan></text>
<text x="56" y="864"><tspan class="k">the</tspan><tspan class="r"> abolition or creation of legislative councils</tspan><tspan class="k"> in states. Accordingly, the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> can</tspan></text>
<text x="56" y="886"><tspan class="k">abolish a legislative council (where it already exists) or create it (where it does not</tspan></text>
<text x="56" y="908"><tspan class="k">exist), if the</tspan><tspan class="r"> legislative assembly</tspan><tspan class="k"> of the concerned state passes a</tspan><tspan class="r"> resolution</tspan><tspan class="k"> to that</tspan></text>
<text x="56" y="930"><tspan class="k">effect. Such a specific resolution must be passed by the state assembly by a</tspan><tspan class="r"> special</tspan></text>
<text x="56" y="952"><tspan class="r">majority</tspan><tspan class="k">, that is,</tspan><tspan class="b"> a majority of the total membership of the assembly and a majority of</tspan></text>
<text x="56" y="974"><tspan class="b">not less than two-thirds of the members of the assembly present and voting</tspan><tspan class="k">. This Act</tspan></text>
<text x="56" y="996"><tspan class="k">of Parliament is</tspan><tspan class="r"> not to be deemed as an amendment of the Constitution</tspan><tspan class="k"> for the</tspan></text>
<text x="56" y="1018"><tspan class="k">purposes of</tspan><tspan class="r"> Article 368</tspan><tspan class="k"> and is passed like an ordinary piece of legislation (</tspan><tspan class="b">ie, by simple</tspan></text>
<text x="56" y="1040"><tspan class="b">majority</tspan><tspan class="k">).</tspan></text>
<rect class="bx" x="87" y="1052" width="256" height="30" rx="3"/>
<text class="sm" x="214" y="1071" text-anchor="middle"><tspan class="k">Assembly resolution (</tspan><tspan class="r">special majority</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="345" y1="1067" x2="365" y2="1067" marker-end="url(#ah)"/>
<rect class="bx" x="368" y="1052" width="225" height="30" rx="3"/>
<text class="sm" x="481" y="1071" text-anchor="middle"><tspan class="k">Parliament law (</tspan><tspan class="r">simple majority</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="340" y1="1083" x2="340" y2="1104" marker-end="url(#ah)"/>
<rect class="bx" x="145" y="1106" width="186" height="30" rx="3"/>
<text class="sm" x="238" y="1125" text-anchor="middle"><tspan class="k">council created / abolished</tspan></text>
<line class="ln" x1="333" y1="1121" x2="353" y2="1121" marker-end="url(#ah)"/>
<rect class="bx" x="356" y="1106" width="179" height="30" rx="3"/>
<text class="sm" x="446" y="1125" text-anchor="middle"><tspan class="b">not Art. 368 amendment</tspan></text>
<text class="xs" x="50" y="1172"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> The erstwhile state of Jammu and Kashmir had adopted a bicameral legislature by its own state</tspan></text>
<text class="xs" x="50" y="1190"><tspan class="k">Constitution, which was separate from the Indian Constitution.</tspan></text>
<rect x="40" y="1150" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
