<title>Legislative Procedure – Ordinary Bills</title>

<div id="vis-container"><h2 class="sr-only">Legislative Procedure – Ordinary Bills</h2>
<svg class="n" width="100%" viewBox="0 0 680 1910" role="img"><title>Legislative Procedure – Ordinary Bills</title><desc>Legislative Procedure – Ordinary Bills</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="169" y="26" width="343" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Legislative Procedure – Ordinary Bills</text>
<text class="r hd" x="40" y="100">LEGISLATIVE PROCEDURE IN STATE LEGISLATURE</text>
<line x1="40" y1="106" x2="420" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="134"><tspan class="r" style="font-weight:700">Ordinary Bills</tspan></text>
<text x="44" y="164"><tspan class="h" style="font-weight:700">Bill in the Originating House:</tspan><tspan class="k"> An ordinary bill can originate in</tspan><tspan class="r"> either House</tspan><tspan class="k"> of the state</tspan></text>
<text x="56" y="186"><tspan class="k">legislature (in case of a bicameral legislature). Such a bill can be introduced either by a</tspan></text>
<text x="56" y="208"><tspan class="r">minister or by any other member</tspan><tspan class="k">. The bill passes through</tspan><tspan class="r"> three stages</tspan><tspan class="k"> in the originating</tspan></text>
<text x="56" y="230"><tspan class="k">House, viz,</tspan></text>
<text x="56" y="256" class="r" style="font-weight:700">1.</text>
<text x="78" y="256"><tspan class="k">First reading,</tspan></text>
<text x="56" y="282" class="r" style="font-weight:700">2.</text>
<text x="78" y="282"><tspan class="k">Second reading, and</tspan></text>
<text x="56" y="308" class="r" style="font-weight:700">3.</text>
<text x="78" y="308"><tspan class="k">Third reading.</tspan></text>
<path d="M50 236 L44 236 L44 314 L50 314" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="336"><tspan class="h" style="font-weight:700">Passage by both Houses:</tspan><tspan class="k"> After the bill is passed by the originating House, it is</tspan></text>
<text x="56" y="358"><tspan class="k">transmitted to the second House for consideration and passage. A bill is deemed to have</tspan></text>
<text x="56" y="380"><tspan class="k">been passed by the state legislature only when</tspan><tspan class="r"> both the Houses have agreed</tspan><tspan class="k"> to it, either</tspan></text>
<text x="56" y="402"><tspan class="k">with or without amendments. In case of a</tspan><tspan class="r"> unicameral legislature</tspan><tspan class="k">, a bill passed by the</tspan></text>
<text x="56" y="424"><tspan class="k">legislative assembly is</tspan><tspan class="r"> sent directly to the governor</tspan><tspan class="k"> for his/her assent.</tspan></text>
<text x="44" y="452"><tspan class="h" style="font-weight:700">Bill in the Second House:</tspan><tspan class="k"> In the second House also, the bill passes through all the three</tspan></text>
<text x="56" y="474"><tspan class="k">stages, that is, first reading, second reading and third reading.</tspan></text>
<text x="44" y="502"><tspan class="h" style="font-weight:700">Council’s four options:</tspan><tspan class="k"> When a bill is passed by the legislative assembly and</tspan></text>
<text x="56" y="524"><tspan class="k">transmitted to the legislative council, the latter has</tspan><tspan class="r"> four alternatives</tspan><tspan class="k"> before it:</tspan></text>
<text x="56" y="550" class="r" style="font-weight:700">1.</text>
<text x="78" y="550"><tspan class="k">it may</tspan><tspan class="r"> pass the bill</tspan><tspan class="k"> as sent by the assembly (i.e., without amendments);</tspan></text>
<text x="56" y="576" class="r" style="font-weight:700">2.</text>
<text x="78" y="576"><tspan class="k">it may</tspan><tspan class="r"> pass the bill with amendments</tspan><tspan class="k"> and return it to the assembly for</tspan></text>
<text x="78" y="598"><tspan class="k">reconsideration;</tspan></text>
<text x="56" y="624" class="r" style="font-weight:700">3.</text>
<text x="78" y="624"><tspan class="k">it may</tspan><tspan class="r"> reject</tspan><tspan class="k"> the bill altogether; and</tspan></text>
<text x="56" y="650" class="r" style="font-weight:700">4.</text>
<text x="78" y="650"><tspan class="k">it may</tspan><tspan class="r"> not take any action</tspan><tspan class="k"> and thus keep the bill pending.</tspan></text>
<path d="M50 530 L44 530 L44 656 L50 656" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="678"><tspan class="h" style="font-weight:700">Assembly overrides council – 3 + 1 months:</tspan><tspan class="k"> If the council passes the bill without</tspan></text>
<text x="56" y="700"><tspan class="k">amendments or the assembly accepts the amendments suggested by the council, the bill</tspan></text>
<text x="56" y="722"><tspan class="k">is deemed to have been passed by both the Houses and the same is sent to the the</tspan></text>
<text x="56" y="744"><tspan class="k">governor for his/her assent. On the other hand, if the assembly rejects the amendments</tspan></text>
<text x="56" y="766"><tspan class="k">suggested by the council or the council rejects the bill altogether or the council does not</tspan></text>
<text x="56" y="788"><tspan class="k">take any action for</tspan><tspan class="r"> three months</tspan><tspan class="k">, then the</tspan><tspan class="r"> assembly may pass the bill again</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="810"><tspan class="k">transmit the same to the council. If the council rejects the bill again or passes the bill</tspan></text>
<text x="56" y="832"><tspan class="k">with amendments not acceptable to the assembly or does not pass the bill within</tspan><tspan class="r"> one</tspan></text>
<text x="56" y="854"><tspan class="r">month</tspan><tspan class="k">, then the bill is</tspan><tspan class="r"> deemed to have been passed</tspan><tspan class="k"> by both the Houses in the form in</tspan></text>
<text x="56" y="876"><tspan class="k">which it was passed by the assembly for the second time.</tspan></text>
<rect class="bx" x="134" y="888" width="126" height="48" rx="3"/>
<text class="sm" x="197" y="916" text-anchor="middle"><tspan class="k">Assembly passes</tspan></text>
<line class="ln" x1="263" y1="912" x2="283" y2="912" marker-end="url(#ah)"/>
<rect class="bx" x="286" y="888" width="260" height="48" rx="3"/>
<text class="sm" x="416" y="907" text-anchor="middle"><tspan class="k">Council: reject / amend /</tspan><tspan class="r"> 3 months</tspan></text>
<text class="sm" x="416" y="925" text-anchor="middle"><tspan class="k">silence</tspan></text>
<line class="ln" x1="340" y1="937" x2="340" y2="958" marker-end="url(#ah)"/>
<rect class="bx" x="111" y="960" width="162" height="30" rx="3"/>
<text class="sm" x="193" y="979" text-anchor="middle"><tspan class="k">Assembly passes</tspan><tspan class="r"> again</tspan></text>
<line class="ln" x1="277" y1="975" x2="297" y2="975" marker-end="url(#ah)"/>
<rect class="bx" x="300" y="960" width="127" height="30" rx="3"/>
<text class="sm" x="363" y="979" text-anchor="middle"><tspan class="k">Council:</tspan><tspan class="r"> 1 month</tspan></text>
<line class="ln" x1="430" y1="975" x2="450" y2="975" marker-end="url(#ah)"/>
<rect class="bx" x="453" y="960" width="116" height="30" rx="3"/>
<text class="sm" x="511" y="979" text-anchor="middle"><tspan class="r" style="font-weight:700">deemed passed</tspan></text>
<text x="44" y="1018"><tspan class="h" style="font-weight:700">Council only a delaying chamber:</tspan><tspan class="k"> Therefore, the</tspan><tspan class="r"> ultimate power</tspan><tspan class="k"> of passing an ordinary</tspan></text>
<text x="56" y="1040"><tspan class="k">bill is vested in the</tspan><tspan class="r"> assembly</tspan><tspan class="k">. At the most, the council can</tspan><tspan class="r"> detain or delay the bill for a</tspan></text>
<text x="56" y="1062"><tspan class="r">period of four months</tspan><tspan class="k">—three months in the first instance and one month in the second</tspan></text>
<text x="56" y="1084"><tspan class="k">instance. The Constitution</tspan><tspan class="r"> does not provide for the mechanism of joint sitting</tspan><tspan class="k"> of both</tspan></text>
<text x="56" y="1106"><tspan class="k">the Houses to resolve the disagreement between the two Houses over a bill. On the</tspan></text>
<text x="56" y="1128"><tspan class="k">other hand, there is a provision for joint sitting of the Lok Sabha and the Rajya Sabha</tspan></text>
<text x="56" y="1150"><tspan class="k">to resolve a disagreement between the two over an ordinary bill. Moreover, when a bill,</tspan></text>
<text x="56" y="1172"><tspan class="k">which has originated in the council and was sent to the assembly, is</tspan><tspan class="r"> rejected by the</tspan></text>
<text x="56" y="1194"><tspan class="r">assembly, the bill ends and becomes dead</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1222"><tspan class="h" style="font-weight:700">Council weaker than Rajya Sabha:</tspan><tspan class="k"> Thus, the council has been given</tspan><tspan class="r"> much lesser</tspan></text>
<text x="56" y="1244"><tspan class="r">significance, position and authority</tspan><tspan class="k"> than that of the</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> at the Centre.</tspan></text>
<text class="sh" x="40" y="1272"><tspan class="r" style="font-weight:700">Assent of the Governor</tspan></text>
<text x="44" y="1302"><tspan class="h" style="font-weight:700">Governor’s four options:</tspan><tspan class="k"> Every bill, after it is passed by the assembly or by both the</tspan></text>
<text x="56" y="1324"><tspan class="k">Houses in case of a bicameral legislature, is presented to the</tspan><tspan class="r"> governor for his/her assent</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1346"><tspan class="k">There are</tspan><tspan class="r"> four alternatives</tspan><tspan class="k"> before the governor:</tspan></text>
<text x="56" y="1372" class="r" style="font-weight:700">1.</text>
<text x="78" y="1372"><tspan class="k">he/she may</tspan><tspan class="r"> give his/her assent</tspan><tspan class="k"> to the bill;</tspan></text>
<text x="56" y="1398" class="r" style="font-weight:700">2.</text>
<text x="78" y="1398"><tspan class="k">he/she may</tspan><tspan class="r"> withhold his/her assent</tspan><tspan class="k"> to the bill;</tspan></text>
<text x="56" y="1424" class="r" style="font-weight:700">3.</text>
<text x="78" y="1424"><tspan class="k">he/she may</tspan><tspan class="r"> return the bill for reconsideration</tspan><tspan class="k"> of the House or Houses; and</tspan></text>
<text x="56" y="1450" class="r" style="font-weight:700">4.</text>
<text x="78" y="1450"><tspan class="k">he/she may</tspan><tspan class="r"> reserve the bill for the consideration of the President</tspan><tspan class="k">.</tspan></text>
<path d="M50 1352 L44 1352 L44 1456 L50 1456" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="1456" x2="340" y2="1468"/>
<line class="ln" x1="115" y1="1468" x2="565" y2="1468"/>
<line class="ln" x1="115" y1="1468" x2="115" y2="1484" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1468" x2="265" y2="1484" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1468" x2="415" y2="1484" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1468" x2="565" y2="1484" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1504" text-anchor="middle"><tspan class="r">assent</tspan></text>
<text class="sm" x="265" y="1504" text-anchor="middle"><tspan class="r">withhold</tspan></text>
<text class="sm" x="415" y="1504" text-anchor="middle"><tspan class="r">return</tspan></text>
<text class="sm" x="565" y="1504" text-anchor="middle"><tspan class="r">reserve for President</tspan></text>
<text x="44" y="1536"><tspan class="h" style="font-weight:700">Suspensive veto:</tspan><tspan class="k"> If the governor gives his/her assent to the bill, the bill becomes an</tspan><tspan class="r"> Act</tspan></text>
<text x="56" y="1558"><tspan class="k">and is placed on the Statute Book. If the governor withholds his/her assent to the bill,</tspan></text>
<text x="56" y="1580"><tspan class="k">the bill ends and does not become an Act. If the governor returns the bill for</tspan></text>
<text x="56" y="1602"><tspan class="k">reconsideration and if the bill is passed by the House or both the Houses again, with or</tspan></text>
<text x="56" y="1624"><tspan class="k">without amendments, and presented to the governor for his/her assent, the governor</tspan></text>
<text x="56" y="1646"><tspan class="r">must give his/her assent</tspan><tspan class="k"> to the bill. Thus, the governor enjoys only a</tspan><tspan class="r"> suspensive veto</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1668"><tspan class="k">The position is</tspan><tspan class="b"> same at the Central level</tspan><tspan class="k"> also.</tspan></text>
<text class="sh" x="40" y="1696"><tspan class="r" style="font-weight:700">Assent of the President</tspan></text>
<text x="44" y="1726"><tspan class="h" style="font-weight:700">President on reserved bills – six months:</tspan><tspan class="k"> When a bill is</tspan><tspan class="r"> reserved by the governor</tspan><tspan class="k"> for</tspan></text>
<text x="56" y="1748"><tspan class="k">the consideration of the President, the President may either</tspan><tspan class="r"> give his/her assent</tspan><tspan class="k"> to the</tspan></text>
<text x="56" y="1770"><tspan class="k">bill or</tspan><tspan class="r"> withhold his/her assent</tspan><tspan class="k"> to the bill or</tspan><tspan class="r"> return the bill for reconsideration</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="1792"><tspan class="k">House or Houses of the state legislature. When a bill is so returned, the House or Houses</tspan></text>
<text x="56" y="1814"><tspan class="k">have to reconsider it within a period of</tspan><tspan class="r"> six months</tspan><tspan class="k">. The bill is presented again to the</tspan></text>
<text x="56" y="1836"><tspan class="k">presidential assent after it is passed by the House or Houses with or without</tspan></text>
<text x="56" y="1858"><tspan class="k">amendments. It is</tspan><tspan class="r"> not mentioned in the Constitution</tspan><tspan class="k"> whether it is obligatory on the part</tspan></text>
<text x="56" y="1880"><tspan class="k">of the president to give his/her assent to such a bill or not.</tspan></text>
</svg>
</div></body></html>
