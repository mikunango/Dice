<div id="vis-container"><h2 class="sr-only">Presiding Officers – Speaker and Deputy Speaker</h2>
<svg class="n" width="100%" viewBox="0 0 680 1690" role="img"><title>Presiding Officers – Speaker and Deputy Speaker</title><desc>Presiding Officers – Speaker and Deputy Speaker</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="124" y="26" width="432" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Presiding Officers – Speaker and Deputy Speaker</text>
<text class="r hd" x="40" y="100">PRESIDING OFFICERS OF STATE LEGISLATURE</text>
<line x1="40" y1="106" x2="391" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Four presiding officers:</tspan><tspan class="k"> Each House of state legislature has its own presiding officer.</tspan></text>
<text x="56" y="156"><tspan class="k">There is a</tspan><tspan class="r"> Speaker and a Deputy Speaker</tspan><tspan class="k"> for the legislative assembly and a</tspan><tspan class="r"> Chairman</tspan></text>
<text x="56" y="178"><tspan class="r">and a Deputy Chairman</tspan><tspan class="k"> for the legislative council. A</tspan><tspan class="b"> panel of chairman for the assembly</tspan></text>
<text x="56" y="200"><tspan class="k">and a</tspan><tspan class="b"> panel of vice-chairman for the council</tspan><tspan class="k"> is also appointed.</tspan></text>
<rect class="bx" x="46" y="214" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="232" text-anchor="middle"><tspan class="r" style="font-weight:700">Assembly</tspan></text>
<line class="ln" x1="190" y1="242" x2="190" y2="256" marker-end="url(#ah)"/>
<text class="sm" x="190" y="277" text-anchor="middle"><tspan class="k">Speaker</tspan></text>
<text class="sm" x="190" y="299" text-anchor="middle"><tspan class="k">Deputy Speaker</tspan></text>
<text class="sm" x="190" y="321" text-anchor="middle"><tspan class="b">panel of chairman</tspan></text>
<rect class="bx" x="346" y="214" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="232" text-anchor="middle"><tspan class="r" style="font-weight:700">Council</tspan></text>
<line class="ln" x1="490" y1="242" x2="490" y2="256" marker-end="url(#ah)"/>
<text class="sm" x="490" y="277" text-anchor="middle"><tspan class="k">Chairman</tspan></text>
<text class="sm" x="490" y="299" text-anchor="middle"><tspan class="k">Deputy Chairman</tspan></text>
<text class="sm" x="490" y="321" text-anchor="middle"><tspan class="b">panel of vice-chairman</tspan></text>
<line x1="340" y1="214" x2="340" y2="324" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="358"><tspan class="h" style="font-weight:700">Salaries charged on CFS:</tspan><tspan class="k"> The salaries and allowances of the Speaker and the Deputy</tspan></text>
<text x="56" y="380"><tspan class="k">Speaker of the assembly and the Chairman and the Deputy Chairman of the council are</tspan></text>
<text x="56" y="402"><tspan class="r">fixed by the state legislature</tspan><tspan class="k">. They are</tspan><tspan class="r"> charged on the Consolidated Fund of the State</tspan></text>
<text x="56" y="424"><tspan class="k">and thus are</tspan><tspan class="b"> not subject to the annual vote</tspan><tspan class="k"> of the state legislature.</tspan></text>
<text class="sh" x="40" y="452"><tspan class="r" style="font-weight:700">Speaker of Assembly</tspan></text>
<text x="44" y="482"><tspan class="h" style="font-weight:700">Election of Speaker:</tspan><tspan class="k"> The Speaker is</tspan><tspan class="r"> elected by the assembly itself</tspan><tspan class="k"> from amongst its</tspan></text>
<text x="56" y="504"><tspan class="k">members.</tspan></text>
<text x="44" y="532"><tspan class="h" style="font-weight:700">Vacation of Speaker’s office:</tspan><tspan class="k"> Usually, the Speaker remains in office during the</tspan><tspan class="r"> life of</tspan></text>
<text x="56" y="554"><tspan class="r">the assembly</tspan><tspan class="k">. However, he/she vacates his/her office earlier in any of the following three</tspan></text>
<text x="56" y="576"><tspan class="k">cases:</tspan></text>
<text x="56" y="602" class="r" style="font-weight:700">1.</text>
<text x="78" y="602"><tspan class="k">if he/she</tspan><tspan class="r"> ceases to be a member</tspan><tspan class="k"> of the assembly;</tspan></text>
<text x="56" y="628" class="r" style="font-weight:700">2.</text>
<text x="78" y="628"><tspan class="k">if he/she</tspan><tspan class="r"> resigns by writing to the deputy speaker</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="654" class="r" style="font-weight:700">3.</text>
<text x="78" y="654"><tspan class="k">if he/she is</tspan><tspan class="r"> removed by a resolution</tspan><tspan class="k"> passed by a</tspan><tspan class="r"> majority of all the then members</tspan></text>
<text x="78" y="676"><tspan class="k">of the assembly (</tspan><tspan class="b">i.e., an effective majority</tspan><tspan class="k">). Such a resolution can be moved only</tspan></text>
<text x="78" y="698"><tspan class="k">after giving</tspan><tspan class="r"> 14 days advance notice</tspan><tspan class="k">.</tspan></text>
<path d="M50 582 L44 582 L44 704 L50 704" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="726"><tspan class="h" style="font-weight:700">Powers of Speaker:</tspan><tspan class="k"> The Speaker has the following powers and duties:</tspan></text>
<text x="56" y="752" class="r" style="font-weight:700">1.</text>
<text x="78" y="752"><tspan class="h" style="font-weight:700">Order and decorum:</tspan><tspan class="k"> He/she maintains</tspan><tspan class="r"> order and decorum</tspan><tspan class="k"> in the assembly for</tspan></text>
<text x="78" y="774"><tspan class="k">conducting its business and regulating its proceedings. This is his/her</tspan><tspan class="b"> primary</tspan></text>
<text x="78" y="796"><tspan class="b">responsibility</tspan><tspan class="k"> and he/she has</tspan><tspan class="r"> final power</tspan><tspan class="k"> in this regard.</tspan></text>
<text x="56" y="822" class="r" style="font-weight:700">2.</text>
<text x="78" y="822"><tspan class="h" style="font-weight:700">Final interpreter:</tspan><tspan class="k"> He/she is the</tspan><tspan class="r"> final interpreter</tspan><tspan class="k"> of the provisions of (a) the</tspan></text>
<text x="78" y="844"><tspan class="k">Constitution of India, (b) the rules of procedure and conduct of business of</tspan></text>
<text x="78" y="866"><tspan class="k">assembly, and (c) the legislative precedents, within the assembly.</tspan></text>
<text x="56" y="892" class="r" style="font-weight:700">3.</text>
<text x="78" y="892"><tspan class="h" style="font-weight:700">Quorum:</tspan><tspan class="k"> He/she</tspan><tspan class="r"> adjourns the assembly or suspends the meeting</tspan><tspan class="k"> in the absence of</tspan></text>
<text x="78" y="914"><tspan class="k">a quorum.</tspan></text>
<text x="56" y="940" class="r" style="font-weight:700">4.</text>
<text x="78" y="940"><tspan class="h" style="font-weight:700">Casting vote:</tspan><tspan class="k"> He/she</tspan><tspan class="r"> does not vote in the first instance</tspan><tspan class="k">. But, he/she can exercise a</tspan></text>
<text x="78" y="962"><tspan class="r">casting vote</tspan><tspan class="k"> in the case of a tie.</tspan></text>
<text x="56" y="988" class="r" style="font-weight:700">5.</text>
<text x="78" y="988"><tspan class="h" style="font-weight:700">Secret sitting:</tspan><tspan class="k"> He/she can allow a ‘</tspan><tspan class="r">secret</tspan><tspan class="k">’ sitting of the House at the request of</tspan></text>
<text x="78" y="1010"><tspan class="k">the</tspan><tspan class="b"> leader of the House</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1036" class="r" style="font-weight:700">6.</text>
<text x="78" y="1036"><tspan class="h" style="font-weight:700">Money Bill certification:</tspan><tspan class="k"> He/she</tspan><tspan class="r"> decides whether a bill is a Money Bill</tspan><tspan class="k"> or not and</tspan></text>
<text x="78" y="1058"><tspan class="k">his/her decision on this question is</tspan><tspan class="r"> final</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1084" class="r" style="font-weight:700">7.</text>
<text x="78" y="1084"><tspan class="h" style="font-weight:700">Anti-defection authority:</tspan><tspan class="k"> He/she decides the questions of</tspan><tspan class="r"> disqualification</tspan><tspan class="k"> of a</tspan></text>
<text x="78" y="1106"><tspan class="k">member of the assembly, arising on the ground of</tspan><tspan class="r"> defection</tspan><tspan class="k"> under the provisions of</tspan></text>
<text x="78" y="1128"><tspan class="k">the Tenth Schedule.</tspan></text>
<text x="56" y="1154" class="r" style="font-weight:700">8.</text>
<text x="78" y="1154"><tspan class="h" style="font-weight:700">Committees:</tspan><tspan class="k"> He/she</tspan><tspan class="r"> appoints the chairman of all the committees</tspan><tspan class="k"> of the assembly</tspan></text>
<text x="78" y="1176"><tspan class="k">and supervises their functioning. He/she is the chairman of the</tspan><tspan class="b"> Business Advisory</tspan></text>
<text x="78" y="1198"><tspan class="b">Committee, the Rules Committee and the General Purpose Committee</tspan><tspan class="k">.</tspan></text>
<path d="M50 732 L44 732 L44 1204 L50 1204" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1226"><tspan class="r" style="font-weight:700">Deputy Speaker of Assembly</tspan></text>
<text x="44" y="1256"><tspan class="h" style="font-weight:700">Election of Deputy Speaker:</tspan><tspan class="k"> Like the Speaker, the Deputy Speaker is also</tspan><tspan class="r"> elected by the</tspan></text>
<text x="56" y="1278"><tspan class="r">assembly itself</tspan><tspan class="k"> from amongst its members. He/she is elected</tspan><tspan class="b"> after the election of the</tspan></text>
<text x="56" y="1300"><tspan class="b">Speaker</tspan><tspan class="k"> has taken place.</tspan></text>
<text x="44" y="1328"><tspan class="h" style="font-weight:700">Vacation of Deputy Speaker’s office:</tspan><tspan class="k"> Like the Speaker, the Deputy Speaker remains in</tspan></text>
<text x="56" y="1350"><tspan class="k">office usually during the life of the assembly. However, he/she also vacates his/her office</tspan></text>
<text x="56" y="1372"><tspan class="k">earlier in any of the following three cases:</tspan></text>
<text x="56" y="1398" class="r" style="font-weight:700">1.</text>
<text x="78" y="1398"><tspan class="k">if he/she</tspan><tspan class="r"> ceases to be a member</tspan><tspan class="k"> of the assembly;</tspan></text>
<text x="56" y="1424" class="r" style="font-weight:700">2.</text>
<text x="78" y="1424"><tspan class="k">if he/she</tspan><tspan class="r"> resigns by writing to the speaker</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="1450" class="r" style="font-weight:700">3.</text>
<text x="78" y="1450"><tspan class="k">if he/she is</tspan><tspan class="r"> removed by a resolution</tspan><tspan class="k"> passed by a majority of all the then members</tspan></text>
<text x="78" y="1472"><tspan class="k">of the assembly (</tspan><tspan class="b">i.e., an effective majority</tspan><tspan class="k">). Such a resolution can be moved only</tspan></text>
<text x="78" y="1494"><tspan class="k">after giving</tspan><tspan class="r"> 14 days’ advance notice</tspan><tspan class="k">.</tspan></text>
<path d="M50 1378 L44 1378 L44 1500 L50 1500" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1522"><tspan class="h" style="font-weight:700">Acts as Speaker:</tspan><tspan class="k"> The Deputy Speaker performs the duties of the Speaker’s office when</tspan></text>
<text x="56" y="1544"><tspan class="k">it is</tspan><tspan class="r"> vacant</tspan><tspan class="k">. He/she also acts as the Speaker when the latter is</tspan><tspan class="r"> absent</tspan><tspan class="k"> from the sitting</tspan></text>
<text x="56" y="1566"><tspan class="k">of assembly. In both the cases, he/she has</tspan><tspan class="r"> all the powers of the Speaker</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1594"><tspan class="h" style="font-weight:700">Panel of chairman:</tspan><tspan class="k"> The</tspan><tspan class="r"> Speaker nominates</tspan><tspan class="k"> from amongst the members a</tspan><tspan class="r"> panel of</tspan></text>
<text x="56" y="1616"><tspan class="r">chairman</tspan><tspan class="k">. Any one of them can preside over the assembly in the absence of the Speaker</tspan></text>
<text x="56" y="1638"><tspan class="k">or the Deputy Speaker. He/she has the</tspan><tspan class="b"> same power as the speaker</tspan><tspan class="k"> when so presiding.</tspan></text>
<text x="56" y="1660"><tspan class="k">He/she holds office until a new panel of chairman is nominated.</tspan></text>
</svg>
