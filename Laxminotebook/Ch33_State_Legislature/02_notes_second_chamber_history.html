<div id="vis-container"><h2 class="sr-only">Second Chamber in States – Rationale and History</h2>
<svg class="n" width="100%" viewBox="0 0 680 697" role="img"><title>Second Chamber in States – Rationale and History</title><desc>Second Chamber in States – Rationale and History</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="115" y="26" width="450" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Second Chamber in States – Rationale and History</text>
<text x="56" y="94"><tspan class="h" style="font-weight:700">Constituent Assembly criticism:</tspan><tspan class="k"> “The idea of having a</tspan><tspan class="r"> second chamber in the</tspan></text>
<text x="68" y="116"><tspan class="r">states</tspan><tspan class="k"> was criticised in the Constituent Assembly on the ground that it was</tspan><tspan class="r"> not</tspan></text>
<text x="68" y="138"><tspan class="r">representative of the people</tspan><tspan class="k">, that it</tspan><tspan class="r"> delayed legislative process</tspan><tspan class="k"> and that it was an</tspan></text>
<text x="68" y="160"><tspan class="r">expensive institution</tspan><tspan class="k">².”</tspan></text>
<line x1="44" y1="74" x2="44" y2="168" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<text x="44" y="196"><tspan class="h" style="font-weight:700">Optional council – state’s choice:</tspan><tspan class="k"> Consequently the provision was made for the</tspan></text>
<text x="56" y="218"><tspan class="k">abolition or creation of a legislative council to enable a state to have a second chamber</tspan></text>
<text x="56" y="240"><tspan class="k">or not according to its own</tspan><tspan class="r"> willingness and financial strength</tspan><tspan class="k">. For example,</tspan><tspan class="r"> Andhra</tspan></text>
<text x="56" y="262"><tspan class="r">Pradesh</tspan><tspan class="k"> got the legislative council</tspan><tspan class="b"> created in 1957</tspan><tspan class="k"> and got the same</tspan><tspan class="b"> abolished in 1985</tspan><tspan class="k">.</tspan></text>
<text x="56" y="284"><tspan class="k">The Legislative Council in Andhra Pradesh was again</tspan><tspan class="b"> revived in 2007</tspan><tspan class="k">, after the</tspan></text>
<text x="56" y="306"><tspan class="k">enactment of the Andhra Pradesh Legislative Council Act, 2005. The legislative council of</tspan></text>
<text x="56" y="328"><tspan class="r">Tamil Nadu</tspan><tspan class="k"> had been</tspan><tspan class="b"> abolished in 1986</tspan><tspan class="k"> and that of</tspan><tspan class="r"> Punjab and West Bengal in 1969</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="143" y="340" width="126" height="30" rx="3"/>
<text class="sm" x="206" y="359" text-anchor="middle"><tspan class="k">AP: created</tspan><tspan class="r"> 1957</tspan></text>
<line class="ln" x1="272" y1="355" x2="292" y2="355" marker-end="url(#ah)"/>
<rect class="bx" x="295" y="340" width="115" height="30" rx="3"/>
<text class="sm" x="352" y="359" text-anchor="middle"><tspan class="k">abolished</tspan><tspan class="r"> 1985</tspan></text>
<line class="ln" x1="413" y1="355" x2="433" y2="355" marker-end="url(#ah)"/>
<rect class="bx" x="436" y="340" width="102" height="30" rx="3"/>
<text class="sm" x="486" y="359" text-anchor="middle"><tspan class="k">revived</tspan><tspan class="r"> 2007</tspan></text>
<text x="44" y="398"><tspan class="h" style="font-weight:700">Tamil Nadu case:</tspan><tspan class="k"> In</tspan><tspan class="r"> 2010</tspan><tspan class="k">, the Legislative Assembly of</tspan><tspan class="r"> Tamil Nadu</tspan><tspan class="k"> passed a resolution</tspan></text>
<text x="56" y="420"><tspan class="k">for the</tspan><tspan class="r"> revival</tspan><tspan class="k"> of the Legislative Council in the state. Accordingly, the Parliament</tspan></text>
<text x="56" y="442"><tspan class="k">enacted the</tspan><tspan class="b"> Tamil Nadu Legislative Council Act, 2010</tspan><tspan class="k"> which provided for the creation of</tspan></text>
<text x="56" y="464"><tspan class="k">Legislative Council in the state. However, before this Act was enforced, the Legislative</tspan></text>
<text x="56" y="486"><tspan class="k">Assembly of Tamil Nadu passed another resolution in</tspan><tspan class="r"> 2011</tspan><tspan class="k"> seeking the</tspan><tspan class="r"> abolition</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="508"><tspan class="k">proposed Legislative Council.</tspan></text>
<rect class="bx" x="59" y="520" width="137" height="30" rx="3"/>
<text class="sm" x="127" y="539" text-anchor="middle"><tspan class="k">TN abolished</tspan><tspan class="r"> 1986</tspan></text>
<line class="ln" x1="199" y1="535" x2="219" y2="535" marker-end="url(#ah)"/>
<rect class="bx" x="222" y="520" width="201" height="30" rx="3"/>
<text class="sm" x="323" y="539" text-anchor="middle"><tspan class="k">2010: revival resolution + Act</tspan></text>
<line class="ln" x1="426" y1="535" x2="446" y2="535" marker-end="url(#ah)"/>
<rect class="bx" x="449" y="520" width="172" height="30" rx="3"/>
<text class="sm" x="535" y="539" text-anchor="middle"><tspan class="k">2011:</tspan><tspan class="r"> abolition resolution</tspan></text>
<text x="44" y="578"><tspan class="h" style="font-weight:700">Laws under Art. 169:</tspan><tspan class="k"> The various laws made by the Parliament (under</tspan><tspan class="r"> Article 169</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="600"><tspan class="k">constitution) for the abolition or creation of State Legislative Councils are mentioned in</tspan></text>
<text x="56" y="622"><tspan class="r">Table 33.4</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="658"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> M.P. Jain, Indian Constitutional Law, Wadhwa Fourth edition, p. 159.</tspan></text>
<rect x="40" y="636" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
