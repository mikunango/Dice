<div id="vis-container"><h2 class="sr-only">Chairman, Deputy Chairman and Sessions</h2>
<svg class="n" width="100%" viewBox="0 0 680 2199" role="img"><title>Chairman, Deputy Chairman and Sessions</title><desc>Chairman, Deputy Chairman and Sessions</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Chairman, Deputy Chairman and Sessions</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Chairman of Council</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Election of Chairman:</tspan><tspan class="k"> The Chairman is</tspan><tspan class="r"> elected by the council itself</tspan><tspan class="k"> from amongst its</tspan></text>
<text x="56" y="146"><tspan class="k">members.</tspan></text>
<text x="44" y="174"><tspan class="h" style="font-weight:700">Vacation of Chairman’s office:</tspan><tspan class="k"> The Chairman vacates his/her office in any of the</tspan></text>
<text x="56" y="196"><tspan class="k">following three cases:</tspan></text>
<text x="56" y="222" class="r" style="font-weight:700">1.</text>
<text x="78" y="222"><tspan class="k">if he/she</tspan><tspan class="r"> ceases to be a member</tspan><tspan class="k"> of the council;</tspan></text>
<text x="56" y="248" class="r" style="font-weight:700">2.</text>
<text x="78" y="248"><tspan class="k">if he/she</tspan><tspan class="r"> resigns by writing to the deputy chairman</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="274" class="r" style="font-weight:700">3.</text>
<text x="78" y="274"><tspan class="k">if he/she is</tspan><tspan class="r"> removed by a resolution</tspan><tspan class="k"> passed by a majority of all the then members</tspan></text>
<text x="78" y="296"><tspan class="k">of the council (</tspan><tspan class="b">i.e., an effective majority</tspan><tspan class="k">). Such a resolution can be moved only</tspan></text>
<text x="78" y="318"><tspan class="k">after giving</tspan><tspan class="r"> 14 days advance notice</tspan><tspan class="k">.</tspan></text>
<path d="M50 202 L44 202 L44 324 L50 324" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="346"><tspan class="h" style="font-weight:700">Speaker’s special power:</tspan><tspan class="k"> As a presiding officer, the power and functions of the</tspan></text>
<text x="56" y="368"><tspan class="k">Chairman in the council are</tspan><tspan class="r"> similar to those of the Speaker</tspan><tspan class="k"> in the assembly. However,</tspan></text>
<text x="56" y="390"><tspan class="k">the Speaker has</tspan><tspan class="r"> one special power</tspan><tspan class="k"> which is not enjoyed by the Chairman. The Speaker</tspan></text>
<text x="56" y="412"><tspan class="k">decides whether a bill is a</tspan><tspan class="r"> Money Bill</tspan><tspan class="k"> or not and his/her decision on this question is</tspan></text>
<text x="56" y="434"><tspan class="k">final.</tspan></text>
<text class="sh" x="40" y="462"><tspan class="r" style="font-weight:700">Deputy Chairman of Council</tspan></text>
<text x="44" y="492"><tspan class="h" style="font-weight:700">Election of Deputy Chairman:</tspan><tspan class="k"> Like the Chairman, the Deputy Chairman is also</tspan><tspan class="r"> elected</tspan></text>
<text x="56" y="514"><tspan class="r">by the council itself</tspan><tspan class="k"> from amongst its members.</tspan></text>
<text x="44" y="542"><tspan class="h" style="font-weight:700">Vacation of Deputy Chairman’s office:</tspan><tspan class="k"> The deputy chairman vacates his/her office in</tspan></text>
<text x="56" y="564"><tspan class="k">any of the following three cases:</tspan></text>
<text x="56" y="590" class="r" style="font-weight:700">1.</text>
<text x="78" y="590"><tspan class="k">if he/she</tspan><tspan class="r"> ceases to be a member</tspan><tspan class="k"> of the council;</tspan></text>
<text x="56" y="616" class="r" style="font-weight:700">2.</text>
<text x="78" y="616"><tspan class="k">if he/she</tspan><tspan class="r"> resigns by writing to the Chairman</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="642" class="r" style="font-weight:700">3.</text>
<text x="78" y="642"><tspan class="k">if he/she is</tspan><tspan class="r"> removed by a resolution</tspan><tspan class="k"> passed by a majority of all the then members</tspan></text>
<text x="78" y="664"><tspan class="k">of the council (</tspan><tspan class="b">i.e., an effective majority</tspan><tspan class="k">). Such a resolution can be moved only</tspan></text>
<text x="78" y="686"><tspan class="k">after giving</tspan><tspan class="r"> 14 days advance notice</tspan><tspan class="k">.</tspan></text>
<path d="M50 570 L44 570 L44 692 L50 692" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="714"><tspan class="h" style="font-weight:700">Acts as Chairman:</tspan><tspan class="k"> The Deputy Chairman performs the duties of the Chairman’s office</tspan></text>
<text x="56" y="736"><tspan class="k">when it is</tspan><tspan class="r"> vacant</tspan><tspan class="k">. He/she also acts as the Chairman when the latter is</tspan><tspan class="r"> absent</tspan><tspan class="k"> from the</tspan></text>
<text x="56" y="758"><tspan class="k">sitting of the council. In both the cases, he/she has</tspan><tspan class="r"> all the powers of the Chairman</tspan><tspan class="k">.</tspan></text>
<text x="44" y="786"><tspan class="h" style="font-weight:700">Panel of vice-chairman:</tspan><tspan class="k"> The</tspan><tspan class="r"> Chairman nominates</tspan><tspan class="k"> from amongst the members a</tspan><tspan class="r"> panel</tspan></text>
<text x="56" y="808"><tspan class="r">of vice-chairman</tspan><tspan class="k">. Any one of them can preside over the council in the absence of the</tspan></text>
<text x="56" y="830"><tspan class="k">Chairman or the Deputy Chairman. He/she has the</tspan><tspan class="b"> same powers as the chairman</tspan><tspan class="k"> when</tspan></text>
<text x="56" y="852"><tspan class="k">so presiding. He/she holds office until a new panel of vice-chairman is nominated.</tspan></text>
<text class="sm" x="125" y="882" text-anchor="middle"><tspan class="r" style="font-weight:700">Officer</tspan></text>
<text class="sm" x="295" y="882" text-anchor="middle"><tspan class="r" style="font-weight:700">Resigns to</tspan></text>
<text class="sm" x="510" y="882" text-anchor="middle"><tspan class="r" style="font-weight:700">Removal</tspan></text>

<text class="r hd" x="40" y="1051">SESSIONS OF STATE LEGISLATURE</text>
<line x1="40" y1="1057" x2="303" y2="1057" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="1085"><tspan class="r" style="font-weight:700">Summoning</tspan></text>
<text x="44" y="1115"><tspan class="h" style="font-weight:700">Summoning – six-month gap:</tspan><tspan class="k"> The</tspan><tspan class="r"> governor</tspan><tspan class="k"> from time to time</tspan><tspan class="r"> summons</tspan><tspan class="k"> each House of</tspan></text>
<text x="56" y="1137"><tspan class="k">state legislature to meet. The</tspan><tspan class="r"> maximum gap between the two sessions</tspan><tspan class="k"> of state</tspan></text>
<text x="56" y="1159"><tspan class="k">legislature cannot be more than</tspan><tspan class="r"> six months</tspan><tspan class="k">, ie, the state legislature should meet</tspan><tspan class="r"> at least</tspan></text>
<text x="56" y="1181"><tspan class="r">twice a year</tspan><tspan class="k">. A session of the state legislature consists of many sittings.</tspan></text>
<text class="sh" x="40" y="1209"><tspan class="r" style="font-weight:700">Adjournment</tspan></text>
<text x="44" y="1239"><tspan class="h" style="font-weight:700">Adjournment:</tspan><tspan class="k"> An</tspan><tspan class="r"> adjournment</tspan><tspan class="k"> suspends the work in a sitting for a</tspan><tspan class="r"> specified time</tspan><tspan class="k"> which</tspan></text>
<text x="56" y="1261"><tspan class="k">may be hours, days or weeks.</tspan></text>
<text x="44" y="1289"><tspan class="h" style="font-weight:700">Adjournment sine die:</tspan><tspan class="r"> Adjournment sine die</tspan><tspan class="k"> means terminating a sitting of the state</tspan></text>
<text x="56" y="1311"><tspan class="k">legislature for an</tspan><tspan class="r"> indefinite period</tspan><tspan class="k">. The power of the adjournment as well as adjournment</tspan></text>
<text x="56" y="1333"><tspan class="k">sine die lies with the</tspan><tspan class="r"> presiding officer</tspan><tspan class="k"> of the House.</tspan></text>
<text class="sh" x="40" y="1361"><tspan class="r" style="font-weight:700">Prorogation</tspan></text>
<text x="44" y="1391"><tspan class="h" style="font-weight:700">Prorogation by Governor:</tspan><tspan class="k"> The presiding officer (Speaker or Chairman) declares the House</tspan></text>
<text x="56" y="1413"><tspan class="k">adjourned sine die, when the business of the session is completed. Within the next few</tspan></text>
<text x="56" y="1435"><tspan class="k">days, the</tspan><tspan class="r"> governor</tspan><tspan class="k"> issues a notification for</tspan><tspan class="r"> prorogation</tspan><tspan class="k"> of the session.</tspan></text>
<text x="44" y="1463"><tspan class="h" style="font-weight:700">Prorogation ends session:</tspan><tspan class="k"> However, the governor can also prorogue the House which is in</tspan></text>
<text x="56" y="1485"><tspan class="k">session. Unlike an adjournment, a</tspan><tspan class="r"> prorogation terminates a session</tspan><tspan class="k"> of the House.</tspan></text>
<rect class="bx" x="88" y="1497" width="165" height="30" rx="3"/>
<text class="sm" x="171" y="1516" text-anchor="middle"><tspan class="r">Summoning</tspan><tspan class="k"> (Governor)</tspan></text>
<line class="ln" x1="256" y1="1512" x2="276" y2="1512" marker-end="url(#ah)"/>
<rect class="bx" x="279" y="1497" width="72" height="30" rx="3"/>
<text class="sm" x="315" y="1516" text-anchor="middle"><tspan class="k">sittings</tspan></text>
<line class="ln" x1="354" y1="1512" x2="374" y2="1512" marker-end="url(#ah)"/>
<rect class="bx" x="377" y="1497" width="215" height="30" rx="3"/>
<text class="sm" x="484" y="1516" text-anchor="middle"><tspan class="r">Adjournment</tspan><tspan class="k"> (presiding officer)</tspan></text>
<line class="ln" x1="340" y1="1528" x2="340" y2="1549" marker-end="url(#ah)"/>
<rect class="bx" x="149" y="1551" width="163" height="30" rx="3"/>
<text class="sm" x="230" y="1570" text-anchor="middle"><tspan class="r">Prorogation</tspan><tspan class="k"> (Governor)</tspan></text>
<line class="ln" x1="315" y1="1566" x2="335" y2="1566" marker-end="url(#ah)"/>
<rect class="bx" x="338" y="1551" width="194" height="30" rx="3"/>
<text class="sm" x="435" y="1570" text-anchor="middle"><tspan class="r">Dissolution</tspan><tspan class="k"> (assembly only)</tspan></text>
<text class="sh" x="40" y="1609"><tspan class="r" style="font-weight:700">Dissolution</tspan></text>
<text x="44" y="1639"><tspan class="h" style="font-weight:700">Dissolution ends the House:</tspan><tspan class="k"> The</tspan><tspan class="r"> legislative council</tspan><tspan class="k">, being a permanent house, is</tspan><tspan class="r"> not</tspan></text>
<text x="56" y="1661"><tspan class="r">subject to dissolution</tspan><tspan class="k">. Only the</tspan><tspan class="r"> legislative assembly</tspan><tspan class="k"> is subject to dissolution. Unlike a</tspan></text>
<text x="56" y="1683"><tspan class="k">prorogation, a dissolution</tspan><tspan class="r"> ends the very life of the existing House</tspan><tspan class="k">, and a new House is</tspan></text>
<text x="56" y="1705"><tspan class="k">constituted after the general elections are held.</tspan></text>
<text x="44" y="1733"><tspan class="h" style="font-weight:700">Lapsing of bills:</tspan><tspan class="k"> The position with respect to</tspan><tspan class="r"> lapsing of bills</tspan><tspan class="k"> on the dissolution of the</tspan></text>
<text x="56" y="1755"><tspan class="k">assembly is mentioned below:</tspan></text>
<text x="56" y="1781" class="r" style="font-weight:700">1.</text>
<text x="78" y="1781"><tspan class="h" style="font-weight:700">Pending in assembly – lapses:</tspan><tspan class="k"> A Bill</tspan><tspan class="r"> pending in the assembly lapses</tspan><tspan class="k"> (whether</tspan></text>
<text x="78" y="1803"><tspan class="k">originating in the assembly or transmitted to it by the council).</tspan></text>
<text x="56" y="1829" class="r" style="font-weight:700">2.</text>
<text x="78" y="1829"><tspan class="h" style="font-weight:700">Passed by assembly, pending in council – lapses:</tspan><tspan class="k"> A Bill</tspan><tspan class="r"> passed by the assembly</tspan></text>
<text x="78" y="1851"><tspan class="r">but pending in the council lapses</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1877" class="r" style="font-weight:700">3.</text>
<text x="78" y="1877"><tspan class="h" style="font-weight:700">Pending in council only – survives:</tspan><tspan class="k"> A Bill</tspan><tspan class="r"> pending in the council but not passed by</tspan></text>
<text x="78" y="1899"><tspan class="r">the assembly does not lapse</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1925" class="r" style="font-weight:700">4.</text>
<text x="78" y="1925"><tspan class="h" style="font-weight:700">Pending assent – survives:</tspan><tspan class="k"> A Bill passed by the assembly (in a unicameral state)</tspan></text>
<text x="78" y="1947"><tspan class="k">or passed by both the houses (in a bicameral state) but</tspan><tspan class="r"> pending assent of the</tspan></text>
<text x="78" y="1969"><tspan class="r">governor or the President does not lapse</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1995" class="r" style="font-weight:700">5.</text>
<text x="78" y="1995"><tspan class="h" style="font-weight:700">Returned by President – survives:</tspan><tspan class="k"> A Bill passed by the assembly (in a unicameral</tspan></text>
<text x="78" y="2017"><tspan class="k">state) or passed by both the Houses (in a bicameral state) but</tspan><tspan class="r"> returned by the</tspan></text>
<text x="78" y="2039"><tspan class="r">president for reconsideration</tspan><tspan class="k"> of House (s)</tspan><tspan class="r"> does not lapse</tspan><tspan class="k">.</tspan></text>
