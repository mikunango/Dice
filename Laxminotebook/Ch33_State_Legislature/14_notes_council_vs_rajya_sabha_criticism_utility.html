<div id="vis-container"><h2 class="sr-only">Council vs Rajya Sabha – Reasons, Criticism and Utility</h2>
<svg class="n" width="100%" viewBox="0 0 680 1046" role="img"><title>Council vs Rajya Sabha – Reasons, Criticism and Utility</title><desc>Council vs Rajya Sabha – Reasons, Criticism and Utility</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="97" y="26" width="485" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Council vs Rajya Sabha – Reasons, Criticism and Utility</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Why council is weaker than Rajya Sabha:</tspan><tspan class="k"> Even though both the council and the Rajya</tspan></text>
<text x="56" y="116"><tspan class="k">Sabha are</tspan><tspan class="r"> second chambers</tspan><tspan class="k">, the Constitution has given the council</tspan><tspan class="r"> much lesser</tspan></text>
<text x="56" y="138"><tspan class="r">importance</tspan><tspan class="k"> than the Rajya Sabha due to the following reasons:</tspan></text>
<text x="56" y="164" class="r" style="font-weight:700">1.</text>
<text x="78" y="164"><tspan class="h" style="font-weight:700">Federal character:</tspan><tspan class="k"> The</tspan><tspan class="r"> Rajya Sabha consists of the representatives of the states</tspan></text>
<text x="78" y="186"><tspan class="k">and thus reflect the</tspan><tspan class="r"> federal element</tspan><tspan class="k"> of the polity. It maintains the</tspan><tspan class="b"> federal</tspan></text>
<text x="78" y="208"><tspan class="b">equilibrium</tspan><tspan class="k"> by protecting the interests of the states against the undue interference</tspan></text>
<text x="78" y="230"><tspan class="k">of the Centre. Therefore, it has to be an effective revising body and not just an</tspan></text>
<text x="78" y="252"><tspan class="k">advisory body or dilatory body like that of the council. On the other hand, the</tspan><tspan class="r"> issue</tspan></text>
<text x="78" y="274"><tspan class="r">of federal significance does not arise</tspan><tspan class="k"> in the case of a council.</tspan></text>
<text x="56" y="300" class="r" style="font-weight:700">2.</text>
<text x="78" y="300"><tspan class="h" style="font-weight:700">Heterogeneous composition:</tspan><tspan class="k"> The council is</tspan><tspan class="r"> heterogeneously constituted</tspan><tspan class="k">. It</tspan></text>
<text x="78" y="322"><tspan class="k">represents different interests and consists of differently elected members and also</tspan></text>
<text x="78" y="344"><tspan class="k">include some nominated members. Its very composition makes its position weak and</tspan></text>
<text x="78" y="366"><tspan class="k">reduces its utility as an effective revising body. On the other hand, the Rajya Sabha</tspan></text>
<text x="78" y="388"><tspan class="k">is</tspan><tspan class="r"> homogeneously constituted</tspan><tspan class="k">. It represents the states and union territories and</tspan></text>
<text x="78" y="410"><tspan class="k">consists of mainly elected members (</tspan><tspan class="b">only 12 out of 250 are nominated</tspan><tspan class="k">).</tspan></text>
<text x="56" y="436" class="r" style="font-weight:700">3.</text>
<text x="78" y="436"><tspan class="h" style="font-weight:700">Democratic principle – British model:</tspan><tspan class="k"> The position accorded to the council is in</tspan></text>
<text x="78" y="458"><tspan class="k">accordance with the</tspan><tspan class="r"> principles of democracy</tspan><tspan class="k">. The council should</tspan><tspan class="r"> yield to the</tspan></text>
<text x="78" y="480"><tspan class="r">assembly</tspan><tspan class="k">, which is a popular house. This pattern of relationship between the two</tspan></text>
<text x="78" y="502"><tspan class="k">Houses of the state legislature is adopted from the</tspan><tspan class="r"> British model</tspan><tspan class="k">. In Britain, the</tspan></text>
<text x="78" y="524"><tspan class="b">House of Lords</tspan><tspan class="k"> (Upper House) cannot oppose and obstruct the</tspan><tspan class="b"> House of Commons</tspan></text>
<text x="78" y="546"><tspan class="k">(Lower House). The House of Lords is only a</tspan><tspan class="r"> dilatory chamber</tspan><tspan class="k">—it can delay an</tspan></text>
<text x="78" y="568"><tspan class="k">ordinary bill for a maximum period of</tspan><tspan class="r"> one year</tspan><tspan class="k"> and a money bill for</tspan><tspan class="r"> one month</tspan><tspan class="k">.</tspan></text>
<path d="M50 144 L44 144 L44 574 L50 574" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="574" x2="340" y2="586"/>
<line class="ln" x1="140" y1="586" x2="540" y2="586"/>
<line class="ln" x1="140" y1="586" x2="140" y2="602" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="586" x2="340" y2="602" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="586" x2="540" y2="602" marker-end="url(#ah)"/>
<text class="sm" x="140" y="622" text-anchor="middle"><tspan class="r">no federal role</tspan></text>
<text class="sm" x="340" y="622" text-anchor="middle"><tspan class="r">heterogeneous</tspan></text>
<text class="sm" x="540" y="622" text-anchor="middle"><tspan class="r">democratic / British model</tspan></text>
<text x="44" y="654"><tspan class="h" style="font-weight:700">Criticism – ‘white elephant’:</tspan><tspan class="k"> Keeping in view its weak, powerless and insignificant</tspan></text>
<text x="56" y="676"><tspan class="k">position and role, the critics have described the council as a ‘</tspan><tspan class="r">secondary chamber</tspan><tspan class="k">’, ‘</tspan><tspan class="r">costly</tspan></text>
<text x="56" y="698"><tspan class="r">ornamental luxury</tspan><tspan class="k">’, ‘</tspan><tspan class="r">white elephant</tspan><tspan class="k">’, etc. The critics have opined that the council has</tspan></text>
<text x="56" y="720"><tspan class="k">served as a</tspan><tspan class="r"> refuge for those who are defeated</tspan><tspan class="k"> in the assembly elections. It enabled the</tspan></text>
<text x="56" y="742"><tspan class="k">unpopular, rejected and ambitious politicians to occupy the post of a chief minister or a</tspan></text>
<text x="56" y="764"><tspan class="k">minister or a member of the state legislature.</tspan></text>
<rect class="bx" x="40" y="776" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="805" text-anchor="middle"><tspan class="k">‘</tspan><tspan class="r">secondary chamber</tspan><tspan class="k">’</tspan></text>
<rect class="bx" x="192" y="776" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="796" text-anchor="middle"><tspan class="k">‘</tspan><tspan class="r">costly ornamental</tspan></text>
<text class="xs" x="264" y="814" text-anchor="middle"><tspan class="r">luxury</tspan><tspan class="k">’</tspan></text>
<rect class="bx" x="345" y="776" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="805" text-anchor="middle"><tspan class="k">‘</tspan><tspan class="r">white elephant</tspan><tspan class="k">’</tspan></text>
<rect class="bx" x="498" y="776" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="805" text-anchor="middle"><tspan class="r">refuge of defeated</tspan></text>
<text x="44" y="854"><tspan class="h" style="font-weight:700">Utility of council:</tspan><tspan class="k"> Even though the council has been given less powers as compared with</tspan></text>
<text x="56" y="876"><tspan class="k">the assembly, its</tspan><tspan class="r"> utility</tspan><tspan class="k"> is supported on the following grounds:</tspan></text>
<text x="56" y="902" class="r" style="font-weight:700">1.</text>
<text x="78" y="902"><tspan class="h" style="font-weight:700">Check on hasty legislation:</tspan><tspan class="k"> It</tspan><tspan class="r"> checks the hasty, defective, careless and</tspan></text>
<text x="78" y="924"><tspan class="r">ill-considered legislation</tspan><tspan class="k"> made by the assembly by making provision for</tspan><tspan class="b"> revision and</tspan></text>
<text x="78" y="946"><tspan class="b">thought</tspan><tspan class="k">.</tspan></text>
<text x="56" y="972" class="r" style="font-weight:700">2.</text>
<text x="78" y="972"><tspan class="h" style="font-weight:700">Representation of experts:</tspan><tspan class="k"> It facilitates</tspan><tspan class="r"> representation of eminent professionals</tspan></text>
<text x="78" y="994"><tspan class="r">and experts</tspan><tspan class="k"> who cannot face direct elections. The governor nominates</tspan><tspan class="r"> one-sixth</tspan></text>
<text x="78" y="1016"><tspan class="r">members</tspan><tspan class="k"> of the council to provide representation to such people.</tspan></text>
