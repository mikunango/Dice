<div id="vis-container"><h2 class="sr-only">Composition of Council and Duration of Houses</h2>
<svg class="n" width="100%" viewBox="0 0 680 1790" role="img"><title>Composition of Council and Duration of Houses</title><desc>Composition of Council and Duration of Houses</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="132" y="26" width="416" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Composition of Council and Duration of Houses</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Composition of Council</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Strength:</tspan><tspan class="k"> Unlike the members of the legislative assembly, the members of the legislative</tspan></text>
<text x="56" y="146"><tspan class="k">council are</tspan><tspan class="r"> indirectly elected</tspan><tspan class="k">. The</tspan><tspan class="r"> maximum strength</tspan><tspan class="k"> of the council is fixed at</tspan><tspan class="r"> one-third</tspan></text>
<text x="56" y="168"><tspan class="r">of the total strength of the assembly</tspan><tspan class="k"> and the</tspan><tspan class="r"> minimum strength is fixed at 40</tspan><tspan class="k">. It</tspan></text>
<text x="56" y="190"><tspan class="k">means that the size of the council depends on the size of the assembly of the</tspan></text>
<text x="56" y="212"><tspan class="k">concerned state. This is done to ensure the</tspan><tspan class="b"> predominance of the directly elected House</tspan></text>
<text x="56" y="234"><tspan class="b">(assembly)</tspan><tspan class="k"> in the legislative affairs of the state. Though the Constitution has fixed the</tspan></text>
<text x="56" y="256"><tspan class="k">maximum and the minimum limits, the</tspan><tspan class="r"> actual strength of a Council is fixed by</tspan></text>
<text x="56" y="278"><tspan class="r">Parliament</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="290" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="310" text-anchor="middle"><tspan class="r" style="font-weight:700">Max</tspan></text>
<text class="sm" x="137" y="328" text-anchor="middle"><tspan class="k">1/3 of Assembly</tspan></text>
<rect class="bx" x="243" y="290" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="310" text-anchor="middle"><tspan class="r" style="font-weight:700">Min</tspan></text>
<text class="sm" x="340" y="328" text-anchor="middle"><tspan class="k">40</tspan></text>
<rect class="bx" x="447" y="290" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="310" text-anchor="middle"><tspan class="r" style="font-weight:700">Actual</tspan></text>
<text class="sm" x="543" y="328" text-anchor="middle"><tspan class="k">fixed by Parliament</tspan></text>
<text x="44" y="368"><tspan class="h" style="font-weight:700">Council strength – Table 33.2:</tspan><tspan class="k"> The strength of legislature councils is indicated in</tspan><tspan class="r"> Table</tspan></text>
<text x="56" y="390"><tspan class="r">33.2</tspan><tspan class="k">.</tspan></text>
<text x="44" y="418"><tspan class="h" style="font-weight:700">Manner of Election:</tspan><tspan class="k"> Of the total number of members of a legislative council:</tspan></text>
<text x="56" y="444" class="r" style="font-weight:700">1.</text>
<text x="78" y="444"><tspan class="h" style="font-weight:700">Local bodies – 1/3:</tspan><tspan class="r"> 1/3</tspan><tspan class="k"> are elected by the members of</tspan><tspan class="r"> local bodies</tspan><tspan class="k"> in the state like</tspan></text>
<text x="78" y="466"><tspan class="k">municipalities, district boards, etc.,</tspan></text>
<text x="56" y="492" class="r" style="font-weight:700">2.</text>
<text x="78" y="492"><tspan class="h" style="font-weight:700">Graduates – 1/12:</tspan><tspan class="r"> 1/12</tspan><tspan class="k"> are elected by</tspan><tspan class="r"> graduates</tspan><tspan class="k"> of three years standing and residing</tspan></text>
<text x="78" y="514"><tspan class="k">within the state,</tspan></text>
<text x="56" y="540" class="r" style="font-weight:700">3.</text>
<text x="78" y="540"><tspan class="h" style="font-weight:700">Teachers – 1/12:</tspan><tspan class="r"> 1/12</tspan><tspan class="k"> are elected by</tspan><tspan class="r"> teachers</tspan><tspan class="k"> of three years standing in the state,</tspan></text>
<text x="78" y="562"><tspan class="k">not lower in standard than secondary school,</tspan></text>
<text x="56" y="588" class="r" style="font-weight:700">4.</text>
<text x="78" y="588"><tspan class="h" style="font-weight:700">MLAs – 1/3:</tspan><tspan class="r"> 1/3</tspan><tspan class="k"> are elected by the</tspan><tspan class="r"> members of the legislative assembly</tspan><tspan class="k"> of the</tspan></text>
<text x="78" y="610"><tspan class="k">state from amongst persons who are not members of the assembly, and</tspan></text>
<text x="56" y="636" class="r" style="font-weight:700">5.</text>
<text x="78" y="636"><tspan class="h" style="font-weight:700">Governor’s nominees – 1/6:</tspan><tspan class="k"> the</tspan><tspan class="r"> remainder are nominated by the governor</tspan><tspan class="k"> from</tspan></text>
<text x="78" y="658"><tspan class="k">amongst persons who have a special knowledge or practical experience of</tspan><tspan class="b"> literature,</tspan></text>
<text x="78" y="680"><tspan class="b">science, art, cooperative movement and social service</tspan><tspan class="k">.</tspan></text>
<path d="M50 424 L44 424 L44 686 L50 686" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="692" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="96" y="721" text-anchor="middle"><tspan class="r">1/3</tspan></text>
<text class="xs" x="96" y="739" text-anchor="middle"><tspan class="k">local bodies</tspan></text>
<rect class="bx" x="162" y="692" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="218" y="721" text-anchor="middle"><tspan class="r">1/12</tspan></text>
<text class="xs" x="218" y="739" text-anchor="middle"><tspan class="k">graduates</tspan></text>
<rect class="bx" x="284" y="692" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="721" text-anchor="middle"><tspan class="r">1/12</tspan></text>
<text class="xs" x="340" y="739" text-anchor="middle"><tspan class="k">teachers</tspan></text>
<rect class="bx" x="406" y="692" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="462" y="721" text-anchor="middle"><tspan class="r">1/3</tspan></text>
<text class="xs" x="462" y="739" text-anchor="middle"><tspan class="k">MLAs</tspan></text>
<rect class="bx" x="528" y="692" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="584" y="712" text-anchor="middle"><tspan class="r">1/6</tspan></text>
<text class="xs" x="584" y="730" text-anchor="middle"><tspan class="k">Governor</tspan></text>
<text class="xs" x="584" y="748" text-anchor="middle"><tspan class="k">nominates</tspan></text>
<rect x="40.0" y="776" width="200.0" height="44" fill="#D93A3A" fill-opacity="0.16" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="140" y="803" text-anchor="middle"><tspan class="r" style="font-weight:700">1/3</tspan><tspan class="k"> local bodies</tspan></text>
<rect x="240.0" y="776" width="50.0" height="44" fill="#2F6FDB" fill-opacity="0.16" stroke="#2F6FDB" stroke-width="1.2"/>
<text class="xs" x="265" y="803" text-anchor="middle"><tspan class="r" style="font-weight:700">1/12</tspan></text>
<rect x="290.0" y="776" width="50.0" height="44" fill="#3B9B4A" fill-opacity="0.16" stroke="#3B9B4A" stroke-width="1.2"/>
<text class="xs" x="315" y="803" text-anchor="middle"><tspan class="r" style="font-weight:700">1/12</tspan></text>
<rect x="340.0" y="776" width="200.0" height="44" fill="#E3B23C" fill-opacity="0.16" stroke="#E3B23C" stroke-width="1.2"/>
<text class="xs" x="440" y="803" text-anchor="middle"><tspan class="r" style="font-weight:700">1/3</tspan><tspan class="k"> MLAs elect</tspan></text>
<rect x="540.0" y="776" width="100.0" height="44" fill="#8E44AD" fill-opacity="0.16" stroke="#8E44AD" stroke-width="1.2"/>
<text class="xs" x="590" y="803" text-anchor="middle"><tspan class="r" style="font-weight:700">1/6</tspan><tspan class="k"> Governor</tspan></text>
<text class="xs" x="340" y="832" text-anchor="middle"><tspan class="b">Legislative Council to scale – the two 1/12 parts are graduates and teachers; 5/6 indirectly elected, 1/6</tspan></text>
<text class="xs" x="340" y="850" text-anchor="middle"><tspan class="b">nominated</tspan></text>
<text x="44" y="874"><tspan class="h" style="font-weight:700">5/6 elected, 1/6 nominated – STV:</tspan><tspan class="k"> Thus,</tspan><tspan class="r"> 5/6</tspan><tspan class="k"> of the total number of members of a</tspan></text>
<text x="56" y="896"><tspan class="k">legislative council are</tspan><tspan class="r"> indirectly elected</tspan><tspan class="k"> and</tspan><tspan class="r"> 1/6 are nominated by the governor</tspan><tspan class="k">. The</tspan></text>
<text x="56" y="918"><tspan class="k">members are elected in accordance with the system of</tspan><tspan class="r"> proportional representation by</tspan></text>
<text x="56" y="940"><tspan class="r">means of a single transferable vote</tspan><tspan class="k">.</tspan></text>
<text x="44" y="968"><tspan class="h" style="font-weight:700">Tentative scheme:</tspan><tspan class="k"> This scheme of composition of a legislative council as laid down in</tspan></text>
<text x="56" y="990"><tspan class="k">the Constitution is</tspan><tspan class="r"> tentative and not final</tspan><tspan class="k">. The</tspan><tspan class="r"> Parliament is authorised to modify or</tspan></text>
<text x="56" y="1012"><tspan class="r">replace</tspan><tspan class="k"> the same. However, it has</tspan><tspan class="b"> not enacted any such law so far</tspan><tspan class="k">.</tspan></text>
<text class="r hd" x="40" y="1046">DURATION OF TWO HOUSES</text>
<line x1="40" y1="1052" x2="250" y2="1052" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="1080"><tspan class="r" style="font-weight:700">Duration of Assembly</tspan></text>
<text x="44" y="1110"><tspan class="h" style="font-weight:700">Assembly – five years, dissolvable:</tspan><tspan class="k"> Like the</tspan><tspan class="r"> Lok Sabha</tspan><tspan class="k">, the legislative assembly is</tspan><tspan class="r"> not</tspan></text>
<text x="56" y="1132"><tspan class="r">a continuing chamber</tspan><tspan class="k">. Its normal term is</tspan><tspan class="r"> five years</tspan><tspan class="k"> from the date of its first meeting</tspan></text>
<text x="56" y="1154"><tspan class="k">after the general elections. The expiration of the period of five years operates as</tspan></text>
<text x="56" y="1176"><tspan class="b">automatic dissolution</tspan><tspan class="k"> of the assembly. However, the</tspan><tspan class="r"> governor is authorised to dissolve</tspan></text>
<text x="56" y="1198"><tspan class="k">the assembly at any time (i.e., even before the completion of five years) to pave the</tspan></text>
<text x="56" y="1220"><tspan class="k">way for fresh elections. Further, the term of the assembly can be</tspan><tspan class="r"> extended during the</tspan></text>
<text x="56" y="1242"><tspan class="r">period of national emergency</tspan><tspan class="k"> by a law of Parliament for</tspan><tspan class="r"> one year at a time</tspan><tspan class="k"> (for any</tspan></text>
<text x="56" y="1264"><tspan class="k">length of time). However, this extension cannot continue beyond a period of</tspan><tspan class="r"> six months</tspan></text>
<text x="56" y="1286"><tspan class="r">after the emergency</tspan><tspan class="k"> has ceased to operate. This means that the assembly should be</tspan></text>
<text x="56" y="1308"><tspan class="k">re-elected within six months after the revocation of emergency.</tspan></text>
<text class="sh" x="40" y="1336"><tspan class="r" style="font-weight:700">Duration of Council</tspan></text>
<text x="44" y="1366"><tspan class="h" style="font-weight:700">Council – permanent body:</tspan><tspan class="k"> Like the</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k">, the legislative council is a</tspan><tspan class="r"> continuing</tspan></text>
<text x="56" y="1388"><tspan class="r">chamber</tspan><tspan class="k">, that is, it is a</tspan><tspan class="r"> permanent body</tspan><tspan class="k"> and is</tspan><tspan class="r"> not subject to dissolution</tspan><tspan class="k">. But,</tspan><tspan class="r"> one-third</tspan></text>
<text x="56" y="1410"><tspan class="r">of its members retire on the expiration of every second year</tspan><tspan class="k">. So, a member continues as</tspan></text>
<text x="56" y="1432"><tspan class="k">such for</tspan><tspan class="r"> six years</tspan><tspan class="k">. The vacant seats are filled up by fresh elections and nominations (by</tspan></text>
<text x="56" y="1454"><tspan class="k">governor) at the beginning of every third year. The retiring members are also eligible for</tspan></text>
<text x="56" y="1476"><tspan class="b">re-election and re-nomination any number of times</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="1490" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1508" text-anchor="middle"><tspan class="r" style="font-weight:700">Assembly</tspan></text>
<line class="ln" x1="190" y1="1518" x2="190" y2="1532" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1553" text-anchor="middle"><tspan class="k">not continuing</tspan></text>
<text class="sm" x="190" y="1575" text-anchor="middle"><tspan class="r">5 years</tspan></text>
<text class="sm" x="190" y="1597" text-anchor="middle"><tspan class="k">Governor can dissolve</tspan></text>
<text class="sm" x="190" y="1619" text-anchor="middle"><tspan class="b">+1 year in emergency</tspan></text>
<rect class="bx" x="346" y="1490" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1508" text-anchor="middle"><tspan class="r" style="font-weight:700">Council</tspan></text>
<line class="ln" x1="490" y1="1518" x2="490" y2="1532" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1553" text-anchor="middle"><tspan class="r">permanent</tspan></text>
<text class="sm" x="490" y="1575" text-anchor="middle"><tspan class="k">not dissolved</tspan></text>
<text class="sm" x="490" y="1597" text-anchor="middle"><tspan class="r">1/3 retire every 2 years</tspan></text>
<text class="sm" x="490" y="1619" text-anchor="middle"><tspan class="b">6-year term</tspan></text>

<line x1="98" y1="1704" x2="259" y2="1704" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="179" y="1697" text-anchor="middle"><tspan class="k">2 years</tspan></text>
<line x1="259" y1="1704" x2="421" y2="1704" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="340" y="1697" text-anchor="middle"><tspan class="k">2 years</tspan></text>
<line x1="421" y1="1704" x2="582" y2="1704" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="501" y="1697" text-anchor="middle"><tspan class="k">2 years</tspan></text>
<circle cx="98" cy="1704" r="5" fill="#2F6FDB"/>
<text class="xs" x="98" y="1726" text-anchor="middle"><tspan class="k">Council constituted</tspan></text>
<circle cx="259" cy="1704" r="5" fill="#2F6FDB"/>
<text class="xs" x="259" y="1726" text-anchor="middle"><tspan class="k">end of 2nd year</tspan></text>
<text class="xs" x="259" y="1679" text-anchor="middle"><tspan class="r">1/3 retire</tspan></text>
<circle cx="421" cy="1704" r="5" fill="#2F6FDB"/>
<text class="xs" x="421" y="1726" text-anchor="middle"><tspan class="k">end of 4th year</tspan></text>
<text class="xs" x="421" y="1679" text-anchor="middle"><tspan class="r">1/3 retire</tspan></text>
<circle cx="582" cy="1704" r="5" fill="#2F6FDB"/>
<text class="xs" x="582" y="1726" text-anchor="middle"><tspan class="k">end of 6th year</tspan></text>
<text class="xs" x="582" y="1679" text-anchor="middle"><tspan class="r">1/3 retire</tspan></text>
<text class="xs" x="340" y="1746" text-anchor="middle"><tspan class="b">Council is never dissolved – each member serves six years; vacancies filled at the beginning of every</tspan></text>
<text class="xs" x="340" y="1764" text-anchor="middle"><tspan class="b">third year</tspan></text>
</svg>
