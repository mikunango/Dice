<div id="vis-container"><h2 class="sr-only">Legislative Procedure Compared</h2>
<svg class="n" width="100%" viewBox="0 0 680 1965" role="img"><title>Legislative Procedure Compared</title><desc>Legislative Procedure Compared</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="191" y="26" width="297" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Legislative Procedure Compared</text>
<text class="r hd" x="40" y="100">LEGISLATIVE PROCEDURE COMPARED</text>
<line x1="40" y1="106" x2="325" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Parliament vs State Legislature:</tspan><tspan class="k"> A comparison of the legislature procedure in the</tspan></text>
<text x="56" y="156"><tspan class="r">Parliament</tspan><tspan class="k"> and</tspan><tspan class="r"> State Legislature</tspan><tspan class="k"> is given in</tspan><tspan class="r"> Table 33.1</tspan><tspan class="k">.</tspan></text>
<text x="40" y="186"><tspan class="r" style="font-weight:700">Table 33.1 Comparing Legislative Procedure in the Parliament and State Legislature</tspan></text>
<text class="sm" x="190" y="216" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<text class="sm" x="490" y="216" text-anchor="middle"><tspan class="r" style="font-weight:700">State Legislature</tspan></text>
<line class="gx" x1="40" y1="227" x2="640" y2="227"/>
<rect x="40" y="227" width="600" height="30" fill="#D93A3A" fill-opacity="0.08"/>
<text class="sm" x="340" y="247" text-anchor="middle"><tspan class="r" style="font-weight:700">A. With Regard to Ordinary Bills</tspan></text>
<line class="gx" x1="40" y1="257" x2="640" y2="257"/>
<text class="sm" x="47" y="277"><tspan class="k">1. It can be introduced in</tspan><tspan class="r"> either House</tspan><tspan class="k"> of the</tspan></text>
<text class="sm" x="47" y="296"><tspan class="k">Parliament.</tspan></text>
<text class="sm" x="347" y="277"><tspan class="k">1. It can be introduced in</tspan><tspan class="r"> either House</tspan><tspan class="k"> of the</tspan></text>
<text class="sm" x="347" y="296"><tspan class="k">state legislature.</tspan></text>
<line class="gx" x1="40" y1="307" x2="640" y2="307"/>
<text class="sm" x="47" y="327"><tspan class="k">2. It can be introduced either by a minister</tspan></text>
<text class="sm" x="47" y="346"><tspan class="k">or by a private member.</tspan></text>
<text class="sm" x="347" y="327"><tspan class="k">2. It can be introduced either by a minister</tspan></text>
<text class="sm" x="347" y="346"><tspan class="k">or by private member.</tspan></text>
<line class="gx" x1="40" y1="357" x2="640" y2="357"/>
<text class="sm" x="47" y="377"><tspan class="k">3. It passes through first reading, second</tspan></text>
<text class="sm" x="47" y="396"><tspan class="k">reading and third reading in the originating</tspan></text>
<text class="sm" x="47" y="415"><tspan class="k">House.</tspan></text>
<text class="sm" x="347" y="377"><tspan class="k">3. It passes through first reading, second</tspan></text>
<text class="sm" x="347" y="396"><tspan class="k">reading and third reading in the originating</tspan></text>
<text class="sm" x="347" y="415"><tspan class="k">House.</tspan></text>
<line class="gx" x1="40" y1="426" x2="640" y2="426"/>
<text class="sm" x="47" y="446"><tspan class="k">4. It is deemed to have been passed by the</tspan></text>
<text class="sm" x="47" y="465"><tspan class="k">Parliament only when both the Houses have</tspan></text>
<text class="sm" x="47" y="484"><tspan class="k">agreed to it, either with or without</tspan></text>
<text class="sm" x="47" y="503"><tspan class="k">amendments.</tspan></text>
<text class="sm" x="347" y="446"><tspan class="k">4. It is deemed to have been passed by the</tspan></text>
<text class="sm" x="347" y="465"><tspan class="k">state legislature only when both the Houses</tspan></text>
<text class="sm" x="347" y="484"><tspan class="k">have agreed to it, either with or without</tspan></text>
<text class="sm" x="347" y="503"><tspan class="k">amendments.</tspan></text>
<line class="gx" x1="40" y1="514" x2="640" y2="514"/>
<text class="sm" x="47" y="534"><tspan class="k">5. A deadlock between the two Houses takes</tspan></text>
<text class="sm" x="47" y="553"><tspan class="k">place when the second House, after receiving</tspan></text>
<text class="sm" x="47" y="572"><tspan class="k">a bill passed by the first House, rejects the</tspan></text>
<text class="sm" x="47" y="591"><tspan class="k">bill or proposes amendments that are not</tspan></text>
<text class="sm" x="47" y="610"><tspan class="k">acceptable to the first House or does not</tspan></text>
<text class="sm" x="47" y="629"><tspan class="k">pass the bill within</tspan><tspan class="r"> six months</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="534"><tspan class="k">5. A deadlock between the two Houses takes</tspan></text>
<text class="sm" x="347" y="553"><tspan class="k">place when the legislative council, after</tspan></text>
<text class="sm" x="347" y="572"><tspan class="k">receiving a bill passed by the legislative</tspan></text>
<text class="sm" x="347" y="591"><tspan class="k">assembly, rejects the bill or proposes</tspan></text>
<text class="sm" x="347" y="610"><tspan class="k">amendments that are not acceptable to the</tspan></text>
<text class="sm" x="347" y="629"><tspan class="k">legislative assembly or does not pass the bill</tspan></text>
<text class="sm" x="347" y="648"><tspan class="k">within</tspan><tspan class="r"> three months</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="659" x2="640" y2="659"/>
<text class="sm" x="47" y="679"><tspan class="k">6. The Constitution</tspan><tspan class="r"> provides for the</tspan></text>
<text class="sm" x="47" y="698"><tspan class="r">mechanism of joint sitting</tspan><tspan class="k"> of two Houses of</tspan></text>
<text class="sm" x="47" y="717"><tspan class="k">the Parliament to resolve a deadlock between</tspan></text>
<text class="sm" x="47" y="736"><tspan class="k">them over the passage of a bill.</tspan></text>
<text class="sm" x="347" y="679"><tspan class="k">6. The Constitution</tspan><tspan class="r"> does not provide for the</tspan></text>
<text class="sm" x="347" y="698"><tspan class="r">mechanism of joint sitting</tspan><tspan class="k"> of two Houses of</tspan></text>
<text class="sm" x="347" y="717"><tspan class="k">the state legislature to resolve a deadlock</tspan></text>
<text class="sm" x="347" y="736"><tspan class="k">between them over the passage of a bill.</tspan></text>
<line class="gx" x1="40" y1="747" x2="640" y2="747"/>
<text class="sm" x="47" y="767"><tspan class="k">7. The Lok Sabha</tspan><tspan class="r"> cannot override</tspan><tspan class="k"> the Rajya</tspan></text>
<text class="sm" x="47" y="786"><tspan class="k">Sabha by passing the bill for the second</tspan></text>
<text class="sm" x="47" y="805"><tspan class="k">time and vice versa. A joint sitting is the</tspan></text>
<text class="sm" x="47" y="824"><tspan class="k">only way to resolve a deadlock between the</tspan></text>
<text class="sm" x="47" y="843"><tspan class="k">two Houses.</tspan></text>
<text class="sm" x="347" y="767"><tspan class="k">7. The legislative assembly</tspan><tspan class="r"> can override</tspan><tspan class="k"> the</tspan></text>
<text class="sm" x="347" y="786"><tspan class="k">legislative council by passing the bill for the</tspan></text>
<text class="sm" x="347" y="805"><tspan class="k">second time and not vice versa. When a bill</tspan></text>
<text class="sm" x="347" y="824"><tspan class="k">is passed by the assembly for the second</tspan></text>
<text class="sm" x="347" y="843"><tspan class="k">time and transmitted to the legislative</tspan></text>
<text class="sm" x="347" y="862"><tspan class="k">council, if the legislative council rejects the</tspan></text>
<text class="sm" x="347" y="881"><tspan class="k">bill again, or proposes amendments that are</tspan></text>
<text class="sm" x="347" y="900"><tspan class="k">not acceptable to the legislative assembly, or</tspan></text>
<text class="sm" x="347" y="919"><tspan class="k">does not pass the bill within</tspan><tspan class="r"> one month</tspan><tspan class="k">,</tspan></text>
<text class="sm" x="347" y="938"><tspan class="k">then the bill is deemed to have been passed</tspan></text>
<text class="sm" x="347" y="957"><tspan class="k">by both the Houses in the form in which it</tspan></text>
<text class="sm" x="347" y="976"><tspan class="k">was passed by the legislative assembly for</tspan></text>
<text class="sm" x="347" y="995"><tspan class="k">the second time.</tspan></text>
<line class="gx" x1="40" y1="1006" x2="640" y2="1006"/>
<text class="sm" x="47" y="1026"><tspan class="k">8. The mechanism of joint sitting for</tspan></text>
<text class="sm" x="47" y="1045"><tspan class="k">resolving a deadlock applies to a bill whether</tspan></text>
<text class="sm" x="47" y="1064"><tspan class="k">originating in the Lok Sabha or the Rajya</tspan></text>
<text class="sm" x="47" y="1083"><tspan class="k">Sabha. If a joint sitting is not summoned by</tspan></text>
<text class="sm" x="47" y="1102"><tspan class="k">the president, the bill ends and becomes</tspan></text>
<text class="sm" x="47" y="1121"><tspan class="k">dead.</tspan></text>
<text class="sm" x="347" y="1026"><tspan class="k">8. The mechanism of passing the bill for the</tspan></text>
<text class="sm" x="347" y="1045"><tspan class="k">second time to resolve a deadlock applies to</tspan></text>
<text class="sm" x="347" y="1064"><tspan class="k">a bill originating in the legislative assembly</tspan></text>
<text class="sm" x="347" y="1083"><tspan class="k">only. When a bill, which has originated in the</tspan></text>
<text class="sm" x="347" y="1102"><tspan class="k">legislative council and sent to the legislative</tspan></text>
<text class="sm" x="347" y="1121"><tspan class="k">assembly, is rejected by the latter, the bill</tspan></text>
<text class="sm" x="347" y="1140"><tspan class="k">ends and becomes dead.</tspan></text>
<line class="gx" x1="40" y1="1151" x2="640" y2="1151"/>
<rect x="40" y="1151" width="600" height="30" fill="#D93A3A" fill-opacity="0.08"/>
<text class="sm" x="340" y="1171" text-anchor="middle"><tspan class="r" style="font-weight:700">B. With Regard to Money Bills</tspan></text>
<line class="gx" x1="40" y1="1181" x2="640" y2="1181"/>
<text class="sm" x="47" y="1201"><tspan class="k">1. It can be introduced only in the</tspan><tspan class="r"> Lok Sabha</tspan></text>
<text class="sm" x="47" y="1220"><tspan class="k">and not in the Rajya Sabha.</tspan></text>
<text class="sm" x="347" y="1201"><tspan class="k">1. It can be introduced only in the</tspan><tspan class="r"> legislative</tspan></text>
<text class="sm" x="347" y="1220"><tspan class="r">assembly</tspan><tspan class="k"> and not in the legislative council.</tspan></text>
<line class="gx" x1="40" y1="1231" x2="640" y2="1231"/>
<text class="sm" x="47" y="1251"><tspan class="k">2. It can be introduced only on the</tspan></text>
<text class="sm" x="47" y="1270"><tspan class="k">recommendation of the</tspan><tspan class="r"> president</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="1251"><tspan class="k">2. It can be introduced only on the</tspan></text>
<text class="sm" x="347" y="1270"><tspan class="k">recommendation of the</tspan><tspan class="r"> governor</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="1281" x2="640" y2="1281"/>
<text class="sm" x="47" y="1301"><tspan class="k">3. It can be introduced only by a minister</tspan></text>
<text class="sm" x="47" y="1320"><tspan class="k">and not by a private member.</tspan></text>
<text class="sm" x="347" y="1301"><tspan class="k">3. It can be introduced only by a minister</tspan></text>
<text class="sm" x="347" y="1320"><tspan class="k">and not by a private member.</tspan></text>
<line class="gx" x1="40" y1="1331" x2="640" y2="1331"/>
<text class="sm" x="47" y="1351"><tspan class="k">4. It cannot be rejected or amended by the</tspan></text>
<text class="sm" x="47" y="1370"><tspan class="k">Rajya Sabha. It should be returned to the</tspan></text>
<text class="sm" x="47" y="1389"><tspan class="k">Lok Sabha within</tspan><tspan class="r"> 14 days</tspan><tspan class="k">, either with or</tspan></text>
<text class="sm" x="47" y="1408"><tspan class="k">without recommendations.</tspan></text>
<text class="sm" x="347" y="1351"><tspan class="k">4. It cannot be rejected or amended by the</tspan></text>
<text class="sm" x="347" y="1370"><tspan class="k">legislative council. It should be returned to</tspan></text>
<text class="sm" x="347" y="1389"><tspan class="k">the legislative assembly within</tspan><tspan class="r"> 14 days</tspan><tspan class="k">,</tspan></text>
<text class="sm" x="347" y="1408"><tspan class="k">either with or without amendments.</tspan></text>
<line class="gx" x1="40" y1="1419" x2="640" y2="1419"/>
<text class="sm" x="47" y="1439"><tspan class="k">5. The Lok Sabha can either accept or reject</tspan></text>
<text class="sm" x="47" y="1458"><tspan class="k">all or any of the recommendations of the</tspan></text>
<text class="sm" x="47" y="1477"><tspan class="k">Rajya Sabha.</tspan></text>
<text class="sm" x="347" y="1439"><tspan class="k">5. The legislative assembly can either accept</tspan></text>
<text class="sm" x="347" y="1458"><tspan class="k">or reject all or any of the recommendations</tspan></text>
<text class="sm" x="347" y="1477"><tspan class="k">of the legislative council.</tspan></text>
<line class="gx" x1="40" y1="1488" x2="640" y2="1488"/>
<text class="sm" x="47" y="1508"><tspan class="k">6. If the Lok Sabha accepts any</tspan></text>
<text class="sm" x="47" y="1527"><tspan class="k">recommendation, the bill is then deemed to</tspan></text>
<text class="sm" x="47" y="1546"><tspan class="k">have been passed by both the Houses in the</tspan></text>
<text class="sm" x="47" y="1565"><tspan class="k">modified form.</tspan></text>
<text class="sm" x="347" y="1508"><tspan class="k">6. If the legislative assembly accepts any</tspan></text>
<text class="sm" x="347" y="1527"><tspan class="k">recommendation, the bill is then deemed to</tspan></text>
<text class="sm" x="347" y="1546"><tspan class="k">have been passed by both the Houses in the</tspan></text>
<text class="sm" x="347" y="1565"><tspan class="k">modified form.</tspan></text>
<line class="gx" x1="40" y1="1576" x2="640" y2="1576"/>
<text class="sm" x="47" y="1596"><tspan class="k">7. If the Lok Sabha does not accept any</tspan></text>
<text class="sm" x="47" y="1615"><tspan class="k">recommendation, the bill is then deemed to</tspan></text>
<text class="sm" x="47" y="1634"><tspan class="k">have been passed by both the Houses in the</tspan></text>
<text class="sm" x="47" y="1653"><tspan class="k">form originally passed by the Lok Sabha</tspan></text>
<text class="sm" x="47" y="1672"><tspan class="k">without any change.</tspan></text>
<text class="sm" x="347" y="1596"><tspan class="k">7. If the legislative assembly does not accept</tspan></text>
<text class="sm" x="347" y="1615"><tspan class="k">any recommendation, the bill is then deemed</tspan></text>
<text class="sm" x="347" y="1634"><tspan class="k">to have been passed by both the Houses in</tspan></text>
<text class="sm" x="347" y="1653"><tspan class="k">the form originally passed by the legislative</tspan></text>
<text class="sm" x="347" y="1672"><tspan class="k">assembly without any change.</tspan></text>
<line class="gx" x1="40" y1="1683" x2="640" y2="1683"/>
<text class="sm" x="47" y="1703"><tspan class="k">8. If the Rajya Sabha does not return the</tspan></text>
<text class="sm" x="47" y="1722"><tspan class="k">bill to the Lok Sabha within 14 days, the bill</tspan></text>
<text class="sm" x="47" y="1741"><tspan class="k">is deemed to have been passed by both the</tspan></text>
<text class="sm" x="47" y="1760"><tspan class="k">Houses at the expiration of the said period in</tspan></text>
<text class="sm" x="47" y="1779"><tspan class="k">the form originally passed by the Lok Sabha.</tspan></text>
<text class="sm" x="347" y="1703"><tspan class="k">8. If the legislative council does not return</tspan></text>
<text class="sm" x="347" y="1722"><tspan class="k">the bill to the legislative assembly within 14</tspan></text>
<text class="sm" x="347" y="1741"><tspan class="k">days, the bill is deemed to have been passed</tspan></text>
<text class="sm" x="347" y="1760"><tspan class="k">by both the Houses at the expiration of the</tspan></text>
<text class="sm" x="347" y="1779"><tspan class="k">said period in the form originally passed by</tspan></text>
<text class="sm" x="347" y="1798"><tspan class="k">the legislative assembly.</tspan></text>
<line class="gx" x1="40" y1="1809" x2="640" y2="1809"/>
<text class="sm" x="47" y="1829"><tspan class="k">9. The Constitution does not provide for the</tspan></text>
<text class="sm" x="47" y="1848"><tspan class="k">resolution of any deadlock between the two</tspan></text>
<text class="sm" x="47" y="1867"><tspan class="k">Houses. This is because, the will of the Lok</tspan></text>
<text class="sm" x="47" y="1886"><tspan class="k">Sabha is made to prevail over that of the</tspan></text>
<text class="sm" x="47" y="1905"><tspan class="k">Rajya Sabha, if the latter does not agree to</tspan></text>
<text class="sm" x="47" y="1924"><tspan class="k">the bill passed by the former.</tspan></text>
<text class="sm" x="347" y="1829"><tspan class="k">9. The Constitution does not provide for the</tspan></text>
<text class="sm" x="347" y="1848"><tspan class="k">resolution of any deadlock between the two</tspan></text>
<text class="sm" x="347" y="1867"><tspan class="k">Houses. This is because, the will of the</tspan></text>
<text class="sm" x="347" y="1886"><tspan class="k">legislative assembly is made to prevail over</tspan></text>
<text class="sm" x="347" y="1905"><tspan class="k">that of legislative council, if the latter does</tspan></text>
<text class="sm" x="347" y="1924"><tspan class="k">not agree to the bill passed by the former.</tspan></text>
