<title>Defection, Oath and Vacation of Seats</title>

<div id="vis-container"><h2 class="sr-only">Defection, Oath and Vacation of Seats</h2>
<svg class="n" width="100%" viewBox="0 0 680 1598" role="img"><title>Defection, Oath and Vacation of Seats</title><desc>Defection, Oath and Vacation of Seats</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="163" y="26" width="355" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Defection, Oath and Vacation of Seats</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">Disqualification on Ground of Defection</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Tenth Schedule:</tspan><tspan class="k"> The Constitution also lays down that a person shall be disqualified for</tspan></text>
<text x="56" y="146"><tspan class="k">being a member of either House of state legislature if he/she is so disqualified on the</tspan></text>
<text x="56" y="168"><tspan class="k">ground of</tspan><tspan class="r"> defection</tspan><tspan class="k"> under the provisions of the</tspan><tspan class="r"> Tenth Schedule</tspan><tspan class="k">.</tspan></text>
<text x="44" y="196"><tspan class="h" style="font-weight:700">Speaker/Chairman decides – Kihoto Hollohan:</tspan><tspan class="k"> The question of disqualification under the</tspan></text>
<text x="56" y="218"><tspan class="k">Tenth Schedule is decided by the</tspan><tspan class="r"> Chairman</tspan><tspan class="k">, in the case of legislative council and,</tspan></text>
<text x="56" y="240"><tspan class="r">Speaker</tspan><tspan class="k">, in the case of legislative assembly (</tspan><tspan class="b">and not by the governor</tspan><tspan class="k">). In</tspan><tspan class="r"> Kihoto</tspan></text>
<text x="56" y="262"><tspan class="r">Hollohan case⁶ (1992)</tspan><tspan class="k">, the Supreme Court ruled that the decision of Chairman/Speaker</tspan></text>
<text x="56" y="284"><tspan class="k">in this regard is</tspan><tspan class="r"> subject to judicial review</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="298" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="316" text-anchor="middle"><tspan class="r" style="font-weight:700">General disqualification</tspan></text>
<line class="ln" x1="190" y1="326" x2="190" y2="340" marker-end="url(#ah)"/>
<text class="sm" x="190" y="361" text-anchor="middle"><tspan class="k">decided by</tspan><tspan class="r"> Governor</tspan></text>
<text class="sm" x="190" y="383" text-anchor="middle"><tspan class="k">on</tspan><tspan class="b"> ECI opinion</tspan></text>
<rect class="bx" x="346" y="298" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="316" text-anchor="middle"><tspan class="r" style="font-weight:700">Defection (Tenth Schedule)</tspan></text>
<line class="ln" x1="490" y1="326" x2="490" y2="340" marker-end="url(#ah)"/>
<text class="sm" x="490" y="361" text-anchor="middle"><tspan class="k">decided by</tspan><tspan class="r"> Speaker / Chairman</tspan></text>
<text class="sm" x="490" y="383" text-anchor="middle"><tspan class="b">judicial review – Kihoto (1992)</tspan></text>
<line x1="340" y1="298" x2="340" y2="386" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="424">3. Oath or Affirmation</text>
<text x="44" y="454"><tspan class="h" style="font-weight:700">Oath before Governor:</tspan><tspan class="k"> Every member of either House of state legislature, before taking</tspan></text>
<text x="56" y="476"><tspan class="k">his/her seat in the House, has to make and subscribe an</tspan><tspan class="r"> oath or affirmation before the</tspan></text>
<text x="56" y="498"><tspan class="r">governor</tspan><tspan class="k"> or some person appointed by him/her for this purpose.</tspan></text>
<text x="44" y="526"><tspan class="h" style="font-weight:700">Contents of oath:</tspan><tspan class="k"> In this oath, a member of the state legislature swears:</tspan></text>
<text x="56" y="552" class="r" style="font-weight:700">1.</text>
<text x="78" y="552"><tspan class="k">to bear</tspan><tspan class="r"> true faith and allegiance to the Constitution</tspan><tspan class="k"> of India;</tspan></text>
<text x="56" y="578" class="r" style="font-weight:700">2.</text>
<text x="78" y="578"><tspan class="k">to uphold the</tspan><tspan class="r"> sovereignty and integrity</tspan><tspan class="k"> of India; and</tspan></text>
<text x="56" y="604" class="r" style="font-weight:700">3.</text>
<text x="78" y="604"><tspan class="k">to</tspan><tspan class="r"> faithfully discharge the duty</tspan><tspan class="k"> of his/her office.</tspan></text>
<path d="M50 532 L44 532 L44 610 L50 610" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="632"><tspan class="h" style="font-weight:700">No oath – no vote:</tspan><tspan class="k"> Unless a member takes the oath, he/she</tspan><tspan class="r"> cannot vote and participate</tspan></text>
<text x="56" y="654"><tspan class="k">in the proceedings of the House and does not become eligible to the</tspan><tspan class="b"> privileges and</tspan></text>
<text x="56" y="676"><tspan class="b">immunities</tspan><tspan class="k"> of the state legislature.</tspan></text>
<text x="44" y="704"><tspan class="h" style="font-weight:700">Penalty ₹500 per day:</tspan><tspan class="k"> A person is liable to a</tspan><tspan class="r"> penalty of ₹500 for each day</tspan><tspan class="k"> he/she sits</tspan></text>
<text x="56" y="726"><tspan class="k">or votes as a member in a House:</tspan></text>
<text x="56" y="752" class="r" style="font-weight:700">1.</text>
<text x="78" y="752"><tspan class="h" style="font-weight:700">Without oath:</tspan><tspan class="r"> before taking and subscribing the prescribed oath</tspan><tspan class="k"> or affirmation; or</tspan></text>
<text x="56" y="778" class="r" style="font-weight:700">2.</text>
<text x="78" y="778"><tspan class="h" style="font-weight:700">Knowingly unqualified:</tspan><tspan class="k"> when he/she knows that he/she is</tspan><tspan class="r"> not qualified or that</tspan></text>
<text x="78" y="800"><tspan class="r">he/she is disqualified</tspan><tspan class="k"> for its membership; or</tspan></text>
<text x="56" y="826" class="r" style="font-weight:700">3.</text>
<text x="78" y="826"><tspan class="h" style="font-weight:700">Prohibited by law:</tspan><tspan class="k"> when he/she knows that he/she is</tspan><tspan class="r"> prohibited from sitting or</tspan></text>
<text x="78" y="848"><tspan class="r">voting</tspan><tspan class="k"> in the House by virtue of any law made by the Parliament or the state</tspan></text>
<text x="78" y="870"><tspan class="k">legislature.</tspan></text>
<path d="M50 732 L44 732 L44 876 L50 876" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="898"><tspan class="h" style="font-weight:700">Salaries by state legislature:</tspan><tspan class="k"> The members of a state legislature are entitled to receive</tspan></text>
<text x="56" y="920"><tspan class="k">such</tspan><tspan class="r"> salaries and allowances</tspan><tspan class="k"> as may from time to time be determined by the</tspan><tspan class="r"> state</tspan></text>
<text x="56" y="942"><tspan class="r">legislature</tspan><tspan class="k">.</tspan></text>
<text class="lb" x="40" y="974">4. Vacation of Seats</text>
<text x="44" y="1004"><tspan class="h" style="font-weight:700">Vacation of seats:</tspan><tspan class="k"> In the following cases, a member of the state legislature vacates</tspan></text>
<text x="56" y="1026"><tspan class="k">his/her seat:</tspan></text>
<text x="56" y="1052" class="r" style="font-weight:700">1.</text>
<text x="78" y="1052"><tspan class="h" style="font-weight:700">Double Membership:</tspan><tspan class="k"> A person</tspan><tspan class="r"> cannot be a member of both Houses</tspan><tspan class="k"> of state</tspan></text>
<text x="78" y="1074"><tspan class="k">legislature at one and the same time. If a person is elected to both the Houses,</tspan></text>
<text x="78" y="1096"><tspan class="k">his/her seat in one of the Houses falls vacant as per the provisions of a</tspan><tspan class="b"> law made</tspan></text>
<text x="78" y="1118"><tspan class="b">by the state legislature</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1144" class="r" style="font-weight:700">2.</text>
<text x="78" y="1144"><tspan class="h" style="font-weight:700">Disqualification:</tspan><tspan class="k"> If a member of the state legislature becomes subject to any of</tspan></text>
<text x="78" y="1166"><tspan class="k">the</tspan><tspan class="r"> disqualifications</tspan><tspan class="k">, his/her seat becomes vacant.</tspan></text>
<text x="56" y="1192" class="r" style="font-weight:700">3.</text>
<text x="78" y="1192"><tspan class="h" style="font-weight:700">Resignation:</tspan><tspan class="k"> A member may</tspan><tspan class="r"> resign</tspan><tspan class="k"> from his/her seat by writing to the</tspan><tspan class="b"> Chairman</tspan></text>
<text x="78" y="1214"><tspan class="b">of legislative council or Speaker of legislative assembly</tspan><tspan class="k">, as the case may be. The</tspan></text>
<text x="78" y="1236"><tspan class="k">seat falls vacant when the</tspan><tspan class="r"> resignation is accepted⁷</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1262" class="r" style="font-weight:700">4.</text>
<text x="78" y="1262"><tspan class="h" style="font-weight:700">Absence:</tspan><tspan class="k"> A House of the state legislature can declare the seat of a member vacant</tspan></text>
<text x="78" y="1284"><tspan class="k">if he/she absents himself/herself from all its meeting for a period of</tspan><tspan class="r"> sixty days</tspan></text>
<text x="78" y="1306"><tspan class="r">without its permission</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1332" class="r" style="font-weight:700">5.</text>
<text x="78" y="1332"><tspan class="h" style="font-weight:700">Other Cases:</tspan><tspan class="k"> A member has to vacate his/her seat in the either House of state</tspan></text>
<text x="78" y="1354"><tspan class="k">legislature, 1. if his/her</tspan><tspan class="r"> election is declared void</tspan><tspan class="k"> by the court, 2. if he/she is</tspan></text>
<text x="78" y="1376"><tspan class="r">expelled by the House</tspan><tspan class="k">, 3. if he/she is elected to the office of</tspan><tspan class="r"> president or office of</tspan></text>
<text x="78" y="1398"><tspan class="r">vice-president</tspan><tspan class="k">, and 4. if he/she is appointed to the office of</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state.</tspan></text>
<path d="M50 1032 L44 1032 L44 1404 L50 1404" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1410" width="112" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="96" y="1430" text-anchor="middle"><tspan class="r">double</tspan></text>
<text class="xs" x="96" y="1448" text-anchor="middle"><tspan class="r">membership</tspan></text>
<rect class="bx" x="162" y="1410" width="112" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="218" y="1439" text-anchor="middle"><tspan class="r">disqualification</tspan></text>
<rect class="bx" x="284" y="1410" width="112" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="1439" text-anchor="middle"><tspan class="r">resignation</tspan></text>
<rect class="bx" x="406" y="1410" width="112" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="462" y="1439" text-anchor="middle"><tspan class="r">absence 60 days</tspan></text>
<rect class="bx" x="528" y="1410" width="112" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="584" y="1439" text-anchor="middle"><tspan class="r">other cases</tspan></text>
<text class="xs" x="50" y="1496"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> Kihoto Hollohan vs. Zachillhu (1992).</tspan></text>
<rect x="40" y="1474" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1541"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> However, the Chairman/Speaker need not accept the resignation if he/she is satisfied that it is</tspan></text>
<text class="xs" x="50" y="1559"><tspan class="k">not voluntary or genuine.</tspan></text>
<rect x="40" y="1519" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
