<div id="vis-container"><h2 class="sr-only">Membership – Qualifications and Disqualifications</h2>
<svg class="n" width="100%" viewBox="0 0 680 1811" role="img"><title>Membership – Qualifications and Disqualifications</title><desc>Membership – Qualifications and Disqualifications</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="122" y="26" width="436" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Membership – Qualifications and Disqualifications</text>
<text class="r hd" x="40" y="100">MEMBERSHIP OF STATE LEGISLATURE</text>
<line x1="40" y1="106" x2="330" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="lb" x="40" y="138">1. Qualifications</text>
<text x="44" y="168"><tspan class="h" style="font-weight:700">Constitutional qualifications:</tspan><tspan class="k"> The Constitution lays down the following qualifications for</tspan></text>
<text x="56" y="190"><tspan class="k">a person to be chosen a member of the state legislature.</tspan></text>
<text x="56" y="216" class="r" style="font-weight:700">1.</text>
<text x="78" y="216"><tspan class="h" style="font-weight:700">Citizenship:</tspan><tspan class="k"> He/she must be a</tspan><tspan class="r"> citizen of India</tspan><tspan class="k">.</tspan></text>
<text x="56" y="242" class="r" style="font-weight:700">2.</text>
<text x="78" y="242"><tspan class="h" style="font-weight:700">Oath before ECI-authorised person:</tspan><tspan class="k"> He/she must make and subscribe to an</tspan><tspan class="r"> oath</tspan></text>
<text x="78" y="264"><tspan class="r">or affirmation</tspan><tspan class="k"> before the person authorised by the</tspan><tspan class="r"> Election Commission</tspan><tspan class="k"> for this</tspan></text>
<text x="78" y="286"><tspan class="k">purpose. In his/her oath or affirmation, he/she swears – 1. To bear true faith and</tspan></text>
<text x="78" y="308"><tspan class="k">allegiance to the Constitution of India 2. To uphold the sovereignty and integrity of</tspan></text>
<text x="78" y="330"><tspan class="k">India</tspan></text>
<text x="56" y="356" class="r" style="font-weight:700">3.</text>
<text x="78" y="356"><tspan class="h" style="font-weight:700">Age – 30 / 25:</tspan><tspan class="k"> He/she must be not less than</tspan><tspan class="r"> 30 years</tspan><tspan class="k"> of age in the case of the</tspan></text>
<text x="78" y="378"><tspan class="r">legislative council</tspan><tspan class="k"> and not less than</tspan><tspan class="r"> 25 years</tspan><tspan class="k"> of age in the case of the</tspan><tspan class="r"> legislative</tspan></text>
<text x="78" y="400"><tspan class="r">assembly</tspan><tspan class="k">.</tspan></text>
<text x="56" y="426" class="r" style="font-weight:700">4.</text>
<text x="78" y="426"><tspan class="h" style="font-weight:700">Other qualifications by Parliament:</tspan><tspan class="k"> He/she must possess</tspan><tspan class="r"> other qualifications</tspan></text>
<text x="78" y="448"><tspan class="r">prescribed by Parliament</tspan><tspan class="k">.</tspan></text>
<path d="M50 196 L44 196 L44 454 L50 454" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="476"><tspan class="h" style="font-weight:700">RPA 1951 – additional qualifications:</tspan><tspan class="k"> Accordingly, the Parliament has laid down the</tspan></text>
<text x="56" y="498"><tspan class="k">following additional qualifications in the</tspan><tspan class="r"> Representation of People Act (1951)</tspan><tspan class="k">:</tspan></text>
<text x="56" y="524" class="r" style="font-weight:700">1.</text>
<text x="78" y="524"><tspan class="h" style="font-weight:700">Council – elector + resident:</tspan><tspan class="k"> A person to be elected to the</tspan><tspan class="r"> legislative council</tspan><tspan class="k"> must</tspan></text>
<text x="78" y="546"><tspan class="k">be an</tspan><tspan class="r"> elector for an assembly constituency</tspan><tspan class="k"> in the concerned state and to be</tspan></text>
<text x="78" y="568"><tspan class="k">qualified for the governor’s nomination, he/she must be a</tspan><tspan class="r"> resident in the concerned</tspan></text>
<text x="78" y="590"><tspan class="r">state</tspan><tspan class="k">.</tspan></text>
<text x="56" y="616" class="r" style="font-weight:700">2.</text>
<text x="78" y="616"><tspan class="h" style="font-weight:700">Assembly – elector:</tspan><tspan class="k"> A person to be elected to the</tspan><tspan class="r"> legislative assembly</tspan><tspan class="k"> must be an</tspan></text>
<text x="78" y="638"><tspan class="r">elector for an assembly constituency</tspan><tspan class="k"> in the concerned state.</tspan></text>
<text x="56" y="664" class="r" style="font-weight:700">3.</text>
<text x="78" y="664"><tspan class="h" style="font-weight:700">Reserved seats:</tspan><tspan class="k"> He/she must be a member of a</tspan><tspan class="r"> scheduled caste or scheduled tribe</tspan></text>
<text x="78" y="686"><tspan class="k">if he/she wants to contest a seat reserved for them. However, a member of</tspan></text>
<text x="78" y="708"><tspan class="k">scheduled castes or scheduled tribes</tspan><tspan class="b"> can also contest a seat not reserved</tspan><tspan class="k"> for them.</tspan></text>
<path d="M50 504 L44 504 L44 714 L50 714" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="lb" x="40" y="740">2. Disqualifications</text>
<text x="44" y="770"><tspan class="h" style="font-weight:700">Constitutional disqualifications:</tspan><tspan class="k"> Under the Constitution, a person shall be disqualified</tspan></text>
<text x="56" y="792"><tspan class="k">for being chosen as and for being a member of the legislative assembly or legislative</tspan></text>
<text x="56" y="814"><tspan class="k">council of a state:</tspan></text>
<text x="56" y="840" class="r" style="font-weight:700">1.</text>
<text x="78" y="840"><tspan class="h" style="font-weight:700">Office of profit:</tspan><tspan class="k"> if he/she holds any</tspan><tspan class="r"> office of profit</tspan><tspan class="k"> under the Union or state</tspan></text>
<text x="78" y="862"><tspan class="k">government (</tspan><tspan class="b">except that of a minister or any other office exempted by state</tspan></text>
<text x="78" y="884"><tspan class="b">legislature⁵</tspan><tspan class="k">),</tspan></text>
<text x="56" y="910" class="r" style="font-weight:700">2.</text>
<text x="78" y="910"><tspan class="h" style="font-weight:700">Unsound mind:</tspan><tspan class="k"> if he/she is of</tspan><tspan class="r"> unsound mind</tspan><tspan class="k"> and stands so declared by a court,</tspan></text>
<text x="56" y="936" class="r" style="font-weight:700">3.</text>
<text x="78" y="936"><tspan class="h" style="font-weight:700">Insolvency:</tspan><tspan class="k"> if he/she is an</tspan><tspan class="r"> undischarged insolvent</tspan><tspan class="k">,</tspan></text>
<text x="56" y="962" class="r" style="font-weight:700">4.</text>
<text x="78" y="962"><tspan class="h" style="font-weight:700">Foreign allegiance:</tspan><tspan class="k"> if he/she is</tspan><tspan class="r"> not a citizen of India</tspan><tspan class="k"> or has voluntarily acquired the</tspan></text>
<text x="78" y="984"><tspan class="k">citizenship of a foreign state or is under any acknowledgement of allegiance to a</tspan></text>
<text x="78" y="1006"><tspan class="k">foreign state, and</tspan></text>
<text x="56" y="1032" class="r" style="font-weight:700">5.</text>
<text x="78" y="1032"><tspan class="h" style="font-weight:700">Law of Parliament:</tspan><tspan class="k"> if he/she is so disqualified under</tspan><tspan class="r"> any law made by Parliament</tspan><tspan class="k">.</tspan></text>
<path d="M50 820 L44 820 L44 1038 L50 1038" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1060"><tspan class="h" style="font-weight:700">RPA 1951 – additional disqualifications:</tspan><tspan class="k"> Accordingly, the Parliament has prescribed a</tspan></text>
<text x="56" y="1082"><tspan class="k">number of additional disqualifications in the</tspan><tspan class="r"> Representation of People Act (1951)</tspan><tspan class="k">. These</tspan></text>
<text x="56" y="1104"><tspan class="k">are</tspan><tspan class="b"> similar to those for Parliament</tspan><tspan class="k">. These are mentioned here:</tspan></text>
<text x="56" y="1130" class="r" style="font-weight:700">1.</text>
<text x="78" y="1130"><tspan class="h" style="font-weight:700">Electoral offences:</tspan><tspan class="k"> He/she must not have been found guilty of certain</tspan><tspan class="r"> electoral</tspan></text>
<text x="78" y="1152"><tspan class="r">offences or corrupt practices</tspan><tspan class="k"> in the elections.</tspan></text>
<text x="56" y="1178" class="r" style="font-weight:700">2.</text>
<text x="78" y="1178"><tspan class="h" style="font-weight:700">Conviction – 2 years:</tspan><tspan class="k"> He/she must not have been</tspan><tspan class="r"> convicted for any offence</tspan></text>
<text x="78" y="1200"><tspan class="r">resulting in imprisonment for two or more years</tspan><tspan class="k">. But, the detention of a person</tspan></text>
<text x="78" y="1222"><tspan class="k">under a</tspan><tspan class="b"> preventive detention law is not a disqualification</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1248" class="r" style="font-weight:700">3.</text>
<text x="78" y="1248"><tspan class="h" style="font-weight:700">Election expenses:</tspan><tspan class="k"> He/she must not have failed to</tspan><tspan class="r"> lodge an account of his/her</tspan></text>
<text x="78" y="1270"><tspan class="r">election expenses</tspan><tspan class="k"> within the time.</tspan></text>
<text x="56" y="1296" class="r" style="font-weight:700">4.</text>
<text x="78" y="1296"><tspan class="h" style="font-weight:700">Government contracts:</tspan><tspan class="k"> He/she must not have any</tspan><tspan class="r"> interest in government</tspan></text>
<text x="78" y="1318"><tspan class="r">contracts</tspan><tspan class="k">, works or services.</tspan></text>
<text x="56" y="1344" class="r" style="font-weight:700">5.</text>
<text x="78" y="1344"><tspan class="h" style="font-weight:700">Government corporations – 25%:</tspan><tspan class="k"> He/she must not be a director or managing</tspan></text>
<text x="78" y="1366"><tspan class="k">agent nor hold an office of profit in a corporation in which the government has</tspan><tspan class="r"> at</tspan></text>
<text x="78" y="1388"><tspan class="r">least 25 per cent share</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1414" class="r" style="font-weight:700">6.</text>
<text x="78" y="1414"><tspan class="h" style="font-weight:700">Dismissal for corruption:</tspan><tspan class="k"> He/she must not have been</tspan><tspan class="r"> dismissed from government</tspan></text>
<text x="78" y="1436"><tspan class="r">service for corruption or disloyalty</tspan><tspan class="k"> to the state.</tspan></text>
<text x="56" y="1462" class="r" style="font-weight:700">7.</text>
<text x="78" y="1462"><tspan class="h" style="font-weight:700">Enmity / bribery:</tspan><tspan class="k"> He/she must not have been convicted for</tspan><tspan class="r"> promoting enmity</tspan></text>
<text x="78" y="1484"><tspan class="r">between different groups</tspan><tspan class="k"> or for the offence of</tspan><tspan class="r"> bribery</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1510" class="r" style="font-weight:700">8.</text>
<text x="78" y="1510"><tspan class="h" style="font-weight:700">Social crimes:</tspan><tspan class="k"> He/she must not have been punished for preaching and practicing</tspan></text>
<text x="78" y="1532"><tspan class="r">social crimes</tspan><tspan class="k"> such as</tspan><tspan class="b"> untouchability, dowry and sati</tspan><tspan class="k">.</tspan></text>
<path d="M50 1110 L44 1110 L44 1538 L50 1538" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1560"><tspan class="h" style="font-weight:700">Governor decides – on ECI opinion:</tspan><tspan class="k"> On the question whether a member has become</tspan></text>
<text x="56" y="1582"><tspan class="k">subject to any of the above disqualifications, the</tspan><tspan class="r"> governor’s decision is final</tspan><tspan class="k">. However,</tspan></text>
<text x="56" y="1604"><tspan class="k">he/she should obtain the</tspan><tspan class="r"> opinion of the Election Commission</tspan><tspan class="k"> and act accordingly.</tspan></text>
<rect class="bx" x="136" y="1616" width="168" height="30" rx="3"/>
<text class="sm" x="220" y="1635" text-anchor="middle"><tspan class="k">disqualification question</tspan></text>
<line class="ln" x1="307" y1="1631" x2="327" y2="1631" marker-end="url(#ah)"/>
<rect class="bx" x="330" y="1616" width="214" height="30" rx="3"/>
<text class="sm" x="437" y="1635" text-anchor="middle"><tspan class="k">opinion of</tspan><tspan class="r"> Election Commission</tspan></text>
<line class="ln" x1="340" y1="1647" x2="340" y2="1668" marker-end="url(#ah)"/>
<rect class="bx" x="255" y="1670" width="170" height="30" rx="3"/>
<text class="sm" x="340" y="1689" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor decides (final)</tspan></text>
<text class="xs" x="50" y="1736"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> A minister in the union or state government is not considered as holding an office of profit. Also,</tspan></text>
<text class="xs" x="50" y="1754"><tspan class="k">the state legislature can declare that a particular office of profit will not disqualify its holder from</tspan></text>
<text class="xs" x="50" y="1772"><tspan class="k">its membership.</tspan></text>
<rect x="40" y="1714" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
