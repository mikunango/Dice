<div id="vis-container"><h2 class="sr-only">Privileges of State Legislature</h2>
<svg class="n" width="100%" viewBox="0 0 680 1846" role="img"><title>Privileges of State Legislature</title><desc>Privileges of State Legislature</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="197" y="26" width="287" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Privileges of State Legislature</text>
<text class="r hd" x="40" y="100">PRIVILEGES OF STATE LEGISLATURE</text>
<line x1="40" y1="106" x2="316" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Meaning of privileges:</tspan><tspan class="r"> Privileges</tspan><tspan class="k"> of a state legislature are a sum of</tspan><tspan class="r"> special rights,</tspan></text>
<text x="56" y="156"><tspan class="r">immunities and exemptions</tspan><tspan class="k"> enjoyed by the Houses of state legislature, their committees</tspan></text>
<text x="56" y="178"><tspan class="k">and their members. They are necessary in order to secure the</tspan><tspan class="b"> independence and</tspan></text>
<text x="56" y="200"><tspan class="b">effectiveness</tspan><tspan class="k"> of their actions. Without these privileges, the Houses can neither maintain</tspan></text>
<text x="56" y="222"><tspan class="k">their</tspan><tspan class="b"> authority, dignity and honour</tspan><tspan class="k"> nor can protect their members from any obstruction</tspan></text>
<text x="56" y="244"><tspan class="k">in the discharge of their legislative responsibilities.</tspan></text>
<text x="44" y="272"><tspan class="h" style="font-weight:700">Extended to AG and ministers:</tspan><tspan class="k"> The Constitution has also extended the privileges of the</tspan></text>
<text x="56" y="294"><tspan class="k">state legislature to those persons who are entitled to speak and take part in the</tspan></text>
<text x="56" y="316"><tspan class="k">proceedings of a House of the state legislature or any of its committees. These include</tspan></text>
<text x="56" y="338"><tspan class="r">advocate-general of the state and state ministers</tspan><tspan class="k">.</tspan></text>
<text x="44" y="366"><tspan class="h" style="font-weight:700">Not to Governor:</tspan><tspan class="k"> It must be clarified here that the privileges of the state legislature</tspan><tspan class="r"> do</tspan></text>
<text x="56" y="388"><tspan class="r">not extend to the governor</tspan><tspan class="k"> who is also an integral part of the state legislature.</tspan></text>
<text x="44" y="416"><tspan class="h" style="font-weight:700">Two categories:</tspan><tspan class="k"> The privileges of a state legislature can be classified into two broad</tspan></text>
<text x="56" y="438"><tspan class="k">categories—those that are enjoyed by each House of the state legislature</tspan><tspan class="r"> collectively</tspan><tspan class="k">,</tspan></text>
<text x="56" y="460"><tspan class="k">and those that are enjoyed by the members</tspan><tspan class="r"> individually</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="466" x2="340" y2="478"/>
<line class="ln" x1="190" y1="478" x2="490" y2="478"/>
<line class="ln" x1="190" y1="478" x2="190" y2="494" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="478" x2="490" y2="494" marker-end="url(#ah)"/>
<text class="sm" x="190" y="514" text-anchor="middle"><tspan class="r" style="font-weight:700">Collective privileges</tspan></text>
<text class="sm" x="490" y="514" text-anchor="middle"><tspan class="r" style="font-weight:700">Individual privileges</tspan></text>
<text class="sh" x="40" y="546"><tspan class="r" style="font-weight:700">Collective Privileges</tspan></text>
<text x="44" y="576"><tspan class="h" style="font-weight:700">House privileges:</tspan><tspan class="k"> The privileges belonging to each House of the state legislature</tspan></text>
<text x="56" y="598"><tspan class="k">collectively are:</tspan></text>
<text x="56" y="624" class="r" style="font-weight:700">1.</text>
<text x="78" y="624"><tspan class="h" style="font-weight:700">Publication:</tspan><tspan class="k"> It has the right to</tspan><tspan class="r"> publish its reports, debates and proceedings</tspan><tspan class="k"> and</tspan></text>
<text x="78" y="646"><tspan class="k">also the right to prohibit others from publishing the same¹⁰.</tspan></text>
<text x="56" y="672" class="r" style="font-weight:700">2.</text>
<text x="78" y="672"><tspan class="h" style="font-weight:700">Secret sittings:</tspan><tspan class="k"> It can</tspan><tspan class="r"> exclude strangers</tspan><tspan class="k"> from its proceedings and hold</tspan><tspan class="r"> secret</tspan></text>
<text x="78" y="694"><tspan class="r">sittings</tspan><tspan class="k"> to discuss some important matters.</tspan></text>
<text x="56" y="720" class="r" style="font-weight:700">3.</text>
<text x="78" y="720"><tspan class="h" style="font-weight:700">Own procedure:</tspan><tspan class="k"> It can make</tspan><tspan class="r"> rules to regulate its own procedure</tspan><tspan class="k"> and the conduct of</tspan></text>
<text x="78" y="742"><tspan class="k">its business and to adjudicate upon such matters.</tspan></text>
<text x="56" y="768" class="r" style="font-weight:700">4.</text>
<text x="78" y="768"><tspan class="h" style="font-weight:700">Punish for contempt:</tspan><tspan class="k"> It can</tspan><tspan class="r"> punish members as well as outsiders</tspan><tspan class="k"> for breach of its</tspan></text>
<text x="78" y="790"><tspan class="k">privileges or its contempt by</tspan><tspan class="b"> reprimand, admonition or imprisonment</tspan><tspan class="k"> (also</tspan></text>
<text x="78" y="812"><tspan class="k">suspension or expulsion, in case of members).</tspan></text>
<text x="56" y="838" class="r" style="font-weight:700">5.</text>
<text x="78" y="838"><tspan class="h" style="font-weight:700">Information on arrest:</tspan><tspan class="k"> It has the right to receive</tspan><tspan class="r"> immediate information of the</tspan></text>
<text x="78" y="860"><tspan class="r">arrest</tspan><tspan class="k">, detention, conviction, imprisonment and release of a member.</tspan></text>
<text x="56" y="886" class="r" style="font-weight:700">6.</text>
<text x="78" y="886"><tspan class="h" style="font-weight:700">Inquiries:</tspan><tspan class="k"> It can</tspan><tspan class="r"> institute inquiries</tspan><tspan class="k"> and order the attendance of witnesses and send</tspan></text>
<text x="78" y="908"><tspan class="k">for relevant papers and records.</tspan></text>
<text x="56" y="934" class="r" style="font-weight:700">7.</text>
<text x="78" y="934"><tspan class="h" style="font-weight:700">No court inquiry:</tspan><tspan class="k"> The</tspan><tspan class="r"> courts are prohibited to inquire</tspan><tspan class="k"> into the proceedings of a</tspan></text>
<text x="78" y="956"><tspan class="k">House or its Committees.</tspan></text>
<text x="56" y="982" class="r" style="font-weight:700">8.</text>
<text x="78" y="982"><tspan class="h" style="font-weight:700">No arrest in precincts:</tspan><tspan class="k"> No person (either a member or outsider) can be arrested,</tspan></text>
<text x="78" y="1004"><tspan class="k">and no legal process (civil or criminal) can be served</tspan><tspan class="r"> within the precincts of the</tspan></text>
<text x="78" y="1026"><tspan class="r">House</tspan><tspan class="k"> without the permission of the presiding officer.</tspan></text>
<path d="M50 604 L44 604 L44 1032 L50 1032" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1054"><tspan class="r" style="font-weight:700">Individual Privileges</tspan></text>
<text x="44" y="1084"><tspan class="h" style="font-weight:700">Members’ privileges:</tspan><tspan class="k"> The privileges belonging to the members individually are:</tspan></text>
<text x="56" y="1110" class="r" style="font-weight:700">1.</text>
<text x="78" y="1110"><tspan class="h" style="font-weight:700">Freedom from arrest – civil cases:</tspan><tspan class="k"> They</tspan><tspan class="r"> cannot be arrested during the session</tspan><tspan class="k"> of</tspan></text>
<text x="78" y="1132"><tspan class="k">the state legislature and</tspan><tspan class="r"> 40 days before</tspan><tspan class="k"> the beginning and</tspan><tspan class="r"> 40 days after</tspan><tspan class="k"> the end</tspan></text>
<text x="78" y="1154"><tspan class="k">of such session. This privilege is available</tspan><tspan class="r"> only in civil cases</tspan><tspan class="k"> and not in criminal</tspan></text>
<text x="78" y="1176"><tspan class="k">cases or preventive detention cases.</tspan></text>
<text x="56" y="1202" class="r" style="font-weight:700">2.</text>
<text x="78" y="1202"><tspan class="h" style="font-weight:700">Freedom of speech:</tspan><tspan class="k"> They have</tspan><tspan class="r"> freedom of speech</tspan><tspan class="k"> in the state legislature. No</tspan></text>
<text x="78" y="1224"><tspan class="k">member is liable to any proceedings in any court for anything said or any vote</tspan></text>
<text x="78" y="1246"><tspan class="k">given by him/her in the state legislature or its committees. This freedom is subject</tspan></text>
<text x="78" y="1268"><tspan class="k">to the provisions of the Constitution and to the rules and standing orders regulating</tspan></text>
<text x="78" y="1290"><tspan class="k">the procedure of the state legislature¹¹.</tspan></text>
<text x="56" y="1316" class="r" style="font-weight:700">3.</text>
<text x="78" y="1316"><tspan class="h" style="font-weight:700">Jury &amp; witness exemption:</tspan><tspan class="k"> They are</tspan><tspan class="r"> exempted from jury service</tspan><tspan class="k">. They can refuse</tspan></text>
<text x="78" y="1338"><tspan class="k">to give evidence and appear as a witness in a case pending in a court when the</tspan></text>
<text x="78" y="1360"><tspan class="k">state legislature is in session.</tspan></text>
<path d="M50 1090 L44 1090 L44 1366 L50 1366" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line x1="98" y1="1418" x2="259" y2="1418" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="179" y="1411" text-anchor="middle"><tspan class="r">no arrest</tspan></text>
<line x1="259" y1="1418" x2="421" y2="1418" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="340" y="1411" text-anchor="middle"><tspan class="k">session –</tspan><tspan class="r"> no arrest</tspan></text>
<line x1="421" y1="1418" x2="582" y2="1418" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="501" y="1411" text-anchor="middle"><tspan class="r">no arrest</tspan></text>
<circle cx="98" cy="1418" r="5" fill="#2F6FDB"/>
<text class="xs" x="98" y="1440" text-anchor="middle"><tspan class="k">40 days before</tspan></text>
<circle cx="259" cy="1418" r="5" fill="#2F6FDB"/>
<text class="xs" x="259" y="1440" text-anchor="middle"><tspan class="k">session begins</tspan></text>
<circle cx="421" cy="1418" r="5" fill="#2F6FDB"/>
<text class="xs" x="421" y="1440" text-anchor="middle"><tspan class="k">session ends</tspan></text>
<circle cx="582" cy="1418" r="5" fill="#2F6FDB"/>
<text class="xs" x="582" y="1440" text-anchor="middle"><tspan class="k">40 days after</tspan></text>
<text class="xs" x="340" y="1469" text-anchor="middle"><tspan class="b">freedom from arrest of members – only in civil cases, not criminal or preventive detention</tspan></text>
<text class="xs" x="50" y="1510"><tspan class="r" style="font-weight:700">10</tspan><tspan class="k"> The 44th Amendment Act of 1978 restored the freedom of the press to publish true reports of</tspan></text>
<text class="xs" x="50" y="1528"><tspan class="k">state legislature without its prior permission. But, this is not applicable in the case of a secret</tspan></text>
<text class="xs" x="50" y="1546"><tspan class="k">sitting of the House.</tspan></text>
<rect x="40" y="1488" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1591"><tspan class="r" style="font-weight:700">11</tspan><tspan class="k"> Article 211 of the Constitution says that no discussion shall take place in the legislature of a</tspan></text>
<text class="xs" x="50" y="1609"><tspan class="k">state with respect to the conduct of any judge of the Supreme Court or of a high court in the</tspan></text>
<text class="xs" x="50" y="1627"><tspan class="k">discharge of his/her duties. Under the rules of a House(s) of the state legislature, use of</tspan></text>
<text class="xs" x="50" y="1645"><tspan class="k">unparliamentary language or unparliamentary conduct of a member is prohibited.</tspan></text>
<rect x="40" y="1569" width="600" height="85" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1690"><tspan class="r" style="font-weight:700">12</tspan><tspan class="k"> The Andhra Pradesh Reorganisation (Amendment) Act, 2015, increased the number of seats in</tspan></text>
<text class="xs" x="50" y="1708"><tspan class="k">the Legislative Council of Andhra Pradesh from 50 to 58.</tspan></text>
<rect x="40" y="1668" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1753"><tspan class="r" style="font-weight:700">13</tspan><tspan class="k"> Under the Jammu and Kashmir Reorganisation Act, 2019, the total number of seats fixed for the</tspan></text>
<text class="xs" x="50" y="1771"><tspan class="k">Legislative Assembly of the Union territory of Jammu and Kashmir is 107. But, 24 seats fall in the</tspan></text>
<text class="xs" x="50" y="1789"><tspan class="k">Pakistan-occupied-Kashmir (PoK). These seats are vacant and are not to be taken into account for</tspan></text>
<text class="xs" x="50" y="1807"><tspan class="k">reckoning the total membership of the Assembly.</tspan></text>
<rect x="40" y="1731" width="600" height="85" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
