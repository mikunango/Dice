<title>Position of Legislative Council</title>

<div id="vis-container"><h2 class="sr-only">Position of Legislative Council</h2>
<svg class="n" width="100%" viewBox="0 0 680 1873" role="img"><title>Position of Legislative Council</title><desc>Position of Legislative Council</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="197" y="26" width="286" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Position of Legislative Council</text>
<text class="r hd" x="40" y="100">POSITION OF LEGISLATIVE COUNCIL</text>
<line x1="40" y1="106" x2="313" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Two angles:</tspan><tspan class="k"> The constitutional position of the council (as compared with the assembly)</tspan></text>
<text x="56" y="156"><tspan class="k">can be studied from two angles:</tspan></text>
<text x="56" y="182" class="r" style="font-weight:700">A.</text>
<text x="79" y="182"><tspan class="k">Spheres where council is equal to assembly.</tspan></text>
<text x="56" y="208" class="r" style="font-weight:700">B.</text>
<text x="79" y="208"><tspan class="k">Spheres where council is unequal to assembly.</tspan></text>
<path d="M50 162 L44 162 L44 214 L50 214" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="236"><tspan class="r" style="font-weight:700">Equal with Assembly</tspan></text>
<text x="44" y="266"><tspan class="h" style="font-weight:700">Spheres of equality:</tspan><tspan class="k"> In the following matters, the powers and status of the council are</tspan></text>
<text x="56" y="288"><tspan class="r">broadly equal</tspan><tspan class="k"> to that of the assembly:</tspan></text>
<text x="56" y="314" class="r" style="font-weight:700">1.</text>
<text x="78" y="314"><tspan class="h" style="font-weight:700">Ordinary bills:</tspan><tspan class="k"> Introduction and passage of</tspan><tspan class="r"> ordinary bills</tspan><tspan class="k">. However, in case of</tspan></text>
<text x="78" y="336"><tspan class="k">disagreement between the two Houses, the</tspan><tspan class="b"> will of the assembly prevails</tspan><tspan class="k"> over that</tspan></text>
<text x="78" y="358"><tspan class="k">of the council.</tspan></text>
<text x="56" y="384" class="r" style="font-weight:700">2.</text>
<text x="78" y="384"><tspan class="h" style="font-weight:700">Ordinances:</tspan><tspan class="k"> Approval of</tspan><tspan class="r"> ordinances</tspan><tspan class="k"> issued by the governor.</tspan></text>
<text x="56" y="410" class="r" style="font-weight:700">3.</text>
<text x="78" y="410"><tspan class="h" style="font-weight:700">Selection of ministers:</tspan><tspan class="k"> Selection of</tspan><tspan class="r"> ministers including the chief minister</tspan><tspan class="k">. Under</tspan></text>
<text x="78" y="432"><tspan class="k">the Constitution the, ministers including the chief minister can be members of</tspan></text>
<text x="78" y="454"><tspan class="k">either House of the state legislature. However, irrespective of their membership,</tspan></text>
<text x="78" y="476"><tspan class="k">they are</tspan><tspan class="b"> responsible only to the assembly</tspan><tspan class="k">.</tspan></text>
<text x="56" y="502" class="r" style="font-weight:700">4.</text>
<text x="78" y="502"><tspan class="h" style="font-weight:700">Reports of constitutional bodies:</tspan><tspan class="k"> Consideration of the</tspan><tspan class="r"> reports of the constitutional</tspan></text>
<text x="78" y="524"><tspan class="r">bodies</tspan><tspan class="k"> like State Finance Commission, state public service commission and</tspan></text>
<text x="78" y="546"><tspan class="k">Comptroller and Auditor General of India.</tspan></text>
<text x="56" y="572" class="r" style="font-weight:700">5.</text>
<text x="78" y="572"><tspan class="h" style="font-weight:700">SPSC jurisdiction:</tspan><tspan class="k"> Enlargement of the</tspan><tspan class="r"> jurisdiction of the state public service</tspan></text>
<text x="78" y="594"><tspan class="r">commission</tspan><tspan class="k">.</tspan></text>
<path d="M50 294 L44 294 L44 600 L50 600" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="622"><tspan class="r" style="font-weight:700">Unequal with Assembly</tspan></text>
<text x="44" y="652"><tspan class="h" style="font-weight:700">Spheres of inequality:</tspan><tspan class="k"> In the following matters, the powers and status of the council</tspan></text>
<text x="56" y="674"><tspan class="k">are</tspan><tspan class="r"> unequal</tspan><tspan class="k"> to that of the assembly:</tspan></text>
<text x="56" y="700" class="r" style="font-weight:700">1.</text>
<text x="82" y="700"><tspan class="h" style="font-weight:700">Money Bill – assembly only:</tspan><tspan class="k"> A</tspan><tspan class="r"> Money Bill</tspan><tspan class="k"> can be introduced</tspan><tspan class="r"> only in the assembly</tspan></text>
<text x="82" y="722"><tspan class="k">and not in the council.</tspan></text>
<text x="56" y="748" class="r" style="font-weight:700">2.</text>
<text x="82" y="748"><tspan class="h" style="font-weight:700">No rejection of money bill:</tspan><tspan class="k"> The council</tspan><tspan class="r"> cannot amend or reject a money bill</tspan><tspan class="k">. It</tspan></text>
<text x="82" y="770"><tspan class="k">should return the bill to the assembly within</tspan><tspan class="r"> 14 days</tspan><tspan class="k">, either with recommendations</tspan></text>
<text x="82" y="792"><tspan class="k">or without recommendations.</tspan></text>
<text x="56" y="818" class="r" style="font-weight:700">3.</text>
<text x="82" y="818"><tspan class="h" style="font-weight:700">Assembly decides recommendations:</tspan><tspan class="k"> The assembly can either</tspan><tspan class="r"> accept or reject</tspan><tspan class="k"> all</tspan></text>
<text x="82" y="840"><tspan class="k">or any of the recommendation of the council. In both the cases, the money bill is</tspan></text>
<text x="82" y="862"><tspan class="k">deemed to have been passed by the two Houses.</tspan></text>
<text x="56" y="888" class="r" style="font-weight:700">4.</text>
<text x="82" y="888"><tspan class="h" style="font-weight:700">Speaker certifies money bill:</tspan><tspan class="k"> The final power to decide whether a particular bill is</tspan></text>
<text x="82" y="910"><tspan class="k">a money bill or not is vested in the</tspan><tspan class="r"> Speaker of the assembly</tspan><tspan class="k">.</tspan></text>
<text x="56" y="936" class="r" style="font-weight:700">5.</text>
<text x="82" y="936"><tspan class="h" style="font-weight:700">Dilatory chamber:</tspan><tspan class="k"> The final power of passing an ordinary bill also lies with the</tspan></text>
<text x="82" y="958"><tspan class="r">assembly</tspan><tspan class="k">. At the most, the council can</tspan><tspan class="r"> detain or delay the bill for the period of</tspan></text>
<text x="82" y="980"><tspan class="r">four months</tspan><tspan class="k">—three months in the first instance and one month in the second</tspan></text>
<text x="82" y="1002"><tspan class="k">instance. In other words, the council is</tspan><tspan class="r"> not even a revising body</tspan><tspan class="k"> like the Rajya</tspan></text>
<text x="82" y="1024"><tspan class="k">Sabha; it is only a</tspan><tspan class="r"> dilatory chamber or an advisory body</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1050" class="r" style="font-weight:700">6.</text>
<text x="82" y="1050"><tspan class="h" style="font-weight:700">Budget – no vote on grants:</tspan><tspan class="k"> The council can only</tspan><tspan class="r"> discuss the budget</tspan><tspan class="k"> but</tspan><tspan class="r"> cannot</tspan></text>
<text x="82" y="1072"><tspan class="r">vote on the demands for grants</tspan><tspan class="k"> (which is the exclusive privilege of the assembly).</tspan></text>
<text x="56" y="1098" class="r" style="font-weight:700">7.</text>
<text x="82" y="1098"><tspan class="h" style="font-weight:700">No no-confidence motion:</tspan><tspan class="k"> The council</tspan><tspan class="r"> cannot remove the council of ministers</tspan><tspan class="k"> by</tspan></text>
<text x="82" y="1120"><tspan class="k">passing a no-confidence motion. This is because, the council of ministers is</tspan></text>
<text x="82" y="1142"><tspan class="b">collectively responsible only to the assembly</tspan><tspan class="k">. But, the council can discus and</tspan></text>
<text x="82" y="1164"><tspan class="k">criticise the policies and activities of the Government.</tspan></text>
<text x="56" y="1190" class="r" style="font-weight:700">8.</text>
<text x="82" y="1190"><tspan class="h" style="font-weight:700">Council bills can die:</tspan><tspan class="k"> When an ordinary bill, which has originated in the council</tspan></text>
<text x="82" y="1212"><tspan class="k">and was sent to the assembly, is</tspan><tspan class="r"> rejected by the assembly, the bill ends</tspan><tspan class="k"> and</tspan></text>
<text x="82" y="1234"><tspan class="k">becomes dead.</tspan></text>
<text x="56" y="1260" class="r" style="font-weight:700">9.</text>
<text x="82" y="1260"><tspan class="h" style="font-weight:700">No role in Presidential / RS elections:</tspan><tspan class="k"> The council does</tspan><tspan class="r"> not participate in the</tspan></text>
<text x="82" y="1282"><tspan class="r">election of the president</tspan><tspan class="k"> of India and</tspan><tspan class="r"> representatives of the state in the Rajya</tspan></text>
<text x="82" y="1304"><tspan class="r">Sabha</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1330" class="r" style="font-weight:700">10.</text>
<text x="82" y="1330"><tspan class="h" style="font-weight:700">Constitutional amendments:</tspan><tspan class="k"> The council has</tspan><tspan class="r"> no effective say in the ratification of</tspan></text>
<text x="82" y="1352"><tspan class="r">a constitutional amendment bill</tspan><tspan class="k">. In this respect also, the will of the assembly</tspan></text>
<text x="82" y="1374"><tspan class="k">prevails over that of the council⁹.</tspan></text>
<text x="56" y="1400" class="r" style="font-weight:700">11.</text>
<text x="82" y="1400"><tspan class="h" style="font-weight:700">Existence depends on assembly:</tspan><tspan class="k"> Finally, the</tspan><tspan class="r"> very existence of the council depends</tspan></text>
<text x="82" y="1422"><tspan class="r">on the will of the assembly</tspan><tspan class="k">. The council can be abolished by the Parliament on the</tspan></text>
<text x="82" y="1444"><tspan class="k">recommendation of the assembly.</tspan></text>
<path d="M50 680 L44 680 L44 1450 L50 1450" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1472"><tspan class="h" style="font-weight:700">Subordinate to assembly:</tspan><tspan class="k"> From the above, it is clear that the position of the council</tspan></text>
<text x="56" y="1494"><tspan class="k">vis-a-vis the assembly is</tspan><tspan class="r"> much weaker</tspan><tspan class="k"> than the position of the Rajya Sabha vis-a-vis</tspan></text>
<text x="56" y="1516"><tspan class="k">the Lok Sabha. The Rajya Sabha has</tspan><tspan class="b"> equal powers with the Lok Sabha in all spheres</tspan></text>
<text x="56" y="1538"><tspan class="b">except financial matters and with regard to the control over the Government</tspan><tspan class="k">. On the</tspan></text>
<text x="56" y="1560"><tspan class="k">other hand, the council is</tspan><tspan class="r"> subordinate to the assembly in all respects</tspan><tspan class="k">. Thus, the</tspan></text>
<text x="56" y="1582"><tspan class="r">predominance of the assembly</tspan><tspan class="k"> over the council is fully established.</tspan></text>
<rect class="bx" x="46" y="1596" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1614" text-anchor="middle"><tspan class="r" style="font-weight:700">Rajya Sabha vs Lok Sabha</tspan></text>
<line class="ln" x1="190" y1="1624" x2="190" y2="1638" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1659" text-anchor="middle"><tspan class="k">equal except finance</tspan></text>
<text class="sm" x="190" y="1681" text-anchor="middle"><tspan class="k">and control over Govt</tspan></text>
<rect class="bx" x="346" y="1596" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1614" text-anchor="middle"><tspan class="r" style="font-weight:700">Council vs Assembly</tspan></text>
<line class="ln" x1="490" y1="1624" x2="490" y2="1638" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1659" text-anchor="middle"><tspan class="r">subordinate in all respects</tspan></text>
<line x1="340" y1="1596" x2="340" y2="1684" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1726"><tspan class="r" style="font-weight:700">9</tspan><tspan class="k"> The position, in this regard, is very well analysed by J.C. Johari in the following way: ‘The</tspan></text>
<text class="xs" x="50" y="1744"><tspan class="k">Constitution is not clear on this point whether a bill of constitutional amendment referred to the</tspan></text>
<text class="xs" x="50" y="1762"><tspan class="k">states for ratification by their legislatures shall include the Vidhan Parishad or not. In practice, it</tspan></text>
<text class="xs" x="50" y="1780"><tspan class="k">may be understood that the will of the Vidhan Sabha has to prevail. In case the Vidhan Parishad</tspan></text>
<text class="xs" x="50" y="1798"><tspan class="k">concurs with the view of the Vidhan Sabha, it is all right; in case it differs, the Vidhan Sabha may</tspan></text>
<text class="xs" x="50" y="1816"><tspan class="k">pass it again and thereby ignore the will of the Vidhan Parishad as it can do in case of a</tspan></text>
<text class="xs" x="50" y="1834"><tspan class="k">non-money bill’. (Indian Government and Politics, Vishal, Thirteenth Edition, 2001, p. 441).</tspan></text>
<rect x="40" y="1704" width="600" height="139" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
