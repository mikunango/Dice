<div id="vis-container"><h2 class="sr-only">NCRWC – Areas of Concern II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1136" role="img"><title>NCRWC – Areas of Concern II</title><desc>NCRWC – Areas of Concern II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC – Areas of Concern II</text>
<text x="56" y="92" class="r" style="font-weight:700">10.</text>
<text x="83" y="92"><tspan class="h" style="font-weight:700">Debt-trap &amp; parallel economy:</tspan><tspan class="k"> The state of the</tspan><tspan class="r"> Indian economy is disturbing</tspan><tspan class="k">.</tspan></text>
<text x="83" y="114"><tspan class="k">The economy is gradually sinking into a</tspan><tspan class="r"> debt-trap</tspan><tspan class="k">. Economic, fiscal and monetary</tspan></text>
<text x="83" y="136"><tspan class="k">policies, coupled with administrative inefficiency, corruption and wasteful</tspan></text>
<text x="83" y="158"><tspan class="k">expenditure are increasingly pushing the society into</tspan><tspan class="b"> extra-legal systems,</tspan></text>
<text x="83" y="180"><tspan class="b">crime-syndicates, mob-rule and hoodlum out-fits</tspan><tspan class="k">.</tspan><tspan class="r"> Black-money, parallel economy</tspan></text>
<text x="83" y="202"><tspan class="r">and even parallel governments</tspan><tspan class="k"> are the overarching economic and social realities.</tspan></text>
<text x="83" y="224"><tspan class="k">Legitimate governments will, in due course, find it increasingly difficult to confront</tspan></text>
<text x="83" y="246"><tspan class="k">them. In course of time these illegal criminal out-fits will dictate terms to the</tspan></text>
<text x="83" y="268"><tspan class="k">legitimate governments.</tspan></text>
<text x="56" y="294" class="r" style="font-weight:700">11.</text>
<text x="83" y="294"><tspan class="h" style="font-weight:700">Urbanisation &amp; unemployment:</tspan><tspan class="r"> Rural de-population, urbanization,</tspan></text>
<text x="83" y="316"><tspan class="r">urban-congestion and social unrest</tspan><tspan class="k"> need immediate attention and solutions.</tspan></text>
<text x="83" y="338"><tspan class="k">Increasing</tspan><tspan class="r"> unemployment</tspan><tspan class="k"> will prove a serious threat to orderly government.</tspan></text>
<text x="56" y="364" class="r" style="font-weight:700">12.</text>
<text x="83" y="364"><tspan class="h" style="font-weight:700">Educational disarmament:</tspan><tspan class="k"> Future of society is increasingly</tspan><tspan class="r"> knowledge-based and</tspan></text>
<text x="83" y="386"><tspan class="r">knowledge-driven</tspan><tspan class="k">. The quality of</tspan><tspan class="r"> education and the higher research</tspan><tspan class="k"> need urgent</tspan></text>
<text x="83" y="408"><tspan class="k">repair. The country is engaged in a</tspan><tspan class="r"> unilateral and unthinking educational</tspan></text>
<text x="83" y="430"><tspan class="r">disarmament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="456" class="r" style="font-weight:700">13.</text>
<text x="83" y="456"><tspan class="h" style="font-weight:700">Justice delivery:</tspan><tspan class="k"> System of</tspan><tspan class="r"> administration of justice</tspan><tspan class="k"> in the country is another area</tspan></text>
<text x="83" y="478"><tspan class="k">of concern.</tspan></text>
<text x="56" y="504" class="r" style="font-weight:700">14.</text>
<text x="83" y="504"><tspan class="h" style="font-weight:700">Criminal justice collapse:</tspan><tspan class="r"> Criminal justice system is on the verge of collapse</tspan><tspan class="k">. The</tspan></text>
<text x="83" y="526"><tspan class="k">quality of investigations and prosecutions requires a strong second look.</tspan><tspan class="r"> Law’s delay</tspan></text>
<text x="83" y="548"><tspan class="r">and costs of litigation</tspan><tspan class="k"> have become proverbial.</tspan><tspan class="b"> Victimology, victim-protection and</tspan></text>
<text x="83" y="570"><tspan class="b">protection of witnesses</tspan><tspan class="k"> in sensitive criminal-trials need institutional arrangements.</tspan></text>
<text x="83" y="592"><tspan class="k">Recruitment, training, refresher and continuing legal education for lawyers, judges</tspan></text>
<text x="83" y="614"><tspan class="k">and judicial administrators need immediate attention. The increasing utilization of</tspan></text>
<text x="83" y="636"><tspan class="r">alternative dispute resolution</tspan><tspan class="k"> mechanisms such as</tspan><tspan class="b"> mediation, conciliation and</tspan></text>
<text x="83" y="658"><tspan class="b">arbitration</tspan><tspan class="k"> as well as mechanisms of auxiliary adjudicative services need to be</tspan></text>
<text x="83" y="680"><tspan class="k">stressed.</tspan></text>
<text x="56" y="706" class="r" style="font-weight:700">15.</text>
<text x="83" y="706"><tspan class="h" style="font-weight:700">Communal riots:</tspan><tspan class="r"> Communal and other inter-group riots</tspan><tspan class="k"> in a country like India with</tspan></text>
<text x="83" y="728"><tspan class="k">its religious, social and cultural diversity cannot be treated as merely law and order</tspan></text>
<text x="83" y="750"><tspan class="k">problem. They are manifestations of</tspan><tspan class="r"> collective behavioural disorders</tspan><tspan class="k">. Legal and</tspan></text>
<text x="83" y="772"><tspan class="k">administrative measures are required to be taken to remove the</tspan><tspan class="b"> insecurity felt by</tspan></text>
<text x="83" y="794"><tspan class="b">the minorities</tspan><tspan class="k"> and for bringing them into the mainstream of the national fabric.</tspan></text>
<text x="56" y="820" class="r" style="font-weight:700">16.</text>
<text x="83" y="820"><tspan class="h" style="font-weight:700">Social infrastructure:</tspan><tspan class="k"> The state of</tspan><tspan class="r"> social infrastructure is disturbing</tspan><tspan class="k">. There are</tspan></text>
<text x="83" y="842"><tspan class="r">380 million children below the age of 14</tspan><tspan class="k">. The arrangements for their education,</tspan></text>
<text x="83" y="864"><tspan class="k">health and well-being are wholly inadequate both qualitatively and quantitatively.</tspan></text>
<text x="83" y="886"><tspan class="r">96.4 per cent of the primary education budget goes for salaries</tspan><tspan class="k"> alone.</tspan></text>
<text x="56" y="912" class="r" style="font-weight:700">17.</text>
<text x="83" y="912"><tspan class="h" style="font-weight:700">Health indicators:</tspan><tspan class="k"> Rates of</tspan><tspan class="r"> infant mortality, blindness, maternal mortality,</tspan></text>
<text x="83" y="934"><tspan class="r">maternal-anemia, child malnutrition and child-immunization</tspan><tspan class="k">, despite significant</tspan></text>
<text x="83" y="956"><tspan class="k">progress achieved, yet remain at high and disconcerting levels.</tspan></text>
<text x="56" y="982" class="r" style="font-weight:700">18.</text>
<text x="83" y="982"><tspan class="h" style="font-weight:700">Public health:</tspan><tspan class="r"> Public health and hygiene</tspan><tspan class="k"> have not received adequate attention.</tspan></text>
<text x="83" y="1004"><tspan class="k">There is an alarming increase in</tspan><tspan class="r"> infectious diseases</tspan><tspan class="k"> such as Tuberculosis, Malaria,</tspan></text>
<text x="83" y="1026"><tspan class="k">Hepatitis, HIV etc.</tspan></text>

<text class="xs" x="96" y="1085" text-anchor="middle"><tspan class="k">loss of faith</tspan></text>

<text class="xs" x="340" y="1085" text-anchor="middle"><tspan class="k">debt-trap</tspan></text>

<text class="xs" x="462" y="1085" text-anchor="middle"><tspan class="k">near collapse</tspan></text>
