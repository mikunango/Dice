<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – Fundamental Rights and Property</h2>
<svg class="n" width="100%" viewBox="0 0 680 1776" role="img"><title>NCRWC Recommendations – Fundamental Rights and Property</title><desc>NCRWC Recommendations – Fundamental Rights and Property</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="72" y="26" width="536" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – Fundamental Rights and Property</text>
<text class="lb" x="40" y="98">Recommendations</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">249 recommendations:</tspan><tspan class="k"> In all, the commission made</tspan><tspan class="r"> 249 recommendations</tspan><tspan class="k">. Of them,</tspan><tspan class="r"> 58</tspan></text>
<text x="56" y="150"><tspan class="k">recommendations involve</tspan><tspan class="r"> amendments to the Constitution</tspan><tspan class="k">,</tspan><tspan class="r"> 86</tspan><tspan class="k"> involve</tspan><tspan class="r"> legislative measures</tspan></text>
<text x="56" y="172"><tspan class="k">and the remaining</tspan><tspan class="r"> 105</tspan><tspan class="k"> recommendations could be accomplished through</tspan><tspan class="r"> executive action</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="184" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="204" text-anchor="middle"><tspan class="r" style="font-weight:700">58</tspan></text>
<text class="sm" x="137" y="222" text-anchor="middle"><tspan class="k">constitutional amendments</tspan></text>
<rect class="bx" x="243" y="184" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="204" text-anchor="middle"><tspan class="r" style="font-weight:700">86</tspan></text>
<text class="sm" x="340" y="222" text-anchor="middle"><tspan class="k">legislative measures</tspan></text>
<rect class="bx" x="447" y="184" width="193" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="204" text-anchor="middle"><tspan class="r" style="font-weight:700">105</tspan></text>
<text class="sm" x="543" y="222" text-anchor="middle"><tspan class="k">executive action</tspan></text>
<rect x="40.0" y="250" width="139.8" height="44" fill="#D93A3A" fill-opacity="0.16" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="110" y="277" text-anchor="middle"><tspan class="r" style="font-weight:700">58</tspan><tspan class="k"> amendments</tspan></text>
<rect x="179.8" y="250" width="207.2" height="44" fill="#2F6FDB" fill-opacity="0.16" stroke="#2F6FDB" stroke-width="1.2"/>
<text class="xs" x="283" y="277" text-anchor="middle"><tspan class="r" style="font-weight:700">86</tspan><tspan class="k"> legislative</tspan></text>
<rect x="387.0" y="250" width="253.0" height="44" fill="#3B9B4A" fill-opacity="0.16" stroke="#3B9B4A" stroke-width="1.2"/>
<text class="xs" x="513" y="277" text-anchor="middle"><tspan class="r" style="font-weight:700">105</tspan><tspan class="k"> executive action</tspan></text>
<text class="xs" x="340" y="315" text-anchor="middle"><tspan class="b">249 recommendations of the NCRWC drawn to scale</tspan></text>
<text x="44" y="348"><tspan class="h" style="font-weight:700">Area-wise recommendations:</tspan><tspan class="k"> The various recommendations of the commission are</tspan></text>
<text x="56" y="370"><tspan class="k">mentioned below in an area-wise manner⁴:</tspan></text>
<text class="sh" x="40" y="398"><tspan class="r" style="font-weight:700">1. On Fundamental Rights</tspan></text>
<text x="56" y="426" class="r" style="font-weight:700">1.</text>
<text x="78" y="426"><tspan class="h" style="font-weight:700">Wider non-discrimination:</tspan><tspan class="k"> The scope of prohibition against discrimination (</tspan><tspan class="r">under</tspan></text>
<text x="78" y="448"><tspan class="r">Articles 15 and 16</tspan><tspan class="k">) should be extended to include ‘</tspan><tspan class="r">ethnic or social origin, political or</tspan></text>
<text x="78" y="470"><tspan class="r">other opinion, property or birth</tspan><tspan class="k">’.</tspan></text>
<text x="56" y="496" class="r" style="font-weight:700">2.</text>
<text x="78" y="496"><tspan class="h" style="font-weight:700">Press freedom explicit:</tspan><tspan class="k"> The freedom of speech and expression (</tspan><tspan class="r">under Article 19</tspan><tspan class="k">)</tspan></text>
<text x="78" y="518"><tspan class="k">should be expanded to include explicitly ‘</tspan><tspan class="r">the freedom of the press and other media</tspan><tspan class="k">,</tspan></text>
<text x="78" y="540"><tspan class="k">the freedom to hold opinions and to seek, receive and impart information and</tspan></text>
<text x="78" y="562"><tspan class="k">ideas’.</tspan></text>
<text x="56" y="588" class="r" style="font-weight:700">3.</text>
<text x="78" y="588"><tspan class="h" style="font-weight:700">New Fundamental Rights:</tspan><tspan class="k"> The following should be added as</tspan><tspan class="r"> new Fundamental</tspan></text>
<text x="78" y="610"><tspan class="r">Rights</tspan><tspan class="k">:</tspan></text>
<path d="M50 406 L44 406 L44 616 L50 616" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="96" y="636" class="r" style="font-weight:700">(a)</text>
<text x="129" y="636"><tspan class="k">Right against</tspan><tspan class="r"> torture, cruelty and inhuman treatment</tspan><tspan class="k"> or punishment.</tspan></text>
<text x="96" y="662" class="r" style="font-weight:700">(b)</text>
<text x="129" y="662"><tspan class="k">Right to</tspan><tspan class="r"> compensation</tspan><tspan class="k"> if a person is illegally deprived of his/her right to life</tspan></text>
<text x="129" y="684"><tspan class="k">or liberty.</tspan></text>
<text x="96" y="710" class="r" style="font-weight:700">(c)</text>
<text x="129" y="710"><tspan class="k">Right to</tspan><tspan class="r"> leave and to return to India</tspan><tspan class="k">.</tspan></text>
<text x="96" y="736" class="r" style="font-weight:700">(d)</text>
<text x="129" y="736"><tspan class="k">Right to</tspan><tspan class="r"> privacy and family life</tspan><tspan class="k">.</tspan></text>
<text x="96" y="762" class="r" style="font-weight:700">(e)</text>
<text x="129" y="762"><tspan class="k">Right to</tspan><tspan class="r"> rural wage employment</tspan><tspan class="k"> for a minimum of 80 days in a year.</tspan></text>
<text x="96" y="788" class="r" style="font-weight:700">(f)</text>
<text x="129" y="788"><tspan class="k">Right to</tspan><tspan class="r"> access to courts and tribunals and speedy justice</tspan><tspan class="k">.</tspan></text>
<text x="96" y="814" class="r" style="font-weight:700">(g)</text>
<text x="129" y="814"><tspan class="k">Right to</tspan><tspan class="r"> equal justice and free legal aid</tspan><tspan class="k">⁵.</tspan></text>
<text x="96" y="840" class="r" style="font-weight:700">(h)</text>
<text x="129" y="840"><tspan class="k">Right to</tspan><tspan class="r"> care and assistance and protection</tspan><tspan class="k"> (in case of children).</tspan></text>
<text x="96" y="866" class="r" style="font-weight:700">(i)</text>
<text x="129" y="866"><tspan class="k">Right to</tspan><tspan class="r"> safe drinking water, prevention of pollution, conservation of ecology</tspan></text>
<text x="129" y="888"><tspan class="k">and sustainable development.</tspan></text>
<path d="M90 616 L84 616 L84 894 L90 894" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="56" y="914" class="r" style="font-weight:700">4.</text>
<text x="78" y="914"><tspan class="h" style="font-weight:700">Right to education till 18 for girls, SC/ST:</tspan><tspan class="k"> The right to education (</tspan><tspan class="r">under Article</tspan></text>
<text x="78" y="936"><tspan class="r">21-A</tspan><tspan class="k">) should be enlarged to read as: ‘Every child shall have the right to free</tspan></text>
<text x="78" y="958"><tspan class="k">education until he completes the age of</tspan><tspan class="r"> fourteen years</tspan><tspan class="k">; and in the case of</tspan><tspan class="r"> girls and</tspan></text>
<text x="78" y="980"><tspan class="r">members of the SCs and STs</tspan><tspan class="k"> until they complete the age of</tspan><tspan class="r"> eighteen years</tspan><tspan class="k">’.</tspan></text>
<text x="56" y="1006" class="r" style="font-weight:700">5.</text>
<text x="78" y="1006"><tspan class="h" style="font-weight:700">Preventive detention reforms:</tspan><tspan class="k"> Two changes should be made with respect to</tspan></text>
<text x="78" y="1028"><tspan class="r">preventive detention</tspan><tspan class="k"> (under Article 22), namely, (i) the maximum period of</tspan></text>
<text x="78" y="1050"><tspan class="k">preventive detention should be</tspan><tspan class="r"> six months</tspan><tspan class="k">; and (ii) the</tspan><tspan class="r"> advisory board</tspan><tspan class="k"> should</tspan></text>
<text x="78" y="1072"><tspan class="k">consist of a chairman and two other members and they should be</tspan><tspan class="b"> serving judges of</tspan></text>
<text x="78" y="1094"><tspan class="b">any high court</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1120" class="r" style="font-weight:700">6.</text>
<text x="78" y="1120"><tspan class="h" style="font-weight:700">Sikhism, Jainism, Buddhism separate:</tspan><tspan class="r"> Sikhism, Jainism and Buddhism</tspan><tspan class="k"> should be</tspan></text>
<text x="78" y="1142"><tspan class="k">treated as religions</tspan><tspan class="r"> separate from Hinduism</tspan><tspan class="k"> and the provisions grouping them</tspan></text>
<text x="78" y="1164"><tspan class="k">together (under</tspan><tspan class="r"> Article 25</tspan><tspan class="k">) should be deleted. At present, the word ‘Hindu’ is</tspan></text>
<text x="78" y="1186"><tspan class="k">defined to include these religions also.</tspan></text>
<text x="56" y="1212" class="r" style="font-weight:700">7.</text>
<text x="78" y="1212"><tspan class="h" style="font-weight:700">Ninth Schedule restricted:</tspan><tspan class="k"> The protection from judicial review afforded by</tspan><tspan class="r"> Article</tspan></text>
<text x="78" y="1234"><tspan class="r">31-B</tspan><tspan class="k"> to the Acts and Regulations specified in the</tspan><tspan class="r"> Ninth Schedule</tspan><tspan class="k"> should be</tspan></text>
<text x="78" y="1256"><tspan class="k">restricted to only those which relate to (i)</tspan><tspan class="b"> agrarian reforms</tspan><tspan class="k">, (ii)</tspan><tspan class="b"> reservations</tspan><tspan class="k">, and</tspan></text>
<text x="78" y="1278"><tspan class="k">(iii) the</tspan><tspan class="b"> implementation of Directive Principles specified in clause (b) or (c) of</tspan></text>
<text x="78" y="1300"><tspan class="b">Article 39</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1326" class="r" style="font-weight:700">8.</text>
<text x="78" y="1326"><tspan class="h" style="font-weight:700">Non-suspendable rights in emergency:</tspan><tspan class="k"> No suspension of the enforcement of the</tspan></text>
<text x="78" y="1348"><tspan class="k">Fundamental Rights under</tspan><tspan class="r"> Articles 17, 23, 24, 25 and 32</tspan><tspan class="k"> in addition to those under</tspan></text>
<text x="78" y="1370"><tspan class="r">Articles 20 and 21</tspan><tspan class="k"> during the operation of a</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under Article</tspan></text>
<text x="78" y="1392"><tspan class="k">352).</tspan></text>
<path d="M50 894 L44 894 L44 1398 L50 1398" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1420"><tspan class="r" style="font-weight:700">2. On Right to Property</tspan></text>
<text x="44" y="1450"><tspan class="h" style="font-weight:700">Recasting Article 300-A:</tspan><tspan class="r"> Article 300-A</tspan><tspan class="k"> should be recast as follows:</tspan></text>
<text x="56" y="1476" class="r" style="font-weight:700">1.</text>
<text x="78" y="1476"><tspan class="h" style="font-weight:700">Public purpose:</tspan><tspan class="k"> Deprivation or acquisition of property shall be by</tspan><tspan class="r"> authority of law</tspan></text>
<text x="78" y="1498"><tspan class="k">and only for a</tspan><tspan class="r"> public purpose</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1524" class="r" style="font-weight:700">2.</text>
<text x="78" y="1524"><tspan class="h" style="font-weight:700">No arbitrariness:</tspan><tspan class="k"> There shall be</tspan><tspan class="r"> no arbitrary deprivation</tspan><tspan class="k"> or acquisition of property.</tspan></text>
<text x="56" y="1550" class="r" style="font-weight:700">3.</text>
<text x="78" y="1550"><tspan class="h" style="font-weight:700">Rehabilitation for SC/ST land:</tspan><tspan class="k"> No deprivation or acquisition of</tspan><tspan class="r"> agricultural, forest</tspan></text>
<text x="78" y="1572"><tspan class="r">and non-urban homestead land</tspan><tspan class="k"> belonging to or customarily used by the</tspan><tspan class="r"> SCs and</tspan></text>
<text x="78" y="1594"><tspan class="r">STs</tspan><tspan class="k"> shall take place except by authority of law which provides for suitable</tspan></text>
<text x="78" y="1616"><tspan class="r">rehabilitation scheme</tspan><tspan class="k"> before taking possession of such land. In brief, a right to</tspan></text>
<text x="78" y="1638"><tspan class="k">‘</tspan><tspan class="r">suitable rehabilitation</tspan><tspan class="k">’ for the SCs and STs if their land is to be acquired.</tspan></text>
<path d="M50 1456 L44 1456 L44 1644 L50 1644" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1674"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> Chapters 3 to 10 in Volume I of the Report of the Commission contains the detailed area-wise</tspan></text>
<text class="xs" x="50" y="1692"><tspan class="k">recommendations. The summary of recommendations is given in Chapter 11 of the Report.</tspan></text>
<rect x="40" y="1652" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1737"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> At present, it is a Directive Principle under Article 39-A.</tspan></text>
<rect x="40" y="1715" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
