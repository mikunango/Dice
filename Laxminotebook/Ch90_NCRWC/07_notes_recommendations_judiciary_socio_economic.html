<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – Judiciary and Socio-Economic Change</h2>
<svg class="n" width="100%" viewBox="0 0 680 1682" role="img"><title>NCRWC Recommendations – Judiciary and Socio-Economic Change</title><desc>NCRWC Recommendations – Judiciary and Socio-Economic Change</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – Judiciary and Socio-Economic Change</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">8. On Judiciary</tspan></text>
<text x="56" y="122" class="r" style="font-weight:700">1.</text>
<text x="82" y="122"><tspan class="h" style="font-weight:700">National Judicial Commission:</tspan><tspan class="k"> A</tspan><tspan class="r"> National Judicial Commission</tspan><tspan class="k"> under the</tspan></text>
<text x="82" y="144"><tspan class="k">Constitution should be established to recommend the appointment of judges of the</tspan></text>
<text x="82" y="166"><tspan class="k">Supreme Court. It should comprise the</tspan><tspan class="b"> chief justice of India (as chairman), two</tspan></text>
<text x="82" y="188"><tspan class="b">senior most Judges of the Supreme Court, the Union law minister and one person</tspan></text>
<text x="82" y="210"><tspan class="b">nominated by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="236" class="r" style="font-weight:700">2.</text>
<text x="82" y="236"><tspan class="h" style="font-weight:700">Judicial accountability:</tspan><tspan class="k"> A committee of the National Judicial Commission should</tspan></text>
<text x="82" y="258"><tspan class="k">examine</tspan><tspan class="r"> complaints of deviant behaviour</tspan><tspan class="k"> of the Supreme Court and high court</tspan></text>
<text x="82" y="280"><tspan class="k">judges.</tspan></text>
<text x="56" y="306" class="r" style="font-weight:700">3.</text>
<text x="82" y="306"><tspan class="h" style="font-weight:700">Retirement age 65 / 68:</tspan><tspan class="k"> The</tspan><tspan class="r"> retirement age</tspan><tspan class="k"> of the judges of high courts and</tspan></text>
<text x="82" y="328"><tspan class="k">Supreme Court should be increased to</tspan><tspan class="r"> 65 and 68</tspan><tspan class="k"> respectively.</tspan></text>
<text x="56" y="354" class="r" style="font-weight:700">4.</text>
<text x="82" y="354"><tspan class="h" style="font-weight:700">Contempt power limited:</tspan><tspan class="k"> No court other than the</tspan><tspan class="r"> Supreme Court and the High</tspan></text>
<text x="82" y="376"><tspan class="r">Courts</tspan><tspan class="k"> should have the power to</tspan><tspan class="r"> punish for contempt</tspan><tspan class="k"> of itself.</tspan></text>
<text x="56" y="402" class="r" style="font-weight:700">5.</text>
<text x="82" y="402"><tspan class="h" style="font-weight:700">Judicial review limited to SC/HC:</tspan><tspan class="k"> Except for the Supreme Court and the High</tspan></text>
<text x="82" y="424"><tspan class="k">Courts, no other court should have the power to</tspan><tspan class="r"> declare the Acts of Parliament and</tspan></text>
<text x="82" y="446"><tspan class="r">State Legislatures as being unconstitutional</tspan><tspan class="k"> or beyond legislative competence and</tspan></text>
<text x="82" y="468"><tspan class="k">so ultra-vires.</tspan></text>
<text x="56" y="494" class="r" style="font-weight:700">6.</text>
<text x="82" y="494"><tspan class="h" style="font-weight:700">Judicial Councils for budgets:</tspan><tspan class="k"> A</tspan><tspan class="r"> National Judicial Council and Judicial Councils in</tspan></text>
<text x="82" y="516"><tspan class="r">States</tspan><tspan class="k"> should be set up for the preparation of plans and annual budget proposals.</tspan></text>
<text x="56" y="542" class="r" style="font-weight:700">7.</text>
<text x="82" y="542"><tspan class="h" style="font-weight:700">Judgement within 90 days:</tspan><tspan class="k"> In the Supreme Court and the High Courts,</tspan></text>
<text x="82" y="564"><tspan class="k">judgements should ordinarily be delivered</tspan><tspan class="r"> within 90 days</tspan><tspan class="k"> from the conclusion of the</tspan></text>
<text x="82" y="586"><tspan class="k">case.</tspan></text>
<text x="56" y="612" class="r" style="font-weight:700">8.</text>
<text x="82" y="612"><tspan class="h" style="font-weight:700">Exemplary costs:</tspan><tspan class="k"> An award of</tspan><tspan class="r"> exemplary costs</tspan><tspan class="k"> should be given in appropriate cases</tspan></text>
<text x="82" y="634"><tspan class="k">of</tspan><tspan class="b"> abuse of process of law</tspan><tspan class="k">.</tspan></text>
<text x="56" y="660" class="r" style="font-weight:700">9.</text>
<text x="82" y="660"><tspan class="h" style="font-weight:700">Arrears – one-year limit:</tspan><tspan class="k"> Each High Court should prepare a</tspan><tspan class="r"> strategic plan for</tspan></text>
<text x="82" y="682"><tspan class="r">time-bound clearance of arrears</tspan><tspan class="k"> in courts within its jurisdiction.</tspan><tspan class="r"> No case to remain</tspan></text>
<text x="82" y="704"><tspan class="r">pending for more than one year</tspan><tspan class="k">.</tspan></text>
<text x="56" y="730" class="r" style="font-weight:700">10.</text>
<text x="82" y="730"><tspan class="h" style="font-weight:700">Plea-bargaining:</tspan><tspan class="k"> The system of</tspan><tspan class="r"> plea-bargaining</tspan><tspan class="k"> should be introduced as part of</tspan></text>
<text x="82" y="752"><tspan class="k">the process of</tspan><tspan class="b"> decriminalization</tspan><tspan class="k">.</tspan></text>
<text x="56" y="778" class="r" style="font-weight:700">11.</text>
<text x="82" y="778"><tspan class="h" style="font-weight:700">Two-tier subordinate judiciary:</tspan><tspan class="k"> The hierarchy of the subordinate courts in the</tspan></text>
<text x="82" y="800"><tspan class="k">country should be brought down to a</tspan><tspan class="r"> two-tier subordinate judiciary</tspan><tspan class="k"> under the High</tspan></text>
<text x="82" y="822"><tspan class="k">Court.</tspan></text>
<path d="M50 102 L44 102 L44 828 L50 828" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="850"><tspan class="r" style="font-weight:700">9. On Pace of Socio-Economic Change and Development</tspan></text>
<text x="56" y="878" class="r" style="font-weight:700">1.</text>
<text x="83" y="878"><tspan class="h" style="font-weight:700">Diversity in higher judiciary:</tspan><tspan class="k"> A way could and should be found to bring a</tspan></text>
<text x="83" y="900"><tspan class="k">reasonable number of</tspan><tspan class="r"> SCs, STs and BCs on to the benches</tspan><tspan class="k"> of the Supreme Court</tspan></text>
<text x="83" y="922"><tspan class="k">and high courts.</tspan></text>
<text x="56" y="948" class="r" style="font-weight:700">2.</text>
<text x="83" y="948"><tspan class="h" style="font-weight:700">Equal competition:</tspan><tspan class="k"> Social policy should aim at enabling the SCs, STs and BCs and</tspan></text>
<text x="83" y="970"><tspan class="k">with particular attention to the</tspan><tspan class="r"> girls</tspan><tspan class="k"> to</tspan><tspan class="r"> compete on equal terms</tspan><tspan class="k"> with the general</tspan></text>
<text x="83" y="992"><tspan class="k">category.</tspan></text>
<text x="56" y="1018" class="r" style="font-weight:700">3.</text>
<text x="83" y="1018"><tspan class="h" style="font-weight:700">Optimal use of resources:</tspan><tspan class="k"> Appropriate new institutions should be established to</tspan></text>
<text x="83" y="1040"><tspan class="k">ensure that the</tspan><tspan class="r"> resources earmarked for the weaker sections are optimally used</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1066" class="r" style="font-weight:700">4.</text>
<text x="83" y="1066"><tspan class="h" style="font-weight:700">Citizens’ Charters:</tspan><tspan class="k"> The</tspan><tspan class="r"> Citizens’ Charters</tspan><tspan class="k"> be prepared by every service providing</tspan></text>
<text x="83" y="1088"><tspan class="k">department/ agency to enumerate the</tspan><tspan class="b"> entitlements of the citizens</tspan><tspan class="k"> specifically</tspan></text>
<text x="83" y="1110"><tspan class="k">those of the SCs, STs and other deprived classes.</tspan></text>
<text x="56" y="1136" class="r" style="font-weight:700">5.</text>
<text x="83" y="1136"><tspan class="h" style="font-weight:700">Reservation statute – Arakshan Nyaya Adalats:</tspan><tspan class="r"> Reservation</tspan><tspan class="k"> for SCs, STs and</tspan></text>
<text x="83" y="1158"><tspan class="k">BCs should be brought under a</tspan><tspan class="r"> statute</tspan><tspan class="k"> covering all aspects of reservation including</tspan></text>
<text x="83" y="1180"><tspan class="k">setting up of</tspan><tspan class="r"> Arakshan Nyaya Adalats</tspan><tspan class="k"> to adjudicate upon all disputes pertaining to</tspan></text>
<text x="83" y="1202"><tspan class="k">reservation.</tspan></text>
<text x="56" y="1228" class="r" style="font-weight:700">6.</text>
<text x="83" y="1228"><tspan class="h" style="font-weight:700">Residential schools:</tspan><tspan class="r"> Residential schools</tspan><tspan class="k"> for SCs, STs and BCs should be</tspan></text>
<text x="83" y="1250"><tspan class="k">established</tspan><tspan class="r"> in every district</tspan><tspan class="k"> in the country.</tspan></text>
<text x="56" y="1276" class="r" style="font-weight:700">7.</text>
<text x="83" y="1276"><tspan class="h" style="font-weight:700">Fifth to Sixth Schedule:</tspan><tspan class="k"> All tribal areas governed by the</tspan><tspan class="r"> Fifth Schedule</tspan><tspan class="k"> of the</tspan></text>
<text x="83" y="1298"><tspan class="k">Constitution should be</tspan><tspan class="r"> transferred to the Sixth Schedule</tspan><tspan class="k">. Other tribal areas should</tspan></text>
<text x="83" y="1320"><tspan class="k">also be brought under the Sixth Schedule.</tspan></text>
<text x="56" y="1346" class="r" style="font-weight:700">8.</text>
<text x="83" y="1346"><tspan class="h" style="font-weight:700">Special atrocity courts:</tspan><tspan class="r"> Special courts</tspan><tspan class="k"> exclusively to try offences under the</tspan><tspan class="r"> SCs</tspan></text>
<text x="83" y="1368"><tspan class="r">and STs (Prevention of Atrocities) Act, 1989</tspan><tspan class="k">, should be established.</tspan></text>
<text x="56" y="1394" class="r" style="font-weight:700">9.</text>
<text x="83" y="1394"><tspan class="h" style="font-weight:700">Enforce PCR Act:</tspan><tspan class="k"> Prevention of</tspan><tspan class="r"> untouchability</tspan><tspan class="k"> requires, inter alia, effective punitive</tspan></text>
<text x="83" y="1416"><tspan class="k">action under the</tspan><tspan class="r"> Protection of Civil Rights Act, 1955</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1442" class="r" style="font-weight:700">10.</text>
<text x="83" y="1442"><tspan class="h" style="font-weight:700">End manual scavenging:</tspan><tspan class="k"> The</tspan><tspan class="r"> Employment of Manual Scavengers and Construction</tspan></text>
<text x="83" y="1464"><tspan class="r">of Dry Latrines (Prohibition) Act, 1993</tspan><tspan class="k">, should be strictly enforced.</tspan></text>
<text x="56" y="1490" class="r" style="font-weight:700">11.</text>
<text x="83" y="1490"><tspan class="h" style="font-weight:700">Minorities – education &amp; representation:</tspan><tspan class="k"> Steps should be taken for improvement</tspan></text>
<text x="83" y="1512"><tspan class="k">of</tspan><tspan class="r"> educational standards</tspan><tspan class="k"> as well as for increasing the</tspan><tspan class="r"> political representation of the</tspan></text>
<text x="83" y="1534"><tspan class="r">minority communities</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1560" class="r" style="font-weight:700">12.</text>
<text x="83" y="1560"><tspan class="h" style="font-weight:700">Bonded labour authority:</tspan><tspan class="k"> A fully empowered</tspan><tspan class="r"> National Authority for the Liberation</tspan></text>
<text x="83" y="1582"><tspan class="r">and Rehabilitation of bonded labour</tspan><tspan class="k"> should be set up. Similar authorities should</tspan></text>
<text x="83" y="1604"><tspan class="k">also be established at the state level.</tspan></text>
<text x="56" y="1630" class="r" style="font-weight:700">13.</text>
<text x="83" y="1630"><tspan class="h" style="font-weight:700">Women’s empowerment:</tspan><tspan class="k"> As regards</tspan><tspan class="r"> women</tspan><tspan class="k">, actions covering</tspan><tspan class="b"> reservations,</tspan></text>
<text x="83" y="1652"><tspan class="b">development, empowerment, health and protection against violence</tspan><tspan class="k"> should be taken.</tspan></text>
