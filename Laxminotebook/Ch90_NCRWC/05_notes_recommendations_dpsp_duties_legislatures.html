<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – DPSP, Duties and Legislatures</h2>
<svg class="n" width="100%" viewBox="0 0 680 1749" role="img"><title>NCRWC Recommendations – DPSP, Duties and Legislatures</title><desc>NCRWC Recommendations – DPSP, Duties and Legislatures</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="86" y="26" width="509" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – DPSP, Duties and Legislatures</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">3. On Directive Principles</tspan></text>
<text x="56" y="122" class="r" style="font-weight:700">1.</text>
<text x="78" y="122"><tspan class="h" style="font-weight:700">DPSP and Action:</tspan><tspan class="k"> The heading of</tspan><tspan class="r"> Part-IV</tspan><tspan class="k"> of the Constitution should be amended</tspan></text>
<text x="78" y="144"><tspan class="k">to read as ‘</tspan><tspan class="r">Directive Principles of State Policy and Action</tspan><tspan class="k">’.</tspan></text>
<text x="56" y="170" class="r" style="font-weight:700">2.</text>
<text x="78" y="170"><tspan class="h" style="font-weight:700">Population control:</tspan><tspan class="k"> A new Directive Principle on</tspan><tspan class="r"> control of population</tspan><tspan class="k"> should be</tspan></text>
<text x="78" y="192"><tspan class="k">added.</tspan></text>
<text x="56" y="218" class="r" style="font-weight:700">3.</text>
<text x="78" y="218"><tspan class="h" style="font-weight:700">National Education Commission:</tspan><tspan class="k"> An independent</tspan><tspan class="r"> National Education Commission</tspan></text>
<text x="78" y="240"><tspan class="k">should be set-up every</tspan><tspan class="r"> five years</tspan><tspan class="k">.</tspan></text>
<text x="56" y="266" class="r" style="font-weight:700">4.</text>
<text x="78" y="266"><tspan class="h" style="font-weight:700">Inter-Faith Commission:</tspan><tspan class="k"> An</tspan><tspan class="r"> Inter-Faith Commission</tspan><tspan class="k"> should be established to</tspan></text>
<text x="78" y="288"><tspan class="k">promote</tspan><tspan class="b"> inter-religious harmony and social solidarity</tspan><tspan class="k">.</tspan></text>
<text x="56" y="314" class="r" style="font-weight:700">5.</text>
<text x="78" y="314"><tspan class="h" style="font-weight:700">Review body for DPSP:</tspan><tspan class="k"> There must be a</tspan><tspan class="r"> body of high status</tspan><tspan class="k"> to review the level of</tspan></text>
<text x="78" y="336"><tspan class="k">implementation of the Directive Principles.</tspan></text>
<text x="56" y="362" class="r" style="font-weight:700">6.</text>
<text x="78" y="362"><tspan class="h" style="font-weight:700">Employment plan:</tspan><tspan class="k"> A strategic</tspan><tspan class="r"> Plan of Action</tspan><tspan class="k"> should be initiated to create a large</tspan></text>
<text x="78" y="384"><tspan class="k">number of</tspan><tspan class="r"> employment opportunities in five years</tspan><tspan class="k">.</tspan></text>
<text x="56" y="410" class="r" style="font-weight:700">7.</text>
<text x="78" y="410"><tspan class="h" style="font-weight:700">Statistical reforms:</tspan><tspan class="k"> Implementation of the recommendations contained in the</tspan></text>
<text x="78" y="432"><tspan class="k">Report of the</tspan><tspan class="r"> National Statistical Commission (2001)</tspan><tspan class="k">.</tspan></text>
<path d="M50 102 L44 102 L44 438 L50 438" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="460"><tspan class="r" style="font-weight:700">4. On Fundamental Duties</tspan></text>
<text x="56" y="488" class="r" style="font-weight:700">1.</text>
<text x="78" y="488"><tspan class="h" style="font-weight:700">Popularise duties:</tspan><tspan class="k"> Consideration should be given to the ways and means by which</tspan></text>
<text x="78" y="510"><tspan class="r">Fundamental Duties could be popularized and made effective</tspan><tspan class="k">.</tspan></text>
<text x="56" y="536" class="r" style="font-weight:700">2.</text>
<text x="78" y="536"><tspan class="h" style="font-weight:700">Justice Verma Committee:</tspan><tspan class="k"> The recommendations of the</tspan><tspan class="r"> Justice Verma Committee</tspan></text>
<text x="78" y="558"><tspan class="k">on operationalisation of Fundamental Duties should be implemented at the</tspan></text>
<text x="78" y="580"><tspan class="k">earliest⁶.</tspan></text>
<text x="56" y="606" class="r" style="font-weight:700">3.</text>
<text x="78" y="606"><tspan class="h" style="font-weight:700">New duties:</tspan><tspan class="k"> The following</tspan><tspan class="r"> new fundamental duties</tspan><tspan class="k"> should be included in</tspan><tspan class="r"> Article</tspan></text>
<text x="78" y="628"><tspan class="r">51-A</tspan><tspan class="k">:</tspan></text>
<path d="M50 468 L44 468 L44 634 L50 634" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="96" y="654" class="r" style="font-weight:700">(a)</text>
<text x="129" y="654"><tspan class="k">Duty to</tspan><tspan class="r"> vote at elections</tspan><tspan class="k">, actively participate in the democratic process of</tspan></text>
<text x="129" y="676"><tspan class="k">governance and to</tspan><tspan class="r"> pay taxes</tspan><tspan class="k">.</tspan></text>
<text x="96" y="702" class="r" style="font-weight:700">(b)</text>
<text x="129" y="702"><tspan class="k">To foster a spirit of</tspan><tspan class="r"> family values and responsible parenthood</tspan><tspan class="k"> in the matter</tspan></text>
<text x="129" y="724"><tspan class="k">of education, physical and moral well-being of children.</tspan></text>
<text x="96" y="750" class="r" style="font-weight:700">(c)</text>
<text x="129" y="750"><tspan class="k">Duty of</tspan><tspan class="r"> industrial organizations to provide education</tspan><tspan class="k"> to children of their</tspan></text>
<text x="129" y="772"><tspan class="k">employees.</tspan></text>
<path d="M90 634 L84 634 L84 778 L90 778" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="800"><tspan class="r" style="font-weight:700">5. On Parliament and State Legislatures</tspan></text>
<text x="56" y="828" class="r" style="font-weight:700">1.</text>
<text x="83" y="828"><tspan class="h" style="font-weight:700">Codify privileges:</tspan><tspan class="k"> The</tspan><tspan class="r"> privileges of legislators should be defined and delimited</tspan><tspan class="k"> for</tspan></text>
<text x="83" y="850"><tspan class="k">the free and independent functioning of Parliament and state legislatures.</tspan></text>
<text x="56" y="876" class="r" style="font-weight:700">2.</text>
<text x="83" y="876"><tspan class="h" style="font-weight:700">No immunity for corruption:</tspan><tspan class="r"> Article 105</tspan><tspan class="k"> may be amended to clarify that the</tspan></text>
<text x="83" y="898"><tspan class="k">immunity enjoyed by members under parliamentary privileges</tspan><tspan class="r"> does not cover corrupt</tspan></text>
<text x="83" y="920"><tspan class="r">acts</tspan><tspan class="k"> committed by them in connection with their duties in the House or otherwise.</tspan></text>
<text x="83" y="942"><tspan class="k">Further, no court would take cognizance of any offence arising out of a member’s</tspan></text>
<text x="83" y="964"><tspan class="k">action in the House without</tspan><tspan class="b"> prior sanction of the Speaker/Chairman</tspan><tspan class="k">.</tspan><tspan class="r"> Article 194</tspan></text>
<text x="83" y="986"><tspan class="k">may also be similarly amended in relation to the members of state legislatures.</tspan></text>
<text x="56" y="1012" class="r" style="font-weight:700">3.</text>
<text x="83" y="1012"><tspan class="h" style="font-weight:700">Domicile for Rajya Sabha:</tspan><tspan class="k"> The</tspan><tspan class="r"> domiciliary requirement</tspan><tspan class="k"> for eligibility to contest</tspan></text>
<text x="83" y="1034"><tspan class="k">elections to</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> from the concerned state should be maintained. This is</tspan></text>
<text x="83" y="1056"><tspan class="k">essential to ensure the</tspan><tspan class="b"> federal character</tspan><tspan class="k"> of the Rajya Sabha.</tspan></text>
<text x="56" y="1082" class="r" style="font-weight:700">4.</text>
<text x="83" y="1082"><tspan class="h" style="font-weight:700">End MPLADS:</tspan><tspan class="k"> The</tspan><tspan class="r"> MP local area development scheme should be discontinued</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1108" class="r" style="font-weight:700">5.</text>
<text x="83" y="1108"><tspan class="h" style="font-weight:700">ECI on office of profit:</tspan><tspan class="k"> The</tspan><tspan class="r"> Election Commission</tspan><tspan class="k"> should be empowered to identify</tspan></text>
<text x="83" y="1130"><tspan class="k">and declare the various offices under the central and state governments to be</tspan></text>
<text x="83" y="1152"><tspan class="k">‘</tspan><tspan class="r">offices of profit</tspan><tspan class="k">’ for the purposes of being chosen, and for being, a member of the</tspan></text>
<text x="83" y="1174"><tspan class="k">appropriate legislature.</tspan></text>
<text x="56" y="1200" class="r" style="font-weight:700">6.</text>
<text x="83" y="1200"><tspan class="h" style="font-weight:700">Committee on National Economy:</tspan><tspan class="k"> Immediate steps be taken to set up a</tspan><tspan class="r"> Nodal</tspan></text>
<text x="83" y="1222"><tspan class="r">Standing Committee on National Economy</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1248" class="r" style="font-weight:700">7.</text>
<text x="83" y="1248"><tspan class="h" style="font-weight:700">Standing Constitution Committee:</tspan><tspan class="k"> A</tspan><tspan class="r"> Standing Constitution Committee</tspan><tspan class="k"> of the two</tspan></text>
<text x="83" y="1270"><tspan class="k">Houses of Parliament for</tspan><tspan class="b"> a priori scrutiny of constitutional amendment proposals</tspan></text>
<text x="83" y="1292"><tspan class="k">should be set up.</tspan></text>
<text x="56" y="1318" class="r" style="font-weight:700">8.</text>
<text x="83" y="1318"><tspan class="h" style="font-weight:700">Legislation Committee:</tspan><tspan class="k"> A new</tspan><tspan class="r"> Legislation Committee</tspan><tspan class="k"> of Parliament to oversee and</tspan></text>
<text x="83" y="1340"><tspan class="k">coordinate legislative planning should be constituted.</tspan></text>
<text x="56" y="1366" class="r" style="font-weight:700">9.</text>
<text x="83" y="1366"><tspan class="h" style="font-weight:700">Drop some committees:</tspan><tspan class="k"> The existing Parliamentary Committees on</tspan><tspan class="r"> Estimates,</tspan></text>
<text x="83" y="1388"><tspan class="r">Public Undertakings and Subordinate Legislation</tspan><tspan class="k"> may not be continued.</tspan></text>
<text x="56" y="1414" class="r" style="font-weight:700">10.</text>
<text x="83" y="1414"><tspan class="h" style="font-weight:700">Parliamentary ombudsman:</tspan><tspan class="k"> The Parliamentarians must voluntarily place</tspan></text>
<text x="83" y="1436"><tspan class="k">themselves open to public scrutiny through a</tspan><tspan class="r"> parliamentary ombudsman</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1462" class="r" style="font-weight:700">11.</text>
<text x="83" y="1462"><tspan class="h" style="font-weight:700">Minimum sitting days:</tspan><tspan class="k"> The State Legislatures with less than</tspan><tspan class="r"> 70 members</tspan><tspan class="k"> should</tspan></text>
<text x="83" y="1484"><tspan class="k">meet for at least</tspan><tspan class="r"> 50 days</tspan><tspan class="k"> in a year and other State Legislatures for at least</tspan><tspan class="r"> 90</tspan></text>
<text x="83" y="1506"><tspan class="r">days</tspan><tspan class="k">. Similarly, the minimum number of days for sittings of</tspan><tspan class="r"> Rajya Sabha and Lok</tspan></text>
<text x="83" y="1528"><tspan class="r">Sabha</tspan><tspan class="k"> should be fixed at</tspan><tspan class="r"> 100 and 120 days</tspan><tspan class="k"> respectively.</tspan></text>
<text x="56" y="1554" class="r" style="font-weight:700">12.</text>
<text x="83" y="1554"><tspan class="h" style="font-weight:700">Procedural reform study group:</tspan><tspan class="k"> A</tspan><tspan class="r"> Study Group outside Parliament</tspan><tspan class="k"> for study of</tspan></text>
<text x="83" y="1576"><tspan class="k">procedural reforms should be set up.</tspan></text>
<path d="M50 808 L44 808 L44 1582 L50 1582" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1588" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="1608" text-anchor="middle"><tspan class="r">&lt; 70 members</tspan></text>
<text class="xs" x="111" y="1626" text-anchor="middle"><tspan class="k">50 days</tspan></text>
<rect class="bx" x="192" y="1588" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="1608" text-anchor="middle"><tspan class="r">other states</tspan></text>
<text class="xs" x="264" y="1626" text-anchor="middle"><tspan class="k">90 days</tspan></text>
<rect class="bx" x="345" y="1588" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="1608" text-anchor="middle"><tspan class="r">Rajya Sabha</tspan></text>
<text class="xs" x="416" y="1626" text-anchor="middle"><tspan class="k">100 days</tspan></text>
<rect class="bx" x="498" y="1588" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="1608" text-anchor="middle"><tspan class="r">Lok Sabha</tspan></text>
<text class="xs" x="569" y="1626" text-anchor="middle"><tspan class="k">120 days</tspan></text>
<text class="xs" x="50" y="1674"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> The Government of India appointed the committee “to operationalise the suggestions to teach</tspan></text>
<text class="xs" x="50" y="1692"><tspan class="k">Fundamental Duties to the citizens of India” in the year 1998 under the chairmanship of Justice</tspan></text>
<text class="xs" x="50" y="1710"><tspan class="k">J.S. Verma. The Committee submitted its report in October 1999.</tspan></text>
<rect x="40" y="1652" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
