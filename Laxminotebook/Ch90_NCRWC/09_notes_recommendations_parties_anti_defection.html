<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – Political Parties and Anti-Defection</h2>
<svg class="n" width="100%" viewBox="0 0 680 1276" role="img"><title>NCRWC Recommendations – Political Parties and Anti-Defection</title><desc>NCRWC Recommendations – Political Parties and Anti-Defection</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="63" y="26" width="554" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – Political Parties and Anti-Defection</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">13. On Political Parties</tspan></text>
<text x="56" y="122" class="r" style="font-weight:700">1.</text>
<text x="74" y="122"><tspan class="h" style="font-weight:700">Law on political parties:</tspan><tspan class="k"> A</tspan><tspan class="r"> comprehensive law regulating the registration and</tspan></text>
<text x="74" y="144"><tspan class="r">functioning of political parties</tspan><tspan class="k"> or alliances of parties should be made. The proposed</tspan></text>
<text x="74" y="166"><tspan class="k">law should–</tspan></text>
<path d="M50 102 L44 102 L44 172 L50 172" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="96" y="192" class="r" style="font-weight:700">(a)</text>
<text x="129" y="192"><tspan class="k">provide that political party or alliance should keep its</tspan><tspan class="r"> doors open to all</tspan></text>
<text x="129" y="214"><tspan class="r">citizens</tspan><tspan class="k"> irrespective of any distinctions of caste, community or the like.</tspan></text>
<text x="96" y="240" class="r" style="font-weight:700">(b)</text>
<text x="129" y="240"><tspan class="k">make it compulsory for the parties to</tspan><tspan class="r"> maintain accounts</tspan><tspan class="k"> of the receipt of</tspan></text>
<text x="129" y="262"><tspan class="k">funds and expenditure in a systematic and regular way.</tspan></text>
<text x="96" y="288" class="r" style="font-weight:700">(c)</text>
<text x="129" y="288"><tspan class="k">make it compulsory for the political parties requiring their candidates to</tspan></text>
<text x="129" y="310"><tspan class="r">declare their assets and liabilities</tspan><tspan class="k"> at the time of filing their nomination.</tspan></text>
<text x="96" y="336" class="r" style="font-weight:700">(d)</text>
<text x="129" y="336"><tspan class="k">provide that</tspan><tspan class="r"> no political party should provide ticket to a candidate</tspan><tspan class="k"> if he/she</tspan></text>
<text x="129" y="358"><tspan class="k">was convicted by any court for any criminal offence or if the courts have</tspan></text>
<text x="129" y="380"><tspan class="k">framed criminal charges against him/her.</tspan></text>
<text x="96" y="406" class="r" style="font-weight:700">(e)</text>
<text x="129" y="406"><tspan class="k">specifically provide that if any party violates the above provision, the</tspan></text>
<text x="129" y="428"><tspan class="k">candidate involved should be liable to be</tspan><tspan class="r"> disqualified and the party</tspan></text>
<text x="129" y="450"><tspan class="r">deregistered and derecognized</tspan><tspan class="k">.</tspan></text>
<path d="M90 172 L84 172 L84 456 L90 456" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="56" y="476" class="r" style="font-weight:700">2.</text>
<text x="78" y="476"><tspan class="h" style="font-weight:700">Higher recognition threshold:</tspan><tspan class="k"> The Election Commission should</tspan><tspan class="r"> progressively</tspan></text>
<text x="78" y="498"><tspan class="r">increase the threshold criterion for eligibility for recognition</tspan><tspan class="k"> so that the</tspan><tspan class="b"> proliferation</tspan></text>
<text x="78" y="520"><tspan class="b">of smaller political parties is discouraged</tspan><tspan class="k">.</tspan></text>
<text x="56" y="546" class="r" style="font-weight:700">3.</text>
<text x="78" y="546"><tspan class="h" style="font-weight:700">Political funding law:</tspan><tspan class="k"> A</tspan><tspan class="r"> comprehensive legislation providing for regulation of</tspan></text>
<text x="78" y="568"><tspan class="r">contributions</tspan><tspan class="k"> to the political parties and towards election expenses should be</tspan></text>
<text x="78" y="590"><tspan class="k">enacted by consolidating such laws. This new law should:</tspan></text>
<path d="M50 456 L44 456 L44 596 L50 596" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="96" y="616" class="r" style="font-weight:700">(a)</text>
<text x="129" y="616"><tspan class="k">aim at bringing</tspan><tspan class="r"> transparency into political funding</tspan><tspan class="k">;</tspan></text>
<text x="96" y="642" class="r" style="font-weight:700">(b)</text>
<text x="129" y="642"><tspan class="k">permit</tspan><tspan class="r"> corporate donations</tspan><tspan class="k"> within higher prescribed limits;</tspan></text>
<text x="96" y="668" class="r" style="font-weight:700">(c)</text>
<text x="129" y="668"><tspan class="k">make donations up to a specified limit</tspan><tspan class="r"> tax exempt</tspan><tspan class="k">;</tspan></text>
<text x="96" y="694" class="r" style="font-weight:700">(d)</text>
<text x="129" y="694"><tspan class="k">make both</tspan><tspan class="r"> donors and donees</tspan><tspan class="k"> of political funds accountable;</tspan></text>
<text x="96" y="720" class="r" style="font-weight:700">(e)</text>
<text x="129" y="720"><tspan class="k">provide that</tspan><tspan class="r"> audited political party accounts</tspan><tspan class="k"> should be published yearly; and</tspan></text>
<text x="96" y="746" class="r" style="font-weight:700">(f)</text>
<text x="129" y="746"><tspan class="k">provide for</tspan><tspan class="r"> de-recognition of the party</tspan><tspan class="k"> and enforcement of penalties for</tspan></text>
<text x="129" y="768"><tspan class="k">filing false election returns.</tspan></text>
<path d="M90 596 L84 596 L84 774 L90 774" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="796"><tspan class="r" style="font-weight:700">14. On Anti-Defection Law</tspan></text>
<text x="44" y="826"><tspan class="h" style="font-weight:700">Amend Tenth Schedule:</tspan><tspan class="k"> The provisions of the</tspan><tspan class="r"> Tenth Schedule</tspan><tspan class="k"> of the Constitution should</tspan></text>
<text x="56" y="848"><tspan class="k">be amended to provide the following:</tspan></text>
<text x="56" y="874" class="r" style="font-weight:700">1.</text>
<text x="78" y="874"><tspan class="h" style="font-weight:700">Defectors must re-contest:</tspan><tspan class="k"> All persons</tspan><tspan class="r"> defecting</tspan><tspan class="k"> (whether individually or in</tspan></text>
<text x="78" y="896"><tspan class="k">groups) from the party or the alliance of parties, on whose ticket they had been</tspan></text>
<text x="78" y="918"><tspan class="k">elected,</tspan><tspan class="r"> must resign</tspan><tspan class="k"> from their parliamentary or assembly seats and</tspan><tspan class="r"> must contest</tspan></text>
<text x="78" y="940"><tspan class="r">fresh elections</tspan><tspan class="k">.</tspan></text>
<text x="56" y="966" class="r" style="font-weight:700">2.</text>
<text x="78" y="966"><tspan class="h" style="font-weight:700">No office for defectors:</tspan><tspan class="k"> The defectors should be</tspan><tspan class="r"> debarred to hold any public office</tspan></text>
<text x="78" y="988"><tspan class="k">of a minister or any other remunerative political post for at least the duration of</tspan></text>
<text x="78" y="1010"><tspan class="k">the remaining term of the existing legislature or until the next elections whichever</tspan></text>
<text x="78" y="1032"><tspan class="k">is earlier.</tspan></text>
<text x="56" y="1058" class="r" style="font-weight:700">3.</text>
<text x="78" y="1058"><tspan class="h" style="font-weight:700">Defector’s vote invalid:</tspan><tspan class="k"> The</tspan><tspan class="r"> vote cast by a defector to topple a government should</tspan></text>
<text x="78" y="1080"><tspan class="r">be treated as invalid</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1106" class="r" style="font-weight:700">4.</text>
<text x="78" y="1106"><tspan class="h" style="font-weight:700">ECI to decide defection:</tspan><tspan class="k"> The power to decide questions regarding</tspan><tspan class="r"> disqualification on</tspan></text>
<text x="78" y="1128"><tspan class="r">ground of defection</tspan><tspan class="k"> should vest in the</tspan><tspan class="r"> Election Commission</tspan><tspan class="k"> instead of in the</tspan></text>
<text x="78" y="1150"><tspan class="k">Speaker/Chairman of the House concerned.</tspan></text>
<path d="M50 854 L44 854 L44 1156 L50 1156" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="111" y="1162" width="64" height="30" rx="3"/>
<text class="sm" x="143" y="1181" text-anchor="middle"><tspan class="k">defect</tspan></text>
<line class="ln" x1="178" y1="1177" x2="198" y2="1177" marker-end="url(#ah)"/>
<rect class="bx" x="201" y="1162" width="142" height="30" rx="3"/>
<text class="sm" x="272" y="1181" text-anchor="middle"><tspan class="r">resign + re-contest</tspan></text>
<line class="ln" x1="347" y1="1177" x2="367" y2="1177" marker-end="url(#ah)"/>
<rect class="bx" x="370" y="1162" width="79" height="30" rx="3"/>
<text class="sm" x="409" y="1181" text-anchor="middle"><tspan class="r">no office</tspan></text>
<line class="ln" x1="452" y1="1177" x2="472" y2="1177" marker-end="url(#ah)"/>
<rect class="bx" x="475" y="1162" width="95" height="30" rx="3"/>
<text class="sm" x="522" y="1181" text-anchor="middle"><tspan class="r">vote invalid</tspan></text>
<line class="ln" x1="340" y1="1193" x2="340" y2="1214" marker-end="url(#ah)"/>
<rect class="bx" x="281" y="1216" width="117" height="30" rx="3"/>
<text class="sm" x="340" y="1235" text-anchor="middle"><tspan class="k">decided by</tspan><tspan class="r" style="font-weight:700"> ECI</tspan></text>
</svg>
