<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – Local Bodies, North East and Elections</h2>
<svg class="n" width="100%" viewBox="0 0 680 2267" role="img"><title>NCRWC Recommendations – Local Bodies, North East and Elections</title><desc>NCRWC Recommendations – Local Bodies, North East and Elections</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="52" y="26" width="575" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – Local Bodies, North East and Elections</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">10. On Decentralisation (Panchayats and Municipalities)</tspan></text>
<text x="56" y="122" class="r" style="font-weight:700">1.</text>
<text x="82" y="122"><tspan class="h" style="font-weight:700">Separate fiscal domain:</tspan><tspan class="k"> The</tspan><tspan class="r"> Eleventh and Twelfth Schedules</tspan><tspan class="k"> of the Constitution</tspan></text>
<text x="82" y="144"><tspan class="k">should be restructured in a manner that creates a</tspan><tspan class="r"> separate fiscal domain</tspan><tspan class="k"> for</tspan></text>
<text x="82" y="166"><tspan class="k">panchayats and municipalities.</tspan></text>
<text x="56" y="192" class="r" style="font-weight:700">2.</text>
<text x="82" y="192"><tspan class="h" style="font-weight:700">State panchayat council:</tspan><tspan class="r"> State panchayat council</tspan><tspan class="k"> should be established under the</tspan></text>
<text x="82" y="214"><tspan class="k">chairmanship of the</tspan><tspan class="r"> chief minister</tspan><tspan class="k">.</tspan></text>
<text x="56" y="240" class="r" style="font-weight:700">3.</text>
<text x="82" y="240"><tspan class="h" style="font-weight:700">Institutions of self-government:</tspan><tspan class="k"> Panchayats and Municipalities should be</tspan></text>
<text x="82" y="262"><tspan class="k">categorically declared to be ‘</tspan><tspan class="r">institutions of self-government</tspan><tspan class="k">’ and</tspan><tspan class="r"> exclusive functions</tspan></text>
<text x="82" y="284"><tspan class="k">be assigned to them. For this purpose,</tspan><tspan class="b"> Articles 243-G and 243-W</tspan><tspan class="k"> should be</tspan></text>
<text x="82" y="306"><tspan class="k">suitably amended.</tspan></text>
<text x="56" y="332" class="r" style="font-weight:700">4.</text>
<text x="82" y="332"><tspan class="h" style="font-weight:700">ECI over SECs:</tspan><tspan class="k"> The</tspan><tspan class="r"> Election Commission of India</tspan><tspan class="k"> should have the power to</tspan><tspan class="r"> issue</tspan></text>
<text x="82" y="354"><tspan class="r">directions to the State Election Commission</tspan><tspan class="k"> for the discharge of its functions. The</tspan></text>
<text x="82" y="376"><tspan class="k">State Election Commission should submit its annual or special reports to the</tspan></text>
<text x="82" y="398"><tspan class="k">Election Commission of India and to the Governor. This requires the amendment of</tspan></text>
<text x="82" y="420"><tspan class="b">Articles 243-K and 243-ZA</tspan><tspan class="k">.</tspan></text>
<text x="56" y="446" class="r" style="font-weight:700">5.</text>
<text x="82" y="446"><tspan class="h" style="font-weight:700">Hearing before dissolution:</tspan><tspan class="r"> Article 243-E</tspan><tspan class="k"> should be amended to the effect that a</tspan></text>
<text x="82" y="468"><tspan class="r">reasonable opportunity of being heard</tspan><tspan class="k"> shall be given to a Panchayat before it is</tspan></text>
<text x="82" y="490"><tspan class="k">dissolved.</tspan></text>
<text x="56" y="516" class="r" style="font-weight:700">6.</text>
<text x="82" y="516"><tspan class="h" style="font-weight:700">CAG audit of panchayats:</tspan><tspan class="k"> To ensure uniformity in the practice relating to audit of</tspan></text>
<text x="82" y="538"><tspan class="k">accounts, the</tspan><tspan class="r"> CAG of India</tspan><tspan class="k"> should be empowered to conduct the audit or lay down</tspan></text>
<text x="82" y="560"><tspan class="r">accounting standards for Panchayats</tspan><tspan class="k">.</tspan></text>
<text x="56" y="586" class="r" style="font-weight:700">7.</text>
<text x="82" y="586"><tspan class="h" style="font-weight:700">Report on supersession:</tspan><tspan class="k"> Whenever a</tspan><tspan class="r"> Municipality is superseded</tspan><tspan class="k">, a</tspan><tspan class="r"> report stating</tspan></text>
<text x="82" y="608"><tspan class="r">the grounds</tspan><tspan class="k"> for such dissolution should be placed before the State Legislature.</tspan></text>
<text x="56" y="634" class="r" style="font-weight:700">8.</text>
<text x="82" y="634"><tspan class="h" style="font-weight:700">Single law on eligibility:</tspan><tspan class="k"> All provisions regarding</tspan><tspan class="r"> qualifications and disqualifications</tspan></text>
<text x="82" y="656"><tspan class="k">for elections to local authorities should be consolidated in a</tspan><tspan class="r"> single law</tspan><tspan class="k">.</tspan></text>
<text x="56" y="682" class="r" style="font-weight:700">9.</text>
<text x="82" y="682"><tspan class="h" style="font-weight:700">Delimitation Commission for local bodies:</tspan><tspan class="k"> The functions of</tspan><tspan class="r"> delimitation,</tspan></text>
<text x="82" y="704"><tspan class="r">reservation and rotation of seats</tspan><tspan class="k"> should be vested in a</tspan><tspan class="r"> Delimitation Commission</tspan></text>
<text x="82" y="726"><tspan class="k">and not in the State Election Commission.</tspan></text>
<text x="56" y="752" class="r" style="font-weight:700">10.</text>
<text x="82" y="752"><tspan class="h" style="font-weight:700">Municipal tax domain:</tspan><tspan class="k"> The concept of a</tspan><tspan class="r"> distinct and separate tax domain for</tspan></text>
<text x="82" y="774"><tspan class="r">municipalities</tspan><tspan class="k"> should be recognized.</tspan></text>
<path d="M50 102 L44 102 L44 780 L50 780" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="802"><tspan class="r" style="font-weight:700">11. On Institutions in North East India</tspan></text>
<text x="56" y="830" class="r" style="font-weight:700">1.</text>
<text x="78" y="830"><tspan class="h" style="font-weight:700">73rd/74th benefits for NE:</tspan><tspan class="k"> Efforts are to be made to give all the States in this</tspan></text>
<text x="78" y="852"><tspan class="k">region the opportunities provided under the</tspan><tspan class="r"> 73rd and 74th Constitutional</tspan></text>
<text x="78" y="874"><tspan class="r">Amendments</tspan><tspan class="k">. However, this should be done with due regard to the</tspan><tspan class="b"> unique political</tspan></text>
<text x="78" y="896"><tspan class="b">traditions</tspan><tspan class="k"> of the region.</tspan></text>
<text x="56" y="922" class="r" style="font-weight:700">2.</text>
<text x="78" y="922"><tspan class="h" style="font-weight:700">Empower ADCs:</tspan><tspan class="k"> The subjects given under the</tspan><tspan class="r"> Sixth Schedule</tspan><tspan class="k"> and those mentioned</tspan></text>
<text x="78" y="944"><tspan class="k">in the</tspan><tspan class="r"> Eleventh Schedule</tspan><tspan class="k"> could be entrusted to the</tspan><tspan class="r"> Autonomous District Councils</tspan></text>
<text x="78" y="966"><tspan class="r">(ADCs)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="992" class="r" style="font-weight:700">3.</text>
<text x="78" y="992"><tspan class="h" style="font-weight:700">Traditional governance:</tspan><tspan class="r"> Traditional forms of governance</tspan><tspan class="k"> should be associated with</tspan></text>
<text x="78" y="1014"><tspan class="k">self-governance because of the present dissatisfaction.</tspan></text>
<text x="56" y="1040" class="r" style="font-weight:700">4.</text>
<text x="78" y="1040"><tspan class="h" style="font-weight:700">National Immigration Council:</tspan><tspan class="k"> A</tspan><tspan class="r"> National Immigration Council</tspan><tspan class="k"> should be set up to</tspan></text>
<text x="78" y="1062"><tspan class="k">examine a range of issues including a review of the</tspan><tspan class="b"> Citizenship Act, the Illegal</tspan></text>
<text x="78" y="1084"><tspan class="b">Migrants Determination by Tribunal Act, the Foreigners Act</tspan><tspan class="k"> and so on.</tspan></text>
<path d="M50 810 L44 810 L44 1090 L50 1090" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1112"><tspan class="r" style="font-weight:700">12. On Electoral Processes</tspan></text>
<text x="56" y="1140" class="r" style="font-weight:700">1.</text>
<text x="83" y="1140"><tspan class="h" style="font-weight:700">Disqualify on charges (5+ years):</tspan><tspan class="k"> Any person</tspan><tspan class="r"> charged with any offence</tspan></text>
<text x="83" y="1162"><tspan class="r">punishable with imprisonment for a maximum term of five years or more</tspan><tspan class="k">, should be</tspan></text>
<text x="83" y="1184"><tspan class="r">disqualified</tspan><tspan class="k"> from being chosen as or for being a member of Parliament or</tspan></text>
<text x="83" y="1206"><tspan class="k">Legislature of a State.</tspan></text>
<text x="56" y="1232" class="r" style="font-weight:700">2.</text>
<text x="83" y="1232"><tspan class="h" style="font-weight:700">Permanent bar for heinous crimes:</tspan><tspan class="k"> Any person convicted for any</tspan><tspan class="r"> heinous crime</tspan></text>
<text x="83" y="1254"><tspan class="k">like murder, rape, smuggling, dacoity, etc., should be</tspan><tspan class="r"> permanently debarred</tspan><tspan class="k"> from</tspan></text>
<text x="83" y="1276"><tspan class="k">contesting for any political office.</tspan></text>
<text x="56" y="1302" class="r" style="font-weight:700">3.</text>
<text x="83" y="1302"><tspan class="h" style="font-weight:700">Special courts for politicians:</tspan><tspan class="r"> Criminal cases against politicians</tspan><tspan class="k"> pending before</tspan></text>
<text x="83" y="1324"><tspan class="k">Courts either for trial or in appeal must be disposed of speedily, if necessary, by</tspan></text>
<text x="83" y="1346"><tspan class="k">appointing</tspan><tspan class="r"> Special Courts</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1372" class="r" style="font-weight:700">4.</text>
<text x="83" y="1372"><tspan class="h" style="font-weight:700">Election benches:</tspan><tspan class="k"> The</tspan><tspan class="r"> election petitions</tspan><tspan class="k"> should also be decided by</tspan><tspan class="r"> special courts</tspan><tspan class="k">.</tspan></text>
<text x="83" y="1394"><tspan class="k">In the alternative,</tspan><tspan class="b"> special election benches</tspan><tspan class="k"> may be constituted in the High Courts</tspan></text>
<text x="83" y="1416"><tspan class="k">and earmarked exclusively for the disposal of election petitions and election</tspan></text>
<text x="83" y="1438"><tspan class="k">disputes.</tspan></text>
<text x="56" y="1464" class="r" style="font-weight:700">5.</text>
<text x="83" y="1464"><tspan class="h" style="font-weight:700">State funding deferred:</tspan><tspan class="k"> Any system of</tspan><tspan class="r"> State funding of elections</tspan><tspan class="k"> bears a close</tspan></text>
<text x="83" y="1486"><tspan class="k">nexus to the regulation of working of political parties by law and to the creation of</tspan></text>
<text x="83" y="1508"><tspan class="k">a foolproof mechanism under law with a view to implementing the financial limits</tspan></text>
<text x="83" y="1530"><tspan class="k">strictly. Therefore, proposals for State funding should be</tspan><tspan class="r"> deferred</tspan><tspan class="k"> till these</tspan></text>
<text x="83" y="1552"><tspan class="k">regulatory mechanisms are firmly in position.</tspan></text>
<text x="56" y="1578" class="r" style="font-weight:700">6.</text>
<text x="83" y="1578"><tspan class="h" style="font-weight:700">One constituency only:</tspan><tspan class="k"> Candidates should</tspan><tspan class="r"> not be allowed to contest election</tspan></text>
<text x="83" y="1600"><tspan class="r">simultaneously</tspan><tspan class="k"> for the same office from</tspan><tspan class="r"> more than one constituency</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1626" class="r" style="font-weight:700">7.</text>
<text x="83" y="1626"><tspan class="h" style="font-weight:700">Statutory code of conduct:</tspan><tspan class="k"> The</tspan><tspan class="r"> election code of conduct</tspan><tspan class="k"> should be given the</tspan></text>
<text x="83" y="1648"><tspan class="r">sanctity of law</tspan><tspan class="k"> and its violation should attract penal action.</tspan></text>
<text x="56" y="1674" class="r" style="font-weight:700">8.</text>
<text x="83" y="1674"><tspan class="h" style="font-weight:700">50% + 1 vote:</tspan><tspan class="k"> The Commission while recognizing the beneficial potential of the</tspan></text>
<text x="83" y="1696"><tspan class="k">system of</tspan><tspan class="r"> run off contest</tspan><tspan class="k"> electing the representative winning on the basis of</tspan><tspan class="r"> 50</tspan></text>
<text x="83" y="1718"><tspan class="r">per cent plus one vote</tspan><tspan class="k"> polled, as against the present</tspan><tspan class="b"> first-past-the-post system</tspan><tspan class="k">,</tspan></text>
<text x="83" y="1740"><tspan class="k">for a more representative democracy, recommends that the Government and the</tspan></text>
<text x="83" y="1762"><tspan class="k">Election Commission of India should examine this issue of prescribing a minimum</tspan></text>
<text x="83" y="1784"><tspan class="k">of 50 per cent plus one vote for election in all its aspects.</tspan></text>
<text x="56" y="1810" class="r" style="font-weight:700">9.</text>
<text x="83" y="1810"><tspan class="h" style="font-weight:700">Bar on serial losers:</tspan><tspan class="k"> An</tspan><tspan class="r"> independent candidate who loses election three times</tspan></text>
<text x="83" y="1832"><tspan class="r">consecutively</tspan><tspan class="k"> should be</tspan><tspan class="r"> permanently debarred</tspan><tspan class="k"> from contesting election to the same</tspan></text>
<text x="83" y="1854"><tspan class="k">office.</tspan></text>
<text x="56" y="1880" class="r" style="font-weight:700">10.</text>
<text x="83" y="1880"><tspan class="h" style="font-weight:700">Deposit threshold 25%:</tspan><tspan class="k"> The minimum number of valid votes polled should be</tspan></text>
<text x="83" y="1902"><tspan class="k">increased to</tspan><tspan class="r"> 25 per cent</tspan><tspan class="k"> from the current</tspan><tspan class="r"> 16.67 per cent</tspan><tspan class="k"> as a condition for the</tspan></text>
<text x="83" y="1924"><tspan class="b">deposit not being forfeited</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1950" class="r" style="font-weight:700">11.</text>
<text x="83" y="1950"><tspan class="h" style="font-weight:700">Foreign-born in high offices:</tspan><tspan class="k"> The issue of eligibility of</tspan><tspan class="r"> non-Indian born citizens</tspan><tspan class="k"> or</tspan></text>
<text x="83" y="1972"><tspan class="k">those whose parents or grandparents were citizens of India to hold</tspan><tspan class="r"> high offices</tspan><tspan class="k"> in</tspan></text>
<text x="83" y="1994"><tspan class="k">the realm such as President, Vice-President, Prime Minister and Chief Justice of</tspan></text>
<text x="83" y="2016"><tspan class="k">India should be examined in depth through a political process after a</tspan><tspan class="b"> national</tspan></text>
<text x="83" y="2038"><tspan class="b">dialogue</tspan><tspan class="k">⁷.</tspan></text>
<text x="56" y="2064" class="r" style="font-weight:700">12.</text>
<text x="83" y="2064"><tspan class="h" style="font-weight:700">Collegium for Election Commissioners:</tspan><tspan class="k"> The</tspan><tspan class="r"> Chief Election Commissioner and the</tspan></text>
<text x="83" y="2086"><tspan class="r">other Election Commissioners</tspan><tspan class="k"> should be appointed on the recommendation of a</tspan></text>
<text x="83" y="2108"><tspan class="k">body consisting of the</tspan><tspan class="b"> Prime Minister, Leader of the Opposition in the Lok Sabha,</tspan></text>
<text x="83" y="2130"><tspan class="b">Leader of the Opposition in the Rajya Sabha, the Speaker of the Lok Sabha and</tspan></text>
<text x="83" y="2152"><tspan class="b">the Deputy Chairman of the Rajya Sabha</tspan><tspan class="k">. Similar procedure should be adopted in</tspan></text>
<text x="83" y="2174"><tspan class="k">the case of appointment of</tspan><tspan class="r"> State Election Commissioners</tspan><tspan class="k">.</tspan></text>
<path d="M50 1120 L44 1120 L44 2180 L50 2180" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="2210"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> The Commission was deeply divided on this issue and because of this, P.A. Sangma left the</tspan></text>
<text class="xs" x="50" y="2228"><tspan class="k">Commission.</tspan></text>
