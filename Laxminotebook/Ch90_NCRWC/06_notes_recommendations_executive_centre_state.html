<div id="vis-container"><h2 class="sr-only">NCRWC Recommendations – Executive and Centre-State</h2>
<svg class="n" width="100%" viewBox="0 0 680 1770" role="img"><title>NCRWC Recommendations – Executive and Centre-State</title><desc>NCRWC Recommendations – Executive and Centre-State</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="94" y="26" width="492" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC Recommendations – Executive and Centre-State</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">6. On Executive and Administration</tspan></text>
<text x="56" y="122" class="r" style="font-weight:700">1.</text>
<text x="83" y="122"><tspan class="h" style="font-weight:700">Lok Sabha elects PM (hung House):</tspan><tspan class="k"> In case of</tspan><tspan class="r"> hung Parliament</tspan><tspan class="k">, the</tspan><tspan class="r"> Lok Sabha</tspan></text>
<text x="83" y="144"><tspan class="r">may elect the leader of the House</tspan><tspan class="k">. He/she may then be appointed as the prime</tspan></text>
<text x="83" y="166"><tspan class="k">minister by the President. The same procedure could be followed at the state level</tspan></text>
<text x="83" y="188"><tspan class="k">also.</tspan></text>
<text x="56" y="214" class="r" style="font-weight:700">2.</text>
<text x="83" y="214"><tspan class="h" style="font-weight:700">Constructive vote of no-confidence:</tspan><tspan class="k"> A motion of no-confidence against a prime</tspan></text>
<text x="83" y="236"><tspan class="k">minister must be accompanied by a</tspan><tspan class="r"> proposal of alternative leader</tspan><tspan class="k"> to be voted</tspan></text>
<text x="83" y="258"><tspan class="k">simultaneously. This is called as the ‘</tspan><tspan class="r">system of constructive vote of no confidence</tspan><tspan class="k">’.</tspan></text>
<text x="56" y="284" class="r" style="font-weight:700">3.</text>
<text x="83" y="284"><tspan class="h" style="font-weight:700">20% for no-confidence notice:</tspan><tspan class="k"> For a motion of no-confidence to be brought out</tspan></text>
<text x="83" y="306"><tspan class="k">against the government, at least</tspan><tspan class="r"> 20 per cent</tspan><tspan class="k"> of the total number of members of</tspan></text>
<text x="83" y="328"><tspan class="k">the House should give notice.</tspan></text>
<text x="56" y="354" class="r" style="font-weight:700">4.</text>
<text x="83" y="354"><tspan class="h" style="font-weight:700">Ministry ceiling – 10%:</tspan><tspan class="k"> The practice of having</tspan><tspan class="r"> oversized Council of Ministers</tspan></text>
<text x="83" y="376"><tspan class="k">should be prohibited by law. A ceiling on the number of Ministers in any State or</tspan></text>
<text x="83" y="398"><tspan class="k">the Union government be fixed at the maximum of</tspan><tspan class="r"> 10 per cent</tspan><tspan class="k"> of the total</tspan></text>
<text x="83" y="420"><tspan class="k">strength of the popular house of the legislature.</tspan></text>
<text x="56" y="446" class="r" style="font-weight:700">5.</text>
<text x="83" y="446"><tspan class="h" style="font-weight:700">Political offices – 2%:</tspan><tspan class="k"> The practice of creating a number of</tspan><tspan class="r"> political offices</tspan><tspan class="k"> with</tspan></text>
<text x="83" y="468"><tspan class="k">the position, perks and privileges of a minister should be discouraged. Their number</tspan></text>
<text x="83" y="490"><tspan class="k">should be limited to</tspan><tspan class="r"> 2 per cent</tspan><tspan class="k"> of the total strength of the lower house.</tspan></text>
<text x="56" y="516" class="r" style="font-weight:700">6.</text>
<text x="83" y="516"><tspan class="h" style="font-weight:700">Lokpal &amp; Lokayuktas:</tspan><tspan class="k"> The Constitution should provide for appointment of</tspan><tspan class="r"> Lokpal</tspan></text>
<text x="83" y="538"><tspan class="k">keeping the</tspan><tspan class="b"> prime minister outside its purview</tspan><tspan class="k"> and the institution of</tspan><tspan class="r"> lokayuktas</tspan><tspan class="k"> in</tspan></text>
<text x="83" y="560"><tspan class="k">the states.</tspan></text>
<text x="56" y="586" class="r" style="font-weight:700">7.</text>
<text x="83" y="586"><tspan class="h" style="font-weight:700">Lateral entry:</tspan><tspan class="r"> Lateral entry</tspan><tspan class="k"> into government jobs above</tspan><tspan class="r"> joint secretary level</tspan><tspan class="k"> should</tspan></text>
<text x="83" y="608"><tspan class="k">be allowed.</tspan></text>
<text x="56" y="634" class="r" style="font-weight:700">8.</text>
<text x="83" y="634"><tspan class="h" style="font-weight:700">Amend Article 311:</tspan><tspan class="r"> Article 311</tspan><tspan class="k"> should be amended to ensure not only</tspan><tspan class="b"> protection to</tspan></text>
<text x="83" y="656"><tspan class="b">the honest public servants</tspan><tspan class="k"> but</tspan><tspan class="r"> penalisation to dishonest ones</tspan><tspan class="k">.</tspan></text>
<text x="56" y="682" class="r" style="font-weight:700">9.</text>
<text x="83" y="682"><tspan class="h" style="font-weight:700">Civil Service Boards:</tspan><tspan class="k"> The questions of personnel policy including placements,</tspan></text>
<text x="83" y="704"><tspan class="k">promotions, transfers and fast-track advancements should be managed by</tspan></text>
<text x="83" y="726"><tspan class="r">autonomous Civil Service Boards</tspan><tspan class="k"> constituted under statutory provisions.</tspan></text>
<text x="56" y="752" class="r" style="font-weight:700">10.</text>
<text x="83" y="752"><tspan class="h" style="font-weight:700">Oath of good governance:</tspan><tspan class="k"> Officials, before starting their career, in addition to the</tspan></text>
<text x="83" y="774"><tspan class="k">taking of an oath of loyalty to the Constitution, should swear to abide by the</tspan></text>
<text x="83" y="796"><tspan class="r">principles of good governance</tspan><tspan class="k">.</tspan></text>
<text x="56" y="822" class="r" style="font-weight:700">11.</text>
<text x="83" y="822"><tspan class="h" style="font-weight:700">Oath of transparency:</tspan><tspan class="r"> Right to information</tspan><tspan class="k"> should be guaranteed and the</tspan></text>
<text x="83" y="844"><tspan class="k">traditional insistence on secrecy should be discarded. In fact, there should be an</tspan></text>
<text x="83" y="866"><tspan class="r">oath of transparency in place of an oath of secrecy</tspan><tspan class="k">.</tspan></text>
<text x="56" y="892" class="r" style="font-weight:700">12.</text>
<text x="83" y="892"><tspan class="h" style="font-weight:700">Whistle-blower Acts:</tspan><tspan class="r"> Public Interest Disclosure Acts</tspan><tspan class="k"> (which are popularly called</tspan></text>
<text x="83" y="914"><tspan class="k">the</tspan><tspan class="r"> Whistle-blower Acts</tspan><tspan class="k">) may be enacted to fight corruption and</tspan></text>
<text x="83" y="936"><tspan class="k">mal-administration.</tspan></text>
<text x="56" y="962" class="r" style="font-weight:700">13.</text>
<text x="83" y="962"><tspan class="h" style="font-weight:700">Forfeit benami property:</tspan><tspan class="k"> A law should be enacted to provide for</tspan><tspan class="r"> forfeiture of</tspan></text>
<text x="83" y="984"><tspan class="r">benami property</tspan><tspan class="k"> of corrupt public servants as well as non-public servants.</tspan></text>
<path d="M50 102 L44 102 L44 990 L50 990" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1012"><tspan class="r" style="font-weight:700">7. On Centre-State and Inter-State Relations</tspan></text>
<text x="56" y="1040" class="r" style="font-weight:700">1.</text>
<text x="82" y="1040"><tspan class="h" style="font-weight:700">ISC consultation matters:</tspan><tspan class="k"> The</tspan><tspan class="r"> Inter-State Council Order of 1990</tspan><tspan class="k"> may clearly</tspan></text>
<text x="82" y="1062"><tspan class="k">specify the matters that should form the parts of consultations.</tspan></text>
<text x="56" y="1088" class="r" style="font-weight:700">2.</text>
<text x="82" y="1088"><tspan class="h" style="font-weight:700">Disasters in Concurrent List:</tspan><tspan class="r"> Management of disasters and emergencies</tspan><tspan class="k"> (both</tspan></text>
<text x="82" y="1110"><tspan class="k">natural and manmade) should be included in the</tspan><tspan class="r"> List III (Concurrent List)</tspan><tspan class="k"> of the</tspan></text>
<text x="82" y="1132"><tspan class="k">Seventh Schedule.</tspan></text>
<text x="56" y="1158" class="r" style="font-weight:700">3.</text>
<text x="82" y="1158"><tspan class="h" style="font-weight:700">Inter-State Trade Commission:</tspan><tspan class="k"> A statutory body called the</tspan><tspan class="r"> Inter-State Trade and</tspan></text>
<text x="82" y="1180"><tspan class="r">Commerce Commission</tspan><tspan class="k"> should be established.</tspan></text>
<text x="56" y="1206" class="r" style="font-weight:700">4.</text>
<text x="82" y="1206"><tspan class="h" style="font-weight:700">CM consultation on Governor:</tspan><tspan class="k"> The President should appoint the</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state</tspan></text>
<text x="82" y="1228"><tspan class="k">only after</tspan><tspan class="r"> consultation with the chief minister</tspan><tspan class="k"> of that state.</tspan></text>
<text x="56" y="1254" class="r" style="font-weight:700">5.</text>
<text x="82" y="1254"><tspan class="h" style="font-weight:700">Art. 356 – last resort:</tspan><tspan class="r"> Article 356 should not be deleted</tspan><tspan class="k">, but it must be used</tspan></text>
<text x="82" y="1276"><tspan class="r">sparingly and only as a remedy of the last resort</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1302" class="r" style="font-weight:700">6.</text>
<text x="82" y="1302"><tspan class="h" style="font-weight:700">Floor test:</tspan><tspan class="k"> The question whether the ministry in a state has lost the confidence of</tspan></text>
<text x="82" y="1324"><tspan class="k">the assembly or not should be tested</tspan><tspan class="r"> only on the floor of the House</tspan><tspan class="k">. The Governor</tspan></text>
<text x="82" y="1346"><tspan class="k">should not be allowed to dismiss the ministry, so long as it enjoys the confidence</tspan></text>
<text x="82" y="1368"><tspan class="k">of the House.</tspan></text>
<text x="56" y="1394" class="r" style="font-weight:700">7.</text>
<text x="82" y="1394"><tspan class="h" style="font-weight:700">PR beyond one year:</tspan><tspan class="k"> Even without the state being under a proclamation of</tspan></text>
<text x="82" y="1416"><tspan class="k">emergency,</tspan><tspan class="r"> President’s Rule may be continued if elections cannot be held</tspan><tspan class="k">. Article</tspan></text>
<text x="82" y="1438"><tspan class="k">356 should be amended to this effect.</tspan></text>
<text x="56" y="1464" class="r" style="font-weight:700">8.</text>
<text x="82" y="1464"><tspan class="h" style="font-weight:700">No dissolution before Parliament’s approval:</tspan><tspan class="k"> The</tspan><tspan class="r"> State Assembly should not be</tspan></text>
<text x="82" y="1486"><tspan class="r">dissolved</tspan><tspan class="k"> before the proclamation issued under Article 356 has been</tspan><tspan class="r"> laid before</tspan></text>
<text x="82" y="1508"><tspan class="r">Parliament</tspan><tspan class="k">. Article 356 should be amended to ensure this.</tspan></text>
<text x="56" y="1534" class="r" style="font-weight:700">9.</text>
<text x="82" y="1534"><tspan class="h" style="font-weight:700">River disputes – larger SC bench:</tspan><tspan class="r"> River water disputes</tspan><tspan class="k"> between States and/ or</tspan></text>
<text x="82" y="1556"><tspan class="k">the Centre should be heard and disposed by a bench of</tspan><tspan class="r"> not less than three judges</tspan></text>
<text x="82" y="1578"><tspan class="k">and if necessary, a bench of</tspan><tspan class="r"> five judges</tspan><tspan class="k"> of the Supreme Court for the final disposal</tspan></text>
<text x="82" y="1600"><tspan class="k">of the suit.</tspan></text>
<text x="56" y="1626" class="r" style="font-weight:700">10.</text>
<text x="82" y="1626"><tspan class="h" style="font-weight:700">Replace River Boards Act:</tspan><tspan class="k"> Parliament should replace the</tspan><tspan class="r"> River Boards Act of 1956</tspan></text>
<text x="82" y="1648"><tspan class="k">with another comprehensive enactment after consultation with all the states.</tspan></text>
<text x="56" y="1674" class="r" style="font-weight:700">11.</text>
<text x="82" y="1674"><tspan class="h" style="font-weight:700">Time-limit on reserved bills:</tspan><tspan class="k"> When the state bill is</tspan><tspan class="r"> reserved for consideration of</tspan></text>
<text x="82" y="1696"><tspan class="r">the President</tspan><tspan class="k">, there should be a</tspan><tspan class="r"> time-limit (say three months)</tspan><tspan class="k"> within which the</tspan></text>
<text x="82" y="1718"><tspan class="k">President should take a decision whether to give his/her assent or to return the</tspan></text>
<text x="82" y="1740"><tspan class="k">bill.</tspan></text>
