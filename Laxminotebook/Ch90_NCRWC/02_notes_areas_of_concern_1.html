<div id="vis-container"><h2 class="sr-only">NCRWC – Areas of Concern I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1339" role="img"><title>NCRWC – Areas of Concern I</title><desc>NCRWC – Areas of Concern I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="200" y="26" width="281" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">NCRWC – Areas of Concern I</text>
<text class="lb" x="40" y="98">Areas of Concern</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Commission’s perception:</tspan><tspan class="k"> The following are the important</tspan><tspan class="r"> areas of concern</tspan><tspan class="k"> according to</tspan></text>
<text x="56" y="150"><tspan class="k">the perception of the Commission³:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">1.</text>
<text x="78" y="176"><tspan class="h" style="font-weight:700">Breach of constitutional faith:</tspan><tspan class="k"> There is a</tspan><tspan class="r"> fundamental breach of the</tspan></text>
<text x="78" y="198"><tspan class="r">constitutional faith</tspan><tspan class="k"> on the part of Governments and their method of governance lies</tspan></text>
<text x="78" y="220"><tspan class="k">in the</tspan><tspan class="b"> neglect of the people</tspan><tspan class="k"> who are the ultimate source of all political authority.</tspan></text>
<text x="78" y="242"><tspan class="k">Public servants and institutions are not alive to the basic imperative that they are</tspan></text>
<text x="78" y="264"><tspan class="b">servants of the people</tspan><tspan class="k"> meant to serve them. The</tspan><tspan class="r"> dignity of the individual</tspan><tspan class="k"> enshrined</tspan></text>
<text x="78" y="286"><tspan class="k">in the Constitution has remained an</tspan><tspan class="r"> unredeemed pledge</tspan><tspan class="k">. There is, thus, a</tspan><tspan class="r"> loss of</tspan></text>
<text x="78" y="308"><tspan class="r">faith in the Governments and governance</tspan><tspan class="k">. Citizens see their Governments besieged</tspan></text>
<text x="78" y="330"><tspan class="k">by uncontrollable events and are losing faith in institutions. Society is unable to</tspan></text>
<text x="78" y="352"><tspan class="k">cope up with current events.</tspan></text>
<text x="56" y="378" class="r" style="font-weight:700">2.</text>
<text x="78" y="378"><tspan class="h" style="font-weight:700">Unprepared Indian State:</tspan><tspan class="k"> The foremost area of concern is the present</tspan><tspan class="r"> nature of</tspan></text>
<text x="78" y="400"><tspan class="r">the Indian State</tspan><tspan class="k"> and its</tspan><tspan class="r"> inability to anticipate</tspan><tspan class="k"> and provide for the great</tspan><tspan class="b"> global</tspan></text>
<text x="78" y="422"><tspan class="b">forces of change</tspan><tspan class="k"> ushered in by the pace of scientific and technological</tspan></text>
<text x="78" y="444"><tspan class="k">developments.</tspan></text>
<text x="56" y="470" class="r" style="font-weight:700">3.</text>
<text x="78" y="470"><tspan class="h" style="font-weight:700">Cost of government &amp; fiscal deficits:</tspan><tspan class="k"> The next and equally important dimension is</tspan></text>
<text x="78" y="492"><tspan class="k">the</tspan><tspan class="r"> increasing cost of government and fiscal deficits</tspan><tspan class="k"> which are alarming.</tspan></text>
<text x="56" y="518" class="r" style="font-weight:700">4.</text>
<text x="78" y="518"><tspan class="h" style="font-weight:700">Criminalisation of politics:</tspan><tspan class="k"> There is a pervasive</tspan><tspan class="r"> impurity of the political climate</tspan></text>
<text x="78" y="540"><tspan class="k">and of political activity.</tspan><tspan class="r"> Criminalisation of politics, political-corruption and the</tspan></text>
<text x="78" y="562"><tspan class="r">politician-criminal-bureaucratic nexus</tspan><tspan class="k"> have reached unprecedented levels of needing</tspan></text>
<text x="78" y="584"><tspan class="k">strong systemic changes.</tspan></text>
<text x="56" y="610" class="r" style="font-weight:700">5.</text>
<text x="78" y="610"><tspan class="h" style="font-weight:700">National security &amp; disaster management:</tspan><tspan class="k"> Issues of</tspan><tspan class="r"> national integrity and</tspan></text>
<text x="78" y="632"><tspan class="r">security</tspan><tspan class="k"> have not received adequate and thoughtful attention. Mechanisms for the</tspan></text>
<text x="78" y="654"><tspan class="k">assessment of</tspan><tspan class="b"> early warning symptoms of social unrest</tspan><tspan class="k"> are absent. Mechanisms for</tspan></text>
<text x="78" y="676"><tspan class="k">adequate and immediate state responses to</tspan><tspan class="r"> emergencies and disaster management</tspan></text>
<text x="78" y="698"><tspan class="k">are wholly inadequate. Administration, as a system for anticipating coming events</tspan></text>
<text x="78" y="720"><tspan class="k">and planning responses in advance, has failed. It has become</tspan><tspan class="r"> un-coordinated and</tspan></text>
<text x="78" y="742"><tspan class="r">directionless</tspan><tspan class="k"> amalgam of different departments often with over-lapping and even</tspan></text>
<text x="78" y="764"><tspan class="k">mutually conflicting jurisdictions, powers and responsibilities which merely acts as a</tspan></text>
<text x="78" y="786"><tspan class="k">reaction to problems. There are</tspan><tspan class="b"> no clear-cut standards or basis for fixing</tspan></text>
<text x="78" y="808"><tspan class="b">responsibilities</tspan><tspan class="k">.</tspan></text>
<text x="56" y="834" class="r" style="font-weight:700">6.</text>
<text x="78" y="834"><tspan class="h" style="font-weight:700">Fault-lines in democratic institutions:</tspan><tspan class="k"> Though India’s overall record and experience</tspan></text>
<text x="78" y="856"><tspan class="k">as a</tspan><tspan class="b"> working democracy</tspan><tspan class="k"> (despite many centrifugal forces) are worthy to mention</tspan></text>
<text x="78" y="878"><tspan class="k">and though the bases of democratic debate have widened with the</tspan><tspan class="b"> 73rd and 74th</tspan></text>
<text x="78" y="900"><tspan class="b">Constitutional amendments</tspan><tspan class="k">, the working of the institutions of parliamentary</tspan></text>
<text x="78" y="922"><tspan class="k">democracy, however, have thrown-up</tspan><tspan class="r"> serious fault-lines</tspan><tspan class="k">, which might, if unattended,</tspan></text>
<text x="78" y="944"><tspan class="k">prove destructive of the basic democratic values.</tspan></text>
<text x="56" y="970" class="r" style="font-weight:700">7.</text>
<text x="78" y="970"><tspan class="h" style="font-weight:700">Misuse of electoral process:</tspan><tspan class="k"> There is</tspan><tspan class="r"> pervasive misuse of the electoral process</tspan><tspan class="k"> and</tspan></text>
<text x="78" y="992"><tspan class="k">the electoral system is unable to prevent the</tspan><tspan class="r"> entry of persons with criminal record</tspan></text>
<text x="78" y="1014"><tspan class="k">into the portal of law-making institutions.</tspan></text>
<text x="56" y="1040" class="r" style="font-weight:700">8.</text>
<text x="78" y="1040"><tspan class="h" style="font-weight:700">Weak representative character:</tspan><tspan class="k"> The Parliament and the State Legislatures, owing</tspan></text>
<text x="78" y="1062"><tspan class="k">to the inherent weakness of the electoral system, have</tspan><tspan class="r"> failed to acquire adequate</tspan></text>
<text x="78" y="1084"><tspan class="r">representative character</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1110" class="r" style="font-weight:700">9.</text>
<text x="78" y="1110"><tspan class="h" style="font-weight:700">Political instability:</tspan><tspan class="k"> The increasing</tspan><tspan class="r"> instability of the elected governments</tspan><tspan class="k"> is</tspan></text>
<text x="78" y="1132"><tspan class="k">attributable to</tspan><tspan class="r"> opportunistic politics and unprincipled defections</tspan><tspan class="k">. The economic and</tspan></text>
<text x="78" y="1154"><tspan class="k">administrative costs of political instability are unaffordably high and their impact on</tspan></text>
<text x="78" y="1176"><tspan class="k">the polity is not clearly comprehended and realized. Though just</tspan><tspan class="b"> four Prime</tspan></text>
<text x="78" y="1198"><tspan class="b">Ministers ruled the country for 40 years out of the 54 years</tspan><tspan class="k"> of independence and</tspan></text>
<text x="78" y="1220"><tspan class="k">one political party alone was in power for 45 years, however,</tspan><tspan class="r"> 1989 onwards the</tspan></text>
<text x="78" y="1242"><tspan class="r">country saw five General Elections</tspan><tspan class="k"> to the Lok Sabha. Costs of this political</tspan></text>
<text x="78" y="1264"><tspan class="k">instability are simply</tspan><tspan class="r"> colossal</tspan><tspan class="k">.</tspan></text>
