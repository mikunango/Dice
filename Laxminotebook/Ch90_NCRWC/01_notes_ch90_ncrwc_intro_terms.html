<div id="vis-container"><h2 class="sr-only">NCRWC: setting up, terms of reference and eleven areas of study.</h2>
<svg class="n" width="100%" viewBox="0 0 680 1306" role="img"><title>CHAPTER 90 National Commission to Review the Working of the Constitution</title><desc>NCRWC: setting up, terms of reference and eleven areas of study.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 90 National Commission to Review the Working of the Constitution</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">NCRWC – Venkatachaliah Commission (2000):</tspan><tspan class="k"> The</tspan><tspan class="r"> National Commission to Review the</tspan></text>
<text x="56" y="116"><tspan class="r">Working of the Constitution (NCRWC)</tspan><tspan class="k"> was set up by a</tspan><tspan class="r"> resolution of the Government of</tspan></text>
<text x="56" y="138"><tspan class="r">India in 2000</tspan><tspan class="k">. It was an</tspan><tspan class="r"> 11-member Commission</tspan><tspan class="k"> headed by</tspan><tspan class="r"> M.N. Venkatachaliah</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="160"><tspan class="b">former Chief Justice of India</tspan><tspan class="k">¹. It submitted its report in</tspan><tspan class="r"> 2002</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="69" y="172" width="207" height="30" rx="3"/>
<text class="sm" x="173" y="191" text-anchor="middle"><tspan class="k">set up</tspan><tspan class="r"> 2000</tspan><tspan class="k"> (Govt resolution)</tspan></text>
<line class="ln" x1="279" y1="187" x2="299" y2="187" marker-end="url(#ah)"/>
<rect class="bx" x="302" y="172" width="95" height="30" rx="3"/>
<text class="sm" x="350" y="191" text-anchor="middle"><tspan class="r">11 members</tspan></text>
<line class="ln" x1="400" y1="187" x2="420" y2="187" marker-end="url(#ah)"/>
<rect class="bx" x="423" y="172" width="188" height="30" rx="3"/>
<text class="sm" x="517" y="191" text-anchor="middle"><tspan class="k">Chair:</tspan><tspan class="r"> M.N. Venkatachaliah</tspan></text>
<line class="ln" x1="340" y1="203" x2="340" y2="224" marker-end="url(#ah)"/>
<rect class="bx" x="291" y="226" width="98" height="30" rx="3"/>
<text class="sm" x="340" y="245" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 2002</tspan></text>
<text class="lb" x="40" y="288">Terms of Reference</text>
<text x="44" y="318"><tspan class="h" style="font-weight:700">Within basic structure:</tspan><tspan class="k"> According to the terms of reference, the commission was</tspan></text>
<text x="56" y="340"><tspan class="k">required to examine, in the light of the</tspan><tspan class="r"> experience of the past fifty years</tspan><tspan class="k">, as to how far</tspan></text>
<text x="56" y="362"><tspan class="k">the existing provisions of the Constitution are capable of responding to the needs of</tspan></text>
<text x="56" y="384"><tspan class="b">efficient, smooth and effective system of governance and socio-economic development</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="406"><tspan class="k">modern India and to recommend changes, if any. The terms of reference clearly specified</tspan></text>
<text x="56" y="428"><tspan class="k">that the commission should recommend changes that are required to be made in the</tspan></text>
<text x="56" y="450"><tspan class="k">Constitution</tspan><tspan class="r"> within the framework of parliamentary democracy</tspan><tspan class="k"> and</tspan><tspan class="r"> without interfering</tspan></text>
<text x="56" y="472"><tspan class="r">with the ‘basic structure’</tspan><tspan class="k"> or ‘basic features’ of the Constitution.</tspan></text>
<text x="44" y="500"><tspan class="h" style="font-weight:700">Review, not rewrite:</tspan><tspan class="k"> The commission clarified that its task was to</tspan><tspan class="r"> review the working of</tspan></text>
<text x="56" y="522"><tspan class="r">the Constitution and not to rewrite it</tspan><tspan class="k"> and its function was only</tspan><tspan class="r"> recommendatory and</tspan></text>
<text x="56" y="544"><tspan class="r">advisory</tspan><tspan class="k"> in nature. It was left to the</tspan><tspan class="r"> Parliament to accept or reject</tspan><tspan class="k"> any of the</tspan></text>
<text x="56" y="566"><tspan class="k">recommendations.</tspan></text>
<text x="44" y="594"><tspan class="h" style="font-weight:700">Eleven areas of study:</tspan><tspan class="k"> The commission had</tspan><tspan class="r"> no agenda</tspan><tspan class="k"> before it. On its own, it</tspan></text>
<text x="56" y="616"><tspan class="k">identified the</tspan><tspan class="r"> eleven areas of study</tspan><tspan class="k"> and proposed to examine them. They included the</tspan></text>
<text x="56" y="638"><tspan class="k">following²:</tspan></text>
<text x="56" y="664" class="r" style="font-weight:700">1.</text>
<text x="82" y="664"><tspan class="k">Strengthening the institutions of</tspan><tspan class="r"> parliamentary democracy</tspan><tspan class="k"> (working of the</tspan></text>
<text x="82" y="686"><tspan class="k">Legislature, the Executive and the Judiciary; their accountability; problems of</tspan></text>
<text x="82" y="708"><tspan class="k">administrative, social and economic cost of political instability; exploring the</tspan></text>
<text x="82" y="730"><tspan class="k">possibilities of stability within the discipline of parliamentary democracy).</tspan></text>
<text x="56" y="756" class="r" style="font-weight:700">2.</text>
<text x="82" y="756"><tspan class="r">Electoral reforms</tspan><tspan class="k">; standards in political life.</tspan></text>
<text x="56" y="782" class="r" style="font-weight:700">3.</text>
<text x="82" y="782"><tspan class="k">Pace of</tspan><tspan class="r"> socio-economic change and development</tspan><tspan class="k"> under the Constitution (assurance</tspan></text>
<text x="82" y="804"><tspan class="k">of social and economic rights: how fair? how fast? how equal?).</tspan></text>
<text x="56" y="830" class="r" style="font-weight:700">4.</text>
<text x="82" y="830"><tspan class="k">Promoting</tspan><tspan class="r"> literacy</tspan><tspan class="k">; generating</tspan><tspan class="r"> employment</tspan><tspan class="k">; ensuring</tspan><tspan class="r"> social security</tspan><tspan class="k">; alleviation of</tspan></text>
<text x="82" y="852"><tspan class="r">poverty</tspan><tspan class="k">.</tspan></text>
<text x="56" y="878" class="r" style="font-weight:700">5.</text>
<text x="82" y="878"><tspan class="r">Union-State relations</tspan><tspan class="k">.</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">6.</text>
<text x="82" y="904"><tspan class="r">Decentralization and devolution</tspan><tspan class="k">; empowerment and strengthening of Panchayati Raj</tspan></text>
<text x="82" y="926"><tspan class="k">Institutions.</tspan></text>
<text x="56" y="952" class="r" style="font-weight:700">7.</text>
<text x="82" y="952"><tspan class="k">Enlargement of</tspan><tspan class="r"> Fundamental Rights</tspan><tspan class="k">.</tspan></text>
<text x="56" y="978" class="r" style="font-weight:700">8.</text>
<text x="82" y="978"><tspan class="k">Effectuation of</tspan><tspan class="r"> Fundamental Duties</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1004" class="r" style="font-weight:700">9.</text>
<text x="82" y="1004"><tspan class="k">Effectuation of</tspan><tspan class="r"> Directive Principles</tspan><tspan class="k"> and achievement of the Preambular objectives</tspan></text>
<text x="82" y="1026"><tspan class="k">of the Constitution.</tspan></text>
<text x="56" y="1052" class="r" style="font-weight:700">10.</text>
<text x="82" y="1052"><tspan class="k">Legal control of</tspan><tspan class="r"> fiscal and monetary policies</tspan><tspan class="k">; public audit mechanism.</tspan></text>
<text x="56" y="1078" class="r" style="font-weight:700">11.</text>
<text x="82" y="1078"><tspan class="r">Administrative system</tspan><tspan class="k"> and standards in public life.</tspan></text>
<path d="M50 644 L44 644 L44 1084 L50 1084" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1114"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> The other members of the Commission were: B.P. Jeevan Reddy (Chairman of the Law</tspan></text>
<text class="xs" x="50" y="1132"><tspan class="k">Commission), R.S. Sarkaria (former judge of the Supreme Court), K. Punnayya (former judge of the</tspan></text>
<text class="xs" x="50" y="1150"><tspan class="k">Andhra Pradesh High Court), Soli Sorabjee (Attorney–General of India), K. Parasaran (former</tspan></text>
<text class="xs" x="50" y="1168"><tspan class="k">Attorney–General of India), Subhash Kashyap (former Secretary–General of Lok Sabha), C.R. Irani</tspan></text>
<text class="xs" x="50" y="1186"><tspan class="k">(Chief Editor and MD of the Statesman), Abid Hussain (former Ambassador of India to the USA),</tspan></text>
<text class="xs" x="50" y="1204"><tspan class="k">Smt. Sumitra Kulkarni (former MP) and P.A. Sangma (former Speaker of the Lok Sabha). P.A.</tspan></text>
<text class="xs" x="50" y="1222"><tspan class="k">Sangma resigned three months before the submission of the report by the Commission.</tspan></text>
<rect x="40" y="1092" width="600" height="139" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1267"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> Report of the Commission, Volume I, Chapter 1.</tspan></text>
<rect x="40" y="1245" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
