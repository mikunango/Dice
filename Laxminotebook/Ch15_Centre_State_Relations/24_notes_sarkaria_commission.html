<div id="vis-container"><h2 class="sr-only">Sarkaria Commission</h2>
<svg class="n" width="100%" viewBox="0 0 680 2059" role="img"><title>Sarkaria Commission</title><desc>Sarkaria Commission</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="232" y="26" width="215" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Sarkaria Commission</text>
<text class="lb" x="40" y="98">Sarkaria Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Sarkaria Commission (1983–88):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1983</tspan><tspan class="k">, the Central government appointed a</tspan></text>
<text x="56" y="150"><tspan class="r">three-member Commission</tspan><tspan class="k"> on Centre–state relations under the chairmanship of</tspan><tspan class="r"> R.S.</tspan></text>
<text x="56" y="172"><tspan class="r">Sarkaria</tspan><tspan class="k">, a</tspan><tspan class="b"> retired judge of the Supreme Court</tspan><tspan class="k">.²⁰ The commission was asked to examine</tspan></text>
<text x="56" y="194"><tspan class="k">and review the working of existing arrangements between the Centre and states in all</tspan></text>
<text x="56" y="216"><tspan class="k">spheres and recommend appropriate changes and measures. It submitted it’s report in</tspan></text>
<text x="56" y="238"><tspan class="r">1988</tspan><tspan class="k">.</tspan></text>
<text x="44" y="266"><tspan class="h" style="font-weight:700">Functional, not structural, change:</tspan><tspan class="k"> The Commission</tspan><tspan class="r"> did not favour structural changes</tspan></text>
<text x="56" y="288"><tspan class="k">and regarded the existing constitutional arrangements and principles relating to the</tspan></text>
<text x="56" y="310"><tspan class="k">institutions</tspan><tspan class="b"> basically sound</tspan><tspan class="k">. But, it emphasised on the need for changes in the</tspan><tspan class="r"> functional</tspan></text>
<text x="56" y="332"><tspan class="r">or operational aspects</tspan><tspan class="k">. It observed that federalism is more a</tspan><tspan class="r"> functional arrangement for</tspan></text>
<text x="56" y="354"><tspan class="r">co-operative action</tspan><tspan class="k"> than a static institutional concept. It outrightly</tspan><tspan class="r"> rejected the demand</tspan></text>
<text x="56" y="376"><tspan class="r">for curtailing the powers of the Centre</tspan><tspan class="k"> and stated that a</tspan><tspan class="r"> strong Centre</tspan><tspan class="k"> is essential to</tspan></text>
<text x="56" y="398"><tspan class="k">safeguard the</tspan><tspan class="b"> national unity and integrity</tspan><tspan class="k"> which is being threatened by the</tspan><tspan class="b"> fissiparous</tspan></text>
<text x="56" y="420"><tspan class="b">tendencies</tspan><tspan class="k"> in the body politic. However, it did</tspan><tspan class="r"> not equate strong Centre with</tspan></text>
<text x="56" y="442"><tspan class="r">centralisation of powers</tspan><tspan class="k">. It observed that</tspan><tspan class="r"> over-centralisation leads to blood pressure at</tspan></text>
<text x="56" y="464"><tspan class="r">the centre and anaemia at the periphery</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="478" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="496" text-anchor="middle"><tspan class="r" style="font-weight:700">✘ Not favoured</tspan></text>
<line class="ln" x1="190" y1="506" x2="190" y2="520" marker-end="url(#ah)"/>
<text class="sm" x="190" y="541" text-anchor="middle"><tspan class="k">structural changes</tspan></text>
<text class="sm" x="190" y="563" text-anchor="middle"><tspan class="k">curtailing Centre’s powers</tspan></text>
<rect class="bx" x="346" y="478" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="496" text-anchor="middle"><tspan class="r" style="font-weight:700">✔ Favoured</tspan></text>
<line class="ln" x1="490" y1="506" x2="490" y2="520" marker-end="url(#ah)"/>
<text class="sm" x="490" y="541" text-anchor="middle"><tspan class="k">functional / operational changes</tspan></text>
<text class="sm" x="490" y="563" text-anchor="middle"><tspan class="r">strong Centre</tspan><tspan class="k"> ≠ centralisation</tspan></text>
<line x1="340" y1="478" x2="340" y2="566" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="85" y="584" width="136" height="30" rx="3"/>
<text class="sm" x="153" y="603" text-anchor="middle"><tspan class="k">over-centralisation</tspan></text>
<line class="ln" x1="224" y1="599" x2="244" y2="599" marker-end="url(#ah)"/>
<rect class="bx" x="247" y="584" width="171" height="30" rx="3"/>
<text class="sm" x="332" y="603" text-anchor="middle"><tspan class="r">blood pressure</tspan><tspan class="k"> at centre</tspan></text>
<line class="ln" x1="421" y1="599" x2="441" y2="599" marker-end="url(#ah)"/>
<rect class="bx" x="444" y="584" width="152" height="30" rx="3"/>
<text class="sm" x="519" y="603" text-anchor="middle"><tspan class="b">anaemia</tspan><tspan class="k"> at periphery</tspan></text>
<text x="44" y="642"><tspan class="h" style="font-weight:700">247 recommendations:</tspan><tspan class="k"> The Commission made</tspan><tspan class="r"> 247 recommendations</tspan><tspan class="k"> to improve</tspan></text>
<text x="56" y="664"><tspan class="k">Centre–state relations. The important recommendations are mentioned below:</tspan></text>
<text x="56" y="690" class="r" style="font-weight:700">1.</text>
<text x="86" y="690"><tspan class="h" style="font-weight:700">Inter-Governmental Council (Art. 263):</tspan><tspan class="k"> A permanent Inter-State Council called</tspan></text>
<text x="86" y="712"><tspan class="k">the</tspan><tspan class="r"> Inter-Governmental Council</tspan><tspan class="k"> should be set up under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">.</tspan></text>
<text x="56" y="738" class="r" style="font-weight:700">2.</text>
<text x="86" y="738"><tspan class="h" style="font-weight:700">Art. 356 as last resort:</tspan><tspan class="r"> Article 356 (President’s Rule)</tspan><tspan class="k"> should be used</tspan><tspan class="r"> very</tspan></text>
<text x="86" y="760"><tspan class="r">sparingly</tspan><tspan class="k">, in extreme cases as a</tspan><tspan class="b"> last resort</tspan><tspan class="k"> when all the available alternatives fail.</tspan></text>
<text x="56" y="786" class="r" style="font-weight:700">3.</text>
<text x="86" y="786"><tspan class="h" style="font-weight:700">Strengthen AIS:</tspan><tspan class="k"> The institution of</tspan><tspan class="r"> All-India Services</tspan><tspan class="k"> should be</tspan><tspan class="b"> further</tspan></text>
<text x="86" y="808"><tspan class="b">strengthened</tspan><tspan class="k"> and more of such services should be created.</tspan></text>
<text x="56" y="834" class="r" style="font-weight:700">4.</text>
<text x="86" y="834"><tspan class="h" style="font-weight:700">Residuary powers – taxation vs others:</tspan><tspan class="k"> The</tspan><tspan class="r"> residuary powers of taxation</tspan><tspan class="k"> should</tspan></text>
<text x="86" y="856"><tspan class="k">continue to remain with the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">, while the other residuary powers should</tspan></text>
<text x="86" y="878"><tspan class="k">be placed in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">5.</text>
<text x="86" y="904"><tspan class="h" style="font-weight:700">Reasons for withholding assent:</tspan><tspan class="k"> When the President</tspan><tspan class="r"> withholds his/her assent</tspan><tspan class="k"> to</tspan></text>
<text x="86" y="926"><tspan class="k">the state bills, the</tspan><tspan class="b"> reasons should be communicated</tspan><tspan class="k"> to the state government.</tspan></text>
<text x="56" y="952" class="r" style="font-weight:700">6.</text>
<text x="86" y="952"><tspan class="h" style="font-weight:700">NDC to NEDC:</tspan><tspan class="k"> The</tspan><tspan class="r"> National Development Council (NDC)</tspan><tspan class="k"> should be renamed and</tspan></text>
<text x="86" y="974"><tspan class="k">reconstituted as the</tspan><tspan class="r"> National Economic and Development Council (NEDC)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1000" class="r" style="font-weight:700">7.</text>
<text x="86" y="1000"><tspan class="h" style="font-weight:700">Revive Zonal Councils:</tspan><tspan class="k"> The</tspan><tspan class="r"> zonal councils</tspan><tspan class="k"> should be constituted afresh and</tspan></text>
<text x="86" y="1022"><tspan class="k">reactivated to promote the spirit of federalism.</tspan></text>
<text x="56" y="1048" class="r" style="font-weight:700">8.</text>
<text x="86" y="1048"><tspan class="h" style="font-weight:700">Deployment of armed forces:</tspan><tspan class="k"> The Centre should have powers to</tspan><tspan class="r"> deploy its armed</tspan></text>
<text x="86" y="1070"><tspan class="r">forces</tspan><tspan class="k">, even without the consent of states. However, it is desirable that the</tspan><tspan class="b"> states</tspan></text>
<text x="86" y="1092"><tspan class="b">should be consulted</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1118" class="r" style="font-weight:700">9.</text>
<text x="86" y="1118"><tspan class="h" style="font-weight:700">Consultation on Concurrent List:</tspan><tspan class="k"> The Centre should</tspan><tspan class="r"> consult the states</tspan><tspan class="k"> before</tspan></text>
<text x="86" y="1140"><tspan class="k">making a law on a subject of the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1166" class="r" style="font-weight:700">10.</text>
<text x="86" y="1166"><tspan class="h" style="font-weight:700">CM consultation on Governor:</tspan><tspan class="k"> The procedure of</tspan><tspan class="r"> consulting the chief minister in</tspan></text>
<text x="86" y="1188"><tspan class="r">the appointment of the state governor</tspan><tspan class="k"> should be prescribed in the Constitution</tspan></text>
<text x="86" y="1210"><tspan class="k">itself.</tspan></text>
<text x="56" y="1236" class="r" style="font-weight:700">11.</text>
<text x="86" y="1236"><tspan class="h" style="font-weight:700">Corporation tax sharing:</tspan><tspan class="k"> The net proceeds of the</tspan><tspan class="r"> corporation tax</tspan><tspan class="k"> may be made</tspan></text>
<text x="86" y="1258"><tspan class="k">permissibly</tspan><tspan class="b"> shareable with the states</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1284" class="r" style="font-weight:700">12.</text>
<text x="86" y="1284"><tspan class="h" style="font-weight:700">No dismissal of majority ministry:</tspan><tspan class="k"> The governor</tspan><tspan class="r"> cannot dismiss the council of</tspan></text>
<text x="86" y="1306"><tspan class="r">ministers</tspan><tspan class="k"> so long as it commands a majority in the assembly.</tspan></text>
<text x="56" y="1332" class="r" style="font-weight:700">13.</text>
<text x="86" y="1332"><tspan class="h" style="font-weight:700">Fixed tenure of Governor:</tspan><tspan class="k"> The</tspan><tspan class="r"> governor’s term of five years</tspan><tspan class="k"> in a state should not</tspan></text>
<text x="86" y="1354"><tspan class="k">be disturbed except for some extremely compelling reasons.</tspan></text>
<text x="56" y="1380" class="r" style="font-weight:700">14.</text>
<text x="86" y="1380"><tspan class="h" style="font-weight:700">Commission of enquiry:</tspan><tspan class="k"> No</tspan><tspan class="r"> commission of enquiry</tspan><tspan class="k"> should be set up against a</tspan></text>
<text x="86" y="1402"><tspan class="k">state minister unless a demand is made by the</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1428" class="r" style="font-weight:700">15.</text>
<text x="86" y="1428"><tspan class="h" style="font-weight:700">Surcharge on income tax:</tspan><tspan class="k"> The</tspan><tspan class="r"> surcharge on income tax</tspan><tspan class="k"> should not be levied by</tspan></text>
<text x="86" y="1450"><tspan class="k">the Centre except for a specific purpose and for a strictly limited period.</tspan></text>
<text x="56" y="1476" class="r" style="font-weight:700">16.</text>
<text x="86" y="1476"><tspan class="h" style="font-weight:700">FC–Planning Commission balance:</tspan><tspan class="k"> The present division of functions between the</tspan></text>
<text x="86" y="1498"><tspan class="r">Finance Commission</tspan><tspan class="k"> and the</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> is reasonable and should</tspan></text>
<text x="86" y="1520"><tspan class="k">continue.</tspan></text>
<text x="56" y="1546" class="r" style="font-weight:700">17.</text>
<text x="86" y="1546"><tspan class="h" style="font-weight:700">Three-language formula:</tspan><tspan class="k"> Steps should be taken to uniformly implement the</tspan><tspan class="r"> three</tspan></text>
<text x="86" y="1568"><tspan class="r">language formula</tspan><tspan class="k"> in its true spirit.</tspan></text>
<text x="56" y="1594" class="r" style="font-weight:700">18.</text>
<text x="86" y="1594"><tspan class="h" style="font-weight:700">Decentralised broadcasting:</tspan><tspan class="r"> No autonomy for radio and television</tspan><tspan class="k"> but</tspan></text>
<text x="86" y="1616"><tspan class="b">decentralisation in their operations</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1642" class="r" style="font-weight:700">19.</text>
<text x="86" y="1642"><tspan class="h" style="font-weight:700">Status quo on Rajya Sabha:</tspan><tspan class="r"> No change in the role of Rajya Sabha</tspan><tspan class="k"> and Centre’s</tspan></text>
<text x="86" y="1664"><tspan class="k">power to reorganise the states.</tspan></text>
<text x="56" y="1690" class="r" style="font-weight:700">20.</text>
<text x="86" y="1690"><tspan class="h" style="font-weight:700">Linguistic minorities commissioner:</tspan><tspan class="k"> The</tspan><tspan class="r"> commissioner for linguistic minorities</tspan></text>
<text x="86" y="1712"><tspan class="k">should be activated.</tspan></text>
<path d="M50 670 L44 670 L44 1718 L50 1718" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1740"><tspan class="h" style="font-weight:700">Implementation – ISC 1990:</tspan><tspan class="k"> The Central government has implemented</tspan><tspan class="r"> 180 (out of 247)</tspan></text>
<text x="56" y="1762"><tspan class="k">recommendations of the Sarkaria Commission. The most important is the establishment</tspan></text>
<text x="56" y="1784"><tspan class="k">of the</tspan><tspan class="r"> Inter-State Council in 1990</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="52" y="1796" width="117" height="30" rx="3"/>
<text class="sm" x="110" y="1815" text-anchor="middle"><tspan class="r">1983</tspan><tspan class="k"> appointed</tspan></text>
<line class="ln" x1="172" y1="1811" x2="192" y2="1811" marker-end="url(#ah)"/>
<rect class="bx" x="195" y="1796" width="96" height="30" rx="3"/>
<text class="sm" x="243" y="1815" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1988</tspan></text>
<line class="ln" x1="294" y1="1811" x2="314" y2="1811" marker-end="url(#ah)"/>
<rect class="bx" x="317" y="1796" width="158" height="30" rx="3"/>
<text class="sm" x="395" y="1815" text-anchor="middle"><tspan class="r">247</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="477" y1="1811" x2="497" y2="1811" marker-end="url(#ah)"/>

<text class="sm" x="564" y="1815" text-anchor="middle"><tspan class="r">180</tspan><tspan class="k"> implemented</tspan></text>

<text class="sm" x="340" y="1869" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-State Council</tspan></text>
<text class="sm" x="340" y="1887" text-anchor="middle"><tspan class="r" style="font-weight:700">1990</tspan></text>

<text class="xs" x="340" y="1979" text-anchor="middle"><tspan class="b">Sarkaria Commission – 180 out of 247 recommendations implemented by the Central government</tspan></text>
<text class="xs" x="50" y="2020"><tspan class="r" style="font-weight:700">20</tspan><tspan class="k"> B. Sivaraman and S.R. Sen were two other members of the Commission.</tspan></text>
