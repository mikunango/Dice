<div id="vis-container"><h2 class="sr-only">Sarkaria Commission</h2>
<svg class="n" width="100%" viewBox="0 0 680 1915" role="img"><title>Sarkaria Commission</title><desc>Sarkaria Commission</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="232" y="26" width="215" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Sarkaria Commission</text>
<text class="lb" x="40" y="98">Sarkaria Commission</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">In</tspan><tspan class="r"> 1983</tspan><tspan class="k">, the Central government appointed a</tspan><tspan class="r"> three-member Commission</tspan><tspan class="k"> on</tspan></text>
<text x="58" y="148"><tspan class="k">Centre–state relations under the chairmanship of</tspan><tspan class="r"> R.S. Sarkaria</tspan><tspan class="k">, a</tspan><tspan class="b"> retired judge of the</tspan></text>
<text x="58" y="170"><tspan class="b">Supreme Court</tspan><tspan class="k">.²⁰</tspan></text>
<text x="44" y="196" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="196"><tspan class="k">The commission was asked to examine and review the working of existing</tspan></text>
<text x="58" y="218"><tspan class="k">arrangements between the Centre and states in all spheres and recommend appropriate</tspan></text>
<text x="58" y="240"><tspan class="k">changes and measures.</tspan></text>
<text x="44" y="266" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="266"><tspan class="k">It submitted it’s report in</tspan><tspan class="r"> 1988</tspan><tspan class="k">.</tspan></text>
<text x="44" y="292" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="292"><tspan class="k">The Commission</tspan><tspan class="r"> did not favour structural changes</tspan><tspan class="k"> and regarded the existing</tspan></text>
<text x="58" y="314"><tspan class="k">constitutional arrangements and principles relating to the institutions</tspan><tspan class="b"> basically sound</tspan><tspan class="k">.</tspan></text>
<text x="44" y="340" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="340"><tspan class="k">But, it emphasised on the need for changes in the</tspan><tspan class="r"> functional or operational aspects</tspan><tspan class="k">.</tspan></text>
<text x="44" y="366" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="366"><tspan class="k">It observed that federalism is more a</tspan><tspan class="r"> functional arrangement for co-operative action</tspan></text>
<text x="58" y="388"><tspan class="k">than a static institutional concept.</tspan></text>
<text x="44" y="414" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="414"><tspan class="k">It outrightly</tspan><tspan class="r"> rejected the demand for curtailing the powers of the Centre</tspan><tspan class="k"> and stated</tspan></text>
<text x="58" y="436"><tspan class="k">that a</tspan><tspan class="r"> strong Centre</tspan><tspan class="k"> is essential to safeguard the</tspan><tspan class="b"> national unity and integrity</tspan><tspan class="k"> which is</tspan></text>
<text x="58" y="458"><tspan class="k">being threatened by the</tspan><tspan class="b"> fissiparous tendencies</tspan><tspan class="k"> in the body politic.</tspan></text>
<text x="44" y="484" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="484"><tspan class="k">However, it did</tspan><tspan class="r"> not equate strong Centre with centralisation of powers</tspan><tspan class="k">.</tspan></text>
<text x="44" y="510" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="510"><tspan class="k">It observed that</tspan><tspan class="r"> over-centralisation leads to blood pressure at the centre and anaemia</tspan></text>
<text x="58" y="532"><tspan class="r">at the periphery</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="546" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="564" text-anchor="middle"><tspan class="r" style="font-weight:700">✘ Not favoured</tspan></text>
<line class="ln" x1="190" y1="574" x2="190" y2="588" marker-end="url(#ah)"/>
<text class="sm" x="190" y="609" text-anchor="middle"><tspan class="k">structural changes</tspan></text>
<text class="sm" x="190" y="631" text-anchor="middle"><tspan class="k">curtailing Centre’s powers</tspan></text>
<rect class="bx" x="346" y="546" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="564" text-anchor="middle"><tspan class="r" style="font-weight:700">✔ Favoured</tspan></text>
<line class="ln" x1="490" y1="574" x2="490" y2="588" marker-end="url(#ah)"/>
<text class="sm" x="490" y="609" text-anchor="middle"><tspan class="k">functional / operational changes</tspan></text>
<text class="sm" x="490" y="631" text-anchor="middle"><tspan class="r">strong Centre</tspan><tspan class="k"> ≠ centralisation</tspan></text>
<line x1="340" y1="546" x2="340" y2="634" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="85" y="652" width="136" height="30" rx="3"/>
<text class="sm" x="153" y="671" text-anchor="middle"><tspan class="k">over-centralisation</tspan></text>
<line class="ln" x1="224" y1="667" x2="244" y2="667" marker-end="url(#ah)"/>
<rect class="bx" x="247" y="652" width="171" height="30" rx="3"/>
<text class="sm" x="332" y="671" text-anchor="middle"><tspan class="r">blood pressure</tspan><tspan class="k"> at centre</tspan></text>
<line class="ln" x1="421" y1="667" x2="441" y2="667" marker-end="url(#ah)"/>
<rect class="bx" x="444" y="652" width="152" height="30" rx="3"/>
<text class="sm" x="519" y="671" text-anchor="middle"><tspan class="b">anaemia</tspan><tspan class="k"> at periphery</tspan></text>
<text x="44" y="708" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="708"><tspan class="k">The Commission made</tspan><tspan class="r"> 247 recommendations</tspan><tspan class="k"> to improve Centre–state relations.</tspan></text>
<text x="44" y="734" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="734"><tspan class="k">The important recommendations are mentioned below:</tspan></text>
<text x="56" y="760" class="r" style="font-weight:700">1.</text>
<text x="86" y="760"><tspan class="k">A permanent Inter-State Council called the</tspan><tspan class="r"> Inter-Governmental Council</tspan><tspan class="k"> should be</tspan></text>
<text x="86" y="782"><tspan class="k">set up under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">.</tspan></text>
<text x="56" y="808" class="r" style="font-weight:700">2.</text>
<text x="86" y="808"><tspan class="r">Article 356 (President’s Rule)</tspan><tspan class="k"> should be used</tspan><tspan class="r"> very sparingly</tspan><tspan class="k">, in extreme cases as a</tspan></text>
<text x="86" y="830"><tspan class="b">last resort</tspan><tspan class="k"> when all the available alternatives fail.</tspan></text>
<text x="56" y="856" class="r" style="font-weight:700">3.</text>
<text x="86" y="856"><tspan class="k">The institution of</tspan><tspan class="r"> All-India Services</tspan><tspan class="k"> should be</tspan><tspan class="b"> further strengthened</tspan><tspan class="k"> and more of</tspan></text>
<text x="86" y="878"><tspan class="k">such services should be created.</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">4.</text>
<text x="86" y="904"><tspan class="k">The</tspan><tspan class="r"> residuary powers of taxation</tspan><tspan class="k"> should continue to remain with the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">,</tspan></text>
<text x="86" y="926"><tspan class="k">while the other residuary powers should be placed in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="952" class="r" style="font-weight:700">5.</text>
<text x="86" y="952"><tspan class="k">When the President</tspan><tspan class="r"> withholds his/her assent</tspan><tspan class="k"> to the state bills, the</tspan><tspan class="b"> reasons should</tspan></text>
<text x="86" y="974"><tspan class="b">be communicated</tspan><tspan class="k"> to the state government.</tspan></text>
<text x="56" y="1000" class="r" style="font-weight:700">6.</text>
<text x="86" y="1000"><tspan class="k">The</tspan><tspan class="r"> National Development Council (NDC)</tspan><tspan class="k"> should be renamed and reconstituted as</tspan></text>
<text x="86" y="1022"><tspan class="k">the</tspan><tspan class="r"> National Economic and Development Council (NEDC)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1048" class="r" style="font-weight:700">7.</text>
<text x="86" y="1048"><tspan class="k">The</tspan><tspan class="r"> zonal councils</tspan><tspan class="k"> should be constituted afresh and reactivated to promote the</tspan></text>
<text x="86" y="1070"><tspan class="k">spirit of federalism.</tspan></text>
<text x="56" y="1096" class="r" style="font-weight:700">8.</text>
<text x="86" y="1096"><tspan class="k">The Centre should have powers to</tspan><tspan class="r"> deploy its armed forces</tspan><tspan class="k">, even without the</tspan></text>
<text x="86" y="1118"><tspan class="k">consent of states.</tspan></text>
<text x="86" y="1142" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="1142"><tspan class="k">However, it is desirable that the</tspan><tspan class="b"> states should be consulted</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1168" class="r" style="font-weight:700">9.</text>
<text x="86" y="1168"><tspan class="k">The Centre should</tspan><tspan class="r"> consult the states</tspan><tspan class="k"> before making a law on a subject of the</tspan></text>
<text x="86" y="1190"><tspan class="r">Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1216" class="r" style="font-weight:700">10.</text>
<text x="86" y="1216"><tspan class="k">The procedure of</tspan><tspan class="r"> consulting the chief minister in the appointment of the state</tspan></text>
<text x="86" y="1238"><tspan class="r">governor</tspan><tspan class="k"> should be prescribed in the Constitution itself.</tspan></text>
<text x="56" y="1264" class="r" style="font-weight:700">11.</text>
<text x="86" y="1264"><tspan class="k">The net proceeds of the</tspan><tspan class="r"> corporation tax</tspan><tspan class="k"> may be made permissibly</tspan><tspan class="b"> shareable with</tspan></text>
<text x="86" y="1286"><tspan class="b">the states</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1312" class="r" style="font-weight:700">12.</text>
<text x="86" y="1312"><tspan class="k">The governor</tspan><tspan class="r"> cannot dismiss the council of ministers</tspan><tspan class="k"> so long as it commands a</tspan></text>
<text x="86" y="1334"><tspan class="k">majority in the assembly.</tspan></text>
<text x="56" y="1360" class="r" style="font-weight:700">13.</text>
<text x="86" y="1360"><tspan class="k">The</tspan><tspan class="r"> governor’s term of five years</tspan><tspan class="k"> in a state should not be disturbed except for</tspan></text>
<text x="86" y="1382"><tspan class="k">some extremely compelling reasons.</tspan></text>
<text x="56" y="1408" class="r" style="font-weight:700">14.</text>
<text x="86" y="1408"><tspan class="k">No</tspan><tspan class="r"> commission of enquiry</tspan><tspan class="k"> should be set up against a state minister unless a</tspan></text>
<text x="86" y="1430"><tspan class="k">demand is made by the</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1456" class="r" style="font-weight:700">15.</text>
<text x="86" y="1456"><tspan class="k">The</tspan><tspan class="r"> surcharge on income tax</tspan><tspan class="k"> should not be levied by the Centre except for a</tspan></text>
<text x="86" y="1478"><tspan class="k">specific purpose and for a strictly limited period.</tspan></text>
<text x="56" y="1504" class="r" style="font-weight:700">16.</text>
<text x="86" y="1504"><tspan class="k">The present division of functions between the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k"> and the</tspan></text>
<text x="86" y="1526"><tspan class="r">Planning Commission</tspan><tspan class="k"> is reasonable and should continue.</tspan></text>
<text x="56" y="1552" class="r" style="font-weight:700">17.</text>
<text x="86" y="1552"><tspan class="k">Steps should be taken to uniformly implement the</tspan><tspan class="r"> three language formula</tspan><tspan class="k"> in its</tspan></text>
<text x="86" y="1574"><tspan class="k">true spirit.</tspan></text>
<text x="56" y="1600" class="r" style="font-weight:700">18.</text>
<text x="86" y="1600"><tspan class="r">No autonomy for radio and television</tspan><tspan class="k"> but</tspan><tspan class="b"> decentralisation in their operations</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1626" class="r" style="font-weight:700">19.</text>
<text x="86" y="1626"><tspan class="r">No change in the role of Rajya Sabha</tspan><tspan class="k"> and Centre’s power to reorganise the states.</tspan></text>
<text x="56" y="1652" class="r" style="font-weight:700">20.</text>
<text x="86" y="1652"><tspan class="k">The</tspan><tspan class="r"> commissioner for linguistic minorities</tspan><tspan class="k"> should be activated.</tspan></text>
<path d="M50 740 L44 740 L44 1658 L50 1658" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1678" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1678"><tspan class="k">The Central government has implemented</tspan><tspan class="r"> 180 (out of 247)</tspan><tspan class="k"> recommendations of the</tspan></text>
<text x="58" y="1700"><tspan class="k">Sarkaria Commission.</tspan></text>
<text x="44" y="1726" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1726"><tspan class="k">The most important is the establishment of the</tspan><tspan class="r"> Inter-State Council in 1990</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="52" y="1738" width="117" height="30" rx="3"/>
<text class="sm" x="110" y="1757" text-anchor="middle"><tspan class="r">1983</tspan><tspan class="k"> appointed</tspan></text>
<line class="ln" x1="172" y1="1753" x2="192" y2="1753" marker-end="url(#ah)"/>
<rect class="bx" x="195" y="1738" width="96" height="30" rx="3"/>
<text class="sm" x="243" y="1757" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1988</tspan></text>
<line class="ln" x1="294" y1="1753" x2="314" y2="1753" marker-end="url(#ah)"/>
<rect class="bx" x="317" y="1738" width="158" height="30" rx="3"/>
<text class="sm" x="395" y="1757" text-anchor="middle"><tspan class="r">247</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="477" y1="1753" x2="497" y2="1753" marker-end="url(#ah)"/>
<rect class="bx" x="500" y="1738" width="128" height="30" rx="3"/>
<text class="sm" x="564" y="1757" text-anchor="middle"><tspan class="r">180</tspan><tspan class="k"> implemented</tspan></text>
<line class="ln" x1="340" y1="1769" x2="340" y2="1790" marker-end="url(#ah)"/>
<rect class="bx" x="254" y="1792" width="172" height="48" rx="3"/>
<text class="sm" x="340" y="1811" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-State Council</tspan></text>
<text class="sm" x="340" y="1829" text-anchor="middle"><tspan class="r" style="font-weight:700">1990</tspan></text>
<text class="xs" x="50" y="1876"><tspan class="r" style="font-weight:700">20</tspan><tspan class="k"> B. Sivaraman and S.R. Sen were two other members of the Commission.</tspan></text>
<rect x="40" y="1854" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
