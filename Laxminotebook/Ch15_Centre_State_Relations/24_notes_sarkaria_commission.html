<div id="vis-container"><h2 class="sr-only">Sarkaria Commission</h2>
<svg class="n" width="100%" viewBox="0 0 680 2030" role="img"><title>Sarkaria Commission</title><desc>Sarkaria Commission</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="232" y="26" width="215" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Sarkaria Commission</text>
<text class="lb" x="40" y="98">Sarkaria Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Sarkaria 1983:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1983</tspan><tspan class="k">, the Central government appointed a</tspan><tspan class="r"> three-member Commission</tspan></text>
<text x="56" y="150"><tspan class="k">on Centre–state relations under the chairmanship of</tspan><tspan class="r"> R.S. Sarkaria</tspan><tspan class="k">, a</tspan><tspan class="b"> retired judge of the</tspan></text>
<text x="56" y="172"><tspan class="b">Supreme Court</tspan><tspan class="k">.²⁰</tspan></text>
<text x="44" y="200"><tspan class="h" style="font-weight:700">Mandate:</tspan><tspan class="k"> The commission was asked to examine and review the working of existing</tspan></text>
<text x="56" y="222"><tspan class="k">arrangements between the Centre and states in all spheres and recommend appropriate</tspan></text>
<text x="56" y="244"><tspan class="k">changes and measures.</tspan></text>
<text x="44" y="272"><tspan class="h" style="font-weight:700">Report 1988:</tspan><tspan class="k"> It submitted it’s report in</tspan><tspan class="r"> 1988</tspan><tspan class="k">.</tspan></text>
<text x="44" y="300"><tspan class="h" style="font-weight:700">No structural change:</tspan><tspan class="k"> The Commission</tspan><tspan class="r"> did not favour structural changes</tspan><tspan class="k"> and regarded</tspan></text>
<text x="56" y="322"><tspan class="k">the existing constitutional arrangements and principles relating to the institutions</tspan></text>
<text x="56" y="344"><tspan class="b">basically sound</tspan><tspan class="k">.</tspan></text>
<text x="44" y="372"><tspan class="h" style="font-weight:700">Functional changes:</tspan><tspan class="k"> But, it emphasised on the need for changes in the</tspan><tspan class="r"> functional or</tspan></text>
<text x="56" y="394"><tspan class="r">operational aspects</tspan><tspan class="k">.</tspan></text>
<text x="44" y="422"><tspan class="h" style="font-weight:700">Co-operative action:</tspan><tspan class="k"> It observed that federalism is more a</tspan><tspan class="r"> functional arrangement for</tspan></text>
<text x="56" y="444"><tspan class="r">co-operative action</tspan><tspan class="k"> than a static institutional concept.</tspan></text>
<text x="44" y="472"><tspan class="h" style="font-weight:700">Strong Centre:</tspan><tspan class="k"> It outrightly</tspan><tspan class="r"> rejected the demand for curtailing the powers of the Centre</tspan></text>
<text x="56" y="494"><tspan class="k">and stated that a</tspan><tspan class="r"> strong Centre</tspan><tspan class="k"> is essential to safeguard the</tspan><tspan class="b"> national unity and integrity</tspan></text>
<text x="56" y="516"><tspan class="k">which is being threatened by the</tspan><tspan class="b"> fissiparous tendencies</tspan><tspan class="k"> in the body politic.</tspan></text>
<text x="44" y="544"><tspan class="h" style="font-weight:700">Not centralisation:</tspan><tspan class="k"> However, it did</tspan><tspan class="r"> not equate strong Centre with centralisation of</tspan></text>
<text x="56" y="566"><tspan class="r">powers</tspan><tspan class="k">.</tspan></text>
<text x="44" y="594"><tspan class="h" style="font-weight:700">BP &amp; anaemia:</tspan><tspan class="k"> It observed that</tspan><tspan class="r"> over-centralisation leads to blood pressure at the centre</tspan></text>
<text x="56" y="616"><tspan class="r">and anaemia at the periphery</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="630" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="648" text-anchor="middle"><tspan class="r" style="font-weight:700">✘ Not favoured</tspan></text>
<line class="ln" x1="190" y1="658" x2="190" y2="672" marker-end="url(#ah)"/>
<text class="sm" x="190" y="693" text-anchor="middle"><tspan class="k">structural changes</tspan></text>
<text class="sm" x="190" y="715" text-anchor="middle"><tspan class="k">curtailing Centre’s powers</tspan></text>
<rect class="bx" x="346" y="630" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="648" text-anchor="middle"><tspan class="r" style="font-weight:700">✔ Favoured</tspan></text>
<line class="ln" x1="490" y1="658" x2="490" y2="672" marker-end="url(#ah)"/>
<text class="sm" x="490" y="693" text-anchor="middle"><tspan class="k">functional / operational changes</tspan></text>
<text class="sm" x="490" y="715" text-anchor="middle"><tspan class="r">strong Centre</tspan><tspan class="k"> ≠ centralisation</tspan></text>
<line x1="340" y1="630" x2="340" y2="718" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="85" y="736" width="136" height="30" rx="3"/>
<text class="sm" x="153" y="755" text-anchor="middle"><tspan class="k">over-centralisation</tspan></text>
<line class="ln" x1="224" y1="751" x2="244" y2="751" marker-end="url(#ah)"/>
<rect class="bx" x="247" y="736" width="171" height="30" rx="3"/>
<text class="sm" x="332" y="755" text-anchor="middle"><tspan class="r">blood pressure</tspan><tspan class="k"> at centre</tspan></text>
<line class="ln" x1="421" y1="751" x2="441" y2="751" marker-end="url(#ah)"/>
<rect class="bx" x="444" y="736" width="152" height="30" rx="3"/>
<text class="sm" x="519" y="755" text-anchor="middle"><tspan class="b">anaemia</tspan><tspan class="k"> at periphery</tspan></text>
<text x="44" y="794"><tspan class="h" style="font-weight:700">247 recommendations:</tspan><tspan class="k"> The Commission made</tspan><tspan class="r"> 247 recommendations</tspan><tspan class="k"> to improve</tspan></text>
<text x="56" y="816"><tspan class="k">Centre–state relations.</tspan></text>
<text x="44" y="844"><tspan class="h" style="font-weight:700">Important ones:</tspan><tspan class="k"> The important recommendations are mentioned below:</tspan></text>
<text x="56" y="870" class="r" style="font-weight:700">1.</text>
<text x="86" y="870"><tspan class="k">A permanent Inter-State Council called the</tspan><tspan class="r"> Inter-Governmental Council</tspan><tspan class="k"> should be</tspan></text>
<text x="86" y="892"><tspan class="k">set up under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">.</tspan></text>
<text x="56" y="918" class="r" style="font-weight:700">2.</text>
<text x="86" y="918"><tspan class="r">Article 356 (President’s Rule)</tspan><tspan class="k"> should be used</tspan><tspan class="r"> very sparingly</tspan><tspan class="k">, in extreme cases as a</tspan></text>
<text x="86" y="940"><tspan class="b">last resort</tspan><tspan class="k"> when all the available alternatives fail.</tspan></text>
<text x="56" y="966" class="r" style="font-weight:700">3.</text>
<text x="86" y="966"><tspan class="k">The institution of</tspan><tspan class="r"> All-India Services</tspan><tspan class="k"> should be</tspan><tspan class="b"> further strengthened</tspan><tspan class="k"> and more of</tspan></text>
<text x="86" y="988"><tspan class="k">such services should be created.</tspan></text>
<text x="56" y="1014" class="r" style="font-weight:700">4.</text>
<text x="86" y="1014"><tspan class="k">The</tspan><tspan class="r"> residuary powers of taxation</tspan><tspan class="k"> should continue to remain with the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">,</tspan></text>
<text x="86" y="1036"><tspan class="k">while the other residuary powers should be placed in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1062" class="r" style="font-weight:700">5.</text>
<text x="86" y="1062"><tspan class="k">When the President</tspan><tspan class="r"> withholds his/her assent</tspan><tspan class="k"> to the state bills, the</tspan><tspan class="b"> reasons should</tspan></text>
<text x="86" y="1084"><tspan class="b">be communicated</tspan><tspan class="k"> to the state government.</tspan></text>
<text x="56" y="1110" class="r" style="font-weight:700">6.</text>
<text x="86" y="1110"><tspan class="k">The</tspan><tspan class="r"> National Development Council (NDC)</tspan><tspan class="k"> should be renamed and reconstituted as</tspan></text>
<text x="86" y="1132"><tspan class="k">the</tspan><tspan class="r"> National Economic and Development Council (NEDC)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1158" class="r" style="font-weight:700">7.</text>
<text x="86" y="1158"><tspan class="k">The</tspan><tspan class="r"> zonal councils</tspan><tspan class="k"> should be constituted afresh and reactivated to promote the</tspan></text>
<text x="86" y="1180"><tspan class="k">spirit of federalism.</tspan></text>
<text x="56" y="1206" class="r" style="font-weight:700">8.</text>
<text x="86" y="1206"><tspan class="k">The Centre should have powers to</tspan><tspan class="r"> deploy its armed forces</tspan><tspan class="k">, even without the</tspan></text>
<text x="86" y="1228"><tspan class="k">consent of states.</tspan></text>
<text x="86" y="1253"><tspan class="h" style="font-weight:700">Consult states:</tspan><tspan class="k"> However, it is desirable that the</tspan><tspan class="b"> states should be consulted</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1279" class="r" style="font-weight:700">9.</text>
<text x="86" y="1279"><tspan class="k">The Centre should</tspan><tspan class="r"> consult the states</tspan><tspan class="k"> before making a law on a subject of the</tspan></text>
<text x="86" y="1301"><tspan class="r">Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1327" class="r" style="font-weight:700">10.</text>
<text x="86" y="1327"><tspan class="k">The procedure of</tspan><tspan class="r"> consulting the chief minister in the appointment of the state</tspan></text>
<text x="86" y="1349"><tspan class="r">governor</tspan><tspan class="k"> should be prescribed in the Constitution itself.</tspan></text>
<text x="56" y="1375" class="r" style="font-weight:700">11.</text>
<text x="86" y="1375"><tspan class="k">The net proceeds of the</tspan><tspan class="r"> corporation tax</tspan><tspan class="k"> may be made permissibly</tspan><tspan class="b"> shareable with</tspan></text>
<text x="86" y="1397"><tspan class="b">the states</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1423" class="r" style="font-weight:700">12.</text>
<text x="86" y="1423"><tspan class="k">The governor</tspan><tspan class="r"> cannot dismiss the council of ministers</tspan><tspan class="k"> so long as it commands a</tspan></text>
<text x="86" y="1445"><tspan class="k">majority in the assembly.</tspan></text>
<text x="56" y="1471" class="r" style="font-weight:700">13.</text>
<text x="86" y="1471"><tspan class="k">The</tspan><tspan class="r"> governor’s term of five years</tspan><tspan class="k"> in a state should not be disturbed except for</tspan></text>
<text x="86" y="1493"><tspan class="k">some extremely compelling reasons.</tspan></text>
<text x="56" y="1519" class="r" style="font-weight:700">14.</text>
<text x="86" y="1519"><tspan class="k">No</tspan><tspan class="r"> commission of enquiry</tspan><tspan class="k"> should be set up against a state minister unless a</tspan></text>
<text x="86" y="1541"><tspan class="k">demand is made by the</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1567" class="r" style="font-weight:700">15.</text>
<text x="86" y="1567"><tspan class="k">The</tspan><tspan class="r"> surcharge on income tax</tspan><tspan class="k"> should not be levied by the Centre except for a</tspan></text>
<text x="86" y="1589"><tspan class="k">specific purpose and for a strictly limited period.</tspan></text>
<text x="56" y="1615" class="r" style="font-weight:700">16.</text>
<text x="86" y="1615"><tspan class="k">The present division of functions between the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k"> and the</tspan></text>
<text x="86" y="1637"><tspan class="r">Planning Commission</tspan><tspan class="k"> is reasonable and should continue.</tspan></text>
<text x="56" y="1663" class="r" style="font-weight:700">17.</text>
<text x="86" y="1663"><tspan class="k">Steps should be taken to uniformly implement the</tspan><tspan class="r"> three language formula</tspan><tspan class="k"> in its</tspan></text>
<text x="86" y="1685"><tspan class="k">true spirit.</tspan></text>
<text x="56" y="1711" class="r" style="font-weight:700">18.</text>
<text x="86" y="1711"><tspan class="r">No autonomy for radio and television</tspan><tspan class="k"> but</tspan><tspan class="b"> decentralisation in their operations</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1737" class="r" style="font-weight:700">19.</text>
<text x="86" y="1737"><tspan class="r">No change in the role of Rajya Sabha</tspan><tspan class="k"> and Centre’s power to reorganise the states.</tspan></text>
<text x="56" y="1763" class="r" style="font-weight:700">20.</text>
<text x="86" y="1763"><tspan class="k">The</tspan><tspan class="r"> commissioner for linguistic minorities</tspan><tspan class="k"> should be activated.</tspan></text>
<path d="M50 850 L44 850 L44 1769 L50 1769" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1791"><tspan class="h" style="font-weight:700">180 implemented:</tspan><tspan class="k"> The Central government has implemented</tspan><tspan class="r"> 180 (out of 247)</tspan></text>
<text x="56" y="1813"><tspan class="k">recommendations of the Sarkaria Commission.</tspan></text>
<text x="44" y="1841"><tspan class="h" style="font-weight:700">ISC 1990:</tspan><tspan class="k"> The most important is the establishment of the</tspan><tspan class="r"> Inter-State Council in 1990</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="110" y="1872" text-anchor="middle"><tspan class="r">1983</tspan><tspan class="k"> appointed</tspan></text>
<line class="ln" x1="172" y1="1868" x2="192" y2="1868" marker-end="url(#ah)"/>
<rect class="bx" x="195" y="1853" width="96" height="30" rx="3"/>

<text class="sm" x="395" y="1872" text-anchor="middle"><tspan class="r">247</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="477" y1="1868" x2="497" y2="1868" marker-end="url(#ah)"/>
<rect class="bx" x="500" y="1853" width="128" height="30" rx="3"/>
<text class="sm" x="564" y="1872" text-anchor="middle"><tspan class="r">180</tspan><tspan class="k"> implemented</tspan></text>
<line class="ln" x1="340" y1="1884" x2="340" y2="1905" marker-end="url(#ah)"/>

<text class="sm" x="340" y="1926" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-State Council</tspan></text>
<text class="sm" x="340" y="1944" text-anchor="middle"><tspan class="r" style="font-weight:700">1990</tspan></text>
<text class="xs" x="50" y="1991"><tspan class="r" style="font-weight:700">20</tspan><tspan class="k"> B. Sivaraman and S.R. Sen were two other members of the Commission.</tspan></text>
