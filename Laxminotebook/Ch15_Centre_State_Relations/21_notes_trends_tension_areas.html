<div id="vis-container"><h2 class="sr-only">Trends in Centre–State Relations</h2>
<svg class="n" width="100%" viewBox="0 0 680 1234" role="img"><title>Trends in Centre–State Relations</title><desc>Trends in Centre–State Relations</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="182" y="26" width="315" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Trends in Centre–State Relations</text>
<text class="r hd" x="40" y="100">TRENDS IN CENTRE–STATE RELATIONS</text>
<line x1="40" y1="106" x2="339" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Till 1967 smooth:</tspan><tspan class="k"> Till</tspan><tspan class="r"> 1967</tspan><tspan class="k">, the centre–state relations by and large were</tspan><tspan class="r"> smooth</tspan><tspan class="k"> due to</tspan></text>
<text x="56" y="156"><tspan class="b">one-party rule at the Centre and in most of the states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="184"><tspan class="h" style="font-weight:700">1967 – nine states:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1967 elections</tspan><tspan class="k">, the</tspan><tspan class="r"> Congress party was defeated in nine states</tspan></text>
<text x="56" y="206"><tspan class="k">and its position at the Centre became weak.</tspan></text>
<text x="44" y="234"><tspan class="h" style="font-weight:700">New era:</tspan><tspan class="k"> This changed political scenario heralded a</tspan><tspan class="r"> new era</tspan><tspan class="k"> in the Centre–state</tspan></text>
<text x="56" y="256"><tspan class="k">relations.</tspan></text>
<text x="44" y="284"><tspan class="h" style="font-weight:700">Opposed centralisation:</tspan><tspan class="k"> The</tspan><tspan class="b"> non-Congress Governments</tspan><tspan class="k"> in the states opposed the</tspan></text>
<text x="56" y="306"><tspan class="k">increasing</tspan><tspan class="r"> centralisation and intervention</tspan><tspan class="k"> of the Central government.</tspan></text>
<text x="44" y="334"><tspan class="h" style="font-weight:700">State autonomy:</tspan><tspan class="k"> They raised the issue of</tspan><tspan class="r"> state autonomy</tspan><tspan class="k"> and demanded</tspan><tspan class="b"> more powers</tspan></text>
<text x="56" y="356"><tspan class="b">and financial resources</tspan><tspan class="k"> to the states.</tspan></text>
<text x="44" y="384"><tspan class="h" style="font-weight:700">Tensions:</tspan><tspan class="k"> This caused</tspan><tspan class="r"> tensions and conflicts</tspan><tspan class="k"> in Centre–state relations.</tspan></text>
<rect class="bx" x="98" y="396" width="126" height="30" rx="3"/>
<text class="sm" x="161" y="415" text-anchor="middle"><tspan class="k">till 1967:</tspan><tspan class="r"> smooth</tspan></text>
<line class="ln" x1="227" y1="411" x2="247" y2="411" marker-end="url(#ah)"/>
<rect class="bx" x="250" y="396" width="111" height="30" rx="3"/>
<text class="sm" x="306" y="415" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<line class="ln" x1="364" y1="411" x2="384" y2="411" marker-end="url(#ah)"/>
<rect class="bx" x="387" y="396" width="195" height="30" rx="3"/>
<text class="sm" x="485" y="415" text-anchor="middle"><tspan class="k">1967: Congress lost</tspan><tspan class="r"> 9 states</tspan></text>
<line class="ln" x1="340" y1="427" x2="340" y2="448" marker-end="url(#ah)"/>
<rect class="bx" x="116" y="450" width="149" height="30" rx="3"/>
<text class="sm" x="190" y="469" text-anchor="middle"><tspan class="k">non-Congress states</tspan></text>
<line class="ln" x1="268" y1="465" x2="288" y2="465" marker-end="url(#ah)"/>
<rect class="bx" x="291" y="450" width="171" height="30" rx="3"/>
<text class="sm" x="376" y="469" text-anchor="middle"><tspan class="k">demand</tspan><tspan class="r"> state autonomy</tspan></text>
<line class="ln" x1="465" y1="465" x2="485" y2="465" marker-end="url(#ah)"/>
<rect class="bx" x="488" y="450" width="76" height="30" rx="3"/>
<text class="sm" x="526" y="469" text-anchor="middle"><tspan class="r" style="font-weight:700">tensions</tspan></text>
<text class="lb" x="40" y="512">Tension Areas in Centre-State Relations</text>
<text x="44" y="542"><tspan class="h" style="font-weight:700">Tension areas:</tspan><tspan class="k"> The issues which created</tspan><tspan class="r"> tensions and conflicts</tspan><tspan class="k"> between the Centre and</tspan></text>
<text x="56" y="564"><tspan class="k">states are:</tspan></text>
<text x="56" y="590" class="r" style="font-weight:700">(1)</text>
<text x="94" y="590"><tspan class="k">Mode of</tspan><tspan class="r"> appointment and dismissal of governor</tspan><tspan class="k">;</tspan></text>
<text x="56" y="616" class="r" style="font-weight:700">(2)</text>
<text x="94" y="616"><tspan class="r">Discriminatory and partisan role of governors</tspan><tspan class="k">;</tspan></text>
<text x="56" y="642" class="r" style="font-weight:700">(3)</text>
<text x="94" y="642"><tspan class="k">Imposition of</tspan><tspan class="r"> President’s Rule for partisan interests</tspan><tspan class="k">;</tspan></text>
<text x="56" y="668" class="r" style="font-weight:700">(4)</text>
<text x="94" y="668"><tspan class="k">Deployment of</tspan><tspan class="r"> Central forces</tspan><tspan class="k"> in the states to maintain law and order;</tspan></text>
<text x="56" y="694" class="r" style="font-weight:700">(5)</text>
<text x="94" y="694"><tspan class="r">Reservation of state bills</tspan><tspan class="k"> for the consideration of the President;</tspan></text>
<text x="56" y="720" class="r" style="font-weight:700">(6)</text>
<text x="94" y="720"><tspan class="r">Discrimination in financial allocations</tspan><tspan class="k"> to the states;</tspan></text>
<text x="56" y="746" class="r" style="font-weight:700">(7)</text>
<text x="94" y="746"><tspan class="k">Role of</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> in approving state projects; (</tspan><tspan class="b">till its replacement by</tspan></text>
<text x="94" y="768"><tspan class="b">the NITI Aayog in 2015</tspan><tspan class="k">);</tspan></text>
<text x="56" y="794" class="r" style="font-weight:700">(8)</text>
<text x="94" y="794"><tspan class="k">Management of</tspan><tspan class="r"> All-India Services</tspan><tspan class="k"> (</tspan><tspan class="b">IAS, IPS, and IFoS</tspan><tspan class="k">);</tspan></text>
<text x="56" y="820" class="r" style="font-weight:700">(9)</text>
<text x="94" y="820"><tspan class="k">Use of</tspan><tspan class="r"> electronic media</tspan><tspan class="k"> for political purposes;</tspan></text>
<text x="56" y="846" class="r" style="font-weight:700">(10)</text>
<text x="94" y="846"><tspan class="k">Appointment of</tspan><tspan class="r"> enquiry commissions</tspan><tspan class="k"> against the chief ministers;</tspan></text>
<text x="56" y="872" class="r" style="font-weight:700">(11)</text>
<text x="94" y="872"><tspan class="r">Sharing of finances</tspan><tspan class="k"> (between Centre and states);</tspan></text>
<text x="56" y="898" class="r" style="font-weight:700">(12)</text>
<text x="94" y="898"><tspan class="r">Encroachment by the Centre on the State List</tspan><tspan class="k">;</tspan></text>
<text x="56" y="924" class="r" style="font-weight:700">(13)</text>
<text x="94" y="924"><tspan class="k">Implementation of the</tspan><tspan class="r"> Centrally sponsored schemes</tspan><tspan class="k"> by the states; and</tspan></text>
<text x="56" y="950" class="r" style="font-weight:700">(14)</text>
<text x="94" y="950"><tspan class="k">Modus operandi of the</tspan><tspan class="r"> central agencies</tspan><tspan class="k"> like</tspan><tspan class="b"> CBI, ED</tspan><tspan class="k"> and so on.</tspan></text>
<path d="M50 570 L44 570 L44 956 L50 956" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="962" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="96" y="991" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan></text>
<text class="xs" x="96" y="1009" text-anchor="middle"><tspan class="k">(1) (2)</tspan></text>
<rect class="bx" x="162" y="962" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="218" y="982" text-anchor="middle"><tspan class="r" style="font-weight:700">Emergency /</tspan></text>
<text class="xs" x="218" y="1000" text-anchor="middle"><tspan class="r" style="font-weight:700">forces</tspan></text>
<text class="xs" x="218" y="1018" text-anchor="middle"><tspan class="k">(3) (4)</tspan></text>
<rect class="bx" x="284" y="962" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="991" text-anchor="middle"><tspan class="r" style="font-weight:700">Legislative</tspan></text>
<text class="xs" x="340" y="1009" text-anchor="middle"><tspan class="k">(5) (12)</tspan></text>
<rect class="bx" x="406" y="962" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="462" y="982" text-anchor="middle"><tspan class="r" style="font-weight:700">Financial</tspan></text>
<text class="xs" x="462" y="1000" text-anchor="middle"><tspan class="k">(6) (7) (11)</tspan></text>
<text class="xs" x="462" y="1018" text-anchor="middle"><tspan class="k">(13)</tspan></text>
<rect class="bx" x="528" y="962" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="584" y="982" text-anchor="middle"><tspan class="r" style="font-weight:700">Administrative</tspan></text>
<text class="xs" x="584" y="1000" text-anchor="middle"><tspan class="k">(8) (9) (10)</tspan></text>
<text class="xs" x="584" y="1018" text-anchor="middle"><tspan class="k">(14)</tspan></text>
<text x="44" y="1058"><tspan class="h" style="font-weight:700">Since mid 1960s:</tspan><tspan class="k"> The issues in Centre-State relations have been under consideration</tspan></text>
<text x="56" y="1080"><tspan class="k">since the</tspan><tspan class="r"> mid 1960s</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1108"><tspan class="h" style="font-weight:700">Developments:</tspan><tspan class="k"> In this direction, the following developments have taken place:</tspan></text>
<rect class="bx" x="52" y="1120" width="85" height="30" rx="3"/>
<text class="sm" x="95" y="1139" text-anchor="middle"><tspan class="r">ARC</tspan><tspan class="k"> 1966</tspan></text>
<line class="ln" x1="141" y1="1135" x2="161" y2="1135" marker-end="url(#ah)"/>
<rect class="bx" x="164" y="1120" width="128" height="30" rx="3"/>
<text class="sm" x="228" y="1139" text-anchor="middle"><tspan class="r">Rajamannar</tspan><tspan class="k"> 1969</tspan></text>
<line class="ln" x1="295" y1="1135" x2="315" y2="1135" marker-end="url(#ah)"/>
<rect class="bx" x="318" y="1120" width="152" height="30" rx="3"/>
<text class="sm" x="394" y="1139" text-anchor="middle"><tspan class="r">Anandpur Sahib</tspan><tspan class="k"> 1973</tspan></text>
<line class="ln" x1="473" y1="1135" x2="493" y2="1135" marker-end="url(#ah)"/>
<rect class="bx" x="496" y="1120" width="131" height="30" rx="3"/>
<text class="sm" x="562" y="1139" text-anchor="middle"><tspan class="r">West Bengal</tspan><tspan class="k"> 1977</tspan></text>
<line class="ln" x1="340" y1="1151" x2="340" y2="1172" marker-end="url(#ah)"/>
<rect class="bx" x="219" y="1174" width="108" height="30" rx="3"/>
<text class="sm" x="273" y="1193" text-anchor="middle"><tspan class="r">Sarkaria</tspan><tspan class="k"> 1983</tspan></text>
<line class="ln" x1="329" y1="1189" x2="349" y2="1189" marker-end="url(#ah)"/>
<rect class="bx" x="352" y="1174" width="109" height="30" rx="3"/>
<text class="sm" x="407" y="1193" text-anchor="middle"><tspan class="r">Punchhi</tspan><tspan class="k"> 2007</tspan></text>
