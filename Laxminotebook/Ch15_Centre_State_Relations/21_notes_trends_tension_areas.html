<div id="vis-container"><h2 class="sr-only">Trends in Centre–State Relations</h2>
<svg class="n" width="100%" viewBox="0 0 680 1172" role="img"><title>Trends in Centre–State Relations</title><desc>Trends in Centre–State Relations</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="182" y="26" width="315" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Trends in Centre–State Relations</text>
<text class="r hd" x="40" y="100">TRENDS IN CENTRE–STATE RELATIONS</text>
<line x1="40" y1="106" x2="339" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="132" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="132"><tspan class="k">Till</tspan><tspan class="r"> 1967</tspan><tspan class="k">, the centre–state relations by and large were</tspan><tspan class="r"> smooth</tspan><tspan class="k"> due to</tspan><tspan class="b"> one-party rule at</tspan></text>
<text x="58" y="154"><tspan class="b">the Centre and in most of the states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="180" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="180"><tspan class="k">In</tspan><tspan class="r"> 1967 elections</tspan><tspan class="k">, the</tspan><tspan class="r"> Congress party was defeated in nine states</tspan><tspan class="k"> and its position at</tspan></text>
<text x="58" y="202"><tspan class="k">the Centre became weak.</tspan></text>
<text x="44" y="228" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="228"><tspan class="k">This changed political scenario heralded a</tspan><tspan class="r"> new era</tspan><tspan class="k"> in the Centre–state relations.</tspan></text>
<text x="44" y="254" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="254"><tspan class="k">The</tspan><tspan class="b"> non-Congress Governments</tspan><tspan class="k"> in the states opposed the increasing</tspan><tspan class="r"> centralisation and</tspan></text>
<text x="58" y="276"><tspan class="r">intervention</tspan><tspan class="k"> of the Central government.</tspan></text>
<text x="44" y="302" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="302"><tspan class="k">They raised the issue of</tspan><tspan class="r"> state autonomy</tspan><tspan class="k"> and demanded</tspan><tspan class="b"> more powers and financial</tspan></text>
<text x="58" y="324"><tspan class="b">resources</tspan><tspan class="k"> to the states.</tspan></text>
<text x="44" y="350" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="350"><tspan class="k">This caused</tspan><tspan class="r"> tensions and conflicts</tspan><tspan class="k"> in Centre–state relations.</tspan></text>
<rect class="bx" x="98" y="362" width="126" height="30" rx="3"/>
<text class="sm" x="161" y="381" text-anchor="middle"><tspan class="k">till 1967:</tspan><tspan class="r"> smooth</tspan></text>
<line class="ln" x1="227" y1="377" x2="247" y2="377" marker-end="url(#ah)"/>
<rect class="bx" x="250" y="362" width="111" height="30" rx="3"/>
<text class="sm" x="306" y="381" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<line class="ln" x1="364" y1="377" x2="384" y2="377" marker-end="url(#ah)"/>
<rect class="bx" x="387" y="362" width="195" height="30" rx="3"/>
<text class="sm" x="485" y="381" text-anchor="middle"><tspan class="k">1967: Congress lost</tspan><tspan class="r"> 9 states</tspan></text>
<line class="ln" x1="340" y1="393" x2="340" y2="414" marker-end="url(#ah)"/>
<rect class="bx" x="116" y="416" width="149" height="30" rx="3"/>
<text class="sm" x="190" y="435" text-anchor="middle"><tspan class="k">non-Congress states</tspan></text>
<line class="ln" x1="268" y1="431" x2="288" y2="431" marker-end="url(#ah)"/>
<rect class="bx" x="291" y="416" width="171" height="30" rx="3"/>
<text class="sm" x="376" y="435" text-anchor="middle"><tspan class="k">demand</tspan><tspan class="r"> state autonomy</tspan></text>
<line class="ln" x1="465" y1="431" x2="485" y2="431" marker-end="url(#ah)"/>
<rect class="bx" x="488" y="416" width="76" height="30" rx="3"/>
<text class="sm" x="526" y="435" text-anchor="middle"><tspan class="r" style="font-weight:700">tensions</tspan></text>
<text class="lb" x="40" y="478">Tension Areas in Centre-State Relations</text>
<text x="44" y="506" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="506"><tspan class="k">The issues which created</tspan><tspan class="r"> tensions and conflicts</tspan><tspan class="k"> between the Centre and states are:</tspan></text>
<text x="56" y="532" class="r" style="font-weight:700">(1)</text>
<text x="94" y="532"><tspan class="k">Mode of</tspan><tspan class="r"> appointment and dismissal of governor</tspan><tspan class="k">;</tspan></text>
<text x="56" y="558" class="r" style="font-weight:700">(2)</text>
<text x="94" y="558"><tspan class="r">Discriminatory and partisan role of governors</tspan><tspan class="k">;</tspan></text>
<text x="56" y="584" class="r" style="font-weight:700">(3)</text>
<text x="94" y="584"><tspan class="k">Imposition of</tspan><tspan class="r"> President’s Rule for partisan interests</tspan><tspan class="k">;</tspan></text>
<text x="56" y="610" class="r" style="font-weight:700">(4)</text>
<text x="94" y="610"><tspan class="k">Deployment of</tspan><tspan class="r"> Central forces</tspan><tspan class="k"> in the states to maintain law and order;</tspan></text>
<text x="56" y="636" class="r" style="font-weight:700">(5)</text>
<text x="94" y="636"><tspan class="r">Reservation of state bills</tspan><tspan class="k"> for the consideration of the President;</tspan></text>
<text x="56" y="662" class="r" style="font-weight:700">(6)</text>
<text x="94" y="662"><tspan class="r">Discrimination in financial allocations</tspan><tspan class="k"> to the states;</tspan></text>
<text x="56" y="688" class="r" style="font-weight:700">(7)</text>
<text x="94" y="688"><tspan class="k">Role of</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> in approving state projects; (</tspan><tspan class="b">till its replacement by</tspan></text>
<text x="94" y="710"><tspan class="b">the NITI Aayog in 2015</tspan><tspan class="k">);</tspan></text>
<text x="56" y="736" class="r" style="font-weight:700">(8)</text>
<text x="94" y="736"><tspan class="k">Management of</tspan><tspan class="r"> All-India Services</tspan><tspan class="k"> (</tspan><tspan class="b">IAS, IPS, and IFoS</tspan><tspan class="k">);</tspan></text>
<text x="56" y="762" class="r" style="font-weight:700">(9)</text>
<text x="94" y="762"><tspan class="k">Use of</tspan><tspan class="r"> electronic media</tspan><tspan class="k"> for political purposes;</tspan></text>
<text x="56" y="788" class="r" style="font-weight:700">(10)</text>
<text x="94" y="788"><tspan class="k">Appointment of</tspan><tspan class="r"> enquiry commissions</tspan><tspan class="k"> against the chief ministers;</tspan></text>
<text x="56" y="814" class="r" style="font-weight:700">(11)</text>
<text x="94" y="814"><tspan class="r">Sharing of finances</tspan><tspan class="k"> (between Centre and states);</tspan></text>
<text x="56" y="840" class="r" style="font-weight:700">(12)</text>
<text x="94" y="840"><tspan class="r">Encroachment by the Centre on the State List</tspan><tspan class="k">;</tspan></text>
<text x="56" y="866" class="r" style="font-weight:700">(13)</text>
<text x="94" y="866"><tspan class="k">Implementation of the</tspan><tspan class="r"> Centrally sponsored schemes</tspan><tspan class="k"> by the states; and</tspan></text>
<text x="56" y="892" class="r" style="font-weight:700">(14)</text>
<text x="94" y="892"><tspan class="k">Modus operandi of the</tspan><tspan class="r"> central agencies</tspan><tspan class="k"> like</tspan><tspan class="b"> CBI, ED</tspan><tspan class="k"> and so on.</tspan></text>
<path d="M50 512 L44 512 L44 898 L50 898" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="904" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="96" y="933" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan></text>
<text class="xs" x="96" y="951" text-anchor="middle"><tspan class="k">(1) (2)</tspan></text>
<rect class="bx" x="162" y="904" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="218" y="924" text-anchor="middle"><tspan class="r" style="font-weight:700">Emergency /</tspan></text>
<text class="xs" x="218" y="942" text-anchor="middle"><tspan class="r" style="font-weight:700">forces</tspan></text>
<text class="xs" x="218" y="960" text-anchor="middle"><tspan class="k">(3) (4)</tspan></text>
<rect class="bx" x="284" y="904" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="933" text-anchor="middle"><tspan class="r" style="font-weight:700">Legislative</tspan></text>
<text class="xs" x="340" y="951" text-anchor="middle"><tspan class="k">(5) (12)</tspan></text>
<rect class="bx" x="406" y="904" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="462" y="924" text-anchor="middle"><tspan class="r" style="font-weight:700">Financial</tspan></text>
<text class="xs" x="462" y="942" text-anchor="middle"><tspan class="k">(6) (7) (11)</tspan></text>
<text class="xs" x="462" y="960" text-anchor="middle"><tspan class="k">(13)</tspan></text>
<rect class="bx" x="528" y="904" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="584" y="924" text-anchor="middle"><tspan class="r" style="font-weight:700">Administrative</tspan></text>
<text class="xs" x="584" y="942" text-anchor="middle"><tspan class="k">(8) (9) (10)</tspan></text>
<text class="xs" x="584" y="960" text-anchor="middle"><tspan class="k">(14)</tspan></text>
<text x="44" y="998" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="998"><tspan class="k">The issues in Centre-State relations have been under consideration since the</tspan><tspan class="r"> mid</tspan></text>
<text x="58" y="1020"><tspan class="r">1960s</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1046" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1046"><tspan class="k">In this direction, the following developments have taken place:</tspan></text>
<rect class="bx" x="52" y="1058" width="85" height="30" rx="3"/>
<text class="sm" x="95" y="1077" text-anchor="middle"><tspan class="r">ARC</tspan><tspan class="k"> 1966</tspan></text>
<line class="ln" x1="141" y1="1073" x2="161" y2="1073" marker-end="url(#ah)"/>
<rect class="bx" x="164" y="1058" width="128" height="30" rx="3"/>
<text class="sm" x="228" y="1077" text-anchor="middle"><tspan class="r">Rajamannar</tspan><tspan class="k"> 1969</tspan></text>
<line class="ln" x1="295" y1="1073" x2="315" y2="1073" marker-end="url(#ah)"/>
<rect class="bx" x="318" y="1058" width="152" height="30" rx="3"/>
<text class="sm" x="394" y="1077" text-anchor="middle"><tspan class="r">Anandpur Sahib</tspan><tspan class="k"> 1973</tspan></text>
<line class="ln" x1="473" y1="1073" x2="493" y2="1073" marker-end="url(#ah)"/>
<rect class="bx" x="496" y="1058" width="131" height="30" rx="3"/>
<text class="sm" x="562" y="1077" text-anchor="middle"><tspan class="r">West Bengal</tspan><tspan class="k"> 1977</tspan></text>
<line class="ln" x1="340" y1="1089" x2="340" y2="1110" marker-end="url(#ah)"/>
<rect class="bx" x="219" y="1112" width="108" height="30" rx="3"/>
<text class="sm" x="273" y="1131" text-anchor="middle"><tspan class="r">Sarkaria</tspan><tspan class="k"> 1983</tspan></text>
<line class="ln" x1="329" y1="1127" x2="349" y2="1127" marker-end="url(#ah)"/>
<rect class="bx" x="352" y="1112" width="109" height="30" rx="3"/>
<text class="sm" x="407" y="1131" text-anchor="middle"><tspan class="r">Punchhi</tspan><tspan class="k"> 2007</tspan></text>
</svg>
</div></body></html>
