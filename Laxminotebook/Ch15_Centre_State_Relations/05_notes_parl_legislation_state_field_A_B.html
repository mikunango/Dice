<div id="vis-container"><h2 class="sr-only">Parliamentary Legislation in the State Field – I</h2>

<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Parliamentary Legislation in the State Field – I</text>
<text class="lb" x="40" y="98">3. Parliamentary Legislation in the State Field</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Flexibility in abnormal times:</tspan><tspan class="k"> The above scheme of distribution of legislative powers</tspan></text>
<text x="56" y="150"><tspan class="k">between the Centre and the states is to be maintained in</tspan><tspan class="r"> normal times</tspan><tspan class="k">. But, in</tspan></text>
<text x="56" y="172"><tspan class="r">abnormal times</tspan><tspan class="k">, the scheme of distribution is either</tspan><tspan class="b"> modified or suspended</tspan><tspan class="k">. In other</tspan></text>
<text x="56" y="194"><tspan class="k">words, the Constitution empowers the Parliament to make laws on any matter</tspan></text>
<text x="56" y="216"><tspan class="k">enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k"> under the following</tspan><tspan class="r"> five extraordinary circumstances</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="222" x2="340" y2="234"/>
<line class="ln" x1="100" y1="234" x2="580" y2="234"/>
<line class="ln" x1="100" y1="234" x2="100" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="234" x2="220" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="234" x2="340" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="234" x2="460" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="234" x2="580" y2="250" marker-end="url(#ah)"/>
<text class="xs" x="100" y="270" text-anchor="middle"><tspan class="r">A. Rajya Sabha</tspan></text>
<text class="xs" x="100" y="288" text-anchor="middle"><tspan class="r">resolution</tspan></text>
<text class="xs" x="220" y="270" text-anchor="middle"><tspan class="r">B. National</tspan></text>
<text class="xs" x="220" y="288" text-anchor="middle"><tspan class="r">Emergency</tspan></text>
<text class="xs" x="340" y="270" text-anchor="middle"><tspan class="r">C. States’ request</tspan></text>
<text class="xs" x="460" y="270" text-anchor="middle"><tspan class="r">D. International</tspan></text>
<text class="xs" x="460" y="288" text-anchor="middle"><tspan class="r">agreements</tspan></text>
<text class="xs" x="580" y="270" text-anchor="middle"><tspan class="r">E. President’s</tspan></text>
<text class="xs" x="580" y="288" text-anchor="middle"><tspan class="r">Rule</tspan></text>
<text class="sh" x="40" y="320"><tspan class="r" style="font-weight:700">A. When Rajya Sabha Passes a Resolution</tspan></text>
<text x="44" y="350"><tspan class="h" style="font-weight:700">Rajya Sabha resolution (Art. 249):</tspan><tspan class="k"> If the</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> declares that it is necessary in</tspan></text>
<text x="56" y="372"><tspan class="k">the</tspan><tspan class="r"> national interest</tspan><tspan class="k"> that Parliament should make laws with respect to</tspan><tspan class="b"> goods and</tspan></text>
<text x="56" y="394"><tspan class="b">services tax³ᵃ</tspan><tspan class="k"> or a matter in the</tspan><tspan class="r"> State List</tspan><tspan class="k">, then the Parliament becomes competent to</tspan></text>
<text x="56" y="416"><tspan class="k">make laws on that matter. Such a resolution must be supported by</tspan><tspan class="r"> two-thirds of the</tspan></text>
<text x="56" y="438"><tspan class="r">members present and voting</tspan><tspan class="k">. The resolution remains in force for</tspan><tspan class="r"> one year</tspan><tspan class="k">; it can be</tspan></text>
<text x="56" y="460"><tspan class="b">renewed any number of times</tspan><tspan class="k"> but not exceeding one year at a time. The laws cease to</tspan></text>
<text x="56" y="482"><tspan class="k">have effect on the</tspan><tspan class="r"> expiration of six months</tspan><tspan class="k"> after the resolution has ceased to be in</tspan></text>
<text x="56" y="504"><tspan class="k">force.</tspan></text>
<rect class="bx" x="69" y="516" width="250" height="30" rx="3"/>
<text class="sm" x="195" y="535" text-anchor="middle"><tspan class="k">RS resolution (</tspan><tspan class="r">2/3 present &amp; voting</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="323" y1="531" x2="343" y2="531" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="516" width="113" height="30" rx="3"/>
<text class="sm" x="402" y="535" text-anchor="middle"><tspan class="k">in force</tspan><tspan class="r"> 1 year</tspan></text>
<line class="ln" x1="462" y1="531" x2="482" y2="531" marker-end="url(#ah)"/>
<rect class="bx" x="485" y="516" width="126" height="30" rx="3"/>
<text class="sm" x="548" y="535" text-anchor="middle"><tspan class="b">renew any times</tspan></text>
<line class="ln" x1="340" y1="547" x2="340" y2="568" marker-end="url(#ah)"/>
<rect class="bx" x="252" y="570" width="176" height="30" rx="3"/>
<text class="sm" x="340" y="589" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after</tspan></text>
<text x="44" y="628"><tspan class="h" style="font-weight:700">Parliamentary law prevails:</tspan><tspan class="k"> This provision does</tspan><tspan class="r"> not restrict</tspan><tspan class="k"> the power of a state</tspan></text>
<text x="56" y="650"><tspan class="k">legislature to make laws on the same matter. But, in case of</tspan><tspan class="b"> inconsistency</tspan><tspan class="k"> between a</tspan></text>
<text x="56" y="672"><tspan class="k">state law and a parliamentary law, the</tspan><tspan class="r"> latter is to prevail</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="700"><tspan class="r" style="font-weight:700">B. During a National Emergency</tspan></text>
<text x="44" y="730"><tspan class="h" style="font-weight:700">National Emergency (Art. 250):</tspan><tspan class="k"> The Parliament acquires the power to legislate with</tspan></text>
<text x="56" y="752"><tspan class="k">respect to</tspan><tspan class="b"> goods and services tax³ᵇ</tspan><tspan class="k"> or matters in the</tspan><tspan class="r"> State List</tspan><tspan class="k">, while a proclamation of</tspan></text>
<text x="56" y="774"><tspan class="r">national emergency</tspan><tspan class="k"> is in operation. The laws become inoperative on the</tspan><tspan class="r"> expiration of six</tspan></text>
<text x="56" y="796"><tspan class="r">months</tspan><tspan class="k"> after the emergency has ceased to operate.</tspan></text>
<rect class="bx" x="101" y="808" width="219" height="30" rx="3"/>
<text class="sm" x="210" y="827" text-anchor="middle"><tspan class="r">National emergency</tspan><tspan class="k"> in operation</tspan></text>
<line class="ln" x1="323" y1="823" x2="343" y2="823" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="808" width="234" height="30" rx="3"/>
<text class="sm" x="462" y="827" text-anchor="middle"><tspan class="k">Parliament legislates on State List</tspan></text>
<line class="ln" x1="340" y1="839" x2="340" y2="860" marker-end="url(#ah)"/>
<rect class="bx" x="218" y="862" width="244" height="30" rx="3"/>
<text class="sm" x="340" y="881" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after emergency</tspan></text>
<text x="44" y="920"><tspan class="h" style="font-weight:700">Repugnancy – Parliament prevails:</tspan><tspan class="k"> Here also, the power of a state legislature to make</tspan></text>
<text x="56" y="942"><tspan class="k">laws on the same matter is</tspan><tspan class="r"> not restricted</tspan><tspan class="k">. But, in case of</tspan><tspan class="b"> repugnancy</tspan><tspan class="k"> between a state</tspan></text>
<text x="56" y="964"><tspan class="k">law and a parliamentary law, the</tspan><tspan class="r"> latter is to prevail</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1000"><tspan class="r" style="font-weight:700">3a</tspan><tspan class="k"> The provision for goods and services tax was added by the 101st Amendment Act of 2016.</tspan></text>
