<div id="vis-container"><h2 class="sr-only">Parliamentary Legislation in the State Field – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1172" role="img"><title>Parliamentary Legislation in the State Field – I</title><desc>Parliamentary Legislation in the State Field – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="128" y="26" width="424" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Parliamentary Legislation in the State Field – I</text>
<text class="lb" x="40" y="98">3. Parliamentary Legislation in the State Field</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The above scheme of distribution of legislative powers between the Centre and the</tspan></text>
<text x="58" y="148"><tspan class="k">states is to be maintained in</tspan><tspan class="r"> normal times</tspan><tspan class="k">.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">But, in</tspan><tspan class="r"> abnormal times</tspan><tspan class="k">, the scheme of distribution is either</tspan><tspan class="b"> modified or suspended</tspan><tspan class="k">.</tspan></text>
<text x="44" y="200" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="200"><tspan class="k">In other words, the Constitution empowers the Parliament to make laws on any matter</tspan></text>
<text x="58" y="222"><tspan class="k">enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k"> under the following</tspan><tspan class="r"> five extraordinary circumstances</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="228" x2="340" y2="240"/>
<line class="ln" x1="100" y1="240" x2="580" y2="240"/>
<line class="ln" x1="100" y1="240" x2="100" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="240" x2="220" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="240" x2="340" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="240" x2="460" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="240" x2="580" y2="256" marker-end="url(#ah)"/>
<text class="xs" x="100" y="276" text-anchor="middle"><tspan class="r">A. Rajya Sabha</tspan></text>
<text class="xs" x="100" y="294" text-anchor="middle"><tspan class="r">resolution</tspan></text>
<text class="xs" x="220" y="276" text-anchor="middle"><tspan class="r">B. National</tspan></text>
<text class="xs" x="220" y="294" text-anchor="middle"><tspan class="r">Emergency</tspan></text>
<text class="xs" x="340" y="276" text-anchor="middle"><tspan class="r">C. States’ request</tspan></text>
<text class="xs" x="460" y="276" text-anchor="middle"><tspan class="r">D. International</tspan></text>
<text class="xs" x="460" y="294" text-anchor="middle"><tspan class="r">agreements</tspan></text>
<text class="xs" x="580" y="276" text-anchor="middle"><tspan class="r">E. President’s</tspan></text>
<text class="xs" x="580" y="294" text-anchor="middle"><tspan class="r">Rule</tspan></text>
<text class="sh" x="40" y="326"><tspan class="r" style="font-weight:700">A. When Rajya Sabha Passes a Resolution</tspan></text>
<text x="44" y="354" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="354"><tspan class="k">If the</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> declares that it is necessary in the</tspan><tspan class="r"> national interest</tspan><tspan class="k"> that</tspan></text>
<text x="58" y="376"><tspan class="k">Parliament should make laws with respect to</tspan><tspan class="b"> goods and services tax³ᵃ</tspan><tspan class="k"> or a matter in</tspan></text>
<text x="58" y="398"><tspan class="k">the</tspan><tspan class="r"> State List</tspan><tspan class="k">, then the Parliament becomes competent to make laws on that matter.</tspan></text>
<text x="44" y="424" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="424"><tspan class="k">Such a resolution must be supported by</tspan><tspan class="r"> two-thirds of the members present and voting</tspan><tspan class="k">.</tspan></text>
<text x="44" y="450" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="450"><tspan class="k">The resolution remains in force for</tspan><tspan class="r"> one year</tspan><tspan class="k">; it can be</tspan><tspan class="b"> renewed any number of times</tspan></text>
<text x="58" y="472"><tspan class="k">but not exceeding one year at a time.</tspan></text>
<text x="44" y="498" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="498"><tspan class="k">The laws cease to have effect on the</tspan><tspan class="r"> expiration of six months</tspan><tspan class="k"> after the resolution has</tspan></text>
<text x="58" y="520"><tspan class="k">ceased to be in force.</tspan></text>
<rect class="bx" x="69" y="532" width="250" height="30" rx="3"/>
<text class="sm" x="195" y="551" text-anchor="middle"><tspan class="k">RS resolution (</tspan><tspan class="r">2/3 present &amp; voting</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="323" y1="547" x2="343" y2="547" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="532" width="113" height="30" rx="3"/>
<text class="sm" x="402" y="551" text-anchor="middle"><tspan class="k">in force</tspan><tspan class="r"> 1 year</tspan></text>
<line class="ln" x1="462" y1="547" x2="482" y2="547" marker-end="url(#ah)"/>
<rect class="bx" x="485" y="532" width="126" height="30" rx="3"/>
<text class="sm" x="548" y="551" text-anchor="middle"><tspan class="b">renew any times</tspan></text>
<line class="ln" x1="340" y1="563" x2="340" y2="584" marker-end="url(#ah)"/>
<rect class="bx" x="252" y="586" width="176" height="30" rx="3"/>
<text class="sm" x="340" y="605" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after</tspan></text>
<text x="44" y="642" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="642"><tspan class="k">This provision does</tspan><tspan class="r"> not restrict</tspan><tspan class="k"> the power of a state legislature to make laws on the</tspan></text>
<text x="58" y="664"><tspan class="k">same matter.</tspan></text>
<text x="44" y="690" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="690"><tspan class="k">But, in case of</tspan><tspan class="b"> inconsistency</tspan><tspan class="k"> between a state law and a parliamentary law, the</tspan><tspan class="r"> latter</tspan></text>
<text x="58" y="712"><tspan class="r">is to prevail</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="740"><tspan class="r" style="font-weight:700">B. During a National Emergency</tspan></text>
<text x="44" y="768" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="768"><tspan class="k">The Parliament acquires the power to legislate with respect to</tspan><tspan class="b"> goods and services</tspan></text>
<text x="58" y="790"><tspan class="b">tax³ᵇ</tspan><tspan class="k"> or matters in the</tspan><tspan class="r"> State List</tspan><tspan class="k">, while a proclamation of</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> is in</tspan></text>
<text x="58" y="812"><tspan class="k">operation.</tspan></text>
<text x="44" y="838" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="838"><tspan class="k">The laws become inoperative on the</tspan><tspan class="r"> expiration of six months</tspan><tspan class="k"> after the emergency has</tspan></text>
<text x="58" y="860"><tspan class="k">ceased to operate.</tspan></text>
<rect class="bx" x="101" y="872" width="219" height="30" rx="3"/>
<text class="sm" x="210" y="891" text-anchor="middle"><tspan class="r">National emergency</tspan><tspan class="k"> in operation</tspan></text>
<line class="ln" x1="323" y1="887" x2="343" y2="887" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="872" width="234" height="30" rx="3"/>
<text class="sm" x="462" y="891" text-anchor="middle"><tspan class="k">Parliament legislates on State List</tspan></text>
<line class="ln" x1="340" y1="903" x2="340" y2="924" marker-end="url(#ah)"/>
<rect class="bx" x="218" y="926" width="244" height="30" rx="3"/>
<text class="sm" x="340" y="945" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after emergency</tspan></text>
<text x="44" y="982" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="982"><tspan class="k">Here also, the power of a state legislature to make laws on the same matter is</tspan><tspan class="r"> not</tspan></text>
<text x="58" y="1004"><tspan class="r">restricted</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1030" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1030"><tspan class="k">But, in case of</tspan><tspan class="b"> repugnancy</tspan><tspan class="k"> between a state law and a parliamentary law, the</tspan><tspan class="r"> latter is</tspan></text>
<text x="58" y="1052"><tspan class="r">to prevail</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1088"><tspan class="r" style="font-weight:700">3a</tspan><tspan class="k"> The provision for goods and services tax was added by the 101st Amendment Act of 2016.</tspan></text>
<rect x="40" y="1066" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1133"><tspan class="r" style="font-weight:700">3b</tspan><tspan class="k"> Ibid.</tspan></text>
<rect x="40" y="1111" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
