<div id="vis-container"><h2 class="sr-only">Parliamentary Legislation in the State Field – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1286" role="img"><title>Parliamentary Legislation in the State Field – I</title><desc>Parliamentary Legislation in the State Field – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Parliamentary Legislation in the State Field – I</text>
<text class="lb" x="40" y="98">3. Parliamentary Legislation in the State Field</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Normal times:</tspan><tspan class="k"> The above scheme of distribution of legislative powers between the</tspan></text>
<text x="56" y="150"><tspan class="k">Centre and the states is to be maintained in</tspan><tspan class="r"> normal times</tspan><tspan class="k">.</tspan></text>
<text x="44" y="178"><tspan class="h" style="font-weight:700">Abnormal times:</tspan><tspan class="k"> But, in</tspan><tspan class="r"> abnormal times</tspan><tspan class="k">, the scheme of distribution is either</tspan><tspan class="b"> modified or</tspan></text>
<text x="56" y="200"><tspan class="b">suspended</tspan><tspan class="k">.</tspan></text>
<text x="44" y="228"><tspan class="h" style="font-weight:700">Five circumstances:</tspan><tspan class="k"> In other words, the Constitution empowers the Parliament to make</tspan></text>
<text x="56" y="250"><tspan class="k">laws on any matter enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k"> under the following</tspan><tspan class="r"> five extraordinary</tspan></text>
<text x="56" y="272"><tspan class="r">circumstances</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="278" x2="340" y2="290"/>
<line class="ln" x1="100" y1="290" x2="580" y2="290"/>
<line class="ln" x1="100" y1="290" x2="100" y2="306" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="290" x2="220" y2="306" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="290" x2="340" y2="306" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="290" x2="460" y2="306" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="290" x2="580" y2="306" marker-end="url(#ah)"/>
<text class="xs" x="100" y="326" text-anchor="middle"><tspan class="r">A. Rajya Sabha</tspan></text>
<text class="xs" x="100" y="344" text-anchor="middle"><tspan class="r">resolution</tspan></text>
<text class="xs" x="220" y="326" text-anchor="middle"><tspan class="r">B. National</tspan></text>
<text class="xs" x="220" y="344" text-anchor="middle"><tspan class="r">Emergency</tspan></text>
<text class="xs" x="340" y="326" text-anchor="middle"><tspan class="r">C. States’ request</tspan></text>
<text class="xs" x="460" y="326" text-anchor="middle"><tspan class="r">D. International</tspan></text>
<text class="xs" x="460" y="344" text-anchor="middle"><tspan class="r">agreements</tspan></text>
<text class="xs" x="580" y="326" text-anchor="middle"><tspan class="r">E. President’s</tspan></text>
<text class="xs" x="580" y="344" text-anchor="middle"><tspan class="r">Rule</tspan></text>
<text class="sh" x="40" y="376"><tspan class="r" style="font-weight:700">A. When Rajya Sabha Passes a Resolution</tspan></text>
<text x="44" y="406"><tspan class="h" style="font-weight:700">RS resolution – national interest:</tspan><tspan class="k"> If the</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> declares that it is necessary in</tspan></text>
<text x="56" y="428"><tspan class="k">the</tspan><tspan class="r"> national interest</tspan><tspan class="k"> that Parliament should make laws with respect to</tspan><tspan class="b"> goods and</tspan></text>
<text x="56" y="450"><tspan class="b">services tax³ᵃ</tspan><tspan class="k"> or a matter in the</tspan><tspan class="r"> State List</tspan><tspan class="k">, then the Parliament becomes competent to</tspan></text>
<text x="56" y="472"><tspan class="k">make laws on that matter.</tspan></text>
<text x="44" y="500"><tspan class="h" style="font-weight:700">2/3 majority:</tspan><tspan class="k"> Such a resolution must be supported by</tspan><tspan class="r"> two-thirds of the members</tspan></text>
<text x="56" y="522"><tspan class="r">present and voting</tspan><tspan class="k">.</tspan></text>
<text x="44" y="550"><tspan class="h" style="font-weight:700">1 year validity:</tspan><tspan class="k"> The resolution remains in force for</tspan><tspan class="r"> one year</tspan><tspan class="k">; it can be</tspan><tspan class="b"> renewed any</tspan></text>
<text x="56" y="572"><tspan class="b">number of times</tspan><tspan class="k"> but not exceeding one year at a time.</tspan></text>
<text x="44" y="600"><tspan class="h" style="font-weight:700">6 months after:</tspan><tspan class="k"> The laws cease to have effect on the</tspan><tspan class="r"> expiration of six months</tspan><tspan class="k"> after the</tspan></text>
<text x="56" y="622"><tspan class="k">resolution has ceased to be in force.</tspan></text>
<rect class="bx" x="69" y="634" width="250" height="30" rx="3"/>
<text class="sm" x="195" y="653" text-anchor="middle"><tspan class="k">RS resolution (</tspan><tspan class="r">2/3 present &amp; voting</tspan><tspan class="k">)</tspan></text>
<line class="ln" x1="323" y1="649" x2="343" y2="649" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="634" width="113" height="30" rx="3"/>
<text class="sm" x="402" y="653" text-anchor="middle"><tspan class="k">in force</tspan><tspan class="r"> 1 year</tspan></text>
<line class="ln" x1="462" y1="649" x2="482" y2="649" marker-end="url(#ah)"/>
<rect class="bx" x="485" y="634" width="126" height="30" rx="3"/>
<text class="sm" x="548" y="653" text-anchor="middle"><tspan class="b">renew any times</tspan></text>
<line class="ln" x1="340" y1="665" x2="340" y2="686" marker-end="url(#ah)"/>
<rect class="bx" x="252" y="688" width="176" height="30" rx="3"/>
<text class="sm" x="340" y="707" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after</tspan></text>
<text x="44" y="746"><tspan class="h" style="font-weight:700">State power intact:</tspan><tspan class="k"> This provision does</tspan><tspan class="r"> not restrict</tspan><tspan class="k"> the power of a state legislature to</tspan></text>
<text x="56" y="768"><tspan class="k">make laws on the same matter.</tspan></text>
<text x="44" y="796"><tspan class="h" style="font-weight:700">Parliament prevails:</tspan><tspan class="k"> But, in case of</tspan><tspan class="b"> inconsistency</tspan><tspan class="k"> between a state law and a</tspan></text>
<text x="56" y="818"><tspan class="k">parliamentary law, the</tspan><tspan class="r"> latter is to prevail</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="846"><tspan class="r" style="font-weight:700">B. During a National Emergency</tspan></text>
<text x="44" y="876"><tspan class="h" style="font-weight:700">Emergency power:</tspan><tspan class="k"> The Parliament acquires the power to legislate with respect to</tspan><tspan class="b"> goods</tspan></text>
<text x="56" y="898"><tspan class="b">and services tax³ᵇ</tspan><tspan class="k"> or matters in the</tspan><tspan class="r"> State List</tspan><tspan class="k">, while a proclamation of</tspan><tspan class="r"> national</tspan></text>
<text x="56" y="920"><tspan class="r">emergency</tspan><tspan class="k"> is in operation.</tspan></text>
<text x="44" y="948"><tspan class="h" style="font-weight:700">6 months after emergency:</tspan><tspan class="k"> The laws become inoperative on the</tspan><tspan class="r"> expiration of six</tspan></text>
<text x="56" y="970"><tspan class="r">months</tspan><tspan class="k"> after the emergency has ceased to operate.</tspan></text>
<rect class="bx" x="101" y="982" width="219" height="30" rx="3"/>
<text class="sm" x="210" y="1001" text-anchor="middle"><tspan class="r">National emergency</tspan><tspan class="k"> in operation</tspan></text>
<line class="ln" x1="323" y1="997" x2="343" y2="997" marker-end="url(#ah)"/>
<rect class="bx" x="346" y="982" width="234" height="30" rx="3"/>
<text class="sm" x="462" y="1001" text-anchor="middle"><tspan class="k">Parliament legislates on State List</tspan></text>
<line class="ln" x1="340" y1="1013" x2="340" y2="1034" marker-end="url(#ah)"/>
<rect class="bx" x="218" y="1036" width="244" height="30" rx="3"/>
<text class="sm" x="340" y="1055" text-anchor="middle"><tspan class="k">laws end</tspan><tspan class="r"> 6 months</tspan><tspan class="k"> after emergency</tspan></text>
<text x="44" y="1094"><tspan class="h" style="font-weight:700">State power intact:</tspan><tspan class="k"> Here also, the power of a state legislature to make laws on the</tspan></text>
<text x="56" y="1116"><tspan class="k">same matter is</tspan><tspan class="r"> not restricted</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1144"><tspan class="h" style="font-weight:700">Parliament prevails:</tspan><tspan class="k"> But, in case of</tspan><tspan class="b"> repugnancy</tspan><tspan class="k"> between a state law and a</tspan></text>
<text x="56" y="1166"><tspan class="k">parliamentary law, the</tspan><tspan class="r"> latter is to prevail</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1202"><tspan class="r" style="font-weight:700">3a</tspan><tspan class="k"> The provision for goods and services tax was added by the 101st Amendment Act of 2016.</tspan></text>
<rect x="40" y="1180" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1247"><tspan class="r" style="font-weight:700">3b</tspan><tspan class="k"> Ibid.</tspan></text>
<rect x="40" y="1225" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
