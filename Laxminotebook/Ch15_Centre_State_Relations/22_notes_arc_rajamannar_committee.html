<div id="vis-container"><h2 class="sr-only">Administrative Reforms Commission and Rajamannar Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1575" role="img"><title>Administrative Reforms Commission and Rajamannar Committee</title><desc>Administrative Reforms Commission and Rajamannar Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="65" y="26" width="550" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Reforms Commission and Rajamannar Committee</text>
<text class="lb" x="40" y="98">Administrative Reforms Commission</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The Central government appointed a</tspan><tspan class="r"> six-member First Administrative Reforms</tspan></text>
<text x="58" y="148"><tspan class="r">Commission (ARC)</tspan><tspan class="k"> of India in</tspan><tspan class="r"> 1966</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Morarji Desai</tspan><tspan class="k"> (</tspan><tspan class="b">followed</tspan></text>
<text x="58" y="170"><tspan class="b">by K Hanumanthayya</tspan><tspan class="k">).</tspan></text>
<text x="44" y="196" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="196"><tspan class="k">Its terms of references included, among others, the examination of Centre–State</tspan></text>
<text x="58" y="218"><tspan class="k">relations.</tspan></text>
<text x="44" y="244" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="244"><tspan class="k">In order to examine thoroughly the various issues in Centre–state relations, the ARC</tspan></text>
<text x="58" y="266"><tspan class="k">constituted a</tspan><tspan class="r"> study team under M.C. Setalvad</tspan><tspan class="k">.</tspan></text>
<text x="44" y="292" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="292"><tspan class="k">On the basis of the report of this study team, the ARC finalised its own report and</tspan></text>
<text x="58" y="314"><tspan class="k">submitted it to the Central government in</tspan><tspan class="r"> 1969</tspan><tspan class="k">.</tspan></text>
<text x="44" y="340" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="340"><tspan class="k">It made</tspan><tspan class="r"> 22 recommendations</tspan><tspan class="k"> for improving the Centre–state relations.</tspan></text>
<text x="44" y="366" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="366"><tspan class="k">The important recommendations are:</tspan></text>
<rect class="bx" x="62" y="378" width="85" height="30" rx="3"/>
<text class="sm" x="104" y="397" text-anchor="middle"><tspan class="k">ARC</tspan><tspan class="r"> 1966</tspan></text>
<line class="ln" x1="150" y1="393" x2="170" y2="393" marker-end="url(#ah)"/>
<rect class="bx" x="173" y="378" width="235" height="30" rx="3"/>
<text class="sm" x="291" y="397" text-anchor="middle"><tspan class="k">Morarji Desai →</tspan><tspan class="b"> K Hanumanthayya</tspan></text>
<line class="ln" x1="411" y1="393" x2="431" y2="393" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="378" width="184" height="30" rx="3"/>
<text class="sm" x="526" y="397" text-anchor="middle"><tspan class="k">study team:</tspan><tspan class="r"> M.C. Setalvad</tspan></text>
<line class="ln" x1="340" y1="409" x2="340" y2="430" marker-end="url(#ah)"/>
<rect class="bx" x="204" y="432" width="93" height="30" rx="3"/>
<text class="sm" x="251" y="451" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1969</tspan></text>
<line class="ln" x1="301" y1="447" x2="321" y2="447" marker-end="url(#ah)"/>
<rect class="bx" x="324" y="432" width="152" height="30" rx="3"/>
<text class="sm" x="400" y="451" text-anchor="middle"><tspan class="r">22</tspan><tspan class="k"> recommendations</tspan></text>
<text x="44" y="488" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="488"><tspan class="k">Establishment of an</tspan><tspan class="r"> Inter-State Council under Article 263</tspan><tspan class="k"> of the Constitution.</tspan></text>
<text x="44" y="514" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="514"><tspan class="k">Appointment of persons having</tspan><tspan class="r"> long experience in public life and administration</tspan><tspan class="k"> and</tspan></text>
<text x="58" y="536"><tspan class="b">nonpartisan attitude</tspan><tspan class="k"> as</tspan><tspan class="r"> governors</tspan><tspan class="k">.</tspan></text>
<text x="44" y="562" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="562"><tspan class="r">Delegation of powers</tspan><tspan class="k"> to the maximum extent to the states.</tspan></text>
<text x="44" y="588" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="588"><tspan class="k">Transferring of</tspan><tspan class="r"> more financial resources</tspan><tspan class="k"> to the states to reduce their dependency upon</tspan></text>
<text x="58" y="610"><tspan class="k">the Centre.</tspan></text>
<text x="44" y="636" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="636"><tspan class="k">Deployment of</tspan><tspan class="r"> Central armed forces</tspan><tspan class="k"> in the states either on their request or otherwise.</tspan></text>
<text x="44" y="662" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="662"><tspan class="r">No action was taken</tspan><tspan class="k"> by the Central government on the recommendations of the ARC.</tspan></text>
<text class="lb" x="40" y="694">Rajamannar Committee</text>
<text x="44" y="722" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="722"><tspan class="k">In</tspan><tspan class="r"> 1969</tspan><tspan class="k">, the</tspan><tspan class="r"> Tamil Nadu Government (DMK)</tspan><tspan class="k"> appointed a</tspan><tspan class="r"> three-member committee</tspan></text>
<text x="58" y="744"><tspan class="k">under the chairmanship of</tspan><tspan class="r"> Dr. P.V. Rajamannar</tspan><tspan class="k"> to examine the entire question of</tspan></text>
<text x="58" y="766"><tspan class="k">Centre–state relations and to suggest amendments to the Constitution so as to secure</tspan></text>
<text x="58" y="788"><tspan class="r">utmost autonomy to the states</tspan><tspan class="k">.¹⁹</tspan></text>
<text x="44" y="814" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="814"><tspan class="k">The committee submitted its report to the Tamil Nadu Government in</tspan><tspan class="r"> 1971</tspan><tspan class="k">.</tspan></text>
<text x="44" y="840" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="840"><tspan class="k">The Committee identified the reasons for the prevailing</tspan><tspan class="r"> unitary trends (tendencies of</tspan></text>
<text x="58" y="862"><tspan class="r">centralisation)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="44" y="888" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="888"><tspan class="k">They include:</tspan></text>
<text x="70" y="914" class="r" style="font-weight:700">(i)</text>
<text x="107" y="914"><tspan class="k">certain provisions in the Constitution which confer</tspan><tspan class="b"> special powers on the</tspan></text>
<text x="107" y="936"><tspan class="b">Centre</tspan><tspan class="k">;</tspan></text>
<text x="70" y="962" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="962"><tspan class="b">one-party rule</tspan><tspan class="k"> both at the Centre and in the states;</tspan></text>
<text x="70" y="988" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="988"><tspan class="b">inadequacy of states’ fiscal resources</tspan><tspan class="k"> and consequent dependence on the Centre</tspan></text>
<text x="107" y="1010"><tspan class="k">for financial assistance; and</tspan></text>
<text x="70" y="1036" class="r" style="font-weight:700">(iv)</text>
<text x="107" y="1036"><tspan class="k">the institution of</tspan><tspan class="b"> Central planning</tspan><tspan class="k"> and the role of the Planning Commission.</tspan></text>
<path d="M64 894 L58 894 L58 1042 L64 1042" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="1042" x2="340" y2="1054"/>
<line class="ln" x1="115" y1="1054" x2="565" y2="1054"/>
<line class="ln" x1="115" y1="1054" x2="115" y2="1070" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1054" x2="265" y2="1070" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1054" x2="415" y2="1070" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1054" x2="565" y2="1070" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1090" text-anchor="middle"><tspan class="b">special powers to</tspan></text>
<text class="sm" x="115" y="1108" text-anchor="middle"><tspan class="b">Centre</tspan></text>
<text class="sm" x="265" y="1090" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<text class="sm" x="415" y="1090" text-anchor="middle"><tspan class="b">weak state finances</tspan></text>
<text class="sm" x="565" y="1090" text-anchor="middle"><tspan class="b">Central planning</tspan></text>
<text x="44" y="1138" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1138"><tspan class="k">The important recommendations of the committee are as follows:</tspan></text>
<text x="70" y="1164" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1164"><tspan class="k">An</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> should be set up immediately;</tspan></text>
<text x="70" y="1190" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1190"><tspan class="r">Finance Commission</tspan><tspan class="k"> should be made a</tspan><tspan class="r"> permanent body</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1216" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1216"><tspan class="r">Planning Commission should be disbanded</tspan><tspan class="k"> and its place should be taken by a</tspan></text>
<text x="113" y="1238"><tspan class="k">statutory body;</tspan></text>
<text x="70" y="1264" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1264"><tspan class="r">Articles 356, 357 and 365</tspan><tspan class="k"> (dealing with President’s Rule) should be</tspan><tspan class="r"> totally</tspan></text>
<text x="113" y="1286"><tspan class="r">omitted</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1312" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1312"><tspan class="k">The provision that the state ministry holds office during the</tspan><tspan class="b"> pleasure of the</tspan></text>
<text x="113" y="1334"><tspan class="b">governor</tspan><tspan class="k"> should be omitted;</tspan></text>
<text x="70" y="1360" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1360"><tspan class="k">Certain subjects of the Union List and the Concurrent List should be</tspan></text>
<text x="113" y="1382"><tspan class="b">transferred to the State List</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1408" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1408"><tspan class="k">the</tspan><tspan class="r"> residuary powers should be allocated to the states</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1434" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1434"><tspan class="r">All-India services (IAS, IPS and IFoS) should be abolished</tspan><tspan class="k">.</tspan></text>
<path d="M64 1144 L58 1144 L58 1440 L64 1440" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1460" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1460"><tspan class="k">The Central government</tspan><tspan class="r"> completely ignored</tspan><tspan class="k"> the recommendations of the Rajamannar</tspan></text>
<text x="58" y="1482"><tspan class="k">Committee.</tspan></text>
<text class="xs" x="50" y="1518"><tspan class="r" style="font-weight:700">19</tspan><tspan class="k"> The other two members of the committee were Dr. Lakshmanswamy Mudaliar and P.C. Chandra</tspan></text>
<text class="xs" x="50" y="1536"><tspan class="k">Reddy.</tspan></text>
<rect x="40" y="1496" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
