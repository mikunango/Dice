<div id="vis-container"><h2 class="sr-only">Administrative Reforms Commission and Rajamannar Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1655" role="img"><title>Administrative Reforms Commission and Rajamannar Committee</title><desc>Administrative Reforms Commission and Rajamannar Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="65" y="26" width="550" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Reforms Commission and Rajamannar Committee</text>
<text class="lb" x="40" y="98">Administrative Reforms Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">ARC 1966:</tspan><tspan class="k"> The Central government appointed a</tspan><tspan class="r"> six-member First Administrative Reforms</tspan></text>
<text x="56" y="150"><tspan class="r">Commission (ARC)</tspan><tspan class="k"> of India in</tspan><tspan class="r"> 1966</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Morarji Desai</tspan><tspan class="k"> (</tspan><tspan class="b">followed</tspan></text>
<text x="56" y="172"><tspan class="b">by K Hanumanthayya</tspan><tspan class="k">).</tspan></text>
<text x="44" y="200"><tspan class="h" style="font-weight:700">Terms of reference:</tspan><tspan class="k"> Its terms of references included, among others, the examination of</tspan></text>
<text x="56" y="222"><tspan class="k">Centre–State relations.</tspan></text>
<text x="44" y="250"><tspan class="h" style="font-weight:700">Setalvad study team:</tspan><tspan class="k"> In order to examine thoroughly the various issues in Centre–state</tspan></text>
<text x="56" y="272"><tspan class="k">relations, the ARC constituted a</tspan><tspan class="r"> study team under M.C. Setalvad</tspan><tspan class="k">.</tspan></text>
<text x="44" y="300"><tspan class="h" style="font-weight:700">Report 1969:</tspan><tspan class="k"> On the basis of the report of this study team, the ARC finalised its own</tspan></text>
<text x="56" y="322"><tspan class="k">report and submitted it to the Central government in</tspan><tspan class="r"> 1969</tspan><tspan class="k">.</tspan></text>
<text x="44" y="350"><tspan class="h" style="font-weight:700">22 recommendations:</tspan><tspan class="k"> It made</tspan><tspan class="r"> 22 recommendations</tspan><tspan class="k"> for improving the Centre–state</tspan></text>
<text x="56" y="372"><tspan class="k">relations.</tspan></text>
<text x="44" y="400"><tspan class="h" style="font-weight:700">Key recommendations:</tspan><tspan class="k"> The important recommendations are:</tspan></text>
<rect class="bx" x="62" y="412" width="85" height="30" rx="3"/>
<text class="sm" x="104" y="431" text-anchor="middle"><tspan class="k">ARC</tspan><tspan class="r"> 1966</tspan></text>
<line class="ln" x1="150" y1="427" x2="170" y2="427" marker-end="url(#ah)"/>
<rect class="bx" x="173" y="412" width="235" height="30" rx="3"/>
<text class="sm" x="291" y="431" text-anchor="middle"><tspan class="k">Morarji Desai →</tspan><tspan class="b"> K Hanumanthayya</tspan></text>
<line class="ln" x1="411" y1="427" x2="431" y2="427" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="412" width="184" height="30" rx="3"/>
<text class="sm" x="526" y="431" text-anchor="middle"><tspan class="k">study team:</tspan><tspan class="r"> M.C. Setalvad</tspan></text>
<line class="ln" x1="340" y1="443" x2="340" y2="464" marker-end="url(#ah)"/>
<rect class="bx" x="204" y="466" width="93" height="30" rx="3"/>
<text class="sm" x="251" y="485" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1969</tspan></text>
<line class="ln" x1="301" y1="481" x2="321" y2="481" marker-end="url(#ah)"/>
<rect class="bx" x="324" y="466" width="152" height="30" rx="3"/>
<text class="sm" x="400" y="485" text-anchor="middle"><tspan class="r">22</tspan><tspan class="k"> recommendations</tspan></text>
<text x="44" y="524" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="524"><tspan class="k">Establishment of an</tspan><tspan class="r"> Inter-State Council under Article 263</tspan><tspan class="k"> of the Constitution.</tspan></text>
<text x="44" y="552" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="552"><tspan class="k">Appointment of persons having</tspan><tspan class="r"> long experience in public life and administration</tspan><tspan class="k"> and</tspan></text>
<text x="58" y="574"><tspan class="b">nonpartisan attitude</tspan><tspan class="k"> as</tspan><tspan class="r"> governors</tspan><tspan class="k">.</tspan></text>
<text x="44" y="602" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="602"><tspan class="r">Delegation of powers</tspan><tspan class="k"> to the maximum extent to the states.</tspan></text>
<text x="44" y="630" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="630"><tspan class="k">Transferring of</tspan><tspan class="r"> more financial resources</tspan><tspan class="k"> to the states to reduce their dependency upon</tspan></text>
<text x="58" y="652"><tspan class="k">the Centre.</tspan></text>
<text x="44" y="680" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="680"><tspan class="k">Deployment of</tspan><tspan class="r"> Central armed forces</tspan><tspan class="k"> in the states either on their request or otherwise.</tspan></text>
<text x="44" y="708"><tspan class="h" style="font-weight:700">No action:</tspan><tspan class="r"> No action was taken</tspan><tspan class="k"> by the Central government on the recommendations of</tspan></text>
<text x="56" y="730"><tspan class="k">the ARC.</tspan></text>
<text class="lb" x="40" y="762">Rajamannar Committee</text>
<text x="44" y="792"><tspan class="h" style="font-weight:700">Rajamannar 1969 (TN):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1969</tspan><tspan class="k">, the</tspan><tspan class="r"> Tamil Nadu Government (DMK)</tspan><tspan class="k"> appointed a</tspan></text>
<text x="56" y="814"><tspan class="r">three-member committee</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Dr. P.V. Rajamannar</tspan><tspan class="k"> to examine the</tspan></text>
<text x="56" y="836"><tspan class="k">entire question of Centre–state relations and to suggest amendments to the Constitution</tspan></text>
<text x="56" y="858"><tspan class="k">so as to secure</tspan><tspan class="r"> utmost autonomy to the states</tspan><tspan class="k">.¹⁹</tspan></text>
<text x="44" y="886"><tspan class="h" style="font-weight:700">Report 1971:</tspan><tspan class="k"> The committee submitted its report to the Tamil Nadu Government in</tspan><tspan class="r"> 1971</tspan><tspan class="k">.</tspan></text>
<text x="44" y="914"><tspan class="h" style="font-weight:700">Unitary trends:</tspan><tspan class="k"> The Committee identified the reasons for the prevailing</tspan><tspan class="r"> unitary trends</tspan></text>
<text x="56" y="936"><tspan class="r">(tendencies of centralisation)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="44" y="964"><tspan class="h" style="font-weight:700">Reasons:</tspan><tspan class="k"> They include:</tspan></text>
<text x="70" y="990" class="r" style="font-weight:700">(i)</text>
<text x="107" y="990"><tspan class="k">certain provisions in the Constitution which confer</tspan><tspan class="b"> special powers on the</tspan></text>
<text x="107" y="1012"><tspan class="b">Centre</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1038" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1038"><tspan class="b">one-party rule</tspan><tspan class="k"> both at the Centre and in the states;</tspan></text>
<text x="70" y="1064" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1064"><tspan class="b">inadequacy of states’ fiscal resources</tspan><tspan class="k"> and consequent dependence on the Centre</tspan></text>
<text x="107" y="1086"><tspan class="k">for financial assistance; and</tspan></text>
<text x="70" y="1112" class="r" style="font-weight:700">(iv)</text>
<text x="107" y="1112"><tspan class="k">the institution of</tspan><tspan class="b"> Central planning</tspan><tspan class="k"> and the role of the Planning Commission.</tspan></text>
<path d="M64 970 L58 970 L58 1118 L64 1118" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="1118" x2="340" y2="1130"/>
<line class="ln" x1="115" y1="1130" x2="565" y2="1130"/>
<line class="ln" x1="115" y1="1130" x2="115" y2="1146" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1130" x2="265" y2="1146" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1130" x2="415" y2="1146" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1130" x2="565" y2="1146" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1166" text-anchor="middle"><tspan class="b">special powers to</tspan></text>
<text class="sm" x="115" y="1184" text-anchor="middle"><tspan class="b">Centre</tspan></text>
<text class="sm" x="265" y="1166" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<text class="sm" x="415" y="1166" text-anchor="middle"><tspan class="b">weak state finances</tspan></text>
<text class="sm" x="565" y="1166" text-anchor="middle"><tspan class="b">Central planning</tspan></text>
<text x="44" y="1216"><tspan class="h" style="font-weight:700">Recommendations:</tspan><tspan class="k"> The important recommendations of the committee are as follows:</tspan></text>
<text x="70" y="1242" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1242"><tspan class="k">An</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> should be set up immediately;</tspan></text>
<text x="70" y="1268" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1268"><tspan class="r">Finance Commission</tspan><tspan class="k"> should be made a</tspan><tspan class="r"> permanent body</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1294" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1294"><tspan class="r">Planning Commission should be disbanded</tspan><tspan class="k"> and its place should be taken by a</tspan></text>
<text x="113" y="1316"><tspan class="k">statutory body;</tspan></text>
<text x="70" y="1342" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1342"><tspan class="r">Articles 356, 357 and 365</tspan><tspan class="k"> (dealing with President’s Rule) should be</tspan><tspan class="r"> totally</tspan></text>
<text x="113" y="1364"><tspan class="r">omitted</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1390" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1390"><tspan class="k">The provision that the state ministry holds office during the</tspan><tspan class="b"> pleasure of the</tspan></text>
<text x="113" y="1412"><tspan class="b">governor</tspan><tspan class="k"> should be omitted;</tspan></text>
<text x="70" y="1438" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1438"><tspan class="k">Certain subjects of the Union List and the Concurrent List should be</tspan></text>
<text x="113" y="1460"><tspan class="b">transferred to the State List</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1486" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1486"><tspan class="k">the</tspan><tspan class="r"> residuary powers should be allocated to the states</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1512" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1512"><tspan class="r">All-India services (IAS, IPS and IFoS) should be abolished</tspan><tspan class="k">.</tspan></text>
<path d="M64 1222 L58 1222 L58 1518 L64 1518" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1540"><tspan class="h" style="font-weight:700">Completely ignored:</tspan><tspan class="k"> The Central government</tspan><tspan class="r"> completely ignored</tspan><tspan class="k"> the recommendations of</tspan></text>
<text x="56" y="1562"><tspan class="k">the Rajamannar Committee.</tspan></text>
<text class="xs" x="50" y="1598"><tspan class="r" style="font-weight:700">19</tspan><tspan class="k"> The other two members of the committee were Dr. Lakshmanswamy Mudaliar and P.C. Chandra</tspan></text>
<text class="xs" x="50" y="1616"><tspan class="k">Reddy.</tspan></text>
<rect x="40" y="1576" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
