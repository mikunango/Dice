<div id="vis-container"><h2 class="sr-only">Administrative Reforms Commission and Rajamannar Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1615" role="img"><title>Administrative Reforms Commission and Rajamannar Committee</title><desc>Administrative Reforms Commission and Rajamannar Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="65" y="26" width="550" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Reforms Commission and Rajamannar Committee</text>
<text class="lb" x="40" y="98">Administrative Reforms Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">First ARC (1966):</tspan><tspan class="k"> The Central government appointed a</tspan><tspan class="r"> six-member First Administrative</tspan></text>
<text x="56" y="150"><tspan class="r">Reforms Commission (ARC)</tspan><tspan class="k"> of India in</tspan><tspan class="r"> 1966</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Morarji Desai</tspan></text>
<text x="56" y="172"><tspan class="k">(</tspan><tspan class="b">followed by K Hanumanthayya</tspan><tspan class="k">). Its terms of references included, among others, the</tspan></text>
<text x="56" y="194"><tspan class="k">examination of Centre–State relations. In order to examine thoroughly the various issues</tspan></text>
<text x="56" y="216"><tspan class="k">in Centre–state relations, the ARC constituted a</tspan><tspan class="r"> study team under M.C. Setalvad</tspan><tspan class="k">. On the</tspan></text>
<text x="56" y="238"><tspan class="k">basis of the report of this study team, the ARC finalised its own report and submitted it</tspan></text>
<text x="56" y="260"><tspan class="k">to the Central government in</tspan><tspan class="r"> 1969</tspan><tspan class="k">. It made</tspan><tspan class="r"> 22 recommendations</tspan><tspan class="k"> for improving the</tspan></text>
<text x="56" y="282"><tspan class="k">Centre–state relations. The important recommendations are:</tspan></text>
<rect class="bx" x="62" y="294" width="85" height="30" rx="3"/>
<text class="sm" x="104" y="313" text-anchor="middle"><tspan class="k">ARC</tspan><tspan class="r"> 1966</tspan></text>
<line class="ln" x1="150" y1="309" x2="170" y2="309" marker-end="url(#ah)"/>
<rect class="bx" x="173" y="294" width="235" height="30" rx="3"/>
<text class="sm" x="291" y="313" text-anchor="middle"><tspan class="k">Morarji Desai →</tspan><tspan class="b"> K Hanumanthayya</tspan></text>
<line class="ln" x1="411" y1="309" x2="431" y2="309" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="294" width="184" height="30" rx="3"/>
<text class="sm" x="526" y="313" text-anchor="middle"><tspan class="k">study team:</tspan><tspan class="r"> M.C. Setalvad</tspan></text>
<line class="ln" x1="340" y1="325" x2="340" y2="346" marker-end="url(#ah)"/>
<rect class="bx" x="204" y="348" width="93" height="30" rx="3"/>
<text class="sm" x="251" y="367" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1969</tspan></text>
<line class="ln" x1="301" y1="363" x2="321" y2="363" marker-end="url(#ah)"/>
<rect class="bx" x="324" y="348" width="152" height="30" rx="3"/>
<text class="sm" x="400" y="367" text-anchor="middle"><tspan class="r">22</tspan><tspan class="k"> recommendations</tspan></text>
<text x="44" y="406" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="406"><tspan class="k">Establishment of an</tspan><tspan class="r"> Inter-State Council under Article 263</tspan><tspan class="k"> of the Constitution.</tspan></text>
<text x="44" y="434" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="434"><tspan class="k">Appointment of persons having</tspan><tspan class="r"> long experience in public life and administration</tspan><tspan class="k"> and</tspan></text>
<text x="58" y="456"><tspan class="b">nonpartisan attitude</tspan><tspan class="k"> as</tspan><tspan class="r"> governors</tspan><tspan class="k">.</tspan></text>
<text x="44" y="484" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="484"><tspan class="r">Delegation of powers</tspan><tspan class="k"> to the maximum extent to the states.</tspan></text>
<text x="44" y="512" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="512"><tspan class="k">Transferring of</tspan><tspan class="r"> more financial resources</tspan><tspan class="k"> to the states to reduce their dependency upon</tspan></text>
<text x="58" y="534"><tspan class="k">the Centre.</tspan></text>
<text x="44" y="562" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="562"><tspan class="k">Deployment of</tspan><tspan class="r"> Central armed forces</tspan><tspan class="k"> in the states either on their request or otherwise.</tspan></text>
<text x="44" y="590"><tspan class="h" style="font-weight:700">Recommendations ignored:</tspan><tspan class="r"> No action was taken</tspan><tspan class="k"> by the Central government on the</tspan></text>
<text x="56" y="612"><tspan class="k">recommendations of the ARC.</tspan></text>
<text class="lb" x="40" y="644">Rajamannar Committee</text>
<text x="44" y="674"><tspan class="h" style="font-weight:700">Rajamannar Committee (1969):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1969</tspan><tspan class="k">, the</tspan><tspan class="r"> Tamil Nadu Government (DMK)</tspan><tspan class="k"> appointed</tspan></text>
<text x="56" y="696"><tspan class="k">a</tspan><tspan class="r"> three-member committee</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Dr. P.V. Rajamannar</tspan><tspan class="k"> to examine</tspan></text>
<text x="56" y="718"><tspan class="k">the entire question of Centre–state relations and to suggest amendments to the</tspan></text>
<text x="56" y="740"><tspan class="k">Constitution so as to secure</tspan><tspan class="r"> utmost autonomy to the states</tspan><tspan class="k">.¹⁹ The committee submitted</tspan></text>
<text x="56" y="762"><tspan class="k">its report to the Tamil Nadu Government in</tspan><tspan class="r"> 1971</tspan><tspan class="k">.</tspan></text>
<text x="44" y="790"><tspan class="h" style="font-weight:700">Causes of unitary trends:</tspan><tspan class="k"> The Committee identified the reasons for the prevailing</tspan></text>
<text x="56" y="812"><tspan class="r">unitary trends (tendencies of centralisation)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="56" y="836"><tspan class="k">They include:</tspan></text>
<text x="70" y="862" class="r" style="font-weight:700">(i)</text>
<text x="107" y="862"><tspan class="h" style="font-weight:700">Centre’s special powers:</tspan><tspan class="k"> certain provisions in the Constitution which confer</tspan></text>
<text x="107" y="884"><tspan class="b">special powers on the Centre</tspan><tspan class="k">;</tspan></text>
<text x="70" y="910" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="910"><tspan class="h" style="font-weight:700">One-party rule:</tspan><tspan class="b"> one-party rule</tspan><tspan class="k"> both at the Centre and in the states;</tspan></text>
<text x="70" y="936" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="936"><tspan class="h" style="font-weight:700">Fiscal dependence of states:</tspan><tspan class="b"> inadequacy of states’ fiscal resources</tspan><tspan class="k"> and</tspan></text>
<text x="107" y="958"><tspan class="k">consequent dependence on the Centre for financial assistance; and</tspan></text>
<text x="70" y="984" class="r" style="font-weight:700">(iv)</text>
<text x="107" y="984"><tspan class="h" style="font-weight:700">Central planning:</tspan><tspan class="k"> the institution of</tspan><tspan class="b"> Central planning</tspan><tspan class="k"> and the role of the</tspan></text>
<text x="107" y="1006"><tspan class="k">Planning Commission.</tspan></text>
<path d="M64 842 L58 842 L58 1012 L64 1012" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="1012" x2="340" y2="1024"/>
<line class="ln" x1="115" y1="1024" x2="565" y2="1024"/>
<line class="ln" x1="115" y1="1024" x2="115" y2="1040" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1024" x2="265" y2="1040" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1024" x2="415" y2="1040" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1024" x2="565" y2="1040" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1060" text-anchor="middle"><tspan class="b">special powers to</tspan></text>
<text class="sm" x="115" y="1078" text-anchor="middle"><tspan class="b">Centre</tspan></text>
<text class="sm" x="265" y="1060" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<text class="sm" x="415" y="1060" text-anchor="middle"><tspan class="b">weak state finances</tspan></text>
<text class="sm" x="565" y="1060" text-anchor="middle"><tspan class="b">Central planning</tspan></text>
<text x="44" y="1110"><tspan class="h" style="font-weight:700">Rajamannar recommendations:</tspan><tspan class="k"> The important recommendations of the committee are</tspan></text>
<text x="56" y="1132"><tspan class="k">as follows:</tspan></text>
<text x="70" y="1158" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1158"><tspan class="h" style="font-weight:700">Inter-State Council:</tspan><tspan class="k"> An</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> should be set up immediately;</tspan></text>
<text x="70" y="1184" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1184"><tspan class="h" style="font-weight:700">Permanent Finance Commission:</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k"> should be made a</tspan></text>
<text x="113" y="1206"><tspan class="r">permanent body</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1232" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1232"><tspan class="h" style="font-weight:700">Disband Planning Commission:</tspan><tspan class="r"> Planning Commission should be disbanded</tspan><tspan class="k"> and</tspan></text>
<text x="113" y="1254"><tspan class="k">its place should be taken by a statutory body;</tspan></text>
<text x="70" y="1280" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1280"><tspan class="h" style="font-weight:700">Omit Arts. 356, 357, 365:</tspan><tspan class="r"> Articles 356, 357 and 365</tspan><tspan class="k"> (dealing with</tspan></text>
<text x="113" y="1302"><tspan class="k">President’s Rule) should be</tspan><tspan class="r"> totally omitted</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1328" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1328"><tspan class="h" style="font-weight:700">End Governor’s pleasure:</tspan><tspan class="k"> The provision that the state ministry holds office</tspan></text>
<text x="113" y="1350"><tspan class="k">during the</tspan><tspan class="b"> pleasure of the governor</tspan><tspan class="k"> should be omitted;</tspan></text>
<text x="70" y="1376" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1376"><tspan class="h" style="font-weight:700">Transfer subjects to State List:</tspan><tspan class="k"> Certain subjects of the Union List and the</tspan></text>
<text x="113" y="1398"><tspan class="k">Concurrent List should be</tspan><tspan class="b"> transferred to the State List</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1424" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1424"><tspan class="h" style="font-weight:700">Residuary powers to states:</tspan><tspan class="k"> the</tspan><tspan class="r"> residuary powers should be allocated to the</tspan></text>
<text x="113" y="1446"><tspan class="r">states</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1472" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1472"><tspan class="h" style="font-weight:700">Abolish AIS:</tspan><tspan class="r"> All-India services (IAS, IPS and IFoS) should be abolished</tspan><tspan class="k">.</tspan></text>
<path d="M64 1138 L58 1138 L58 1478 L64 1478" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1500"><tspan class="h" style="font-weight:700">Rajamannar ignored:</tspan><tspan class="k"> The Central government</tspan><tspan class="r"> completely ignored</tspan><tspan class="k"> the recommendations</tspan></text>
<text x="56" y="1522"><tspan class="k">of the Rajamannar Committee.</tspan></text>
<text class="xs" x="50" y="1558"><tspan class="r" style="font-weight:700">19</tspan><tspan class="k"> The other two members of the committee were Dr. Lakshmanswamy Mudaliar and P.C. Chandra</tspan></text>
<text class="xs" x="50" y="1576"><tspan class="k">Reddy.</tspan></text>
<rect x="40" y="1536" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
