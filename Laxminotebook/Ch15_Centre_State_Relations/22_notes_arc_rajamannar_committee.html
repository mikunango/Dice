<div id="vis-container"><h2 class="sr-only">Administrative Reforms Commission and Rajamannar Committee</h2>
<svg class="n" width="100%" viewBox="0 0 680 1527" role="img"><title>Administrative Reforms Commission and Rajamannar Committee</title><desc>Administrative Reforms Commission and Rajamannar Committee</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="65" y="26" width="550" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Reforms Commission and Rajamannar Committee</text>
<text class="lb" x="40" y="98">Administrative Reforms Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">ARC 1966 – 22 recommendations:</tspan><tspan class="k"> The Central government appointed a</tspan><tspan class="r"> six-member</tspan></text>
<text x="56" y="150"><tspan class="r">First Administrative Reforms Commission (ARC)</tspan><tspan class="k"> of India in</tspan><tspan class="r"> 1966</tspan><tspan class="k"> under the chairmanship</tspan></text>
<text x="56" y="172"><tspan class="k">of</tspan><tspan class="r"> Morarji Desai</tspan><tspan class="k"> (</tspan><tspan class="b">followed by K Hanumanthayya</tspan><tspan class="k">). Its terms of references included,</tspan></text>
<text x="56" y="194"><tspan class="k">among others, the examination of Centre–State relations. In order to examine thoroughly</tspan></text>
<text x="56" y="216"><tspan class="k">the various issues in Centre–state relations, the ARC constituted a</tspan><tspan class="r"> study team under</tspan></text>
<text x="56" y="238"><tspan class="r">M.C. Setalvad</tspan><tspan class="k">. On the basis of the report of this study team, the ARC finalised its own</tspan></text>
<text x="56" y="260"><tspan class="k">report and submitted it to the Central government in</tspan><tspan class="r"> 1969</tspan><tspan class="k">. It made</tspan><tspan class="r"> 22 recommendations</tspan></text>
<text x="56" y="282"><tspan class="k">for improving the Centre–state relations. The important recommendations are:</tspan></text>
<rect class="bx" x="62" y="294" width="85" height="30" rx="3"/>
<text class="sm" x="104" y="313" text-anchor="middle"><tspan class="k">ARC</tspan><tspan class="r"> 1966</tspan></text>
<line class="ln" x1="150" y1="309" x2="170" y2="309" marker-end="url(#ah)"/>
<rect class="bx" x="173" y="294" width="235" height="30" rx="3"/>
<text class="sm" x="291" y="313" text-anchor="middle"><tspan class="k">Morarji Desai →</tspan><tspan class="b"> K Hanumanthayya</tspan></text>
<line class="ln" x1="411" y1="309" x2="431" y2="309" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="294" width="184" height="30" rx="3"/>
<text class="sm" x="526" y="313" text-anchor="middle"><tspan class="k">study team:</tspan><tspan class="r"> M.C. Setalvad</tspan></text>
<line class="ln" x1="340" y1="325" x2="340" y2="346" marker-end="url(#ah)"/>
<rect class="bx" x="204" y="348" width="93" height="30" rx="3"/>
<text class="sm" x="251" y="367" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1969</tspan></text>
<line class="ln" x1="301" y1="363" x2="321" y2="363" marker-end="url(#ah)"/>
<rect class="bx" x="324" y="348" width="152" height="30" rx="3"/>
<text class="sm" x="400" y="367" text-anchor="middle"><tspan class="r">22</tspan><tspan class="k"> recommendations</tspan></text>
<text x="44" y="406" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="406"><tspan class="k">Establishment of an</tspan><tspan class="r"> Inter-State Council under Article 263</tspan><tspan class="k"> of the Constitution.</tspan></text>
<text x="44" y="434" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="434"><tspan class="k">Appointment of persons having</tspan><tspan class="r"> long experience in public life and administration</tspan><tspan class="k"> and</tspan></text>
<text x="58" y="456"><tspan class="b">nonpartisan attitude</tspan><tspan class="k"> as</tspan><tspan class="r"> governors</tspan><tspan class="k">.</tspan></text>
<text x="44" y="484" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="484"><tspan class="r">Delegation of powers</tspan><tspan class="k"> to the maximum extent to the states.</tspan></text>
<text x="44" y="512" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="512"><tspan class="k">Transferring of</tspan><tspan class="r"> more financial resources</tspan><tspan class="k"> to the states to reduce their dependency upon</tspan></text>
<text x="58" y="534"><tspan class="k">the Centre.</tspan></text>
<text x="44" y="562" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="562"><tspan class="k">Deployment of</tspan><tspan class="r"> Central armed forces</tspan><tspan class="k"> in the states either on their request or otherwise.</tspan></text>
<text x="44" y="590"><tspan class="h" style="font-weight:700">No action:</tspan><tspan class="r"> No action was taken</tspan><tspan class="k"> by the Central government on the recommendations of</tspan></text>
<text x="56" y="612"><tspan class="k">the ARC.</tspan></text>
<text class="lb" x="40" y="644">Rajamannar Committee</text>
<text x="44" y="674"><tspan class="h" style="font-weight:700">Rajamannar 1969 – Tamil Nadu:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1969</tspan><tspan class="k">, the</tspan><tspan class="r"> Tamil Nadu Government (DMK)</tspan><tspan class="k"> appointed</tspan></text>
<text x="56" y="696"><tspan class="k">a</tspan><tspan class="r"> three-member committee</tspan><tspan class="k"> under the chairmanship of</tspan><tspan class="r"> Dr. P.V. Rajamannar</tspan><tspan class="k"> to examine</tspan></text>
<text x="56" y="718"><tspan class="k">the entire question of Centre–state relations and to suggest amendments to the</tspan></text>
<text x="56" y="740"><tspan class="k">Constitution so as to secure</tspan><tspan class="r"> utmost autonomy to the states</tspan><tspan class="k">.¹⁹ The committee submitted</tspan></text>
<text x="56" y="762"><tspan class="k">its report to the Tamil Nadu Government in</tspan><tspan class="r"> 1971</tspan><tspan class="k">.</tspan></text>
<text x="44" y="790"><tspan class="h" style="font-weight:700">Unitary trends:</tspan><tspan class="k"> The Committee identified the reasons for the prevailing</tspan><tspan class="r"> unitary trends</tspan></text>
<text x="56" y="812"><tspan class="r">(tendencies of centralisation)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="56" y="836"><tspan class="k">They include:</tspan></text>
<text x="70" y="862" class="r" style="font-weight:700">(i)</text>
<text x="107" y="862"><tspan class="k">certain provisions in the Constitution which confer</tspan><tspan class="b"> special powers on the</tspan></text>
<text x="107" y="884"><tspan class="b">Centre</tspan><tspan class="k">;</tspan></text>
<text x="70" y="910" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="910"><tspan class="b">one-party rule</tspan><tspan class="k"> both at the Centre and in the states;</tspan></text>
<text x="70" y="936" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="936"><tspan class="b">inadequacy of states’ fiscal resources</tspan><tspan class="k"> and consequent dependence on the Centre</tspan></text>
<text x="107" y="958"><tspan class="k">for financial assistance; and</tspan></text>
<text x="70" y="984" class="r" style="font-weight:700">(iv)</text>
<text x="107" y="984"><tspan class="k">the institution of</tspan><tspan class="b"> Central planning</tspan><tspan class="k"> and the role of the Planning Commission.</tspan></text>
<path d="M64 842 L58 842 L58 990 L64 990" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="990" x2="340" y2="1002"/>
<line class="ln" x1="115" y1="1002" x2="565" y2="1002"/>
<line class="ln" x1="115" y1="1002" x2="115" y2="1018" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="1002" x2="265" y2="1018" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="1002" x2="415" y2="1018" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="1002" x2="565" y2="1018" marker-end="url(#ah)"/>
<text class="sm" x="115" y="1038" text-anchor="middle"><tspan class="b">special powers to</tspan></text>
<text class="sm" x="115" y="1056" text-anchor="middle"><tspan class="b">Centre</tspan></text>
<text class="sm" x="265" y="1038" text-anchor="middle"><tspan class="b">one-party rule</tspan></text>
<text class="sm" x="415" y="1038" text-anchor="middle"><tspan class="b">weak state finances</tspan></text>
<text class="sm" x="565" y="1038" text-anchor="middle"><tspan class="b">Central planning</tspan></text>
<text x="44" y="1088"><tspan class="h" style="font-weight:700">Recommendations:</tspan><tspan class="k"> The important recommendations of the committee are as follows:</tspan></text>
<text x="70" y="1114" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1114"><tspan class="k">An</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> should be set up immediately;</tspan></text>
<text x="70" y="1140" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1140"><tspan class="r">Finance Commission</tspan><tspan class="k"> should be made a</tspan><tspan class="r"> permanent body</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1166" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1166"><tspan class="r">Planning Commission should be disbanded</tspan><tspan class="k"> and its place should be taken by a</tspan></text>
<text x="113" y="1188"><tspan class="k">statutory body;</tspan></text>
<text x="70" y="1214" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1214"><tspan class="r">Articles 356, 357 and 365</tspan><tspan class="k"> (dealing with President’s Rule) should be</tspan><tspan class="r"> totally</tspan></text>
<text x="113" y="1236"><tspan class="r">omitted</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1262" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1262"><tspan class="k">The provision that the state ministry holds office during the</tspan><tspan class="b"> pleasure of the</tspan></text>
<text x="113" y="1284"><tspan class="b">governor</tspan><tspan class="k"> should be omitted;</tspan></text>
<text x="70" y="1310" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1310"><tspan class="k">Certain subjects of the Union List and the Concurrent List should be</tspan></text>
<text x="113" y="1332"><tspan class="b">transferred to the State List</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1358" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1358"><tspan class="k">the</tspan><tspan class="r"> residuary powers should be allocated to the states</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1384" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1384"><tspan class="r">All-India services (IAS, IPS and IFoS) should be abolished</tspan><tspan class="k">.</tspan></text>
<path d="M64 1094 L58 1094 L58 1390 L64 1390" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1412"><tspan class="h" style="font-weight:700">Completely ignored:</tspan><tspan class="k"> The Central government</tspan><tspan class="r"> completely ignored</tspan><tspan class="k"> the recommendations of</tspan></text>
<text x="56" y="1434"><tspan class="k">the Rajamannar Committee.</tspan></text>
<text class="xs" x="50" y="1470"><tspan class="r" style="font-weight:700">19</tspan><tspan class="k"> The other two members of the committee were Dr. Lakshmanswamy Mudaliar and P.C. Chandra</tspan></text>
<text class="xs" x="50" y="1488"><tspan class="k">Reddy.</tspan></text>
<rect x="40" y="1448" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
