<div id="vis-container"><h2 class="sr-only">GST Council and Finance Commission</h2>
<svg class="n" width="100%" viewBox="0 0 680 1316" role="img"><title>GST Council and Finance Commission</title><desc>GST Council and Finance Commission</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="169" y="26" width="341" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">GST Council and Finance Commission</text>
<text class="lb" x="40" y="98">5. Goods and Services Tax Council</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Need for GST Council:</tspan><tspan class="k"> The smooth and efficient administration of the</tspan><tspan class="r"> goods and services</tspan></text>
<text x="56" y="150"><tspan class="r">tax (GST)</tspan><tspan class="k"> requires a</tspan><tspan class="b"> co-operation and co-ordination</tspan><tspan class="k"> between the Centre and the States.</tspan></text>
<text x="56" y="172"><tspan class="k">In order to facilitate this consultation process, the</tspan><tspan class="r"> 101st Amendment Act of 2016</tspan></text>
<text x="56" y="194"><tspan class="k">provided for the establishment of a</tspan><tspan class="r"> Goods and Services Tax Council or the GST Council</tspan><tspan class="k">.</tspan></text>
<text x="44" y="222"><tspan class="h" style="font-weight:700">GST Council (Art. 279-A):</tspan><tspan class="r"> Article 279-A</tspan><tspan class="k"> empowered the</tspan><tspan class="r"> President</tspan><tspan class="k"> to constitute a GST</tspan></text>
<text x="56" y="244"><tspan class="k">Council</tspan><tspan class="r"> by an order¹⁶</tspan><tspan class="k">. The Council is a</tspan><tspan class="r"> joint forum of the Centre and the States</tspan><tspan class="k">. It is</tspan></text>
<text x="56" y="266"><tspan class="k">required to make recommendations to the Centre and the States on the following</tspan></text>
<text x="56" y="288"><tspan class="k">matters:</tspan></text>
<text x="56" y="314" class="r" style="font-weight:700">(a)</text>
<text x="89" y="314"><tspan class="h" style="font-weight:700">Taxes to be subsumed:</tspan><tspan class="k"> The</tspan><tspan class="r"> taxes, cesses and surcharges</tspan><tspan class="k"> levied by the Centre,</tspan></text>
<text x="89" y="336"><tspan class="k">the States and the local bodies that would get</tspan><tspan class="b"> merged in GST</tspan><tspan class="k">.</tspan></text>
<text x="56" y="362" class="r" style="font-weight:700">(b)</text>
<text x="89" y="362"><tspan class="h" style="font-weight:700">GST coverage &amp; exemptions:</tspan><tspan class="k"> The</tspan><tspan class="r"> goods and services</tspan><tspan class="k"> that may be</tspan><tspan class="b"> subjected to</tspan></text>
<text x="89" y="384"><tspan class="b">GST or exempted from GST</tspan><tspan class="k">.</tspan></text>
<text x="56" y="410" class="r" style="font-weight:700">(c)</text>
<text x="89" y="410"><tspan class="h" style="font-weight:700">Model GST laws &amp; place of supply:</tspan><tspan class="r"> Model GST Laws</tspan><tspan class="k">, principles of levy,</tspan></text>
<text x="89" y="432"><tspan class="k">apportionment of GST levied on supplies in the course of inter-state trade or</tspan></text>
<text x="89" y="454"><tspan class="k">commerce and the principles that govern the</tspan><tspan class="b"> place of supply</tspan><tspan class="k">.</tspan></text>
<text x="56" y="480" class="r" style="font-weight:700">(d)</text>
<text x="89" y="480"><tspan class="h" style="font-weight:700">Threshold exemption:</tspan><tspan class="k"> The</tspan><tspan class="r"> threshold limit of turnover</tspan><tspan class="k"> below which goods and</tspan></text>
<text x="89" y="502"><tspan class="k">services may be exempted from GST.</tspan></text>
<text x="56" y="528" class="r" style="font-weight:700">(e)</text>
<text x="89" y="528"><tspan class="h" style="font-weight:700">GST rates &amp; bands:</tspan><tspan class="k"> The</tspan><tspan class="r"> rates</tspan><tspan class="k"> including</tspan><tspan class="b"> floor rates with bands</tspan><tspan class="k"> of GST.</tspan></text>
<text x="56" y="554" class="r" style="font-weight:700">(f)</text>
<text x="89" y="554"><tspan class="h" style="font-weight:700">Disaster cess / special rate:</tspan><tspan class="k"> Any</tspan><tspan class="r"> special rate or rates</tspan><tspan class="k"> for a specified period to</tspan></text>
<text x="89" y="576"><tspan class="k">raise additional resources during any</tspan><tspan class="b"> natural calamity or disaster</tspan><tspan class="k">.</tspan></text>
<path d="M50 294 L44 294 L44 582 L50 582" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="79" y="588" width="126" height="30" rx="3"/>
<text class="sm" x="142" y="607" text-anchor="middle"><tspan class="r">101st Amdt 2016</tspan></text>
<line class="ln" x1="208" y1="603" x2="228" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="231" y="588" width="92" height="30" rx="3"/>
<text class="sm" x="277" y="607" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 279-A</tspan></text>
<line class="ln" x1="326" y1="603" x2="346" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="349" y="588" width="126" height="30" rx="3"/>
<text class="sm" x="412" y="607" text-anchor="middle"><tspan class="k">President’s order</tspan></text>
<line class="ln" x1="479" y1="603" x2="499" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="502" y="588" width="99" height="30" rx="3"/>
<text class="sm" x="551" y="607" text-anchor="middle"><tspan class="r" style="font-weight:700">GST Council</tspan></text>
<line class="ln" x1="340" y1="619" x2="340" y2="640" marker-end="url(#ah)"/>
<rect class="bx" x="293" y="642" width="94" height="30" rx="3"/>
<text class="sm" x="340" y="661" text-anchor="middle"><tspan class="b">joint forum</tspan></text>
<text class="lb" x="40" y="704">6. Finance Commission</text>
<text x="44" y="734"><tspan class="h" style="font-weight:700">Finance Commission (Art. 280):</tspan><tspan class="r"> Article 280</tspan><tspan class="k"> provides for a</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k"> as a</tspan></text>
<text x="56" y="756"><tspan class="r">quasi-judicial body</tspan><tspan class="k">. It is constituted by the</tspan><tspan class="r"> President every fifth year</tspan><tspan class="k"> or even earlier. It is</tspan></text>
<text x="56" y="778"><tspan class="k">required to make recommendations to the President on the following matters:</tspan></text>
<text x="44" y="806" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="806"><tspan class="k">The</tspan><tspan class="r"> distribution of the net proceeds of taxes</tspan><tspan class="k"> to be shared between the Centre and the</tspan></text>
<text x="58" y="828"><tspan class="k">states, and the allocation between the states, the respective shares of such proceeds.</tspan></text>
<text x="44" y="856" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="856"><tspan class="k">The</tspan><tspan class="r"> principles which should govern the grants-in-aid</tspan><tspan class="k"> to the states by the Centre (</tspan><tspan class="b">i.e.,</tspan></text>
<text x="58" y="878"><tspan class="b">out of the Consolidated Fund of India</tspan><tspan class="k">).</tspan></text>
<text x="44" y="906" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="906"><tspan class="k">The measures needed to</tspan><tspan class="r"> augment the Consolidated fund of a state</tspan><tspan class="k"> to supplement the</tspan></text>
<text x="58" y="928"><tspan class="k">resources of the</tspan><tspan class="b"> panchayats and the municipalities</tspan><tspan class="k"> in the state on the basis of the</tspan></text>
<text x="58" y="950"><tspan class="k">recommendations made by the</tspan><tspan class="r"> State Finance Commission</tspan><tspan class="k">.¹⁷</tspan></text>
<text x="44" y="978" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="978"><tspan class="k">Any other matter referred to it by the President in the interests of</tspan><tspan class="b"> sound finance</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1006"><tspan class="h" style="font-weight:700">Jute grants till 1960:</tspan><tspan class="k"> Till</tspan><tspan class="r"> 1960</tspan><tspan class="k">, the Commission also suggested the amounts paid to the</tspan></text>
<text x="56" y="1028"><tspan class="k">States of</tspan><tspan class="b"> Assam, Bihar, Orissa and West Bengal</tspan><tspan class="k"> in lieu of assignment of any share of</tspan></text>
<text x="56" y="1050"><tspan class="k">the net proceeds in each year of</tspan><tspan class="r"> export duty on jute and jute products</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1078"><tspan class="h" style="font-weight:700">Balancing wheel of fiscal federalism:</tspan><tspan class="k"> The Constitution envisages the Finance</tspan></text>
<text x="56" y="1100"><tspan class="k">Commission as the</tspan><tspan class="r" style="font-weight:700"> balancing wheel of fiscal federalism</tspan><tspan class="k"> in India.</tspan></text>
<rect class="bx" x="133" y="1112" width="148" height="30" rx="3"/>
<text class="sm" x="207" y="1131" text-anchor="middle"><tspan class="r" style="font-weight:700">Finance Commission</tspan></text>
<line class="ln" x1="284" y1="1127" x2="304" y2="1127" marker-end="url(#ah)"/>
<rect class="bx" x="307" y="1112" width="240" height="30" rx="3"/>
<text class="sm" x="427" y="1131" text-anchor="middle"><tspan class="r">balancing wheel of fiscal federalism</tspan></text>
<text class="xs" x="50" y="1178"><tspan class="r" style="font-weight:700">16</tspan><tspan class="k"> Article 279-A(1) says that the President shall, within sixty days from the commencement of the</tspan></text>
<text class="xs" x="50" y="1196"><tspan class="k">Constitution (One Hundred and First Amendment) Act, 2016, by order, constitute a Council to be</tspan></text>
<text class="xs" x="50" y="1214"><tspan class="k">called the Goods and Services Tax Council.</tspan></text>
<rect x="40" y="1156" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1259"><tspan class="r" style="font-weight:700">17</tspan><tspan class="k"> This function was added by the 73rd and 74th Amendment Acts of 1992 which have granted</tspan></text>
<text class="xs" x="50" y="1277"><tspan class="k">constitutional status on the panchayats and the municipalities respectively.</tspan></text>
<rect x="40" y="1237" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
