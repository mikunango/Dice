<div id="vis-container"><h2 class="sr-only">GST Council and Finance Commission</h2>
<svg class="n" width="100%" viewBox="0 0 680 2076" role="img"><title>GST Council and Finance Commission</title><desc>GST Council and Finance Commission</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="169" y="26" width="341" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">GST Council and Finance Commission</text>
<text class="lb" x="40" y="98">5. Goods and Services Tax Council</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Need for GST Council:</tspan><tspan class="k"> The smooth and efficient administration of the</tspan><tspan class="r"> goods and services</tspan></text>
<text x="56" y="150"><tspan class="r">tax (GST)</tspan><tspan class="k"> requires a</tspan><tspan class="b"> co-operation and co-ordination</tspan><tspan class="k"> between the Centre and the States.</tspan></text>
<text x="56" y="172"><tspan class="k">In order to facilitate this consultation process, the</tspan><tspan class="r"> 101st Amendment Act of 2016</tspan></text>
<text x="56" y="194"><tspan class="k">provided for the establishment of a</tspan><tspan class="r"> Goods and Services Tax Council or the GST Council</tspan><tspan class="k">.</tspan></text>
<text x="44" y="222"><tspan class="h" style="font-weight:700">GST Council (Art. 279-A):</tspan><tspan class="r"> Article 279-A</tspan><tspan class="k"> empowered the</tspan><tspan class="r"> President</tspan><tspan class="k"> to constitute a GST</tspan></text>
<text x="56" y="244"><tspan class="k">Council</tspan><tspan class="r"> by an order¹⁶</tspan><tspan class="k">. The Council is a</tspan><tspan class="r"> joint forum of the Centre and the States</tspan><tspan class="k">. It is</tspan></text>
<text x="56" y="266"><tspan class="k">required to make recommendations to the Centre and the States on the following</tspan></text>
<text x="56" y="288"><tspan class="k">matters:</tspan></text>
<text x="56" y="314" class="r" style="font-weight:700">(a)</text>
<text x="89" y="314"><tspan class="h" style="font-weight:700">Taxes to be subsumed:</tspan><tspan class="k"> The</tspan><tspan class="r"> taxes, cesses and surcharges</tspan><tspan class="k"> levied by the Centre,</tspan></text>
<text x="89" y="336"><tspan class="k">the States and the local bodies that would get</tspan><tspan class="b"> merged in GST</tspan><tspan class="k">.</tspan></text>
<text x="56" y="362" class="r" style="font-weight:700">(b)</text>
<text x="89" y="362"><tspan class="h" style="font-weight:700">GST coverage &amp; exemptions:</tspan><tspan class="k"> The</tspan><tspan class="r"> goods and services</tspan><tspan class="k"> that may be</tspan><tspan class="b"> subjected to</tspan></text>
<text x="89" y="384"><tspan class="b">GST or exempted from GST</tspan><tspan class="k">.</tspan></text>
<text x="56" y="410" class="r" style="font-weight:700">(c)</text>
<text x="89" y="410"><tspan class="h" style="font-weight:700">Model GST laws &amp; place of supply:</tspan><tspan class="r"> Model GST Laws</tspan><tspan class="k">, principles of levy,</tspan></text>
<text x="89" y="432"><tspan class="k">apportionment of GST levied on supplies in the course of inter-state trade or</tspan></text>
<text x="89" y="454"><tspan class="k">commerce and the principles that govern the</tspan><tspan class="b"> place of supply</tspan><tspan class="k">.</tspan></text>
<text x="56" y="480" class="r" style="font-weight:700">(d)</text>
<text x="89" y="480"><tspan class="h" style="font-weight:700">Threshold exemption:</tspan><tspan class="k"> The</tspan><tspan class="r"> threshold limit of turnover</tspan><tspan class="k"> below which goods and</tspan></text>
<text x="89" y="502"><tspan class="k">services may be exempted from GST.</tspan></text>
<text x="56" y="528" class="r" style="font-weight:700">(e)</text>
<text x="89" y="528"><tspan class="h" style="font-weight:700">GST rates &amp; bands:</tspan><tspan class="k"> The</tspan><tspan class="r"> rates</tspan><tspan class="k"> including</tspan><tspan class="b"> floor rates with bands</tspan><tspan class="k"> of GST.</tspan></text>
<text x="56" y="554" class="r" style="font-weight:700">(f)</text>
<text x="89" y="554"><tspan class="h" style="font-weight:700">Disaster cess / special rate:</tspan><tspan class="k"> Any</tspan><tspan class="r"> special rate or rates</tspan><tspan class="k"> for a specified period to</tspan></text>
<text x="89" y="576"><tspan class="k">raise additional resources during any</tspan><tspan class="b"> natural calamity or disaster</tspan><tspan class="k">.</tspan></text>
<path d="M50 294 L44 294 L44 582 L50 582" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="79" y="588" width="126" height="30" rx="3"/>
<text class="sm" x="142" y="607" text-anchor="middle"><tspan class="r">101st Amdt 2016</tspan></text>
<line class="ln" x1="208" y1="603" x2="228" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="231" y="588" width="92" height="30" rx="3"/>
<text class="sm" x="277" y="607" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 279-A</tspan></text>
<line class="ln" x1="326" y1="603" x2="346" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="349" y="588" width="126" height="30" rx="3"/>
<text class="sm" x="412" y="607" text-anchor="middle"><tspan class="k">President’s order</tspan></text>
<line class="ln" x1="479" y1="603" x2="499" y2="603" marker-end="url(#ah)"/>
<rect class="bx" x="502" y="588" width="99" height="30" rx="3"/>
<text class="sm" x="551" y="607" text-anchor="middle"><tspan class="r" style="font-weight:700">GST Council</tspan></text>
<line class="ln" x1="340" y1="619" x2="340" y2="640" marker-end="url(#ah)"/>
<rect class="bx" x="293" y="642" width="94" height="30" rx="3"/>
<text class="sm" x="340" y="661" text-anchor="middle"><tspan class="b">joint forum</tspan></text>
<line class="ln" x1="340" y1="818" x2="340" y2="752"/>
<ellipse cx="340" cy="726" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="340" y="723" text-anchor="middle"><tspan class="k">(a) taxes to merge</tspan></text>
<text class="xs" x="340" y="739" text-anchor="middle"><tspan class="k">in GST</tspan></text>
<line class="ln" x1="394" y1="838" x2="511" y2="805"/>
<ellipse cx="557" cy="792" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="557" y="781" text-anchor="middle"><tspan class="k">(b) goods &amp;</tspan></text>
<text class="xs" x="557" y="797" text-anchor="middle"><tspan class="k">services – GST or</tspan></text>
<text class="xs" x="557" y="813" text-anchor="middle"><tspan class="k">exempt</tspan></text>
<line class="ln" x1="394" y1="878" x2="511" y2="911"/>
<ellipse cx="557" cy="924" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="557" y="921" text-anchor="middle"><tspan class="k">(c) model laws &amp;</tspan></text>
<text class="xs" x="557" y="937" text-anchor="middle"><tspan class="k">place of supply</tspan></text>
<line class="ln" x1="340" y1="898" x2="340" y2="964"/>
<ellipse cx="340" cy="990" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="340" y="987" text-anchor="middle"><tspan class="k">(d) threshold</tspan></text>
<text class="xs" x="340" y="1003" text-anchor="middle"><tspan class="k">turnover</tspan></text>
<line class="ln" x1="286" y1="878" x2="169" y2="911"/>
<ellipse cx="123" cy="924" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="123" y="921" text-anchor="middle"><tspan class="k">(e) rates, floor rates</tspan></text>
<text class="xs" x="123" y="937" text-anchor="middle"><tspan class="k">&amp; bands</tspan></text>
<line class="ln" x1="286" y1="838" x2="169" y2="805"/>
<ellipse cx="123" cy="792" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="123" y="789" text-anchor="middle"><tspan class="k">(f) special rate in</tspan></text>
<text class="xs" x="123" y="805" text-anchor="middle"><tspan class="k">disaster</tspan></text>
<ellipse cx="340" cy="858" rx="70" ry="44" fill="none" stroke="#2F6FDB" stroke-width="2"/>
<text class="sm" x="340" y="854" text-anchor="middle"><tspan class="r" style="font-weight:700">GST Council</tspan><tspan class="b"> (Art.</tspan></text>
<text class="sm" x="340" y="872" text-anchor="middle"><tspan class="b">279-A)</tspan></text>
<text class="xs" x="340" y="1047" text-anchor="middle"><tspan class="b">joint forum of the Centre and the States – recommends on these six matters</tspan></text>
<text class="lb" x="40" y="1084">6. Finance Commission</text>
<text x="44" y="1114"><tspan class="h" style="font-weight:700">Finance Commission (Art. 280):</tspan><tspan class="r"> Article 280</tspan><tspan class="k"> provides for a</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k"> as a</tspan></text>
<text x="56" y="1136"><tspan class="r">quasi-judicial body</tspan><tspan class="k">. It is constituted by the</tspan><tspan class="r"> President every fifth year</tspan><tspan class="k"> or even earlier. It is</tspan></text>
<text x="56" y="1158"><tspan class="k">required to make recommendations to the President on the following matters:</tspan></text>
<text x="44" y="1186" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1186"><tspan class="k">The</tspan><tspan class="r"> distribution of the net proceeds of taxes</tspan><tspan class="k"> to be shared between the Centre and the</tspan></text>
<text x="58" y="1208"><tspan class="k">states, and the allocation between the states, the respective shares of such proceeds.</tspan></text>
<text x="44" y="1236" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1236"><tspan class="k">The</tspan><tspan class="r"> principles which should govern the grants-in-aid</tspan><tspan class="k"> to the states by the Centre (</tspan><tspan class="b">i.e.,</tspan></text>
<text x="58" y="1258"><tspan class="b">out of the Consolidated Fund of India</tspan><tspan class="k">).</tspan></text>
<text x="44" y="1286" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1286"><tspan class="k">The measures needed to</tspan><tspan class="r"> augment the Consolidated fund of a state</tspan><tspan class="k"> to supplement the</tspan></text>
<text x="58" y="1308"><tspan class="k">resources of the</tspan><tspan class="b"> panchayats and the municipalities</tspan><tspan class="k"> in the state on the basis of the</tspan></text>
<text x="58" y="1330"><tspan class="k">recommendations made by the</tspan><tspan class="r"> State Finance Commission</tspan><tspan class="k">.¹⁷</tspan></text>
<text x="44" y="1358" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1358"><tspan class="k">Any other matter referred to it by the President in the interests of</tspan><tspan class="b"> sound finance</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="1504" x2="340" y2="1438"/>
<ellipse cx="340" cy="1412" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="340" y="1409" text-anchor="middle"><tspan class="k">sharing of net tax</tspan></text>
<text class="xs" x="340" y="1425" text-anchor="middle"><tspan class="k">proceeds</tspan></text>
<line class="ln" x1="402" y1="1544" x2="538" y2="1544"/>
<ellipse cx="590" cy="1544" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="590" y="1541" text-anchor="middle"><tspan class="k">principles of</tspan></text>
<text class="xs" x="590" y="1557" text-anchor="middle"><tspan class="k">grants-in-aid</tspan></text>
<line class="ln" x1="340" y1="1584" x2="340" y2="1650"/>
<ellipse cx="340" cy="1676" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="340" y="1673" text-anchor="middle"><tspan class="k">state fund for local</tspan></text>
<text class="xs" x="340" y="1689" text-anchor="middle"><tspan class="k">bodies</tspan></text>
<line class="ln" x1="278" y1="1544" x2="142" y2="1544"/>
<ellipse cx="90" cy="1544" rx="74" ry="30" fill="none" stroke="#D93A3A" stroke-width="1.2"/>
<text class="xs" x="90" y="1541" text-anchor="middle"><tspan class="k">any other matter</tspan></text>
<text class="xs" x="90" y="1557" text-anchor="middle"><tspan class="k">(sound finance)</tspan></text>
<ellipse cx="340" cy="1544" rx="70" ry="44" fill="none" stroke="#2F6FDB" stroke-width="2"/>
<text class="sm" x="340" y="1532" text-anchor="middle"><tspan class="r" style="font-weight:700">Finance</tspan></text>
<text class="sm" x="340" y="1549" text-anchor="middle"><tspan class="r" style="font-weight:700">Commission</tspan><tspan class="b"> (Art.</tspan></text>
<text class="sm" x="340" y="1566" text-anchor="middle"><tspan class="b">280)</tspan></text>
<text class="xs" x="340" y="1733" text-anchor="middle"><tspan class="b">constituted by the President every fifth year or earlier – recommends to the President</tspan></text>
<text x="44" y="1766"><tspan class="h" style="font-weight:700">Jute grants till 1960:</tspan><tspan class="k"> Till</tspan><tspan class="r"> 1960</tspan><tspan class="k">, the Commission also suggested the amounts paid to the</tspan></text>
<text x="56" y="1788"><tspan class="k">States of</tspan><tspan class="b"> Assam, Bihar, Orissa and West Bengal</tspan><tspan class="k"> in lieu of assignment of any share of</tspan></text>
<text x="56" y="1810"><tspan class="k">the net proceeds in each year of</tspan><tspan class="r"> export duty on jute and jute products</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1838"><tspan class="h" style="font-weight:700">Balancing wheel of fiscal federalism:</tspan><tspan class="k"> The Constitution envisages the Finance</tspan></text>
<text x="56" y="1860"><tspan class="k">Commission as the</tspan><tspan class="r" style="font-weight:700"> balancing wheel of fiscal federalism</tspan><tspan class="k"> in India.</tspan></text>
<rect class="bx" x="133" y="1872" width="148" height="30" rx="3"/>
<text class="sm" x="207" y="1891" text-anchor="middle"><tspan class="r" style="font-weight:700">Finance Commission</tspan></text>
<line class="ln" x1="284" y1="1887" x2="304" y2="1887" marker-end="url(#ah)"/>
<rect class="bx" x="307" y="1872" width="240" height="30" rx="3"/>
<text class="sm" x="427" y="1891" text-anchor="middle"><tspan class="r">balancing wheel of fiscal federalism</tspan></text>
<text class="xs" x="50" y="1938"><tspan class="r" style="font-weight:700">16</tspan><tspan class="k"> Article 279-A(1) says that the President shall, within sixty days from the commencement of the</tspan></text>
<text class="xs" x="50" y="1956"><tspan class="k">Constitution (One Hundred and First Amendment) Act, 2016, by order, constitute a Council to be</tspan></text>
<text class="xs" x="50" y="1974"><tspan class="k">called the Goods and Services Tax Council.</tspan></text>
<rect x="40" y="1916" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="2019"><tspan class="r" style="font-weight:700">17</tspan><tspan class="k"> This function was added by the 73rd and 74th Amendment Acts of 1992 which have granted</tspan></text>
<text class="xs" x="50" y="2037"><tspan class="k">constitutional status on the panchayats and the municipalities respectively.</tspan></text>
<rect x="40" y="1997" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
