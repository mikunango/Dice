<div id="vis-container"><h2 class="sr-only">Distribution of Legislative Subjects</h2>
<svg class="n" width="100%" viewBox="0 0 680 1417" role="img"><title>Distribution of Legislative Subjects</title><desc>Distribution of Legislative Subjects</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Legislative Subjects</text>
<text class="lb" x="40" y="98">2. Distribution of Legislative Subjects</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Three lists – Seventh Schedule:</tspan><tspan class="k"> The Constitution provides for a</tspan><tspan class="r"> three-fold distribution</tspan></text>
<text x="56" y="150"><tspan class="k">of legislative subjects between the Centre and the states, viz.,</tspan><tspan class="r"> List-I (the Union List)</tspan><tspan class="k">,</tspan></text>
<text x="56" y="172"><tspan class="r">List-II (the State List)</tspan><tspan class="k"> and</tspan><tspan class="r"> List-III (the Concurrent List)</tspan><tspan class="k"> in the</tspan><tspan class="r"> Seventh Schedule</tspan><tspan class="k">:</tspan></text>
<rect class="bx" x="40" y="184" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="213" text-anchor="middle"><tspan class="r" style="font-weight:700">List-I Union List</tspan></text>
<text class="sm" x="137" y="231" text-anchor="middle"><tspan class="r">98 subjects</tspan></text>
<text class="sm" x="137" y="249" text-anchor="middle"><tspan class="b">originally 97</tspan></text>
<text class="sm" x="137" y="267" text-anchor="middle"><tspan class="k">Parliament – exclusive</tspan></text>
<rect class="bx" x="243" y="184" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="204" text-anchor="middle"><tspan class="r" style="font-weight:700">List-II State List</tspan></text>
<text class="sm" x="340" y="222" text-anchor="middle"><tspan class="r">59 subjects</tspan></text>
<text class="sm" x="340" y="240" text-anchor="middle"><tspan class="b">originally 66</tspan></text>
<text class="sm" x="340" y="258" text-anchor="middle"><tspan class="k">State – exclusive (normal</tspan></text>
<text class="sm" x="340" y="276" text-anchor="middle"><tspan class="k">times)</tspan></text>
<rect class="bx" x="447" y="184" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="213" text-anchor="middle"><tspan class="r" style="font-weight:700">List-III Concurrent List</tspan></text>
<text class="sm" x="543" y="231" text-anchor="middle"><tspan class="r">52 subjects</tspan></text>
<text class="sm" x="543" y="249" text-anchor="middle"><tspan class="b">originally 47</tspan></text>
<text class="sm" x="543" y="267" text-anchor="middle"><tspan class="k">Both</tspan></text>
<text x="56" y="314" class="r" style="font-weight:700">(i)</text>
<text x="93" y="314"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive powers</tspan><tspan class="k"> to make laws with respect to any of the</tspan></text>
<text x="93" y="336"><tspan class="k">matters enumerated in the</tspan><tspan class="r"> Union List</tspan><tspan class="k">. This list has at present</tspan><tspan class="r"> 98 subjects</tspan></text>
<text x="93" y="358"><tspan class="k">(</tspan><tspan class="b">originally 97¹ subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> defence, banking, foreign affairs, currency, atomic</tspan></text>
<text x="93" y="380"><tspan class="b">energy, insurance, communication, inter-state trade and commerce, census, audit</tspan></text>
<text x="93" y="402"><tspan class="k">and so on.</tspan></text>
<text x="56" y="428" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="428"><tspan class="k">The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> has “</tspan><tspan class="r">in normal circumstances</tspan><tspan class="k">” exclusive powers to make</tspan></text>
<text x="93" y="450"><tspan class="k">laws with respect to any of the matters enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k">. This has</tspan></text>
<text x="93" y="472"><tspan class="k">at present</tspan><tspan class="r"> 59 subjects</tspan><tspan class="k"> (</tspan><tspan class="b">originally 66² subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> public order, police, public</tspan></text>
<text x="93" y="494"><tspan class="b">health and sanitation, agriculture, prisons, local government, fisheries, markets,</tspan></text>
<text x="93" y="516"><tspan class="b">theaters, gambling</tspan><tspan class="k"> and so on.</tspan></text>
<text x="56" y="542" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="542"><tspan class="r">Both</tspan><tspan class="k">, the Parliament and state legislature can make laws with respect to any of</tspan></text>
<text x="93" y="564"><tspan class="k">the matters enumerated in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">. This list has at present</tspan><tspan class="r"> 52</tspan></text>
<text x="93" y="586"><tspan class="r">subjects</tspan><tspan class="k"> (</tspan><tspan class="b">originally 47³ subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> criminal law and procedure, civil procedure,</tspan></text>
<text x="93" y="608"><tspan class="b">marriage and divorce, population control and family planning, electricity, labour</tspan></text>
<text x="93" y="630"><tspan class="b">welfare, economic and social planning, drugs, newspapers, books and printing</tspan></text>
<text x="93" y="652"><tspan class="b">press</tspan><tspan class="k">, and others. The</tspan><tspan class="r"> 42nd Amendment Act of 1976</tspan><tspan class="k"> transferred</tspan><tspan class="r"> five subjects</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="674"><tspan class="k">Concurrent List from State List, that is, (a)</tspan><tspan class="b"> education</tspan><tspan class="k">, (b)</tspan><tspan class="b"> forests</tspan><tspan class="k">, (c)</tspan><tspan class="b"> weights</tspan></text>
<text x="93" y="696"><tspan class="b">and measures</tspan><tspan class="k">, (d)</tspan><tspan class="b"> protection of wild animals and birds</tspan><tspan class="k">, and (e)</tspan><tspan class="b"> administration</tspan></text>
<text x="93" y="718"><tspan class="b">of justice; constitution and organisation of all courts except the Supreme Court</tspan></text>
<text x="93" y="740"><tspan class="b">and the high courts</tspan><tspan class="k">.</tspan></text>
<path d="M50 294 L44 294 L44 746 L50 746" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="126" y="752" width="87" height="30" rx="3"/>
<text class="sm" x="170" y="771" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="216" y1="767" x2="236" y2="767" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="752" width="169" height="30" rx="3"/>
<text class="sm" x="324" y="771" text-anchor="middle"><tspan class="r">42nd Amendment, 1976</tspan></text>
<line class="ln" x1="411" y1="767" x2="431" y2="767" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="752" width="120" height="30" rx="3"/>
<text class="sm" x="494" y="771" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="340" y1="788" x2="340" y2="800"/>
<line class="ln" x1="100" y1="800" x2="580" y2="800"/>
<line class="ln" x1="100" y1="800" x2="100" y2="816" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="800" x2="220" y2="816" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="800" x2="340" y2="816" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="800" x2="460" y2="816" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="800" x2="580" y2="816" marker-end="url(#ah)"/>
<text class="xs" x="100" y="836" text-anchor="middle"><tspan class="b">education</tspan></text>
<text class="xs" x="220" y="836" text-anchor="middle"><tspan class="b">forests</tspan></text>
<text class="xs" x="340" y="836" text-anchor="middle"><tspan class="b">weights &amp;</tspan></text>
<text class="xs" x="340" y="854" text-anchor="middle"><tspan class="b">measures</tspan></text>
<text class="xs" x="460" y="836" text-anchor="middle"><tspan class="b">wild animals &amp;</tspan></text>
<text class="xs" x="460" y="854" text-anchor="middle"><tspan class="b">birds</tspan></text>
<text class="xs" x="580" y="836" text-anchor="middle"><tspan class="b">administration of</tspan></text>
<text class="xs" x="580" y="854" text-anchor="middle"><tspan class="b">justice</tspan></text>
<text x="56" y="884" class="r" style="font-weight:700">(iv)</text>
<text x="91" y="884"><tspan class="k">The Parliament has power to make laws with respect to any matter for any part</tspan></text>
<text x="91" y="906"><tspan class="k">of the territory of India</tspan><tspan class="r"> not included in a state</tspan><tspan class="k"> even though that matter is one</tspan></text>
<text x="91" y="928"><tspan class="k">which is enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k">. This provision has reference to the</tspan><tspan class="b"> Union</tspan></text>
<text x="91" y="950"><tspan class="b">Territories</tspan><tspan class="k"> or the</tspan><tspan class="b"> Acquired Territories (if any)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="976" class="r" style="font-weight:700">(v)</text>
<text x="91" y="976"><tspan class="k">The</tspan><tspan class="r"> 101st Amendment Act of 2016</tspan><tspan class="k"> has made a special provision with respect to</tspan></text>
<text x="91" y="998"><tspan class="r">goods and services tax</tspan><tspan class="k">. Accordingly, the</tspan><tspan class="b"> Parliament and the state legislature</tspan><tspan class="k"> have</tspan></text>
<text x="91" y="1020"><tspan class="k">power to make laws with respect to goods and services tax imposed by the Union</tspan></text>
<text x="91" y="1042"><tspan class="k">or by the State. Further, the</tspan><tspan class="r"> parliament has exclusive power</tspan><tspan class="k"> to make laws with</tspan></text>
<text x="91" y="1064"><tspan class="k">respect to goods and services tax where the supply of goods or services or both</tspan></text>
<text x="91" y="1086"><tspan class="k">takes place in the course of</tspan><tspan class="r"> inter-state trade or commerce</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1112" class="r" style="font-weight:700">(vi)</text>
<text x="91" y="1112"><tspan class="k">The power to make laws with respect to</tspan><tspan class="r"> residuary subjects</tspan><tspan class="k"> (i.e., the matters</tspan></text>
<text x="91" y="1134"><tspan class="k">which are not enumerated in any of the three lists) is vested in the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="91" y="1156"><tspan class="k">This residuary power of legislation includes the power to levy</tspan><tspan class="r"> residuary taxes</tspan><tspan class="k">.</tspan></text>
<path d="M50 864 L44 864 L44 1162 L50 1162" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="128" y="1168" width="136" height="30" rx="3"/>
<text class="sm" x="196" y="1187" text-anchor="middle"><tspan class="r">Residuary subjects</tspan></text>
<line class="ln" x1="267" y1="1183" x2="287" y2="1183" marker-end="url(#ah)"/>
<rect class="bx" x="290" y="1168" width="90" height="30" rx="3"/>
<text class="sm" x="336" y="1187" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="384" y1="1183" x2="404" y2="1183" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="1168" width="145" height="30" rx="3"/>
<text class="sm" x="479" y="1187" text-anchor="middle"><tspan class="b">incl. residuary taxes</tspan></text>
<text class="xs" x="50" y="1234"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> Even now, the last entry is numbered as 97 but the total number of entries is 98. The entries</tspan></text>
<text class="xs" x="50" y="1252"><tspan class="k">numbered as 2A, 92A and 92B have been added and entries 33, 92 and 92C have been omitted.</tspan></text>
<rect x="40" y="1212" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1297"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> Even now, the last entry is numbered as 66 but the total number of entries is 59. The entries</tspan></text>
<text class="xs" x="50" y="1315"><tspan class="k">numbered as 11, 19, 20, 29, 36, 52 and 55 have been omitted.</tspan></text>
<rect x="40" y="1275" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1360"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> Even now, the last entry is numbered as 47 but the total number of entries is 52. The entries</tspan></text>
<text class="xs" x="50" y="1378"><tspan class="k">numbered as 11A, 17A, 17B, 20A and 33A have been added.</tspan></text>
<rect x="40" y="1338" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
