<div id="vis-container"><h2 class="sr-only">Distribution of Legislative Subjects</h2>
<svg class="n" width="100%" viewBox="0 0 680 1505" role="img"><title>Distribution of Legislative Subjects</title><desc>Distribution of Legislative Subjects</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Legislative Subjects</text>
<text class="lb" x="40" y="98">2. Distribution of Legislative Subjects</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Three-fold distribution (Seventh Schedule):</tspan><tspan class="k"> The Constitution provides for a</tspan><tspan class="r"> three-fold</tspan></text>
<text x="56" y="150"><tspan class="r">distribution</tspan><tspan class="k"> of legislative subjects between the Centre and the states, viz.,</tspan><tspan class="r"> List-I (the</tspan></text>
<text x="56" y="172"><tspan class="r">Union List)</tspan><tspan class="k">,</tspan><tspan class="r"> List-II (the State List)</tspan><tspan class="k"> and</tspan><tspan class="r"> List-III (the Concurrent List)</tspan><tspan class="k"> in the</tspan><tspan class="r"> Seventh</tspan></text>
<text x="56" y="194"><tspan class="r">Schedule</tspan><tspan class="k">:</tspan></text>
<rect class="bx" x="40" y="206" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="137" y="235" text-anchor="middle"><tspan class="r" style="font-weight:700">List-I Union List</tspan></text>
<text class="sm" x="137" y="253" text-anchor="middle"><tspan class="r">98 subjects</tspan></text>
<text class="sm" x="137" y="271" text-anchor="middle"><tspan class="b">originally 97</tspan></text>
<text class="sm" x="137" y="289" text-anchor="middle"><tspan class="k">Parliament – exclusive</tspan></text>
<rect class="bx" x="243" y="206" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="226" text-anchor="middle"><tspan class="r" style="font-weight:700">List-II State List</tspan></text>
<text class="sm" x="340" y="244" text-anchor="middle"><tspan class="r">59 subjects</tspan></text>
<text class="sm" x="340" y="262" text-anchor="middle"><tspan class="b">originally 66</tspan></text>
<text class="sm" x="340" y="280" text-anchor="middle"><tspan class="k">State – exclusive (normal</tspan></text>
<text class="sm" x="340" y="298" text-anchor="middle"><tspan class="k">times)</tspan></text>
<rect class="bx" x="447" y="206" width="193" height="104" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="543" y="235" text-anchor="middle"><tspan class="r" style="font-weight:700">List-III Concurrent List</tspan></text>
<text class="sm" x="543" y="253" text-anchor="middle"><tspan class="r">52 subjects</tspan></text>
<text class="sm" x="543" y="271" text-anchor="middle"><tspan class="b">originally 47</tspan></text>
<text class="sm" x="543" y="289" text-anchor="middle"><tspan class="k">Both</tspan></text>
<text x="56" y="336" class="r" style="font-weight:700">(i)</text>
<text x="93" y="336"><tspan class="h" style="font-weight:700">Union List – exclusive power of Parliament:</tspan><tspan class="k"> The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive</tspan></text>
<text x="93" y="358"><tspan class="r">powers</tspan><tspan class="k"> to make laws with respect to any of the matters enumerated in the</tspan><tspan class="r"> Union</tspan></text>
<text x="93" y="380"><tspan class="r">List</tspan><tspan class="k">. This list has at present</tspan><tspan class="r"> 98 subjects</tspan><tspan class="k"> (</tspan><tspan class="b">originally 97¹ subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> defence,</tspan></text>
<text x="93" y="402"><tspan class="b">banking, foreign affairs, currency, atomic energy, insurance, communication,</tspan></text>
<text x="93" y="424"><tspan class="b">inter-state trade and commerce, census, audit</tspan><tspan class="k"> and so on.</tspan></text>
<text x="56" y="450" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="450"><tspan class="h" style="font-weight:700">State List – exclusive in normal times:</tspan><tspan class="k"> The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> has “</tspan><tspan class="r">in normal</tspan></text>
<text x="93" y="472"><tspan class="r">circumstances</tspan><tspan class="k">” exclusive powers to make laws with respect to any of the matters</tspan></text>
<text x="93" y="494"><tspan class="k">enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k">. This has at present</tspan><tspan class="r"> 59 subjects</tspan><tspan class="k"> (</tspan><tspan class="b">originally 66²</tspan></text>
<text x="93" y="516"><tspan class="b">subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> public order, police, public health and sanitation, agriculture, prisons,</tspan></text>
<text x="93" y="538"><tspan class="b">local government, fisheries, markets, theaters, gambling</tspan><tspan class="k"> and so on.</tspan></text>
<text x="56" y="564" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="564"><tspan class="h" style="font-weight:700">Concurrent List – shared domain:</tspan><tspan class="r"> Both</tspan><tspan class="k">, the Parliament and state legislature can</tspan></text>
<text x="93" y="586"><tspan class="k">make laws with respect to any of the matters enumerated in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="93" y="608"><tspan class="k">This list has at present</tspan><tspan class="r"> 52 subjects</tspan><tspan class="k"> (</tspan><tspan class="b">originally 47³ subjects</tspan><tspan class="k">) like</tspan><tspan class="b"> criminal law and</tspan></text>
<text x="93" y="630"><tspan class="b">procedure, civil procedure, marriage and divorce, population control and family</tspan></text>
<text x="93" y="652"><tspan class="b">planning, electricity, labour welfare, economic and social planning, drugs,</tspan></text>
<text x="93" y="674"><tspan class="b">newspapers, books and printing press</tspan><tspan class="k">, and others. The</tspan><tspan class="r"> 42nd Amendment Act of</tspan></text>
<text x="93" y="696"><tspan class="r">1976</tspan><tspan class="k"> transferred</tspan><tspan class="r"> five subjects</tspan><tspan class="k"> to Concurrent List from State List, that is, (a)</tspan></text>
<text x="93" y="718"><tspan class="b">education</tspan><tspan class="k">, (b)</tspan><tspan class="b"> forests</tspan><tspan class="k">, (c)</tspan><tspan class="b"> weights and measures</tspan><tspan class="k">, (d)</tspan><tspan class="b"> protection of wild animals</tspan></text>
<text x="93" y="740"><tspan class="b">and birds</tspan><tspan class="k">, and (e)</tspan><tspan class="b"> administration of justice; constitution and organisation of all</tspan></text>
<text x="93" y="762"><tspan class="b">courts except the Supreme Court and the high courts</tspan><tspan class="k">.</tspan></text>
<path d="M50 316 L44 316 L44 768 L50 768" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="126" y="774" width="87" height="30" rx="3"/>
<text class="sm" x="170" y="793" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="216" y1="789" x2="236" y2="789" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="774" width="169" height="30" rx="3"/>
<text class="sm" x="324" y="793" text-anchor="middle"><tspan class="r">42nd Amendment, 1976</tspan></text>
<line class="ln" x1="411" y1="789" x2="431" y2="789" marker-end="url(#ah)"/>
<rect class="bx" x="434" y="774" width="120" height="30" rx="3"/>
<text class="sm" x="494" y="793" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="340" y1="810" x2="340" y2="822"/>
<line class="ln" x1="100" y1="822" x2="580" y2="822"/>
<line class="ln" x1="100" y1="822" x2="100" y2="838" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="822" x2="220" y2="838" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="822" x2="340" y2="838" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="822" x2="460" y2="838" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="822" x2="580" y2="838" marker-end="url(#ah)"/>
<text class="xs" x="100" y="858" text-anchor="middle"><tspan class="b">education</tspan></text>
<text class="xs" x="220" y="858" text-anchor="middle"><tspan class="b">forests</tspan></text>
<text class="xs" x="340" y="858" text-anchor="middle"><tspan class="b">weights &amp;</tspan></text>
<text class="xs" x="340" y="876" text-anchor="middle"><tspan class="b">measures</tspan></text>
<text class="xs" x="460" y="858" text-anchor="middle"><tspan class="b">wild animals &amp;</tspan></text>
<text class="xs" x="460" y="876" text-anchor="middle"><tspan class="b">birds</tspan></text>
<text class="xs" x="580" y="858" text-anchor="middle"><tspan class="b">administration of</tspan></text>
<text class="xs" x="580" y="876" text-anchor="middle"><tspan class="b">justice</tspan></text>
<text x="56" y="906" class="r" style="font-weight:700">(iv)</text>
<text x="91" y="906"><tspan class="h" style="font-weight:700">Union Territories &amp; acquired territories:</tspan><tspan class="k"> The Parliament has power to make laws</tspan></text>
<text x="91" y="928"><tspan class="k">with respect to any matter for any part of the territory of India</tspan><tspan class="r"> not included in a</tspan></text>
<text x="91" y="950"><tspan class="r">state</tspan><tspan class="k"> even though that matter is one which is enumerated in the</tspan><tspan class="r"> State List</tspan><tspan class="k">. This</tspan></text>
<text x="91" y="972"><tspan class="k">provision has reference to the</tspan><tspan class="b"> Union Territories</tspan><tspan class="k"> or the</tspan><tspan class="b"> Acquired Territories (if</tspan></text>
<text x="91" y="994"><tspan class="b">any)</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1020" class="r" style="font-weight:700">(v)</text>
<text x="91" y="1020"><tspan class="h" style="font-weight:700">GST – simultaneous power (101st Amdt):</tspan><tspan class="k"> The</tspan><tspan class="r"> 101st Amendment Act of 2016</tspan><tspan class="k"> has</tspan></text>
<text x="91" y="1042"><tspan class="k">made a special provision with respect to</tspan><tspan class="r"> goods and services tax</tspan><tspan class="k">. Accordingly, the</tspan></text>
<text x="91" y="1064"><tspan class="b">Parliament and the state legislature</tspan><tspan class="k"> have power to make laws with respect to</tspan></text>
<text x="91" y="1086"><tspan class="k">goods and services tax imposed by the Union or by the State. Further, the</tspan></text>
<text x="91" y="1108"><tspan class="r">parliament has exclusive power</tspan><tspan class="k"> to make laws with respect to goods and services</tspan></text>
<text x="91" y="1130"><tspan class="k">tax where the supply of goods or services or both takes place in the course of</tspan></text>
<text x="91" y="1152"><tspan class="r">inter-state trade or commerce</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1178" class="r" style="font-weight:700">(vi)</text>
<text x="91" y="1178"><tspan class="h" style="font-weight:700">Residuary powers with Parliament:</tspan><tspan class="k"> The power to make laws with respect to</tspan></text>
<text x="91" y="1200"><tspan class="r">residuary subjects</tspan><tspan class="k"> (i.e., the matters which are not enumerated in any of the</tspan></text>
<text x="91" y="1222"><tspan class="k">three lists) is vested in the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">. This residuary power of legislation</tspan></text>
<text x="91" y="1244"><tspan class="k">includes the power to levy</tspan><tspan class="r"> residuary taxes</tspan><tspan class="k">.</tspan></text>
<path d="M50 886 L44 886 L44 1250 L50 1250" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="128" y="1256" width="136" height="30" rx="3"/>
<text class="sm" x="196" y="1275" text-anchor="middle"><tspan class="r">Residuary subjects</tspan></text>
<line class="ln" x1="267" y1="1271" x2="287" y2="1271" marker-end="url(#ah)"/>
<rect class="bx" x="290" y="1256" width="90" height="30" rx="3"/>
<text class="sm" x="336" y="1275" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="384" y1="1271" x2="404" y2="1271" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="1256" width="145" height="30" rx="3"/>
<text class="sm" x="479" y="1275" text-anchor="middle"><tspan class="b">incl. residuary taxes</tspan></text>
<text class="xs" x="50" y="1322"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> Even now, the last entry is numbered as 97 but the total number of entries is 98. The entries</tspan></text>
<text class="xs" x="50" y="1340"><tspan class="k">numbered as 2A, 92A and 92B have been added and entries 33, 92 and 92C have been omitted.</tspan></text>
<rect x="40" y="1300" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1385"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> Even now, the last entry is numbered as 66 but the total number of entries is 59. The entries</tspan></text>
<text class="xs" x="50" y="1403"><tspan class="k">numbered as 11, 19, 20, 29, 36, 52 and 55 have been omitted.</tspan></text>
<rect x="40" y="1363" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1448"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> Even now, the last entry is numbered as 47 but the total number of entries is 52. The entries</tspan></text>
<text class="xs" x="50" y="1466"><tspan class="k">numbered as 11A, 17A, 17B, 20A and 33A have been added.</tspan></text>
<rect x="40" y="1426" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
