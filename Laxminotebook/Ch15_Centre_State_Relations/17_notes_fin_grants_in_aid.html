<title>Grants-in-Aid to the States</title>

<div id="vis-container"><h2 class="sr-only">Grants-in-Aid to the States</h2>
<svg class="n" width="100%" viewBox="0 0 680 1369" role="img"><title>Grants-in-Aid to the States</title><desc>Grants-in-Aid to the States</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="202" y="26" width="276" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Grants-in-Aid to the States</text>
<text class="lb" x="40" y="98">4. Grants-in-Aid to the States</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Grants-in-aid:</tspan><tspan class="k"> Besides sharing of taxes between the Centre and the states, the</tspan></text>
<text x="56" y="150"><tspan class="k">Constitution provides for</tspan><tspan class="r"> grants-in-aid</tspan><tspan class="k"> to the states from the Central resources.</tspan></text>
<text x="44" y="178"><tspan class="h" style="font-weight:700">Two types:</tspan><tspan class="k"> There are</tspan><tspan class="r"> two types</tspan><tspan class="k"> of grants-in-aid, viz,</tspan><tspan class="r"> statutory grants</tspan><tspan class="k"> and</tspan><tspan class="r"> discretionary</tspan></text>
<text x="56" y="200"><tspan class="r">grants</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="206" x2="340" y2="218"/>
<line class="ln" x1="140" y1="218" x2="540" y2="218"/>
<line class="ln" x1="140" y1="218" x2="140" y2="234" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="218" x2="340" y2="234" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="218" x2="540" y2="234" marker-end="url(#ah)"/>
<text class="sm" x="140" y="254" text-anchor="middle"><tspan class="r" style="font-weight:700">A. Statutory</tspan><tspan class="k"> (Art. 275)</tspan></text>
<text class="sm" x="340" y="254" text-anchor="middle"><tspan class="r" style="font-weight:700">B. Discretionary</tspan><tspan class="k"> (Art. 282)</tspan></text>
<text class="sm" x="540" y="254" text-anchor="middle"><tspan class="r" style="font-weight:700">C. Other</tspan><tspan class="k"> (temporary)</tspan></text>
<text class="sh" x="40" y="286"><tspan class="r" style="font-weight:700">A. Statutory Grants</tspan></text>
<text x="44" y="316"><tspan class="h" style="font-weight:700">Art. 275 – needy states:</tspan><tspan class="r"> Article 275</tspan><tspan class="k"> empowers the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> to make grants to the</tspan></text>
<text x="56" y="338"><tspan class="k">states which are</tspan><tspan class="r"> in need of financial assistance</tspan><tspan class="k"> and</tspan><tspan class="b"> not to every state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="366"><tspan class="h" style="font-weight:700">Different sums:</tspan><tspan class="k"> Also,</tspan><tspan class="b"> different sums may be fixed for different states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="394"><tspan class="h" style="font-weight:700">Charged on CFI:</tspan><tspan class="k"> These sums are</tspan><tspan class="r"> charged on the Consolidated Fund of India</tspan><tspan class="k"> every year.</tspan></text>
<text x="44" y="422"><tspan class="h" style="font-weight:700">Specific grants:</tspan><tspan class="k"> Apart from this general provision, the Constitution also provides for</tspan></text>
<text x="56" y="444"><tspan class="r">specific grants</tspan><tspan class="k"> for promoting the</tspan><tspan class="b"> welfare of the scheduled tribes</tspan><tspan class="k"> in a state or for raising</tspan></text>
<text x="56" y="466"><tspan class="k">the level of administration of the</tspan><tspan class="b"> scheduled areas</tspan><tspan class="k"> in a state including the State of</tspan></text>
<text x="56" y="488"><tspan class="r">Assam</tspan><tspan class="k">.</tspan></text>
<text x="44" y="516"><tspan class="h" style="font-weight:700">On FC recommendation:</tspan><tspan class="k"> The statutory grants under Article 275 (</tspan><tspan class="b">both general and</tspan></text>
<text x="56" y="538"><tspan class="b">specific</tspan><tspan class="k">) are given to the states on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="552" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="570" text-anchor="middle"><tspan class="r" style="font-weight:700">General</tspan></text>
<line class="ln" x1="190" y1="580" x2="190" y2="594" marker-end="url(#ah)"/>
<text class="sm" x="190" y="615" text-anchor="middle"><tspan class="k">states in need</tspan></text>
<text class="sm" x="190" y="637" text-anchor="middle"><tspan class="k">different sums</tspan></text>
<rect class="bx" x="346" y="552" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="570" text-anchor="middle"><tspan class="r" style="font-weight:700">Specific</tspan></text>
<line class="ln" x1="490" y1="580" x2="490" y2="594" marker-end="url(#ah)"/>
<text class="sm" x="490" y="615" text-anchor="middle"><tspan class="k">welfare of STs</tspan></text>
<text class="sm" x="490" y="637" text-anchor="middle"><tspan class="k">scheduled areas (incl. Assam)</tspan></text>
<line x1="340" y1="552" x2="340" y2="640" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<line class="ln" x1="340" y1="652" x2="340" y2="668" marker-end="url(#ah)"/>
<text class="sm" x="352" y="684"><tspan class="k">both on recommendation of</tspan><tspan class="r"> Finance</tspan></text>
<text class="sm" x="352" y="703"><tspan class="r">Commission</tspan><tspan class="k"> · charged on</tspan><tspan class="b"> Consolidated Fund</tspan></text>
<text class="sm" x="352" y="722"><tspan class="b">of India</tspan></text>
<text class="sh" x="40" y="754"><tspan class="r" style="font-weight:700">B. Discretionary Grants</tspan></text>
<text x="44" y="784"><tspan class="h" style="font-weight:700">Art. 282 – any public purpose:</tspan><tspan class="r"> Article 282</tspan><tspan class="k"> empowers</tspan><tspan class="r"> both the Centre and the states</tspan></text>
<text x="56" y="806"><tspan class="k">to make any grants for any</tspan><tspan class="r"> public purpose</tspan><tspan class="k">, even if it is</tspan><tspan class="b"> not within their respective</tspan></text>
<text x="56" y="828"><tspan class="b">legislative competence</tspan><tspan class="k">.</tspan></text>
<text x="44" y="856"><tspan class="h" style="font-weight:700">Centre to states:</tspan><tspan class="k"> Under this provision, the Centre makes grants to the states.</tspan></text>
<text x="56" y="884"><tspan class="h" style="font-weight:700">Discretionary – no obligation:</tspan><tspan class="k"> “These grants are also known as</tspan><tspan class="r"> discretionary grants</tspan><tspan class="k">,</tspan></text>
<text x="68" y="906"><tspan class="k">the reason being that the Centre is</tspan><tspan class="r"> under no obligation</tspan><tspan class="k"> to give these grants and the</tspan></text>
<text x="68" y="928"><tspan class="k">matter lies within its discretion.</tspan></text>
<text x="56" y="954"><tspan class="h" style="font-weight:700">Two-fold purpose:</tspan><tspan class="k"> These grants have a</tspan><tspan class="r"> two-fold purpose</tspan><tspan class="k">: to help the state</tspan></text>
<text x="68" y="976"><tspan class="k">financially to</tspan><tspan class="b"> fulfil plan targets</tspan><tspan class="k">; and to give some leverage to the Centre to</tspan><tspan class="b"> influence</tspan></text>
<text x="68" y="998"><tspan class="b">and coordinate state action</tspan><tspan class="k"> to effectuate the national plan.”¹⁵</tspan></text>
<line x1="44" y1="864" x2="44" y2="1006" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<line class="ln" x1="340" y1="1012" x2="340" y2="1024"/>
<line class="ln" x1="190" y1="1024" x2="490" y2="1024"/>
<line class="ln" x1="190" y1="1024" x2="190" y2="1040" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="1024" x2="490" y2="1040" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1060" text-anchor="middle"><tspan class="b">fulfil plan targets</tspan></text>
<text class="sm" x="490" y="1060" text-anchor="middle"><tspan class="b">leverage to Centre</tspan></text>
<text class="sh" x="40" y="1092"><tspan class="r" style="font-weight:700">C. Other Grants</tspan></text>
<text x="44" y="1122"><tspan class="h" style="font-weight:700">Third type – temporary:</tspan><tspan class="k"> The Constitution also provided for a</tspan><tspan class="r"> third type</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="1144"><tspan class="k">grants-in-aid, but for a</tspan><tspan class="r"> temporary period</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1172"><tspan class="h" style="font-weight:700">Jute export grants:</tspan><tspan class="k"> Thus, a provision was made for</tspan><tspan class="r"> grants in lieu of export duties on</tspan></text>
<text x="56" y="1194"><tspan class="r">jute and jute products</tspan><tspan class="k"> to the States of</tspan><tspan class="b"> Assam, Bihar, Orissa and west Bengal</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1222"><tspan class="h" style="font-weight:700">Ten years:</tspan><tspan class="k"> These grants were to be given for a period of</tspan><tspan class="r"> ten years</tspan><tspan class="k"> from the</tspan></text>
<text x="56" y="1244"><tspan class="k">commencement of the Constitution.</tspan></text>
<text x="44" y="1272"><tspan class="h" style="font-weight:700">Charged on CFI:</tspan><tspan class="k"> These sums were charged on the Consolidated Fund of India and were</tspan></text>
<text x="56" y="1294"><tspan class="k">made to the states on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1330"><tspan class="r" style="font-weight:700">15</tspan><tspan class="k"> M.P. Jain: Indian Constitutional Law, Wadhwa, Fourth Edition, pp. 342–43.</tspan></text>
<rect x="40" y="1308" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
