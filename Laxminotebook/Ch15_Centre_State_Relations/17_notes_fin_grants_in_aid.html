<div id="vis-container"><h2 class="sr-only">Grants-in-Aid to the States</h2>
<svg class="n" width="100%" viewBox="0 0 680 1235" role="img"><title>Grants-in-Aid to the States</title><desc>Grants-in-Aid to the States</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="202" y="26" width="276" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Grants-in-Aid to the States</text>
<text class="lb" x="40" y="98">4. Grants-in-Aid to the States</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Two types of grants:</tspan><tspan class="k"> Besides sharing of taxes between the Centre and the states, the</tspan></text>
<text x="56" y="150"><tspan class="k">Constitution provides for</tspan><tspan class="r"> grants-in-aid</tspan><tspan class="k"> to the states from the Central resources. There</tspan></text>
<text x="56" y="172"><tspan class="k">are</tspan><tspan class="r"> two types</tspan><tspan class="k"> of grants-in-aid, viz,</tspan><tspan class="r"> statutory grants</tspan><tspan class="k"> and</tspan><tspan class="r"> discretionary grants</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="178" x2="340" y2="190"/>
<line class="ln" x1="140" y1="190" x2="540" y2="190"/>
<line class="ln" x1="140" y1="190" x2="140" y2="206" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="190" x2="340" y2="206" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="190" x2="540" y2="206" marker-end="url(#ah)"/>
<text class="sm" x="140" y="226" text-anchor="middle"><tspan class="r" style="font-weight:700">A. Statutory</tspan><tspan class="k"> (Art. 275)</tspan></text>
<text class="sm" x="340" y="226" text-anchor="middle"><tspan class="r" style="font-weight:700">B. Discretionary</tspan><tspan class="k"> (Art. 282)</tspan></text>
<text class="sm" x="540" y="226" text-anchor="middle"><tspan class="r" style="font-weight:700">C. Other</tspan><tspan class="k"> (temporary)</tspan></text>
<text class="sh" x="40" y="258"><tspan class="r" style="font-weight:700">A. Statutory Grants</tspan></text>
<text x="44" y="288"><tspan class="h" style="font-weight:700">Art. 275 – needy states:</tspan><tspan class="r"> Article 275</tspan><tspan class="k"> empowers the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> to make grants to the</tspan></text>
<text x="56" y="310"><tspan class="k">states which are</tspan><tspan class="r"> in need of financial assistance</tspan><tspan class="k"> and</tspan><tspan class="b"> not to every state</tspan><tspan class="k">. Also,</tspan><tspan class="b"> different</tspan></text>
<text x="56" y="332"><tspan class="b">sums may be fixed for different states</tspan><tspan class="k">. These sums are</tspan><tspan class="r"> charged on the Consolidated</tspan></text>
<text x="56" y="354"><tspan class="r">Fund of India</tspan><tspan class="k"> every year.</tspan></text>
<text x="44" y="382"><tspan class="h" style="font-weight:700">Specific grants:</tspan><tspan class="k"> Apart from this general provision, the Constitution also provides for</tspan></text>
<text x="56" y="404"><tspan class="r">specific grants</tspan><tspan class="k"> for promoting the</tspan><tspan class="b"> welfare of the scheduled tribes</tspan><tspan class="k"> in a state or for raising</tspan></text>
<text x="56" y="426"><tspan class="k">the level of administration of the</tspan><tspan class="b"> scheduled areas</tspan><tspan class="k"> in a state including the State of</tspan></text>
<text x="56" y="448"><tspan class="r">Assam</tspan><tspan class="k">.</tspan></text>
<text x="44" y="476"><tspan class="h" style="font-weight:700">FC recommendation:</tspan><tspan class="k"> The statutory grants under Article 275 (</tspan><tspan class="b">both general and specific</tspan><tspan class="k">)</tspan></text>
<text x="56" y="498"><tspan class="k">are given to the states on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="512" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="530" text-anchor="middle"><tspan class="r" style="font-weight:700">General</tspan></text>
<line class="ln" x1="190" y1="540" x2="190" y2="554" marker-end="url(#ah)"/>
<text class="sm" x="190" y="575" text-anchor="middle"><tspan class="k">states in need</tspan></text>
<text class="sm" x="190" y="597" text-anchor="middle"><tspan class="k">different sums</tspan></text>
<rect class="bx" x="346" y="512" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="530" text-anchor="middle"><tspan class="r" style="font-weight:700">Specific</tspan></text>
<line class="ln" x1="490" y1="540" x2="490" y2="554" marker-end="url(#ah)"/>
<text class="sm" x="490" y="575" text-anchor="middle"><tspan class="k">welfare of STs</tspan></text>
<text class="sm" x="490" y="597" text-anchor="middle"><tspan class="k">scheduled areas (incl. Assam)</tspan></text>
<line x1="340" y1="512" x2="340" y2="600" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<line class="ln" x1="340" y1="612" x2="340" y2="628" marker-end="url(#ah)"/>
<text class="sm" x="352" y="644"><tspan class="k">both on recommendation of</tspan><tspan class="r"> Finance</tspan></text>
<text class="sm" x="352" y="663"><tspan class="r">Commission</tspan><tspan class="k"> · charged on</tspan><tspan class="b"> Consolidated Fund</tspan></text>
<text class="sm" x="352" y="682"><tspan class="b">of India</tspan></text>
<text class="sh" x="40" y="714"><tspan class="r" style="font-weight:700">B. Discretionary Grants</tspan></text>
<text x="44" y="744"><tspan class="h" style="font-weight:700">Art. 282 – any public purpose:</tspan><tspan class="r"> Article 282</tspan><tspan class="k"> empowers</tspan><tspan class="r"> both the Centre and the states</tspan></text>
<text x="56" y="766"><tspan class="k">to make any grants for any</tspan><tspan class="r"> public purpose</tspan><tspan class="k">, even if it is</tspan><tspan class="b"> not within their respective</tspan></text>
<text x="56" y="788"><tspan class="b">legislative competence</tspan><tspan class="k">. Under this provision, the Centre makes grants to the states.</tspan></text>
<text x="56" y="816"><tspan class="h" style="font-weight:700">Discretionary grants:</tspan><tspan class="k"> “These grants are also known as</tspan><tspan class="r"> discretionary grants</tspan><tspan class="k">, the</tspan></text>
<text x="68" y="838"><tspan class="k">reason being that the Centre is</tspan><tspan class="r"> under no obligation</tspan><tspan class="k"> to give these grants and the</tspan></text>
<text x="68" y="860"><tspan class="k">matter lies within its discretion. These grants have a</tspan><tspan class="r"> two-fold purpose</tspan><tspan class="k">: to help the</tspan></text>
<text x="68" y="882"><tspan class="k">state financially to</tspan><tspan class="b"> fulfil plan targets</tspan><tspan class="k">; and to give some leverage to the Centre to</tspan></text>
<text x="68" y="904"><tspan class="b">influence and coordinate state action</tspan><tspan class="k"> to effectuate the national plan.”¹⁵</tspan></text>
<line x1="44" y1="796" x2="44" y2="912" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<line class="ln" x1="340" y1="918" x2="340" y2="930"/>
<line class="ln" x1="190" y1="930" x2="490" y2="930"/>
<line class="ln" x1="190" y1="930" x2="190" y2="946" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="930" x2="490" y2="946" marker-end="url(#ah)"/>
<text class="sm" x="190" y="966" text-anchor="middle"><tspan class="b">fulfil plan targets</tspan></text>
<text class="sm" x="490" y="966" text-anchor="middle"><tspan class="b">leverage to Centre</tspan></text>
<text class="sh" x="40" y="998"><tspan class="r" style="font-weight:700">C. Other Grants</tspan></text>
<text x="44" y="1028"><tspan class="h" style="font-weight:700">Jute grants – temporary:</tspan><tspan class="k"> The Constitution also provided for a</tspan><tspan class="r"> third type</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="1050"><tspan class="k">grants-in-aid, but for a</tspan><tspan class="r"> temporary period</tspan><tspan class="k">. Thus, a provision was made for</tspan><tspan class="r"> grants in lieu</tspan></text>
<text x="56" y="1072"><tspan class="r">of export duties on jute and jute products</tspan><tspan class="k"> to the States of</tspan><tspan class="b"> Assam, Bihar, Orissa and</tspan></text>
<text x="56" y="1094"><tspan class="b">west Bengal</tspan><tspan class="k">. These grants were to be given for a period of</tspan><tspan class="r"> ten years</tspan><tspan class="k"> from the</tspan></text>
<text x="56" y="1116"><tspan class="k">commencement of the Constitution. These sums were charged on the Consolidated Fund</tspan></text>
<text x="56" y="1138"><tspan class="k">of India and were made to the states on the recommendation of the</tspan><tspan class="r"> Finance</tspan></text>
<text x="56" y="1160"><tspan class="r">Commission</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1196"><tspan class="r" style="font-weight:700">15</tspan><tspan class="k"> M.P. Jain: Indian Constitutional Law, Wadhwa, Fourth Edition, pp. 342–43.</tspan></text>
<rect x="40" y="1174" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
