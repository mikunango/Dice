<title>Grants-in-Aid to the States</title>

<div id="vis-container"><h2 class="sr-only">Grants-in-Aid to the States</h2>
<svg class="n" width="100%" viewBox="0 0 680 1275" role="img"><title>Grants-in-Aid to the States</title><desc>Grants-in-Aid to the States</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="202" y="26" width="276" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Grants-in-Aid to the States</text>
<text class="lb" x="40" y="98">4. Grants-in-Aid to the States</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">Besides sharing of taxes between the Centre and the states, the Constitution provides</tspan></text>
<text x="58" y="148"><tspan class="k">for</tspan><tspan class="r"> grants-in-aid</tspan><tspan class="k"> to the states from the Central resources.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">There are</tspan><tspan class="r"> two types</tspan><tspan class="k"> of grants-in-aid, viz,</tspan><tspan class="r"> statutory grants</tspan><tspan class="k"> and</tspan><tspan class="r"> discretionary grants</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="180" x2="340" y2="192"/>
<line class="ln" x1="140" y1="192" x2="540" y2="192"/>
<line class="ln" x1="140" y1="192" x2="140" y2="208" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="192" x2="340" y2="208" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="192" x2="540" y2="208" marker-end="url(#ah)"/>
<text class="sm" x="140" y="228" text-anchor="middle"><tspan class="r" style="font-weight:700">A. Statutory</tspan><tspan class="k"> (Art. 275)</tspan></text>
<text class="sm" x="340" y="228" text-anchor="middle"><tspan class="r" style="font-weight:700">B. Discretionary</tspan><tspan class="k"> (Art. 282)</tspan></text>
<text class="sm" x="540" y="228" text-anchor="middle"><tspan class="r" style="font-weight:700">C. Other</tspan><tspan class="k"> (temporary)</tspan></text>
<text class="sh" x="40" y="260"><tspan class="r" style="font-weight:700">A. Statutory Grants</tspan></text>
<text x="44" y="288" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="288"><tspan class="r">Article 275</tspan><tspan class="k"> empowers the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> to make grants to the states which are</tspan><tspan class="r"> in need</tspan></text>
<text x="58" y="310"><tspan class="r">of financial assistance</tspan><tspan class="k"> and</tspan><tspan class="b"> not to every state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="336" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="336"><tspan class="k">Also,</tspan><tspan class="b"> different sums may be fixed for different states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="362" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="362"><tspan class="k">These sums are</tspan><tspan class="r"> charged on the Consolidated Fund of India</tspan><tspan class="k"> every year.</tspan></text>
<text x="44" y="388" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="388"><tspan class="k">Apart from this general provision, the Constitution also provides for</tspan><tspan class="r"> specific grants</tspan><tspan class="k"> for</tspan></text>
<text x="58" y="410"><tspan class="k">promoting the</tspan><tspan class="b"> welfare of the scheduled tribes</tspan><tspan class="k"> in a state or for raising the level of</tspan></text>
<text x="58" y="432"><tspan class="k">administration of the</tspan><tspan class="b"> scheduled areas</tspan><tspan class="k"> in a state including the State of</tspan><tspan class="r"> Assam</tspan><tspan class="k">.</tspan></text>
<text x="44" y="458" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="458"><tspan class="k">The statutory grants under Article 275 (</tspan><tspan class="b">both general and specific</tspan><tspan class="k">) are given to the</tspan></text>
<text x="58" y="480"><tspan class="k">states on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="494" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="512" text-anchor="middle"><tspan class="r" style="font-weight:700">General</tspan></text>
<line class="ln" x1="190" y1="522" x2="190" y2="536" marker-end="url(#ah)"/>
<text class="sm" x="190" y="557" text-anchor="middle"><tspan class="k">states in need</tspan></text>
<text class="sm" x="190" y="579" text-anchor="middle"><tspan class="k">different sums</tspan></text>
<rect class="bx" x="346" y="494" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="512" text-anchor="middle"><tspan class="r" style="font-weight:700">Specific</tspan></text>
<line class="ln" x1="490" y1="522" x2="490" y2="536" marker-end="url(#ah)"/>
<text class="sm" x="490" y="557" text-anchor="middle"><tspan class="k">welfare of STs</tspan></text>
<text class="sm" x="490" y="579" text-anchor="middle"><tspan class="k">scheduled areas (incl. Assam)</tspan></text>
<line x1="340" y1="494" x2="340" y2="582" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<line class="ln" x1="340" y1="594" x2="340" y2="610" marker-end="url(#ah)"/>
<text class="sm" x="352" y="626"><tspan class="k">both on recommendation of</tspan><tspan class="r"> Finance</tspan></text>
<text class="sm" x="352" y="645"><tspan class="r">Commission</tspan><tspan class="k"> · charged on</tspan><tspan class="b"> Consolidated Fund</tspan></text>
<text class="sm" x="352" y="664"><tspan class="b">of India</tspan></text>
<text class="sh" x="40" y="696"><tspan class="r" style="font-weight:700">B. Discretionary Grants</tspan></text>
<text x="44" y="724" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="724"><tspan class="r">Article 282</tspan><tspan class="k"> empowers</tspan><tspan class="r"> both the Centre and the states</tspan><tspan class="k"> to make any grants for any</tspan></text>
<text x="58" y="746"><tspan class="r">public purpose</tspan><tspan class="k">, even if it is</tspan><tspan class="b"> not within their respective legislative competence</tspan><tspan class="k">.</tspan></text>
<text x="44" y="772" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="772"><tspan class="k">Under this provision, the Centre makes grants to the states.</tspan></text>
<text x="56" y="799" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="799"><tspan class="k">“These grants are also known as</tspan><tspan class="r"> discretionary grants</tspan><tspan class="k">, the reason being that the</tspan></text>
<text x="70" y="821"><tspan class="k">Centre is</tspan><tspan class="r"> under no obligation</tspan><tspan class="k"> to give these grants and the matter lies within its</tspan></text>
<text x="70" y="843"><tspan class="k">discretion.</tspan></text>
<text x="56" y="868" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="868"><tspan class="k">These grants have a</tspan><tspan class="r"> two-fold purpose</tspan><tspan class="k">: to help the state financially to</tspan><tspan class="b"> fulfil plan</tspan></text>
<text x="70" y="890"><tspan class="b">targets</tspan><tspan class="k">; and to give some leverage to the Centre to</tspan><tspan class="b"> influence and coordinate state</tspan></text>
<text x="70" y="912"><tspan class="b">action</tspan><tspan class="k"> to effectuate the national plan.”¹⁵</tspan></text>
<line x1="44" y1="780" x2="44" y2="920" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<line class="ln" x1="340" y1="926" x2="340" y2="938"/>
<line class="ln" x1="190" y1="938" x2="490" y2="938"/>
<line class="ln" x1="190" y1="938" x2="190" y2="954" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="938" x2="490" y2="954" marker-end="url(#ah)"/>
<text class="sm" x="190" y="974" text-anchor="middle"><tspan class="b">fulfil plan targets</tspan></text>
<text class="sm" x="490" y="974" text-anchor="middle"><tspan class="b">leverage to Centre</tspan></text>
<text class="sh" x="40" y="1006"><tspan class="r" style="font-weight:700">C. Other Grants</tspan></text>
<text x="44" y="1034" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1034"><tspan class="k">The Constitution also provided for a</tspan><tspan class="r"> third type</tspan><tspan class="k"> of grants-in-aid, but for a</tspan><tspan class="r"> temporary</tspan></text>
<text x="58" y="1056"><tspan class="r">period</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1082" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1082"><tspan class="k">Thus, a provision was made for</tspan><tspan class="r"> grants in lieu of export duties on jute and jute products</tspan></text>
<text x="58" y="1104"><tspan class="k">to the States of</tspan><tspan class="b"> Assam, Bihar, Orissa and west Bengal</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1130" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1130"><tspan class="k">These grants were to be given for a period of</tspan><tspan class="r"> ten years</tspan><tspan class="k"> from the commencement of</tspan></text>
<text x="58" y="1152"><tspan class="k">the Constitution.</tspan></text>
<text x="44" y="1178" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1178"><tspan class="k">These sums were charged on the Consolidated Fund of India and were made to the</tspan></text>
<text x="58" y="1200"><tspan class="k">states on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1236"><tspan class="r" style="font-weight:700">15</tspan><tspan class="k"> M.P. Jain: Indian Constitutional Law, Wadhwa, Fourth Edition, pp. 342–43.</tspan></text>
<rect x="40" y="1214" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
