<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution of Tax Revenues – Articles 268 to 271</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#73726c}
html,body{margin:0;padding:0;background:#ffffff}

.n text{font-family:'Kalam',cursive;font-size:15px}.r{fill:#D93A3A}.b{fill:#2F6FDB}.k{fill:var(--text-primary)}.h{fill:#7A1F1F;text-decoration:underline}.hd{font-weight:700;font-size:17px!important}.sh{font-weight:700;font-size:16px!important}.ln{stroke:var(--text-secondary);stroke-width:1.2;fill:none}.lb{fill:var(--text-primary);font-weight:700;text-decoration:underline}.sm{font-size:14px!important}.xs{font-size:13px!important}.bx{fill:none;stroke:#D93A3A;stroke-width:1.2}.gx{fill:none;stroke:var(--text-secondary);stroke-width:1}
@media print{#vis-container{padding:0}}
</style></head><body>
<div id="vis-container"><h2 class="sr-only">Distribution of Tax Revenues – Articles 268 to 271</h2>
<svg class="n" width="100%" viewBox="0 0 680 1526" role="img"><title>Distribution of Tax Revenues – Articles 268 to 271</title><desc>Distribution of Tax Revenues – Articles 268 to 271</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="117" y="26" width="447" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Tax Revenues – Articles 268 to 271</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">A. Taxes Levied by the Centre but Collected and Appropriated by the States</tspan></text>
<text class="sh" x="40" y="114"><tspan class="r" style="font-weight:700">(Article 268):</tspan></text>
<text x="44" y="144"><tspan class="h" style="font-weight:700">Stamp duties (Art. 268):</tspan><tspan class="k"> This category includes the</tspan><tspan class="r"> stamp duties</tspan><tspan class="k"> on</tspan><tspan class="b"> bills of exchange,</tspan></text>
<text x="56" y="166"><tspan class="b">cheques, promissory notes, policies of insurance, transfer of shares</tspan><tspan class="k"> and others.</tspan></text>
<text x="44" y="194"><tspan class="h" style="font-weight:700">Outside Consolidated Fund of India:</tspan><tspan class="k"> The proceeds of these duties levied within any</tspan></text>
<text x="56" y="216"><tspan class="k">state</tspan><tspan class="r"> do not form a part of the Consolidated Fund of India</tspan><tspan class="k">, but are</tspan><tspan class="r"> assigned to that</tspan></text>
<text x="56" y="238"><tspan class="r">state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="131" y="250" width="108" height="30" rx="3"/>
<text class="sm" x="185" y="269" text-anchor="middle"><tspan class="k">levied:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="242" y1="265" x2="262" y2="265" marker-end="url(#ah)"/>
<rect class="bx" x="265" y="250" width="119" height="30" rx="3"/>
<text class="sm" x="324" y="269" text-anchor="middle"><tspan class="k">collected:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<line class="ln" x1="387" y1="265" x2="407" y2="265" marker-end="url(#ah)"/>
<rect class="bx" x="410" y="250" width="139" height="30" rx="3"/>
<text class="sm" x="479" y="269" text-anchor="middle"><tspan class="k">appropriated:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<text class="sh" x="40" y="308"><tspan class="r" style="font-weight:700">B. Taxes Levied and Collected by the Centre but Assigned to the States</tspan></text>
<text class="sh" x="40" y="328"><tspan class="r" style="font-weight:700">(Article 269):</tspan></text>
<text x="44" y="358"><tspan class="h" style="font-weight:700">Taxes assigned to states (Art. 269):</tspan><tspan class="k"> The following taxes fall under this category:</tspan></text>
<text x="56" y="384" class="r" style="font-weight:700">(i)</text>
<text x="89" y="384"><tspan class="h" style="font-weight:700">Inter-state sale tax:</tspan><tspan class="k"> Taxes on the</tspan><tspan class="r"> sale or purchase of goods</tspan><tspan class="k"> (</tspan><tspan class="b">other than</tspan></text>
<text x="89" y="406"><tspan class="b">newspapers</tspan><tspan class="k">) in the course of</tspan><tspan class="r"> inter-state trade or commerce</tspan><tspan class="k">.</tspan></text>
<text x="56" y="432" class="r" style="font-weight:700">(ii)</text>
<text x="89" y="432"><tspan class="h" style="font-weight:700">Consignment tax:</tspan><tspan class="k"> Taxes on the</tspan><tspan class="r"> consignment of goods</tspan><tspan class="k"> in the course of</tspan><tspan class="r"> inter-state</tspan></text>
<text x="89" y="454"><tspan class="r">trade or commerce</tspan><tspan class="k">.</tspan></text>
<path d="M50 364 L44 364 L44 460 L50 460" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="482"><tspan class="h" style="font-weight:700">Net proceeds assigned:</tspan><tspan class="k"> The net proceeds of these taxes</tspan><tspan class="r"> do not form a part of the</tspan></text>
<text x="56" y="504"><tspan class="r">Consolidated Fund of India</tspan><tspan class="k">. They are</tspan><tspan class="r"> assigned to the concerned states</tspan><tspan class="k"> in accordance</tspan></text>
<text x="56" y="526"><tspan class="k">with the principles laid down by the</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="135" y="538" width="108" height="30" rx="3"/>
<text class="sm" x="189" y="557" text-anchor="middle"><tspan class="k">levied:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="246" y1="553" x2="266" y2="553" marker-end="url(#ah)"/>
<rect class="bx" x="269" y="538" width="126" height="30" rx="3"/>
<text class="sm" x="332" y="557" text-anchor="middle"><tspan class="k">collected:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="398" y1="553" x2="418" y2="553" marker-end="url(#ah)"/>
<rect class="bx" x="421" y="538" width="123" height="30" rx="3"/>
<text class="sm" x="483" y="557" text-anchor="middle"><tspan class="k">assigned:</tspan><tspan class="r" style="font-weight:700"> States</tspan></text>
<text class="sh" x="40" y="596"><tspan class="r" style="font-weight:700">C. Levy and Collection of Goods and Services Tax in Course of Inter-State Trade</tspan></text>
<text class="sh" x="40" y="616"><tspan class="r" style="font-weight:700">or Commerce (Article 269-A):</tspan></text>
<text x="44" y="646"><tspan class="h" style="font-weight:700">IGST (Art. 269-A):</tspan><tspan class="k"> The</tspan><tspan class="r"> Goods and Services Tax (GST)</tspan><tspan class="k"> on supplies in the course of</tspan></text>
<text x="56" y="668"><tspan class="r">inter-state trade or commerce</tspan><tspan class="k"> are</tspan><tspan class="r"> levied and collected by the Centre</tspan><tspan class="k">. But, this tax is</tspan></text>
<text x="56" y="690"><tspan class="r">divided between the Centre and the States</tspan><tspan class="k"> in the manner provided by Parliament on the</tspan></text>
<text x="56" y="712"><tspan class="k">recommendations of the</tspan><tspan class="r"> GST Council</tspan><tspan class="k">. Further, the Parliament is also authorized to</tspan></text>
<text x="56" y="734"><tspan class="k">formulate the principles for determining the</tspan><tspan class="b"> place of supply</tspan><tspan class="k">, and when a supply of goods</tspan></text>
<text x="56" y="756"><tspan class="k">or services or both takes place in the course of inter-state trade or commerce.</tspan></text>
<rect class="bx" x="54" y="768" width="168" height="30" rx="3"/>
<text class="sm" x="138" y="787" text-anchor="middle"><tspan class="k">inter-state</tspan><tspan class="r"> GST (IGST)</tspan></text>
<line class="ln" x1="225" y1="783" x2="245" y2="783" marker-end="url(#ah)"/>
<rect class="bx" x="248" y="768" width="180" height="30" rx="3"/>
<text class="sm" x="338" y="787" text-anchor="middle"><tspan class="k">levied &amp; collected:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="431" y1="783" x2="451" y2="783" marker-end="url(#ah)"/>
<rect class="bx" x="454" y="768" width="172" height="30" rx="3"/>
<text class="sm" x="540" y="787" text-anchor="middle"><tspan class="k">divided:</tspan><tspan class="r" style="font-weight:700"> Centre + States</tspan></text>
<line class="ln" x1="340" y1="799" x2="340" y2="820" marker-end="url(#ah)"/>
<rect class="bx" x="270" y="822" width="140" height="30" rx="3"/>
<text class="sm" x="340" y="841" text-anchor="middle"><tspan class="b">as per GST Council</tspan></text>
<text class="sh" x="40" y="880"><tspan class="r" style="font-weight:700">D. Taxes Levied and Collected by the Centre but Distributed between the</tspan></text>
<text class="sh" x="40" y="900"><tspan class="r" style="font-weight:700">Centre and the States (Article 270):</tspan></text>
<text x="44" y="930"><tspan class="h" style="font-weight:700">Divisible pool (Art. 270):</tspan><tspan class="k"> This category includes</tspan><tspan class="r"> all taxes and duties referred to in the</tspan></text>
<text x="56" y="952"><tspan class="r">Union List except</tspan><tspan class="k"> the following:</tspan></text>
<text x="56" y="978" class="r" style="font-weight:700">(i)</text>
<text x="93" y="978"><tspan class="h" style="font-weight:700">Exclusion – Arts. 268, 269, 269-A:</tspan><tspan class="k"> Duties and taxes referred to in</tspan><tspan class="r"> Articles 268,</tspan></text>
<text x="93" y="1000"><tspan class="r">269 and 269-A</tspan><tspan class="k"> (mentioned above);</tspan></text>
<text x="56" y="1026" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1026"><tspan class="h" style="font-weight:700">Exclusion – surcharges:</tspan><tspan class="r"> Surcharge</tspan><tspan class="k"> on taxes and duties referred to in</tspan><tspan class="r"> Article 271</tspan></text>
<text x="93" y="1048"><tspan class="k">(mentioned below); and</tspan></text>
<text x="56" y="1074" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1074"><tspan class="h" style="font-weight:700">Exclusion – cesses:</tspan><tspan class="k"> Any</tspan><tspan class="r"> cess</tspan><tspan class="k"> levied for specific purposes.</tspan></text>
<path d="M50 958 L44 958 L44 1080 L50 1080" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1102"><tspan class="h" style="font-weight:700">Finance Commission formula:</tspan><tspan class="k"> The manner of distribution of the net proceeds of these</tspan></text>
<text x="56" y="1124"><tspan class="k">taxes and duties is prescribed by the</tspan><tspan class="r"> President</tspan><tspan class="k"> on the recommendation of the</tspan><tspan class="r"> Finance</tspan></text>
<text x="56" y="1146"><tspan class="r">Commission</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="125" y="1158" width="144" height="48" rx="3"/>
<text class="sm" x="197" y="1186" text-anchor="middle"><tspan class="k">all Union List taxes</tspan></text>
<line class="ln" x1="272" y1="1182" x2="292" y2="1182" marker-end="url(#ah)"/>
<rect class="bx" x="295" y="1158" width="260" height="48" rx="3"/>
<text class="sm" x="425" y="1177" text-anchor="middle"><tspan class="b">minus 268, 269, 269-A, surcharge,</tspan></text>
<text class="sm" x="425" y="1195" text-anchor="middle"><tspan class="b">cess</tspan></text>
<line class="ln" x1="340" y1="1207" x2="340" y2="1228" marker-end="url(#ah)"/>
<rect class="bx" x="224" y="1230" width="233" height="30" rx="3"/>
<text class="sm" x="340" y="1249" text-anchor="middle"><tspan class="k">shared as per</tspan><tspan class="r" style="font-weight:700"> Finance Commission</tspan></text>
<text class="sh" x="40" y="1288"><tspan class="r" style="font-weight:700">E. Surcharge on Certain Taxes and Duties for Purposes of the Centre (Article</tspan></text>
<text class="sh" x="40" y="1308"><tspan class="r" style="font-weight:700">271):</tspan></text>
<text x="44" y="1338"><tspan class="h" style="font-weight:700">Surcharges – Centre only (Art. 271):</tspan><tspan class="k"> The Parliament can at any time levy the</tspan></text>
<text x="56" y="1360"><tspan class="r">surcharges</tspan><tspan class="k"> on taxes and duties referred to in</tspan><tspan class="r"> Articles 269 and 270</tspan><tspan class="k"> (mentioned above).</tspan></text>
<text x="56" y="1382"><tspan class="k">The proceeds of such surcharges go to the</tspan><tspan class="r"> Centre exclusively</tspan><tspan class="k">. In other words, the</tspan><tspan class="b"> states</tspan></text>
<text x="56" y="1404"><tspan class="b">have no share</tspan><tspan class="k"> in these surcharges.</tspan></text>
<text x="44" y="1432"><tspan class="h" style="font-weight:700">GST outside surcharge:</tspan><tspan class="k"> However, the</tspan><tspan class="r"> Goods and Services Tax (GST) is exempted</tspan><tspan class="k"> from</tspan></text>
<text x="56" y="1454"><tspan class="k">this surcharge. In other words, this surcharge</tspan><tspan class="r"> can not be imposed on the GST</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="143" y="1466" width="151" height="30" rx="3"/>
<text class="sm" x="218" y="1485" text-anchor="middle"><tspan class="r">Surcharge</tspan><tspan class="k"> (Art. 271)</tspan></text>
<line class="ln" x1="296" y1="1481" x2="316" y2="1481" marker-end="url(#ah)"/>
<rect class="bx" x="319" y="1466" width="96" height="30" rx="3"/>
<text class="sm" x="367" y="1485" text-anchor="middle"><tspan class="r" style="font-weight:700">Centre only</tspan></text>
<line class="ln" x1="418" y1="1481" x2="438" y2="1481" marker-end="url(#ah)"/>
<rect class="bx" x="441" y="1466" width="96" height="30" rx="3"/>
<text class="sm" x="489" y="1485" text-anchor="middle"><tspan class="b">not on GST</tspan></text>
</svg>
</div></body></html>
