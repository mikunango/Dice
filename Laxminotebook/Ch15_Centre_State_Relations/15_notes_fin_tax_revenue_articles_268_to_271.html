<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution of Tax Revenues – Articles 268 to 271</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#73726c}
html,body{margin:0;padding:0;background:#ffffff}
#vis-container{max-width:680px;margin:0 auto;padding:12px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.n{display:block}
.n text{font-family:'Kalam',cursive;font-size:15px}.r{fill:#D93A3A}.b{fill:#2F6FDB}.k{fill:var(--text-primary)}.h{fill:#7A1F1F;text-decoration:underline}.hd{font-weight:700;font-size:17px!important}.sh{font-weight:700;font-size:16px!important}.ln{stroke:var(--text-secondary);stroke-width:1.2;fill:none}.lb{fill:var(--text-primary);font-weight:700;text-decoration:underline}.sm{font-size:14px!important}.xs{font-size:13px!important}.bx{fill:none;stroke:#D93A3A;stroke-width:1.2}.gx{fill:none;stroke:var(--text-secondary);stroke-width:1}
@media print{#vis-container{padding:0}}
</style></head><body>
<div id="vis-container"><h2 class="sr-only">Distribution of Tax Revenues – Articles 268 to 271</h2>
<svg class="n" width="100%" viewBox="0 0 680 1438" role="img"><title>Distribution of Tax Revenues – Articles 268 to 271</title><desc>Distribution of Tax Revenues – Articles 268 to 271</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="117" y="26" width="447" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Tax Revenues – Articles 268 to 271</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">A. Taxes Levied by the Centre but Collected and Appropriated by the States</tspan></text>
<text class="sh" x="40" y="114"><tspan class="r" style="font-weight:700">(Article 268):</tspan></text>
<text x="44" y="144"><tspan class="h" style="font-weight:700">Stamp duties:</tspan><tspan class="k"> This category includes the</tspan><tspan class="r"> stamp duties</tspan><tspan class="k"> on</tspan><tspan class="b"> bills of exchange, cheques,</tspan></text>
<text x="56" y="166"><tspan class="b">promissory notes, policies of insurance, transfer of shares</tspan><tspan class="k"> and others.</tspan></text>
<text x="44" y="194"><tspan class="h" style="font-weight:700">Assigned to state:</tspan><tspan class="k"> The proceeds of these duties levied within any state</tspan><tspan class="r"> do not form a</tspan></text>
<text x="56" y="216"><tspan class="r">part of the Consolidated Fund of India</tspan><tspan class="k">, but are</tspan><tspan class="r"> assigned to that state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="131" y="228" width="108" height="30" rx="3"/>
<text class="sm" x="185" y="247" text-anchor="middle"><tspan class="k">levied:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="242" y1="243" x2="262" y2="243" marker-end="url(#ah)"/>
<rect class="bx" x="265" y="228" width="119" height="30" rx="3"/>
<text class="sm" x="324" y="247" text-anchor="middle"><tspan class="k">collected:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<line class="ln" x1="387" y1="243" x2="407" y2="243" marker-end="url(#ah)"/>
<rect class="bx" x="410" y="228" width="139" height="30" rx="3"/>
<text class="sm" x="479" y="247" text-anchor="middle"><tspan class="k">appropriated:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<text class="sh" x="40" y="286"><tspan class="r" style="font-weight:700">B. Taxes Levied and Collected by the Centre but Assigned to the States</tspan></text>
<text class="sh" x="40" y="306"><tspan class="r" style="font-weight:700">(Article 269):</tspan></text>
<text x="44" y="336"><tspan class="h" style="font-weight:700">Art. 269 taxes:</tspan><tspan class="k"> The following taxes fall under this category:</tspan></text>
<text x="56" y="362" class="r" style="font-weight:700">(i)</text>
<text x="89" y="362"><tspan class="k">Taxes on the</tspan><tspan class="r"> sale or purchase of goods</tspan><tspan class="k"> (</tspan><tspan class="b">other than newspapers</tspan><tspan class="k">) in the course of</tspan></text>
<text x="89" y="384"><tspan class="r">inter-state trade or commerce</tspan><tspan class="k">.</tspan></text>
<text x="56" y="410" class="r" style="font-weight:700">(ii)</text>
<text x="89" y="410"><tspan class="k">Taxes on the</tspan><tspan class="r"> consignment of goods</tspan><tspan class="k"> in the course of</tspan><tspan class="r"> inter-state trade or</tspan></text>
<text x="89" y="432"><tspan class="r">commerce</tspan><tspan class="k">.</tspan></text>
<path d="M50 342 L44 342 L44 438 L50 438" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="460"><tspan class="h" style="font-weight:700">Not in CFI:</tspan><tspan class="k"> The net proceeds of these taxes</tspan><tspan class="r"> do not form a part of the Consolidated</tspan></text>
<text x="56" y="482"><tspan class="r">Fund of India</tspan><tspan class="k">. They are</tspan><tspan class="r"> assigned to the concerned states</tspan><tspan class="k"> in accordance with the</tspan></text>
<text x="56" y="504"><tspan class="k">principles laid down by the</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="135" y="516" width="108" height="30" rx="3"/>
<text class="sm" x="189" y="535" text-anchor="middle"><tspan class="k">levied:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="246" y1="531" x2="266" y2="531" marker-end="url(#ah)"/>
<rect class="bx" x="269" y="516" width="126" height="30" rx="3"/>
<text class="sm" x="332" y="535" text-anchor="middle"><tspan class="k">collected:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="398" y1="531" x2="418" y2="531" marker-end="url(#ah)"/>
<rect class="bx" x="421" y="516" width="123" height="30" rx="3"/>
<text class="sm" x="483" y="535" text-anchor="middle"><tspan class="k">assigned:</tspan><tspan class="r" style="font-weight:700"> States</tspan></text>
<text class="sh" x="40" y="574"><tspan class="r" style="font-weight:700">C. Levy and Collection of Goods and Services Tax in Course of Inter-State Trade</tspan></text>
<text class="sh" x="40" y="594"><tspan class="r" style="font-weight:700">or Commerce (Article 269-A):</tspan></text>
<text x="44" y="624"><tspan class="h" style="font-weight:700">Inter-state GST:</tspan><tspan class="k"> The</tspan><tspan class="r"> Goods and Services Tax (GST)</tspan><tspan class="k"> on supplies in the course of</tspan></text>
<text x="56" y="646"><tspan class="r">inter-state trade or commerce</tspan><tspan class="k"> are</tspan><tspan class="r"> levied and collected by the Centre</tspan><tspan class="k">. But, this tax is</tspan></text>
<text x="56" y="668"><tspan class="r">divided between the Centre and the States</tspan><tspan class="k"> in the manner provided by Parliament on the</tspan></text>
<text x="56" y="690"><tspan class="k">recommendations of the</tspan><tspan class="r"> GST Council</tspan><tspan class="k">. Further, the Parliament is also authorized to</tspan></text>
<text x="56" y="712"><tspan class="k">formulate the principles for determining the</tspan><tspan class="b"> place of supply</tspan><tspan class="k">, and when a supply of goods</tspan></text>
<text x="56" y="734"><tspan class="k">or services or both takes place in the course of inter-state trade or commerce.</tspan></text>
<rect class="bx" x="54" y="746" width="168" height="30" rx="3"/>
<text class="sm" x="138" y="765" text-anchor="middle"><tspan class="k">inter-state</tspan><tspan class="r"> GST (IGST)</tspan></text>
<line class="ln" x1="225" y1="761" x2="245" y2="761" marker-end="url(#ah)"/>
<rect class="bx" x="248" y="746" width="180" height="30" rx="3"/>
<text class="sm" x="338" y="765" text-anchor="middle"><tspan class="k">levied &amp; collected:</tspan><tspan class="r" style="font-weight:700"> Centre</tspan></text>
<line class="ln" x1="431" y1="761" x2="451" y2="761" marker-end="url(#ah)"/>
<rect class="bx" x="454" y="746" width="172" height="30" rx="3"/>
<text class="sm" x="540" y="765" text-anchor="middle"><tspan class="k">divided:</tspan><tspan class="r" style="font-weight:700"> Centre + States</tspan></text>
<line class="ln" x1="340" y1="777" x2="340" y2="798" marker-end="url(#ah)"/>
<rect class="bx" x="270" y="800" width="140" height="30" rx="3"/>
<text class="sm" x="340" y="819" text-anchor="middle"><tspan class="b">as per GST Council</tspan></text>
<text class="sh" x="40" y="858"><tspan class="r" style="font-weight:700">D. Taxes Levied and Collected by the Centre but Distributed between the</tspan></text>
<text class="sh" x="40" y="878"><tspan class="r" style="font-weight:700">Centre and the States (Article 270):</tspan></text>
<text x="44" y="908"><tspan class="h" style="font-weight:700">All Union List taxes:</tspan><tspan class="k"> This category includes</tspan><tspan class="r"> all taxes and duties referred to in the Union</tspan></text>
<text x="56" y="930"><tspan class="r">List except</tspan><tspan class="k"> the following:</tspan></text>
<text x="56" y="956" class="r" style="font-weight:700">(i)</text>
<text x="93" y="956"><tspan class="k">Duties and taxes referred to in</tspan><tspan class="r"> Articles 268, 269 and 269-A</tspan><tspan class="k"> (mentioned above);</tspan></text>
<text x="56" y="982" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="982"><tspan class="r">Surcharge</tspan><tspan class="k"> on taxes and duties referred to in</tspan><tspan class="r"> Article 271</tspan><tspan class="k"> (mentioned below); and</tspan></text>
<text x="56" y="1008" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1008"><tspan class="k">Any</tspan><tspan class="r"> cess</tspan><tspan class="k"> levied for specific purposes.</tspan></text>
<path d="M50 936 L44 936 L44 1014 L50 1014" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1036"><tspan class="h" style="font-weight:700">Finance Commission:</tspan><tspan class="k"> The manner of distribution of the net proceeds of these taxes and</tspan></text>
<text x="56" y="1058"><tspan class="k">duties is prescribed by the</tspan><tspan class="r"> President</tspan><tspan class="k"> on the recommendation of the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="125" y="1070" width="144" height="48" rx="3"/>
<text class="sm" x="197" y="1098" text-anchor="middle"><tspan class="k">all Union List taxes</tspan></text>
<line class="ln" x1="272" y1="1094" x2="292" y2="1094" marker-end="url(#ah)"/>
<rect class="bx" x="295" y="1070" width="260" height="48" rx="3"/>
<text class="sm" x="425" y="1089" text-anchor="middle"><tspan class="b">minus 268, 269, 269-A, surcharge,</tspan></text>
<text class="sm" x="425" y="1107" text-anchor="middle"><tspan class="b">cess</tspan></text>
<line class="ln" x1="340" y1="1119" x2="340" y2="1140" marker-end="url(#ah)"/>
<rect class="bx" x="224" y="1142" width="233" height="30" rx="3"/>
<text class="sm" x="340" y="1161" text-anchor="middle"><tspan class="k">shared as per</tspan><tspan class="r" style="font-weight:700"> Finance Commission</tspan></text>
<text class="sh" x="40" y="1200"><tspan class="r" style="font-weight:700">E. Surcharge on Certain Taxes and Duties for Purposes of the Centre (Article</tspan></text>
<text class="sh" x="40" y="1220"><tspan class="r" style="font-weight:700">271):</tspan></text>
<text x="44" y="1250"><tspan class="h" style="font-weight:700">Surcharge – Centre only:</tspan><tspan class="k"> The Parliament can at any time levy the</tspan><tspan class="r"> surcharges</tspan><tspan class="k"> on taxes</tspan></text>
<text x="56" y="1272"><tspan class="k">and duties referred to in</tspan><tspan class="r"> Articles 269 and 270</tspan><tspan class="k"> (mentioned above). The proceeds of such</tspan></text>
<text x="56" y="1294"><tspan class="k">surcharges go to the</tspan><tspan class="r"> Centre exclusively</tspan><tspan class="k">. In other words, the</tspan><tspan class="b"> states have no share</tspan><tspan class="k"> in</tspan></text>
<text x="56" y="1316"><tspan class="k">these surcharges.</tspan></text>
<text x="44" y="1344"><tspan class="h" style="font-weight:700">GST exempted:</tspan><tspan class="k"> However, the</tspan><tspan class="r"> Goods and Services Tax (GST) is exempted</tspan><tspan class="k"> from this</tspan></text>
<text x="56" y="1366"><tspan class="k">surcharge. In other words, this surcharge</tspan><tspan class="r"> can not be imposed on the GST</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="143" y="1378" width="151" height="30" rx="3"/>
<text class="sm" x="218" y="1397" text-anchor="middle"><tspan class="r">Surcharge</tspan><tspan class="k"> (Art. 271)</tspan></text>
<line class="ln" x1="296" y1="1393" x2="316" y2="1393" marker-end="url(#ah)"/>
<rect class="bx" x="319" y="1378" width="96" height="30" rx="3"/>
<text class="sm" x="367" y="1397" text-anchor="middle"><tspan class="r" style="font-weight:700">Centre only</tspan></text>
<line class="ln" x1="418" y1="1393" x2="438" y2="1393" marker-end="url(#ah)"/>
<rect class="bx" x="441" y="1378" width="96" height="30" rx="3"/>
<text class="sm" x="489" y="1397" text-anchor="middle"><tspan class="b">not on GST</tspan></text>
</svg>
</div></body></html>
