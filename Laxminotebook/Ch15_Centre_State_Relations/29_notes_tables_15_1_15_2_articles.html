<div id="vis-container"><h2 class="sr-only">Articles at a Glance – Legislative and Administrative</h2>
<svg class="n" width="100%" viewBox="0 0 680 1120" role="img"><title>Articles at a Glance – Legislative and Administrative</title><desc>Articles at a Glance – Legislative and Administrative</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="108" y="26" width="465" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Articles at a Glance – Legislative and Administrative</text>
<text x="40" y="96"><tspan class="r" style="font-weight:700">Table 15.1 Articles Related to Centre-State Legislative Relations at a Glance</tspan></text>
<text class="sm" x="95" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Article No.</tspan></text>
<text class="sm" x="395" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Subject Matter</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<text class="sm" x="47" y="157"><tspan class="r">245.</tspan></text>
<text class="sm" x="157" y="157"><tspan class="k">Extent of laws made by Parliament and by the legislatures of states</tspan></text>
<line class="gx" x1="40" y1="168" x2="640" y2="168"/>
<text class="sm" x="47" y="188"><tspan class="r">246.</tspan></text>
<text class="sm" x="157" y="188"><tspan class="k">Subject-matter of laws made by Parliament and by the legislatures of</tspan></text>
<text class="sm" x="157" y="207"><tspan class="k">states</tspan></text>
<line class="gx" x1="40" y1="218" x2="640" y2="218"/>
<text class="sm" x="47" y="238"><tspan class="r">246A.</tspan></text>
<text class="sm" x="157" y="238"><tspan class="k">Special provision with respect to goods and services tax</tspan></text>
<line class="gx" x1="40" y1="249" x2="640" y2="249"/>
<text class="sm" x="47" y="269"><tspan class="r">247.</tspan></text>
<text class="sm" x="157" y="269"><tspan class="k">Power of Parliament to provide for the establishment of certain additional</tspan></text>
<text class="sm" x="157" y="288"><tspan class="k">courts</tspan></text>
<line class="gx" x1="40" y1="299" x2="640" y2="299"/>
<text class="sm" x="47" y="319"><tspan class="r">248.</tspan></text>
<text class="sm" x="157" y="319"><tspan class="k">Residuary powers of legislation</tspan></text>
<line class="gx" x1="40" y1="330" x2="640" y2="330"/>
<text class="sm" x="47" y="350"><tspan class="r">249.</tspan></text>
<text class="sm" x="157" y="350"><tspan class="k">Power of Parliament to legislate with respect to a matter in the state list</tspan></text>
<text class="sm" x="157" y="369"><tspan class="k">in the national interest</tspan></text>
<line class="gx" x1="40" y1="380" x2="640" y2="380"/>
<text class="sm" x="47" y="400"><tspan class="r">250.</tspan></text>
<text class="sm" x="157" y="400"><tspan class="k">Power of Parliament to legislate with respect to any matter in the state list</tspan></text>
<text class="sm" x="157" y="419"><tspan class="k">if a Proclamation of Emergency is in operation</tspan></text>
<line class="gx" x1="40" y1="430" x2="640" y2="430"/>
<text class="sm" x="47" y="450"><tspan class="r">251.</tspan></text>
<text class="sm" x="157" y="450"><tspan class="k">Inconsistency between laws made by Parliament under articles 249 and 250</tspan></text>
<text class="sm" x="157" y="469"><tspan class="k">and laws made by the legislatures of states</tspan></text>
<line class="gx" x1="40" y1="480" x2="640" y2="480"/>
<text class="sm" x="47" y="500"><tspan class="r">252.</tspan></text>
<text class="sm" x="157" y="500"><tspan class="k">Power of Parliament to legislate for two or more states by consent and</tspan></text>
<text class="sm" x="157" y="519"><tspan class="k">adoption of such legislation by any other state</tspan></text>
<line class="gx" x1="40" y1="530" x2="640" y2="530"/>
<text class="sm" x="47" y="550"><tspan class="r">253.</tspan></text>
<text class="sm" x="157" y="550"><tspan class="k">Legislation for giving effect to international agreements</tspan></text>
<line class="gx" x1="40" y1="561" x2="640" y2="561"/>
<text class="sm" x="47" y="581"><tspan class="r">254.</tspan></text>
<text class="sm" x="157" y="581"><tspan class="k">Inconsistency between laws made by Parliament and laws made by the</tspan></text>
<text class="sm" x="157" y="600"><tspan class="k">legislatures of states</tspan></text>
<line class="gx" x1="40" y1="611" x2="640" y2="611"/>
<text class="sm" x="47" y="631"><tspan class="r">255.</tspan></text>
<text class="sm" x="157" y="631"><tspan class="k">Requirements as to recommendations and previous sanctions to be regarded</tspan></text>
<text class="sm" x="157" y="650"><tspan class="k">as matters of procedure only</tspan></text>
<line class="gx" x1="40" y1="661" x2="640" y2="661"/>
<rect class="gx" x="40" y="106" width="600" height="555"/>

<text x="40" y="701"><tspan class="r" style="font-weight:700">Table 15.2 Articles Related to Centre-State Administrative Relations at a Glance</tspan></text>
<text class="sm" x="95" y="731" text-anchor="middle"><tspan class="r" style="font-weight:700">Article No.</tspan></text>
<text class="sm" x="395" y="731" text-anchor="middle"><tspan class="r" style="font-weight:700">Subject Matter</tspan></text>
<line class="gx" x1="40" y1="742" x2="640" y2="742"/>
<text class="sm" x="47" y="762"><tspan class="r">256.</tspan></text>
<text class="sm" x="157" y="762"><tspan class="k">Obligation of states and the Union</tspan></text>
<line class="gx" x1="40" y1="773" x2="640" y2="773"/>
<text class="sm" x="47" y="793"><tspan class="r">257.</tspan></text>
<text class="sm" x="157" y="793"><tspan class="k">Control of the Union over states in certain cases</tspan></text>
<line class="gx" x1="40" y1="804" x2="640" y2="804"/>
<text class="sm" x="47" y="824"><tspan class="r">257A.</tspan></text>
<text class="sm" x="157" y="824"><tspan class="k">Assistance to states by deployment of armed forces or other forces of the</tspan></text>
<text class="sm" x="157" y="843"><tspan class="k">Union</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="854" x2="640" y2="854"/>
<text class="sm" x="47" y="874"><tspan class="r">258.</tspan></text>
<text class="sm" x="157" y="874"><tspan class="k">Power of the Union to confer powers, etc., on states in certain cases</tspan></text>
<line class="gx" x1="40" y1="885" x2="640" y2="885"/>
<text class="sm" x="47" y="905"><tspan class="r">258A.</tspan></text>
<text class="sm" x="157" y="905"><tspan class="k">Power of the states to entrust functions to the Union</tspan></text>
<line class="gx" x1="40" y1="916" x2="640" y2="916"/>
<text class="sm" x="47" y="936"><tspan class="r">259.</tspan></text>
<text class="sm" x="157" y="936"><tspan class="k">Armed Forces in states in Part B of the First Schedule</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="947" x2="640" y2="947"/>
<text class="sm" x="47" y="967"><tspan class="r">260.</tspan></text>
<text class="sm" x="157" y="967"><tspan class="k">Jurisdiction of the Union in relation to territories outside India</tspan></text>
<line class="gx" x1="40" y1="978" x2="640" y2="978"/>
<text class="sm" x="47" y="998"><tspan class="r">261.</tspan></text>
<text class="sm" x="157" y="998"><tspan class="k">Public acts, records and judicial proceedings</tspan></text>
<line class="gx" x1="40" y1="1009" x2="640" y2="1009"/>
<text class="sm" x="47" y="1029"><tspan class="r">262.</tspan></text>
<text class="sm" x="157" y="1029"><tspan class="k">Adjudication of disputes relating to waters of inter-state rivers or river</tspan></text>
<text class="sm" x="157" y="1048"><tspan class="k">valleys</tspan></text>
<line class="gx" x1="40" y1="1059" x2="640" y2="1059"/>
<text class="sm" x="47" y="1079"><tspan class="r">263.</tspan></text>
<text class="sm" x="157" y="1079"><tspan class="k">Provisions with respect to an inter-state Council</tspan></text>
