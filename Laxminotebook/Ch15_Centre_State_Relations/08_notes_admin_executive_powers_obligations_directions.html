<title>Administrative Relations – I</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">

<div id="vis-container"><h2 class="sr-only">Administrative Relations – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1792" role="img"><title>Administrative Relations – I</title><desc>Administrative Relations – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="203" y="26" width="274" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – I</text>
<text class="r hd" x="40" y="100">ADMINISTRATIVE RELATIONS</text>
<line x1="40" y1="106" x2="260" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="132" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="132"><tspan class="r">Articles 256 to 263</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XI</tspan><tspan class="k"> of the Constitution deal with the</tspan><tspan class="b"> administrative</tspan></text>
<text x="58" y="154"><tspan class="b">relations</tspan><tspan class="k"> between the Centre and the states.</tspan></text>
<text x="44" y="180" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="180"><tspan class="k">In addition, there are various other articles pertaining to the same matter.</tspan></text>
<text class="lb" x="40" y="212">1. Distribution of Executive Powers</text>
<text x="44" y="240" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="240"><tspan class="k">The</tspan><tspan class="r"> executive power</tspan><tspan class="k"> has been divided between the Centre and the states on the lines</tspan></text>
<text x="58" y="262"><tspan class="k">of the</tspan><tspan class="b"> distribution of legislative powers</tspan><tspan class="k">, except in few cases.</tspan></text>
<text x="44" y="288" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="288"><tspan class="k">Thus, the executive power of the</tspan><tspan class="r"> Centre</tspan><tspan class="k"> extends to the</tspan><tspan class="r"> whole of India</tspan><tspan class="k">:</tspan></text>
<text x="70" y="314" class="r" style="font-weight:700">(i)</text>
<text x="103" y="314"><tspan class="k">to the matters on which the Parliament has exclusive power of legislation (</tspan><tspan class="b">i.e.,</tspan></text>
<text x="103" y="336"><tspan class="b">the subjects enumerated in the Union List</tspan><tspan class="k">); and</tspan></text>
<text x="70" y="362" class="r" style="font-weight:700">(ii)</text>
<text x="103" y="362"><tspan class="k">to the exercise of rights, authority and jurisdiction conferred on it by any</tspan><tspan class="r"> treaty</tspan></text>
<text x="103" y="384"><tspan class="r">or agreement</tspan><tspan class="k">.</tspan></text>
<path d="M64 294 L58 294 L58 390 L64 390" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="410" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="410"><tspan class="k">Similarly, the executive power of a</tspan><tspan class="r"> state</tspan><tspan class="k"> extends to its territory in respect of matters</tspan></text>
<text x="58" y="432"><tspan class="k">on which the state legislature has exclusive power of legislation (</tspan><tspan class="b">i.e., the subjects</tspan></text>
<text x="58" y="454"><tspan class="b">enumerated in the State List</tspan><tspan class="k">).</tspan></text>
<text x="44" y="480" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="480"><tspan class="k">In respect of matters on which both the Parliament and the state legislatures have</tspan></text>
<text x="58" y="502"><tspan class="k">power of legislation (</tspan><tspan class="b">i.e., the subjects enumerated in the Concurrent List</tspan><tspan class="k">), the</tspan></text>
<text x="58" y="524"><tspan class="k">executive power</tspan><tspan class="r"> rests with the states</tspan><tspan class="k"> except when a</tspan><tspan class="b"> Constitutional provision or a</tspan></text>
<text x="58" y="546"><tspan class="b">parliamentary law</tspan><tspan class="k"> specifically confers it on the Centre.</tspan></text>
<text x="44" y="572" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="572"><tspan class="k">Therefore, a law on a concurrent subject, though enacted by the Parliament, is to be</tspan></text>
<text x="58" y="594"><tspan class="r">executed by the states</tspan><tspan class="k"> except when the Constitution or the Parliament has directed</tspan></text>
<text x="58" y="616"><tspan class="k">otherwise.⁵</tspan></text>
<rect class="bx" x="46" y="630" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="648" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="658" x2="140" y2="672" marker-end="url(#ah)"/>
<text class="sm" x="140" y="693" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> Centre</tspan></text>
<text class="sm" x="140" y="715" text-anchor="middle"><tspan class="b">+ treaties / agreements</tspan></text>
<rect class="bx" x="246" y="630" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="648" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="658" x2="340" y2="672" marker-end="url(#ah)"/>
<text class="sm" x="340" y="693" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> State</tspan></text>
<line x1="240" y1="630" x2="240" y2="718" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="630" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="648" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="658" x2="540" y2="672" marker-end="url(#ah)"/>
<text class="sm" x="540" y="693" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> States</tspan></text>
<text class="sm" x="540" y="715" text-anchor="middle"><tspan class="b">unless Constitution /</tspan></text>
<text class="sm" x="540" y="734" text-anchor="middle"><tspan class="b">Parliament says Centre</tspan></text>
<line x1="440" y1="630" x2="440" y2="737" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="775">2. Obligation of States and the Centre</text>
<text x="44" y="803" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="803"><tspan class="k">The Constitution has placed</tspan><tspan class="r"> two restrictions</tspan><tspan class="k"> on the executive power of the states in</tspan></text>
<text x="58" y="825"><tspan class="k">order to give ample scope to the Centre for exercising its executive power in an</tspan></text>
<text x="58" y="847"><tspan class="b">unrestricted manner</tspan><tspan class="k">.</tspan></text>
<text x="44" y="873" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="873"><tspan class="k">Thus, the executive power of every state is to be exercised in such a way (a) as to</tspan></text>
<text x="58" y="895"><tspan class="r">ensure compliance with the laws made by the Parliament</tspan><tspan class="k"> and any existing law which</tspan></text>
<text x="58" y="917"><tspan class="k">apply in the state; and (b) as</tspan><tspan class="r"> not to impede or prejudice</tspan><tspan class="k"> the exercise of executive</tspan></text>
<text x="58" y="939"><tspan class="k">power of the Centre in the state.</tspan></text>
<text x="44" y="965" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="965"><tspan class="k">While the former lays down a</tspan><tspan class="b"> general obligation</tspan><tspan class="k"> upon the state, the latter imposes a</tspan></text>
<text x="58" y="987"><tspan class="b">specific obligation</tspan><tspan class="k"> on the state not to hamper the executive power of the Centre.</tspan></text>
<rect class="bx" x="40" y="999" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="188" y="1019" text-anchor="middle"><tspan class="r" style="font-weight:700">(a) general obligation</tspan></text>
<text class="sm" x="188" y="1037" text-anchor="middle"><tspan class="k">comply with laws of Parliament + existing</tspan></text>
<text class="sm" x="188" y="1055" text-anchor="middle"><tspan class="k">laws</tspan></text>
<rect class="bx" x="345" y="999" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="1019" text-anchor="middle"><tspan class="r" style="font-weight:700">(b) specific obligation</tspan></text>
<text class="sm" x="492" y="1037" text-anchor="middle"><tspan class="k">not impede / prejudice Centre’s executive</tspan></text>
<text class="sm" x="492" y="1055" text-anchor="middle"><tspan class="k">power</tspan></text>
<text x="44" y="1093" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1093"><tspan class="k">In both the cases, the executive power of the Centre extends to giving of such</tspan></text>
<text x="58" y="1115"><tspan class="r">directions</tspan><tspan class="k"> to the state as are necessary for the purpose.</tspan></text>
<text x="44" y="1141" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1141"><tspan class="k">The sanction behind these directions of the Centre is</tspan><tspan class="r"> coercive</tspan><tspan class="k"> in nature.</tspan></text>
<text x="44" y="1167" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1167"><tspan class="k">Thus,</tspan><tspan class="r"> Article 365</tspan><tspan class="k"> says that where any state has</tspan><tspan class="b"> failed to comply with (or to give</tspan></text>
<text x="58" y="1189"><tspan class="b">effect to) any directions</tspan><tspan class="k"> given by the Centre, it will be lawful for the President to</tspan></text>
<text x="58" y="1211"><tspan class="k">hold that a situation has arisen in which the government of the state cannot be</tspan></text>
<text x="58" y="1233"><tspan class="k">carried on in accordance with the provisions of the Constitution.</tspan></text>
<text x="44" y="1259" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1259"><tspan class="k">It means that, in such a situation, the</tspan><tspan class="r"> President’s rule</tspan><tspan class="k"> can be imposed in the state</tspan></text>
<text x="58" y="1281"><tspan class="k">under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="117" y="1293" width="162" height="30" rx="3"/>
<text class="sm" x="198" y="1312" text-anchor="middle"><tspan class="k">Centre gives</tspan><tspan class="r"> directions</tspan></text>
<line class="ln" x1="282" y1="1308" x2="302" y2="1308" marker-end="url(#ah)"/>
<rect class="bx" x="305" y="1293" width="153" height="30" rx="3"/>
<text class="sm" x="382" y="1312" text-anchor="middle"><tspan class="k">State fails to comply</tspan></text>
<line class="ln" x1="461" y1="1308" x2="481" y2="1308" marker-end="url(#ah)"/>
<rect class="bx" x="484" y="1293" width="79" height="30" rx="3"/>
<text class="sm" x="523" y="1312" text-anchor="middle"><tspan class="r">Art. 365</tspan></text>
<line class="ln" x1="340" y1="1324" x2="340" y2="1345" marker-end="url(#ah)"/>
<rect class="bx" x="246" y="1347" width="189" height="30" rx="3"/>
<text class="sm" x="340" y="1366" text-anchor="middle"><tspan class="r" style="font-weight:700">President’s rule (Art. 356)</tspan></text>
<text class="lb" x="40" y="1409">3. Centre’s Directions to the States</text>
<text x="44" y="1437" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1437"><tspan class="k">In addition to the above two cases, the Centre is empowered to give</tspan><tspan class="r"> directions</tspan><tspan class="k"> to the</tspan></text>
<text x="58" y="1459"><tspan class="k">states with regard to the exercise of their executive power in the following matters:</tspan></text>
<text x="56" y="1485" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1485"><tspan class="k">the construction and maintenance of</tspan><tspan class="r"> means of communication</tspan><tspan class="k"> (</tspan><tspan class="b">declared to be of</tspan></text>
<text x="93" y="1507"><tspan class="b">national or military importance</tspan><tspan class="k">) by the state;</tspan></text>
<text x="56" y="1533" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1533"><tspan class="k">the measures to be taken for the</tspan><tspan class="r"> protection of the railways</tspan><tspan class="k"> within the state;</tspan></text>
<text x="56" y="1559" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1559"><tspan class="k">the provision of adequate facilities for</tspan><tspan class="r"> instruction in the mother-tongue</tspan><tspan class="k"> at the</tspan></text>
<text x="93" y="1581"><tspan class="b">primary stage of education</tspan><tspan class="k"> to children belonging to</tspan><tspan class="r"> linguistic minority groups</tspan><tspan class="k"> in</tspan></text>
<text x="93" y="1603"><tspan class="k">the state; and</tspan></text>
<text x="56" y="1629" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1629"><tspan class="k">the drawing up and execution of the specified schemes for the</tspan><tspan class="r"> welfare of the</tspan></text>
<text x="93" y="1651"><tspan class="r">Scheduled Tribes</tspan><tspan class="k"> in the state.</tspan></text>
<path d="M50 1465 L44 1465 L44 1657 L50 1657" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1677" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1677"><tspan class="k">The</tspan><tspan class="r"> coercive sanction</tspan><tspan class="k"> behind the Central directions under</tspan><tspan class="r"> Article 365</tspan><tspan class="k"> (mentioned</tspan></text>
<text x="58" y="1699"><tspan class="k">above) is also applicable in these cases.</tspan></text>
<text class="xs" x="50" y="1735"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> For example, under the Essential Commodities Act, made by the Parliament on a concurrent</tspan></text>
<text class="xs" x="50" y="1753"><tspan class="k">subject, the executive power is vested in the Centre.</tspan></text>
<rect x="40" y="1713" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
