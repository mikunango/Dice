<title>Administrative Relations – I</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>

<div id="vis-container"><h2 class="sr-only">Administrative Relations – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1840" role="img"><title>Administrative Relations – I</title><desc>Administrative Relations – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="203" y="26" width="274" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – I</text>
<text class="r hd" x="40" y="100">ADMINISTRATIVE RELATIONS</text>
<line x1="40" y1="106" x2="260" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Constitutional basis (Arts. 256–263):</tspan><tspan class="r"> Articles 256 to 263</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XI</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="156"><tspan class="k">Constitution deal with the</tspan><tspan class="b"> administrative relations</tspan><tspan class="k"> between the Centre and the states. In</tspan></text>
<text x="56" y="178"><tspan class="k">addition, there are various other articles pertaining to the same matter.</tspan></text>
<text class="lb" x="40" y="210">1. Distribution of Executive Powers</text>
<text x="44" y="240"><tspan class="h" style="font-weight:700">Executive follows legislative domain:</tspan><tspan class="k"> The</tspan><tspan class="r"> executive power</tspan><tspan class="k"> has been divided between the</tspan></text>
<text x="56" y="262"><tspan class="k">Centre and the states on the lines of the</tspan><tspan class="b"> distribution of legislative powers</tspan><tspan class="k">, except in few</tspan></text>
<text x="56" y="284"><tspan class="k">cases.</tspan></text>
<text x="56" y="308"><tspan class="k">Thus, the executive power of the</tspan><tspan class="r"> Centre</tspan><tspan class="k"> extends to the</tspan><tspan class="r"> whole of India</tspan><tspan class="k">:</tspan></text>
<text x="70" y="334" class="r" style="font-weight:700">(i)</text>
<text x="103" y="334"><tspan class="h" style="font-weight:700">Union executive – Union List:</tspan><tspan class="k"> to the matters on which the Parliament has</tspan></text>
<text x="103" y="356"><tspan class="k">exclusive power of legislation (</tspan><tspan class="b">i.e., the subjects enumerated in the Union List</tspan><tspan class="k">);</tspan></text>
<text x="103" y="378"><tspan class="k">and</tspan></text>
<text x="70" y="404" class="r" style="font-weight:700">(ii)</text>
<text x="103" y="404"><tspan class="h" style="font-weight:700">Union executive – treaties:</tspan><tspan class="k"> to the exercise of rights, authority and jurisdiction</tspan></text>
<text x="103" y="426"><tspan class="k">conferred on it by any</tspan><tspan class="r"> treaty or agreement</tspan><tspan class="k">.</tspan></text>
<path d="M64 314 L58 314 L58 432 L64 432" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="56" y="450"><tspan class="k">Similarly, the executive power of a</tspan><tspan class="r"> state</tspan><tspan class="k"> extends to its territory in respect of matters</tspan></text>
<text x="56" y="472"><tspan class="k">on which the state legislature has exclusive power of legislation (</tspan><tspan class="b">i.e., the subjects</tspan></text>
<text x="56" y="494"><tspan class="b">enumerated in the State List</tspan><tspan class="k">).</tspan></text>
<text x="44" y="522"><tspan class="h" style="font-weight:700">Concurrent subjects – executed by states:</tspan><tspan class="k"> In respect of matters on which both the</tspan></text>
<text x="56" y="544"><tspan class="k">Parliament and the state legislatures have power of legislation (</tspan><tspan class="b">i.e., the subjects</tspan></text>
<text x="56" y="566"><tspan class="b">enumerated in the Concurrent List</tspan><tspan class="k">), the executive power</tspan><tspan class="r"> rests with the states</tspan><tspan class="k"> except</tspan></text>
<text x="56" y="588"><tspan class="k">when a</tspan><tspan class="b"> Constitutional provision or a parliamentary law</tspan><tspan class="k"> specifically confers it on the</tspan></text>
<text x="56" y="610"><tspan class="k">Centre. Therefore, a law on a concurrent subject, though enacted by the Parliament, is to</tspan></text>
<text x="56" y="632"><tspan class="k">be</tspan><tspan class="r"> executed by the states</tspan><tspan class="k"> except when the Constitution or the Parliament has directed</tspan></text>
<text x="56" y="654"><tspan class="k">otherwise.⁵</tspan></text>
<rect class="bx" x="46" y="668" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="686" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="696" x2="140" y2="710" marker-end="url(#ah)"/>
<text class="sm" x="140" y="731" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> Centre</tspan></text>
<text class="sm" x="140" y="753" text-anchor="middle"><tspan class="b">+ treaties / agreements</tspan></text>
<rect class="bx" x="246" y="668" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="686" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="696" x2="340" y2="710" marker-end="url(#ah)"/>
<text class="sm" x="340" y="731" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> State</tspan></text>
<line x1="240" y1="668" x2="240" y2="756" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="668" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="686" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="696" x2="540" y2="710" marker-end="url(#ah)"/>
<text class="sm" x="540" y="731" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> States</tspan></text>
<text class="sm" x="540" y="753" text-anchor="middle"><tspan class="b">unless Constitution /</tspan></text>
<text class="sm" x="540" y="772" text-anchor="middle"><tspan class="b">Parliament says Centre</tspan></text>
<line x1="440" y1="668" x2="440" y2="775" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="813">2. Obligation of States and the Centre</text>
<text x="44" y="843"><tspan class="h" style="font-weight:700">Duty to comply &amp; not impede (Arts. 256–257):</tspan><tspan class="k"> The Constitution has placed</tspan><tspan class="r"> two</tspan></text>
<text x="56" y="865"><tspan class="r">restrictions</tspan><tspan class="k"> on the executive power of the states in order to give ample scope to the</tspan></text>
<text x="56" y="887"><tspan class="k">Centre for exercising its executive power in an</tspan><tspan class="b"> unrestricted manner</tspan><tspan class="k">. Thus, the executive</tspan></text>
<text x="56" y="909"><tspan class="k">power of every state is to be exercised in such a way (a) as to</tspan><tspan class="r"> ensure compliance with</tspan></text>
<text x="56" y="931"><tspan class="r">the laws made by the Parliament</tspan><tspan class="k"> and any existing law which apply in the state; and (b)</tspan></text>
<text x="56" y="953"><tspan class="k">as</tspan><tspan class="r"> not to impede or prejudice</tspan><tspan class="k"> the exercise of executive power of the Centre in the state.</tspan></text>
<text x="56" y="975"><tspan class="k">While the former lays down a</tspan><tspan class="b"> general obligation</tspan><tspan class="k"> upon the state, the latter imposes a</tspan></text>
<text x="56" y="997"><tspan class="b">specific obligation</tspan><tspan class="k"> on the state not to hamper the executive power of the Centre.</tspan></text>
<rect class="bx" x="40" y="1009" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="188" y="1029" text-anchor="middle"><tspan class="r" style="font-weight:700">(a) general obligation</tspan></text>
<text class="sm" x="188" y="1047" text-anchor="middle"><tspan class="k">comply with laws of Parliament + existing</tspan></text>
<text class="sm" x="188" y="1065" text-anchor="middle"><tspan class="k">laws</tspan></text>
<rect class="bx" x="345" y="1009" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="1029" text-anchor="middle"><tspan class="r" style="font-weight:700">(b) specific obligation</tspan></text>
<text class="sm" x="492" y="1047" text-anchor="middle"><tspan class="k">not impede / prejudice Centre’s executive</tspan></text>
<text class="sm" x="492" y="1065" text-anchor="middle"><tspan class="k">power</tspan></text>
<text x="44" y="1105"><tspan class="h" style="font-weight:700">Coercive sanction (Art. 365):</tspan><tspan class="k"> In both the cases, the executive power of the Centre</tspan></text>
<text x="56" y="1127"><tspan class="k">extends to giving of such</tspan><tspan class="r"> directions</tspan><tspan class="k"> to the state as are necessary for the purpose. The</tspan></text>
<text x="56" y="1149"><tspan class="k">sanction behind these directions of the Centre is</tspan><tspan class="r"> coercive</tspan><tspan class="k"> in nature. Thus,</tspan><tspan class="r"> Article 365</tspan></text>
<text x="56" y="1171"><tspan class="k">says that where any state has</tspan><tspan class="b"> failed to comply with (or to give effect to) any directions</tspan></text>
<text x="56" y="1193"><tspan class="k">given by the Centre, it will be lawful for the President to hold that a situation has</tspan></text>
<text x="56" y="1215"><tspan class="k">arisen in which the government of the state cannot be carried on in accordance with the</tspan></text>
<text x="56" y="1237"><tspan class="k">provisions of the Constitution. It means that, in such a situation, the</tspan><tspan class="r"> President’s rule</tspan></text>
<text x="56" y="1259"><tspan class="k">can be imposed in the state under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="117" y="1271" width="162" height="30" rx="3"/>
<text class="sm" x="198" y="1290" text-anchor="middle"><tspan class="k">Centre gives</tspan><tspan class="r"> directions</tspan></text>
<line class="ln" x1="282" y1="1286" x2="302" y2="1286" marker-end="url(#ah)"/>
<rect class="bx" x="305" y="1271" width="153" height="30" rx="3"/>
<text class="sm" x="382" y="1290" text-anchor="middle"><tspan class="k">State fails to comply</tspan></text>
<line class="ln" x1="461" y1="1286" x2="481" y2="1286" marker-end="url(#ah)"/>
<rect class="bx" x="484" y="1271" width="79" height="30" rx="3"/>
<text class="sm" x="523" y="1290" text-anchor="middle"><tspan class="r">Art. 365</tspan></text>
<line class="ln" x1="340" y1="1302" x2="340" y2="1323" marker-end="url(#ah)"/>
<rect class="bx" x="246" y="1325" width="189" height="30" rx="3"/>
<text class="sm" x="340" y="1344" text-anchor="middle"><tspan class="r" style="font-weight:700">President’s rule (Art. 356)</tspan></text>
<text class="lb" x="40" y="1387">3. Centre’s Directions to the States</text>
<text x="44" y="1417"><tspan class="h" style="font-weight:700">Centre’s directions to states:</tspan><tspan class="k"> In addition to the above two cases, the Centre is</tspan></text>
<text x="56" y="1439"><tspan class="k">empowered to give</tspan><tspan class="r"> directions</tspan><tspan class="k"> to the states with regard to the exercise of their executive</tspan></text>
<text x="56" y="1461"><tspan class="k">power in the following matters:</tspan></text>
<text x="56" y="1487" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1487"><tspan class="h" style="font-weight:700">Communications of national/military importance:</tspan><tspan class="k"> the construction and</tspan></text>
<text x="93" y="1509"><tspan class="k">maintenance of</tspan><tspan class="r"> means of communication</tspan><tspan class="k"> (</tspan><tspan class="b">declared to be of national or military</tspan></text>
<text x="93" y="1531"><tspan class="b">importance</tspan><tspan class="k">) by the state;</tspan></text>
<text x="56" y="1557" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1557"><tspan class="h" style="font-weight:700">Protection of railways:</tspan><tspan class="k"> the measures to be taken for the</tspan><tspan class="r"> protection of the</tspan></text>
<text x="93" y="1579"><tspan class="r">railways</tspan><tspan class="k"> within the state;</tspan></text>
<text x="56" y="1605" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1605"><tspan class="h" style="font-weight:700">Mother-tongue instruction – linguistic minorities:</tspan><tspan class="k"> the provision of adequate</tspan></text>
<text x="93" y="1627"><tspan class="k">facilities for</tspan><tspan class="r"> instruction in the mother-tongue</tspan><tspan class="k"> at the</tspan><tspan class="b"> primary stage of education</tspan></text>
<text x="93" y="1649"><tspan class="k">to children belonging to</tspan><tspan class="r"> linguistic minority groups</tspan><tspan class="k"> in the state; and</tspan></text>
<text x="56" y="1675" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1675"><tspan class="h" style="font-weight:700">Welfare of Scheduled Tribes:</tspan><tspan class="k"> the drawing up and execution of the specified</tspan></text>
<text x="93" y="1697"><tspan class="k">schemes for the</tspan><tspan class="r"> welfare of the Scheduled Tribes</tspan><tspan class="k"> in the state.</tspan></text>
<path d="M50 1467 L44 1467 L44 1703 L50 1703" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1725"><tspan class="h" style="font-weight:700">Art. 365 applies to all directions:</tspan><tspan class="k"> The</tspan><tspan class="r"> coercive sanction</tspan><tspan class="k"> behind the Central directions</tspan></text>
<text x="56" y="1747"><tspan class="k">under</tspan><tspan class="r"> Article 365</tspan><tspan class="k"> (mentioned above) is also applicable in these cases.</tspan></text>
<text class="xs" x="50" y="1783"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> For example, under the Essential Commodities Act, made by the Parliament on a concurrent</tspan></text>
<text class="xs" x="50" y="1801"><tspan class="k">subject, the executive power is vested in the Centre.</tspan></text>
<rect x="40" y="1761" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
