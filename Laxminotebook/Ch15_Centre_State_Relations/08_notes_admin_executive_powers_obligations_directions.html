<title>Administrative Relations – I</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>

<div id="vis-container"><h2 class="sr-only">Administrative Relations – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1730" role="img"><title>Administrative Relations – I</title><desc>Administrative Relations – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="203" y="26" width="274" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – I</text>
<text class="r hd" x="40" y="100">ADMINISTRATIVE RELATIONS</text>
<line x1="40" y1="106" x2="260" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Arts. 256–263, Part XI:</tspan><tspan class="r"> Articles 256 to 263</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XI</tspan><tspan class="k"> of the Constitution deal with</tspan></text>
<text x="56" y="156"><tspan class="k">the</tspan><tspan class="b"> administrative relations</tspan><tspan class="k"> between the Centre and the states. In addition, there are</tspan></text>
<text x="56" y="178"><tspan class="k">various other articles pertaining to the same matter.</tspan></text>
<text class="lb" x="40" y="210">1. Distribution of Executive Powers</text>
<text x="44" y="240"><tspan class="h" style="font-weight:700">Executive power:</tspan><tspan class="k"> The</tspan><tspan class="r"> executive power</tspan><tspan class="k"> has been divided between the Centre and the</tspan></text>
<text x="56" y="262"><tspan class="k">states on the lines of the</tspan><tspan class="b"> distribution of legislative powers</tspan><tspan class="k">, except in few cases.</tspan></text>
<text x="56" y="286"><tspan class="k">Thus, the executive power of the</tspan><tspan class="r"> Centre</tspan><tspan class="k"> extends to the</tspan><tspan class="r"> whole of India</tspan><tspan class="k">:</tspan></text>
<text x="70" y="312" class="r" style="font-weight:700">(i)</text>
<text x="103" y="312"><tspan class="k">to the matters on which the Parliament has exclusive power of legislation (</tspan><tspan class="b">i.e.,</tspan></text>
<text x="103" y="334"><tspan class="b">the subjects enumerated in the Union List</tspan><tspan class="k">); and</tspan></text>
<text x="70" y="360" class="r" style="font-weight:700">(ii)</text>
<text x="103" y="360"><tspan class="k">to the exercise of rights, authority and jurisdiction conferred on it by any</tspan><tspan class="r"> treaty</tspan></text>
<text x="103" y="382"><tspan class="r">or agreement</tspan><tspan class="k">.</tspan></text>
<path d="M64 292 L58 292 L58 388 L64 388" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="56" y="406"><tspan class="k">Similarly, the executive power of a</tspan><tspan class="r"> state</tspan><tspan class="k"> extends to its territory in respect of matters</tspan></text>
<text x="56" y="428"><tspan class="k">on which the state legislature has exclusive power of legislation (</tspan><tspan class="b">i.e., the subjects</tspan></text>
<text x="56" y="450"><tspan class="b">enumerated in the State List</tspan><tspan class="k">).</tspan></text>
<text x="44" y="478"><tspan class="h" style="font-weight:700">Concurrent – states execute:</tspan><tspan class="k"> In respect of matters on which both the Parliament and</tspan></text>
<text x="56" y="500"><tspan class="k">the state legislatures have power of legislation (</tspan><tspan class="b">i.e., the subjects enumerated in the</tspan></text>
<text x="56" y="522"><tspan class="b">Concurrent List</tspan><tspan class="k">), the executive power</tspan><tspan class="r"> rests with the states</tspan><tspan class="k"> except when a</tspan><tspan class="b"> Constitutional</tspan></text>
<text x="56" y="544"><tspan class="b">provision or a parliamentary law</tspan><tspan class="k"> specifically confers it on the Centre. Therefore, a law on</tspan></text>
<text x="56" y="566"><tspan class="k">a concurrent subject, though enacted by the Parliament, is to be</tspan><tspan class="r"> executed by the states</tspan></text>
<text x="56" y="588"><tspan class="k">except when the Constitution or the Parliament has directed otherwise.⁵</tspan></text>
<rect class="bx" x="46" y="602" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="620" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="630" x2="140" y2="644" marker-end="url(#ah)"/>
<text class="sm" x="140" y="665" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> Centre</tspan></text>
<text class="sm" x="140" y="687" text-anchor="middle"><tspan class="b">+ treaties / agreements</tspan></text>
<rect class="bx" x="246" y="602" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="620" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="630" x2="340" y2="644" marker-end="url(#ah)"/>
<text class="sm" x="340" y="665" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> State</tspan></text>
<line x1="240" y1="602" x2="240" y2="690" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="602" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="620" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="630" x2="540" y2="644" marker-end="url(#ah)"/>
<text class="sm" x="540" y="665" text-anchor="middle"><tspan class="k">executive power →</tspan><tspan class="r"> States</tspan></text>
<text class="sm" x="540" y="687" text-anchor="middle"><tspan class="b">unless Constitution /</tspan></text>
<text class="sm" x="540" y="706" text-anchor="middle"><tspan class="b">Parliament says Centre</tspan></text>
<line x1="440" y1="602" x2="440" y2="709" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="747">2. Obligation of States and the Centre</text>
<text x="44" y="777"><tspan class="h" style="font-weight:700">Two obligations:</tspan><tspan class="k"> The Constitution has placed</tspan><tspan class="r"> two restrictions</tspan><tspan class="k"> on the executive power of</tspan></text>
<text x="56" y="799"><tspan class="k">the states in order to give ample scope to the Centre for exercising its executive power</tspan></text>
<text x="56" y="821"><tspan class="k">in an</tspan><tspan class="b"> unrestricted manner</tspan><tspan class="k">. Thus, the executive power of every state is to be exercised in</tspan></text>
<text x="56" y="843"><tspan class="k">such a way (a) as to</tspan><tspan class="r"> ensure compliance with the laws made by the Parliament</tspan><tspan class="k"> and any</tspan></text>
<text x="56" y="865"><tspan class="k">existing law which apply in the state; and (b) as</tspan><tspan class="r"> not to impede or prejudice</tspan><tspan class="k"> the exercise</tspan></text>
<text x="56" y="887"><tspan class="k">of executive power of the Centre in the state. While the former lays down a</tspan><tspan class="b"> general</tspan></text>
<text x="56" y="909"><tspan class="b">obligation</tspan><tspan class="k"> upon the state, the latter imposes a</tspan><tspan class="b"> specific obligation</tspan><tspan class="k"> on the state not to</tspan></text>
<text x="56" y="931"><tspan class="k">hamper the executive power of the Centre.</tspan></text>
<rect class="bx" x="40" y="943" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="188" y="963" text-anchor="middle"><tspan class="r" style="font-weight:700">(a) general obligation</tspan></text>
<text class="sm" x="188" y="981" text-anchor="middle"><tspan class="k">comply with laws of Parliament + existing</tspan></text>
<text class="sm" x="188" y="999" text-anchor="middle"><tspan class="k">laws</tspan></text>
<rect class="bx" x="345" y="943" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="963" text-anchor="middle"><tspan class="r" style="font-weight:700">(b) specific obligation</tspan></text>
<text class="sm" x="492" y="981" text-anchor="middle"><tspan class="k">not impede / prejudice Centre’s executive</tspan></text>
<text class="sm" x="492" y="999" text-anchor="middle"><tspan class="k">power</tspan></text>
<text x="44" y="1039"><tspan class="h" style="font-weight:700">Coercive directions – Art. 365:</tspan><tspan class="k"> In both the cases, the executive power of the Centre</tspan></text>
<text x="56" y="1061"><tspan class="k">extends to giving of such</tspan><tspan class="r"> directions</tspan><tspan class="k"> to the state as are necessary for the purpose. The</tspan></text>
<text x="56" y="1083"><tspan class="k">sanction behind these directions of the Centre is</tspan><tspan class="r"> coercive</tspan><tspan class="k"> in nature. Thus,</tspan><tspan class="r"> Article 365</tspan></text>
<text x="56" y="1105"><tspan class="k">says that where any state has</tspan><tspan class="b"> failed to comply with (or to give effect to) any directions</tspan></text>
<text x="56" y="1127"><tspan class="k">given by the Centre, it will be lawful for the President to hold that a situation has</tspan></text>
<text x="56" y="1149"><tspan class="k">arisen in which the government of the state cannot be carried on in accordance with the</tspan></text>
<text x="56" y="1171"><tspan class="k">provisions of the Constitution. It means that, in such a situation, the</tspan><tspan class="r"> President’s rule</tspan></text>
<text x="56" y="1193"><tspan class="k">can be imposed in the state under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="117" y="1205" width="162" height="30" rx="3"/>
<text class="sm" x="198" y="1224" text-anchor="middle"><tspan class="k">Centre gives</tspan><tspan class="r"> directions</tspan></text>
<line class="ln" x1="282" y1="1220" x2="302" y2="1220" marker-end="url(#ah)"/>
<rect class="bx" x="305" y="1205" width="153" height="30" rx="3"/>
<text class="sm" x="382" y="1224" text-anchor="middle"><tspan class="k">State fails to comply</tspan></text>
<line class="ln" x1="461" y1="1220" x2="481" y2="1220" marker-end="url(#ah)"/>
<rect class="bx" x="484" y="1205" width="79" height="30" rx="3"/>
<text class="sm" x="523" y="1224" text-anchor="middle"><tspan class="r">Art. 365</tspan></text>
<line class="ln" x1="340" y1="1236" x2="340" y2="1257" marker-end="url(#ah)"/>
<rect class="bx" x="246" y="1259" width="189" height="30" rx="3"/>
<text class="sm" x="340" y="1278" text-anchor="middle"><tspan class="r" style="font-weight:700">President’s rule (Art. 356)</tspan></text>
<text class="lb" x="40" y="1321">3. Centre’s Directions to the States</text>
<text x="44" y="1351"><tspan class="h" style="font-weight:700">Four directions:</tspan><tspan class="k"> In addition to the above two cases, the Centre is empowered to give</tspan></text>
<text x="56" y="1373"><tspan class="r">directions</tspan><tspan class="k"> to the states with regard to the exercise of their executive power in the</tspan></text>
<text x="56" y="1395"><tspan class="k">following matters:</tspan></text>
<text x="56" y="1421" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1421"><tspan class="k">the construction and maintenance of</tspan><tspan class="r"> means of communication</tspan><tspan class="k"> (</tspan><tspan class="b">declared to be of</tspan></text>
<text x="93" y="1443"><tspan class="b">national or military importance</tspan><tspan class="k">) by the state;</tspan></text>
<text x="56" y="1469" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1469"><tspan class="k">the measures to be taken for the</tspan><tspan class="r"> protection of the railways</tspan><tspan class="k"> within the state;</tspan></text>
<text x="56" y="1495" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1495"><tspan class="k">the provision of adequate facilities for</tspan><tspan class="r"> instruction in the mother-tongue</tspan><tspan class="k"> at the</tspan></text>
<text x="93" y="1517"><tspan class="b">primary stage of education</tspan><tspan class="k"> to children belonging to</tspan><tspan class="r"> linguistic minority groups</tspan><tspan class="k"> in</tspan></text>
<text x="93" y="1539"><tspan class="k">the state; and</tspan></text>
<text x="56" y="1565" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1565"><tspan class="k">the drawing up and execution of the specified schemes for the</tspan><tspan class="r"> welfare of the</tspan></text>
<text x="93" y="1587"><tspan class="r">Scheduled Tribes</tspan><tspan class="k"> in the state.</tspan></text>
<path d="M50 1401 L44 1401 L44 1593 L50 1593" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1615"><tspan class="h" style="font-weight:700">Coercive sanction:</tspan><tspan class="k"> The</tspan><tspan class="r"> coercive sanction</tspan><tspan class="k"> behind the Central directions under</tspan><tspan class="r"> Article 365</tspan></text>
<text x="56" y="1637"><tspan class="k">(mentioned above) is also applicable in these cases.</tspan></text>
<text class="xs" x="50" y="1673"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> For example, under the Essential Commodities Act, made by the Parliament on a concurrent</tspan></text>
<text class="xs" x="50" y="1691"><tspan class="k">subject, the executive power is vested in the Centre.</tspan></text>
<rect x="40" y="1651" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
