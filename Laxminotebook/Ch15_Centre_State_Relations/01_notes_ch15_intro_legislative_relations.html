<div id="vis-container"><h2 class="sr-only">Intro of Centre-State relations, three heads and four aspects of legislative relations.</h2>
<svg class="n" width="100%" viewBox="0 0 680 994" role="img"><title>CHAPTER 15 Centre–State Relations</title><desc>Intro of Centre-State relations, three heads and four aspects of legislative relations.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="172" y="26" width="335" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 15 Centre–State Relations</text>
<text class="lb" x="40" y="98">1. Division of powers</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The</tspan><tspan class="r"> Constitution of India</tspan><tspan class="k">, being</tspan><tspan class="b"> federal in structure</tspan><tspan class="k">, divides all powers (</tspan><tspan class="r">legislative,</tspan></text>
<text x="58" y="148"><tspan class="r">executive and financial</tspan><tspan class="k">) between the</tspan><tspan class="r"> Centre</tspan><tspan class="k"> and the</tspan><tspan class="r"> states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">However, there is</tspan><tspan class="r"> no division of judicial power</tspan><tspan class="k"> as the Constitution has established an</tspan></text>
<text x="58" y="196"><tspan class="b">integrated judicial system</tspan><tspan class="k"> to enforce both the</tspan><tspan class="r"> Central laws</tspan><tspan class="k"> as well as</tspan><tspan class="r"> state laws</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="202" x2="340" y2="214"/>
<line class="ln" x1="115" y1="214" x2="565" y2="214"/>
<line class="ln" x1="115" y1="214" x2="115" y2="230" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="214" x2="265" y2="230" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="214" x2="415" y2="230" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="214" x2="565" y2="230" marker-end="url(#ah)"/>
<text class="sm" x="115" y="250" text-anchor="middle"><tspan class="r">Legislative</tspan></text>
<text class="sm" x="265" y="250" text-anchor="middle"><tspan class="r">Executive</tspan></text>
<text class="sm" x="415" y="250" text-anchor="middle"><tspan class="r">Financial</tspan></text>
<text class="sm" x="565" y="250" text-anchor="middle"><tspan class="b">Judicial</tspan><tspan class="k"> – not divided</tspan></text>
<line class="ln" x1="565" y1="260" x2="565" y2="276" marker-end="url(#ah)"/>
<text class="sm" x="555" y="292" text-anchor="end"><tspan class="b">integrated judicial system</tspan><tspan class="k"> enforces both</tspan><tspan class="r"> Central laws</tspan><tspan class="k"> +</tspan><tspan class="r"> state laws</tspan></text>
<text class="lb" x="40" y="328">2. Need for harmony</text>
<text x="44" y="356" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="356"><tspan class="k">Though the Centre and the states are</tspan><tspan class="r"> supreme in their respective fields</tspan><tspan class="k">, the</tspan><tspan class="b"> maximum</tspan></text>
<text x="58" y="378"><tspan class="b">harmony and coordination</tspan><tspan class="k"> between them is essential for the</tspan><tspan class="b"> effective operation of the</tspan></text>
<text x="58" y="400"><tspan class="b">federal system</tspan><tspan class="k">.</tspan></text>
<text x="44" y="426" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="426"><tspan class="k">Hence, the Constitution contains</tspan><tspan class="r"> elaborate provisions</tspan><tspan class="k"> to regulate the various</tspan></text>
<text x="58" y="448"><tspan class="k">dimensions of the relations between the Centre and the states.</tspan></text>
<text class="lb" x="40" y="480">3. Three heads</text>
<text x="44" y="508" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="508"><tspan class="k">The</tspan><tspan class="r"> Centre-state relations</tspan><tspan class="k"> can be studied under</tspan><tspan class="r"> three heads</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="514" x2="340" y2="526"/>
<line class="ln" x1="140" y1="526" x2="540" y2="526"/>
<line class="ln" x1="140" y1="526" x2="140" y2="542" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="526" x2="340" y2="542" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="526" x2="540" y2="542" marker-end="url(#ah)"/>
<text class="sm" x="140" y="562" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Legislative relations.</tspan></text>
<text class="sm" x="340" y="562" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Administrative relations.</tspan></text>
<text class="sm" x="540" y="562" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Financial relations.</tspan></text>
<line x1="30" y1="580" x2="650" y2="580" stroke="var(--text-secondary)" stroke-width="0.8"/>
<text class="r hd" x="40" y="620">LEGISLATIVE RELATIONS</text>
<line x1="40" y1="626" x2="228" y2="626" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="652" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="652"><tspan class="r">Articles 245 to 255</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XI</tspan><tspan class="k"> of the Constitution deal with the</tspan><tspan class="b"> legislative relations</tspan></text>
<text x="58" y="674"><tspan class="k">between the Centre and the states.</tspan></text>
<text x="44" y="700" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="700"><tspan class="k">Besides these, there are some</tspan><tspan class="b"> other articles</tspan><tspan class="k"> dealing with the same subject.</tspan></text>
<text x="44" y="726" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="726"><tspan class="k">Like any other</tspan><tspan class="b"> Federal Constitution</tspan><tspan class="k">, the Indian Constitution also divides the legislative</tspan></text>
<text x="58" y="748"><tspan class="k">powers between the Centre and the states with respect to both the</tspan><tspan class="r"> territory</tspan><tspan class="k"> and the</tspan></text>
<text x="58" y="770"><tspan class="r">subjects of legislation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="796" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="796"><tspan class="k">Further, the Constitution provides for the</tspan><tspan class="r"> parliamentary legislation in the state field</tspan></text>
<text x="58" y="818"><tspan class="k">under</tspan><tspan class="r"> five extraordinary situations</tspan><tspan class="k"> as well as the</tspan><tspan class="r"> centre’s control over state legislation</tspan></text>
<text x="58" y="840"><tspan class="k">in certain cases.</tspan></text>
<text x="44" y="866" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="866"><tspan class="k">Thus, there are</tspan><tspan class="r"> four aspects</tspan><tspan class="k"> in the Centre–states legislative relations, viz.,</tspan></text>
<rect class="bx" x="40" y="878" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="898" text-anchor="middle"><tspan class="r">1.</tspan></text>
<text class="sm" x="111" y="916" text-anchor="middle"><tspan class="k" style="font-weight:700">Territorial extent</tspan></text>
<text class="sm" x="111" y="934" text-anchor="middle"><tspan class="k" style="font-weight:700">of Central and</tspan></text>
<text class="sm" x="111" y="952" text-anchor="middle"><tspan class="k" style="font-weight:700">state legislation;</tspan></text>
<rect class="bx" x="192" y="878" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="898" text-anchor="middle"><tspan class="r">2.</tspan></text>
<text class="sm" x="264" y="916" text-anchor="middle"><tspan class="k" style="font-weight:700">Distribution of</tspan></text>
<text class="sm" x="264" y="934" text-anchor="middle"><tspan class="k" style="font-weight:700">legislative</tspan></text>
<text class="sm" x="264" y="952" text-anchor="middle"><tspan class="k" style="font-weight:700">subjects;</tspan></text>
<rect class="bx" x="345" y="878" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="898" text-anchor="middle"><tspan class="r">3.</tspan></text>
<text class="sm" x="416" y="916" text-anchor="middle"><tspan class="k" style="font-weight:700">Parliamentary</tspan></text>
<text class="sm" x="416" y="934" text-anchor="middle"><tspan class="k" style="font-weight:700">legislation in the</tspan></text>
<text class="sm" x="416" y="952" text-anchor="middle"><tspan class="k" style="font-weight:700">state field; and</tspan></text>
<rect class="bx" x="498" y="878" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="898" text-anchor="middle"><tspan class="r">4.</tspan></text>
<text class="sm" x="569" y="916" text-anchor="middle"><tspan class="k" style="font-weight:700">Centre’s control</tspan></text>
<text class="sm" x="569" y="934" text-anchor="middle"><tspan class="k" style="font-weight:700">over state</tspan></text>
<text class="sm" x="569" y="952" text-anchor="middle"><tspan class="k" style="font-weight:700">legislation.</tspan></text>
</svg>
</div></body></html>
