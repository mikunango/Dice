<div id="vis-container"><h2 class="sr-only">Intro of Centre-State relations, three heads and four aspects of legislative relations.</h2>
<svg class="n" width="100%" viewBox="0 0 680 1058" role="img"><title>CHAPTER 15 Centre–State Relations</title><desc>Intro of Centre-State relations, three heads and four aspects of legislative relations.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="172" y="26" width="335" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 15 Centre–State Relations</text>
<text class="lb" x="40" y="98">1. Division of powers</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Federal division of powers:</tspan><tspan class="k"> The</tspan><tspan class="r"> Constitution of India</tspan><tspan class="k">, being</tspan><tspan class="b"> federal in structure</tspan><tspan class="k">, divides</tspan></text>
<text x="56" y="150"><tspan class="k">all powers (</tspan><tspan class="r">legislative, executive and financial</tspan><tspan class="k">) between the</tspan><tspan class="r"> Centre</tspan><tspan class="k"> and the</tspan><tspan class="r"> states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="178"><tspan class="h" style="font-weight:700">No judicial division:</tspan><tspan class="k"> However, there is</tspan><tspan class="r"> no division of judicial power</tspan><tspan class="k"> as the Constitution</tspan></text>
<text x="56" y="200"><tspan class="k">has established an</tspan><tspan class="b"> integrated judicial system</tspan><tspan class="k"> to enforce both the</tspan><tspan class="r"> Central laws</tspan><tspan class="k"> as well as</tspan></text>
<text x="56" y="222"><tspan class="r">state laws</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="228" x2="340" y2="240"/>
<line class="ln" x1="115" y1="240" x2="565" y2="240"/>
<line class="ln" x1="115" y1="240" x2="115" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="240" x2="265" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="240" x2="415" y2="256" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="240" x2="565" y2="256" marker-end="url(#ah)"/>
<text class="sm" x="115" y="276" text-anchor="middle"><tspan class="r">Legislative</tspan></text>
<text class="sm" x="265" y="276" text-anchor="middle"><tspan class="r">Executive</tspan></text>
<text class="sm" x="415" y="276" text-anchor="middle"><tspan class="r">Financial</tspan></text>
<text class="sm" x="565" y="276" text-anchor="middle"><tspan class="b">Judicial</tspan><tspan class="k"> – not divided</tspan></text>
<line class="ln" x1="565" y1="286" x2="565" y2="302" marker-end="url(#ah)"/>
<text class="sm" x="555" y="318" text-anchor="end"><tspan class="b">integrated judicial system</tspan><tspan class="k"> enforces both</tspan><tspan class="r"> Central laws</tspan><tspan class="k"> +</tspan><tspan class="r"> state laws</tspan></text>
<text class="lb" x="40" y="354">2. Need for harmony</text>
<text x="44" y="384"><tspan class="h" style="font-weight:700">Harmony needed:</tspan><tspan class="k"> Though the Centre and the states are</tspan><tspan class="r"> supreme in their respective</tspan></text>
<text x="56" y="406"><tspan class="r">fields</tspan><tspan class="k">, the</tspan><tspan class="b"> maximum harmony and coordination</tspan><tspan class="k"> between them is essential for the</tspan></text>
<text x="56" y="428"><tspan class="b">effective operation of the federal system</tspan><tspan class="k">.</tspan></text>
<text x="44" y="456"><tspan class="h" style="font-weight:700">Elaborate provisions:</tspan><tspan class="k"> Hence, the Constitution contains</tspan><tspan class="r"> elaborate provisions</tspan><tspan class="k"> to regulate</tspan></text>
<text x="56" y="478"><tspan class="k">the various dimensions of the relations between the Centre and the states.</tspan></text>
<text class="lb" x="40" y="510">3. Three heads</text>
<text x="44" y="540"><tspan class="h" style="font-weight:700">Three heads:</tspan><tspan class="k"> The</tspan><tspan class="r"> Centre-state relations</tspan><tspan class="k"> can be studied under</tspan><tspan class="r"> three heads</tspan><tspan class="k">:</tspan></text>
<line class="ln" x1="340" y1="546" x2="340" y2="558"/>
<line class="ln" x1="140" y1="558" x2="540" y2="558"/>
<line class="ln" x1="140" y1="558" x2="140" y2="574" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="558" x2="340" y2="574" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="558" x2="540" y2="574" marker-end="url(#ah)"/>
<text class="sm" x="140" y="594" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Legislative relations.</tspan></text>
<text class="sm" x="340" y="594" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Administrative relations.</tspan></text>
<text class="sm" x="540" y="594" text-anchor="middle"><tspan class="k">•</tspan><tspan class="r"> Financial relations.</tspan></text>
<line x1="30" y1="612" x2="650" y2="612" stroke="var(--text-secondary)" stroke-width="0.8"/>
<text class="r hd" x="40" y="652">LEGISLATIVE RELATIONS</text>
<line x1="40" y1="658" x2="228" y2="658" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="686"><tspan class="h" style="font-weight:700">Arts. 245–255, Part XI:</tspan><tspan class="r"> Articles 245 to 255</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XI</tspan><tspan class="k"> of the Constitution deal with</tspan></text>
<text x="56" y="708"><tspan class="k">the</tspan><tspan class="b"> legislative relations</tspan><tspan class="k"> between the Centre and the states.</tspan></text>
<text x="44" y="736"><tspan class="h" style="font-weight:700">Other articles:</tspan><tspan class="k"> Besides these, there are some</tspan><tspan class="b"> other articles</tspan><tspan class="k"> dealing with the same</tspan></text>
<text x="56" y="758"><tspan class="k">subject.</tspan></text>
<text x="44" y="786"><tspan class="h" style="font-weight:700">Territory &amp; subjects:</tspan><tspan class="k"> Like any other</tspan><tspan class="b"> Federal Constitution</tspan><tspan class="k">, the Indian Constitution also</tspan></text>
<text x="56" y="808"><tspan class="k">divides the legislative powers between the Centre and the states with respect to both</tspan></text>
<text x="56" y="830"><tspan class="k">the</tspan><tspan class="r"> territory</tspan><tspan class="k"> and the</tspan><tspan class="r"> subjects of legislation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="858"><tspan class="h" style="font-weight:700">Five situations + control:</tspan><tspan class="k"> Further, the Constitution provides for the</tspan><tspan class="r"> parliamentary</tspan></text>
<text x="56" y="880"><tspan class="r">legislation in the state field</tspan><tspan class="k"> under</tspan><tspan class="r"> five extraordinary situations</tspan><tspan class="k"> as well as the</tspan><tspan class="r"> centre’s</tspan></text>
<text x="56" y="902"><tspan class="r">control over state legislation</tspan><tspan class="k"> in certain cases.</tspan></text>
<text x="44" y="930"><tspan class="h" style="font-weight:700">Four aspects:</tspan><tspan class="k"> Thus, there are</tspan><tspan class="r"> four aspects</tspan><tspan class="k"> in the Centre–states legislative relations, viz.,</tspan></text>
<rect class="bx" x="40" y="942" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="962" text-anchor="middle"><tspan class="r">1.</tspan></text>
<text class="sm" x="111" y="980" text-anchor="middle"><tspan class="k" style="font-weight:700">Territorial extent</tspan></text>
<text class="sm" x="111" y="998" text-anchor="middle"><tspan class="k" style="font-weight:700">of Central and</tspan></text>
<text class="sm" x="111" y="1016" text-anchor="middle"><tspan class="k" style="font-weight:700">state legislation;</tspan></text>
<rect class="bx" x="192" y="942" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="962" text-anchor="middle"><tspan class="r">2.</tspan></text>
<text class="sm" x="264" y="980" text-anchor="middle"><tspan class="k" style="font-weight:700">Distribution of</tspan></text>
<text class="sm" x="264" y="998" text-anchor="middle"><tspan class="k" style="font-weight:700">legislative</tspan></text>
<text class="sm" x="264" y="1016" text-anchor="middle"><tspan class="k" style="font-weight:700">subjects;</tspan></text>
<rect class="bx" x="345" y="942" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="962" text-anchor="middle"><tspan class="r">3.</tspan></text>
<text class="sm" x="416" y="980" text-anchor="middle"><tspan class="k" style="font-weight:700">Parliamentary</tspan></text>
<text class="sm" x="416" y="998" text-anchor="middle"><tspan class="k" style="font-weight:700">legislation in the</tspan></text>
<text class="sm" x="416" y="1016" text-anchor="middle"><tspan class="k" style="font-weight:700">state field; and</tspan></text>
<rect class="bx" x="498" y="942" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="962" text-anchor="middle"><tspan class="r">4.</tspan></text>
<text class="sm" x="569" y="980" text-anchor="middle"><tspan class="k" style="font-weight:700">Centre’s control</tspan></text>
<text class="sm" x="569" y="998" text-anchor="middle"><tspan class="k" style="font-weight:700">over state</tspan></text>
<text class="sm" x="569" y="1016" text-anchor="middle"><tspan class="k" style="font-weight:700">legislation.</tspan></text>
</svg>
</div></body></html>
