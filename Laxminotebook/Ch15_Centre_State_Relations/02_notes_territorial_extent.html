<div id="vis-container"><h2 class="sr-only">Territorial Extent of Central and State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1293" role="img"><title>Territorial Extent of Central and State Legislation</title><desc>Territorial Extent of Central and State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="118" y="26" width="443" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Territorial Extent of Central and State Legislation</text>
<text class="lb" x="40" y="98">1. Territorial Extent of Central and State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Territorial limits:</tspan><tspan class="k"> The Constitution defines the</tspan><tspan class="r"> territorial limits</tspan><tspan class="k"> of the legislative powers</tspan></text>
<text x="56" y="150"><tspan class="k">vested in the Centre and the states in the following way:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the territory of India</tspan><tspan class="k">.</tspan></text>
<text x="93" y="201"><tspan class="h" style="font-weight:700">Territory of India:</tspan><tspan class="k"> The territory of India includes the</tspan><tspan class="b"> states</tspan><tspan class="k">, the</tspan><tspan class="b"> union</tspan></text>
<text x="105" y="223"><tspan class="b">territories</tspan><tspan class="k">, and</tspan><tspan class="b"> any other area</tspan><tspan class="k"> for the time being included in the territory of</tspan></text>
<text x="105" y="245"><tspan class="k">India.</tspan></text>
<text x="56" y="271" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="271"><tspan class="k">A</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the state</tspan><tspan class="k">.</tspan></text>
<text x="93" y="296"><tspan class="h" style="font-weight:700">Sufficient nexus:</tspan><tspan class="k"> The laws made by a state legislature are</tspan><tspan class="b"> not applicable</tspan></text>
<text x="105" y="318"><tspan class="b">outside the state</tspan><tspan class="k">, except when there is a</tspan><tspan class="r"> sufficient nexus</tspan><tspan class="k"> between the state</tspan></text>
<text x="105" y="340"><tspan class="k">and the object.</tspan></text>
<text x="56" y="366" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="366"><tspan class="k">The</tspan><tspan class="r"> Parliament alone</tspan><tspan class="k"> can make ‘</tspan><tspan class="r">extra-territorial legislation</tspan><tspan class="k">’.</tspan></text>
<text x="93" y="391"><tspan class="h" style="font-weight:700">Extra-territorial reach:</tspan><tspan class="k"> Thus, the laws of the Parliament are also applicable to</tspan></text>
<text x="105" y="413"><tspan class="k">the</tspan><tspan class="b"> Indian citizens and their property in any part of the world</tspan><tspan class="k">.</tspan></text>
<path d="M50 156 L44 156 L44 419 L50 419" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="427" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="445" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="190" y1="455" x2="190" y2="469" marker-end="url(#ah)"/>
<text class="sm" x="190" y="490" text-anchor="middle"><tspan class="k">whole or any part of</tspan><tspan class="r"> India</tspan></text>
<text class="sm" x="190" y="512" text-anchor="middle"><tspan class="b">states + UTs + other areas</tspan></text>
<text class="sm" x="190" y="534" text-anchor="middle"><tspan class="r">extra-territorial</tspan><tspan class="k"> also ✔</tspan></text>
<rect class="bx" x="346" y="427" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="445" text-anchor="middle"><tspan class="r" style="font-weight:700">State legislature</tspan></text>
<line class="ln" x1="490" y1="455" x2="490" y2="469" marker-end="url(#ah)"/>
<text class="sm" x="490" y="490" text-anchor="middle"><tspan class="k">whole or any part of the</tspan><tspan class="r"> state</tspan></text>
<text class="sm" x="490" y="512" text-anchor="middle"><tspan class="k">not outside the state</tspan></text>
<text class="sm" x="490" y="534" text-anchor="middle"><tspan class="k">except</tspan><tspan class="r"> sufficient nexus</tspan></text>
<line x1="340" y1="427" x2="340" y2="537" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="575">2. Restrictions on Parliament</text>
<text x="44" y="605"><tspan class="h" style="font-weight:700">Restrictions on Parliament:</tspan><tspan class="k"> However, the Constitution places</tspan><tspan class="r"> certain restrictions</tspan><tspan class="k"> on the</tspan></text>
<text x="56" y="627"><tspan class="b">plenary territorial jurisdiction</tspan><tspan class="k"> of the Parliament.</tspan></text>
<text x="44" y="655"><tspan class="h" style="font-weight:700">Laws not applicable:</tspan><tspan class="k"> In other words, the laws of Parliament are</tspan><tspan class="r"> not applicable</tspan><tspan class="k"> in the</tspan></text>
<text x="56" y="677"><tspan class="k">following areas:</tspan></text>
<text x="56" y="703" class="r" style="font-weight:700">(i)</text>
<text x="93" y="703"><tspan class="k">The</tspan><tspan class="r"> President</tspan><tspan class="k"> can make</tspan><tspan class="r"> regulations</tspan><tspan class="k"> for the</tspan><tspan class="b"> peace, progress and good government</tspan></text>
<text x="93" y="725"><tspan class="k">of the Union Territories of the</tspan><tspan class="r"> Andaman and Nicobar Islands, Lakshadweep, Dadra</tspan></text>
<text x="93" y="747"><tspan class="r">and Nagar Haveli and Daman and Diu and Ladakh</tspan><tspan class="k">.</tspan></text>
<text x="93" y="772"><tspan class="h" style="font-weight:700">Puducherry:</tspan><tspan class="k"> In the case of</tspan><tspan class="r"> Puducherry</tspan><tspan class="k"> also, the President can legislate by</tspan></text>
<text x="105" y="794"><tspan class="k">making regulations but only when the</tspan><tspan class="b"> Assembly is suspended or dissolved</tspan><tspan class="k">.</tspan></text>
<text x="93" y="819"><tspan class="h" style="font-weight:700">Force of regulation:</tspan><tspan class="k"> A regulation so made has the</tspan><tspan class="r"> same force and effect as an</tspan></text>
<text x="105" y="841"><tspan class="r">act of Parliament</tspan><tspan class="k">.</tspan></text>
<text x="93" y="866"><tspan class="h" style="font-weight:700">Repeal/amend power:</tspan><tspan class="k"> It may also</tspan><tspan class="b"> repeal or amend any act of Parliament</tspan><tspan class="k"> in</tspan></text>
<text x="105" y="888"><tspan class="k">relation to these union territories.</tspan></text>
<text x="56" y="914" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="914"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> is empowered to direct that an act of Parliament</tspan><tspan class="b"> does not apply</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="936"><tspan class="k">a</tspan><tspan class="r"> scheduled area</tspan><tspan class="k"> in the state or apply with</tspan><tspan class="b"> specified modifications and exceptions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="962" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="962"><tspan class="k">The</tspan><tspan class="r"> Governor of Assam</tspan><tspan class="k"> may likewise direct that an act of Parliament does not</tspan></text>
<text x="93" y="984"><tspan class="k">apply to a</tspan><tspan class="r"> tribal area (autonomous district)</tspan><tspan class="k"> in the state or apply with specified</tspan></text>
<text x="93" y="1006"><tspan class="k">modifications and exceptions.</tspan></text>
<text x="93" y="1031"><tspan class="h" style="font-weight:700">President – NE tribal areas:</tspan><tspan class="k"> The</tspan><tspan class="r"> President</tspan><tspan class="k"> enjoys the same power with respect</tspan></text>
<text x="105" y="1053"><tspan class="k">to tribal areas (autonomous districts) in</tspan><tspan class="r"> Meghalaya, Tripura and Mizoram</tspan><tspan class="k">.</tspan></text>
