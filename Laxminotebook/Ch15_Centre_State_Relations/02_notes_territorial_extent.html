<div id="vis-container"><h2 class="sr-only">Territorial Extent of Central and State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1192" role="img"><title>Territorial Extent of Central and State Legislation</title><desc>Territorial Extent of Central and State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="118" y="26" width="443" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Territorial Extent of Central and State Legislation</text>
<text class="lb" x="40" y="98">1. Territorial Extent of Central and State Legislation</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The Constitution defines the</tspan><tspan class="r"> territorial limits</tspan><tspan class="k"> of the legislative powers vested in the</tspan></text>
<text x="58" y="148"><tspan class="k">Centre and the states in the following way:</tspan></text>
<text x="56" y="174" class="r" style="font-weight:700">(i)</text>
<text x="93" y="174"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the territory of India</tspan><tspan class="k">.</tspan></text>
<text x="93" y="198" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="198"><tspan class="k">The territory of India includes the</tspan><tspan class="b"> states</tspan><tspan class="k">, the</tspan><tspan class="b"> union territories</tspan><tspan class="k">, and</tspan><tspan class="b"> any other</tspan></text>
<text x="107" y="220"><tspan class="b">area</tspan><tspan class="k"> for the time being included in the territory of India.</tspan></text>
<text x="56" y="246" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="246"><tspan class="k">A</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the state</tspan><tspan class="k">.</tspan></text>
<text x="93" y="270" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="270"><tspan class="k">The laws made by a state legislature are</tspan><tspan class="b"> not applicable outside the state</tspan><tspan class="k">,</tspan></text>
<text x="107" y="292"><tspan class="k">except when there is a</tspan><tspan class="r"> sufficient nexus</tspan><tspan class="k"> between the state and the object.</tspan></text>
<text x="56" y="318" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="318"><tspan class="k">The</tspan><tspan class="r"> Parliament alone</tspan><tspan class="k"> can make ‘</tspan><tspan class="r">extra-territorial legislation</tspan><tspan class="k">’.</tspan></text>
<text x="93" y="342" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="342"><tspan class="k">Thus, the laws of the Parliament are also applicable to the</tspan><tspan class="b"> Indian citizens and</tspan></text>
<text x="107" y="364"><tspan class="b">their property in any part of the world</tspan><tspan class="k">.</tspan></text>
<path d="M50 154 L44 154 L44 370 L50 370" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="378" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="396" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="190" y1="406" x2="190" y2="420" marker-end="url(#ah)"/>
<text class="sm" x="190" y="441" text-anchor="middle"><tspan class="k">whole or any part of</tspan><tspan class="r"> India</tspan></text>
<text class="sm" x="190" y="463" text-anchor="middle"><tspan class="b">states + UTs + other areas</tspan></text>
<text class="sm" x="190" y="485" text-anchor="middle"><tspan class="r">extra-territorial</tspan><tspan class="k"> also ✔</tspan></text>
<rect class="bx" x="346" y="378" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="396" text-anchor="middle"><tspan class="r" style="font-weight:700">State legislature</tspan></text>
<line class="ln" x1="490" y1="406" x2="490" y2="420" marker-end="url(#ah)"/>
<text class="sm" x="490" y="441" text-anchor="middle"><tspan class="k">whole or any part of the</tspan><tspan class="r"> state</tspan></text>
<text class="sm" x="490" y="463" text-anchor="middle"><tspan class="k">not outside the state</tspan></text>
<text class="sm" x="490" y="485" text-anchor="middle"><tspan class="k">except</tspan><tspan class="r"> sufficient nexus</tspan></text>
<line x1="340" y1="378" x2="340" y2="488" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="526">2. Restrictions on Parliament</text>
<text x="44" y="554" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="554"><tspan class="k">However, the Constitution places</tspan><tspan class="r"> certain restrictions</tspan><tspan class="k"> on the</tspan><tspan class="b"> plenary territorial</tspan></text>
<text x="58" y="576"><tspan class="b">jurisdiction</tspan><tspan class="k"> of the Parliament.</tspan></text>
<text x="44" y="602" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="602"><tspan class="k">In other words, the laws of Parliament are</tspan><tspan class="r"> not applicable</tspan><tspan class="k"> in the following areas:</tspan></text>
<text x="56" y="628" class="r" style="font-weight:700">(i)</text>
<text x="93" y="628"><tspan class="k">The</tspan><tspan class="r"> President</tspan><tspan class="k"> can make</tspan><tspan class="r"> regulations</tspan><tspan class="k"> for the</tspan><tspan class="b"> peace, progress and good government</tspan></text>
<text x="93" y="650"><tspan class="k">of the Union Territories of the</tspan><tspan class="r"> Andaman and Nicobar Islands, Lakshadweep, Dadra</tspan></text>
<text x="93" y="672"><tspan class="r">and Nagar Haveli and Daman and Diu and Ladakh</tspan><tspan class="k">.</tspan></text>
<text x="93" y="696" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="696"><tspan class="k">In the case of</tspan><tspan class="r"> Puducherry</tspan><tspan class="k"> also, the President can legislate by making</tspan></text>
<text x="107" y="718"><tspan class="k">regulations but only when the</tspan><tspan class="b"> Assembly is suspended or dissolved</tspan><tspan class="k">.</tspan></text>
<text x="93" y="742" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="742"><tspan class="k">A regulation so made has the</tspan><tspan class="r"> same force and effect as an act of Parliament</tspan><tspan class="k">.</tspan></text>
<text x="93" y="766" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="766"><tspan class="k">It may also</tspan><tspan class="b"> repeal or amend any act of Parliament</tspan><tspan class="k"> in relation to these union</tspan></text>
<text x="107" y="788"><tspan class="k">territories.</tspan></text>
<text x="56" y="814" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="814"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> is empowered to direct that an act of Parliament</tspan><tspan class="b"> does not apply</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="836"><tspan class="k">a</tspan><tspan class="r"> scheduled area</tspan><tspan class="k"> in the state or apply with</tspan><tspan class="b"> specified modifications and exceptions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="862" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="862"><tspan class="k">The</tspan><tspan class="r"> Governor of Assam</tspan><tspan class="k"> may likewise direct that an act of Parliament does not</tspan></text>
<text x="93" y="884"><tspan class="k">apply to a</tspan><tspan class="r"> tribal area (autonomous district)</tspan><tspan class="k"> in the state or apply with specified</tspan></text>
<text x="93" y="906"><tspan class="k">modifications and exceptions.</tspan></text>
<text x="93" y="930" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="930"><tspan class="k">The</tspan><tspan class="r"> President</tspan><tspan class="k"> enjoys the same power with respect to tribal areas (autonomous</tspan></text>
<text x="107" y="952"><tspan class="k">districts) in</tspan><tspan class="r"> Meghalaya, Tripura and Mizoram</tspan><tspan class="k">.</tspan></text>
