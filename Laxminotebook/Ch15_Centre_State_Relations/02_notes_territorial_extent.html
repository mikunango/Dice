<div id="vis-container"><h2 class="sr-only">Territorial Extent of Central and State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1210" role="img"><title>Territorial Extent of Central and State Legislation</title><desc>Territorial Extent of Central and State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="118" y="26" width="443" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Territorial Extent of Central and State Legislation</text>
<text class="lb" x="40" y="98">1. Territorial Extent of Central and State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Territorial jurisdiction:</tspan><tspan class="k"> The Constitution defines the</tspan><tspan class="r"> territorial limits</tspan><tspan class="k"> of the legislative</tspan></text>
<text x="56" y="150"><tspan class="k">powers vested in the Centre and the states in the following way:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="h" style="font-weight:700">Pan-India jurisdiction of Parliament:</tspan><tspan class="k"> The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> can make laws for the</tspan></text>
<text x="93" y="198"><tspan class="r">whole or any part of the territory of India</tspan><tspan class="k">. The territory of India includes the</tspan></text>
<text x="93" y="220"><tspan class="b">states</tspan><tspan class="k">, the</tspan><tspan class="b"> union territories</tspan><tspan class="k">, and</tspan><tspan class="b"> any other area</tspan><tspan class="k"> for the time being included in</tspan></text>
<text x="93" y="242"><tspan class="k">the territory of India.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="h" style="font-weight:700">Doctrine of Territorial Nexus:</tspan><tspan class="k"> A</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or</tspan></text>
<text x="93" y="290"><tspan class="r">any part of the state</tspan><tspan class="k">. The laws made by a state legislature are</tspan><tspan class="b"> not applicable</tspan></text>
<text x="93" y="312"><tspan class="b">outside the state</tspan><tspan class="k">, except when there is a</tspan><tspan class="r"> sufficient nexus</tspan><tspan class="k"> between the state and</tspan></text>
<text x="93" y="334"><tspan class="k">the object.</tspan></text>
<text x="56" y="360" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="360"><tspan class="h" style="font-weight:700">Extra-territorial legislation:</tspan><tspan class="k"> The</tspan><tspan class="r"> Parliament alone</tspan><tspan class="k"> can make ‘</tspan><tspan class="r">extra-territorial</tspan></text>
<text x="93" y="382"><tspan class="r">legislation</tspan><tspan class="k">’. Thus, the laws of the Parliament are also applicable to the</tspan><tspan class="b"> Indian</tspan></text>
<text x="93" y="404"><tspan class="b">citizens and their property in any part of the world</tspan><tspan class="k">.</tspan></text>
<path d="M50 156 L44 156 L44 410 L50 410" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="418" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="190" y1="446" x2="190" y2="460" marker-end="url(#ah)"/>
<text class="sm" x="190" y="481" text-anchor="middle"><tspan class="k">whole or any part of</tspan><tspan class="r"> India</tspan></text>
<text class="sm" x="190" y="503" text-anchor="middle"><tspan class="b">states + UTs + other areas</tspan></text>
<text class="sm" x="190" y="525" text-anchor="middle"><tspan class="r">extra-territorial</tspan><tspan class="k"> also ✔</tspan></text>
<rect class="bx" x="346" y="418" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">State legislature</tspan></text>
<line class="ln" x1="490" y1="446" x2="490" y2="460" marker-end="url(#ah)"/>
<text class="sm" x="490" y="481" text-anchor="middle"><tspan class="k">whole or any part of the</tspan><tspan class="r"> state</tspan></text>
<text class="sm" x="490" y="503" text-anchor="middle"><tspan class="k">not outside the state</tspan></text>
<text class="sm" x="490" y="525" text-anchor="middle"><tspan class="k">except</tspan><tspan class="r"> sufficient nexus</tspan></text>
<line x1="340" y1="418" x2="340" y2="528" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="562"><tspan class="h" style="font-weight:700">Limits on plenary jurisdiction:</tspan><tspan class="k"> However, the Constitution places</tspan><tspan class="r"> certain restrictions</tspan><tspan class="k"> on</tspan></text>
<text x="56" y="584"><tspan class="k">the</tspan><tspan class="b"> plenary territorial jurisdiction</tspan><tspan class="k"> of the Parliament. In other words, the laws of</tspan></text>
<text x="56" y="606"><tspan class="k">Parliament are</tspan><tspan class="r"> not applicable</tspan><tspan class="k"> in the following areas:</tspan></text>
<text x="56" y="632" class="r" style="font-weight:700">(i)</text>
<text x="93" y="632"><tspan class="h" style="font-weight:700">President’s regulation-making power (UTs):</tspan><tspan class="k"> The</tspan><tspan class="r"> President</tspan><tspan class="k"> can make</tspan><tspan class="r"> regulations</tspan></text>
<text x="93" y="654"><tspan class="k">for the</tspan><tspan class="b"> peace, progress and good government</tspan><tspan class="k"> of the Union Territories of the</tspan></text>
<text x="93" y="676"><tspan class="r">Andaman and Nicobar Islands, Lakshadweep, Dadra and Nagar Haveli and Daman</tspan></text>
<text x="93" y="698"><tspan class="r">and Diu and Ladakh</tspan><tspan class="k">. In the case of</tspan><tspan class="r"> Puducherry</tspan><tspan class="k"> also, the President can legislate</tspan></text>
<text x="93" y="720"><tspan class="k">by making regulations but only when the</tspan><tspan class="b"> Assembly is suspended or dissolved</tspan><tspan class="k">. A</tspan></text>
<text x="93" y="742"><tspan class="k">regulation so made has the</tspan><tspan class="r"> same force and effect as an act of Parliament</tspan><tspan class="k">. It</tspan></text>
<text x="93" y="764"><tspan class="k">may also</tspan><tspan class="b"> repeal or amend any act of Parliament</tspan><tspan class="k"> in relation to these union</tspan></text>
<text x="93" y="786"><tspan class="k">territories.</tspan></text>
<text x="56" y="812" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="812"><tspan class="h" style="font-weight:700">Governor &amp; Scheduled Areas (Fifth Schedule):</tspan><tspan class="k"> The</tspan><tspan class="r"> governor</tspan><tspan class="k"> is empowered to</tspan></text>
<text x="93" y="834"><tspan class="k">direct that an act of Parliament</tspan><tspan class="b"> does not apply</tspan><tspan class="k"> to a</tspan><tspan class="r"> scheduled area</tspan><tspan class="k"> in the state</tspan></text>
<text x="93" y="856"><tspan class="k">or apply with</tspan><tspan class="b"> specified modifications and exceptions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="882" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="882"><tspan class="h" style="font-weight:700">Tribal Areas (Sixth Schedule):</tspan><tspan class="k"> The</tspan><tspan class="r"> Governor of Assam</tspan><tspan class="k"> may likewise direct that</tspan></text>
<text x="93" y="904"><tspan class="k">an act of Parliament does not apply to a</tspan><tspan class="r"> tribal area (autonomous district)</tspan><tspan class="k"> in the</tspan></text>
<text x="93" y="926"><tspan class="k">state or apply with specified modifications and exceptions. The</tspan><tspan class="r"> President</tspan><tspan class="k"> enjoys</tspan></text>
<text x="93" y="948"><tspan class="k">the same power with respect to tribal areas (autonomous districts) in</tspan><tspan class="r"> Meghalaya,</tspan></text>
<text x="93" y="970"><tspan class="r">Tripura and Mizoram</tspan><tspan class="k">.</tspan></text>
