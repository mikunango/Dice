<div id="vis-container"><h2 class="sr-only">Territorial Extent of Central and State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1100" role="img"><title>Territorial Extent of Central and State Legislation</title><desc>Territorial Extent of Central and State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="118" y="26" width="443" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Territorial Extent of Central and State Legislation</text>
<text class="lb" x="40" y="98">1. Territorial Extent of Central and State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Territorial limits:</tspan><tspan class="k"> The Constitution defines the</tspan><tspan class="r"> territorial limits</tspan><tspan class="k"> of the legislative powers</tspan></text>
<text x="56" y="150"><tspan class="k">vested in the Centre and the states in the following way:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the territory of India</tspan><tspan class="k">.</tspan></text>
<text x="93" y="198"><tspan class="k">The territory of India includes the</tspan><tspan class="b"> states</tspan><tspan class="k">, the</tspan><tspan class="b"> union territories</tspan><tspan class="k">, and</tspan><tspan class="b"> any other area</tspan></text>
<text x="93" y="220"><tspan class="k">for the time being included in the territory of India.</tspan></text>
<text x="56" y="246" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="246"><tspan class="k">A</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> can make laws for the</tspan><tspan class="r"> whole or any part of the state</tspan><tspan class="k">. The</tspan></text>
<text x="93" y="268"><tspan class="k">laws made by a state legislature are</tspan><tspan class="b"> not applicable outside the state</tspan><tspan class="k">, except when</tspan></text>
<text x="93" y="290"><tspan class="k">there is a</tspan><tspan class="r"> sufficient nexus</tspan><tspan class="k"> between the state and the object.</tspan></text>
<text x="56" y="316" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="316"><tspan class="k">The</tspan><tspan class="r"> Parliament alone</tspan><tspan class="k"> can make ‘</tspan><tspan class="r">extra-territorial legislation</tspan><tspan class="k">’. Thus, the laws of the</tspan></text>
<text x="93" y="338"><tspan class="k">Parliament are also applicable to the</tspan><tspan class="b"> Indian citizens and their property in any</tspan></text>
<text x="93" y="360"><tspan class="b">part of the world</tspan><tspan class="k">.</tspan></text>
<path d="M50 156 L44 156 L44 366 L50 366" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="374" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="392" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="190" y1="402" x2="190" y2="416" marker-end="url(#ah)"/>
<text class="sm" x="190" y="437" text-anchor="middle"><tspan class="k">whole or any part of</tspan><tspan class="r"> India</tspan></text>
<text class="sm" x="190" y="459" text-anchor="middle"><tspan class="b">states + UTs + other areas</tspan></text>
<text class="sm" x="190" y="481" text-anchor="middle"><tspan class="r">extra-territorial</tspan><tspan class="k"> also ✔</tspan></text>
<rect class="bx" x="346" y="374" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="392" text-anchor="middle"><tspan class="r" style="font-weight:700">State legislature</tspan></text>
<line class="ln" x1="490" y1="402" x2="490" y2="416" marker-end="url(#ah)"/>
<text class="sm" x="490" y="437" text-anchor="middle"><tspan class="k">whole or any part of the</tspan><tspan class="r"> state</tspan></text>
<text class="sm" x="490" y="459" text-anchor="middle"><tspan class="k">not outside the state</tspan></text>
<text class="sm" x="490" y="481" text-anchor="middle"><tspan class="k">except</tspan><tspan class="r"> sufficient nexus</tspan></text>
<line x1="340" y1="374" x2="340" y2="484" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="518"><tspan class="h" style="font-weight:700">Restrictions on Parliament:</tspan><tspan class="k"> However, the Constitution places</tspan><tspan class="r"> certain restrictions</tspan><tspan class="k"> on the</tspan></text>
<text x="56" y="540"><tspan class="b">plenary territorial jurisdiction</tspan><tspan class="k"> of the Parliament. In other words, the laws of Parliament</tspan></text>
<text x="56" y="562"><tspan class="k">are</tspan><tspan class="r"> not applicable</tspan><tspan class="k"> in the following areas:</tspan></text>
<text x="56" y="588" class="r" style="font-weight:700">(i)</text>
<text x="93" y="588"><tspan class="k">The</tspan><tspan class="r"> President</tspan><tspan class="k"> can make</tspan><tspan class="r"> regulations</tspan><tspan class="k"> for the</tspan><tspan class="b"> peace, progress and good government</tspan></text>
<text x="93" y="610"><tspan class="k">of the Union Territories of the</tspan><tspan class="r"> Andaman and Nicobar Islands, Lakshadweep, Dadra</tspan></text>
<text x="93" y="632"><tspan class="r">and Nagar Haveli and Daman and Diu and Ladakh</tspan><tspan class="k">. In the case of</tspan><tspan class="r"> Puducherry</tspan></text>
<text x="93" y="654"><tspan class="k">also, the President can legislate by making regulations but only when the</tspan></text>
<text x="93" y="676"><tspan class="b">Assembly is suspended or dissolved</tspan><tspan class="k">. A regulation so made has the</tspan><tspan class="r"> same force and</tspan></text>
<text x="93" y="698"><tspan class="r">effect as an act of Parliament</tspan><tspan class="k">. It may also</tspan><tspan class="b"> repeal or amend any act of</tspan></text>
<text x="93" y="720"><tspan class="b">Parliament</tspan><tspan class="k"> in relation to these union territories.</tspan></text>
<text x="56" y="746" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="746"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> is empowered to direct that an act of Parliament</tspan><tspan class="b"> does not apply</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="768"><tspan class="k">a</tspan><tspan class="r"> scheduled area</tspan><tspan class="k"> in the state or apply with</tspan><tspan class="b"> specified modifications and exceptions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="794" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="794"><tspan class="k">The</tspan><tspan class="r"> Governor of Assam</tspan><tspan class="k"> may likewise direct that an act of Parliament does not</tspan></text>
<text x="93" y="816"><tspan class="k">apply to a</tspan><tspan class="r"> tribal area (autonomous district)</tspan><tspan class="k"> in the state or apply with specified</tspan></text>
<text x="93" y="838"><tspan class="k">modifications and exceptions. The</tspan><tspan class="r"> President</tspan><tspan class="k"> enjoys the same power with respect</tspan></text>
<text x="93" y="860"><tspan class="k">to tribal areas (autonomous districts) in</tspan><tspan class="r"> Meghalaya, Tripura and Mizoram</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="137" y="968" text-anchor="middle"><tspan class="r">regulations for UTs</tspan></text>
<text class="sm" x="137" y="986" text-anchor="middle"><tspan class="b">A&amp;N, Lakshadweep, DNH &amp;</tspan></text>
<text class="sm" x="137" y="1004" text-anchor="middle"><tspan class="b">DD, Ladakh</tspan></text>
<text class="sm" x="137" y="1022" text-anchor="middle"><tspan class="b">Puducherry – only if</tspan></text>
<text class="sm" x="137" y="1040" text-anchor="middle"><tspan class="b">Assembly</tspan></text>
<text class="sm" x="137" y="1058" text-anchor="middle"><tspan class="b">suspended/dissolved</tspan></text>
<rect class="bx" x="243" y="948" width="193" height="122" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="995" text-anchor="middle"><tspan class="r">scheduled area</tspan></text>
<text class="sm" x="340" y="1013" text-anchor="middle"><tspan class="b">act not to apply / apply</tspan></text>
<text class="sm" x="340" y="1031" text-anchor="middle"><tspan class="b">with modifications</tspan></text>
<rect class="bx" x="447" y="948" width="193" height="122" rx="3" style="stroke:#D93A3A"/>
