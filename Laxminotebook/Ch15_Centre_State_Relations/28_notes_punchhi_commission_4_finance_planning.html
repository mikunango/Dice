<div id="vis-container"><h2 class="sr-only">Punchhi Commission – IV (Finance and Planning)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1179" role="img"><title>Punchhi Commission – IV (Finance and Planning)</title><desc>Punchhi Commission – IV (Finance and Planning)</desc>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – IV (Finance and Planning)</text>
<text x="56" y="92" class="r" style="font-weight:700">29.</text>
<text x="86" y="92"><tspan class="k">The current</tspan><tspan class="r"> ceiling on profession tax</tspan><tspan class="k"> should be</tspan><tspan class="r"> completely done away with</tspan><tspan class="k"> by a</tspan></text>
<text x="86" y="114"><tspan class="k">Constitutional amendment.</tspan></text>
<text x="56" y="140" class="r" style="font-weight:700">30.</text>
<text x="86" y="140"><tspan class="k">The scope for raising more revenue from the</tspan><tspan class="r"> taxes mentioned in article 268</tspan><tspan class="k"> should</tspan></text>
<text x="86" y="162"><tspan class="k">be examined afresh. This issue may be either referred to the</tspan><tspan class="b"> next Finance</tspan></text>
<text x="86" y="184"><tspan class="b">Commission</tspan><tspan class="k"> or an</tspan><tspan class="b"> expert committee</tspan><tspan class="k"> be appointed to look into the matter.</tspan></text>
<text x="56" y="210" class="r" style="font-weight:700">31.</text>
<text x="86" y="210"><tspan class="k">To bring greater accountability, all</tspan><tspan class="r"> fiscal legislations</tspan><tspan class="k"> should provide for an</tspan><tspan class="r"> annual</tspan></text>
<text x="86" y="232"><tspan class="r">assessment by an independent body</tspan><tspan class="k"> and the reports of these bodies should be laid</tspan></text>
<text x="86" y="254"><tspan class="k">in both Houses of Parliament/state legislature.</tspan></text>
<text x="56" y="280" class="r" style="font-weight:700">32.</text>
<text x="86" y="280"><tspan class="k">Considerations specified in the</tspan><tspan class="r"> Terms of Reference (ToR) of the Finance</tspan></text>
<text x="86" y="302"><tspan class="r">Commission</tspan><tspan class="k"> should be</tspan><tspan class="r"> even handed</tspan><tspan class="k"> as between the Centre and the states. There</tspan></text>
<text x="86" y="324"><tspan class="k">should be an effective mechanism to involve the states in the finalisation of the</tspan></text>
<text x="86" y="346"><tspan class="k">ToR of the Finance Commissions.</tspan></text>
<text x="56" y="372" class="r" style="font-weight:700">33.</text>
<text x="86" y="372"><tspan class="k">The Central Government should</tspan><tspan class="r"> review all the existing cesses and surcharges</tspan><tspan class="k"> with</tspan></text>
<text x="86" y="394"><tspan class="k">a view to bringing down their share in the gross tax revenue.</tspan></text>
<text x="56" y="420" class="r" style="font-weight:700">34.</text>
<text x="86" y="420"><tspan class="k">Because of the close linkages between the</tspan><tspan class="r"> plan and non-plan expenditure</tspan><tspan class="k">, an</tspan></text>
<text x="86" y="442"><tspan class="b">expert committee</tspan><tspan class="k"> may be appointed to look into the issue of distinction between</tspan></text>
<text x="86" y="464"><tspan class="k">the plan and non-plan expenditure.</tspan></text>
<text x="56" y="490" class="r" style="font-weight:700">35.</text>
<text x="86" y="490"><tspan class="k">There should be much better</tspan><tspan class="r"> coordination between the Finance Commission and</tspan></text>
<text x="86" y="512"><tspan class="r">the Planning Commission</tspan><tspan class="k">. The</tspan><tspan class="b"> synchronisation of the periods</tspan><tspan class="k"> covered by the</tspan></text>
<text x="86" y="534"><tspan class="k">Finance Commission and the Five-Year Plan will considerably improve such</tspan></text>
<text x="86" y="556"><tspan class="k">coordination.</tspan></text>
<text x="56" y="582" class="r" style="font-weight:700">36.</text>
<text x="86" y="582"><tspan class="k">The</tspan><tspan class="r"> Finance Commission division</tspan><tspan class="k"> in the Ministry of Finance should be converted</tspan></text>
<text x="86" y="604"><tspan class="k">into a</tspan><tspan class="r"> full-fledged department</tspan><tspan class="k">, serving as the</tspan><tspan class="b"> permanent secretariat for the</tspan></text>
<text x="86" y="626"><tspan class="b">Finance Commissions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="652" class="r" style="font-weight:700">37.</text>
<text x="86" y="652"><tspan class="k">The</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> has a crucial role in the current situation. But its role</tspan></text>
<text x="86" y="674"><tspan class="k">should be that of</tspan><tspan class="r"> coordination</tspan><tspan class="k"> rather that of</tspan><tspan class="b"> micro managing sectoral plans</tspan><tspan class="k"> of the</tspan></text>
<text x="86" y="696"><tspan class="k">Central ministries and the states.</tspan></text>
<text x="56" y="722" class="r" style="font-weight:700">38.</text>
<text x="86" y="722"><tspan class="k">Steps should be taken for the setting up of an</tspan><tspan class="r"> Inter-State Trade and Commerce</tspan></text>
<text x="86" y="744"><tspan class="r">Commission</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 307</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 42 of List-I</tspan><tspan class="k">. This Commission</tspan></text>
<text x="86" y="766"><tspan class="k">should be vested with both</tspan><tspan class="b"> advisory and executive roles</tspan><tspan class="k"> with decision making</tspan></text>
<text x="86" y="788"><tspan class="k">powers. As a Constitutional body, the decisions of the Commission should be</tspan><tspan class="r"> final</tspan></text>
<text x="86" y="810"><tspan class="r">and binding</tspan><tspan class="k"> on all states as well as the Union of India. Any party aggrieved with</tspan></text>
<text x="86" y="832"><tspan class="k">the decision of the Commission may prefer an</tspan><tspan class="r"> appeal to the Supreme Court</tspan><tspan class="k">.</tspan></text>

<text x="44" y="974"><tspan class="h" style="font-weight:700">ISC Standing Committee:</tspan><tspan class="k"> The recommendations contained in the Report of the Punchhi</tspan></text>
<text x="56" y="996"><tspan class="k">Commission have been considered by the</tspan><tspan class="r"> Standing Committee of the Inter-State Council</tspan></text>
<text x="56" y="1018"><tspan class="k">in its meetings held in</tspan><tspan class="r"> 2017 and 2018</tspan><tspan class="k">. The recommendations of the Commission along</tspan></text>
<text x="56" y="1040"><tspan class="k">with the recommendations of the Standing Committee thereon, have been</tspan><tspan class="b"> circulated to</tspan></text>
<text x="56" y="1062"><tspan class="b">the state governments for comments²³</tspan><tspan class="k">.</tspan></text>
