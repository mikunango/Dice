<svg class="n" width="100%" viewBox="0 0 680 1291" role="img"><title>Punchhi Commission – IV (Finance and Planning)</title><desc>Punchhi Commission – IV (Finance and Planning)</desc>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – IV (Finance and Planning)</text>
<text x="56" y="92" class="r" style="font-weight:700">29.</text>
<text x="86" y="92"><tspan class="k">The current</tspan><tspan class="r"> ceiling on profession tax</tspan><tspan class="k"> should be</tspan><tspan class="r"> completely done away with</tspan><tspan class="k"> by a</tspan></text>
<text x="86" y="114"><tspan class="k">Constitutional amendment.</tspan></text>
<text x="56" y="140" class="r" style="font-weight:700">30.</text>
<text x="86" y="140"><tspan class="k">The scope for raising more revenue from the</tspan><tspan class="r"> taxes mentioned in article 268</tspan><tspan class="k"> should</tspan></text>
<text x="86" y="162"><tspan class="k">be examined afresh.</tspan></text>
<text x="86" y="187"><tspan class="h" style="font-weight:700">Refer to FC / experts:</tspan><tspan class="k"> This issue may be either referred to the</tspan><tspan class="b"> next Finance</tspan></text>
<text x="98" y="209"><tspan class="b">Commission</tspan><tspan class="k"> or an</tspan><tspan class="b"> expert committee</tspan><tspan class="k"> be appointed to look into the matter.</tspan></text>
<text x="56" y="235" class="r" style="font-weight:700">31.</text>
<text x="86" y="235"><tspan class="k">To bring greater accountability, all</tspan><tspan class="r"> fiscal legislations</tspan><tspan class="k"> should provide for an</tspan><tspan class="r"> annual</tspan></text>
<text x="86" y="257"><tspan class="r">assessment by an independent body</tspan><tspan class="k"> and the reports of these bodies should be laid</tspan></text>
<text x="86" y="279"><tspan class="k">in both Houses of Parliament/state legislature.</tspan></text>
<text x="56" y="305" class="r" style="font-weight:700">32.</text>
<text x="86" y="305"><tspan class="k">Considerations specified in the</tspan><tspan class="r"> Terms of Reference (ToR) of the Finance</tspan></text>
<text x="86" y="327"><tspan class="r">Commission</tspan><tspan class="k"> should be</tspan><tspan class="r"> even handed</tspan><tspan class="k"> as between the Centre and the states.</tspan></text>
<text x="86" y="352"><tspan class="h" style="font-weight:700">States in ToR:</tspan><tspan class="k"> There should be an effective mechanism to involve the states in</tspan></text>
<text x="98" y="374"><tspan class="k">the finalisation of the ToR of the Finance Commissions.</tspan></text>
<text x="56" y="400" class="r" style="font-weight:700">33.</text>
<text x="86" y="400"><tspan class="k">The Central Government should</tspan><tspan class="r"> review all the existing cesses and surcharges</tspan><tspan class="k"> with</tspan></text>
<text x="86" y="422"><tspan class="k">a view to bringing down their share in the gross tax revenue.</tspan></text>
<text x="56" y="448" class="r" style="font-weight:700">34.</text>
<text x="86" y="448"><tspan class="k">Because of the close linkages between the</tspan><tspan class="r"> plan and non-plan expenditure</tspan><tspan class="k">, an</tspan></text>
<text x="86" y="470"><tspan class="b">expert committee</tspan><tspan class="k"> may be appointed to look into the issue of distinction between</tspan></text>
<text x="86" y="492"><tspan class="k">the plan and non-plan expenditure.</tspan></text>
<text x="56" y="518" class="r" style="font-weight:700">35.</text>
<text x="86" y="518"><tspan class="k">There should be much better</tspan><tspan class="r"> coordination between the Finance Commission and</tspan></text>
<text x="86" y="540"><tspan class="r">the Planning Commission</tspan><tspan class="k">.</tspan></text>
<text x="86" y="565"><tspan class="h" style="font-weight:700">Synchronise periods:</tspan><tspan class="k"> The</tspan><tspan class="b"> synchronisation of the periods</tspan><tspan class="k"> covered by the Finance</tspan></text>
<text x="98" y="587"><tspan class="k">Commission and the Five-Year Plan will considerably improve such coordination.</tspan></text>
<text x="56" y="613" class="r" style="font-weight:700">36.</text>
<text x="86" y="613"><tspan class="k">The</tspan><tspan class="r"> Finance Commission division</tspan><tspan class="k"> in the Ministry of Finance should be converted</tspan></text>
<text x="86" y="635"><tspan class="k">into a</tspan><tspan class="r"> full-fledged department</tspan><tspan class="k">, serving as the</tspan><tspan class="b"> permanent secretariat for the</tspan></text>
<text x="86" y="657"><tspan class="b">Finance Commissions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="683" class="r" style="font-weight:700">37.</text>
<text x="86" y="683"><tspan class="k">The</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> has a crucial role in the current situation.</tspan></text>
<text x="86" y="708"><tspan class="h" style="font-weight:700">Coordination role:</tspan><tspan class="k"> But its role should be that of</tspan><tspan class="r"> coordination</tspan><tspan class="k"> rather that of</tspan></text>
<text x="98" y="730"><tspan class="b">micro managing sectoral plans</tspan><tspan class="k"> of the Central ministries and the states.</tspan></text>
<text x="56" y="756" class="r" style="font-weight:700">38.</text>
<text x="86" y="756"><tspan class="k">Steps should be taken for the setting up of an</tspan><tspan class="r"> Inter-State Trade and Commerce</tspan></text>
<text x="86" y="778"><tspan class="r">Commission</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 307</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 42 of List-I</tspan><tspan class="k">. This Commission</tspan></text>
<text x="86" y="800"><tspan class="k">should be vested with both</tspan><tspan class="b"> advisory and executive roles</tspan><tspan class="k"> with decision making</tspan></text>
<text x="86" y="822"><tspan class="k">powers.</tspan></text>
<text x="86" y="847"><tspan class="h" style="font-weight:700">Final &amp; binding:</tspan><tspan class="k"> As a Constitutional body, the decisions of the Commission</tspan></text>
<text x="98" y="869"><tspan class="k">should be</tspan><tspan class="r"> final and binding</tspan><tspan class="k"> on all states as well as the Union of India.</tspan></text>
<text x="86" y="894"><tspan class="h" style="font-weight:700">Appeal to SC:</tspan><tspan class="k"> Any party aggrieved with the decision of the Commission may</tspan></text>
<text x="98" y="916"><tspan class="k">prefer an</tspan><tspan class="r"> appeal to the Supreme Court</tspan><tspan class="k">.</tspan></text>

<text x="44" y="1058"><tspan class="h" style="font-weight:700">ISC Standing Committee:</tspan><tspan class="k"> The recommendations contained in the Report of the Punchhi</tspan></text>
