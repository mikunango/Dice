<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – IV (Finance and Planning)</text>
<text x="56" y="92" class="r" style="font-weight:700">29.</text>
<text x="86" y="92"><tspan class="h" style="font-weight:700">Abolish profession tax ceiling:</tspan><tspan class="k"> The current</tspan><tspan class="r"> ceiling on profession tax</tspan><tspan class="k"> should be</tspan></text>
<text x="86" y="114"><tspan class="r">completely done away with</tspan><tspan class="k"> by a Constitutional amendment.</tspan></text>
<text x="56" y="140" class="r" style="font-weight:700">30.</text>
<text x="86" y="140"><tspan class="h" style="font-weight:700">Revenue from Art. 268 taxes:</tspan><tspan class="k"> The scope for raising more revenue from the</tspan><tspan class="r"> taxes</tspan></text>
<text x="86" y="162"><tspan class="r">mentioned in article 268</tspan><tspan class="k"> should be examined afresh. This issue may be either</tspan></text>
<text x="86" y="184"><tspan class="k">referred to the</tspan><tspan class="b"> next Finance Commission</tspan><tspan class="k"> or an</tspan><tspan class="b"> expert committee</tspan><tspan class="k"> be appointed to</tspan></text>
<text x="86" y="206"><tspan class="k">look into the matter.</tspan></text>
<text x="56" y="232" class="r" style="font-weight:700">31.</text>
<text x="86" y="232"><tspan class="h" style="font-weight:700">Fiscal accountability:</tspan><tspan class="k"> To bring greater accountability, all</tspan><tspan class="r"> fiscal legislations</tspan><tspan class="k"> should</tspan></text>
<text x="86" y="254"><tspan class="k">provide for an</tspan><tspan class="r"> annual assessment by an independent body</tspan><tspan class="k"> and the reports of these</tspan></text>
<text x="86" y="276"><tspan class="k">bodies should be laid in both Houses of Parliament/state legislature.</tspan></text>
<text x="56" y="302" class="r" style="font-weight:700">32.</text>
<text x="86" y="302"><tspan class="h" style="font-weight:700">Even-handed ToR:</tspan><tspan class="k"> Considerations specified in the</tspan><tspan class="r"> Terms of Reference (ToR) of</tspan></text>
<text x="86" y="324"><tspan class="r">the Finance Commission</tspan><tspan class="k"> should be</tspan><tspan class="r"> even handed</tspan><tspan class="k"> as between the Centre and the</tspan></text>
<text x="86" y="346"><tspan class="k">states. There should be an effective mechanism to involve the states in the</tspan></text>
<text x="86" y="368"><tspan class="k">finalisation of the ToR of the Finance Commissions.</tspan></text>
<text x="56" y="394" class="r" style="font-weight:700">33.</text>
<text x="86" y="394"><tspan class="h" style="font-weight:700">Review cesses &amp; surcharges:</tspan><tspan class="k"> The Central Government should</tspan><tspan class="r"> review all the</tspan></text>
<text x="86" y="416"><tspan class="r">existing cesses and surcharges</tspan><tspan class="k"> with a view to bringing down their share in the</tspan></text>
<text x="86" y="438"><tspan class="k">gross tax revenue.</tspan></text>
<text x="56" y="464" class="r" style="font-weight:700">34.</text>
<text x="86" y="464"><tspan class="h" style="font-weight:700">Plan vs non-plan expenditure:</tspan><tspan class="k"> Because of the close linkages between the</tspan><tspan class="r"> plan</tspan></text>
<text x="86" y="486"><tspan class="r">and non-plan expenditure</tspan><tspan class="k">, an</tspan><tspan class="b"> expert committee</tspan><tspan class="k"> may be appointed to look into the</tspan></text>
<text x="86" y="508"><tspan class="k">issue of distinction between the plan and non-plan expenditure.</tspan></text>
<text x="56" y="534" class="r" style="font-weight:700">35.</text>
<text x="86" y="534"><tspan class="h" style="font-weight:700">FC–Plan synchronisation:</tspan><tspan class="k"> There should be much better</tspan><tspan class="r"> coordination between the</tspan></text>
<text x="86" y="556"><tspan class="r">Finance Commission and the Planning Commission</tspan><tspan class="k">. The</tspan><tspan class="b"> synchronisation of the</tspan></text>
<text x="86" y="578"><tspan class="b">periods</tspan><tspan class="k"> covered by the Finance Commission and the Five-Year Plan will</tspan></text>
<text x="86" y="600"><tspan class="k">considerably improve such coordination.</tspan></text>
<text x="56" y="626" class="r" style="font-weight:700">36.</text>
<text x="86" y="626"><tspan class="h" style="font-weight:700">Permanent FC secretariat:</tspan><tspan class="k"> The</tspan><tspan class="r"> Finance Commission division</tspan><tspan class="k"> in the Ministry of</tspan></text>
<text x="86" y="648"><tspan class="k">Finance should be converted into a</tspan><tspan class="r"> full-fledged department</tspan><tspan class="k">, serving as the</tspan></text>
<text x="86" y="670"><tspan class="b">permanent secretariat for the Finance Commissions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="696" class="r" style="font-weight:700">37.</text>
<text x="86" y="696"><tspan class="h" style="font-weight:700">Planning Commission as coordinator:</tspan><tspan class="k"> The</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> has a crucial role</tspan></text>
<text x="86" y="718"><tspan class="k">in the current situation. But its role should be that of</tspan><tspan class="r"> coordination</tspan><tspan class="k"> rather that of</tspan></text>
<text x="86" y="740"><tspan class="b">micro managing sectoral plans</tspan><tspan class="k"> of the Central ministries and the states.</tspan></text>
<text x="56" y="766" class="r" style="font-weight:700">38.</text>
<text x="86" y="766"><tspan class="h" style="font-weight:700">Inter-State Trade &amp; Commerce Commission:</tspan><tspan class="k"> Steps should be taken for the</tspan></text>
<text x="86" y="788"><tspan class="k">setting up of an</tspan><tspan class="r"> Inter-State Trade and Commerce Commission</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 307</tspan></text>
<text x="86" y="810"><tspan class="k">read with</tspan><tspan class="r"> Entry 42 of List-I</tspan><tspan class="k">. This Commission should be vested with both</tspan></text>
<text x="86" y="832"><tspan class="b">advisory and executive roles</tspan><tspan class="k"> with decision making powers. As a Constitutional body,</tspan></text>
<text x="86" y="854"><tspan class="k">the decisions of the Commission should be</tspan><tspan class="r"> final and binding</tspan><tspan class="k"> on all states as well</tspan></text>
<text x="86" y="876"><tspan class="k">as the Union of India. Any party aggrieved with the decision of the Commission</tspan></text>
<text x="86" y="898"><tspan class="k">may prefer an</tspan><tspan class="r"> appeal to the Supreme Court</tspan><tspan class="k">.</tspan></text>

<text x="44" y="1040"><tspan class="h" style="font-weight:700">Status of implementation:</tspan><tspan class="k"> The recommendations contained in the Report of the</tspan></text>
<text x="56" y="1062"><tspan class="k">Punchhi Commission have been considered by the</tspan><tspan class="r"> Standing Committee of the Inter-State</tspan></text>
<text x="56" y="1084"><tspan class="r">Council</tspan><tspan class="k"> in its meetings held in</tspan><tspan class="r"> 2017 and 2018</tspan><tspan class="k">. The recommendations of the Commission</tspan></text>
<text x="56" y="1106"><tspan class="k">along with the recommendations of the Standing Committee thereon, have been</tspan></text>
<text x="56" y="1128"><tspan class="b">circulated to the state governments for comments²³</tspan><tspan class="k">.</tspan></text>
