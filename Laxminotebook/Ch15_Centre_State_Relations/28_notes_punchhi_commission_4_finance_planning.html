<div id="vis-container"><h2 class="sr-only">Punchhi Commission – IV (Finance and Planning)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1281" role="img"><title>Punchhi Commission – IV (Finance and Planning)</title><desc>Punchhi Commission – IV (Finance and Planning)</desc>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – IV (Finance and Planning)</text>
<text x="56" y="92" class="r" style="font-weight:700">29.</text>
<text x="86" y="92"><tspan class="k">The current</tspan><tspan class="r"> ceiling on profession tax</tspan><tspan class="k"> should be</tspan><tspan class="r"> completely done away with</tspan><tspan class="k"> by a</tspan></text>
<text x="86" y="114"><tspan class="k">Constitutional amendment.</tspan></text>
<text x="56" y="140" class="r" style="font-weight:700">30.</text>
<text x="86" y="140"><tspan class="k">The scope for raising more revenue from the</tspan><tspan class="r"> taxes mentioned in article 268</tspan><tspan class="k"> should</tspan></text>
<text x="86" y="162"><tspan class="k">be examined afresh.</tspan></text>
<text x="86" y="186" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="186"><tspan class="k">This issue may be either referred to the</tspan><tspan class="b"> next Finance Commission</tspan><tspan class="k"> or an</tspan><tspan class="b"> expert</tspan></text>
<text x="100" y="208"><tspan class="b">committee</tspan><tspan class="k"> be appointed to look into the matter.</tspan></text>
<text x="56" y="234" class="r" style="font-weight:700">31.</text>
<text x="86" y="234"><tspan class="k">To bring greater accountability, all</tspan><tspan class="r"> fiscal legislations</tspan><tspan class="k"> should provide for an</tspan><tspan class="r"> annual</tspan></text>
<text x="86" y="256"><tspan class="r">assessment by an independent body</tspan><tspan class="k"> and the reports of these bodies should be laid</tspan></text>
<text x="86" y="278"><tspan class="k">in both Houses of Parliament/state legislature.</tspan></text>
<text x="56" y="304" class="r" style="font-weight:700">32.</text>
<text x="86" y="304"><tspan class="k">Considerations specified in the</tspan><tspan class="r"> Terms of Reference (ToR) of the Finance</tspan></text>
<text x="86" y="326"><tspan class="r">Commission</tspan><tspan class="k"> should be</tspan><tspan class="r"> even handed</tspan><tspan class="k"> as between the Centre and the states.</tspan></text>
<text x="86" y="350" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="350"><tspan class="k">There should be an effective mechanism to involve the states in the finalisation</tspan></text>
<text x="100" y="372"><tspan class="k">of the ToR of the Finance Commissions.</tspan></text>
<text x="56" y="398" class="r" style="font-weight:700">33.</text>
<text x="86" y="398"><tspan class="k">The Central Government should</tspan><tspan class="r"> review all the existing cesses and surcharges</tspan><tspan class="k"> with</tspan></text>
<text x="86" y="420"><tspan class="k">a view to bringing down their share in the gross tax revenue.</tspan></text>
<text x="56" y="446" class="r" style="font-weight:700">34.</text>
<text x="86" y="446"><tspan class="k">Because of the close linkages between the</tspan><tspan class="r"> plan and non-plan expenditure</tspan><tspan class="k">, an</tspan></text>
<text x="86" y="468"><tspan class="b">expert committee</tspan><tspan class="k"> may be appointed to look into the issue of distinction between</tspan></text>
<text x="86" y="490"><tspan class="k">the plan and non-plan expenditure.</tspan></text>
<text x="56" y="516" class="r" style="font-weight:700">35.</text>
<text x="86" y="516"><tspan class="k">There should be much better</tspan><tspan class="r"> coordination between the Finance Commission and</tspan></text>
<text x="86" y="538"><tspan class="r">the Planning Commission</tspan><tspan class="k">.</tspan></text>
<text x="86" y="562" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="562"><tspan class="k">The</tspan><tspan class="b"> synchronisation of the periods</tspan><tspan class="k"> covered by the Finance Commission and the</tspan></text>
<text x="100" y="584"><tspan class="k">Five-Year Plan will considerably improve such coordination.</tspan></text>
<text x="56" y="610" class="r" style="font-weight:700">36.</text>
<text x="86" y="610"><tspan class="k">The</tspan><tspan class="r"> Finance Commission division</tspan><tspan class="k"> in the Ministry of Finance should be converted</tspan></text>
<text x="86" y="632"><tspan class="k">into a</tspan><tspan class="r"> full-fledged department</tspan><tspan class="k">, serving as the</tspan><tspan class="b"> permanent secretariat for the</tspan></text>
<text x="86" y="654"><tspan class="b">Finance Commissions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="680" class="r" style="font-weight:700">37.</text>
<text x="86" y="680"><tspan class="k">The</tspan><tspan class="r"> Planning Commission</tspan><tspan class="k"> has a crucial role in the current situation.</tspan></text>
<text x="86" y="704" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="704"><tspan class="k">But its role should be that of</tspan><tspan class="r"> coordination</tspan><tspan class="k"> rather that of</tspan><tspan class="b"> micro managing</tspan></text>
<text x="100" y="726"><tspan class="b">sectoral plans</tspan><tspan class="k"> of the Central ministries and the states.</tspan></text>
<text x="56" y="752" class="r" style="font-weight:700">38.</text>
<text x="86" y="752"><tspan class="k">Steps should be taken for the setting up of an</tspan><tspan class="r"> Inter-State Trade and Commerce</tspan></text>
<text x="86" y="774"><tspan class="r">Commission</tspan><tspan class="k"> under</tspan><tspan class="r"> Article 307</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 42 of List-I</tspan><tspan class="k">. This Commission</tspan></text>
<text x="86" y="796"><tspan class="k">should be vested with both</tspan><tspan class="b"> advisory and executive roles</tspan><tspan class="k"> with decision making</tspan></text>
<text x="86" y="818"><tspan class="k">powers.</tspan></text>
<text x="86" y="842" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="842"><tspan class="k">As a Constitutional body, the decisions of the Commission should be</tspan><tspan class="r"> final and</tspan></text>
<text x="100" y="864"><tspan class="r">binding</tspan><tspan class="k"> on all states as well as the Union of India.</tspan></text>
<text x="86" y="888" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="100" y="888"><tspan class="k">Any party aggrieved with the decision of the Commission may prefer an</tspan><tspan class="r"> appeal</tspan></text>
<text x="100" y="910"><tspan class="r">to the Supreme Court</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="440" y="1013" text-anchor="middle"><tspan class="k">appeal →</tspan><tspan class="r"> Supreme Court</tspan></text>
<text x="44" y="1050" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1050"><tspan class="k">The recommendations contained in the Report of the Punchhi Commission have been</tspan></text>
<text x="58" y="1072"><tspan class="k">considered by the</tspan><tspan class="r"> Standing Committee of the Inter-State Council</tspan><tspan class="k"> in its meetings held</tspan></text>
<text x="58" y="1094"><tspan class="k">in</tspan><tspan class="r"> 2017 and 2018</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1120" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1120"><tspan class="k">The recommendations of the Commission along with the recommendations of the</tspan></text>
<text x="58" y="1142"><tspan class="k">Standing Committee thereon, have been</tspan><tspan class="b"> circulated to the state governments for</tspan></text>
<text x="58" y="1164"><tspan class="b">comments²³</tspan><tspan class="k">.</tspan></text>
