<div id="vis-container"><h2 class="sr-only">Articles at a Glance – Financial Relations</h2>
<svg class="n" width="100%" viewBox="0 0 680 1339" role="img"><title>Articles at a Glance – Financial Relations</title><desc>Articles at a Glance – Financial Relations</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Articles at a Glance – Financial Relations</text>
<text x="40" y="96"><tspan class="r" style="font-weight:700">Table 15.3 Articles Related to Centre-State Financial Relations at a Glance</tspan></text>
<text class="sm" x="95" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Article No.</tspan></text>
<text class="sm" x="395" y="126" text-anchor="middle"><tspan class="r" style="font-weight:700">Subject Matter</tspan></text>
<line class="gx" x1="40" y1="137" x2="640" y2="137"/>
<rect x="40" y="137" width="600" height="30" fill="#D93A3A" fill-opacity="0.08"/>
<text class="sm" x="340" y="157" text-anchor="middle"><tspan class="r" style="font-weight:700">Distribution of Revenues between the Union and the States</tspan></text>
<line class="gx" x1="40" y1="167" x2="640" y2="167"/>
<text class="sm" x="47" y="187"><tspan class="r">268.</tspan></text>
<text class="sm" x="157" y="187"><tspan class="k">Duties levied by the Union but collected and appropriated by the states</tspan></text>
<line class="gx" x1="40" y1="198" x2="640" y2="198"/>
<text class="sm" x="47" y="218"><tspan class="r">268A.</tspan></text>
<text class="sm" x="157" y="218"><tspan class="k">Service tax levied by the Union and collected and appropriated by the Union</tspan></text>
<text class="sm" x="157" y="237"><tspan class="k">and the states</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="248" x2="640" y2="248"/>
<text class="sm" x="47" y="268"><tspan class="r">269.</tspan></text>
<text class="sm" x="157" y="268"><tspan class="k">Taxes levied and collected by the Union but assigned to the states</tspan></text>
<line class="gx" x1="40" y1="279" x2="640" y2="279"/>
<text class="sm" x="47" y="299"><tspan class="r">269A.</tspan></text>
<text class="sm" x="157" y="299"><tspan class="k">Levy and collection of goods and services tax in course of inter-state trade</tspan></text>
<text class="sm" x="157" y="318"><tspan class="k">or commerce</tspan></text>
<line class="gx" x1="40" y1="329" x2="640" y2="329"/>
<text class="sm" x="47" y="349"><tspan class="r">270.</tspan></text>
<text class="sm" x="157" y="349"><tspan class="k">Taxes levied and distributed between the Union and the states</tspan></text>
<line class="gx" x1="40" y1="360" x2="640" y2="360"/>
<text class="sm" x="47" y="380"><tspan class="r">271.</tspan></text>
<text class="sm" x="157" y="380"><tspan class="k">Surcharge on certain duties and taxes for purposes of the Union</tspan></text>
<line class="gx" x1="40" y1="391" x2="640" y2="391"/>
<text class="sm" x="47" y="411"><tspan class="r">272.</tspan></text>
<text class="sm" x="157" y="411"><tspan class="k">Taxes which are levied and collected by the Union and may be distributed</tspan></text>
<text class="sm" x="157" y="430"><tspan class="k">between the Union and the states</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="441" x2="640" y2="441"/>
<text class="sm" x="47" y="461"><tspan class="r">273.</tspan></text>
<text class="sm" x="157" y="461"><tspan class="k">Grants in lieu of export duty on jute and jute products</tspan></text>
<line class="gx" x1="40" y1="472" x2="640" y2="472"/>
<text class="sm" x="47" y="492"><tspan class="r">274.</tspan></text>
<text class="sm" x="157" y="492"><tspan class="k">Prior recommendation of the President required to bills affecting taxation in</tspan></text>
<text class="sm" x="157" y="511"><tspan class="k">which states are interested</tspan></text>
<line class="gx" x1="40" y1="522" x2="640" y2="522"/>
<text class="sm" x="47" y="542"><tspan class="r">275.</tspan></text>
<text class="sm" x="157" y="542"><tspan class="k">Grants from the Union to certain states</tspan></text>
<line class="gx" x1="40" y1="553" x2="640" y2="553"/>
<text class="sm" x="47" y="573"><tspan class="r">276.</tspan></text>
<text class="sm" x="157" y="573"><tspan class="k">Taxes on professions, trades, callings and employments</tspan></text>
<line class="gx" x1="40" y1="584" x2="640" y2="584"/>
<text class="sm" x="47" y="604"><tspan class="r">277.</tspan></text>
<text class="sm" x="157" y="604"><tspan class="k">Savings</tspan></text>
<line class="gx" x1="40" y1="615" x2="640" y2="615"/>
<text class="sm" x="47" y="635"><tspan class="r">278.</tspan></text>
<text class="sm" x="157" y="635"><tspan class="k">Agreement with states in Part B of the First Schedule with regard to</tspan></text>
<text class="sm" x="157" y="654"><tspan class="k">certain financial matters</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="665" x2="640" y2="665"/>
<text class="sm" x="47" y="685"><tspan class="r">279.</tspan></text>
<text class="sm" x="157" y="685"><tspan class="k">Calculation of “net proceeds”, etc.</tspan></text>
<line class="gx" x1="40" y1="696" x2="640" y2="696"/>
<text class="sm" x="47" y="716"><tspan class="r">279A.</tspan></text>
<text class="sm" x="157" y="716"><tspan class="k">Goods and Services Tax Council</tspan></text>
<line class="gx" x1="40" y1="727" x2="640" y2="727"/>
<text class="sm" x="47" y="747"><tspan class="r">280.</tspan></text>
<text class="sm" x="157" y="747"><tspan class="k">Finance Commission</tspan></text>
<line class="gx" x1="40" y1="758" x2="640" y2="758"/>
<text class="sm" x="47" y="778"><tspan class="r">281.</tspan></text>
<text class="sm" x="157" y="778"><tspan class="k">Recommendations of the Finance Commission</tspan></text>
<line class="gx" x1="40" y1="789" x2="640" y2="789"/>
<rect x="40" y="789" width="600" height="30" fill="#D93A3A" fill-opacity="0.08"/>
<text class="sm" x="340" y="809" text-anchor="middle"><tspan class="r" style="font-weight:700">Miscellaneous Financial Provisions</tspan></text>
<line class="gx" x1="40" y1="819" x2="640" y2="819"/>
<text class="sm" x="47" y="839"><tspan class="r">282.</tspan></text>
<text class="sm" x="157" y="839"><tspan class="k">Expenditure defrayable by the Union or a state out of its revenues</tspan></text>
<line class="gx" x1="40" y1="850" x2="640" y2="850"/>
<text class="sm" x="47" y="870"><tspan class="r">283.</tspan></text>
<text class="sm" x="157" y="870"><tspan class="k">Custody, etc., of Consolidated Funds, Contingency Funds and moneys</tspan></text>
<text class="sm" x="157" y="889"><tspan class="k">credited to the public accounts</tspan></text>
<line class="gx" x1="40" y1="900" x2="640" y2="900"/>
<text class="sm" x="47" y="920"><tspan class="r">284.</tspan></text>
<text class="sm" x="157" y="920"><tspan class="k">Custody of suitors’ deposits and other moneys received by public servants</tspan></text>
<text class="sm" x="157" y="939"><tspan class="k">and courts</tspan></text>
<line class="gx" x1="40" y1="950" x2="640" y2="950"/>
<text class="sm" x="47" y="970"><tspan class="r">285.</tspan></text>
<text class="sm" x="157" y="970"><tspan class="k">Exemption of property of the Union from state taxation</tspan></text>
<line class="gx" x1="40" y1="981" x2="640" y2="981"/>
<text class="sm" x="47" y="1001"><tspan class="r">286.</tspan></text>
<text class="sm" x="157" y="1001"><tspan class="k">Restrictions as to imposition of tax on the sale or purchase of goods</tspan></text>
<line class="gx" x1="40" y1="1012" x2="640" y2="1012"/>
<text class="sm" x="47" y="1032"><tspan class="r">287.</tspan></text>
<text class="sm" x="157" y="1032"><tspan class="k">Exemption from taxes on electricity</tspan></text>
<line class="gx" x1="40" y1="1043" x2="640" y2="1043"/>
<text class="sm" x="47" y="1063"><tspan class="r">288.</tspan></text>
<text class="sm" x="157" y="1063"><tspan class="k">Exemption from taxation by states in respect of water or electricity in</tspan></text>
<text class="sm" x="157" y="1082"><tspan class="k">certain cases</tspan></text>
<line class="gx" x1="40" y1="1093" x2="640" y2="1093"/>
<text class="sm" x="47" y="1113"><tspan class="r">289.</tspan></text>
<text class="sm" x="157" y="1113"><tspan class="k">Exemption of property and income of a state from Union taxation</tspan></text>
<line class="gx" x1="40" y1="1124" x2="640" y2="1124"/>
<text class="sm" x="47" y="1144"><tspan class="r">290.</tspan></text>
<text class="sm" x="157" y="1144"><tspan class="k">Adjustment in respect of certain expenses and pensions</tspan></text>
<line class="gx" x1="40" y1="1155" x2="640" y2="1155"/>
<text class="sm" x="47" y="1175"><tspan class="r">290A.</tspan></text>
<text class="sm" x="157" y="1175"><tspan class="k">Annual payment to certain Devaswom Funds</tspan></text>
<line class="gx" x1="40" y1="1186" x2="640" y2="1186"/>
<text class="sm" x="47" y="1206"><tspan class="r">291.</tspan></text>
<text class="sm" x="157" y="1206"><tspan class="k">Privy purse sums of Rulers</tspan><tspan class="b"> (Repealed)</tspan></text>
<line class="gx" x1="40" y1="1217" x2="640" y2="1217"/>
<rect x="40" y="1217" width="600" height="30" fill="#D93A3A" fill-opacity="0.08"/>
<text class="sm" x="340" y="1237" text-anchor="middle"><tspan class="r" style="font-weight:700">Borrowing</tspan></text>
<line class="gx" x1="40" y1="1247" x2="640" y2="1247"/>
<text class="sm" x="47" y="1267"><tspan class="r">292.</tspan></text>
<text class="sm" x="157" y="1267"><tspan class="k">Borrowing by the Government of India</tspan></text>
<line class="gx" x1="40" y1="1278" x2="640" y2="1278"/>

<text class="sm" x="157" y="1298"><tspan class="k">Borrowing by States</tspan></text>
