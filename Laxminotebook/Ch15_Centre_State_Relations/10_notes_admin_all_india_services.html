<title>All-India Services</title>

<div id="vis-container"><h2 class="sr-only">All-India Services</h2>
<svg class="n" width="100%" viewBox="0 0 680 1543" role="img"><title>All-India Services</title><desc>All-India Services</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="244" y="26" width="192" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">All-India Services</text>
<text class="lb" x="40" y="98">6. All-India Services</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">Like in any other federation, the Centre and the states also have their separate public</tspan></text>
<text x="58" y="148"><tspan class="k">services called as the</tspan><tspan class="r"> Central Services</tspan><tspan class="k"> and the</tspan><tspan class="r"> State Services</tspan><tspan class="k"> respectively.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">In addition, there are</tspan><tspan class="r"> All-India Services—IAS, IPS and IFoS</tspan><tspan class="k">.</tspan></text>
<text x="44" y="200" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="200"><tspan class="k">The members of these services occupy</tspan><tspan class="b"> top positions (or key posts)</tspan><tspan class="k"> under both the</tspan></text>
<text x="58" y="222"><tspan class="k">Centre and the states and serve them</tspan><tspan class="b"> by turns</tspan><tspan class="k">.</tspan></text>
<text x="44" y="248" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="248"><tspan class="k">But, they are</tspan><tspan class="r"> recruited and trained by the Centre</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="254" x2="340" y2="266"/>
<line class="ln" x1="140" y1="266" x2="540" y2="266"/>
<line class="ln" x1="140" y1="266" x2="140" y2="282" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="266" x2="340" y2="282" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="266" x2="540" y2="282" marker-end="url(#ah)"/>
<text class="sm" x="140" y="302" text-anchor="middle"><tspan class="r">Central Services</tspan></text>
<text class="sm" x="340" y="302" text-anchor="middle"><tspan class="r" style="font-weight:700">All-India Services</tspan></text>
<text class="sm" x="540" y="302" text-anchor="middle"><tspan class="r">State Services</tspan></text>
<line class="ln" x1="340" y1="312" x2="340" y2="324"/>
<line class="ln" x1="140" y1="324" x2="540" y2="324"/>
<line class="ln" x1="140" y1="324" x2="140" y2="340" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="324" x2="340" y2="340" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="324" x2="540" y2="340" marker-end="url(#ah)"/>
<text class="sm" x="140" y="360" text-anchor="middle"><tspan class="b">IAS</tspan></text>
<text class="sm" x="340" y="360" text-anchor="middle"><tspan class="b">IPS</tspan></text>
<text class="sm" x="540" y="360" text-anchor="middle"><tspan class="b">IFoS</tspan></text>
<text x="44" y="390" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="390"><tspan class="k">These services are</tspan><tspan class="r"> controlled jointly</tspan><tspan class="k"> by the Centre and the states.</tspan></text>
<text x="44" y="416" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="416"><tspan class="k">The</tspan><tspan class="r"> ultimate control</tspan><tspan class="k"> lies with the</tspan><tspan class="r"> Central government</tspan><tspan class="k"> while the</tspan><tspan class="r"> immediate control</tspan></text>
<text x="58" y="438"><tspan class="k">vests with the</tspan><tspan class="r"> state governments</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="452" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="470" text-anchor="middle"><tspan class="r" style="font-weight:700">Ultimate control</tspan></text>
<line class="ln" x1="190" y1="480" x2="190" y2="494" marker-end="url(#ah)"/>
<text class="sm" x="190" y="515" text-anchor="middle"><tspan class="k">Central government</tspan></text>
<rect class="bx" x="346" y="452" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="470" text-anchor="middle"><tspan class="r" style="font-weight:700">Immediate control</tspan></text>
<line class="ln" x1="490" y1="480" x2="490" y2="494" marker-end="url(#ah)"/>
<text class="sm" x="490" y="515" text-anchor="middle"><tspan class="k">State governments</tspan></text>
<line x1="340" y1="452" x2="340" y2="518" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="550" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="550"><tspan class="k">In</tspan><tspan class="r"> 1947</tspan><tspan class="k">,</tspan><tspan class="b"> Indian Civil Service (ICS)</tspan><tspan class="k"> was replaced by</tspan><tspan class="r"> IAS</tspan><tspan class="k"> and the</tspan><tspan class="b"> Indian Police (IP)</tspan><tspan class="k"> was</tspan></text>
<text x="58" y="572"><tspan class="k">replaced by</tspan><tspan class="r"> IPS</tspan><tspan class="k"> and were recognised by the Constitution as All-India Services.</tspan></text>
<text x="44" y="598" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="598"><tspan class="k">In</tspan><tspan class="r"> 1966</tspan><tspan class="k">, the</tspan><tspan class="r"> Indian Forest Service (IFoS)</tspan><tspan class="k"> was created as the</tspan><tspan class="b"> third All-India Service</tspan><tspan class="k">.</tspan></text>
<text x="44" y="624" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="624"><tspan class="r">Article 312</tspan><tspan class="k"> of the Constitution authorises the Parliament to create</tspan><tspan class="r"> new All-India</tspan></text>
<text x="58" y="646"><tspan class="r">Services</tspan><tspan class="k"> on the basis of a</tspan><tspan class="r"> Rajya Sabha resolution</tspan><tspan class="k"> to that effect.</tspan></text>
<rect class="bx" x="134" y="658" width="135" height="30" rx="3"/>
<text class="sm" x="201" y="677" text-anchor="middle"><tspan class="k">ICS →</tspan><tspan class="r"> IAS</tspan><tspan class="k"> (1947)</tspan></text>
<line class="ln" x1="272" y1="673" x2="292" y2="673" marker-end="url(#ah)"/>
<rect class="bx" x="295" y="658" width="126" height="30" rx="3"/>
<text class="sm" x="358" y="677" text-anchor="middle"><tspan class="k">IP →</tspan><tspan class="r"> IPS</tspan><tspan class="k"> (1947)</tspan></text>
<line class="ln" x1="424" y1="673" x2="444" y2="673" marker-end="url(#ah)"/>
<rect class="bx" x="447" y="658" width="100" height="30" rx="3"/>
<text class="sm" x="497" y="677" text-anchor="middle"><tspan class="r">IFoS</tspan><tspan class="k"> (1966)</tspan></text>
<line class="ln" x1="340" y1="689" x2="340" y2="710" marker-end="url(#ah)"/>
<rect class="bx" x="237" y="712" width="205" height="30" rx="3"/>
<text class="sm" x="340" y="731" text-anchor="middle"><tspan class="k">new: Art. 312 +</tspan><tspan class="r"> RS resolution</tspan></text>
<text x="44" y="768" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="768"><tspan class="k">Each of these three All-India Services, irrespective of their division among different</tspan></text>
<text x="58" y="790"><tspan class="k">states, form a</tspan><tspan class="r"> single service</tspan><tspan class="k"> with</tspan><tspan class="b"> common rights and status</tspan><tspan class="k"> and</tspan><tspan class="b"> uniform scales of pay</tspan></text>
<text x="58" y="812"><tspan class="k">throughout the country.</tspan></text>
<text x="44" y="838" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="838"><tspan class="k">Though the All-India Services</tspan><tspan class="r"> violate the principle of federalism</tspan><tspan class="k"> under the Constitution</tspan></text>
<text x="58" y="860"><tspan class="k">by restricting the</tspan><tspan class="b"> autonomy and patronage of the states</tspan><tspan class="k">, they are supported on the</tspan></text>
<text x="58" y="882"><tspan class="k">ground that</tspan></text>
<text x="70" y="908" class="r" style="font-weight:700">(i)</text>
<text x="107" y="908"><tspan class="k">they help in maintaining</tspan><tspan class="r"> high standard of administration</tspan><tspan class="k"> in the Centre as well</tspan></text>
<text x="107" y="930"><tspan class="k">as in the states;</tspan></text>
<text x="70" y="956" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="956"><tspan class="k">they help to ensure</tspan><tspan class="r"> uniformity of the administrative system</tspan><tspan class="k"> throughout the</tspan></text>
<text x="107" y="978"><tspan class="k">country; and</tspan></text>
<text x="70" y="1004" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1004"><tspan class="k">they facilitate</tspan><tspan class="r"> liaison, cooperation, coordination and joint action</tspan><tspan class="k"> on the issues of</tspan></text>
<text x="107" y="1026"><tspan class="k">common interest between the Centre and the states.</tspan></text>
<path d="M64 888 L58 888 L58 1032 L64 1032" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="1032" x2="340" y2="1044"/>
<line class="ln" x1="140" y1="1044" x2="540" y2="1044"/>
<line class="ln" x1="140" y1="1044" x2="140" y2="1060" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="1044" x2="340" y2="1060" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="1044" x2="540" y2="1060" marker-end="url(#ah)"/>
<text class="sm" x="140" y="1080" text-anchor="middle"><tspan class="r">(i) high standard</tspan></text>
<text class="sm" x="340" y="1080" text-anchor="middle"><tspan class="r">(ii) uniformity</tspan></text>
<text class="sm" x="540" y="1080" text-anchor="middle"><tspan class="r">(iii) liaison &amp; coordination</tspan></text>
<text x="44" y="1110" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1110"><tspan class="k">While justifying the institution of all-India services in the Constituent Assembly,</tspan><tspan class="r"> Dr.</tspan></text>
<text x="58" y="1132"><tspan class="r">B.R. Ambedkar</tspan><tspan class="k"> observed that:</tspan></text>
<text x="56" y="1159" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1159"><tspan class="k">“The</tspan><tspan class="r"> dual polity</tspan><tspan class="k"> which is inherent in a federal system is followed in all federations</tspan></text>
<text x="70" y="1181"><tspan class="k">by a</tspan><tspan class="r"> dual service</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1206" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1206"><tspan class="k">In all federations, there is a Federal Civil Service and a State Civil Service.</tspan></text>
<text x="56" y="1231" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1231"><tspan class="k">The Indian federation, though a dual polity, will have a dual service, but with</tspan><tspan class="r"> one</tspan></text>
<text x="70" y="1253"><tspan class="r">exception</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1278" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1278"><tspan class="k">It is recognised that in every country there are certain posts in its administrative set</tspan></text>
<text x="70" y="1300"><tspan class="k">up which might be called</tspan><tspan class="r"> strategic</tspan><tspan class="k"> from the point of view of maintaining the</tspan></text>
<text x="70" y="1322"><tspan class="k">standard of administration.</tspan></text>
<text x="56" y="1347" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1347"><tspan class="k">There can be no doubt that the standard of administration depends upon the</tspan><tspan class="b"> calibre</tspan></text>
<text x="70" y="1369"><tspan class="b">of the civil servants</tspan><tspan class="k"> who are appointed to the strategic posts.</tspan></text>
<text x="56" y="1394" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="1394"><tspan class="k">The Constitution provides that without depriving the states of their rights to form</tspan></text>
<text x="70" y="1416"><tspan class="k">their own civil services, there shall be an</tspan><tspan class="r"> all-India service</tspan><tspan class="k">, recruited on an all-India</tspan></text>
<text x="70" y="1438"><tspan class="k">basis with</tspan><tspan class="b"> common qualifications</tspan><tspan class="k">, with</tspan><tspan class="b"> uniform scale of pay</tspan><tspan class="k"> and members of which</tspan></text>
<text x="70" y="1460"><tspan class="k">alone could be appointed to those strategic posts throughout the Union”.⁷</tspan></text>
<line x1="44" y1="1140" x2="44" y2="1468" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<text class="xs" x="50" y="1504"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> Constituent Assembly Debates, Volume VII, pp. 41-42.</tspan></text>
