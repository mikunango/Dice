<div id="vis-container"><h2 class="sr-only">All-India Services</h2>
<svg class="n" width="100%" viewBox="0 0 680 1451" role="img"><title>All-India Services</title><desc>All-India Services</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="244" y="26" width="192" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">All-India Services</text>
<text class="lb" x="40" y="98">6. All-India Services</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">IAS, IPS, IFoS:</tspan><tspan class="k"> Like in any other federation, the Centre and the states also have their</tspan></text>
<text x="56" y="150"><tspan class="k">separate public services called as the</tspan><tspan class="r"> Central Services</tspan><tspan class="k"> and the</tspan><tspan class="r"> State Services</tspan><tspan class="k"> respectively.</tspan></text>
<text x="56" y="172"><tspan class="k">In addition, there are</tspan><tspan class="r"> All-India Services—IAS, IPS and IFoS</tspan><tspan class="k">. The members of these</tspan></text>
<text x="56" y="194"><tspan class="k">services occupy</tspan><tspan class="b"> top positions (or key posts)</tspan><tspan class="k"> under both the Centre and the states and</tspan></text>
<text x="56" y="216"><tspan class="k">serve them</tspan><tspan class="b"> by turns</tspan><tspan class="k">. But, they are</tspan><tspan class="r"> recruited and trained by the Centre</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="222" x2="340" y2="234"/>
<line class="ln" x1="140" y1="234" x2="540" y2="234"/>
<line class="ln" x1="140" y1="234" x2="140" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="234" x2="340" y2="250" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="234" x2="540" y2="250" marker-end="url(#ah)"/>
<text class="sm" x="140" y="270" text-anchor="middle"><tspan class="r">Central Services</tspan></text>
<text class="sm" x="340" y="270" text-anchor="middle"><tspan class="r" style="font-weight:700">All-India Services</tspan></text>
<text class="sm" x="540" y="270" text-anchor="middle"><tspan class="r">State Services</tspan></text>
<line class="ln" x1="340" y1="280" x2="340" y2="292"/>
<line class="ln" x1="140" y1="292" x2="540" y2="292"/>
<line class="ln" x1="140" y1="292" x2="140" y2="308" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="292" x2="340" y2="308" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="292" x2="540" y2="308" marker-end="url(#ah)"/>
<text class="sm" x="140" y="328" text-anchor="middle"><tspan class="b">IAS</tspan></text>
<text class="sm" x="340" y="328" text-anchor="middle"><tspan class="b">IPS</tspan></text>
<text class="sm" x="540" y="328" text-anchor="middle"><tspan class="b">IFoS</tspan></text>
<text x="44" y="360"><tspan class="h" style="font-weight:700">Joint control:</tspan><tspan class="k"> These services are</tspan><tspan class="r"> controlled jointly</tspan><tspan class="k"> by the Centre and the states. The</tspan></text>
<text x="56" y="382"><tspan class="r">ultimate control</tspan><tspan class="k"> lies with the</tspan><tspan class="r"> Central government</tspan><tspan class="k"> while the</tspan><tspan class="r"> immediate control</tspan><tspan class="k"> vests with</tspan></text>
<text x="56" y="404"><tspan class="k">the</tspan><tspan class="r"> state governments</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="418" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">Ultimate control</tspan></text>
<line class="ln" x1="190" y1="446" x2="190" y2="460" marker-end="url(#ah)"/>
<text class="sm" x="190" y="481" text-anchor="middle"><tspan class="k">Central government</tspan></text>
<rect class="bx" x="346" y="418" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">Immediate control</tspan></text>
<line class="ln" x1="490" y1="446" x2="490" y2="460" marker-end="url(#ah)"/>
<text class="sm" x="490" y="481" text-anchor="middle"><tspan class="k">State governments</tspan></text>
<line x1="340" y1="418" x2="340" y2="484" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="518"><tspan class="h" style="font-weight:700">1947, 1966 and Art. 312:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1947</tspan><tspan class="k">,</tspan><tspan class="b"> Indian Civil Service (ICS)</tspan><tspan class="k"> was replaced by</tspan><tspan class="r"> IAS</tspan><tspan class="k"> and the</tspan></text>
<text x="56" y="540"><tspan class="b">Indian Police (IP)</tspan><tspan class="k"> was replaced by</tspan><tspan class="r"> IPS</tspan><tspan class="k"> and were recognised by the Constitution as</tspan></text>
<text x="56" y="562"><tspan class="k">All-India Services. In</tspan><tspan class="r"> 1966</tspan><tspan class="k">, the</tspan><tspan class="r"> Indian Forest Service (IFoS)</tspan><tspan class="k"> was created as the</tspan><tspan class="b"> third</tspan></text>
<text x="56" y="584"><tspan class="b">All-India Service</tspan><tspan class="k">.</tspan><tspan class="r"> Article 312</tspan><tspan class="k"> of the Constitution authorises the Parliament to create</tspan><tspan class="r"> new</tspan></text>
<text x="56" y="606"><tspan class="r">All-India Services</tspan><tspan class="k"> on the basis of a</tspan><tspan class="r"> Rajya Sabha resolution</tspan><tspan class="k"> to that effect.</tspan></text>
<rect class="bx" x="134" y="618" width="135" height="30" rx="3"/>
<text class="sm" x="201" y="637" text-anchor="middle"><tspan class="k">ICS →</tspan><tspan class="r"> IAS</tspan><tspan class="k"> (1947)</tspan></text>
<line class="ln" x1="272" y1="633" x2="292" y2="633" marker-end="url(#ah)"/>
<rect class="bx" x="295" y="618" width="126" height="30" rx="3"/>
<text class="sm" x="358" y="637" text-anchor="middle"><tspan class="k">IP →</tspan><tspan class="r"> IPS</tspan><tspan class="k"> (1947)</tspan></text>
<line class="ln" x1="424" y1="633" x2="444" y2="633" marker-end="url(#ah)"/>
<rect class="bx" x="447" y="618" width="100" height="30" rx="3"/>
<text class="sm" x="497" y="637" text-anchor="middle"><tspan class="r">IFoS</tspan><tspan class="k"> (1966)</tspan></text>
<line class="ln" x1="340" y1="649" x2="340" y2="670" marker-end="url(#ah)"/>
<rect class="bx" x="237" y="672" width="205" height="30" rx="3"/>
<text class="sm" x="340" y="691" text-anchor="middle"><tspan class="k">new: Art. 312 +</tspan><tspan class="r"> RS resolution</tspan></text>
<text x="44" y="730"><tspan class="h" style="font-weight:700">Single service:</tspan><tspan class="k"> Each of these three All-India Services, irrespective of their division among</tspan></text>
<text x="56" y="752"><tspan class="k">different states, form a</tspan><tspan class="r"> single service</tspan><tspan class="k"> with</tspan><tspan class="b"> common rights and status</tspan><tspan class="k"> and</tspan><tspan class="b"> uniform scales</tspan></text>
<text x="56" y="774"><tspan class="b">of pay</tspan><tspan class="k"> throughout the country.</tspan></text>
<text x="44" y="802"><tspan class="h" style="font-weight:700">Grounds of support:</tspan><tspan class="k"> Though the All-India Services</tspan><tspan class="r"> violate the principle of federalism</tspan></text>
<text x="56" y="824"><tspan class="k">under the Constitution by restricting the</tspan><tspan class="b"> autonomy and patronage of the states</tspan><tspan class="k">, they are</tspan></text>
<text x="56" y="846"><tspan class="k">supported on the ground that</tspan></text>
<text x="70" y="872" class="r" style="font-weight:700">(i)</text>
<text x="107" y="872"><tspan class="k">they help in maintaining</tspan><tspan class="r"> high standard of administration</tspan><tspan class="k"> in the Centre as well</tspan></text>
<text x="107" y="894"><tspan class="k">as in the states;</tspan></text>
<text x="70" y="920" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="920"><tspan class="k">they help to ensure</tspan><tspan class="r"> uniformity of the administrative system</tspan><tspan class="k"> throughout the</tspan></text>
<text x="107" y="942"><tspan class="k">country; and</tspan></text>
<text x="70" y="968" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="968"><tspan class="k">they facilitate</tspan><tspan class="r"> liaison, cooperation, coordination and joint action</tspan><tspan class="k"> on the issues of</tspan></text>
<text x="107" y="990"><tspan class="k">common interest between the Centre and the states.</tspan></text>
<path d="M64 852 L58 852 L58 996 L64 996" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="996" x2="340" y2="1008"/>
<line class="ln" x1="140" y1="1008" x2="540" y2="1008"/>
<line class="ln" x1="140" y1="1008" x2="140" y2="1024" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="1008" x2="340" y2="1024" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="1008" x2="540" y2="1024" marker-end="url(#ah)"/>
<text class="sm" x="140" y="1044" text-anchor="middle"><tspan class="r">(i) high standard</tspan></text>
<text class="sm" x="340" y="1044" text-anchor="middle"><tspan class="r">(ii) uniformity</tspan></text>
<text class="sm" x="540" y="1044" text-anchor="middle"><tspan class="r">(iii) liaison &amp; coordination</tspan></text>
<text x="44" y="1076"><tspan class="h" style="font-weight:700">Ambedkar’s view:</tspan><tspan class="k"> While justifying the institution of all-India services in the Constituent</tspan></text>
<text x="56" y="1098"><tspan class="k">Assembly,</tspan><tspan class="r"> Dr. B.R. Ambedkar</tspan><tspan class="k"> observed that:</tspan></text>
<text x="56" y="1126"><tspan class="h" style="font-weight:700">Dual polity, dual service:</tspan><tspan class="k"> “The</tspan><tspan class="r"> dual polity</tspan><tspan class="k"> which is inherent in a federal system is</tspan></text>
<text x="68" y="1148"><tspan class="k">followed in all federations by a</tspan><tspan class="r"> dual service</tspan><tspan class="k">. In all federations, there is a Federal Civil</tspan></text>
<text x="68" y="1170"><tspan class="k">Service and a State Civil Service. The Indian federation, though a dual polity, will</tspan></text>
<text x="68" y="1192"><tspan class="k">have a dual service, but with</tspan><tspan class="r"> one exception</tspan><tspan class="k">. It is recognised that in every country</tspan></text>
<text x="68" y="1214"><tspan class="k">there are certain posts in its administrative set up which might be called</tspan><tspan class="r"> strategic</tspan></text>
<text x="68" y="1236"><tspan class="k">from the point of view of maintaining the standard of administration. There can be</tspan></text>
<text x="68" y="1258"><tspan class="k">no doubt that the standard of administration depends upon the</tspan><tspan class="b"> calibre of the civil</tspan></text>
<text x="68" y="1280"><tspan class="b">servants</tspan><tspan class="k"> who are appointed to the strategic posts. The Constitution provides that</tspan></text>
<text x="68" y="1302"><tspan class="k">without depriving the states of their rights to form their own civil services, there</tspan></text>
<text x="68" y="1324"><tspan class="k">shall be an</tspan><tspan class="r"> all-India service</tspan><tspan class="k">, recruited on an all-India basis with</tspan><tspan class="b"> common</tspan></text>
<text x="68" y="1346"><tspan class="b">qualifications</tspan><tspan class="k">, with</tspan><tspan class="b"> uniform scale of pay</tspan><tspan class="k"> and members of which alone could be</tspan></text>
<text x="68" y="1368"><tspan class="k">appointed to those strategic posts throughout the Union”.⁷</tspan></text>
<line x1="44" y1="1106" x2="44" y2="1376" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<text class="xs" x="50" y="1412"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> Constituent Assembly Debates, Volume VII, pp. 41-42.</tspan></text>
