<div id="vis-container"><h2 class="sr-only">Administrative Relations – II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1649" role="img"><title>Administrative Relations – II</title><desc>Administrative Relations – II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="200" y="26" width="280" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – II</text>
<text class="lb" x="40" y="98">4. Mutual Delegation of Functions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Rigid legislative division:</tspan><tspan class="k"> The distribution of legislative powers between the Centre and</tspan></text>
<text x="56" y="150"><tspan class="k">the states is</tspan><tspan class="r"> rigid</tspan><tspan class="k">.</tspan></text>
<text x="44" y="178"><tspan class="h" style="font-weight:700">No legislative delegation:</tspan><tspan class="k"> Consequently, the Centre</tspan><tspan class="r"> cannot delegate its legislative powers</tspan></text>
<text x="56" y="200"><tspan class="k">to the states and a single state cannot request the Parliament to make a law on a state</tspan></text>
<text x="56" y="222"><tspan class="k">subject.</tspan></text>
<text x="44" y="250"><tspan class="h" style="font-weight:700">Executive follows legislative:</tspan><tspan class="k"> The distribution of executive power in general follows the</tspan></text>
<text x="56" y="272"><tspan class="k">distribution of legislative powers.</tspan></text>
<text x="44" y="300"><tspan class="h" style="font-weight:700">Possible conflicts:</tspan><tspan class="k"> But, such a rigid division in the executive sphere may lead to</tspan></text>
<text x="56" y="322"><tspan class="b">occasional conflicts</tspan><tspan class="k"> between the two.</tspan></text>
<text x="44" y="350"><tspan class="h" style="font-weight:700">Executive delegation:</tspan><tspan class="k"> Hence, the Constitution provides for</tspan><tspan class="r"> inter-government delegation</tspan></text>
<text x="56" y="372"><tspan class="r">of executive functions</tspan><tspan class="k"> in order to</tspan><tspan class="b"> mitigate rigidity and avoid a situation of deadlock</tspan><tspan class="k">.</tspan></text>
<text x="44" y="400"><tspan class="h" style="font-weight:700">President → State:</tspan><tspan class="k"> Accordingly, the</tspan><tspan class="r"> President</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the state</tspan></text>
<text x="56" y="422"><tspan class="r">government</tspan><tspan class="k">, entrust to that government any of the executive functions of the Centre.</tspan></text>
<text x="44" y="450"><tspan class="h" style="font-weight:700">Governor → Centre:</tspan><tspan class="k"> Conversely, the</tspan><tspan class="r"> governor of a state</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the</tspan></text>
<text x="56" y="472"><tspan class="r">Central government</tspan><tspan class="k">, entrust to that government any of the executive functions of the</tspan></text>
<text x="56" y="494"><tspan class="k">state.⁶</tspan></text>
<text x="44" y="522"><tspan class="h" style="font-weight:700">Conditional / unconditional:</tspan><tspan class="k"> This mutual delegation of administrative functions may be</tspan></text>
<text x="56" y="544"><tspan class="b">conditional or unconditional</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="200" y1="584" x2="476" y2="584" marker-end="url(#ah)"/><line class="ln" x1="476" y1="602" x2="200" y2="602" marker-end="url(#ah)"/>
<rect class="bx" x="60" y="568" width="135" height="50" rx="3"/><text class="r" x="127" y="598" text-anchor="middle" style="font-weight:700">Centre</text>
<rect class="bx" x="485" y="568" width="135" height="50" rx="3"/><text class="r" x="552" y="598" text-anchor="middle" style="font-weight:700">State</text>
<text class="sm b" x="338" y="578" text-anchor="middle">President entrusts (with state’s consent)</text><text class="sm b" x="338" y="620" text-anchor="middle">Governor entrusts (with Centre’s consent)</text>
<text x="44" y="656"><tspan class="h" style="font-weight:700">Without state consent:</tspan><tspan class="k"> The Constitution also makes a provision for the entrustment of</tspan></text>
<text x="56" y="678"><tspan class="k">the executive functions of the Centre to a state</tspan><tspan class="r"> without the consent of that state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="706"><tspan class="h" style="font-weight:700">By Parliament only:</tspan><tspan class="k"> But, in this case, the delegation is by the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> and</tspan><tspan class="b"> not by</tspan></text>
<text x="56" y="728"><tspan class="b">the president</tspan><tspan class="k">.</tspan></text>
<text x="44" y="756"><tspan class="h" style="font-weight:700">Union List law:</tspan><tspan class="k"> Thus, a law made by the Parliament on a subject of the</tspan><tspan class="r"> Union List</tspan><tspan class="k"> can</tspan></text>
<text x="56" y="778"><tspan class="k">confer powers and impose duties on a state, or authorise the conferring of powers and</tspan></text>
<text x="56" y="800"><tspan class="k">imposition of duties by the Centre upon a state (</tspan><tspan class="b">irrespective of the consent of the state</tspan></text>
<text x="56" y="822"><tspan class="b">concerned</tspan><tspan class="k">).</tspan></text>
<text x="44" y="850"><tspan class="h" style="font-weight:700">Not by state legislature:</tspan><tspan class="k"> Notably, the same thing</tspan><tspan class="r"> cannot be done by the state</tspan></text>
<text x="56" y="872"><tspan class="r">legislature</tspan><tspan class="k">.</tspan></text>
<text x="44" y="900"><tspan class="h" style="font-weight:700">Agreement or legislation:</tspan><tspan class="k"> From the above, it is clear that the mutual delegation of</tspan></text>
<text x="56" y="922"><tspan class="k">functions between the Centre and the state can take place either</tspan><tspan class="r"> under an agreement</tspan><tspan class="k"> or</tspan></text>
<text x="56" y="944"><tspan class="r">by a legislation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="972"><tspan class="h" style="font-weight:700">Centre both, state one:</tspan><tspan class="k"> While the</tspan><tspan class="b"> Centre can use both</tspan><tspan class="k"> the methods, a</tspan><tspan class="b"> state can use</tspan></text>
<text x="56" y="994"><tspan class="b">only the first</tspan><tspan class="k"> method.</tspan></text>
<rect class="bx" x="46" y="1008" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1026" text-anchor="middle"><tspan class="r" style="font-weight:700">By agreement</tspan></text>
<line class="ln" x1="190" y1="1036" x2="190" y2="1050" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1071" text-anchor="middle"><tspan class="k">Centre ✔</tspan></text>
<text class="sm" x="190" y="1093" text-anchor="middle"><tspan class="k">State ✔</tspan></text>
<rect class="bx" x="346" y="1008" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1026" text-anchor="middle"><tspan class="r" style="font-weight:700">By legislation</tspan></text>
<line class="ln" x1="490" y1="1036" x2="490" y2="1050" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1071" text-anchor="middle"><tspan class="k">Centre (Parliament) ✔</tspan></text>
<text class="sm" x="490" y="1093" text-anchor="middle"><tspan class="k">State ✘</tspan></text>
<line x1="340" y1="1008" x2="340" y2="1096" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="1134">5. Cooperation Between the Centre and States</text>
<text x="44" y="1164"><tspan class="h" style="font-weight:700">Cooperation provisions:</tspan><tspan class="k"> The Constitution contains the following provisions to secure</tspan></text>
<text x="56" y="1186"><tspan class="r">cooperation and coordination</tspan><tspan class="k"> between the Centre and the states:</tspan></text>
<text x="56" y="1212" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1212"><tspan class="k">The Parliament can provide for the</tspan><tspan class="r"> adjudication of any dispute</tspan><tspan class="k"> or complaint with</tspan></text>
<text x="93" y="1234"><tspan class="k">respect to the use, distribution and control of</tspan><tspan class="b"> waters of any inter-state river and</tspan></text>
<text x="93" y="1256"><tspan class="b">river valley</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1282" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1282"><tspan class="k">The President can establish (under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">) an</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="1304"><tspan class="k">investigate and discuss subject of common interest between the Centre and the</tspan></text>
<text x="93" y="1326"><tspan class="k">states.</tspan></text>
<text x="93" y="1351"><tspan class="h" style="font-weight:700">ISC set up 1990:</tspan><tspan class="k"> Such a council was set up in</tspan><tspan class="r"> 1990</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1377" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1377"><tspan class="r">Full faith and credit</tspan><tspan class="k"> is to be given throughout the territory of India to</tspan><tspan class="b"> public</tspan></text>
<text x="93" y="1399"><tspan class="b">acts, records and judicial proceedings</tspan><tspan class="k"> of the Centre and every state.</tspan></text>
<text x="56" y="1425" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1425"><tspan class="k">The Parliament can appoint an</tspan><tspan class="r"> appropriate authority</tspan><tspan class="k"> to carry out the purposes of</tspan></text>
<text x="93" y="1447"><tspan class="k">the constitutional provisions relating to the</tspan><tspan class="b"> interstate freedom of trade, commerce</tspan></text>
<text x="93" y="1469"><tspan class="b">and intercourse</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1494"><tspan class="h" style="font-weight:700">No authority yet:</tspan><tspan class="k"> But,</tspan><tspan class="r"> no such authority has been appointed so far</tspan><tspan class="k">.</tspan></text>
<path d="M50 1192 L44 1192 L44 1500 L50 1500" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1506" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1535" text-anchor="middle"><tspan class="r">river water disputes</tspan></text>
<rect class="bx" x="192" y="1506" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1526" text-anchor="middle"><tspan class="r">Inter-State Council</tspan></text>
<text class="sm" x="264" y="1544" text-anchor="middle"><tspan class="b">Art. 263 · 1990</tspan></text>
<rect class="bx" x="345" y="1506" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1535" text-anchor="middle"><tspan class="r">full faith &amp; credit</tspan></text>
<rect class="bx" x="498" y="1506" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1526" text-anchor="middle"><tspan class="r">trade authority</tspan></text>
<text class="sm" x="569" y="1544" text-anchor="middle"><tspan class="b">not appointed</tspan></text>
<text class="xs" x="50" y="1592"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> This provision (the power of the states to entrust functions to the Centre) was added by the 7th</tspan></text>
<text class="xs" x="50" y="1610"><tspan class="k">Constitutional Amendment Act of 1956. Before that, only the Centre had the power.</tspan></text>
<rect x="40" y="1570" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
