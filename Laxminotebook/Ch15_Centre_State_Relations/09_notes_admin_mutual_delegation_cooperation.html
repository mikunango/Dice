<div id="vis-container"><h2 class="sr-only">Administrative Relations – II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1441" role="img"><title>Administrative Relations – II</title><desc>Administrative Relations – II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="200" y="26" width="280" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – II</text>
<text class="lb" x="40" y="98">4. Mutual Delegation of Functions</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The distribution of legislative powers between the Centre and the states is</tspan><tspan class="r"> rigid</tspan><tspan class="k">.</tspan></text>
<text x="44" y="152" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="152"><tspan class="k">Consequently, the Centre</tspan><tspan class="r"> cannot delegate its legislative powers</tspan><tspan class="k"> to the states and a</tspan></text>
<text x="58" y="174"><tspan class="k">single state cannot request the Parliament to make a law on a state subject.</tspan></text>
<text x="44" y="200" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="200"><tspan class="k">The distribution of executive power in general follows the distribution of legislative</tspan></text>
<text x="58" y="222"><tspan class="k">powers.</tspan></text>
<text x="44" y="248" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="248"><tspan class="k">But, such a rigid division in the executive sphere may lead to</tspan><tspan class="b"> occasional conflicts</tspan></text>
<text x="58" y="270"><tspan class="k">between the two.</tspan></text>
<text x="44" y="296" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="296"><tspan class="k">Hence, the Constitution provides for</tspan><tspan class="r"> inter-government delegation of executive functions</tspan></text>
<text x="58" y="318"><tspan class="k">in order to</tspan><tspan class="b"> mitigate rigidity and avoid a situation of deadlock</tspan><tspan class="k">.</tspan></text>
<text x="44" y="344" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="344"><tspan class="k">Accordingly, the</tspan><tspan class="r"> President</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the state government</tspan><tspan class="k">, entrust to</tspan></text>
<text x="58" y="366"><tspan class="k">that government any of the executive functions of the Centre.</tspan></text>
<text x="44" y="392" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="392"><tspan class="k">Conversely, the</tspan><tspan class="r"> governor of a state</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the Central government</tspan><tspan class="k">,</tspan></text>
<text x="58" y="414"><tspan class="k">entrust to that government any of the executive functions of the state.⁶</tspan></text>
<text x="44" y="440" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="440"><tspan class="k">This mutual delegation of administrative functions may be</tspan><tspan class="b"> conditional or unconditional</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="200" y1="480" x2="476" y2="480" marker-end="url(#ah)"/><line class="ln" x1="476" y1="498" x2="200" y2="498" marker-end="url(#ah)"/>
<rect class="bx" x="60" y="464" width="135" height="50" rx="3"/><text class="r" x="127" y="494" text-anchor="middle" style="font-weight:700">Centre</text>
<rect class="bx" x="485" y="464" width="135" height="50" rx="3"/><text class="r" x="552" y="494" text-anchor="middle" style="font-weight:700">State</text>
<text class="sm b" x="338" y="474" text-anchor="middle">President entrusts (with state’s consent)</text><text class="sm b" x="338" y="516" text-anchor="middle">Governor entrusts (with Centre’s consent)</text>
<text x="44" y="550" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="550"><tspan class="k">The Constitution also makes a provision for the entrustment of the executive functions</tspan></text>
<text x="58" y="572"><tspan class="k">of the Centre to a state</tspan><tspan class="r"> without the consent of that state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="598" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="598"><tspan class="k">But, in this case, the delegation is by the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> and</tspan><tspan class="b"> not by the president</tspan><tspan class="k">.</tspan></text>
<text x="44" y="624" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="624"><tspan class="k">Thus, a law made by the Parliament on a subject of the</tspan><tspan class="r"> Union List</tspan><tspan class="k"> can confer powers</tspan></text>
<text x="58" y="646"><tspan class="k">and impose duties on a state, or authorise the conferring of powers and imposition of</tspan></text>
<text x="58" y="668"><tspan class="k">duties by the Centre upon a state (</tspan><tspan class="b">irrespective of the consent of the state</tspan></text>
<text x="58" y="690"><tspan class="b">concerned</tspan><tspan class="k">).</tspan></text>
<text x="44" y="716" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="716"><tspan class="k">Notably, the same thing</tspan><tspan class="r"> cannot be done by the state legislature</tspan><tspan class="k">.</tspan></text>
<text x="44" y="742" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="742"><tspan class="k">From the above, it is clear that the mutual delegation of functions between the Centre</tspan></text>
<text x="58" y="764"><tspan class="k">and the state can take place either</tspan><tspan class="r"> under an agreement</tspan><tspan class="k"> or</tspan><tspan class="r"> by a legislation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="790" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="790"><tspan class="k">While the</tspan><tspan class="b"> Centre can use both</tspan><tspan class="k"> the methods, a</tspan><tspan class="b"> state can use only the first</tspan><tspan class="k"> method.</tspan></text>
<rect class="bx" x="46" y="804" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="822" text-anchor="middle"><tspan class="r" style="font-weight:700">By agreement</tspan></text>
<line class="ln" x1="190" y1="832" x2="190" y2="846" marker-end="url(#ah)"/>
<text class="sm" x="190" y="867" text-anchor="middle"><tspan class="k">Centre ✔</tspan></text>
<text class="sm" x="190" y="889" text-anchor="middle"><tspan class="k">State ✔</tspan></text>
<rect class="bx" x="346" y="804" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="822" text-anchor="middle"><tspan class="r" style="font-weight:700">By legislation</tspan></text>
<line class="ln" x1="490" y1="832" x2="490" y2="846" marker-end="url(#ah)"/>
<text class="sm" x="490" y="867" text-anchor="middle"><tspan class="k">Centre (Parliament) ✔</tspan></text>
<text class="sm" x="490" y="889" text-anchor="middle"><tspan class="k">State ✘</tspan></text>
<line x1="340" y1="804" x2="340" y2="892" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="930">5. Cooperation Between the Centre and States</text>
<text x="44" y="958" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="958"><tspan class="k">The Constitution contains the following provisions to secure</tspan><tspan class="r"> cooperation and</tspan></text>
<text x="58" y="980"><tspan class="r">coordination</tspan><tspan class="k"> between the Centre and the states:</tspan></text>
<text x="56" y="1006" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1006"><tspan class="k">The Parliament can provide for the</tspan><tspan class="r"> adjudication of any dispute</tspan><tspan class="k"> or complaint with</tspan></text>
<text x="93" y="1028"><tspan class="k">respect to the use, distribution and control of</tspan><tspan class="b"> waters of any inter-state river and</tspan></text>
<text x="93" y="1050"><tspan class="b">river valley</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1076" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1076"><tspan class="k">The President can establish (under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">) an</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="1098"><tspan class="k">investigate and discuss subject of common interest between the Centre and the</tspan></text>
<text x="93" y="1120"><tspan class="k">states.</tspan></text>
<text x="93" y="1144" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="1144"><tspan class="k">Such a council was set up in</tspan><tspan class="r"> 1990</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1170" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1170"><tspan class="r">Full faith and credit</tspan><tspan class="k"> is to be given throughout the territory of India to</tspan><tspan class="b"> public</tspan></text>
<text x="93" y="1192"><tspan class="b">acts, records and judicial proceedings</tspan><tspan class="k"> of the Centre and every state.</tspan></text>
<text x="56" y="1218" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1218"><tspan class="k">The Parliament can appoint an</tspan><tspan class="r"> appropriate authority</tspan><tspan class="k"> to carry out the purposes of</tspan></text>
<text x="93" y="1240"><tspan class="k">the constitutional provisions relating to the</tspan><tspan class="b"> interstate freedom of trade, commerce</tspan></text>
<text x="93" y="1262"><tspan class="b">and intercourse</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1286" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="1286"><tspan class="k">But,</tspan><tspan class="r"> no such authority has been appointed so far</tspan><tspan class="k">.</tspan></text>
<path d="M50 986 L44 986 L44 1292 L50 1292" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1298" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1327" text-anchor="middle"><tspan class="r">river water disputes</tspan></text>
<rect class="bx" x="192" y="1298" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1318" text-anchor="middle"><tspan class="r">Inter-State Council</tspan></text>
<text class="sm" x="264" y="1336" text-anchor="middle"><tspan class="b">Art. 263 · 1990</tspan></text>
<rect class="bx" x="345" y="1298" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1327" text-anchor="middle"><tspan class="r">full faith &amp; credit</tspan></text>
<rect class="bx" x="498" y="1298" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1318" text-anchor="middle"><tspan class="r">trade authority</tspan></text>
<text class="sm" x="569" y="1336" text-anchor="middle"><tspan class="b">not appointed</tspan></text>
<text class="xs" x="50" y="1384"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> This provision (the power of the states to entrust functions to the Centre) was added by the 7th</tspan></text>
<text class="xs" x="50" y="1402"><tspan class="k">Constitutional Amendment Act of 1956. Before that, only the Centre had the power.</tspan></text>
<rect x="40" y="1362" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
