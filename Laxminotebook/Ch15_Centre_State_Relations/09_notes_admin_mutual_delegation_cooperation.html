<div id="vis-container"><h2 class="sr-only">Administrative Relations – II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1319" role="img"><title>Administrative Relations – II</title><desc>Administrative Relations – II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="200" y="26" width="280" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – II</text>
<text class="lb" x="40" y="98">4. Mutual Delegation of Functions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Rigid division:</tspan><tspan class="k"> The distribution of legislative powers between the Centre and the states</tspan></text>
<text x="56" y="150"><tspan class="k">is</tspan><tspan class="r"> rigid</tspan><tspan class="k">. Consequently, the Centre</tspan><tspan class="r"> cannot delegate its legislative powers</tspan><tspan class="k"> to the states and</tspan></text>
<text x="56" y="172"><tspan class="k">a single state cannot request the Parliament to make a law on a state subject. The</tspan></text>
<text x="56" y="194"><tspan class="k">distribution of executive power in general follows the distribution of legislative powers.</tspan></text>
<text x="56" y="216"><tspan class="k">But, such a rigid division in the executive sphere may lead to</tspan><tspan class="b"> occasional conflicts</tspan></text>
<text x="56" y="238"><tspan class="k">between the two. Hence, the Constitution provides for</tspan><tspan class="r"> inter-government delegation of</tspan></text>
<text x="56" y="260"><tspan class="r">executive functions</tspan><tspan class="k"> in order to</tspan><tspan class="b"> mitigate rigidity and avoid a situation of deadlock</tspan><tspan class="k">.</tspan></text>
<text x="44" y="288"><tspan class="h" style="font-weight:700">With consent:</tspan><tspan class="k"> Accordingly, the</tspan><tspan class="r"> President</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the state</tspan></text>
<text x="56" y="310"><tspan class="r">government</tspan><tspan class="k">, entrust to that government any of the executive functions of the Centre.</tspan></text>
<text x="56" y="332"><tspan class="k">Conversely, the</tspan><tspan class="r"> governor of a state</tspan><tspan class="k"> may, with the</tspan><tspan class="r"> consent of the Central government</tspan><tspan class="k">,</tspan></text>
<text x="56" y="354"><tspan class="k">entrust to that government any of the executive functions of the state.⁶ This mutual</tspan></text>
<text x="56" y="376"><tspan class="k">delegation of administrative functions may be</tspan><tspan class="b"> conditional or unconditional</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="200" y1="416" x2="476" y2="416" marker-end="url(#ah)"/><line class="ln" x1="476" y1="434" x2="200" y2="434" marker-end="url(#ah)"/>
<rect class="bx" x="60" y="400" width="135" height="50" rx="3"/><text class="r" x="127" y="430" text-anchor="middle" style="font-weight:700">Centre</text>
<rect class="bx" x="485" y="400" width="135" height="50" rx="3"/><text class="r" x="552" y="430" text-anchor="middle" style="font-weight:700">State</text>
<text class="sm b" x="338" y="410" text-anchor="middle">President entrusts (with state’s consent)</text><text class="sm b" x="338" y="452" text-anchor="middle">Governor entrusts (with Centre’s consent)</text>
<text x="44" y="488"><tspan class="h" style="font-weight:700">Without consent – by Parliament:</tspan><tspan class="k"> The Constitution also makes a provision for the</tspan></text>
<text x="56" y="510"><tspan class="k">entrustment of the executive functions of the Centre to a state</tspan><tspan class="r"> without the consent of</tspan></text>
<text x="56" y="532"><tspan class="r">that state</tspan><tspan class="k">. But, in this case, the delegation is by the</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> and</tspan><tspan class="b"> not by the</tspan></text>
<text x="56" y="554"><tspan class="b">president</tspan><tspan class="k">. Thus, a law made by the Parliament on a subject of the</tspan><tspan class="r"> Union List</tspan><tspan class="k"> can confer</tspan></text>
<text x="56" y="576"><tspan class="k">powers and impose duties on a state, or authorise the conferring of powers and</tspan></text>
<text x="56" y="598"><tspan class="k">imposition of duties by the Centre upon a state (</tspan><tspan class="b">irrespective of the consent of the state</tspan></text>
<text x="56" y="620"><tspan class="b">concerned</tspan><tspan class="k">). Notably, the same thing</tspan><tspan class="r"> cannot be done by the state legislature</tspan><tspan class="k">.</tspan></text>
<text x="44" y="648"><tspan class="h" style="font-weight:700">Agreement or legislation:</tspan><tspan class="k"> From the above, it is clear that the mutual delegation of</tspan></text>
<text x="56" y="670"><tspan class="k">functions between the Centre and the state can take place either</tspan><tspan class="r"> under an agreement</tspan><tspan class="k"> or</tspan></text>
<text x="56" y="692"><tspan class="r">by a legislation</tspan><tspan class="k">. While the</tspan><tspan class="b"> Centre can use both</tspan><tspan class="k"> the methods, a</tspan><tspan class="b"> state can use only the</tspan></text>
<text x="56" y="714"><tspan class="b">first</tspan><tspan class="k"> method.</tspan></text>
<rect class="bx" x="46" y="728" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="746" text-anchor="middle"><tspan class="r" style="font-weight:700">By agreement</tspan></text>
<line class="ln" x1="190" y1="756" x2="190" y2="770" marker-end="url(#ah)"/>
<text class="sm" x="190" y="791" text-anchor="middle"><tspan class="k">Centre ✔</tspan></text>
<text class="sm" x="190" y="813" text-anchor="middle"><tspan class="k">State ✔</tspan></text>
<rect class="bx" x="346" y="728" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="746" text-anchor="middle"><tspan class="r" style="font-weight:700">By legislation</tspan></text>
<line class="ln" x1="490" y1="756" x2="490" y2="770" marker-end="url(#ah)"/>
<text class="sm" x="490" y="791" text-anchor="middle"><tspan class="k">Centre (Parliament) ✔</tspan></text>
<text class="sm" x="490" y="813" text-anchor="middle"><tspan class="k">State ✘</tspan></text>
<line x1="340" y1="728" x2="340" y2="816" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="854">5. Cooperation Between the Centre and States</text>
<text x="44" y="884"><tspan class="h" style="font-weight:700">Cooperation provisions:</tspan><tspan class="k"> The Constitution contains the following provisions to secure</tspan></text>
<text x="56" y="906"><tspan class="r">cooperation and coordination</tspan><tspan class="k"> between the Centre and the states:</tspan></text>
<text x="56" y="932" class="r" style="font-weight:700">(i)</text>
<text x="93" y="932"><tspan class="k">The Parliament can provide for the</tspan><tspan class="r"> adjudication of any dispute</tspan><tspan class="k"> or complaint with</tspan></text>
<text x="93" y="954"><tspan class="k">respect to the use, distribution and control of</tspan><tspan class="b"> waters of any inter-state river and</tspan></text>
<text x="93" y="976"><tspan class="b">river valley</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1002" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1002"><tspan class="k">The President can establish (under</tspan><tspan class="r"> Article 263</tspan><tspan class="k">) an</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> to</tspan></text>
<text x="93" y="1024"><tspan class="k">investigate and discuss subject of common interest between the Centre and the</tspan></text>
<text x="93" y="1046"><tspan class="k">states. Such a council was set up in</tspan><tspan class="r"> 1990</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1072" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1072"><tspan class="r">Full faith and credit</tspan><tspan class="k"> is to be given throughout the territory of India to</tspan><tspan class="b"> public</tspan></text>
<text x="93" y="1094"><tspan class="b">acts, records and judicial proceedings</tspan><tspan class="k"> of the Centre and every state.</tspan></text>
<text x="56" y="1120" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1120"><tspan class="k">The Parliament can appoint an</tspan><tspan class="r"> appropriate authority</tspan><tspan class="k"> to carry out the purposes of</tspan></text>
<text x="93" y="1142"><tspan class="k">the constitutional provisions relating to the</tspan><tspan class="b"> interstate freedom of trade, commerce</tspan></text>
<text x="93" y="1164"><tspan class="b">and intercourse</tspan><tspan class="k">. But,</tspan><tspan class="r"> no such authority has been appointed so far</tspan><tspan class="k">.</tspan></text>
<path d="M50 912 L44 912 L44 1170 L50 1170" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1176" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1205" text-anchor="middle"><tspan class="r">river water disputes</tspan></text>
<rect class="bx" x="192" y="1176" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1196" text-anchor="middle"><tspan class="r">Inter-State Council</tspan></text>
<text class="sm" x="264" y="1214" text-anchor="middle"><tspan class="b">Art. 263 · 1990</tspan></text>
<rect class="bx" x="345" y="1176" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1205" text-anchor="middle"><tspan class="r">full faith &amp; credit</tspan></text>
<rect class="bx" x="498" y="1176" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1196" text-anchor="middle"><tspan class="r">trade authority</tspan></text>
<text class="sm" x="569" y="1214" text-anchor="middle"><tspan class="b">not appointed</tspan></text>
<text class="xs" x="50" y="1262"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> This provision (the power of the states to entrust functions to the Centre) was added by the 7th</tspan></text>
<text class="xs" x="50" y="1280"><tspan class="k">Constitutional Amendment Act of 1956. Before that, only the Centre had the power.</tspan></text>
<rect x="40" y="1240" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
