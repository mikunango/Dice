<div id="vis-container"><h2 class="sr-only">Administrative Relations – IV</h2>
<svg class="n" width="100%" viewBox="0 0 680 1325" role="img"><title>Administrative Relations – IV</title><desc>Administrative Relations – IV</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – IV</text>
<text class="lb" x="40" y="98">10. Other Provisions</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The Constitution contains the following other provisions which enable the Centre to</tspan></text>
<text x="58" y="148"><tspan class="k">exercise</tspan><tspan class="r"> control over the state administration</tspan><tspan class="k">:</tspan></text>
<text x="56" y="174" class="r" style="font-weight:700">(i)</text>
<text x="93" y="174"><tspan class="r">Article 355</tspan><tspan class="k"> imposes</tspan><tspan class="r"> two duties</tspan><tspan class="k"> on the Centre: (a) to</tspan><tspan class="b"> protect every state against</tspan></text>
<text x="93" y="196"><tspan class="b">external aggression and internal disturbance</tspan><tspan class="k">; and (b) to</tspan><tspan class="b"> ensure that the</tspan></text>
<text x="93" y="218"><tspan class="b">government of every state is carried on in accordance with the provisions of the</tspan></text>
<text x="93" y="240"><tspan class="b">Constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="266" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="266"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state is</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k">.</tspan></text>
<text x="93" y="290" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="290"><tspan class="k">He/she holds office during the</tspan><tspan class="r"> pleasure of the President</tspan><tspan class="k">.</tspan></text>
<text x="93" y="314" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="314"><tspan class="k">In addition to the Constitutional head of the state, the governor acts as an</tspan></text>
<text x="107" y="336"><tspan class="r">agent of the Centre</tspan><tspan class="k"> in the state.</tspan></text>
<text x="93" y="360" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="360"><tspan class="k">He/she submits</tspan><tspan class="b"> periodical reports</tspan><tspan class="k"> to the Centre about the administrative affairs</tspan></text>
<text x="107" y="382"><tspan class="k">of the state.</tspan></text>
<text x="56" y="408" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="408"><tspan class="k">The</tspan><tspan class="r"> state election commissioner</tspan><tspan class="k">, though</tspan><tspan class="b"> appointed by the governor</tspan><tspan class="k"> of the state,</tspan></text>
<text x="93" y="430"><tspan class="k">can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>
<path d="M50 154 L44 154 L44 436 L50 436" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="436" x2="340" y2="448"/>

<text class="sm" x="140" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 355</tspan><tspan class="k"> – 2 duties</tspan></text>
<text class="sm" x="340" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan><tspan class="k"> – agent of Centre</tspan></text>
<text class="sm" x="540" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">SEC</tspan><tspan class="k"> – removed by President</tspan></text>
<text class="lb" x="40" y="520">11. Extra-Constitutional Devices</text>
<text x="44" y="548" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="548"><tspan class="k">In addition to the above-mentioned constitutional devices, there are</tspan></text>
<text x="58" y="570"><tspan class="r">extra-constitutional devices</tspan><tspan class="k"> to promote cooperation and coordination between the</tspan></text>
<text x="58" y="592"><tspan class="k">Centre and the states.</tspan></text>
<text x="44" y="618" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="618"><tspan class="k">These include a number of</tspan><tspan class="r"> advisory bodies</tspan><tspan class="k"> and</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held at the Central level.</tspan></text>
<line class="ln" x1="340" y1="624" x2="340" y2="636"/>
<line class="ln" x1="190" y1="636" x2="490" y2="636"/>
<line class="ln" x1="190" y1="636" x2="190" y2="652" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="636" x2="490" y2="652" marker-end="url(#ah)"/>
<text class="sm" x="190" y="672" text-anchor="middle"><tspan class="r" style="font-weight:700">Advisory bodies</tspan></text>
<text class="sm" x="490" y="672" text-anchor="middle"><tspan class="r" style="font-weight:700">Conferences</tspan></text>
<text x="44" y="702" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="702"><tspan class="k">The</tspan><tspan class="r"> non-constitutional advisory bodies</tspan><tspan class="k"> include the</tspan><tspan class="b"> NITI Ayog (which succeeded the</tspan></text>
<text x="58" y="724"><tspan class="b">planning commission)</tspan><tspan class="k">, the</tspan><tspan class="b"> National Integration Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Health</tspan></text>
<text x="58" y="746"><tspan class="b">and Family Welfare</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Local Government</tspan><tspan class="k">, the</tspan><tspan class="b"> Zonal Councils</tspan><tspan class="k">, the</tspan></text>
<text x="58" y="768"><tspan class="b">North-Eastern Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Indian Medicine</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of</tspan></text>
<text x="58" y="790"><tspan class="b">Homoeopathy</tspan><tspan class="k">, the</tspan><tspan class="b"> Transport Development Council</tspan><tspan class="k">, the</tspan><tspan class="b"> University Grants Commission</tspan></text>
<text x="58" y="812"><tspan class="k">and so on.</tspan></text>
<text x="44" y="838" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="838"><tspan class="k">The important</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held either annually or otherwise to facilitate Centre–state</tspan></text>
<text x="58" y="860"><tspan class="k">consultation on a wide range of matters are as follows:</tspan></text>
<text x="56" y="886" class="r" style="font-weight:700">(i)</text>
<text x="99" y="886"><tspan class="k">The</tspan><tspan class="r"> governors’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> President</tspan><tspan class="k">).</tspan></text>
<text x="56" y="912" class="r" style="font-weight:700">(ii)</text>
<text x="99" y="912"><tspan class="k">The</tspan><tspan class="r"> chief ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> prime minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="938" class="r" style="font-weight:700">(iii)</text>
<text x="99" y="938"><tspan class="k">The</tspan><tspan class="r"> chief secretaries’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> cabinet secretary</tspan><tspan class="k">).</tspan></text>
<text x="56" y="964" class="r" style="font-weight:700">(iv)</text>
<text x="99" y="964"><tspan class="k">The</tspan><tspan class="r"> conference of inspector-general of police</tspan><tspan class="k">.</tspan></text>
<text x="56" y="990" class="r" style="font-weight:700">(v)</text>
<text x="99" y="990"><tspan class="k">The</tspan><tspan class="r"> chief justices’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> chief justice of India</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1016" class="r" style="font-weight:700">(vi)</text>
<text x="99" y="1016"><tspan class="k">The</tspan><tspan class="r"> conference of vice-chancellors</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1042" class="r" style="font-weight:700">(vii)</text>
<text x="99" y="1042"><tspan class="k">The</tspan><tspan class="r"> home ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central home minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1068" class="r" style="font-weight:700">(viii)</text>
<text x="99" y="1068"><tspan class="k">The</tspan><tspan class="r"> law ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central law minister</tspan><tspan class="k">).</tspan></text>
