<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – IV</text>
<text class="lb" x="40" y="98">10. Other Provisions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Other control provisions:</tspan><tspan class="k"> The Constitution contains the following other provisions which</tspan></text>
<text x="56" y="150"><tspan class="k">enable the Centre to exercise</tspan><tspan class="r"> control over the state administration</tspan><tspan class="k">:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="h" style="font-weight:700">Duty of the Union (Art. 355):</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> imposes</tspan><tspan class="r"> two duties</tspan><tspan class="k"> on the Centre:</tspan></text>
<text x="93" y="198"><tspan class="k">(a) to</tspan><tspan class="b"> protect every state against external aggression and internal disturbance</tspan><tspan class="k">;</tspan></text>
<text x="93" y="220"><tspan class="k">and (b) to</tspan><tspan class="b"> ensure that the government of every state is carried on in accordance</tspan></text>
<text x="93" y="242"><tspan class="b">with the provisions of the Constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="h" style="font-weight:700">Governor as agent of the Centre:</tspan><tspan class="k"> The</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state is</tspan><tspan class="r"> appointed by the</tspan></text>
<text x="93" y="290"><tspan class="r">President</tspan><tspan class="k">. He/she holds office during the</tspan><tspan class="r"> pleasure of the President</tspan><tspan class="k">. In addition to</tspan></text>
<text x="93" y="312"><tspan class="k">the Constitutional head of the state, the governor acts as an</tspan><tspan class="r"> agent of the Centre</tspan></text>
<text x="93" y="334"><tspan class="k">in the state. He/she submits</tspan><tspan class="b"> periodical reports</tspan><tspan class="k"> to the Centre about the</tspan></text>
<text x="93" y="356"><tspan class="k">administrative affairs of the state.</tspan></text>
<text x="56" y="382" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="382"><tspan class="h" style="font-weight:700">State Election Commissioner:</tspan><tspan class="k"> The</tspan><tspan class="r"> state election commissioner</tspan><tspan class="k">, though</tspan><tspan class="b"> appointed</tspan></text>
<text x="93" y="404"><tspan class="b">by the governor</tspan><tspan class="k"> of the state, can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="140" y="458" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 355</tspan><tspan class="k"> – 2 duties</tspan></text>
<text class="sm" x="340" y="458" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan><tspan class="k"> – agent of Centre</tspan></text>
<text class="sm" x="540" y="458" text-anchor="middle"><tspan class="r" style="font-weight:700">SEC</tspan><tspan class="k"> – removed by President</tspan></text>
<text class="lb" x="40" y="494">11. Extra-Constitutional Devices</text>
<text x="44" y="524"><tspan class="h" style="font-weight:700">Extra-constitutional devices:</tspan><tspan class="k"> In addition to the above-mentioned constitutional devices,</tspan></text>
<text x="56" y="546"><tspan class="k">there are</tspan><tspan class="r"> extra-constitutional devices</tspan><tspan class="k"> to promote cooperation and coordination between</tspan></text>
<text x="56" y="568"><tspan class="k">the Centre and the states. These include a number of</tspan><tspan class="r"> advisory bodies</tspan><tspan class="k"> and</tspan><tspan class="r"> conferences</tspan></text>
<text x="56" y="590"><tspan class="k">held at the Central level.</tspan></text>
<line class="ln" x1="340" y1="596" x2="340" y2="608"/>
<line class="ln" x1="190" y1="608" x2="490" y2="608"/>
<line class="ln" x1="190" y1="608" x2="190" y2="624" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="608" x2="490" y2="624" marker-end="url(#ah)"/>
<text class="sm" x="190" y="644" text-anchor="middle"><tspan class="r" style="font-weight:700">Advisory bodies</tspan></text>
<text class="sm" x="490" y="644" text-anchor="middle"><tspan class="r" style="font-weight:700">Conferences</tspan></text>
<text x="44" y="676"><tspan class="h" style="font-weight:700">Non-constitutional advisory bodies:</tspan><tspan class="k"> The</tspan><tspan class="r"> non-constitutional advisory bodies</tspan><tspan class="k"> include the</tspan></text>
<text x="56" y="698"><tspan class="b">NITI Ayog (which succeeded the planning commission)</tspan><tspan class="k">, the</tspan><tspan class="b"> National Integration Council</tspan><tspan class="k">,</tspan></text>
<text x="56" y="720"><tspan class="k">the</tspan><tspan class="b"> Central Council of Health and Family Welfare</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Local</tspan></text>
<text x="56" y="742"><tspan class="b">Government</tspan><tspan class="k">, the</tspan><tspan class="b"> Zonal Councils</tspan><tspan class="k">, the</tspan><tspan class="b"> North-Eastern Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of</tspan></text>
<text x="56" y="764"><tspan class="b">Indian Medicine</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Homoeopathy</tspan><tspan class="k">, the</tspan><tspan class="b"> Transport Development</tspan></text>
<text x="56" y="786"><tspan class="b">Council</tspan><tspan class="k">, the</tspan><tspan class="b"> University Grants Commission</tspan><tspan class="k"> and so on.</tspan></text>
<text x="44" y="814"><tspan class="h" style="font-weight:700">Centre–state conferences:</tspan><tspan class="k"> The important</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held either annually or otherwise</tspan></text>
<text x="56" y="836"><tspan class="k">to facilitate Centre–state consultation on a wide range of matters are as follows:</tspan></text>
<text x="56" y="862" class="r" style="font-weight:700">(i)</text>
<text x="99" y="862"><tspan class="k">The</tspan><tspan class="r"> governors’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> President</tspan><tspan class="k">).</tspan></text>
<text x="56" y="888" class="r" style="font-weight:700">(ii)</text>
<text x="99" y="888"><tspan class="k">The</tspan><tspan class="r"> chief ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> prime minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="914" class="r" style="font-weight:700">(iii)</text>
<text x="99" y="914"><tspan class="k">The</tspan><tspan class="r"> chief secretaries’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> cabinet secretary</tspan><tspan class="k">).</tspan></text>
<text x="56" y="940" class="r" style="font-weight:700">(iv)</text>
<text x="99" y="940"><tspan class="k">The</tspan><tspan class="r"> conference of inspector-general of police</tspan><tspan class="k">.</tspan></text>
<text x="56" y="966" class="r" style="font-weight:700">(v)</text>
<text x="99" y="966"><tspan class="k">The</tspan><tspan class="r"> chief justices’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> chief justice of India</tspan><tspan class="k">).</tspan></text>
<text x="56" y="992" class="r" style="font-weight:700">(vi)</text>
<text x="99" y="992"><tspan class="k">The</tspan><tspan class="r"> conference of vice-chancellors</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1018" class="r" style="font-weight:700">(vii)</text>
<text x="99" y="1018"><tspan class="k">The</tspan><tspan class="r"> home ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central home minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1044" class="r" style="font-weight:700">(viii)</text>
<text x="99" y="1044"><tspan class="k">The</tspan><tspan class="r"> law ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central law minister</tspan><tspan class="k">).</tspan></text>
