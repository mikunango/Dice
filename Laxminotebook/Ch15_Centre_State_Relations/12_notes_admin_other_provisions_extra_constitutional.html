<svg class="n" width="100%" viewBox="0 0 680 1360" role="img"><title>Administrative Relations – IV</title><desc>Administrative Relations – IV</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – IV</text>
<text class="lb" x="40" y="98">10. Other Provisions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Other control provisions:</tspan><tspan class="k"> The Constitution contains the following other provisions which</tspan></text>
<text x="56" y="150"><tspan class="k">enable the Centre to exercise</tspan><tspan class="r"> control over the state administration</tspan><tspan class="k">:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="r">Article 355</tspan><tspan class="k"> imposes</tspan><tspan class="r"> two duties</tspan><tspan class="k"> on the Centre: (a) to</tspan><tspan class="b"> protect every state against</tspan></text>
<text x="93" y="198"><tspan class="b">external aggression and internal disturbance</tspan><tspan class="k">; and (b) to</tspan><tspan class="b"> ensure that the</tspan></text>
<text x="93" y="220"><tspan class="b">government of every state is carried on in accordance with the provisions of the</tspan></text>
<text x="93" y="242"><tspan class="b">Constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state is</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k">.</tspan></text>
<text x="93" y="293"><tspan class="h" style="font-weight:700">Pleasure of President:</tspan><tspan class="k"> He/she holds office during the</tspan><tspan class="r"> pleasure of the President</tspan><tspan class="k">.</tspan></text>
<text x="93" y="318"><tspan class="h" style="font-weight:700">Agent of Centre:</tspan><tspan class="k"> In addition to the Constitutional head of the state, the</tspan></text>
<text x="105" y="340"><tspan class="k">governor acts as an</tspan><tspan class="r"> agent of the Centre</tspan><tspan class="k"> in the state.</tspan></text>
<text x="93" y="365"><tspan class="h" style="font-weight:700">Periodical reports:</tspan><tspan class="k"> He/she submits</tspan><tspan class="b"> periodical reports</tspan><tspan class="k"> to the Centre about the</tspan></text>
<text x="105" y="387"><tspan class="k">administrative affairs of the state.</tspan></text>
<text x="56" y="413" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="413"><tspan class="k">The</tspan><tspan class="r"> state election commissioner</tspan><tspan class="k">, though</tspan><tspan class="b"> appointed by the governor</tspan><tspan class="k"> of the state,</tspan></text>
<text x="93" y="435"><tspan class="k">can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="140" y="489" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 355</tspan><tspan class="k"> – 2 duties</tspan></text>
<text class="sm" x="340" y="489" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan><tspan class="k"> – agent of Centre</tspan></text>
<text class="sm" x="540" y="489" text-anchor="middle"><tspan class="r" style="font-weight:700">SEC</tspan><tspan class="k"> – removed by President</tspan></text>
<text class="lb" x="40" y="525">11. Extra-Constitutional Devices</text>
<text x="44" y="555"><tspan class="h" style="font-weight:700">Extra-constitutional devices:</tspan><tspan class="k"> In addition to the above-mentioned constitutional devices,</tspan></text>
<text x="56" y="577"><tspan class="k">there are</tspan><tspan class="r"> extra-constitutional devices</tspan><tspan class="k"> to promote cooperation and coordination between</tspan></text>
<text x="56" y="599"><tspan class="k">the Centre and the states.</tspan></text>
<text x="44" y="627"><tspan class="h" style="font-weight:700">Bodies &amp; conferences:</tspan><tspan class="k"> These include a number of</tspan><tspan class="r"> advisory bodies</tspan><tspan class="k"> and</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held</tspan></text>
<text x="56" y="649"><tspan class="k">at the Central level.</tspan></text>
<line class="ln" x1="340" y1="655" x2="340" y2="667"/>
<line class="ln" x1="190" y1="667" x2="490" y2="667"/>
<line class="ln" x1="190" y1="667" x2="190" y2="683" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="667" x2="490" y2="683" marker-end="url(#ah)"/>
<text class="sm" x="190" y="703" text-anchor="middle"><tspan class="r" style="font-weight:700">Advisory bodies</tspan></text>
<text class="sm" x="490" y="703" text-anchor="middle"><tspan class="r" style="font-weight:700">Conferences</tspan></text>
<text x="44" y="735"><tspan class="h" style="font-weight:700">Advisory bodies:</tspan><tspan class="k"> The</tspan><tspan class="r"> non-constitutional advisory bodies</tspan><tspan class="k"> include the</tspan><tspan class="b"> NITI Ayog (which</tspan></text>
<text x="56" y="757"><tspan class="b">succeeded the planning commission)</tspan><tspan class="k">, the</tspan><tspan class="b"> National Integration Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central</tspan></text>
<text x="56" y="779"><tspan class="b">Council of Health and Family Welfare</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Local Government</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="801"><tspan class="b">Zonal Councils</tspan><tspan class="k">, the</tspan><tspan class="b"> North-Eastern Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Indian Medicine</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="823"><tspan class="b">Central Council of Homoeopathy</tspan><tspan class="k">, the</tspan><tspan class="b"> Transport Development Council</tspan><tspan class="k">, the</tspan><tspan class="b"> University</tspan></text>
<text x="56" y="845"><tspan class="b">Grants Commission</tspan><tspan class="k"> and so on.</tspan></text>
<text x="44" y="873"><tspan class="h" style="font-weight:700">Conferences:</tspan><tspan class="k"> The important</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held either annually or otherwise to facilitate</tspan></text>
<text x="56" y="895"><tspan class="k">Centre–state consultation on a wide range of matters are as follows:</tspan></text>
<text x="56" y="921" class="r" style="font-weight:700">(i)</text>
<text x="99" y="921"><tspan class="k">The</tspan><tspan class="r"> governors’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> President</tspan><tspan class="k">).</tspan></text>
<text x="56" y="947" class="r" style="font-weight:700">(ii)</text>
<text x="99" y="947"><tspan class="k">The</tspan><tspan class="r"> chief ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> prime minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="973" class="r" style="font-weight:700">(iii)</text>
<text x="99" y="973"><tspan class="k">The</tspan><tspan class="r"> chief secretaries’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> cabinet secretary</tspan><tspan class="k">).</tspan></text>
<text x="56" y="999" class="r" style="font-weight:700">(iv)</text>
<text x="99" y="999"><tspan class="k">The</tspan><tspan class="r"> conference of inspector-general of police</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1025" class="r" style="font-weight:700">(v)</text>
<text x="99" y="1025"><tspan class="k">The</tspan><tspan class="r"> chief justices’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> chief justice of India</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1051" class="r" style="font-weight:700">(vi)</text>
<text x="99" y="1051"><tspan class="k">The</tspan><tspan class="r"> conference of vice-chancellors</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1077" class="r" style="font-weight:700">(vii)</text>
<text x="99" y="1077"><tspan class="k">The</tspan><tspan class="r"> home ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central home minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1103" class="r" style="font-weight:700">(viii)</text>
<text x="99" y="1103"><tspan class="k">The</tspan><tspan class="r"> law ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central law minister</tspan><tspan class="k">).</tspan></text>
