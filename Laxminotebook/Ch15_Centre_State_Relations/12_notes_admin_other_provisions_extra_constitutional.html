<svg class="n" width="100%" viewBox="0 0 680 1279" role="img"><title>Administrative Relations – IV</title><desc>Administrative Relations – IV</desc>

<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – IV</text>
<text class="lb" x="40" y="98">10. Other Provisions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Other provisions:</tspan><tspan class="k"> The Constitution contains the following other provisions which enable</tspan></text>
<text x="56" y="150"><tspan class="k">the Centre to exercise</tspan><tspan class="r"> control over the state administration</tspan><tspan class="k">:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="r">Article 355</tspan><tspan class="k"> imposes</tspan><tspan class="r"> two duties</tspan><tspan class="k"> on the Centre: (a) to</tspan><tspan class="b"> protect every state against</tspan></text>
<text x="93" y="198"><tspan class="b">external aggression and internal disturbance</tspan><tspan class="k">; and (b) to</tspan><tspan class="b"> ensure that the</tspan></text>
<text x="93" y="220"><tspan class="b">government of every state is carried on in accordance with the provisions of the</tspan></text>
<text x="93" y="242"><tspan class="b">Constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="k">The</tspan><tspan class="r"> governor</tspan><tspan class="k"> of a state is</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k">. He/she holds office during</tspan></text>
<text x="93" y="290"><tspan class="k">the</tspan><tspan class="r"> pleasure of the President</tspan><tspan class="k">. In addition to the Constitutional head of the state,</tspan></text>
<text x="93" y="312"><tspan class="k">the governor acts as an</tspan><tspan class="r"> agent of the Centre</tspan><tspan class="k"> in the state. He/she submits</tspan></text>
<text x="93" y="334"><tspan class="b">periodical reports</tspan><tspan class="k"> to the Centre about the administrative affairs of the state.</tspan></text>
<text x="56" y="360" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="360"><tspan class="k">The</tspan><tspan class="r"> state election commissioner</tspan><tspan class="k">, though</tspan><tspan class="b"> appointed by the governor</tspan><tspan class="k"> of the state,</tspan></text>
<text x="93" y="382"><tspan class="k">can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>

<text class="sm" x="140" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 355</tspan><tspan class="k"> – 2 duties</tspan></text>
<text class="sm" x="340" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">Governor</tspan><tspan class="k"> – agent of Centre</tspan></text>
<text class="sm" x="540" y="436" text-anchor="middle"><tspan class="r" style="font-weight:700">SEC</tspan><tspan class="k"> – removed by President</tspan></text>
<text class="lb" x="40" y="472">11. Extra-Constitutional Devices</text>
<text x="44" y="502"><tspan class="h" style="font-weight:700">Extra-constitutional devices:</tspan><tspan class="k"> In addition to the above-mentioned constitutional devices,</tspan></text>
<text x="56" y="524"><tspan class="k">there are</tspan><tspan class="r"> extra-constitutional devices</tspan><tspan class="k"> to promote cooperation and coordination between</tspan></text>
<text x="56" y="546"><tspan class="k">the Centre and the states. These include a number of</tspan><tspan class="r"> advisory bodies</tspan><tspan class="k"> and</tspan><tspan class="r"> conferences</tspan></text>
<text x="56" y="568"><tspan class="k">held at the Central level.</tspan></text>
<line class="ln" x1="340" y1="574" x2="340" y2="586"/>
<line class="ln" x1="190" y1="586" x2="490" y2="586"/>
<line class="ln" x1="190" y1="586" x2="190" y2="602" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="586" x2="490" y2="602" marker-end="url(#ah)"/>
<text class="sm" x="190" y="622" text-anchor="middle"><tspan class="r" style="font-weight:700">Advisory bodies</tspan></text>
<text class="sm" x="490" y="622" text-anchor="middle"><tspan class="r" style="font-weight:700">Conferences</tspan></text>
<text x="44" y="654"><tspan class="h" style="font-weight:700">Advisory bodies:</tspan><tspan class="k"> The</tspan><tspan class="r"> non-constitutional advisory bodies</tspan><tspan class="k"> include the</tspan><tspan class="b"> NITI Ayog (which</tspan></text>
<text x="56" y="676"><tspan class="b">succeeded the planning commission)</tspan><tspan class="k">, the</tspan><tspan class="b"> National Integration Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central</tspan></text>
<text x="56" y="698"><tspan class="b">Council of Health and Family Welfare</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Local Government</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="720"><tspan class="b">Zonal Councils</tspan><tspan class="k">, the</tspan><tspan class="b"> North-Eastern Council</tspan><tspan class="k">, the</tspan><tspan class="b"> Central Council of Indian Medicine</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="742"><tspan class="b">Central Council of Homoeopathy</tspan><tspan class="k">, the</tspan><tspan class="b"> Transport Development Council</tspan><tspan class="k">, the</tspan><tspan class="b"> University</tspan></text>
<text x="56" y="764"><tspan class="b">Grants Commission</tspan><tspan class="k"> and so on.</tspan></text>
<text x="44" y="792"><tspan class="h" style="font-weight:700">Conferences:</tspan><tspan class="k"> The important</tspan><tspan class="r"> conferences</tspan><tspan class="k"> held either annually or otherwise to facilitate</tspan></text>
<text x="56" y="814"><tspan class="k">Centre–state consultation on a wide range of matters are as follows:</tspan></text>
<text x="56" y="840" class="r" style="font-weight:700">(i)</text>
<text x="99" y="840"><tspan class="k">The</tspan><tspan class="r"> governors’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> President</tspan><tspan class="k">).</tspan></text>
<text x="56" y="866" class="r" style="font-weight:700">(ii)</text>
<text x="99" y="866"><tspan class="k">The</tspan><tspan class="r"> chief ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> prime minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="892" class="r" style="font-weight:700">(iii)</text>
<text x="99" y="892"><tspan class="k">The</tspan><tspan class="r"> chief secretaries’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> cabinet secretary</tspan><tspan class="k">).</tspan></text>
<text x="56" y="918" class="r" style="font-weight:700">(iv)</text>
<text x="99" y="918"><tspan class="k">The</tspan><tspan class="r"> conference of inspector-general of police</tspan><tspan class="k">.</tspan></text>
<text x="56" y="944" class="r" style="font-weight:700">(v)</text>
<text x="99" y="944"><tspan class="k">The</tspan><tspan class="r"> chief justices’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> chief justice of India</tspan><tspan class="k">).</tspan></text>
<text x="56" y="970" class="r" style="font-weight:700">(vi)</text>
<text x="99" y="970"><tspan class="k">The</tspan><tspan class="r"> conference of vice-chancellors</tspan><tspan class="k">.</tspan></text>
<text x="56" y="996" class="r" style="font-weight:700">(vii)</text>
<text x="99" y="996"><tspan class="k">The</tspan><tspan class="r"> home ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central home minister</tspan><tspan class="k">).</tspan></text>
<text x="56" y="1022" class="r" style="font-weight:700">(viii)</text>
<text x="99" y="1022"><tspan class="k">The</tspan><tspan class="r"> law ministers’ conference</tspan><tspan class="k"> (presided over by the</tspan><tspan class="b"> Central law minister</tspan><tspan class="k">).</tspan></text>
