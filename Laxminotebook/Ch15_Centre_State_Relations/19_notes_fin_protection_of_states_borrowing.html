<div id="vis-container"><h2 class="sr-only">Protection of States’ Interest and Borrowing</h2>
<svg class="n" width="100%" viewBox="0 0 680 1236" role="img"><title>Protection of States’ Interest and Borrowing</title><desc>Protection of States’ Interest and Borrowing</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="140" y="26" width="401" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Protection of States’ Interest and Borrowing</text>
<text class="lb" x="40" y="98">7. Protection of the States’ Interest</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">To protect the interest of states in the financial matters, the Constitution lays down</tspan></text>
<text x="58" y="148"><tspan class="k">that the following bills can be introduced in the Parliament only on the</tspan></text>
<text x="58" y="170"><tspan class="r">recommendation of the President</tspan><tspan class="k">:</tspan></text>
<text x="44" y="196" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="196"><tspan class="k">A bill which</tspan><tspan class="r"> imposes or varies any tax or duty</tspan><tspan class="k"> in which</tspan><tspan class="b"> states are interested</tspan><tspan class="k">;</tspan></text>
<text x="44" y="222" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="222"><tspan class="k">A bill which varies the meaning of the expression ‘</tspan><tspan class="r">agricultural income</tspan><tspan class="k">’ as defined for</tspan></text>
<text x="58" y="244"><tspan class="k">the purposes of the enactments relating to Indian income tax;</tspan></text>
<text x="44" y="270" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="270"><tspan class="k">A bill which affects the</tspan><tspan class="r"> principles on which moneys are or may be distributable to</tspan></text>
<text x="58" y="292"><tspan class="r">states</tspan><tspan class="k">; and</tspan></text>
<text x="44" y="318" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="318"><tspan class="k">A bill which imposes any</tspan><tspan class="r"> surcharge</tspan><tspan class="k"> on any specified tax or duty for the purpose of the</tspan></text>
<text x="58" y="340"><tspan class="k">Centre.</tspan></text>
<line class="ln" x1="60" y1="346" x2="60" y2="362" marker-end="url(#ah)"/>
<text class="sm" x="72" y="378"><tspan class="k">all 4 bills → only with</tspan><tspan class="r"> President’s recommendation</tspan></text>
<text x="44" y="408" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="408"><tspan class="k">The expression “</tspan><tspan class="r">tax or duty in which states are interested</tspan><tspan class="k">” means: (a) a tax or duty</tspan></text>
<text x="58" y="430"><tspan class="k">the whole or part of the net proceeds whereof are</tspan><tspan class="b"> assigned to any state</tspan><tspan class="k">; or (b) a tax</tspan></text>
<text x="58" y="452"><tspan class="k">or duty by reference to the net proceeds whereof sums are for the time being</tspan><tspan class="b"> payable,</tspan></text>
<text x="58" y="474"><tspan class="b">out of the Consolidated Fund of India to any state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="500" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="500"><tspan class="k">The phrase ‘</tspan><tspan class="r">net proceeds</tspan><tspan class="k">’ means the</tspan><tspan class="r"> proceeds of a tax or a duty minus the cost of</tspan></text>
<text x="58" y="522"><tspan class="r">collection</tspan><tspan class="k">.</tspan></text>
<text x="44" y="548" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="548"><tspan class="k">The net proceeds of a tax or a duty in any area is to be ascertained and certified by</tspan></text>
<text x="58" y="570"><tspan class="k">the</tspan><tspan class="r"> Comptroller and Auditor-General of India</tspan><tspan class="k">.</tspan></text>
<text x="44" y="596" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="596"><tspan class="k">His/her certificate is</tspan><tspan class="r"> final</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="119" y="608" width="118" height="30" rx="3"/>
<text class="sm" x="178" y="627" text-anchor="middle"><tspan class="k">proceeds of tax</tspan></text>
<line class="ln" x1="240" y1="623" x2="260" y2="623" marker-end="url(#ah)"/>
<rect class="bx" x="263" y="608" width="170" height="30" rx="3"/>
<text class="sm" x="348" y="627" text-anchor="middle"><tspan class="b">minus cost of collection</tspan></text>
<line class="ln" x1="436" y1="623" x2="456" y2="623" marker-end="url(#ah)"/>
<rect class="bx" x="459" y="608" width="102" height="30" rx="3"/>
<text class="sm" x="510" y="627" text-anchor="middle"><tspan class="r" style="font-weight:700">net proceeds</tspan></text>
<line class="ln" x1="340" y1="639" x2="340" y2="660" marker-end="url(#ah)"/>
<rect class="bx" x="255" y="662" width="170" height="30" rx="3"/>
<text class="sm" x="340" y="681" text-anchor="middle"><tspan class="k">certified by</tspan><tspan class="r"> CAG</tspan><tspan class="k"> (final)</tspan></text>
<text class="lb" x="40" y="724">8. Borrowing by the Centre and the States</text>
<text x="44" y="752" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="752"><tspan class="k">The Constitution makes the following provisions with regard to the</tspan><tspan class="r"> borrowing powers</tspan><tspan class="k"> of</tspan></text>
<text x="58" y="774"><tspan class="k">the Centre and the states:</tspan></text>
<text x="44" y="800" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="800"><tspan class="k">The</tspan><tspan class="r"> Central government</tspan><tspan class="k"> can borrow</tspan><tspan class="r"> either within India or outside</tspan><tspan class="k"> upon the security of</tspan></text>
<text x="58" y="822"><tspan class="k">the</tspan><tspan class="b"> Consolidated Fund of India</tspan><tspan class="k"> or can give guarantees, but both within the limits fixed</tspan></text>
<text x="58" y="844"><tspan class="k">by the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">. So far,</tspan><tspan class="b"> no such law has been enacted</tspan><tspan class="k"> by the Parliament.</tspan></text>
<text x="44" y="870" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="870"><tspan class="k">Similarly, a</tspan><tspan class="r"> state government</tspan><tspan class="k"> can borrow</tspan><tspan class="r"> within India (and not abroad)</tspan><tspan class="k"> upon the</tspan></text>
<text x="58" y="892"><tspan class="k">security of the</tspan><tspan class="b"> Consolidated Fund of the State</tspan><tspan class="k"> or can give guarantees, but both within</tspan></text>
<text x="58" y="914"><tspan class="k">the limits fixed by the</tspan><tspan class="r"> legislature of that state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="940" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="940"><tspan class="k">The Central government can</tspan><tspan class="r"> make loans to any state</tspan><tspan class="k"> or give guarantees in respect of</tspan></text>
<text x="58" y="962"><tspan class="k">loans raised by any state. Any sums required for the purpose of making such loans are</tspan></text>
<text x="58" y="984"><tspan class="k">to be</tspan><tspan class="b"> charged on the Consolidated Fund of India</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1010" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1010"><tspan class="k">A state</tspan><tspan class="r"> cannot raise any loan without the consent of the Centre</tspan><tspan class="k">, if there is still</tspan></text>
<text x="58" y="1032"><tspan class="b">outstanding any part of a loan</tspan><tspan class="k"> made to the state by the Centre or in respect of which</tspan></text>
<text x="58" y="1054"><tspan class="k">a guarantee has been given by the Centre.</tspan></text>
<rect class="bx" x="46" y="1068" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1086" text-anchor="middle"><tspan class="r" style="font-weight:700">Centre</tspan></text>
<line class="ln" x1="190" y1="1096" x2="190" y2="1110" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1131" text-anchor="middle"><tspan class="k">India</tspan><tspan class="r"> + abroad</tspan></text>
<text class="sm" x="190" y="1153" text-anchor="middle"><tspan class="k">security: CFI</tspan></text>
<text class="sm" x="190" y="1175" text-anchor="middle"><tspan class="k">limits: Parliament (no law yet)</tspan></text>
<rect class="bx" x="346" y="1068" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1086" text-anchor="middle"><tspan class="r" style="font-weight:700">State</tspan></text>
<line class="ln" x1="490" y1="1096" x2="490" y2="1110" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1131" text-anchor="middle"><tspan class="r">only within India</tspan></text>
<text class="sm" x="490" y="1153" text-anchor="middle"><tspan class="k">security: CF of State</tspan></text>
<text class="sm" x="490" y="1175" text-anchor="middle"><tspan class="k">limits: state legislature</tspan></text>
<text class="sm" x="490" y="1197" text-anchor="middle"><tspan class="b">Centre’s consent if loan outstanding</tspan></text>
<line x1="340" y1="1068" x2="340" y2="1200" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
