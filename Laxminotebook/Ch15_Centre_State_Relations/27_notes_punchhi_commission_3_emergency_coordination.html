<div id="vis-container"><h2 class="sr-only">Punchhi Commission – III (Emergency and Coordination)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1601" role="img"><title>Punchhi Commission – III (Emergency and Coordination)</title><desc>Punchhi Commission – III (Emergency and Coordination)</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – III (Emergency and Coordination)</text>
<text x="56" y="92" class="r" style="font-weight:700">17.</text>
<text x="83" y="92"><tspan class="k">When an</tspan><tspan class="r"> external aggression or internal disturbance</tspan><tspan class="k"> paralyses the state</tspan></text>
<text x="83" y="114"><tspan class="k">administration creating a situation of a potential break down of the Constitutional</tspan></text>
<text x="83" y="136"><tspan class="k">machinery of the state,</tspan><tspan class="r"> all alternative courses</tspan><tspan class="k"> available to the Union for</tspan></text>
<text x="83" y="158"><tspan class="k">discharging its paramount responsibility under</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> should be exhausted to</tspan></text>
<text x="83" y="180"><tspan class="k">contain the situation and the exercise of the power under</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> should be</tspan></text>
<text x="83" y="202"><tspan class="k">limited strictly to rectifying a “</tspan><tspan class="b">failure of the Constitutional machinery in the</tspan></text>
<text x="83" y="224"><tspan class="b">state</tspan><tspan class="k">”.</tspan></text>
<text x="56" y="250" class="r" style="font-weight:700">18.</text>
<text x="83" y="250"><tspan class="k">On the question of invoking</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> in case of failure of Constitutional</tspan></text>
<text x="83" y="272"><tspan class="k">machinery in states, suitable amendments are required to incorporate the guidelines</tspan></text>
<text x="83" y="294"><tspan class="k">set forth in the landmark judgement of the Supreme Court in</tspan><tspan class="r"> S.R. Bommai case²²</tspan></text>
<text x="83" y="316"><tspan class="r">(1994)</tspan><tspan class="k">. This would remove possible misgivings in this regard on the part of states</tspan></text>
<text x="83" y="338"><tspan class="k">and help in smoothening Centre-state relations.</tspan></text>
<text x="56" y="364" class="r" style="font-weight:700">19.</text>
<text x="83" y="364"><tspan class="k">Given the strict parameters now set for invoking the emergency provisions under</tspan></text>
<text x="83" y="386"><tspan class="r">Articles 352 and 356</tspan><tspan class="k"> to be used only as a measure of “</tspan><tspan class="r">last resort</tspan><tspan class="k">”, and the duty</tspan></text>
<text x="83" y="408"><tspan class="k">of the Union to protect states under</tspan><tspan class="r"> Article 355</tspan><tspan class="k">, it is necessary to provide a</tspan></text>
<text x="83" y="430"><tspan class="k">Constitutional or legal framework to deal with situations which require Central</tspan></text>
<text x="83" y="452"><tspan class="k">intervention but do not warrant invoking the extreme steps under Articles 352 and</tspan></text>
<text x="83" y="474"><tspan class="k">356. Providing the framework for “</tspan><tspan class="r" style="font-weight:700">localised emergency</tspan><tspan class="k">” would ensure that the</tspan></text>
<text x="83" y="496"><tspan class="k">state government can continue to function and the Assembly would not have to be</tspan></text>
<text x="83" y="518"><tspan class="k">dissolved while providing a mechanism to let the Central Government respond to</tspan></text>
<text x="83" y="540"><tspan class="k">the issue</tspan><tspan class="b"> specifically and locally</tspan><tspan class="k">. The imposition of local emergency is fully justified</tspan></text>
<text x="83" y="562"><tspan class="k">under the mandate of</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 2A of List I</tspan><tspan class="k"> and</tspan><tspan class="r"> Entry 1 of List</tspan></text>
<text x="83" y="584"><tspan class="r">II</tspan><tspan class="k"> of the Seventh Schedule.</tspan></text>
<path d="M50 72 L44 72 L44 590 L50 590" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="91" y="596" width="121" height="30" rx="3"/>
<text class="sm" x="152" y="615" text-anchor="middle"><tspan class="k">crisis in a state</tspan></text>
<line class="ln" x1="216" y1="611" x2="236" y2="611" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="596" width="180" height="30" rx="3"/>
<text class="sm" x="329" y="615" text-anchor="middle"><tspan class="k">Art. 355</tspan><tspan class="b"> alternatives first</tspan></text>
<line class="ln" x1="422" y1="611" x2="442" y2="611" marker-end="url(#ah)"/>
<rect class="bx" x="445" y="596" width="144" height="30" rx="3"/>
<text class="sm" x="517" y="615" text-anchor="middle"><tspan class="r" style="font-weight:700">localised emergency</tspan></text>
<line class="ln" x1="340" y1="627" x2="340" y2="648" marker-end="url(#ah)"/>
<rect class="bx" x="253" y="650" width="174" height="30" rx="3"/>
<text class="sm" x="340" y="669" text-anchor="middle"><tspan class="k">Art. 356 only</tspan><tspan class="r"> last resort</tspan></text>
<text x="56" y="706" class="r" style="font-weight:700">20.</text>
<text x="87" y="706"><tspan class="k">Suitable amendments to</tspan><tspan class="r"> Article 263</tspan><tspan class="k"> are required to make the</tspan><tspan class="r"> Inter-State Council</tspan></text>
<text x="87" y="728"><tspan class="k">a</tspan><tspan class="b"> credible, powerful and fair mechanism</tspan><tspan class="k"> for management of inter-state and</tspan></text>
<text x="87" y="750"><tspan class="k">Centre-state differences.</tspan></text>
<text x="56" y="776" class="r" style="font-weight:700">21.</text>
<text x="87" y="776"><tspan class="k">The</tspan><tspan class="r"> Zonal Councils</tspan><tspan class="k"> should meet</tspan><tspan class="r"> at least twice a year</tspan><tspan class="k"> with an agenda proposed by</tspan></text>
<text x="87" y="798"><tspan class="k">states concerned to maximise co-ordination and promote harmonisation of policies</tspan></text>
<text x="87" y="820"><tspan class="k">and action having inter-state ramification. The Secretariat of a strengthened</tspan></text>
<text x="87" y="842"><tspan class="k">Inter-State Council can function as the</tspan><tspan class="b"> Secretariat of the Zonal Councils</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="868" class="r" style="font-weight:700">22.</text>
<text x="87" y="868"><tspan class="k">The</tspan><tspan class="r"> Empowered Committee of Finance Ministers of States</tspan><tspan class="k"> proved to be a</tspan></text>
<text x="87" y="890"><tspan class="k">successful experiment in inter-state co-ordination on fiscal matters. There is need</tspan></text>
<text x="87" y="912"><tspan class="k">to institutionalise similar models in other sectors as well. A</tspan><tspan class="r"> forum of Chief</tspan></text>
<text x="87" y="934"><tspan class="r">Ministers</tspan><tspan class="k">, Chaired by one of the Chief Minister</tspan><tspan class="b"> by rotation</tspan><tspan class="k"> can be similarly</tspan></text>
<text x="87" y="956"><tspan class="k">thought about particularly to co-ordinate policies of sectors like</tspan><tspan class="b"> energy, food,</tspan></text>
<text x="87" y="978"><tspan class="b">education, environment and health</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1004" class="r" style="font-weight:700">23.</text>
<text x="87" y="1004"><tspan class="r">New all-India services</tspan><tspan class="k"> in sectors like</tspan><tspan class="b"> health, education, engineering and judiciary</tspan></text>
<text x="87" y="1026"><tspan class="k">should be created.</tspan></text>
<text x="56" y="1052" class="r" style="font-weight:700">24.</text>
<text x="87" y="1052"><tspan class="k">Factors inhibiting the composition and functioning of the</tspan><tspan class="r"> Second Chamber</tspan><tspan class="k"> as a</tspan></text>
<text x="87" y="1074"><tspan class="k">representative forum of states should be removed or modified even if it requires</tspan></text>
<text x="87" y="1096"><tspan class="k">amendment of the Constitutional provisions. In fact,</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> offers immense</tspan></text>
<text x="87" y="1118"><tspan class="k">potential to negotiate acceptable solutions to the friction points which emerge</tspan></text>
<text x="87" y="1140"><tspan class="k">between Centre and states in fiscal, legislative and administrative relations.</tspan></text>
<text x="56" y="1166" class="r" style="font-weight:700">25.</text>
<text x="87" y="1166"><tspan class="k">A balance of power between states inter se is desirable and this is possible by</tspan></text>
<text x="87" y="1188"><tspan class="r">equality of representation in the Rajya Sabha</tspan><tspan class="k">. This requires amendment of the</tspan></text>
<text x="87" y="1210"><tspan class="k">relevant provisions to give</tspan><tspan class="r"> equality of seats to states</tspan><tspan class="k"> in the Rajya Sabha,</tspan></text>
<text x="87" y="1232"><tspan class="b">irrespective of their population size</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1258" class="r" style="font-weight:700">26.</text>
<text x="87" y="1258"><tspan class="k">The scope of</tspan><tspan class="r"> devolution of powers to local bodies</tspan><tspan class="k"> to act as institutions of</tspan></text>
<text x="87" y="1280"><tspan class="k">self-government should be</tspan><tspan class="b"> constitutionally defined</tspan><tspan class="k"> through appropriate</tspan></text>
<text x="87" y="1302"><tspan class="k">amendments.</tspan></text>
<text x="56" y="1328" class="r" style="font-weight:700">27.</text>
<text x="87" y="1328"><tspan class="k">All future Central legislations involving states’ involvement should provide for</tspan><tspan class="r"> cost</tspan></text>
<text x="87" y="1350"><tspan class="r">sharing</tspan><tspan class="k"> as in the case of the</tspan><tspan class="r"> RTE Act</tspan><tspan class="k">. Existing Central legislations where the</tspan></text>
<text x="87" y="1372"><tspan class="k">states are entrusted with the responsibility of implementation should be suitably</tspan></text>
<text x="87" y="1394"><tspan class="k">amended providing for</tspan><tspan class="b"> sharing of costs by the Central Government</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1420" class="r" style="font-weight:700">28.</text>
<text x="87" y="1420"><tspan class="k">The</tspan><tspan class="r"> royalty rates on major minerals</tspan><tspan class="k"> should be revised</tspan><tspan class="r"> at least every three years</tspan></text>
<text x="87" y="1442"><tspan class="k">without any delay. States should be properly compensated for any delay in the</tspan></text>
<text x="87" y="1464"><tspan class="k">revision of royalty beyond three years.</tspan></text>
