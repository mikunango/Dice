<div id="vis-container"><h2 class="sr-only">Punchhi Commission – III (Emergency and Coordination)</h2>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – III (Emergency and Coordination)</text>
<text x="56" y="92" class="r" style="font-weight:700">17.</text>
<text x="83" y="92"><tspan class="h" style="font-weight:700">Art. 356 as last resort:</tspan><tspan class="k"> When an</tspan><tspan class="r"> external aggression or internal disturbance</tspan></text>
<text x="83" y="114"><tspan class="k">paralyses the state administration creating a situation of a potential break down of</tspan></text>
<text x="83" y="136"><tspan class="k">the Constitutional machinery of the state,</tspan><tspan class="r"> all alternative courses</tspan><tspan class="k"> available to the</tspan></text>
<text x="83" y="158"><tspan class="k">Union for discharging its paramount responsibility under</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> should be</tspan></text>
<text x="83" y="180"><tspan class="k">exhausted to contain the situation and the exercise of the power under</tspan><tspan class="r"> Article 356</tspan></text>
<text x="83" y="202"><tspan class="k">should be limited strictly to rectifying a “</tspan><tspan class="b">failure of the Constitutional machinery in</tspan></text>
<text x="83" y="224"><tspan class="b">the state</tspan><tspan class="k">”.</tspan></text>
<text x="56" y="250" class="r" style="font-weight:700">18.</text>
<text x="83" y="250"><tspan class="h" style="font-weight:700">Bommai guidelines:</tspan><tspan class="k"> On the question of invoking</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> in case of failure of</tspan></text>
<text x="83" y="272"><tspan class="k">Constitutional machinery in states, suitable amendments are required to incorporate</tspan></text>
<text x="83" y="294"><tspan class="k">the guidelines set forth in the landmark judgement of the Supreme Court in</tspan><tspan class="r"> S.R.</tspan></text>
<text x="83" y="316"><tspan class="r">Bommai case²² (1994)</tspan><tspan class="k">. This would remove possible misgivings in this regard on the</tspan></text>
<text x="83" y="338"><tspan class="k">part of states and help in smoothening Centre-state relations.</tspan></text>
<text x="56" y="364" class="r" style="font-weight:700">19.</text>
<text x="83" y="364"><tspan class="h" style="font-weight:700">Localised emergency:</tspan><tspan class="k"> Given the strict parameters now set for invoking the</tspan></text>
<text x="83" y="386"><tspan class="k">emergency provisions under</tspan><tspan class="r"> Articles 352 and 356</tspan><tspan class="k"> to be used only as a measure of</tspan></text>
<text x="83" y="408"><tspan class="k">“</tspan><tspan class="r">last resort</tspan><tspan class="k">”, and the duty of the Union to protect states under</tspan><tspan class="r"> Article 355</tspan><tspan class="k">, it is</tspan></text>
<text x="83" y="430"><tspan class="k">necessary to provide a Constitutional or legal framework to deal with situations</tspan></text>
<text x="83" y="452"><tspan class="k">which require Central intervention but do not warrant invoking the extreme steps</tspan></text>
<text x="83" y="474"><tspan class="k">under Articles 352 and 356. Providing the framework for “</tspan><tspan class="r" style="font-weight:700">localised emergency</tspan><tspan class="k">”</tspan></text>
<text x="83" y="496"><tspan class="k">would ensure that the state government can continue to function and the</tspan></text>
<text x="83" y="518"><tspan class="k">Assembly would not have to be dissolved while providing a mechanism to let the</tspan></text>
<text x="83" y="540"><tspan class="k">Central Government respond to the issue</tspan><tspan class="b"> specifically and locally</tspan><tspan class="k">. The imposition of</tspan></text>
<text x="83" y="562"><tspan class="k">local emergency is fully justified under the mandate of</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry</tspan></text>
<text x="83" y="584"><tspan class="r">2A of List I</tspan><tspan class="k"> and</tspan><tspan class="r"> Entry 1 of List II</tspan><tspan class="k"> of the Seventh Schedule.</tspan></text>
<path d="M50 72 L44 72 L44 590 L50 590" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="91" y="596" width="121" height="30" rx="3"/>
<text class="sm" x="152" y="615" text-anchor="middle"><tspan class="k">crisis in a state</tspan></text>
<line class="ln" x1="216" y1="611" x2="236" y2="611" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="596" width="180" height="30" rx="3"/>
<text class="sm" x="329" y="615" text-anchor="middle"><tspan class="k">Art. 355</tspan><tspan class="b"> alternatives first</tspan></text>
<line class="ln" x1="422" y1="611" x2="442" y2="611" marker-end="url(#ah)"/>
<rect class="bx" x="445" y="596" width="144" height="30" rx="3"/>
<text class="sm" x="517" y="615" text-anchor="middle"><tspan class="r" style="font-weight:700">localised emergency</tspan></text>
<line class="ln" x1="340" y1="627" x2="340" y2="648" marker-end="url(#ah)"/>
<rect class="bx" x="253" y="650" width="174" height="30" rx="3"/>
<text class="sm" x="340" y="669" text-anchor="middle"><tspan class="k">Art. 356 only</tspan><tspan class="r"> last resort</tspan></text>
<text x="56" y="706" class="r" style="font-weight:700">20.</text>
<text x="87" y="706"><tspan class="h" style="font-weight:700">Strong Inter-State Council:</tspan><tspan class="k"> Suitable amendments to</tspan><tspan class="r"> Article 263</tspan><tspan class="k"> are required to</tspan></text>
<text x="87" y="728"><tspan class="k">make the</tspan><tspan class="r"> Inter-State Council</tspan><tspan class="k"> a</tspan><tspan class="b"> credible, powerful and fair mechanism</tspan><tspan class="k"> for</tspan></text>
<text x="87" y="750"><tspan class="k">management of inter-state and Centre-state differences.</tspan></text>
<text x="56" y="776" class="r" style="font-weight:700">21.</text>
<text x="87" y="776"><tspan class="h" style="font-weight:700">Zonal Councils – twice a year:</tspan><tspan class="k"> The</tspan><tspan class="r"> Zonal Councils</tspan><tspan class="k"> should meet</tspan><tspan class="r"> at least twice a</tspan></text>
<text x="87" y="798"><tspan class="r">year</tspan><tspan class="k"> with an agenda proposed by states concerned to maximise co-ordination and</tspan></text>
<text x="87" y="820"><tspan class="k">promote harmonisation of policies and action having inter-state ramification. The</tspan></text>
<text x="87" y="842"><tspan class="k">Secretariat of a strengthened Inter-State Council can function as the</tspan><tspan class="b"> Secretariat</tspan></text>
<text x="87" y="864"><tspan class="b">of the Zonal Councils</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="890" class="r" style="font-weight:700">22.</text>
<text x="87" y="890"><tspan class="h" style="font-weight:700">Institutional coordination forums:</tspan><tspan class="k"> The</tspan><tspan class="r"> Empowered Committee of Finance</tspan></text>
<text x="87" y="912"><tspan class="r">Ministers of States</tspan><tspan class="k"> proved to be a successful experiment in inter-state</tspan></text>
<text x="87" y="934"><tspan class="k">co-ordination on fiscal matters. There is need to institutionalise similar models in</tspan></text>
<text x="87" y="956"><tspan class="k">other sectors as well. A</tspan><tspan class="r"> forum of Chief Ministers</tspan><tspan class="k">, Chaired by one of the Chief</tspan></text>
<text x="87" y="978"><tspan class="k">Minister</tspan><tspan class="b"> by rotation</tspan><tspan class="k"> can be similarly thought about particularly to co-ordinate</tspan></text>
<text x="87" y="1000"><tspan class="k">policies of sectors like</tspan><tspan class="b"> energy, food, education, environment and health</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1026" class="r" style="font-weight:700">23.</text>
<text x="87" y="1026"><tspan class="h" style="font-weight:700">New AIS:</tspan><tspan class="r"> New all-India services</tspan><tspan class="k"> in sectors like</tspan><tspan class="b"> health, education, engineering and</tspan></text>
<text x="87" y="1048"><tspan class="b">judiciary</tspan><tspan class="k"> should be created.</tspan></text>
<text x="56" y="1074" class="r" style="font-weight:700">24.</text>
<text x="87" y="1074"><tspan class="h" style="font-weight:700">Rajya Sabha as federal chamber:</tspan><tspan class="k"> Factors inhibiting the composition and</tspan></text>
<text x="87" y="1096"><tspan class="k">functioning of the</tspan><tspan class="r"> Second Chamber</tspan><tspan class="k"> as a representative forum of states should be</tspan></text>
<text x="87" y="1118"><tspan class="k">removed or modified even if it requires amendment of the Constitutional provisions.</tspan></text>
<text x="87" y="1140"><tspan class="k">In fact,</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> offers immense potential to negotiate acceptable solutions to</tspan></text>
<text x="87" y="1162"><tspan class="k">the friction points which emerge between Centre and states in fiscal, legislative</tspan></text>
<text x="87" y="1184"><tspan class="k">and administrative relations.</tspan></text>
<text x="56" y="1210" class="r" style="font-weight:700">25.</text>
<text x="87" y="1210"><tspan class="h" style="font-weight:700">Equal representation in Rajya Sabha:</tspan><tspan class="k"> A balance of power between states inter se</tspan></text>
<text x="87" y="1232"><tspan class="k">is desirable and this is possible by</tspan><tspan class="r"> equality of representation in the Rajya Sabha</tspan><tspan class="k">.</tspan></text>
<text x="87" y="1254"><tspan class="k">This requires amendment of the relevant provisions to give</tspan><tspan class="r"> equality of seats to</tspan></text>
<text x="87" y="1276"><tspan class="r">states</tspan><tspan class="k"> in the Rajya Sabha,</tspan><tspan class="b"> irrespective of their population size</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1302" class="r" style="font-weight:700">26.</text>
<text x="87" y="1302"><tspan class="h" style="font-weight:700">Devolution to local bodies:</tspan><tspan class="k"> The scope of</tspan><tspan class="r"> devolution of powers to local bodies</tspan><tspan class="k"> to</tspan></text>
<text x="87" y="1324"><tspan class="k">act as institutions of self-government should be</tspan><tspan class="b"> constitutionally defined</tspan><tspan class="k"> through</tspan></text>
<text x="87" y="1346"><tspan class="k">appropriate amendments.</tspan></text>
<text x="56" y="1372" class="r" style="font-weight:700">27.</text>
<text x="87" y="1372"><tspan class="h" style="font-weight:700">Cost sharing:</tspan><tspan class="k"> All future Central legislations involving states’ involvement should</tspan></text>
<text x="87" y="1394"><tspan class="k">provide for</tspan><tspan class="r"> cost sharing</tspan><tspan class="k"> as in the case of the</tspan><tspan class="r"> RTE Act</tspan><tspan class="k">. Existing Central</tspan></text>
<text x="87" y="1416"><tspan class="k">legislations where the states are entrusted with the responsibility of</tspan></text>
<text x="87" y="1438"><tspan class="k">implementation should be suitably amended providing for</tspan><tspan class="b"> sharing of costs by the</tspan></text>
<text x="87" y="1460"><tspan class="b">Central Government</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1486" class="r" style="font-weight:700">28.</text>
<text x="87" y="1486"><tspan class="h" style="font-weight:700">Royalty revision:</tspan><tspan class="k"> The</tspan><tspan class="r"> royalty rates on major minerals</tspan><tspan class="k"> should be revised</tspan><tspan class="r"> at least</tspan></text>
<text x="87" y="1508"><tspan class="r">every three years</tspan><tspan class="k"> without any delay. States should be properly compensated for</tspan></text>
<text x="87" y="1530"><tspan class="k">any delay in the revision of royalty beyond three years.</tspan></text>
