<div id="vis-container"><h2 class="sr-only">Punchhi Commission – III (Emergency and Coordination)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1807" role="img"><title>Punchhi Commission – III (Emergency and Coordination)</title><desc>Punchhi Commission – III (Emergency and Coordination)</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – III (Emergency and Coordination)</text>
<text x="56" y="92" class="r" style="font-weight:700">17.</text>
<text x="83" y="92"><tspan class="k">When an</tspan><tspan class="r"> external aggression or internal disturbance</tspan><tspan class="k"> paralyses the state</tspan></text>
<text x="83" y="114"><tspan class="k">administration creating a situation of a potential break down of the Constitutional</tspan></text>
<text x="83" y="136"><tspan class="k">machinery of the state,</tspan><tspan class="r"> all alternative courses</tspan><tspan class="k"> available to the Union for</tspan></text>
<text x="83" y="158"><tspan class="k">discharging its paramount responsibility under</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> should be exhausted to</tspan></text>
<text x="83" y="180"><tspan class="k">contain the situation and the exercise of the power under</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> should be</tspan></text>
<text x="83" y="202"><tspan class="k">limited strictly to rectifying a “</tspan><tspan class="b">failure of the Constitutional machinery in the</tspan></text>
<text x="83" y="224"><tspan class="b">state</tspan><tspan class="k">”.</tspan></text>
<text x="56" y="250" class="r" style="font-weight:700">18.</text>
<text x="83" y="250"><tspan class="k">On the question of invoking</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> in case of failure of Constitutional</tspan></text>
<text x="83" y="272"><tspan class="k">machinery in states, suitable amendments are required to incorporate the guidelines</tspan></text>
<text x="83" y="294"><tspan class="k">set forth in the landmark judgement of the Supreme Court in</tspan><tspan class="r"> S.R. Bommai case²²</tspan></text>
<text x="83" y="316"><tspan class="r">(1994)</tspan><tspan class="k">.</tspan></text>
<text x="83" y="341"><tspan class="h" style="font-weight:700">Removes misgivings:</tspan><tspan class="k"> This would remove possible misgivings in this regard on the</tspan></text>
<text x="95" y="363"><tspan class="k">part of states and help in smoothening Centre-state relations.</tspan></text>
<text x="56" y="389" class="r" style="font-weight:700">19.</text>
<text x="83" y="389"><tspan class="k">Given the strict parameters now set for invoking the emergency provisions under</tspan></text>
<text x="83" y="411"><tspan class="r">Articles 352 and 356</tspan><tspan class="k"> to be used only as a measure of “</tspan><tspan class="r">last resort</tspan><tspan class="k">”, and the duty</tspan></text>
<text x="83" y="433"><tspan class="k">of the Union to protect states under</tspan><tspan class="r"> Article 355</tspan><tspan class="k">, it is necessary to provide a</tspan></text>
<text x="83" y="455"><tspan class="k">Constitutional or legal framework to deal with situations which require Central</tspan></text>
<text x="83" y="477"><tspan class="k">intervention but do not warrant invoking the extreme steps under Articles 352 and</tspan></text>
<text x="83" y="499"><tspan class="k">356.</tspan></text>
<text x="83" y="524"><tspan class="h" style="font-weight:700">Localised emergency:</tspan><tspan class="k"> Providing the framework for “</tspan><tspan class="r" style="font-weight:700">localised emergency</tspan><tspan class="k">” would</tspan></text>
<text x="95" y="546"><tspan class="k">ensure that the state government can continue to function and the Assembly</tspan></text>
<text x="95" y="568"><tspan class="k">would not have to be dissolved while providing a mechanism to let the Central</tspan></text>
<text x="95" y="590"><tspan class="k">Government respond to the issue</tspan><tspan class="b"> specifically and locally</tspan><tspan class="k">.</tspan></text>
<text x="83" y="615"><tspan class="h" style="font-weight:700">Constitutional basis:</tspan><tspan class="k"> The imposition of local emergency is fully justified under</tspan></text>
<text x="95" y="637"><tspan class="k">the mandate of</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 2A of List I</tspan><tspan class="k"> and</tspan><tspan class="r"> Entry 1 of List II</tspan></text>
<text x="95" y="659"><tspan class="k">of the Seventh Schedule.</tspan></text>
<path d="M50 72 L44 72 L44 665 L50 665" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="91" y="671" width="121" height="30" rx="3"/>
<text class="sm" x="152" y="690" text-anchor="middle"><tspan class="k">crisis in a state</tspan></text>
<line class="ln" x1="216" y1="686" x2="236" y2="686" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="671" width="180" height="30" rx="3"/>
<text class="sm" x="329" y="690" text-anchor="middle"><tspan class="k">Art. 355</tspan><tspan class="b"> alternatives first</tspan></text>
<line class="ln" x1="422" y1="686" x2="442" y2="686" marker-end="url(#ah)"/>
<rect class="bx" x="445" y="671" width="144" height="30" rx="3"/>
<text class="sm" x="517" y="690" text-anchor="middle"><tspan class="r" style="font-weight:700">localised emergency</tspan></text>
<line class="ln" x1="340" y1="702" x2="340" y2="723" marker-end="url(#ah)"/>
<rect class="bx" x="253" y="725" width="174" height="30" rx="3"/>
<text class="sm" x="340" y="744" text-anchor="middle"><tspan class="k">Art. 356 only</tspan><tspan class="r"> last resort</tspan></text>
<text x="56" y="781" class="r" style="font-weight:700">20.</text>
<text x="87" y="781"><tspan class="k">Suitable amendments to</tspan><tspan class="r"> Article 263</tspan><tspan class="k"> are required to make the</tspan><tspan class="r"> Inter-State Council</tspan></text>
<text x="87" y="803"><tspan class="k">a</tspan><tspan class="b"> credible, powerful and fair mechanism</tspan><tspan class="k"> for management of inter-state and</tspan></text>
<text x="87" y="825"><tspan class="k">Centre-state differences.</tspan></text>
<text x="56" y="851" class="r" style="font-weight:700">21.</text>
<text x="87" y="851"><tspan class="k">The</tspan><tspan class="r"> Zonal Councils</tspan><tspan class="k"> should meet</tspan><tspan class="r"> at least twice a year</tspan><tspan class="k"> with an agenda proposed by</tspan></text>
<text x="87" y="873"><tspan class="k">states concerned to maximise co-ordination and promote harmonisation of policies</tspan></text>
<text x="87" y="895"><tspan class="k">and action having inter-state ramification.</tspan></text>
<text x="87" y="920"><tspan class="h" style="font-weight:700">Common secretariat:</tspan><tspan class="k"> The Secretariat of a strengthened Inter-State Council can</tspan></text>
<text x="99" y="942"><tspan class="k">function as the</tspan><tspan class="b"> Secretariat of the Zonal Councils</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="968" class="r" style="font-weight:700">22.</text>
<text x="87" y="968"><tspan class="k">The</tspan><tspan class="r"> Empowered Committee of Finance Ministers of States</tspan><tspan class="k"> proved to be a</tspan></text>
<text x="87" y="990"><tspan class="k">successful experiment in inter-state co-ordination on fiscal matters.</tspan></text>
<text x="87" y="1015"><tspan class="h" style="font-weight:700">Institutionalise models:</tspan><tspan class="k"> There is need to institutionalise similar models in other</tspan></text>
<text x="99" y="1037"><tspan class="k">sectors as well.</tspan></text>
<text x="87" y="1062"><tspan class="h" style="font-weight:700">CM forum:</tspan><tspan class="k"> A</tspan><tspan class="r"> forum of Chief Ministers</tspan><tspan class="k">, Chaired by one of the Chief Minister</tspan><tspan class="b"> by</tspan></text>
<text x="99" y="1084"><tspan class="b">rotation</tspan><tspan class="k"> can be similarly thought about particularly to co-ordinate policies of</tspan></text>
<text x="99" y="1106"><tspan class="k">sectors like</tspan><tspan class="b"> energy, food, education, environment and health</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1132" class="r" style="font-weight:700">23.</text>
<text x="87" y="1132"><tspan class="r">New all-India services</tspan><tspan class="k"> in sectors like</tspan><tspan class="b"> health, education, engineering and judiciary</tspan></text>
<text x="87" y="1154"><tspan class="k">should be created.</tspan></text>
<text x="56" y="1180" class="r" style="font-weight:700">24.</text>
<text x="87" y="1180"><tspan class="k">Factors inhibiting the composition and functioning of the</tspan><tspan class="r"> Second Chamber</tspan><tspan class="k"> as a</tspan></text>
<text x="87" y="1202"><tspan class="k">representative forum of states should be removed or modified even if it requires</tspan></text>
<text x="87" y="1224"><tspan class="k">amendment of the Constitutional provisions.</tspan></text>
<text x="87" y="1249"><tspan class="h" style="font-weight:700">RS potential:</tspan><tspan class="k"> In fact,</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> offers immense potential to negotiate</tspan></text>
<text x="99" y="1271"><tspan class="k">acceptable solutions to the friction points which emerge between Centre and</tspan></text>
<text x="99" y="1293"><tspan class="k">states in fiscal, legislative and administrative relations.</tspan></text>
<text x="56" y="1319" class="r" style="font-weight:700">25.</text>
<text x="87" y="1319"><tspan class="k">A balance of power between states inter se is desirable and this is possible by</tspan></text>
<text x="87" y="1341"><tspan class="r">equality of representation in the Rajya Sabha</tspan><tspan class="k">.</tspan></text>
<text x="87" y="1366"><tspan class="h" style="font-weight:700">Equal seats:</tspan><tspan class="k"> This requires amendment of the relevant provisions to give</tspan><tspan class="r"> equality</tspan></text>
<text x="99" y="1388"><tspan class="r">of seats to states</tspan><tspan class="k"> in the Rajya Sabha,</tspan><tspan class="b"> irrespective of their population size</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1414" class="r" style="font-weight:700">26.</text>
<text x="87" y="1414"><tspan class="k">The scope of</tspan><tspan class="r"> devolution of powers to local bodies</tspan><tspan class="k"> to act as institutions of</tspan></text>
<text x="87" y="1436"><tspan class="k">self-government should be</tspan><tspan class="b"> constitutionally defined</tspan><tspan class="k"> through appropriate</tspan></text>
<text x="87" y="1458"><tspan class="k">amendments.</tspan></text>
<text x="56" y="1484" class="r" style="font-weight:700">27.</text>
<text x="87" y="1484"><tspan class="k">All future Central legislations involving states’ involvement should provide for</tspan><tspan class="r"> cost</tspan></text>
<text x="87" y="1506"><tspan class="r">sharing</tspan><tspan class="k"> as in the case of the</tspan><tspan class="r"> RTE Act</tspan><tspan class="k">.</tspan></text>
<text x="87" y="1531"><tspan class="h" style="font-weight:700">Amend existing laws:</tspan><tspan class="k"> Existing Central legislations where the states are</tspan></text>
<text x="99" y="1553"><tspan class="k">entrusted with the responsibility of implementation should be suitably amended</tspan></text>
<text x="99" y="1575"><tspan class="k">providing for</tspan><tspan class="b"> sharing of costs by the Central Government</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1601" class="r" style="font-weight:700">28.</text>
<text x="87" y="1601"><tspan class="k">The</tspan><tspan class="r"> royalty rates on major minerals</tspan><tspan class="k"> should be revised</tspan><tspan class="r"> at least every three years</tspan></text>
<text x="87" y="1623"><tspan class="k">without any delay.</tspan></text>
<text x="87" y="1648"><tspan class="h" style="font-weight:700">Compensation:</tspan><tspan class="k"> States should be properly compensated for any delay in the</tspan></text>
<text x="99" y="1670"><tspan class="k">revision of royalty beyond three years.</tspan></text>

<text class="sm" x="111" y="1702" text-anchor="middle"><tspan class="r">Inter-State Council</tspan></text>
<text class="sm" x="111" y="1720" text-anchor="middle"><tspan class="k">Art. 263 amend</tspan></text>

<text class="sm" x="416" y="1702" text-anchor="middle"><tspan class="r">CM forum</tspan></text>
<text class="sm" x="416" y="1720" text-anchor="middle"><tspan class="k">by rotation</tspan></text>

<text class="sm" x="569" y="1702" text-anchor="middle"><tspan class="r">RS equality</tspan></text>

<text class="xs" x="50" y="1768"><tspan class="r" style="font-weight:700">22</tspan><tspan class="k"> S.R. Bommai vs. Union of India (1994).</tspan></text>
