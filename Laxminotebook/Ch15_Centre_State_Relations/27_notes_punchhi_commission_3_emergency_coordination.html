<div id="vis-container"><h2 class="sr-only">Punchhi Commission – III (Emergency and Coordination)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1753" role="img"><title>Punchhi Commission – III (Emergency and Coordination)</title><desc>Punchhi Commission – III (Emergency and Coordination)</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – III (Emergency and Coordination)</text>
<text x="56" y="92" class="r" style="font-weight:700">17.</text>
<text x="83" y="92"><tspan class="k">When an</tspan><tspan class="r"> external aggression or internal disturbance</tspan><tspan class="k"> paralyses the state</tspan></text>
<text x="83" y="114"><tspan class="k">administration creating a situation of a potential break down of the Constitutional</tspan></text>
<text x="83" y="136"><tspan class="k">machinery of the state,</tspan><tspan class="r"> all alternative courses</tspan><tspan class="k"> available to the Union for</tspan></text>
<text x="83" y="158"><tspan class="k">discharging its paramount responsibility under</tspan><tspan class="r"> Article 355</tspan><tspan class="k"> should be exhausted to</tspan></text>
<text x="83" y="180"><tspan class="k">contain the situation and the exercise of the power under</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> should be</tspan></text>
<text x="83" y="202"><tspan class="k">limited strictly to rectifying a “</tspan><tspan class="b">failure of the Constitutional machinery in the</tspan></text>
<text x="83" y="224"><tspan class="b">state</tspan><tspan class="k">”.</tspan></text>
<text x="56" y="250" class="r" style="font-weight:700">18.</text>
<text x="83" y="250"><tspan class="k">On the question of invoking</tspan><tspan class="r"> Article 356</tspan><tspan class="k"> in case of failure of Constitutional</tspan></text>
<text x="83" y="272"><tspan class="k">machinery in states, suitable amendments are required to incorporate the guidelines</tspan></text>
<text x="83" y="294"><tspan class="k">set forth in the landmark judgement of the Supreme Court in</tspan><tspan class="r"> S.R. Bommai case²²</tspan></text>
<text x="83" y="316"><tspan class="r">(1994)</tspan><tspan class="k">.</tspan></text>
<text x="83" y="340" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="340"><tspan class="k">This would remove possible misgivings in this regard on the part of states and</tspan></text>
<text x="97" y="362"><tspan class="k">help in smoothening Centre-state relations.</tspan></text>
<text x="56" y="388" class="r" style="font-weight:700">19.</text>
<text x="83" y="388"><tspan class="k">Given the strict parameters now set for invoking the emergency provisions under</tspan></text>
<text x="83" y="410"><tspan class="r">Articles 352 and 356</tspan><tspan class="k"> to be used only as a measure of “</tspan><tspan class="r">last resort</tspan><tspan class="k">”, and the duty</tspan></text>
<text x="83" y="432"><tspan class="k">of the Union to protect states under</tspan><tspan class="r"> Article 355</tspan><tspan class="k">, it is necessary to provide a</tspan></text>
<text x="83" y="454"><tspan class="k">Constitutional or legal framework to deal with situations which require Central</tspan></text>
<text x="83" y="476"><tspan class="k">intervention but do not warrant invoking the extreme steps under Articles 352 and</tspan></text>
<text x="83" y="498"><tspan class="k">356.</tspan></text>
<text x="83" y="522" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="522"><tspan class="k">Providing the framework for “</tspan><tspan class="r" style="font-weight:700">localised emergency</tspan><tspan class="k">” would ensure that the state</tspan></text>
<text x="97" y="544"><tspan class="k">government can continue to function and the Assembly would not have to be</tspan></text>
<text x="97" y="566"><tspan class="k">dissolved while providing a mechanism to let the Central Government respond to</tspan></text>
<text x="97" y="588"><tspan class="k">the issue</tspan><tspan class="b"> specifically and locally</tspan><tspan class="k">.</tspan></text>
<text x="83" y="612" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="612"><tspan class="k">The imposition of local emergency is fully justified under the mandate of</tspan><tspan class="r"> Article</tspan></text>
<text x="97" y="634"><tspan class="r">355</tspan><tspan class="k"> read with</tspan><tspan class="r"> Entry 2A of List I</tspan><tspan class="k"> and</tspan><tspan class="r"> Entry 1 of List II</tspan><tspan class="k"> of the Seventh Schedule.</tspan></text>
<path d="M50 72 L44 72 L44 640 L50 640" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="91" y="646" width="121" height="30" rx="3"/>
<text class="sm" x="152" y="665" text-anchor="middle"><tspan class="k">crisis in a state</tspan></text>
<line class="ln" x1="216" y1="661" x2="236" y2="661" marker-end="url(#ah)"/>
<rect class="bx" x="239" y="646" width="180" height="30" rx="3"/>
<text class="sm" x="329" y="665" text-anchor="middle"><tspan class="k">Art. 355</tspan><tspan class="b"> alternatives first</tspan></text>
<line class="ln" x1="422" y1="661" x2="442" y2="661" marker-end="url(#ah)"/>
<rect class="bx" x="445" y="646" width="144" height="30" rx="3"/>
<text class="sm" x="517" y="665" text-anchor="middle"><tspan class="r" style="font-weight:700">localised emergency</tspan></text>
<line class="ln" x1="340" y1="677" x2="340" y2="698" marker-end="url(#ah)"/>
<rect class="bx" x="253" y="700" width="174" height="30" rx="3"/>
<text class="sm" x="340" y="719" text-anchor="middle"><tspan class="k">Art. 356 only</tspan><tspan class="r"> last resort</tspan></text>
<text x="56" y="756" class="r" style="font-weight:700">20.</text>
<text x="87" y="756"><tspan class="k">Suitable amendments to</tspan><tspan class="r"> Article 263</tspan><tspan class="k"> are required to make the</tspan><tspan class="r"> Inter-State Council</tspan></text>
<text x="87" y="778"><tspan class="k">a</tspan><tspan class="b"> credible, powerful and fair mechanism</tspan><tspan class="k"> for management of inter-state and</tspan></text>
<text x="87" y="800"><tspan class="k">Centre-state differences.</tspan></text>
<text x="56" y="826" class="r" style="font-weight:700">21.</text>
<text x="87" y="826"><tspan class="k">The</tspan><tspan class="r"> Zonal Councils</tspan><tspan class="k"> should meet</tspan><tspan class="r"> at least twice a year</tspan><tspan class="k"> with an agenda proposed by</tspan></text>
<text x="87" y="848"><tspan class="k">states concerned to maximise co-ordination and promote harmonisation of policies</tspan></text>
<text x="87" y="870"><tspan class="k">and action having inter-state ramification.</tspan></text>
<text x="87" y="894" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="894"><tspan class="k">The Secretariat of a strengthened Inter-State Council can function as the</tspan></text>
<text x="101" y="916"><tspan class="b">Secretariat of the Zonal Councils</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="942" class="r" style="font-weight:700">22.</text>
<text x="87" y="942"><tspan class="k">The</tspan><tspan class="r"> Empowered Committee of Finance Ministers of States</tspan><tspan class="k"> proved to be a</tspan></text>
<text x="87" y="964"><tspan class="k">successful experiment in inter-state co-ordination on fiscal matters.</tspan></text>
<text x="87" y="988" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="988"><tspan class="k">There is need to institutionalise similar models in other sectors as well.</tspan></text>
<text x="87" y="1012" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="1012"><tspan class="k">A</tspan><tspan class="r"> forum of Chief Ministers</tspan><tspan class="k">, Chaired by one of the Chief Minister</tspan><tspan class="b"> by rotation</tspan></text>
<text x="101" y="1034"><tspan class="k">can be similarly thought about particularly to co-ordinate policies of sectors like</tspan></text>
<text x="101" y="1056"><tspan class="b">energy, food, education, environment and health</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1082" class="r" style="font-weight:700">23.</text>
<text x="87" y="1082"><tspan class="r">New all-India services</tspan><tspan class="k"> in sectors like</tspan><tspan class="b"> health, education, engineering and judiciary</tspan></text>
<text x="87" y="1104"><tspan class="k">should be created.</tspan></text>
<text x="56" y="1130" class="r" style="font-weight:700">24.</text>
<text x="87" y="1130"><tspan class="k">Factors inhibiting the composition and functioning of the</tspan><tspan class="r"> Second Chamber</tspan><tspan class="k"> as a</tspan></text>
<text x="87" y="1152"><tspan class="k">representative forum of states should be removed or modified even if it requires</tspan></text>
<text x="87" y="1174"><tspan class="k">amendment of the Constitutional provisions.</tspan></text>
<text x="87" y="1198" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="1198"><tspan class="k">In fact,</tspan><tspan class="r"> Rajya Sabha</tspan><tspan class="k"> offers immense potential to negotiate acceptable solutions</tspan></text>
<text x="101" y="1220"><tspan class="k">to the friction points which emerge between Centre and states in fiscal,</tspan></text>
<text x="101" y="1242"><tspan class="k">legislative and administrative relations.</tspan></text>
<text x="56" y="1268" class="r" style="font-weight:700">25.</text>
<text x="87" y="1268"><tspan class="k">A balance of power between states inter se is desirable and this is possible by</tspan></text>
<text x="87" y="1290"><tspan class="r">equality of representation in the Rajya Sabha</tspan><tspan class="k">.</tspan></text>
<text x="87" y="1314" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="1314"><tspan class="k">This requires amendment of the relevant provisions to give</tspan><tspan class="r"> equality of seats to</tspan></text>
<text x="101" y="1336"><tspan class="r">states</tspan><tspan class="k"> in the Rajya Sabha,</tspan><tspan class="b"> irrespective of their population size</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1362" class="r" style="font-weight:700">26.</text>
<text x="87" y="1362"><tspan class="k">The scope of</tspan><tspan class="r"> devolution of powers to local bodies</tspan><tspan class="k"> to act as institutions of</tspan></text>
<text x="87" y="1384"><tspan class="k">self-government should be</tspan><tspan class="b"> constitutionally defined</tspan><tspan class="k"> through appropriate</tspan></text>
<text x="87" y="1406"><tspan class="k">amendments.</tspan></text>
<text x="56" y="1432" class="r" style="font-weight:700">27.</text>
<text x="87" y="1432"><tspan class="k">All future Central legislations involving states’ involvement should provide for</tspan><tspan class="r"> cost</tspan></text>
<text x="87" y="1454"><tspan class="r">sharing</tspan><tspan class="k"> as in the case of the</tspan><tspan class="r"> RTE Act</tspan><tspan class="k">.</tspan></text>
<text x="87" y="1478" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="1478"><tspan class="k">Existing Central legislations where the states are entrusted with the</tspan></text>
<text x="101" y="1500"><tspan class="k">responsibility of implementation should be suitably amended providing for</tspan></text>
<text x="101" y="1522"><tspan class="b">sharing of costs by the Central Government</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1548" class="r" style="font-weight:700">28.</text>
<text x="87" y="1548"><tspan class="k">The</tspan><tspan class="r"> royalty rates on major minerals</tspan><tspan class="k"> should be revised</tspan><tspan class="r"> at least every three years</tspan></text>
<text x="87" y="1570"><tspan class="k">without any delay.</tspan></text>
<text x="87" y="1594" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="101" y="1594"><tspan class="k">States should be properly compensated for any delay in the revision of royalty</tspan></text>
<text x="101" y="1616"><tspan class="k">beyond three years.</tspan></text>

<text class="sm" x="416" y="1648" text-anchor="middle"><tspan class="r">CM forum</tspan></text>

<text class="sm" x="569" y="1648" text-anchor="middle"><tspan class="r">RS equality</tspan></text>

<text class="xs" x="50" y="1714"><tspan class="r" style="font-weight:700">22</tspan><tspan class="k"> S.R. Bommai vs. Union of India (1994).</tspan></text>
