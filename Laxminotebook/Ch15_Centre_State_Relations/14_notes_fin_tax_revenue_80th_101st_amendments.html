<div id="vis-container"><h2 class="sr-only">Distribution of Tax Revenues – 80th and 101st Amendments</h2>
<svg class="n" width="100%" viewBox="0 0 680 1969" role="img"><title>Distribution of Tax Revenues – 80th and 101st Amendments</title><desc>Distribution of Tax Revenues – 80th and 101st Amendments</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="81" y="26" width="518" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Tax Revenues – 80th and 101st Amendments</text>
<text class="lb" x="40" y="98">2. Distribution of Tax Revenues</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Two amendments:</tspan><tspan class="k"> The</tspan><tspan class="r"> 80th Amendment Act of 2000</tspan><tspan class="k"> and the</tspan><tspan class="r"> 101st Amendment Act of</tspan></text>
<text x="56" y="150"><tspan class="r">2016</tspan><tspan class="k"> have introduced</tspan><tspan class="b"> major changes</tspan><tspan class="k"> in the scheme of the distribution of tax revenues</tspan></text>
<text x="56" y="172"><tspan class="k">between the centre and the states.</tspan></text>
<text class="sh" x="40" y="200"><tspan class="r" style="font-weight:700">80th Amendment</tspan></text>
<text x="44" y="230"><tspan class="h" style="font-weight:700">80th Amdt – 10th FC:</tspan><tspan class="k"> The 80th Amendment was enacted to give effect to the</tspan></text>
<text x="56" y="252"><tspan class="k">recommendations of the</tspan><tspan class="r"> 10th Finance Commission</tspan><tspan class="k">.</tspan></text>
<text x="44" y="280"><tspan class="h" style="font-weight:700">29% to states:</tspan><tspan class="k"> The Commission recommended that out of the total income obtained</tspan></text>
<text x="56" y="302"><tspan class="k">from certain central taxes and duties,</tspan><tspan class="r"> 29%</tspan><tspan class="k"> should go to the states.</tspan></text>
<text x="44" y="330"><tspan class="h" style="font-weight:700">Alternative Scheme:</tspan><tspan class="k"> This is known as the ‘</tspan><tspan class="r">Alternative Scheme of Devolution</tspan><tspan class="k">’ and came</tspan></text>
<text x="56" y="352"><tspan class="k">into effect</tspan><tspan class="b"> retrospectively from April 1, 1996</tspan><tspan class="k">.</tspan></text>
<text x="44" y="380"><tspan class="h" style="font-weight:700">Corporation tax &amp; customs:</tspan><tspan class="k"> This amendment has brought several central taxes and</tspan></text>
<text x="56" y="402"><tspan class="k">duties like</tspan><tspan class="b"> Corporation Tax and Customs Duties</tspan><tspan class="k"> at par with</tspan><tspan class="b"> Income Tax (taxes on income</tspan></text>
<text x="56" y="424"><tspan class="b">other than agricultural income)</tspan><tspan class="k"> as far as their constitutionally mandated sharing with</tspan></text>
<text x="56" y="446"><tspan class="k">the states is concerned.¹³</tspan></text>
<rect class="bx" x="56" y="458" width="178" height="48" rx="3"/>
<text class="sm" x="144" y="486" text-anchor="middle"><tspan class="r">10th Finance Commission</tspan></text>
<line class="ln" x1="236" y1="482" x2="256" y2="482" marker-end="url(#ah)"/>
<rect class="bx" x="259" y="458" width="114" height="48" rx="3"/>
<text class="sm" x="316" y="486" text-anchor="middle"><tspan class="r">29%</tspan><tspan class="k"> to states</tspan></text>
<line class="ln" x1="376" y1="482" x2="396" y2="482" marker-end="url(#ah)"/>
<rect class="bx" x="399" y="458" width="225" height="48" rx="3"/>
<text class="sm" x="512" y="477" text-anchor="middle"><tspan class="r" style="font-weight:700">Alternative Scheme of</tspan></text>
<text class="sm" x="512" y="495" text-anchor="middle"><tspan class="r" style="font-weight:700">Devolution</tspan></text>
<line class="ln" x1="340" y1="507" x2="340" y2="528" marker-end="url(#ah)"/>
<rect class="bx" x="275" y="530" width="129" height="30" rx="3"/>
<text class="sm" x="340" y="549" text-anchor="middle"><tspan class="k">from</tspan><tspan class="b"> 1 April 1996</tspan></text>
<text class="sh" x="40" y="588"><tspan class="r" style="font-weight:700">101st Amendment – GST</tspan></text>
<text x="44" y="618"><tspan class="h" style="font-weight:700">101st Amdt – GST:</tspan><tspan class="k"> The 101st Amendment has paved the way for the introduction of a</tspan></text>
<text x="56" y="640"><tspan class="r">new tax regime (i.e., goods and services tax – GST)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="44" y="668"><tspan class="h" style="font-weight:700">Concurrent taxing power:</tspan><tspan class="k"> Accordingly, the Amendment conferred</tspan><tspan class="r"> concurrent taxing</tspan></text>
<text x="56" y="690"><tspan class="r">powers</tspan><tspan class="k"> upon the Parliament and the State Legislatures to make laws for levying GST on</tspan></text>
<text x="56" y="712"><tspan class="b">every transaction of supply of goods or services or both</tspan><tspan class="k">.</tspan></text>
<text x="44" y="740"><tspan class="h" style="font-weight:700">GST purpose:</tspan><tspan class="k"> The GST replaced a number of indirect taxes levied by the Union and the</tspan></text>
<text x="56" y="762"><tspan class="k">State Governments and is intended to</tspan><tspan class="r"> remove the cascading effect of taxes</tspan><tspan class="k"> and provide</tspan></text>
<text x="56" y="784"><tspan class="k">for a</tspan><tspan class="r"> common national market</tspan><tspan class="k"> for goods and services.</tspan></text>
<text x="44" y="812"><tspan class="h" style="font-weight:700">Central taxes subsumed:</tspan><tspan class="k"> The Amendment provided for subsuming of various</tspan><tspan class="r"> central</tspan></text>
<text x="56" y="834"><tspan class="r">indirect taxes</tspan><tspan class="k"> and levies such as</tspan></text>
<text x="70" y="860" class="r" style="font-weight:700">(i)</text>
<text x="109" y="860"><tspan class="b">Central Excise Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="886" class="r" style="font-weight:700">(ii)</text>
<text x="109" y="886"><tspan class="b">Additional Excise Duties</tspan><tspan class="k">,</tspan></text>
<text x="70" y="912" class="r" style="font-weight:700">(iii)</text>
<text x="109" y="912"><tspan class="b">Excise Duty levied under the Medicinal and Toilet Preparations (Excise Duties)</tspan></text>
<text x="109" y="934"><tspan class="b">Act, 1955</tspan><tspan class="k">,</tspan></text>
<text x="70" y="960" class="r" style="font-weight:700">(iv)</text>
<text x="109" y="960"><tspan class="b">Service Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="986" class="r" style="font-weight:700">(v)</text>
<text x="109" y="986"><tspan class="b">Additional Customs Duty commonly known as Countervailing Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1012" class="r" style="font-weight:700">(vi)</text>
<text x="109" y="1012"><tspan class="b">Special Additional Duty of Customs</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="1038" class="r" style="font-weight:700">(vii)</text>
<text x="109" y="1038"><tspan class="b">Central Surcharges and Cesses</tspan></text>
<path d="M64 840 L58 840 L58 1044 L64 1044" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="58" y="1060"><tspan class="k">so far as they related to the supply of goods and services.</tspan></text>
<text x="44" y="1088"><tspan class="h" style="font-weight:700">State taxes subsumed:</tspan><tspan class="k"> Similarly, the Amendment provided for subsuming of</tspan></text>
<text x="70" y="1114" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1114"><tspan class="b">State Value Added Tax / Sales Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1140" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1140"><tspan class="b">Entertainment Tax (other than the tax levied by the local bodies)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1166" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1166"><tspan class="b">Central Sales Tax (levied by the Centre and collected by the States)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1192" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1192"><tspan class="b">Octroi and Entry Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1218" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1218"><tspan class="b">Purchase Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1244" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1244"><tspan class="b">Luxury Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1270" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1270"><tspan class="b">Taxes on lottery, betting and gambling</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="1296" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1296"><tspan class="b">State Surcharges and Cesses</tspan></text>
<path d="M64 1094 L58 1094 L58 1302 L64 1302" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="58" y="1318"><tspan class="k">in so far as they related to the supply of goods and services.</tspan></text>
<text x="44" y="1346"><tspan class="h" style="font-weight:700">Art. 268-A deleted:</tspan><tspan class="k"> Further, the Amendment</tspan><tspan class="r"> deleted Article 268-A</tspan><tspan class="k"> as well as</tspan><tspan class="r"> Entry</tspan></text>
<text x="56" y="1368"><tspan class="r">92-C</tspan><tspan class="k"> in the Union List, both were dealing with</tspan><tspan class="r"> service tax</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1396"><tspan class="h" style="font-weight:700">88th Amdt 2003:</tspan><tspan class="k"> They were added earlier by the</tspan><tspan class="r"> 88th Amendment Act of 2003</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1424"><tspan class="h" style="font-weight:700">Service tax:</tspan><tspan class="k"> The service tax was</tspan><tspan class="b"> levied by the Centre but collected and appropriated by</tspan></text>
<text x="56" y="1446"><tspan class="b">both the Centre and the States</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="1460" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1478" text-anchor="middle"><tspan class="r" style="font-weight:700">Central taxes subsumed (7)</tspan></text>
<line class="ln" x1="190" y1="1488" x2="190" y2="1502" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1523" text-anchor="middle"><tspan class="k">Central Excise Duty</tspan></text>
<text class="sm" x="190" y="1545" text-anchor="middle"><tspan class="k">Additional Excise Duties</tspan></text>
<text class="sm" x="190" y="1567" text-anchor="middle"><tspan class="k">Medicinal &amp; Toilet Prep. excise</tspan></text>
<text class="sm" x="190" y="1589" text-anchor="middle"><tspan class="k">Service Tax</tspan></text>
<text class="sm" x="190" y="1611" text-anchor="middle"><tspan class="k">Countervailing Duty</tspan></text>
<text class="sm" x="190" y="1633" text-anchor="middle"><tspan class="k">Special Addl. Duty of Customs</tspan></text>
<text class="sm" x="190" y="1655" text-anchor="middle"><tspan class="k">Central surcharges &amp; cesses</tspan></text>
<rect class="bx" x="346" y="1460" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1478" text-anchor="middle"><tspan class="r" style="font-weight:700">State taxes subsumed (8)</tspan></text>
<line class="ln" x1="490" y1="1488" x2="490" y2="1502" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1523" text-anchor="middle"><tspan class="k">State VAT / Sales Tax</tspan></text>
<text class="sm" x="490" y="1545" text-anchor="middle"><tspan class="k">Entertainment Tax</tspan></text>
<text class="sm" x="490" y="1567" text-anchor="middle"><tspan class="k">Central Sales Tax</tspan></text>
<text class="sm" x="490" y="1589" text-anchor="middle"><tspan class="k">Octroi &amp; Entry Tax</tspan></text>
<text class="sm" x="490" y="1611" text-anchor="middle"><tspan class="k">Purchase Tax</tspan></text>
<text class="sm" x="490" y="1633" text-anchor="middle"><tspan class="k">Luxury Tax</tspan></text>
<text class="sm" x="490" y="1655" text-anchor="middle"><tspan class="k">Lottery, betting, gambling</tspan></text>
<text class="sm" x="490" y="1677" text-anchor="middle"><tspan class="k">State surcharges &amp; cesses</tspan></text>
<line x1="340" y1="1460" x2="340" y2="1680" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="109" y="1698" width="260" height="48" rx="3"/>
<text class="sm" x="239" y="1717" text-anchor="middle"><tspan class="r">88th Amdt 2003</tspan><tspan class="k">: Art. 268-A + Entry</tspan></text>
<text class="sm" x="239" y="1735" text-anchor="middle"><tspan class="k">92-C</tspan></text>
<line class="ln" x1="372" y1="1722" x2="392" y2="1722" marker-end="url(#ah)"/>
<rect class="bx" x="395" y="1698" width="177" height="48" rx="3"/>
<text class="sm" x="483" y="1726" text-anchor="middle"><tspan class="r">101st Amdt 2016</tspan><tspan class="k">: deleted</tspan></text>
<text x="44" y="1774"><tspan class="h" style="font-weight:700">Present position:</tspan><tspan class="k"> After the above two amendments (</tspan><tspan class="b">i.e., 80th Amendment and 101st</tspan></text>
<text x="56" y="1796"><tspan class="b">Amendment</tspan><tspan class="k">), the present position with respect to the distribution of tax revenues</tspan></text>
<text x="56" y="1818"><tspan class="k">between the centre and the states is as follows:</tspan></text>
<line class="ln" x1="340" y1="1824" x2="340" y2="1836"/>
<line class="ln" x1="90" y1="1836" x2="590" y2="1836"/>
<line class="ln" x1="90" y1="1836" x2="90" y2="1852" marker-end="url(#ah)"/>
<line class="ln" x1="190" y1="1836" x2="190" y2="1852" marker-end="url(#ah)"/>
<line class="ln" x1="290" y1="1836" x2="290" y2="1852" marker-end="url(#ah)"/>
<line class="ln" x1="390" y1="1836" x2="390" y2="1852" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="1836" x2="490" y2="1852" marker-end="url(#ah)"/>
<line class="ln" x1="590" y1="1836" x2="590" y2="1852" marker-end="url(#ah)"/>
<text class="xs" x="90" y="1872" text-anchor="middle"><tspan class="r">A. Art. 268</tspan></text>
<text class="xs" x="190" y="1872" text-anchor="middle"><tspan class="r">B. Art. 269</tspan></text>
<text class="xs" x="290" y="1872" text-anchor="middle"><tspan class="r">C. Art. 269-A</tspan></text>
<text class="xs" x="390" y="1872" text-anchor="middle"><tspan class="r">D. Art. 270</tspan></text>
<text class="xs" x="490" y="1872" text-anchor="middle"><tspan class="r">E. Art. 271</tspan></text>
<text class="xs" x="590" y="1872" text-anchor="middle"><tspan class="r">F. State taxes</tspan></text>
<text class="xs" x="50" y="1912"><tspan class="r" style="font-weight:700">13</tspan><tspan class="k"> This amendment deleted Article 272 (Taxes which are levied and collected by the Centre and</tspan></text>
<text class="xs" x="50" y="1930"><tspan class="k">may be distributed between the Centre and the states).</tspan></text>
<rect x="40" y="1890" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
