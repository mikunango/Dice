<div id="vis-container"><h2 class="sr-only">Distribution of Tax Revenues – 80th and 101st Amendments</h2>
<svg class="n" width="100%" viewBox="0 0 680 1949" role="img"><title>Distribution of Tax Revenues – 80th and 101st Amendments</title><desc>Distribution of Tax Revenues – 80th and 101st Amendments</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="81" y="26" width="518" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Tax Revenues – 80th and 101st Amendments</text>
<text class="lb" x="40" y="98">2. Distribution of Tax Revenues</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The</tspan><tspan class="r"> 80th Amendment Act of 2000</tspan><tspan class="k"> and the</tspan><tspan class="r"> 101st Amendment Act of 2016</tspan><tspan class="k"> have</tspan></text>
<text x="58" y="148"><tspan class="k">introduced</tspan><tspan class="b"> major changes</tspan><tspan class="k"> in the scheme of the distribution of tax revenues between</tspan></text>
<text x="58" y="170"><tspan class="k">the centre and the states.</tspan></text>
<text class="sh" x="40" y="198"><tspan class="r" style="font-weight:700">80th Amendment</tspan></text>
<text x="44" y="226" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="226"><tspan class="k">The 80th Amendment was enacted to give effect to the recommendations of the</tspan><tspan class="r"> 10th</tspan></text>
<text x="58" y="248"><tspan class="r">Finance Commission</tspan><tspan class="k">.</tspan></text>
<text x="44" y="274" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="274"><tspan class="k">The Commission recommended that out of the total income obtained from certain</tspan></text>
<text x="58" y="296"><tspan class="k">central taxes and duties,</tspan><tspan class="r"> 29%</tspan><tspan class="k"> should go to the states.</tspan></text>
<text x="44" y="322" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="322"><tspan class="k">This is known as the ‘</tspan><tspan class="r">Alternative Scheme of Devolution</tspan><tspan class="k">’ and came into effect</tspan></text>
<text x="58" y="344"><tspan class="b">retrospectively from April 1, 1996</tspan><tspan class="k">.</tspan></text>
<text x="44" y="370" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="370"><tspan class="k">This amendment has brought several central taxes and duties like</tspan><tspan class="b"> Corporation Tax and</tspan></text>
<text x="58" y="392"><tspan class="b">Customs Duties</tspan><tspan class="k"> at par with</tspan><tspan class="b"> Income Tax (taxes on income other than agricultural</tspan></text>
<text x="58" y="414"><tspan class="b">income)</tspan><tspan class="k"> as far as their constitutionally mandated sharing with the states is</tspan></text>
<text x="58" y="436"><tspan class="k">concerned.¹³</tspan></text>
<rect class="bx" x="56" y="448" width="178" height="48" rx="3"/>
<text class="sm" x="144" y="476" text-anchor="middle"><tspan class="r">10th Finance Commission</tspan></text>
<line class="ln" x1="236" y1="472" x2="256" y2="472" marker-end="url(#ah)"/>
<rect class="bx" x="259" y="448" width="114" height="48" rx="3"/>
<text class="sm" x="316" y="476" text-anchor="middle"><tspan class="r">29%</tspan><tspan class="k"> to states</tspan></text>
<line class="ln" x1="376" y1="472" x2="396" y2="472" marker-end="url(#ah)"/>
<rect class="bx" x="399" y="448" width="225" height="48" rx="3"/>
<text class="sm" x="512" y="467" text-anchor="middle"><tspan class="r" style="font-weight:700">Alternative Scheme of</tspan></text>
<text class="sm" x="512" y="485" text-anchor="middle"><tspan class="r" style="font-weight:700">Devolution</tspan></text>
<line class="ln" x1="340" y1="497" x2="340" y2="518" marker-end="url(#ah)"/>
<rect class="bx" x="275" y="520" width="129" height="30" rx="3"/>
<text class="sm" x="340" y="539" text-anchor="middle"><tspan class="k">from</tspan><tspan class="b"> 1 April 1996</tspan></text>
<text class="sh" x="40" y="578"><tspan class="r" style="font-weight:700">101st Amendment – GST</tspan></text>
<text x="44" y="606" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="606"><tspan class="k">The 101st Amendment has paved the way for the introduction of a</tspan><tspan class="r"> new tax regime</tspan></text>
<text x="58" y="628"><tspan class="r">(i.e., goods and services tax – GST)</tspan><tspan class="k"> in the country.</tspan></text>
<text x="44" y="654" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="654"><tspan class="k">Accordingly, the Amendment conferred</tspan><tspan class="r"> concurrent taxing powers</tspan><tspan class="k"> upon the Parliament</tspan></text>
<text x="58" y="676"><tspan class="k">and the State Legislatures to make laws for levying GST on</tspan><tspan class="b"> every transaction of supply</tspan></text>
<text x="58" y="698"><tspan class="b">of goods or services or both</tspan><tspan class="k">.</tspan></text>
<text x="44" y="724" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="724"><tspan class="k">The GST replaced a number of indirect taxes levied by the Union and the State</tspan></text>
<text x="58" y="746"><tspan class="k">Governments and is intended to</tspan><tspan class="r"> remove the cascading effect of taxes</tspan><tspan class="k"> and provide for a</tspan></text>
<text x="58" y="768"><tspan class="r">common national market</tspan><tspan class="k"> for goods and services.</tspan></text>
<text x="44" y="794" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="794"><tspan class="k">The Amendment provided for subsuming of various</tspan><tspan class="r"> central indirect taxes</tspan><tspan class="k"> and levies</tspan></text>
<text x="58" y="816"><tspan class="k">such as</tspan></text>
<text x="70" y="842" class="r" style="font-weight:700">(i)</text>
<text x="109" y="842"><tspan class="b">Central Excise Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="868" class="r" style="font-weight:700">(ii)</text>
<text x="109" y="868"><tspan class="b">Additional Excise Duties</tspan><tspan class="k">,</tspan></text>
<text x="70" y="894" class="r" style="font-weight:700">(iii)</text>
<text x="109" y="894"><tspan class="b">Excise Duty levied under the Medicinal and Toilet Preparations (Excise Duties)</tspan></text>
<text x="109" y="916"><tspan class="b">Act, 1955</tspan><tspan class="k">,</tspan></text>
<text x="70" y="942" class="r" style="font-weight:700">(iv)</text>
<text x="109" y="942"><tspan class="b">Service Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="968" class="r" style="font-weight:700">(v)</text>
<text x="109" y="968"><tspan class="b">Additional Customs Duty commonly known as Countervailing Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="994" class="r" style="font-weight:700">(vi)</text>
<text x="109" y="994"><tspan class="b">Special Additional Duty of Customs</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="1020" class="r" style="font-weight:700">(vii)</text>
<text x="109" y="1020"><tspan class="b">Central Surcharges and Cesses</tspan></text>
<path d="M64 822 L58 822 L58 1026 L64 1026" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="70" y="1046" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="84" y="1046"><tspan class="k">so far as they related to the supply of goods and services.</tspan></text>
<text x="44" y="1072" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1072"><tspan class="k">Similarly, the Amendment provided for subsuming of</tspan></text>
<text x="70" y="1098" class="r" style="font-weight:700">(i)</text>
<text x="113" y="1098"><tspan class="b">State Value Added Tax / Sales Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1124" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1124"><tspan class="b">Entertainment Tax (other than the tax levied by the local bodies)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1150" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1150"><tspan class="b">Central Sales Tax (levied by the Centre and collected by the States)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1176" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1176"><tspan class="b">Octroi and Entry Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1202" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1202"><tspan class="b">Purchase Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1228" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1228"><tspan class="b">Luxury Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1254" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1254"><tspan class="b">Taxes on lottery, betting and gambling</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="1280" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1280"><tspan class="b">State Surcharges and Cesses</tspan></text>
<path d="M64 1078 L58 1078 L58 1286 L64 1286" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="70" y="1306" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="84" y="1306"><tspan class="k">in so far as they related to the supply of goods and services.</tspan></text>
<text x="44" y="1332" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1332"><tspan class="k">Further, the Amendment</tspan><tspan class="r"> deleted Article 268-A</tspan><tspan class="k"> as well as</tspan><tspan class="r"> Entry 92-C</tspan><tspan class="k"> in the Union</tspan></text>
<text x="58" y="1354"><tspan class="k">List, both were dealing with</tspan><tspan class="r"> service tax</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1380" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1380"><tspan class="k">They were added earlier by the</tspan><tspan class="r"> 88th Amendment Act of 2003</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1406" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1406"><tspan class="k">The service tax was</tspan><tspan class="b"> levied by the Centre but collected and appropriated by both the</tspan></text>
<text x="58" y="1428"><tspan class="b">Centre and the States</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="1442" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1460" text-anchor="middle"><tspan class="r" style="font-weight:700">Central taxes subsumed (7)</tspan></text>
<line class="ln" x1="190" y1="1470" x2="190" y2="1484" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1505" text-anchor="middle"><tspan class="k">Central Excise Duty</tspan></text>
<text class="sm" x="190" y="1527" text-anchor="middle"><tspan class="k">Additional Excise Duties</tspan></text>
<text class="sm" x="190" y="1549" text-anchor="middle"><tspan class="k">Medicinal &amp; Toilet Prep. excise</tspan></text>
<text class="sm" x="190" y="1571" text-anchor="middle"><tspan class="k">Service Tax</tspan></text>
<text class="sm" x="190" y="1593" text-anchor="middle"><tspan class="k">Countervailing Duty</tspan></text>
<text class="sm" x="190" y="1615" text-anchor="middle"><tspan class="k">Special Addl. Duty of Customs</tspan></text>
<text class="sm" x="190" y="1637" text-anchor="middle"><tspan class="k">Central surcharges &amp; cesses</tspan></text>
<rect class="bx" x="346" y="1442" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1460" text-anchor="middle"><tspan class="r" style="font-weight:700">State taxes subsumed (8)</tspan></text>
<line class="ln" x1="490" y1="1470" x2="490" y2="1484" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1505" text-anchor="middle"><tspan class="k">State VAT / Sales Tax</tspan></text>
<text class="sm" x="490" y="1527" text-anchor="middle"><tspan class="k">Entertainment Tax</tspan></text>
<text class="sm" x="490" y="1549" text-anchor="middle"><tspan class="k">Central Sales Tax</tspan></text>
<text class="sm" x="490" y="1571" text-anchor="middle"><tspan class="k">Octroi &amp; Entry Tax</tspan></text>
<text class="sm" x="490" y="1593" text-anchor="middle"><tspan class="k">Purchase Tax</tspan></text>
<text class="sm" x="490" y="1615" text-anchor="middle"><tspan class="k">Luxury Tax</tspan></text>
<text class="sm" x="490" y="1637" text-anchor="middle"><tspan class="k">Lottery, betting, gambling</tspan></text>
<text class="sm" x="490" y="1659" text-anchor="middle"><tspan class="k">State surcharges &amp; cesses</tspan></text>
<line x1="340" y1="1442" x2="340" y2="1662" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="109" y="1680" width="260" height="48" rx="3"/>
<text class="sm" x="239" y="1699" text-anchor="middle"><tspan class="r">88th Amdt 2003</tspan><tspan class="k">: Art. 268-A + Entry</tspan></text>
<text class="sm" x="239" y="1717" text-anchor="middle"><tspan class="k">92-C</tspan></text>
<line class="ln" x1="372" y1="1704" x2="392" y2="1704" marker-end="url(#ah)"/>
<rect class="bx" x="395" y="1680" width="177" height="48" rx="3"/>
<text class="sm" x="483" y="1708" text-anchor="middle"><tspan class="r">101st Amdt 2016</tspan><tspan class="k">: deleted</tspan></text>
<text x="44" y="1754" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1754"><tspan class="k">After the above two amendments (</tspan><tspan class="b">i.e., 80th Amendment and 101st Amendment</tspan><tspan class="k">), the</tspan></text>
<text x="58" y="1776"><tspan class="k">present position with respect to the distribution of tax revenues between the centre</tspan></text>
<text x="58" y="1798"><tspan class="k">and the states is as follows:</tspan></text>
<line class="ln" x1="340" y1="1804" x2="340" y2="1816"/>
<line class="ln" x1="90" y1="1816" x2="590" y2="1816"/>
<line class="ln" x1="90" y1="1816" x2="90" y2="1832" marker-end="url(#ah)"/>
<line class="ln" x1="190" y1="1816" x2="190" y2="1832" marker-end="url(#ah)"/>
<line class="ln" x1="290" y1="1816" x2="290" y2="1832" marker-end="url(#ah)"/>
<line class="ln" x1="390" y1="1816" x2="390" y2="1832" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="1816" x2="490" y2="1832" marker-end="url(#ah)"/>
<line class="ln" x1="590" y1="1816" x2="590" y2="1832" marker-end="url(#ah)"/>
<text class="xs" x="90" y="1852" text-anchor="middle"><tspan class="r">A. Art. 268</tspan></text>
<text class="xs" x="190" y="1852" text-anchor="middle"><tspan class="r">B. Art. 269</tspan></text>
<text class="xs" x="290" y="1852" text-anchor="middle"><tspan class="r">C. Art. 269-A</tspan></text>
<text class="xs" x="390" y="1852" text-anchor="middle"><tspan class="r">D. Art. 270</tspan></text>
<text class="xs" x="490" y="1852" text-anchor="middle"><tspan class="r">E. Art. 271</tspan></text>
<text class="xs" x="590" y="1852" text-anchor="middle"><tspan class="r">F. State taxes</tspan></text>
<text class="xs" x="50" y="1892"><tspan class="r" style="font-weight:700">13</tspan><tspan class="k"> This amendment deleted Article 272 (Taxes which are levied and collected by the Centre and</tspan></text>
<text class="xs" x="50" y="1910"><tspan class="k">may be distributed between the Centre and the states).</tspan></text>
<rect x="40" y="1870" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
