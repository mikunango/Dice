<div id="vis-container"><h2 class="sr-only">Distribution of Tax Revenues – 80th and 101st Amendments</h2>
<svg class="n" width="100%" viewBox="0 0 680 1767" role="img"><title>Distribution of Tax Revenues – 80th and 101st Amendments</title><desc>Distribution of Tax Revenues – 80th and 101st Amendments</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="81" y="26" width="518" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Distribution of Tax Revenues – 80th and 101st Amendments</text>
<text class="lb" x="40" y="98">2. Distribution of Tax Revenues</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Restructuring of fiscal federalism:</tspan><tspan class="k"> The</tspan><tspan class="r"> 80th Amendment Act of 2000</tspan><tspan class="k"> and the</tspan><tspan class="r"> 101st</tspan></text>
<text x="56" y="150"><tspan class="r">Amendment Act of 2016</tspan><tspan class="k"> have introduced</tspan><tspan class="b"> major changes</tspan><tspan class="k"> in the scheme of the</tspan></text>
<text x="56" y="172"><tspan class="k">distribution of tax revenues between the centre and the states.</tspan></text>
<text x="44" y="200"><tspan class="h" style="font-weight:700">Alternative Scheme of Devolution (80th Amdt):</tspan><tspan class="k"> The 80th Amendment was enacted to</tspan></text>
<text x="56" y="222"><tspan class="k">give effect to the recommendations of the</tspan><tspan class="r"> 10th Finance Commission</tspan><tspan class="k">. The Commission</tspan></text>
<text x="56" y="244"><tspan class="k">recommended that out of the total income obtained from certain central taxes and</tspan></text>
<text x="56" y="266"><tspan class="k">duties,</tspan><tspan class="r"> 29%</tspan><tspan class="k"> should go to the states. This is known as the ‘</tspan><tspan class="r">Alternative Scheme of</tspan></text>
<text x="56" y="288"><tspan class="r">Devolution</tspan><tspan class="k">’ and came into effect</tspan><tspan class="b"> retrospectively from April 1, 1996</tspan><tspan class="k">. This amendment has</tspan></text>
<text x="56" y="310"><tspan class="k">brought several central taxes and duties like</tspan><tspan class="b"> Corporation Tax and Customs Duties</tspan><tspan class="k"> at par</tspan></text>
<text x="56" y="332"><tspan class="k">with</tspan><tspan class="b"> Income Tax (taxes on income other than agricultural income)</tspan><tspan class="k"> as far as their</tspan></text>
<text x="56" y="354"><tspan class="k">constitutionally mandated sharing with the states is concerned.¹³</tspan></text>
<rect class="bx" x="56" y="366" width="178" height="48" rx="3"/>
<text class="sm" x="144" y="394" text-anchor="middle"><tspan class="r">10th Finance Commission</tspan></text>
<line class="ln" x1="236" y1="390" x2="256" y2="390" marker-end="url(#ah)"/>
<rect class="bx" x="259" y="366" width="114" height="48" rx="3"/>
<text class="sm" x="316" y="394" text-anchor="middle"><tspan class="r">29%</tspan><tspan class="k"> to states</tspan></text>
<line class="ln" x1="376" y1="390" x2="396" y2="390" marker-end="url(#ah)"/>
<rect class="bx" x="399" y="366" width="225" height="48" rx="3"/>
<text class="sm" x="512" y="385" text-anchor="middle"><tspan class="r" style="font-weight:700">Alternative Scheme of</tspan></text>
<text class="sm" x="512" y="403" text-anchor="middle"><tspan class="r" style="font-weight:700">Devolution</tspan></text>
<line class="ln" x1="340" y1="415" x2="340" y2="436" marker-end="url(#ah)"/>
<rect class="bx" x="275" y="438" width="129" height="30" rx="3"/>
<text class="sm" x="340" y="457" text-anchor="middle"><tspan class="k">from</tspan><tspan class="b"> 1 April 1996</tspan></text>
<text x="44" y="496"><tspan class="h" style="font-weight:700">GST regime (101st Amdt):</tspan><tspan class="k"> The 101st Amendment has paved the way for the introduction</tspan></text>
<text x="56" y="518"><tspan class="k">of a</tspan><tspan class="r"> new tax regime (i.e., goods and services tax – GST)</tspan><tspan class="k"> in the country. Accordingly, the</tspan></text>
<text x="56" y="540"><tspan class="k">Amendment conferred</tspan><tspan class="r"> concurrent taxing powers</tspan><tspan class="k"> upon the Parliament and the State</tspan></text>
<text x="56" y="562"><tspan class="k">Legislatures to make laws for levying GST on</tspan><tspan class="b"> every transaction of supply of goods or</tspan></text>
<text x="56" y="584"><tspan class="b">services or both</tspan><tspan class="k">. The GST replaced a number of indirect taxes levied by the Union and</tspan></text>
<text x="56" y="606"><tspan class="k">the State Governments and is intended to</tspan><tspan class="r"> remove the cascading effect of taxes</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="628"><tspan class="k">provide for a</tspan><tspan class="r"> common national market</tspan><tspan class="k"> for goods and services.</tspan></text>
<text x="56" y="652"><tspan class="k">The Amendment provided for subsuming of various</tspan><tspan class="r"> central indirect taxes</tspan><tspan class="k"> and levies</tspan></text>
<text x="56" y="674"><tspan class="k">such as</tspan></text>
<text x="70" y="700" class="r" style="font-weight:700">(i)</text>
<text x="109" y="700"><tspan class="b">Central Excise Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="726" class="r" style="font-weight:700">(ii)</text>
<text x="109" y="726"><tspan class="b">Additional Excise Duties</tspan><tspan class="k">,</tspan></text>
<text x="70" y="752" class="r" style="font-weight:700">(iii)</text>
<text x="109" y="752"><tspan class="b">Excise Duty levied under the Medicinal and Toilet Preparations (Excise Duties)</tspan></text>
<text x="109" y="774"><tspan class="b">Act, 1955</tspan><tspan class="k">,</tspan></text>
<text x="70" y="800" class="r" style="font-weight:700">(iv)</text>
<text x="109" y="800"><tspan class="b">Service Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="826" class="r" style="font-weight:700">(v)</text>
<text x="109" y="826"><tspan class="b">Additional Customs Duty commonly known as Countervailing Duty</tspan><tspan class="k">,</tspan></text>
<text x="70" y="852" class="r" style="font-weight:700">(vi)</text>
<text x="109" y="852"><tspan class="b">Special Additional Duty of Customs</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="878" class="r" style="font-weight:700">(vii)</text>
<text x="109" y="878"><tspan class="b">Central Surcharges and Cesses</tspan></text>
<path d="M64 680 L58 680 L58 884 L64 884" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="58" y="900"><tspan class="k">so far as they related to the supply of goods and services.</tspan></text>
<text x="56" y="924"><tspan class="k">Similarly, the Amendment provided for subsuming of</tspan></text>
<text x="70" y="950" class="r" style="font-weight:700">(i)</text>
<text x="113" y="950"><tspan class="b">State Value Added Tax / Sales Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="976" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="976"><tspan class="b">Entertainment Tax (other than the tax levied by the local bodies)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1002" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1002"><tspan class="b">Central Sales Tax (levied by the Centre and collected by the States)</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1028" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1028"><tspan class="b">Octroi and Entry Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1054" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1054"><tspan class="b">Purchase Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1080" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1080"><tspan class="b">Luxury Tax</tspan><tspan class="k">,</tspan></text>
<text x="70" y="1106" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1106"><tspan class="b">Taxes on lottery, betting and gambling</tspan><tspan class="k">, and</tspan></text>
<text x="70" y="1132" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1132"><tspan class="b">State Surcharges and Cesses</tspan></text>
<path d="M64 930 L58 930 L58 1138 L64 1138" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="58" y="1154"><tspan class="k">in so far as they related to the supply of goods and services.</tspan></text>
<text x="56" y="1178"><tspan class="k">Further, the Amendment</tspan><tspan class="r"> deleted Article 268-A</tspan><tspan class="k"> as well as</tspan><tspan class="r"> Entry 92-C</tspan><tspan class="k"> in the Union</tspan></text>
<text x="56" y="1200"><tspan class="k">List, both were dealing with</tspan><tspan class="r"> service tax</tspan><tspan class="k">. They were added earlier by the</tspan><tspan class="r"> 88th</tspan></text>
<text x="56" y="1222"><tspan class="r">Amendment Act of 2003</tspan><tspan class="k">. The service tax was</tspan><tspan class="b"> levied by the Centre but collected and</tspan></text>
<text x="56" y="1244"><tspan class="b">appropriated by both the Centre and the States</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="1258" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1276" text-anchor="middle"><tspan class="r" style="font-weight:700">Central taxes subsumed (7)</tspan></text>
<line class="ln" x1="190" y1="1286" x2="190" y2="1300" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1321" text-anchor="middle"><tspan class="k">Central Excise Duty</tspan></text>
<text class="sm" x="190" y="1343" text-anchor="middle"><tspan class="k">Additional Excise Duties</tspan></text>
<text class="sm" x="190" y="1365" text-anchor="middle"><tspan class="k">Medicinal &amp; Toilet Prep. excise</tspan></text>
<text class="sm" x="190" y="1387" text-anchor="middle"><tspan class="k">Service Tax</tspan></text>
<text class="sm" x="190" y="1409" text-anchor="middle"><tspan class="k">Countervailing Duty</tspan></text>
<text class="sm" x="190" y="1431" text-anchor="middle"><tspan class="k">Special Addl. Duty of Customs</tspan></text>
<text class="sm" x="190" y="1453" text-anchor="middle"><tspan class="k">Central surcharges &amp; cesses</tspan></text>
<rect class="bx" x="346" y="1258" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1276" text-anchor="middle"><tspan class="r" style="font-weight:700">State taxes subsumed (8)</tspan></text>
<line class="ln" x1="490" y1="1286" x2="490" y2="1300" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1321" text-anchor="middle"><tspan class="k">State VAT / Sales Tax</tspan></text>
<text class="sm" x="490" y="1343" text-anchor="middle"><tspan class="k">Entertainment Tax</tspan></text>
<text class="sm" x="490" y="1365" text-anchor="middle"><tspan class="k">Central Sales Tax</tspan></text>
<text class="sm" x="490" y="1387" text-anchor="middle"><tspan class="k">Octroi &amp; Entry Tax</tspan></text>
<text class="sm" x="490" y="1409" text-anchor="middle"><tspan class="k">Purchase Tax</tspan></text>
<text class="sm" x="490" y="1431" text-anchor="middle"><tspan class="k">Luxury Tax</tspan></text>
<text class="sm" x="490" y="1453" text-anchor="middle"><tspan class="k">Lottery, betting, gambling</tspan></text>
<text class="sm" x="490" y="1475" text-anchor="middle"><tspan class="k">State surcharges &amp; cesses</tspan></text>
<line x1="340" y1="1258" x2="340" y2="1478" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="109" y="1496" width="260" height="48" rx="3"/>
<text class="sm" x="239" y="1515" text-anchor="middle"><tspan class="r">88th Amdt 2003</tspan><tspan class="k">: Art. 268-A + Entry</tspan></text>
<text class="sm" x="239" y="1533" text-anchor="middle"><tspan class="k">92-C</tspan></text>
<line class="ln" x1="372" y1="1520" x2="392" y2="1520" marker-end="url(#ah)"/>
<rect class="bx" x="395" y="1496" width="177" height="48" rx="3"/>
<text class="sm" x="483" y="1524" text-anchor="middle"><tspan class="r">101st Amdt 2016</tspan><tspan class="k">: deleted</tspan></text>
<text x="44" y="1572"><tspan class="h" style="font-weight:700">Present scheme of tax sharing:</tspan><tspan class="k"> After the above two amendments (</tspan><tspan class="b">i.e., 80th</tspan></text>
<text x="56" y="1594"><tspan class="b">Amendment and 101st Amendment</tspan><tspan class="k">), the present position with respect to the distribution</tspan></text>
<text x="56" y="1616"><tspan class="k">of tax revenues between the centre and the states is as follows:</tspan></text>
<line class="ln" x1="340" y1="1622" x2="340" y2="1634"/>
<line class="ln" x1="90" y1="1634" x2="590" y2="1634"/>
<line class="ln" x1="90" y1="1634" x2="90" y2="1650" marker-end="url(#ah)"/>
<line class="ln" x1="190" y1="1634" x2="190" y2="1650" marker-end="url(#ah)"/>
<line class="ln" x1="290" y1="1634" x2="290" y2="1650" marker-end="url(#ah)"/>
<line class="ln" x1="390" y1="1634" x2="390" y2="1650" marker-end="url(#ah)"/>
<line class="ln" x1="490" y1="1634" x2="490" y2="1650" marker-end="url(#ah)"/>
<line class="ln" x1="590" y1="1634" x2="590" y2="1650" marker-end="url(#ah)"/>
<text class="xs" x="90" y="1670" text-anchor="middle"><tspan class="r">A. Art. 268</tspan></text>
<text class="xs" x="190" y="1670" text-anchor="middle"><tspan class="r">B. Art. 269</tspan></text>
<text class="xs" x="290" y="1670" text-anchor="middle"><tspan class="r">C. Art. 269-A</tspan></text>
<text class="xs" x="390" y="1670" text-anchor="middle"><tspan class="r">D. Art. 270</tspan></text>
<text class="xs" x="490" y="1670" text-anchor="middle"><tspan class="r">E. Art. 271</tspan></text>
<text class="xs" x="590" y="1670" text-anchor="middle"><tspan class="r">F. State taxes</tspan></text>
<text class="xs" x="50" y="1710"><tspan class="r" style="font-weight:700">13</tspan><tspan class="k"> This amendment deleted Article 272 (Taxes which are levied and collected by the Centre and</tspan></text>
<text class="xs" x="50" y="1728"><tspan class="k">may be distributed between the Centre and the states).</tspan></text>
<rect x="40" y="1688" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
