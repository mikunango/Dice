@media print{#vis-container{padding:0}}
</style></head><body>
<div id="vis-container"><h2 class="sr-only">Parliamentary Legislation in the State Field – II</h2>
<svg class="n" width="100%" viewBox="0 0 680 1204" role="img"><title>Parliamentary Legislation in the State Field – II</title><desc>Parliamentary Legislation in the State Field – II</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="126" y="26" width="429" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Parliamentary Legislation in the State Field – II</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">C. When States Make a Request</tspan></text>
<text x="44" y="124"><tspan class="h" style="font-weight:700">Consent of two or more states (Art. 252):</tspan><tspan class="k"> When the legislatures of</tspan><tspan class="r"> two or more</tspan></text>
<text x="56" y="146"><tspan class="r">states</tspan><tspan class="k"> pass</tspan><tspan class="r"> resolutions</tspan><tspan class="k"> requesting the Parliament to enact laws on a matter in the</tspan><tspan class="r"> State</tspan></text>
<text x="56" y="168"><tspan class="r">List</tspan><tspan class="k">, then the Parliament can make laws for regulating that matter. A law so enacted</tspan></text>
<text x="56" y="190"><tspan class="k">applies</tspan><tspan class="r"> only to those states</tspan><tspan class="k"> which have passed the resolutions. However,</tspan><tspan class="b"> any other state</tspan></text>
<text x="56" y="212"><tspan class="b">may adopt it afterwards</tspan><tspan class="k"> by passing a resolution to that effect in its legislature. Such a</tspan></text>
<text x="56" y="234"><tspan class="k">law can be</tspan><tspan class="r"> amended or repealed only by the Parliament</tspan><tspan class="k"> and not by the legislatures of</tspan></text>
<text x="56" y="256"><tspan class="k">the concerned states.</tspan></text>
<rect class="bx" x="47" y="268" width="184" height="30" rx="3"/>
<text class="sm" x="139" y="287" text-anchor="middle"><tspan class="r">2+ states</tspan><tspan class="k"> pass resolutions</tspan></text>
<line class="ln" x1="234" y1="283" x2="254" y2="283" marker-end="url(#ah)"/>
<rect class="bx" x="257" y="268" width="158" height="30" rx="3"/>
<text class="sm" x="336" y="287" text-anchor="middle"><tspan class="k">Parliament makes law</tspan></text>
<line class="ln" x1="418" y1="283" x2="438" y2="283" marker-end="url(#ah)"/>
<rect class="bx" x="441" y="268" width="192" height="30" rx="3"/>
<text class="sm" x="537" y="287" text-anchor="middle"><tspan class="k">applies</tspan><tspan class="r"> only to those states</tspan></text>
<line class="ln" x1="340" y1="299" x2="340" y2="320" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="322" width="164" height="30" rx="3"/>
<text class="sm" x="340" y="341" text-anchor="middle"><tspan class="b">others may adopt later</tspan></text>
<text x="44" y="380"><tspan class="h" style="font-weight:700">Surrender of state power:</tspan><tspan class="k"> The effect of passing a resolution under the above provision</tspan></text>
<text x="56" y="402"><tspan class="k">is that the Parliament becomes</tspan><tspan class="r"> entitled to legislate</tspan><tspan class="k"> with respect to a matter for which</tspan></text>
<text x="56" y="424"><tspan class="k">it has no power to make a law. On the other hand, the state legislature</tspan><tspan class="r"> ceases to have</tspan></text>
<text x="56" y="446"><tspan class="r">the power</tspan><tspan class="k"> to make a law with respect to that matter. The resolution operates as</tspan></text>
<text x="56" y="468"><tspan class="r">abdication or surrender</tspan><tspan class="k"> of the power of the state legislature with respect to that matter</tspan></text>
<text x="56" y="490"><tspan class="k">and it is placed</tspan><tspan class="b"> entirely in the hands of Parliament</tspan><tspan class="k"> which alone can then legislate with</tspan></text>
<text x="56" y="512"><tspan class="k">respect to it.</tspan></text>
<rect class="bx" x="46" y="526" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="544" text-anchor="middle"><tspan class="r" style="font-weight:700">Parliament</tspan></text>
<line class="ln" x1="190" y1="554" x2="190" y2="568" marker-end="url(#ah)"/>
<text class="sm" x="190" y="589" text-anchor="middle"><tspan class="r">gains</tspan><tspan class="k"> power on that matter</tspan></text>
<text class="sm" x="190" y="611" text-anchor="middle"><tspan class="k">alone can amend / repeal</tspan></text>
<rect class="bx" x="346" y="526" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="544" text-anchor="middle"><tspan class="r" style="font-weight:700">State legislature</tspan></text>
<line class="ln" x1="490" y1="554" x2="490" y2="568" marker-end="url(#ah)"/>
<text class="sm" x="490" y="589" text-anchor="middle"><tspan class="r">loses</tspan><tspan class="k"> power on that matter</tspan></text>
<text class="sm" x="490" y="611" text-anchor="middle"><tspan class="b">abdication / surrender</tspan></text>
<line x1="340" y1="526" x2="340" y2="614" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="648"><tspan class="h" style="font-weight:700">Examples – Art. 252 laws:</tspan><tspan class="k"> Some examples of laws passed under the above provision are</tspan></text>
<text x="56" y="670"><tspan class="b">Prize Competition Act, 1955</tspan><tspan class="k">;</tspan><tspan class="b"> Wild Life (Protection) Act, 1972</tspan><tspan class="k">;</tspan><tspan class="b"> Water (Prevention and</tspan></text>
<text x="56" y="692"><tspan class="b">Control of Pollution) Act, 1974</tspan><tspan class="k">;</tspan><tspan class="b"> Urban Land (Ceiling and Regulation) Act, 1976</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="714"><tspan class="b">Transplantation of Human Organs Act, 1994</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="742"><tspan class="r" style="font-weight:700">D. To Implement International Agreements</tspan></text>
<text x="44" y="772"><tspan class="h" style="font-weight:700">Treaty implementation (Art. 253):</tspan><tspan class="k"> The Parliament can make laws on any matter in</tspan></text>
<text x="56" y="794"><tspan class="k">the</tspan><tspan class="r"> State List</tspan><tspan class="k"> for implementing the</tspan><tspan class="r"> international treaties, agreements or conventions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="816"><tspan class="k">This provision enables the Central government to fulfil its</tspan><tspan class="b"> international obligations and</tspan></text>
<text x="56" y="838"><tspan class="b">commitments</tspan><tspan class="k">.</tspan></text>
<text x="44" y="866"><tspan class="h" style="font-weight:700">Examples – Art. 253 laws:</tspan><tspan class="k"> Some examples of laws enacted under the above provision</tspan></text>
<text x="56" y="888"><tspan class="k">are</tspan><tspan class="b"> United Nations (Privileges and Immunities) Act, 1947</tspan><tspan class="k">;</tspan><tspan class="b"> Geneva Convention Act, 1960</tspan><tspan class="k">;</tspan></text>
<text x="56" y="910"><tspan class="b">Anti-Hijacking Act, 1982</tspan><tspan class="k"> and legislations relating to</tspan><tspan class="b"> environment and TRIPS</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="938"><tspan class="r" style="font-weight:700">E. During President’s Rule</tspan></text>
<text x="44" y="968"><tspan class="h" style="font-weight:700">President’s Rule – law survives:</tspan><tspan class="k"> When the</tspan><tspan class="r"> President’s rule</tspan><tspan class="k"> is imposed in a state, the</tspan></text>
<text x="56" y="990"><tspan class="k">Parliament becomes empowered to make laws with respect to any matter in the</tspan><tspan class="r"> State</tspan></text>
<text x="56" y="1012"><tspan class="r">List</tspan><tspan class="k"> in relation to that state. A law made so by the Parliament</tspan><tspan class="r"> continues to be operative</tspan></text>
<text x="56" y="1034"><tspan class="r">even after the president’s rule</tspan><tspan class="k">. This means that the period for which such a law remains</tspan></text>
<text x="56" y="1056"><tspan class="k">in force is</tspan><tspan class="b"> not coterminous</tspan><tspan class="k"> with the duration of the President’s rule. But, such a law can</tspan></text>
<text x="56" y="1078"><tspan class="k">be</tspan><tspan class="r"> repealed or altered or re-enacted by the state legislature</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="82" y="1090" width="119" height="30" rx="3"/>
<text class="sm" x="142" y="1109" text-anchor="middle"><tspan class="k">President’s rule</tspan></text>
<line class="ln" x1="204" y1="1105" x2="224" y2="1105" marker-end="url(#ah)"/>
<rect class="bx" x="227" y="1090" width="200" height="30" rx="3"/>
<text class="sm" x="327" y="1109" text-anchor="middle"><tspan class="k">Parliament law on State List</tspan></text>
<line class="ln" x1="430" y1="1105" x2="450" y2="1105" marker-end="url(#ah)"/>
<rect class="bx" x="453" y="1090" width="145" height="30" rx="3"/>
<text class="sm" x="525" y="1109" text-anchor="middle"><tspan class="r">operative even after</tspan></text>
<line class="ln" x1="340" y1="1121" x2="340" y2="1142" marker-end="url(#ah)"/>
<rect class="bx" x="234" y="1144" width="213" height="30" rx="3"/>
<text class="sm" x="340" y="1163" text-anchor="middle"><tspan class="b">state may repeal/alter/re-enact</tspan></text>
</svg>
</div></body></html>
