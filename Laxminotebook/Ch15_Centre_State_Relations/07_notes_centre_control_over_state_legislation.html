<div id="vis-container"><h2 class="sr-only">Centre’s Control Over State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1057" role="img"><title>Centre’s Control Over State Legislation</title><desc>Centre’s Control Over State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Centre’s Control Over State Legislation</text>
<text class="lb" x="40" y="98">4. Centre’s Control Over State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Central control over state legislation:</tspan><tspan class="k"> Besides the Parliament’s power to legislate</tspan></text>
<text x="56" y="150"><tspan class="k">directly on the state subjects under the</tspan><tspan class="b"> exceptional situations</tspan><tspan class="k">, the Constitution</tspan></text>
<text x="56" y="172"><tspan class="k">empowers the Centre to exercise</tspan><tspan class="r"> control over the state’s legislative matters</tspan><tspan class="k"> in the</tspan></text>
<text x="56" y="194"><tspan class="k">following ways:</tspan></text>
<text x="56" y="220" class="r" style="font-weight:700">(i)</text>
<text x="93" y="220"><tspan class="h" style="font-weight:700">Reservation of state bills (Arts. 200 &amp; 201):</tspan><tspan class="k"> The</tspan><tspan class="r"> Governor</tspan><tspan class="k"> can</tspan><tspan class="r"> reserve a bill</tspan></text>
<text x="93" y="242"><tspan class="k">passed by the state legislature for the consideration of the President. It must be</tspan></text>
<text x="93" y="264"><tspan class="k">noted here that the President enjoys</tspan><tspan class="r"> absolute veto</tspan><tspan class="k"> over such a bill (</tspan><tspan class="r">Articles 200</tspan></text>
<text x="93" y="286"><tspan class="r">and 201</tspan><tspan class="k">).</tspan></text>
<text x="56" y="312" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="312"><tspan class="h" style="font-weight:700">Previous sanction – trade bills (Art. 304):</tspan><tspan class="k"> A state bill imposing restrictions on</tspan></text>
<text x="93" y="334"><tspan class="k">the</tspan><tspan class="b"> freedom of trade, commerce and intercourse</tspan><tspan class="k"> with that state or within that</tspan></text>
<text x="93" y="356"><tspan class="k">state can be introduced in the legislature of the state only with the</tspan><tspan class="r"> previous</tspan></text>
<text x="93" y="378"><tspan class="r">sanction of the President</tspan><tspan class="k"> (</tspan><tspan class="r">Article 304</tspan><tspan class="k">).</tspan></text>
<text x="56" y="404" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="404"><tspan class="h" style="font-weight:700">Financial emergency – reservation (Art. 360):</tspan><tspan class="k"> The Centre can direct the states</tspan></text>
<text x="93" y="426"><tspan class="k">to</tspan><tspan class="r"> reserve money bills and other financial bills</tspan><tspan class="k"> passed by the state legislature for</tspan></text>
<text x="93" y="448"><tspan class="k">the President’s consideration during a</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (</tspan><tspan class="r">Article 360</tspan><tspan class="k">).</tspan></text>
<text x="56" y="474" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="474"><tspan class="h" style="font-weight:700">Ordinance only on instructions (Art. 213):</tspan><tspan class="k"> The Governor</tspan><tspan class="r"> cannot make an</tspan></text>
<text x="93" y="496"><tspan class="r">ordinance</tspan><tspan class="k"> without the</tspan><tspan class="b"> instructions from the President</tspan><tspan class="k"> in certain cases (</tspan><tspan class="r">Article</tspan></text>
<text x="93" y="518"><tspan class="r">213</tspan><tspan class="k">).</tspan></text>
<path d="M50 200 L44 200 L44 524 L50 524" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="530" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="559" text-anchor="middle"><tspan class="r">Art. 200 &amp; 201</tspan></text>
<text class="sm" x="111" y="577" text-anchor="middle"><tspan class="k">reserved bill</tspan></text>
<text class="sm" x="111" y="595" text-anchor="middle"><tspan class="b">absolute veto</tspan></text>
<rect class="bx" x="192" y="530" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="559" text-anchor="middle"><tspan class="r">Art. 304</tspan></text>
<text class="sm" x="264" y="577" text-anchor="middle"><tspan class="k">trade restriction bill</tspan></text>
<text class="sm" x="264" y="595" text-anchor="middle"><tspan class="b">previous sanction</tspan></text>
<rect class="bx" x="345" y="530" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="559" text-anchor="middle"><tspan class="r">Art. 360</tspan></text>
<text class="sm" x="416" y="577" text-anchor="middle"><tspan class="k">money/financial bills</tspan></text>
<text class="sm" x="416" y="595" text-anchor="middle"><tspan class="b">financial emergency</tspan></text>
<rect class="bx" x="498" y="530" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="550" text-anchor="middle"><tspan class="r">Art. 213</tspan></text>
<text class="sm" x="569" y="568" text-anchor="middle"><tspan class="k">ordinance</tspan></text>
<text class="sm" x="569" y="586" text-anchor="middle"><tspan class="b">President’s</tspan></text>
<text class="sm" x="569" y="604" text-anchor="middle"><tspan class="b">instructions</tspan></text>
<text x="44" y="644"><tspan class="h" style="font-weight:700">Union supremacy in legislation:</tspan><tspan class="k"> From the above, it is clear that the Constitution has</tspan></text>
<text x="56" y="666"><tspan class="k">assigned a</tspan><tspan class="r"> position of superiority to the Centre</tspan><tspan class="k"> in the legislative sphere. In this context,</tspan></text>
<text x="56" y="688"><tspan class="k">the</tspan><tspan class="r"> Sarkaria Commission on Centre– State Relations (1983–88)</tspan><tspan class="k"> observed:</tspan></text>
<text x="56" y="716"><tspan class="h" style="font-weight:700">Sarkaria – rule of federal supremacy:</tspan><tspan class="k"> “The rule of</tspan><tspan class="r"> federal supremacy</tspan><tspan class="k"> is a technique</tspan></text>
<text x="68" y="738"><tspan class="k">to</tspan><tspan class="b"> avoid absurdity, resolve conflict and ensure harmony</tspan><tspan class="k"> between the Union and state</tspan></text>
<text x="68" y="760"><tspan class="k">laws. If this principle of union supremacy is excluded, it is not difficult to imagine its</tspan></text>
<text x="68" y="782"><tspan class="b">deleterious results</tspan><tspan class="k">. There will be every possibility of our</tspan><tspan class="b"> two-tier political system</tspan></text>
<text x="68" y="804"><tspan class="k">being stultified by</tspan><tspan class="r"> interference, strife, legal chaos and confusion</tspan><tspan class="k"> caused by a host of</tspan></text>
<text x="68" y="826"><tspan class="k">conflicting laws, much to the bewilderment of the common citizen. Integrated</tspan></text>
<text x="68" y="848"><tspan class="k">legislative policy and uniformity on basic issues of common Union–state concern will</tspan></text>
<text x="68" y="870"><tspan class="k">be stymied. The federal principle of</tspan><tspan class="r"> unity in diversity</tspan><tspan class="k"> will be very much a casualty.</tspan></text>
<text x="68" y="892"><tspan class="k">This rule of federal supremacy, therefore, is</tspan><tspan class="r"> indispensable</tspan><tspan class="k"> for the successful</tspan></text>
<text x="68" y="914"><tspan class="k">functioning of the federal system”.⁴</tspan></text>

<text class="sm" x="107" y="953" text-anchor="middle"><tspan class="k">federal supremacy</tspan></text>

<rect class="bx" x="200" y="934" width="181" height="30" rx="3"/>
<text class="sm" x="291" y="953" text-anchor="middle"><tspan class="k">avoids absurdity / conflict</tspan></text>
<line class="ln" x1="384" y1="949" x2="404" y2="949" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="934" width="78" height="30" rx="3"/>
<text class="sm" x="447" y="953" text-anchor="middle"><tspan class="r">harmony</tspan></text>
<line class="ln" x1="489" y1="949" x2="509" y2="949" marker-end="url(#ah)"/>
<rect class="bx" x="512" y="934" width="128" height="30" rx="3"/>
<text class="sm" x="576" y="953" text-anchor="middle"><tspan class="b">unity in diversity</tspan></text>
