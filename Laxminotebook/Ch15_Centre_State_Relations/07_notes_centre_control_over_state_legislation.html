<div id="vis-container"><h2 class="sr-only">Centre’s Control Over State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1129" role="img"><title>Centre’s Control Over State Legislation</title><desc>Centre’s Control Over State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="161" y="26" width="359" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Centre’s Control Over State Legislation</text>
<text class="lb" x="40" y="98">4. Centre’s Control Over State Legislation</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">Besides the Parliament’s power to legislate directly on the state subjects under the</tspan></text>
<text x="58" y="148"><tspan class="b">exceptional situations</tspan><tspan class="k">, the Constitution empowers the Centre to exercise</tspan><tspan class="r"> control over</tspan></text>
<text x="58" y="170"><tspan class="r">the state’s legislative matters</tspan><tspan class="k"> in the following ways:</tspan></text>
<text x="56" y="196" class="r" style="font-weight:700">(i)</text>
<text x="93" y="196"><tspan class="k">The</tspan><tspan class="r"> Governor</tspan><tspan class="k"> can</tspan><tspan class="r"> reserve a bill</tspan><tspan class="k"> passed by the state legislature for the</tspan></text>
<text x="93" y="218"><tspan class="k">consideration of the President.</tspan></text>
<text x="93" y="242" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="242"><tspan class="k">It must be noted here that the President enjoys</tspan><tspan class="r"> absolute veto</tspan><tspan class="k"> over such a bill</tspan></text>
<text x="107" y="264"><tspan class="k">(</tspan><tspan class="r">Articles 200 and 201</tspan><tspan class="k">).</tspan></text>
<text x="56" y="290" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="290"><tspan class="k">A state bill imposing restrictions on the</tspan><tspan class="b"> freedom of trade, commerce and</tspan></text>
<text x="93" y="312"><tspan class="b">intercourse</tspan><tspan class="k"> with that state or within that state can be introduced in the</tspan></text>
<text x="93" y="334"><tspan class="k">legislature of the state only with the</tspan><tspan class="r"> previous sanction of the President</tspan><tspan class="k"> (</tspan><tspan class="r">Article</tspan></text>
<text x="93" y="356"><tspan class="r">304</tspan><tspan class="k">).</tspan></text>
<text x="56" y="382" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="382"><tspan class="k">The Centre can direct the states to</tspan><tspan class="r"> reserve money bills and other financial bills</tspan></text>
<text x="93" y="404"><tspan class="k">passed by the state legislature for the President’s consideration during a</tspan><tspan class="r"> financial</tspan></text>
<text x="93" y="426"><tspan class="r">emergency</tspan><tspan class="k"> (</tspan><tspan class="r">Article 360</tspan><tspan class="k">).</tspan></text>
<text x="56" y="452" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="452"><tspan class="k">The Governor</tspan><tspan class="r"> cannot make an ordinance</tspan><tspan class="k"> without the</tspan><tspan class="b"> instructions from the</tspan></text>
<text x="93" y="474"><tspan class="b">President</tspan><tspan class="k"> in certain cases (</tspan><tspan class="r">Article 213</tspan><tspan class="k">).</tspan></text>
<path d="M50 176 L44 176 L44 480 L50 480" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="486" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="515" text-anchor="middle"><tspan class="r">Art. 200 &amp; 201</tspan></text>
<text class="sm" x="111" y="533" text-anchor="middle"><tspan class="k">reserved bill</tspan></text>
<text class="sm" x="111" y="551" text-anchor="middle"><tspan class="b">absolute veto</tspan></text>
<rect class="bx" x="192" y="486" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="515" text-anchor="middle"><tspan class="r">Art. 304</tspan></text>
<text class="sm" x="264" y="533" text-anchor="middle"><tspan class="k">trade restriction bill</tspan></text>
<text class="sm" x="264" y="551" text-anchor="middle"><tspan class="b">previous sanction</tspan></text>
<rect class="bx" x="345" y="486" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="515" text-anchor="middle"><tspan class="r">Art. 360</tspan></text>
<text class="sm" x="416" y="533" text-anchor="middle"><tspan class="k">money/financial bills</tspan></text>
<text class="sm" x="416" y="551" text-anchor="middle"><tspan class="b">financial emergency</tspan></text>
<rect class="bx" x="498" y="486" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="506" text-anchor="middle"><tspan class="r">Art. 213</tspan></text>
<text class="sm" x="569" y="524" text-anchor="middle"><tspan class="k">ordinance</tspan></text>
<text class="sm" x="569" y="542" text-anchor="middle"><tspan class="b">President’s</tspan></text>
<text class="sm" x="569" y="560" text-anchor="middle"><tspan class="b">instructions</tspan></text>
<text class="lb" x="40" y="604">5. Superiority of the Centre</text>
<text x="44" y="632" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="632"><tspan class="k">From the above, it is clear that the Constitution has assigned a</tspan><tspan class="r"> position of superiority</tspan></text>
<text x="58" y="654"><tspan class="r">to the Centre</tspan><tspan class="k"> in the legislative sphere.</tspan></text>
<text x="44" y="680" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="680"><tspan class="k">In this context, the</tspan><tspan class="r"> Sarkaria Commission on Centre– State Relations (1983–88)</tspan></text>
<text x="58" y="702"><tspan class="k">observed:</tspan></text>
<text x="56" y="729" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="729"><tspan class="k">“The rule of</tspan><tspan class="r"> federal supremacy</tspan><tspan class="k"> is a technique to</tspan><tspan class="b"> avoid absurdity, resolve conflict and</tspan></text>
<text x="70" y="751"><tspan class="b">ensure harmony</tspan><tspan class="k"> between the Union and state laws.</tspan></text>
<text x="56" y="776" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="776"><tspan class="k">If this principle of union supremacy is excluded, it is not difficult to imagine its</tspan></text>
<text x="70" y="798"><tspan class="b">deleterious results</tspan><tspan class="k">.</tspan></text>
<text x="56" y="823" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="823"><tspan class="k">There will be every possibility of our</tspan><tspan class="b"> two-tier political system</tspan><tspan class="k"> being stultified by</tspan></text>
<text x="70" y="845"><tspan class="r">interference, strife, legal chaos and confusion</tspan><tspan class="k"> caused by a host of conflicting laws,</tspan></text>
<text x="70" y="867"><tspan class="k">much to the bewilderment of the common citizen.</tspan></text>
<text x="56" y="892" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="892"><tspan class="k">Integrated legislative policy and uniformity on basic issues of common Union–state</tspan></text>
<text x="70" y="914"><tspan class="k">concern will be stymied.</tspan></text>
<text x="56" y="939" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="939"><tspan class="k">The federal principle of</tspan><tspan class="r"> unity in diversity</tspan><tspan class="k"> will be very much a casualty.</tspan></text>
<text x="56" y="964" style="fill:#2F6FDB;font-weight:700">›</text>
<text x="70" y="964"><tspan class="k">This rule of federal supremacy, therefore, is</tspan><tspan class="r"> indispensable</tspan><tspan class="k"> for the successful</tspan></text>
<text x="70" y="986"><tspan class="k">functioning of the federal system”.⁴</tspan></text>
<line x1="44" y1="710" x2="44" y2="994" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<rect class="bx" x="40" y="1006" width="134" height="30" rx="3"/>
<text class="sm" x="107" y="1025" text-anchor="middle"><tspan class="k">federal supremacy</tspan></text>
<line class="ln" x1="177" y1="1021" x2="197" y2="1021" marker-end="url(#ah)"/>
<rect class="bx" x="200" y="1006" width="181" height="30" rx="3"/>
<text class="sm" x="291" y="1025" text-anchor="middle"><tspan class="k">avoids absurdity / conflict</tspan></text>
<line class="ln" x1="384" y1="1021" x2="404" y2="1021" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="1006" width="78" height="30" rx="3"/>
<text class="sm" x="447" y="1025" text-anchor="middle"><tspan class="r">harmony</tspan></text>
<line class="ln" x1="489" y1="1021" x2="509" y2="1021" marker-end="url(#ah)"/>
<rect class="bx" x="512" y="1006" width="128" height="30" rx="3"/>
<text class="sm" x="576" y="1025" text-anchor="middle"><tspan class="b">unity in diversity</tspan></text>

<text class="xs" x="50" y="1090"><tspan class="k">28–29.</tspan></text>
