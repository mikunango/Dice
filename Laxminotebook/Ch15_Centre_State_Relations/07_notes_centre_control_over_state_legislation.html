<div id="vis-container"><h2 class="sr-only">Centre’s Control Over State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 1164" role="img"><title>Centre’s Control Over State Legislation</title><desc>Centre’s Control Over State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Centre’s Control Over State Legislation</text>
<text class="lb" x="40" y="98">4. Centre’s Control Over State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Four ways of control:</tspan><tspan class="k"> Besides the Parliament’s power to legislate directly on the state</tspan></text>
<text x="56" y="150"><tspan class="k">subjects under the</tspan><tspan class="b"> exceptional situations</tspan><tspan class="k">, the Constitution empowers the Centre to</tspan></text>
<text x="56" y="172"><tspan class="k">exercise</tspan><tspan class="r"> control over the state’s legislative matters</tspan><tspan class="k"> in the following ways:</tspan></text>
<text x="56" y="198" class="r" style="font-weight:700">(i)</text>
<text x="93" y="198"><tspan class="k">The</tspan><tspan class="r"> Governor</tspan><tspan class="k"> can</tspan><tspan class="r"> reserve a bill</tspan><tspan class="k"> passed by the state legislature for the</tspan></text>
<text x="93" y="220"><tspan class="k">consideration of the President.</tspan></text>
<text x="93" y="245"><tspan class="h" style="font-weight:700">Absolute veto:</tspan><tspan class="k"> It must be noted here that the President enjoys</tspan><tspan class="r"> absolute veto</tspan></text>
<text x="105" y="267"><tspan class="k">over such a bill (</tspan><tspan class="r">Articles 200 and 201</tspan><tspan class="k">).</tspan></text>
<text x="56" y="293" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="293"><tspan class="k">A state bill imposing restrictions on the</tspan><tspan class="b"> freedom of trade, commerce and</tspan></text>
<text x="93" y="315"><tspan class="b">intercourse</tspan><tspan class="k"> with that state or within that state can be introduced in the</tspan></text>
<text x="93" y="337"><tspan class="k">legislature of the state only with the</tspan><tspan class="r"> previous sanction of the President</tspan><tspan class="k"> (</tspan><tspan class="r">Article</tspan></text>
<text x="93" y="359"><tspan class="r">304</tspan><tspan class="k">).</tspan></text>
<text x="56" y="385" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="385"><tspan class="k">The Centre can direct the states to</tspan><tspan class="r"> reserve money bills and other financial bills</tspan></text>
<text x="93" y="407"><tspan class="k">passed by the state legislature for the President’s consideration during a</tspan><tspan class="r"> financial</tspan></text>
<text x="93" y="429"><tspan class="r">emergency</tspan><tspan class="k"> (</tspan><tspan class="r">Article 360</tspan><tspan class="k">).</tspan></text>
<text x="56" y="455" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="455"><tspan class="k">The Governor</tspan><tspan class="r"> cannot make an ordinance</tspan><tspan class="k"> without the</tspan><tspan class="b"> instructions from the</tspan></text>
<text x="93" y="477"><tspan class="b">President</tspan><tspan class="k"> in certain cases (</tspan><tspan class="r">Article 213</tspan><tspan class="k">).</tspan></text>
<path d="M50 178 L44 178 L44 483 L50 483" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="489" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="518" text-anchor="middle"><tspan class="r">Art. 200 &amp; 201</tspan></text>
<text class="sm" x="111" y="536" text-anchor="middle"><tspan class="k">reserved bill</tspan></text>
<text class="sm" x="111" y="554" text-anchor="middle"><tspan class="b">absolute veto</tspan></text>
<rect class="bx" x="192" y="489" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="518" text-anchor="middle"><tspan class="r">Art. 304</tspan></text>
<text class="sm" x="264" y="536" text-anchor="middle"><tspan class="k">trade restriction bill</tspan></text>
<text class="sm" x="264" y="554" text-anchor="middle"><tspan class="b">previous sanction</tspan></text>
<rect class="bx" x="345" y="489" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="518" text-anchor="middle"><tspan class="r">Art. 360</tspan></text>
<text class="sm" x="416" y="536" text-anchor="middle"><tspan class="k">money/financial bills</tspan></text>
<text class="sm" x="416" y="554" text-anchor="middle"><tspan class="b">financial emergency</tspan></text>
<rect class="bx" x="498" y="489" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="509" text-anchor="middle"><tspan class="r">Art. 213</tspan></text>
<text class="sm" x="569" y="527" text-anchor="middle"><tspan class="k">ordinance</tspan></text>
<text class="sm" x="569" y="545" text-anchor="middle"><tspan class="b">President’s</tspan></text>
<text class="sm" x="569" y="563" text-anchor="middle"><tspan class="b">instructions</tspan></text>
<text class="lb" x="40" y="607">5. Superiority of the Centre</text>
<text x="44" y="637"><tspan class="h" style="font-weight:700">Centre superior:</tspan><tspan class="k"> From the above, it is clear that the Constitution has assigned a</tspan></text>
<text x="56" y="659"><tspan class="r">position of superiority to the Centre</tspan><tspan class="k"> in the legislative sphere.</tspan></text>
<text x="44" y="687"><tspan class="h" style="font-weight:700">Sarkaria view:</tspan><tspan class="k"> In this context, the</tspan><tspan class="r"> Sarkaria Commission on Centre– State Relations</tspan></text>
<text x="56" y="709"><tspan class="r">(1983–88)</tspan><tspan class="k"> observed:</tspan></text>
<text x="56" y="737"><tspan class="h" style="font-weight:700">Federal supremacy:</tspan><tspan class="k"> “The rule of</tspan><tspan class="r"> federal supremacy</tspan><tspan class="k"> is a technique to</tspan><tspan class="b"> avoid absurdity,</tspan></text>
<text x="68" y="759"><tspan class="b">resolve conflict and ensure harmony</tspan><tspan class="k"> between the Union and state laws.</tspan></text>
<text x="56" y="785"><tspan class="h" style="font-weight:700">Deleterious results:</tspan><tspan class="k"> If this principle of union supremacy is excluded, it is not</tspan></text>
<text x="68" y="807"><tspan class="k">difficult to imagine its</tspan><tspan class="b"> deleterious results</tspan><tspan class="k">.</tspan></text>
<text x="56" y="833"><tspan class="h" style="font-weight:700">Legal chaos:</tspan><tspan class="k"> There will be every possibility of our</tspan><tspan class="b"> two-tier political system</tspan><tspan class="k"> being</tspan></text>
<text x="68" y="855"><tspan class="k">stultified by</tspan><tspan class="r"> interference, strife, legal chaos and confusion</tspan><tspan class="k"> caused by a host of</tspan></text>
<text x="68" y="877"><tspan class="k">conflicting laws, much to the bewilderment of the common citizen.</tspan></text>
<text x="56" y="903"><tspan class="h" style="font-weight:700">Policy stymied:</tspan><tspan class="k"> Integrated legislative policy and uniformity on basic issues of</tspan></text>
<text x="68" y="925"><tspan class="k">common Union–state concern will be stymied.</tspan></text>
<text x="56" y="951"><tspan class="h" style="font-weight:700">Unity in diversity:</tspan><tspan class="k"> The federal principle of</tspan><tspan class="r"> unity in diversity</tspan><tspan class="k"> will be very much a</tspan></text>
<text x="68" y="973"><tspan class="k">casualty.</tspan></text>
<text x="56" y="999"><tspan class="h" style="font-weight:700">Indispensable rule:</tspan><tspan class="k"> This rule of federal supremacy, therefore, is</tspan><tspan class="r"> indispensable</tspan><tspan class="k"> for the</tspan></text>
<text x="68" y="1021"><tspan class="k">successful functioning of the federal system”.⁴</tspan></text>

<rect class="bx" x="40" y="1041" width="134" height="30" rx="3"/>
<text class="sm" x="107" y="1060" text-anchor="middle"><tspan class="k">federal supremacy</tspan></text>
<line class="ln" x1="177" y1="1056" x2="197" y2="1056" marker-end="url(#ah)"/>
<rect class="bx" x="200" y="1041" width="181" height="30" rx="3"/>
<text class="sm" x="291" y="1060" text-anchor="middle"><tspan class="k">avoids absurdity / conflict</tspan></text>
<line class="ln" x1="384" y1="1056" x2="404" y2="1056" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="1041" width="78" height="30" rx="3"/>
<text class="sm" x="447" y="1060" text-anchor="middle"><tspan class="r">harmony</tspan></text>
<line class="ln" x1="489" y1="1056" x2="509" y2="1056" marker-end="url(#ah)"/>
<rect class="bx" x="512" y="1041" width="128" height="30" rx="3"/>
<text class="sm" x="576" y="1060" text-anchor="middle"><tspan class="b">unity in diversity</tspan></text>
