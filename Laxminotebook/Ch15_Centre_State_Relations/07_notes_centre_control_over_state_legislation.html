<div id="vis-container"><h2 class="sr-only">Centre’s Control Over State Legislation</h2>
<svg class="n" width="100%" viewBox="0 0 680 991" role="img"><title>Centre’s Control Over State Legislation</title><desc>Centre’s Control Over State Legislation</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="161" y="26" width="359" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Centre’s Control Over State Legislation</text>
<text class="lb" x="40" y="98">4. Centre’s Control Over State Legislation</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Centre’s control:</tspan><tspan class="k"> Besides the Parliament’s power to legislate directly on the state</tspan></text>
<text x="56" y="150"><tspan class="k">subjects under the</tspan><tspan class="b"> exceptional situations</tspan><tspan class="k">, the Constitution empowers the Centre to</tspan></text>
<text x="56" y="172"><tspan class="k">exercise</tspan><tspan class="r"> control over the state’s legislative matters</tspan><tspan class="k"> in the following ways:</tspan></text>
<text x="56" y="198" class="r" style="font-weight:700">(i)</text>
<text x="93" y="198"><tspan class="k">The</tspan><tspan class="r"> Governor</tspan><tspan class="k"> can</tspan><tspan class="r"> reserve a bill</tspan><tspan class="k"> passed by the state legislature for the</tspan></text>
<text x="93" y="220"><tspan class="k">consideration of the President. It must be noted here that the President enjoys</tspan></text>
<text x="93" y="242"><tspan class="r">absolute veto</tspan><tspan class="k"> over such a bill (</tspan><tspan class="r">Articles 200 and 201</tspan><tspan class="k">).</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="k">A state bill imposing restrictions on the</tspan><tspan class="b"> freedom of trade, commerce and</tspan></text>
<text x="93" y="290"><tspan class="b">intercourse</tspan><tspan class="k"> with that state or within that state can be introduced in the</tspan></text>
<text x="93" y="312"><tspan class="k">legislature of the state only with the</tspan><tspan class="r"> previous sanction of the President</tspan><tspan class="k"> (</tspan><tspan class="r">Article</tspan></text>
<text x="93" y="334"><tspan class="r">304</tspan><tspan class="k">).</tspan></text>
<text x="56" y="360" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="360"><tspan class="k">The Centre can direct the states to</tspan><tspan class="r"> reserve money bills and other financial bills</tspan></text>
<text x="93" y="382"><tspan class="k">passed by the state legislature for the President’s consideration during a</tspan><tspan class="r"> financial</tspan></text>
<text x="93" y="404"><tspan class="r">emergency</tspan><tspan class="k"> (</tspan><tspan class="r">Article 360</tspan><tspan class="k">).</tspan></text>
<text x="56" y="430" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="430"><tspan class="k">The Governor</tspan><tspan class="r"> cannot make an ordinance</tspan><tspan class="k"> without the</tspan><tspan class="b"> instructions from the</tspan></text>
<text x="93" y="452"><tspan class="b">President</tspan><tspan class="k"> in certain cases (</tspan><tspan class="r">Article 213</tspan><tspan class="k">).</tspan></text>
<path d="M50 178 L44 178 L44 458 L50 458" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="464" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="493" text-anchor="middle"><tspan class="r">Art. 200 &amp; 201</tspan></text>
<text class="sm" x="111" y="511" text-anchor="middle"><tspan class="k">reserved bill</tspan></text>
<text class="sm" x="111" y="529" text-anchor="middle"><tspan class="b">absolute veto</tspan></text>
<rect class="bx" x="192" y="464" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="493" text-anchor="middle"><tspan class="r">Art. 304</tspan></text>
<text class="sm" x="264" y="511" text-anchor="middle"><tspan class="k">trade restriction bill</tspan></text>
<text class="sm" x="264" y="529" text-anchor="middle"><tspan class="b">previous sanction</tspan></text>
<rect class="bx" x="345" y="464" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="493" text-anchor="middle"><tspan class="r">Art. 360</tspan></text>
<text class="sm" x="416" y="511" text-anchor="middle"><tspan class="k">money/financial bills</tspan></text>
<text class="sm" x="416" y="529" text-anchor="middle"><tspan class="b">financial emergency</tspan></text>
<rect class="bx" x="498" y="464" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="484" text-anchor="middle"><tspan class="r">Art. 213</tspan></text>
<text class="sm" x="569" y="502" text-anchor="middle"><tspan class="k">ordinance</tspan></text>
<text class="sm" x="569" y="520" text-anchor="middle"><tspan class="b">President’s</tspan></text>
<text class="sm" x="569" y="538" text-anchor="middle"><tspan class="b">instructions</tspan></text>
<text x="44" y="578"><tspan class="h" style="font-weight:700">Superiority of Centre:</tspan><tspan class="k"> From the above, it is clear that the Constitution has assigned a</tspan></text>
<text x="56" y="600"><tspan class="r">position of superiority to the Centre</tspan><tspan class="k"> in the legislative sphere. In this context, the</tspan></text>
<text x="56" y="622"><tspan class="r">Sarkaria Commission on Centre– State Relations (1983–88)</tspan><tspan class="k"> observed:</tspan></text>
<text x="56" y="650"><tspan class="h" style="font-weight:700">Federal supremacy:</tspan><tspan class="k"> “The rule of</tspan><tspan class="r"> federal supremacy</tspan><tspan class="k"> is a technique to</tspan><tspan class="b"> avoid absurdity,</tspan></text>
<text x="68" y="672"><tspan class="b">resolve conflict and ensure harmony</tspan><tspan class="k"> between the Union and state laws. If this</tspan></text>
<text x="68" y="694"><tspan class="k">principle of union supremacy is excluded, it is not difficult to imagine its</tspan><tspan class="b"> deleterious</tspan></text>
<text x="68" y="716"><tspan class="b">results</tspan><tspan class="k">. There will be every possibility of our</tspan><tspan class="b"> two-tier political system</tspan><tspan class="k"> being stultified</tspan></text>
<text x="68" y="738"><tspan class="k">by</tspan><tspan class="r"> interference, strife, legal chaos and confusion</tspan><tspan class="k"> caused by a host of conflicting</tspan></text>
<text x="68" y="760"><tspan class="k">laws, much to the bewilderment of the common citizen. Integrated legislative policy</tspan></text>
<text x="68" y="782"><tspan class="k">and uniformity on basic issues of common Union–state concern will be stymied. The</tspan></text>
<text x="68" y="804"><tspan class="k">federal principle of</tspan><tspan class="r"> unity in diversity</tspan><tspan class="k"> will be very much a casualty. This rule of</tspan></text>
<text x="68" y="826"><tspan class="k">federal supremacy, therefore, is</tspan><tspan class="r"> indispensable</tspan><tspan class="k"> for the successful functioning of the</tspan></text>
<text x="68" y="848"><tspan class="k">federal system”.⁴</tspan></text>
<line x1="44" y1="630" x2="44" y2="856" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round"/>
<rect class="bx" x="40" y="868" width="134" height="30" rx="3"/>
<text class="sm" x="107" y="887" text-anchor="middle"><tspan class="k">federal supremacy</tspan></text>
<line class="ln" x1="177" y1="883" x2="197" y2="883" marker-end="url(#ah)"/>
<rect class="bx" x="200" y="868" width="181" height="30" rx="3"/>
<text class="sm" x="291" y="887" text-anchor="middle"><tspan class="k">avoids absurdity / conflict</tspan></text>
<line class="ln" x1="384" y1="883" x2="404" y2="883" marker-end="url(#ah)"/>
<rect class="bx" x="407" y="868" width="78" height="30" rx="3"/>
<text class="sm" x="447" y="887" text-anchor="middle"><tspan class="r">harmony</tspan></text>
<line class="ln" x1="489" y1="883" x2="509" y2="883" marker-end="url(#ah)"/>
<rect class="bx" x="512" y="868" width="128" height="30" rx="3"/>
<text class="sm" x="576" y="887" text-anchor="middle"><tspan class="b">unity in diversity</tspan></text>
<text class="xs" x="50" y="934"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> Report of the Commission on centre-state Relations, Part I (Government of India, 1988) pp.</tspan></text>
<text class="xs" x="50" y="952"><tspan class="k">28–29.</tspan></text>
