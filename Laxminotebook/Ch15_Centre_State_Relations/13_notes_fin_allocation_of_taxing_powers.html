<div id="vis-container"><h2 class="sr-only">Financial Relations – Allocation of Taxing Powers</h2>
<svg class="n" width="100%" viewBox="0 0 680 1765" role="img"><title>Financial Relations – Allocation of Taxing Powers</title><desc>Financial Relations – Allocation of Taxing Powers</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="123" y="26" width="434" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Financial Relations – Allocation of Taxing Powers</text>
<text class="r hd" x="40" y="100">FINANCIAL RELATIONS</text>
<line x1="40" y1="106" x2="214" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="132" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="132"><tspan class="r">Articles 268 to 293</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XII</tspan><tspan class="k"> of the Constitution deal with</tspan><tspan class="b"> Centre–state financial</tspan></text>
<text x="58" y="154"><tspan class="b">relations</tspan><tspan class="k">.</tspan></text>
<text x="44" y="180" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="180"><tspan class="k">Besides these, there are other provisions dealing with the same subject.</tspan></text>
<text x="44" y="206" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="206"><tspan class="k">These together can be studied under the following heads:</tspan></text>
<text class="lb" x="40" y="238">1. Allocation of Taxing Powers</text>
<text x="44" y="266" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="266"><tspan class="k">The Constitution divides the taxing powers between the Centre and the states in the</tspan></text>
<text x="58" y="288"><tspan class="k">following way:</tspan></text>
<text x="44" y="314" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="314"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan><tspan class="r"> Union</tspan></text>
<text x="58" y="336"><tspan class="r">List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 13 in number⁸</tspan><tspan class="k">).</tspan></text>
<text x="44" y="362" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="362"><tspan class="k">The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan></text>
<text x="58" y="384"><tspan class="r">State List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 18 in number⁹</tspan><tspan class="k">).</tspan></text>
<text x="44" y="410" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="410"><tspan class="k">There are</tspan><tspan class="r"> no tax entries in the Concurrent List</tspan><tspan class="k">. In other words, the concurrent</tspan></text>
<text x="58" y="432"><tspan class="k">jurisdiction is</tspan><tspan class="b"> not available with respect to tax legislation</tspan><tspan class="k">. But, the</tspan><tspan class="r"> 101st Amendment</tspan></text>
<text x="58" y="454"><tspan class="r">Act of 2016</tspan><tspan class="k"> has made an</tspan><tspan class="r"> exception</tspan><tspan class="k"> by making a special provision with respect to</tspan></text>
<text x="58" y="476"><tspan class="r">goods and services tax</tspan><tspan class="k">. This Amendment has conferred</tspan><tspan class="b"> concurrent power upon the</tspan></text>
<text x="58" y="498"><tspan class="b">Parliament and State Legislatures</tspan><tspan class="k"> to make laws governing goods and services tax¹⁰.</tspan></text>
<text x="44" y="524" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="524"><tspan class="k">The</tspan><tspan class="r"> residuary power of taxation</tspan><tspan class="k"> (that is, the power to impose taxes not enumerated in</tspan></text>
<text x="58" y="546"><tspan class="k">any of the three lists) is vested in the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">. Under this provision, the</tspan></text>
<text x="58" y="568"><tspan class="k">Parliament has imposed</tspan><tspan class="b"> gift tax, wealth tax and expenditure tax</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="580" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="609" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="sm" x="111" y="627" text-anchor="middle"><tspan class="r">13</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="111" y="645" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<rect class="bx" x="192" y="580" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="609" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text class="sm" x="264" y="627" text-anchor="middle"><tspan class="r">18</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="264" y="645" text-anchor="middle"><tspan class="k">State legislature</tspan></text>
<rect class="bx" x="345" y="580" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="600" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="sm" x="416" y="618" text-anchor="middle"><tspan class="r">no</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="416" y="636" text-anchor="middle"><tspan class="b">except GST (101st</tspan></text>
<text class="sm" x="416" y="654" text-anchor="middle"><tspan class="b">Amdt)</tspan></text>
<rect class="bx" x="498" y="580" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="600" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary</tspan></text>
<text class="sm" x="569" y="618" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<text class="sm" x="569" y="636" text-anchor="middle"><tspan class="b">gift, wealth,</tspan></text>
<text class="sm" x="569" y="654" text-anchor="middle"><tspan class="b">expenditure tax</tspan></text>
<text x="44" y="692" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="692"><tspan class="k">The Constitution also draws a distinction between the</tspan><tspan class="r"> power to levy and collect a tax</tspan></text>
<text x="58" y="714"><tspan class="k">and the</tspan><tspan class="r"> power to appropriate the proceeds</tspan><tspan class="k"> of the tax so levied and collected.</tspan></text>
<text x="44" y="740" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="740"><tspan class="k">For example, the</tspan><tspan class="b"> income-tax is levied and collected by the Centre</tspan><tspan class="k"> but its proceeds are</tspan></text>
<text x="58" y="762"><tspan class="b">distributed between the Centre and the states</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="87" y="774" width="260" height="48" rx="3"/>
<text class="sm" x="217" y="793" text-anchor="middle"><tspan class="r">Income tax</tspan><tspan class="k">: levied &amp; collected by</tspan></text>
<text class="sm" x="217" y="811" text-anchor="middle"><tspan class="k">Centre</tspan></text>
<line class="ln" x1="350" y1="798" x2="370" y2="798" marker-end="url(#ah)"/>
<rect class="bx" x="373" y="774" width="220" height="48" rx="3"/>
<text class="sm" x="483" y="802" text-anchor="middle"><tspan class="k">proceeds shared</tspan><tspan class="b"> Centre + states</tspan></text>
<text class="lb" x="40" y="854">2. Restrictions on states’ taxing powers</text>
<text x="44" y="882" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="882"><tspan class="k">Further, the Constitution has placed the following</tspan><tspan class="r"> restrictions on the taxing powers of</tspan></text>
<text x="58" y="904"><tspan class="r">the states</tspan><tspan class="k">:</tspan></text>
<text x="56" y="930" class="r" style="font-weight:700">(i)</text>
<text x="93" y="930"><tspan class="k">A state legislature can impose</tspan><tspan class="r"> taxes on professions, trades, callings and</tspan></text>
<text x="93" y="952"><tspan class="r">employments</tspan><tspan class="k">.</tspan></text>
<text x="93" y="976" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="976"><tspan class="k">But, the total amount of such taxes payable by any person should</tspan><tspan class="r"> not exceed</tspan></text>
<text x="107" y="998"><tspan class="r">₹2,500 per annum</tspan><tspan class="k">.¹¹</tspan></text>
<text x="56" y="1024" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1024"><tspan class="k">A state legislature is</tspan><tspan class="r"> prohibited</tspan><tspan class="k"> from imposing a tax on the</tspan><tspan class="r"> supply of goods or</tspan></text>
<text x="93" y="1046"><tspan class="r">services or both</tspan><tspan class="k"> in the following two cases: (a) where such supply takes place</tspan></text>
<text x="93" y="1068"><tspan class="b">outside the state</tspan><tspan class="k">; and (b) where such supply takes place in the course of</tspan><tspan class="b"> import</tspan></text>
<text x="93" y="1090"><tspan class="b">or export</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1114" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="1114"><tspan class="k">Further, the Parliament is empowered to formulate the principles for</tspan></text>
<text x="107" y="1136"><tspan class="k">determining when a supply of goods or services or both takes place outside the</tspan></text>
<text x="107" y="1158"><tspan class="k">state, or in the course of import or export¹².</tspan></text>
<text x="56" y="1184" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1184"><tspan class="k">A state legislature can impose tax on the</tspan><tspan class="r"> consumption or sale of electricity</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1208" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="1208"><tspan class="k">But, no tax can be imposed on the consumption or sale of electricity which is</tspan></text>
<text x="107" y="1230"><tspan class="k">(a)</tspan><tspan class="b"> consumed by the Centre or sold to the Centre</tspan><tspan class="k">; or (b)</tspan><tspan class="b"> consumed in the</tspan></text>
<text x="107" y="1252"><tspan class="b">construction, maintenance or operation of any railway</tspan><tspan class="k"> by the Centre or by the</tspan></text>
<text x="107" y="1274"><tspan class="k">concerned railway company or sold to the Centre or the railway company for</tspan></text>
<text x="107" y="1296"><tspan class="k">the same purpose.</tspan></text>
<text x="56" y="1322" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1322"><tspan class="k">A state legislature can impose a tax in respect of any</tspan><tspan class="r"> water or electricity</tspan><tspan class="k"> stored,</tspan></text>
<text x="93" y="1344"><tspan class="k">generated, consumed, distributed or sold by any</tspan><tspan class="b"> authority established by</tspan></text>
<text x="93" y="1366"><tspan class="b">Parliament</tspan><tspan class="k"> for regulating or developing any</tspan><tspan class="b"> inter-state river or river valley</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1390" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="1390"><tspan class="k">But, such a law, to be effective, should be</tspan><tspan class="r"> reserved for the president’s</tspan></text>
<text x="107" y="1412"><tspan class="r">consideration</tspan><tspan class="k"> and receive his/her assent.</tspan></text>
<path d="M50 910 L44 910 L44 1418 L50 1418" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1424" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1453" text-anchor="middle"><tspan class="r" style="font-weight:700">Profession tax</tspan></text>
<text class="sm" x="111" y="1471" text-anchor="middle"><tspan class="k">max</tspan><tspan class="r"> ₹2,500</tspan><tspan class="k">/year</tspan></text>
<rect class="bx" x="192" y="1424" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1444" text-anchor="middle"><tspan class="r" style="font-weight:700">Supply tax</tspan></text>
<text class="sm" x="264" y="1462" text-anchor="middle"><tspan class="k">✘ outside state</tspan></text>
<text class="sm" x="264" y="1480" text-anchor="middle"><tspan class="k">✘ import/export</tspan></text>
<rect class="bx" x="345" y="1424" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1453" text-anchor="middle"><tspan class="r" style="font-weight:700">Electricity</tspan></text>
<text class="sm" x="416" y="1471" text-anchor="middle"><tspan class="k">✘ Centre / railways</tspan></text>
<rect class="bx" x="498" y="1424" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1444" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-state river</tspan></text>
<text class="sm" x="569" y="1462" text-anchor="middle"><tspan class="b">reserve for</tspan></text>
<text class="sm" x="569" y="1480" text-anchor="middle"><tspan class="b">President</tspan></text>
<text class="xs" x="50" y="1528"><tspan class="r" style="font-weight:700">8</tspan><tspan class="k"> Entries—82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92A, 92B and 96.</tspan></text>
<rect x="40" y="1506" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1573"><tspan class="r" style="font-weight:700">9</tspan><tspan class="k"> Entries—45, 46, 47, 48, 49, 50, 51, 53, 54, 56, 57, 58, 59, 60, 61, 62, 63 and 66.</tspan></text>
<rect x="40" y="1551" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1618"><tspan class="r" style="font-weight:700">10</tspan><tspan class="k"> In this regard, the 101st Amendment Act of 2016 inserted Article 246-A in the Constitution.</tspan></text>
<rect x="40" y="1596" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1663"><tspan class="r" style="font-weight:700">11</tspan><tspan class="k"> Originally, this limit was only ₹250 per annum. The 60th Amendment Act of 1988 raised it to</tspan></text>
<text class="xs" x="50" y="1681"><tspan class="k">₹2,500 per annum.</tspan></text>
<rect x="40" y="1641" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1726"><tspan class="r" style="font-weight:700">12</tspan><tspan class="k"> These provisions are contained in Article 286, as amended by the 101st Amendment Act of 2016.</tspan></text>
<rect x="40" y="1704" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
