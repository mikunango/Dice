<div id="vis-container"><h2 class="sr-only">Financial Relations – Allocation of Taxing Powers</h2>
<svg class="n" width="100%" viewBox="0 0 680 1683" role="img"><title>Financial Relations – Allocation of Taxing Powers</title><desc>Financial Relations – Allocation of Taxing Powers</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="123" y="26" width="434" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Financial Relations – Allocation of Taxing Powers</text>
<text class="r hd" x="40" y="100">FINANCIAL RELATIONS</text>
<line x1="40" y1="106" x2="214" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Constitutional basis (Arts. 268–293):</tspan><tspan class="r"> Articles 268 to 293</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XII</tspan><tspan class="k"> of the</tspan></text>
<text x="56" y="156"><tspan class="k">Constitution deal with</tspan><tspan class="b"> Centre–state financial relations</tspan><tspan class="k">. Besides these, there are other</tspan></text>
<text x="56" y="178"><tspan class="k">provisions dealing with the same subject. These together can be studied under the</tspan></text>
<text x="56" y="200"><tspan class="k">following heads:</tspan></text>
<text class="lb" x="40" y="232">1. Allocation of Taxing Powers</text>
<text x="44" y="262"><tspan class="h" style="font-weight:700">Separation of taxing powers:</tspan><tspan class="k"> The Constitution divides the taxing powers between the</tspan></text>
<text x="56" y="284"><tspan class="k">Centre and the states in the following way:</tspan></text>
<text x="44" y="312" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="312"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan><tspan class="r"> Union</tspan></text>
<text x="58" y="334"><tspan class="r">List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 13 in number⁸</tspan><tspan class="k">).</tspan></text>
<text x="44" y="362" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="362"><tspan class="k">The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan></text>
<text x="58" y="384"><tspan class="r">State List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 18 in number⁹</tspan><tspan class="k">).</tspan></text>
<text x="44" y="412" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="412"><tspan class="k">There are</tspan><tspan class="r"> no tax entries in the Concurrent List</tspan><tspan class="k">. In other words, the concurrent</tspan></text>
<text x="58" y="434"><tspan class="k">jurisdiction is</tspan><tspan class="b"> not available with respect to tax legislation</tspan><tspan class="k">. But, the</tspan><tspan class="r"> 101st Amendment</tspan></text>
<text x="58" y="456"><tspan class="r">Act of 2016</tspan><tspan class="k"> has made an</tspan><tspan class="r"> exception</tspan><tspan class="k"> by making a special provision with respect to</tspan></text>
<text x="58" y="478"><tspan class="r">goods and services tax</tspan><tspan class="k">. This Amendment has conferred</tspan><tspan class="b"> concurrent power upon the</tspan></text>
<text x="58" y="500"><tspan class="b">Parliament and State Legislatures</tspan><tspan class="k"> to make laws governing goods and services tax¹⁰.</tspan></text>
<text x="44" y="528" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="528"><tspan class="k">The</tspan><tspan class="r"> residuary power of taxation</tspan><tspan class="k"> (that is, the power to impose taxes not enumerated in</tspan></text>
<text x="58" y="550"><tspan class="k">any of the three lists) is vested in the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">. Under this provision, the</tspan></text>
<text x="58" y="572"><tspan class="k">Parliament has imposed</tspan><tspan class="b"> gift tax, wealth tax and expenditure tax</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="584" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="613" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="sm" x="111" y="631" text-anchor="middle"><tspan class="r">13</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="111" y="649" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<rect class="bx" x="192" y="584" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="613" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text class="sm" x="264" y="631" text-anchor="middle"><tspan class="r">18</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="264" y="649" text-anchor="middle"><tspan class="k">State legislature</tspan></text>
<rect class="bx" x="345" y="584" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="604" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="sm" x="416" y="622" text-anchor="middle"><tspan class="r">no</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="416" y="640" text-anchor="middle"><tspan class="b">except GST (101st</tspan></text>
<text class="sm" x="416" y="658" text-anchor="middle"><tspan class="b">Amdt)</tspan></text>
<rect class="bx" x="498" y="584" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="604" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary</tspan></text>
<text class="sm" x="569" y="622" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<text class="sm" x="569" y="640" text-anchor="middle"><tspan class="b">gift, wealth,</tspan></text>
<text class="sm" x="569" y="658" text-anchor="middle"><tspan class="b">expenditure tax</tspan></text>
<text x="44" y="698"><tspan class="h" style="font-weight:700">Levy vs appropriation:</tspan><tspan class="k"> The Constitution also draws a distinction between the</tspan><tspan class="r"> power to</tspan></text>
<text x="56" y="720"><tspan class="r">levy and collect a tax</tspan><tspan class="k"> and the</tspan><tspan class="r"> power to appropriate the proceeds</tspan><tspan class="k"> of the tax so levied and</tspan></text>
<text x="56" y="742"><tspan class="k">collected. For example, the</tspan><tspan class="b"> income-tax is levied and collected by the Centre</tspan><tspan class="k"> but its</tspan></text>
<text x="56" y="764"><tspan class="k">proceeds are</tspan><tspan class="b"> distributed between the Centre and the states</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="87" y="776" width="260" height="48" rx="3"/>
<text class="sm" x="217" y="795" text-anchor="middle"><tspan class="r">Income tax</tspan><tspan class="k">: levied &amp; collected by</tspan></text>
<text class="sm" x="217" y="813" text-anchor="middle"><tspan class="k">Centre</tspan></text>
<line class="ln" x1="350" y1="800" x2="370" y2="800" marker-end="url(#ah)"/>
<rect class="bx" x="373" y="776" width="220" height="48" rx="3"/>
<text class="sm" x="483" y="804" text-anchor="middle"><tspan class="k">proceeds shared</tspan><tspan class="b"> Centre + states</tspan></text>
<text x="44" y="852"><tspan class="h" style="font-weight:700">Restrictions on state taxation:</tspan><tspan class="k"> Further, the Constitution has placed the following</tspan></text>
<text x="56" y="874"><tspan class="r">restrictions on the taxing powers of the states</tspan><tspan class="k">:</tspan></text>
<text x="56" y="900" class="r" style="font-weight:700">(i)</text>
<text x="93" y="900"><tspan class="h" style="font-weight:700">Profession tax ceiling (Art. 276):</tspan><tspan class="k"> A state legislature can impose</tspan><tspan class="r"> taxes on</tspan></text>
<text x="93" y="922"><tspan class="r">professions, trades, callings and employments</tspan><tspan class="k">. But, the total amount of such</tspan></text>
<text x="93" y="944"><tspan class="k">taxes payable by any person should</tspan><tspan class="r"> not exceed ₹2,500 per annum</tspan><tspan class="k">.¹¹</tspan></text>
<text x="56" y="970" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="970"><tspan class="h" style="font-weight:700">Place of supply (Art. 286):</tspan><tspan class="k"> A state legislature is</tspan><tspan class="r"> prohibited</tspan><tspan class="k"> from imposing a tax</tspan></text>
<text x="93" y="992"><tspan class="k">on the</tspan><tspan class="r"> supply of goods or services or both</tspan><tspan class="k"> in the following two cases: (a) where</tspan></text>
<text x="93" y="1014"><tspan class="k">such supply takes place</tspan><tspan class="b"> outside the state</tspan><tspan class="k">; and (b) where such supply takes place</tspan></text>
<text x="93" y="1036"><tspan class="k">in the course of</tspan><tspan class="b"> import or export</tspan><tspan class="k">. Further, the Parliament is empowered to</tspan></text>
<text x="93" y="1058"><tspan class="k">formulate the principles for determining when a supply of goods or services or</tspan></text>
<text x="93" y="1080"><tspan class="k">both takes place outside the state, or in the course of import or export¹².</tspan></text>
<text x="56" y="1106" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1106"><tspan class="h" style="font-weight:700">Electricity tax exemption (Art. 287):</tspan><tspan class="k"> A state legislature can impose tax on the</tspan></text>
<text x="93" y="1128"><tspan class="r">consumption or sale of electricity</tspan><tspan class="k">. But, no tax can be imposed on the</tspan></text>
<text x="93" y="1150"><tspan class="k">consumption or sale of electricity which is (a)</tspan><tspan class="b"> consumed by the Centre or sold to</tspan></text>
<text x="93" y="1172"><tspan class="b">the Centre</tspan><tspan class="k">; or (b)</tspan><tspan class="b"> consumed in the construction, maintenance or operation of</tspan></text>
<text x="93" y="1194"><tspan class="b">any railway</tspan><tspan class="k"> by the Centre or by the concerned railway company or sold to the</tspan></text>
<text x="93" y="1216"><tspan class="k">Centre or the railway company for the same purpose.</tspan></text>
<text x="56" y="1242" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1242"><tspan class="h" style="font-weight:700">Inter-state river authority (Art. 288):</tspan><tspan class="k"> A state legislature can impose a tax in</tspan></text>
<text x="93" y="1264"><tspan class="k">respect of any</tspan><tspan class="r"> water or electricity</tspan><tspan class="k"> stored, generated, consumed, distributed or sold</tspan></text>
<text x="93" y="1286"><tspan class="k">by any</tspan><tspan class="b"> authority established by Parliament</tspan><tspan class="k"> for regulating or developing any</tspan></text>
<text x="93" y="1308"><tspan class="b">inter-state river or river valley</tspan><tspan class="k">. But, such a law, to be effective, should be</tspan></text>
<text x="93" y="1330"><tspan class="r">reserved for the president’s consideration</tspan><tspan class="k"> and receive his/her assent.</tspan></text>
<path d="M50 880 L44 880 L44 1336 L50 1336" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1342" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1371" text-anchor="middle"><tspan class="r" style="font-weight:700">Profession tax</tspan></text>
<text class="sm" x="111" y="1389" text-anchor="middle"><tspan class="k">max</tspan><tspan class="r"> ₹2,500</tspan><tspan class="k">/year</tspan></text>
<rect class="bx" x="192" y="1342" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1362" text-anchor="middle"><tspan class="r" style="font-weight:700">Supply tax</tspan></text>
<text class="sm" x="264" y="1380" text-anchor="middle"><tspan class="k">✘ outside state</tspan></text>
<text class="sm" x="264" y="1398" text-anchor="middle"><tspan class="k">✘ import/export</tspan></text>
<rect class="bx" x="345" y="1342" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1371" text-anchor="middle"><tspan class="r" style="font-weight:700">Electricity</tspan></text>
<text class="sm" x="416" y="1389" text-anchor="middle"><tspan class="k">✘ Centre / railways</tspan></text>
<rect class="bx" x="498" y="1342" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1362" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-state river</tspan></text>
<text class="sm" x="569" y="1380" text-anchor="middle"><tspan class="b">reserve for</tspan></text>
<text class="sm" x="569" y="1398" text-anchor="middle"><tspan class="b">President</tspan></text>
<text class="xs" x="50" y="1446"><tspan class="r" style="font-weight:700">8</tspan><tspan class="k"> Entries—82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92A, 92B and 96.</tspan></text>
<rect x="40" y="1424" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1491"><tspan class="r" style="font-weight:700">9</tspan><tspan class="k"> Entries—45, 46, 47, 48, 49, 50, 51, 53, 54, 56, 57, 58, 59, 60, 61, 62, 63 and 66.</tspan></text>
<rect x="40" y="1469" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1536"><tspan class="r" style="font-weight:700">10</tspan><tspan class="k"> In this regard, the 101st Amendment Act of 2016 inserted Article 246-A in the Constitution.</tspan></text>
<rect x="40" y="1514" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1581"><tspan class="r" style="font-weight:700">11</tspan><tspan class="k"> Originally, this limit was only ₹250 per annum. The 60th Amendment Act of 1988 raised it to</tspan></text>
<text class="xs" x="50" y="1599"><tspan class="k">₹2,500 per annum.</tspan></text>
<rect x="40" y="1559" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1644"><tspan class="r" style="font-weight:700">12</tspan><tspan class="k"> These provisions are contained in Article 286, as amended by the 101st Amendment Act of 2016.</tspan></text>
<rect x="40" y="1622" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
