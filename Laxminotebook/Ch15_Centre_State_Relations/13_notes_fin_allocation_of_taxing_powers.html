<div id="vis-container"><h2 class="sr-only">Financial Relations – Allocation of Taxing Powers</h2>
<svg class="n" width="100%" viewBox="0 0 680 1835" role="img"><title>Financial Relations – Allocation of Taxing Powers</title><desc>Financial Relations – Allocation of Taxing Powers</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="123" y="26" width="434" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Financial Relations – Allocation of Taxing Powers</text>
<text class="r hd" x="40" y="100">FINANCIAL RELATIONS</text>
<line x1="40" y1="106" x2="214" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Arts. 268–293, Part XII:</tspan><tspan class="r"> Articles 268 to 293</tspan><tspan class="k"> in</tspan><tspan class="r"> Part XII</tspan><tspan class="k"> of the Constitution deal with</tspan></text>
<text x="56" y="156"><tspan class="b">Centre–state financial relations</tspan><tspan class="k">.</tspan></text>
<text x="44" y="184"><tspan class="h" style="font-weight:700">Other provisions:</tspan><tspan class="k"> Besides these, there are other provisions dealing with the same</tspan></text>
<text x="56" y="206"><tspan class="k">subject.</tspan></text>
<text x="44" y="234"><tspan class="h" style="font-weight:700">Heads:</tspan><tspan class="k"> These together can be studied under the following heads:</tspan></text>
<text class="lb" x="40" y="266">1. Allocation of Taxing Powers</text>
<text x="44" y="296"><tspan class="h" style="font-weight:700">Taxing powers divided:</tspan><tspan class="k"> The Constitution divides the taxing powers between the Centre</tspan></text>
<text x="56" y="318"><tspan class="k">and the states in the following way:</tspan></text>
<text x="44" y="346" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="346"><tspan class="k">The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan><tspan class="r"> Union</tspan></text>
<text x="58" y="368"><tspan class="r">List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 13 in number⁸</tspan><tspan class="k">).</tspan></text>
<text x="44" y="396" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="396"><tspan class="k">The</tspan><tspan class="r"> state legislature</tspan><tspan class="k"> has</tspan><tspan class="r"> exclusive power</tspan><tspan class="k"> to levy taxes on subjects enumerated in the</tspan></text>
<text x="58" y="418"><tspan class="r">State List</tspan><tspan class="k"> (</tspan><tspan class="b">which are 18 in number⁹</tspan><tspan class="k">).</tspan></text>
<text x="44" y="446" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="446"><tspan class="k">There are</tspan><tspan class="r"> no tax entries in the Concurrent List</tspan><tspan class="k">. In other words, the concurrent</tspan></text>
<text x="58" y="468"><tspan class="k">jurisdiction is</tspan><tspan class="b"> not available with respect to tax legislation</tspan><tspan class="k">. But, the</tspan><tspan class="r"> 101st Amendment</tspan></text>
<text x="58" y="490"><tspan class="r">Act of 2016</tspan><tspan class="k"> has made an</tspan><tspan class="r"> exception</tspan><tspan class="k"> by making a special provision with respect to</tspan></text>
<text x="58" y="512"><tspan class="r">goods and services tax</tspan><tspan class="k">. This Amendment has conferred</tspan><tspan class="b"> concurrent power upon the</tspan></text>
<text x="58" y="534"><tspan class="b">Parliament and State Legislatures</tspan><tspan class="k"> to make laws governing goods and services tax¹⁰.</tspan></text>
<text x="44" y="562" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="562"><tspan class="k">The</tspan><tspan class="r"> residuary power of taxation</tspan><tspan class="k"> (that is, the power to impose taxes not enumerated in</tspan></text>
<text x="58" y="584"><tspan class="k">any of the three lists) is vested in the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">. Under this provision, the</tspan></text>
<text x="58" y="606"><tspan class="k">Parliament has imposed</tspan><tspan class="b"> gift tax, wealth tax and expenditure tax</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="40" y="618" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="647" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="sm" x="111" y="665" text-anchor="middle"><tspan class="r">13</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="111" y="683" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<rect class="bx" x="192" y="618" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="647" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text class="sm" x="264" y="665" text-anchor="middle"><tspan class="r">18</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="264" y="683" text-anchor="middle"><tspan class="k">State legislature</tspan></text>
<rect class="bx" x="345" y="618" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="638" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="sm" x="416" y="656" text-anchor="middle"><tspan class="r">no</tspan><tspan class="k"> tax entries</tspan></text>
<text class="sm" x="416" y="674" text-anchor="middle"><tspan class="b">except GST (101st</tspan></text>
<text class="sm" x="416" y="692" text-anchor="middle"><tspan class="b">Amdt)</tspan></text>
<rect class="bx" x="498" y="618" width="142" height="86" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="638" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary</tspan></text>
<text class="sm" x="569" y="656" text-anchor="middle"><tspan class="k">Parliament</tspan></text>
<text class="sm" x="569" y="674" text-anchor="middle"><tspan class="b">gift, wealth,</tspan></text>
<text class="sm" x="569" y="692" text-anchor="middle"><tspan class="b">expenditure tax</tspan></text>
<text x="44" y="732"><tspan class="h" style="font-weight:700">Levy vs appropriate:</tspan><tspan class="k"> The Constitution also draws a distinction between the</tspan><tspan class="r"> power to</tspan></text>
<text x="56" y="754"><tspan class="r">levy and collect a tax</tspan><tspan class="k"> and the</tspan><tspan class="r"> power to appropriate the proceeds</tspan><tspan class="k"> of the tax so levied and</tspan></text>
<text x="56" y="776"><tspan class="k">collected.</tspan></text>
<text x="44" y="804"><tspan class="h" style="font-weight:700">Income tax example:</tspan><tspan class="k"> For example, the</tspan><tspan class="b"> income-tax is levied and collected by the Centre</tspan></text>
<text x="56" y="826"><tspan class="k">but its proceeds are</tspan><tspan class="b"> distributed between the Centre and the states</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="87" y="838" width="260" height="48" rx="3"/>
<text class="sm" x="217" y="857" text-anchor="middle"><tspan class="r">Income tax</tspan><tspan class="k">: levied &amp; collected by</tspan></text>
<text class="sm" x="217" y="875" text-anchor="middle"><tspan class="k">Centre</tspan></text>
<line class="ln" x1="350" y1="862" x2="370" y2="862" marker-end="url(#ah)"/>
<rect class="bx" x="373" y="838" width="220" height="48" rx="3"/>
<text class="sm" x="483" y="866" text-anchor="middle"><tspan class="k">proceeds shared</tspan><tspan class="b"> Centre + states</tspan></text>
<text class="lb" x="40" y="918">2. Restrictions on states’ taxing powers</text>
<text x="44" y="948"><tspan class="h" style="font-weight:700">Restrictions on states:</tspan><tspan class="k"> Further, the Constitution has placed the following</tspan><tspan class="r"> restrictions on</tspan></text>
<text x="56" y="970"><tspan class="r">the taxing powers of the states</tspan><tspan class="k">:</tspan></text>
<text x="56" y="996" class="r" style="font-weight:700">(i)</text>
<text x="93" y="996"><tspan class="k">A state legislature can impose</tspan><tspan class="r"> taxes on professions, trades, callings and</tspan></text>
<text x="93" y="1018"><tspan class="r">employments</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1043"><tspan class="h" style="font-weight:700">₹2,500 cap:</tspan><tspan class="k"> But, the total amount of such taxes payable by any person should</tspan></text>
<text x="105" y="1065"><tspan class="r">not exceed ₹2,500 per annum</tspan><tspan class="k">.¹¹</tspan></text>
<text x="56" y="1091" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1091"><tspan class="k">A state legislature is</tspan><tspan class="r"> prohibited</tspan><tspan class="k"> from imposing a tax on the</tspan><tspan class="r"> supply of goods or</tspan></text>
<text x="93" y="1113"><tspan class="r">services or both</tspan><tspan class="k"> in the following two cases: (a) where such supply takes place</tspan></text>
<text x="93" y="1135"><tspan class="b">outside the state</tspan><tspan class="k">; and (b) where such supply takes place in the course of</tspan><tspan class="b"> import</tspan></text>
<text x="93" y="1157"><tspan class="b">or export</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1182"><tspan class="h" style="font-weight:700">Parliament fixes principles:</tspan><tspan class="k"> Further, the Parliament is empowered to formulate</tspan></text>
<text x="105" y="1204"><tspan class="k">the principles for determining when a supply of goods or services or both takes</tspan></text>
<text x="105" y="1226"><tspan class="k">place outside the state, or in the course of import or export¹².</tspan></text>
<text x="56" y="1252" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1252"><tspan class="k">A state legislature can impose tax on the</tspan><tspan class="r"> consumption or sale of electricity</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1277"><tspan class="h" style="font-weight:700">Electricity exemption:</tspan><tspan class="k"> But, no tax can be imposed on the consumption or sale</tspan></text>
<text x="105" y="1299"><tspan class="k">of electricity which is (a)</tspan><tspan class="b"> consumed by the Centre or sold to the Centre</tspan><tspan class="k">; or</tspan></text>
<text x="105" y="1321"><tspan class="k">(b)</tspan><tspan class="b"> consumed in the construction, maintenance or operation of any railway</tspan><tspan class="k"> by</tspan></text>
<text x="105" y="1343"><tspan class="k">the Centre or by the concerned railway company or sold to the Centre or the</tspan></text>
<text x="105" y="1365"><tspan class="k">railway company for the same purpose.</tspan></text>
<text x="56" y="1391" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1391"><tspan class="k">A state legislature can impose a tax in respect of any</tspan><tspan class="r"> water or electricity</tspan><tspan class="k"> stored,</tspan></text>
<text x="93" y="1413"><tspan class="k">generated, consumed, distributed or sold by any</tspan><tspan class="b"> authority established by</tspan></text>
<text x="93" y="1435"><tspan class="b">Parliament</tspan><tspan class="k"> for regulating or developing any</tspan><tspan class="b"> inter-state river or river valley</tspan><tspan class="k">.</tspan></text>
<text x="93" y="1460"><tspan class="h" style="font-weight:700">President’s assent:</tspan><tspan class="k"> But, such a law, to be effective, should be</tspan><tspan class="r"> reserved for the</tspan></text>
<text x="105" y="1482"><tspan class="r">president’s consideration</tspan><tspan class="k"> and receive his/her assent.</tspan></text>
<path d="M50 976 L44 976 L44 1488 L50 1488" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1494" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="1523" text-anchor="middle"><tspan class="r" style="font-weight:700">Profession tax</tspan></text>
<text class="sm" x="111" y="1541" text-anchor="middle"><tspan class="k">max</tspan><tspan class="r"> ₹2,500</tspan><tspan class="k">/year</tspan></text>
<rect class="bx" x="192" y="1494" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="1514" text-anchor="middle"><tspan class="r" style="font-weight:700">Supply tax</tspan></text>
<text class="sm" x="264" y="1532" text-anchor="middle"><tspan class="k">✘ outside state</tspan></text>
<text class="sm" x="264" y="1550" text-anchor="middle"><tspan class="k">✘ import/export</tspan></text>
<rect class="bx" x="345" y="1494" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="1523" text-anchor="middle"><tspan class="r" style="font-weight:700">Electricity</tspan></text>
<text class="sm" x="416" y="1541" text-anchor="middle"><tspan class="k">✘ Centre / railways</tspan></text>
<rect class="bx" x="498" y="1494" width="142" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="1514" text-anchor="middle"><tspan class="r" style="font-weight:700">Inter-state river</tspan></text>
<text class="sm" x="569" y="1532" text-anchor="middle"><tspan class="b">reserve for</tspan></text>
<text class="sm" x="569" y="1550" text-anchor="middle"><tspan class="b">President</tspan></text>
<text class="xs" x="50" y="1598"><tspan class="r" style="font-weight:700">8</tspan><tspan class="k"> Entries—82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92A, 92B and 96.</tspan></text>
<rect x="40" y="1576" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1643"><tspan class="r" style="font-weight:700">9</tspan><tspan class="k"> Entries—45, 46, 47, 48, 49, 50, 51, 53, 54, 56, 57, 58, 59, 60, 61, 62, 63 and 66.</tspan></text>
<rect x="40" y="1621" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1688"><tspan class="r" style="font-weight:700">10</tspan><tspan class="k"> In this regard, the 101st Amendment Act of 2016 inserted Article 246-A in the Constitution.</tspan></text>
<rect x="40" y="1666" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1733"><tspan class="r" style="font-weight:700">11</tspan><tspan class="k"> Originally, this limit was only ₹250 per annum. The 60th Amendment Act of 1988 raised it to</tspan></text>
<text class="xs" x="50" y="1751"><tspan class="k">₹2,500 per annum.</tspan></text>
<rect x="40" y="1711" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1796"><tspan class="r" style="font-weight:700">12</tspan><tspan class="k"> These provisions are contained in Article 286, as amended by the 101st Amendment Act of 2016.</tspan></text>
<rect x="40" y="1774" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
