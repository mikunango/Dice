<text class="r hd" x="340" y="53" text-anchor="middle">Anandpur Sahib Resolution and West Bengal Memorandum</text>
<text class="lb" x="40" y="98">Anandpur Sahib Resolution</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Akali Dal 1973:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1973</tspan><tspan class="k">, the</tspan><tspan class="r"> Akali Dal</tspan><tspan class="k"> adopted a resolution containing both</tspan><tspan class="b"> political and</tspan></text>
<text x="56" y="150"><tspan class="b">religious demands</tspan><tspan class="k"> in a meeting held at</tspan><tspan class="r"> Anandpur Sahib in Punjab</tspan><tspan class="k">.</tspan></text>
<text x="44" y="178"><tspan class="h" style="font-weight:700">Centre only 4 subjects:</tspan><tspan class="k"> The resolution, generally known as</tspan><tspan class="r"> Anandpur Sahib Resolution</tspan><tspan class="k">,</tspan></text>
<text x="56" y="200"><tspan class="k">demanded that the</tspan><tspan class="r"> Centre’s jurisdiction should be restricted only to defence, foreign</tspan></text>
<text x="56" y="222"><tspan class="r">affairs, communications, and currency</tspan><tspan class="k"> and the</tspan><tspan class="r"> entire residuary powers should be vested</tspan></text>
<text x="56" y="244"><tspan class="r">in the states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="272"><tspan class="h" style="font-weight:700">Truly federal:</tspan><tspan class="k"> It stated that the Constitution should be made</tspan><tspan class="b"> federal in the real sense</tspan></text>
<text x="56" y="294"><tspan class="k">and should ensure</tspan><tspan class="b"> equal authority and representation to all the states</tspan><tspan class="k"> at the Centre.</tspan></text>
<line class="ln" x1="340" y1="300" x2="340" y2="312"/>
<line class="ln" x1="115" y1="312" x2="565" y2="312"/>
<line class="ln" x1="115" y1="312" x2="115" y2="328" marker-end="url(#ah)"/>

<text class="sm" x="265" y="348" text-anchor="middle"><tspan class="r">foreign affairs</tspan></text>
<text class="sm" x="415" y="348" text-anchor="middle"><tspan class="r">communications</tspan></text>
<text class="sm" x="565" y="348" text-anchor="middle"><tspan class="r">currency</tspan></text>

<text class="sm" x="352" y="390"><tspan class="k">only these 4 with the Centre · residuary →</tspan></text>
<text class="sm" x="352" y="409"><tspan class="r">states</tspan></text>
<text class="lb" x="40" y="445">West Bengal Memorandum</text>
<text x="44" y="475"><tspan class="h" style="font-weight:700">West Bengal 1977:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1977</tspan><tspan class="k">, the</tspan><tspan class="r"> West Bengal Government (led by the Communists)</tspan></text>
<text x="56" y="497"><tspan class="k">published a memorandum on Centre–state relations and sent it to the Central</tspan></text>
<text x="56" y="519"><tspan class="k">government.</tspan></text>
<text x="44" y="547"><tspan class="h" style="font-weight:700">Suggestions:</tspan><tspan class="k"> The memorandum inter alia suggested the following:</tspan></text>
<text x="70" y="573" class="r" style="font-weight:700">(i)</text>
<text x="113" y="573"><tspan class="k">The word ‘</tspan><tspan class="r">union</tspan><tspan class="k">’ in the Constitution should be replaced by the word ‘</tspan><tspan class="r">federal</tspan><tspan class="k">’;</tspan></text>
<text x="70" y="599" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="599"><tspan class="k">The jurisdiction of the Centre should be confined to</tspan><tspan class="b"> defence, foreign affairs,</tspan></text>
<text x="113" y="621"><tspan class="b">currency, communications and economic co-ordination</tspan><tspan class="k">;</tspan></text>
<text x="70" y="647" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="647"><tspan class="k">All other subjects including the</tspan><tspan class="r"> residuary</tspan><tspan class="k"> should be vested in the states;</tspan></text>
<text x="70" y="673" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="673"><tspan class="r">Articles 356 and 357 (President’s Rule) and 360 (financial emergency) should</tspan></text>
<text x="113" y="695"><tspan class="r">be repealed</tspan><tspan class="k">;</tspan></text>
<text x="70" y="721" class="r" style="font-weight:700">(v)</text>
<text x="113" y="721"><tspan class="r">State’s consent</tspan><tspan class="k"> should be made obligatory for formation of new states or</tspan></text>
<text x="113" y="743"><tspan class="k">reorganisation of existing states;</tspan></text>
<text x="70" y="769" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="769"><tspan class="k">Of the total revenue raised by the Centre from all sources,</tspan><tspan class="r"> 75 per cent</tspan><tspan class="k"> should</tspan></text>
<text x="113" y="791"><tspan class="k">be allocated to the states;</tspan></text>
<text x="70" y="817" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="817"><tspan class="r">Rajya Sabha should have equal powers</tspan><tspan class="k"> with that of the Lok Sabha; and</tspan></text>
<text x="70" y="843" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="843"><tspan class="k">There should be only Central and state services and the</tspan><tspan class="r"> All-India Services</tspan></text>
<text x="113" y="865"><tspan class="r">should be abolished</tspan><tspan class="k">.</tspan></text>
