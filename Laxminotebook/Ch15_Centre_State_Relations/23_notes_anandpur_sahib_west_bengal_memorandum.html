<div id="vis-container"><h2 class="sr-only">Anandpur Sahib Resolution and West Bengal Memorandum</h2>

<text class="r hd" x="340" y="53" text-anchor="middle">Anandpur Sahib Resolution and West Bengal Memorandum</text>
<text class="lb" x="40" y="98">Anandpur Sahib Resolution</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">In</tspan><tspan class="r"> 1973</tspan><tspan class="k">, the</tspan><tspan class="r"> Akali Dal</tspan><tspan class="k"> adopted a resolution containing both</tspan><tspan class="b"> political and religious</tspan></text>
<text x="58" y="148"><tspan class="b">demands</tspan><tspan class="k"> in a meeting held at</tspan><tspan class="r"> Anandpur Sahib in Punjab</tspan><tspan class="k">.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">The resolution, generally known as</tspan><tspan class="r"> Anandpur Sahib Resolution</tspan><tspan class="k">, demanded that the</tspan></text>
<text x="58" y="196"><tspan class="r">Centre’s jurisdiction should be restricted only to defence, foreign affairs,</tspan></text>
<text x="58" y="218"><tspan class="r">communications, and currency</tspan><tspan class="k"> and the</tspan><tspan class="r"> entire residuary powers should be vested in the</tspan></text>
<text x="58" y="240"><tspan class="r">states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="266" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="266"><tspan class="k">It stated that the Constitution should be made</tspan><tspan class="b"> federal in the real sense</tspan><tspan class="k"> and should</tspan></text>
<text x="58" y="288"><tspan class="k">ensure</tspan><tspan class="b"> equal authority and representation to all the states</tspan><tspan class="k"> at the Centre.</tspan></text>
<line class="ln" x1="340" y1="294" x2="340" y2="306"/>
<line class="ln" x1="115" y1="306" x2="565" y2="306"/>
<line class="ln" x1="115" y1="306" x2="115" y2="322" marker-end="url(#ah)"/>

<text class="sm" x="265" y="342" text-anchor="middle"><tspan class="r">foreign affairs</tspan></text>
<text class="sm" x="415" y="342" text-anchor="middle"><tspan class="r">communications</tspan></text>
<text class="sm" x="565" y="342" text-anchor="middle"><tspan class="r">currency</tspan></text>

<text class="lb" x="40" y="439">West Bengal Memorandum</text>
<text x="44" y="467" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="467"><tspan class="k">In</tspan><tspan class="r"> 1977</tspan><tspan class="k">, the</tspan><tspan class="r"> West Bengal Government (led by the Communists)</tspan><tspan class="k"> published a</tspan></text>
<text x="58" y="489"><tspan class="k">memorandum on Centre–state relations and sent it to the Central government.</tspan></text>
<text x="44" y="515" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="515"><tspan class="k">The memorandum inter alia suggested the following:</tspan></text>
<text x="70" y="541" class="r" style="font-weight:700">(i)</text>
<text x="113" y="541"><tspan class="k">The word ‘</tspan><tspan class="r">union</tspan><tspan class="k">’ in the Constitution should be replaced by the word ‘</tspan><tspan class="r">federal</tspan><tspan class="k">’;</tspan></text>
<text x="70" y="567" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="567"><tspan class="k">The jurisdiction of the Centre should be confined to</tspan><tspan class="b"> defence, foreign affairs,</tspan></text>
<text x="113" y="589"><tspan class="b">currency, communications and economic co-ordination</tspan><tspan class="k">;</tspan></text>
<text x="70" y="615" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="615"><tspan class="k">All other subjects including the</tspan><tspan class="r"> residuary</tspan><tspan class="k"> should be vested in the states;</tspan></text>
<text x="70" y="641" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="641"><tspan class="r">Articles 356 and 357 (President’s Rule) and 360 (financial emergency) should</tspan></text>
<text x="113" y="663"><tspan class="r">be repealed</tspan><tspan class="k">;</tspan></text>
<text x="70" y="689" class="r" style="font-weight:700">(v)</text>
<text x="113" y="689"><tspan class="r">State’s consent</tspan><tspan class="k"> should be made obligatory for formation of new states or</tspan></text>
<text x="113" y="711"><tspan class="k">reorganisation of existing states;</tspan></text>
<text x="70" y="737" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="737"><tspan class="k">Of the total revenue raised by the Centre from all sources,</tspan><tspan class="r"> 75 per cent</tspan><tspan class="k"> should</tspan></text>
<text x="113" y="759"><tspan class="k">be allocated to the states;</tspan></text>
<text x="70" y="785" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="785"><tspan class="r">Rajya Sabha should have equal powers</tspan><tspan class="k"> with that of the Lok Sabha; and</tspan></text>
<text x="70" y="811" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="811"><tspan class="k">There should be only Central and state services and the</tspan><tspan class="r"> All-India Services</tspan></text>
<text x="113" y="833"><tspan class="r">should be abolished</tspan><tspan class="k">.</tspan></text>

<text x="58" y="955"><tspan class="k">The Central government</tspan><tspan class="r"> did not accept</tspan><tspan class="k"> the demands made in the memorandum.</tspan></text>
