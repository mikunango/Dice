<div id="vis-container"><h2 class="sr-only">Anandpur Sahib Resolution and West Bengal Memorandum</h2>
<svg class="n" width="100%" viewBox="0 0 680 1275" role="img"><title>Anandpur Sahib Resolution and West Bengal Memorandum</title><desc>Anandpur Sahib Resolution and West Bengal Memorandum</desc>

<text class="r hd" x="340" y="53" text-anchor="middle">Anandpur Sahib Resolution and West Bengal Memorandum</text>
<text class="lb" x="40" y="98">Anandpur Sahib Resolution</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Anandpur Sahib Resolution (1973):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1973</tspan><tspan class="k">, the</tspan><tspan class="r"> Akali Dal</tspan><tspan class="k"> adopted a resolution</tspan></text>
<text x="56" y="150"><tspan class="k">containing both</tspan><tspan class="b"> political and religious demands</tspan><tspan class="k"> in a meeting held at</tspan><tspan class="r"> Anandpur Sahib in</tspan></text>
<text x="56" y="172"><tspan class="r">Punjab</tspan><tspan class="k">. The resolution, generally known as</tspan><tspan class="r"> Anandpur Sahib Resolution</tspan><tspan class="k">, demanded that</tspan></text>
<text x="56" y="194"><tspan class="k">the</tspan><tspan class="r"> Centre’s jurisdiction should be restricted only to defence, foreign affairs,</tspan></text>
<text x="56" y="216"><tspan class="r">communications, and currency</tspan><tspan class="k"> and the</tspan><tspan class="r"> entire residuary powers should be vested in the</tspan></text>
<text x="56" y="238"><tspan class="r">states</tspan><tspan class="k">. It stated that the Constitution should be made</tspan><tspan class="b"> federal in the real sense</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="260"><tspan class="k">should ensure</tspan><tspan class="b"> equal authority and representation to all the states</tspan><tspan class="k"> at the Centre.</tspan></text>
<line class="ln" x1="340" y1="266" x2="340" y2="278"/>
<line class="ln" x1="115" y1="278" x2="565" y2="278"/>

<text class="sm" x="265" y="314" text-anchor="middle"><tspan class="r">foreign affairs</tspan></text>
<text class="sm" x="415" y="314" text-anchor="middle"><tspan class="r">communications</tspan></text>
<text class="sm" x="565" y="314" text-anchor="middle"><tspan class="r">currency</tspan></text>

<text class="sm" x="352" y="375"><tspan class="r">states</tspan></text>
<text class="lb" x="40" y="411">West Bengal Memorandum</text>
<text x="44" y="441"><tspan class="h" style="font-weight:700">West Bengal Memorandum (1977):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1977</tspan><tspan class="k">, the</tspan><tspan class="r"> West Bengal Government (led by the</tspan></text>
<text x="56" y="463"><tspan class="r">Communists)</tspan><tspan class="k"> published a memorandum on Centre–state relations and sent it to the</tspan></text>
<text x="56" y="485"><tspan class="k">Central government.</tspan></text>
<text x="56" y="509"><tspan class="k">The memorandum inter alia suggested the following:</tspan></text>
<text x="70" y="535" class="r" style="font-weight:700">(i)</text>
<text x="113" y="535"><tspan class="h" style="font-weight:700">‘Federal’ for ‘Union’:</tspan><tspan class="k"> The word ‘</tspan><tspan class="r">union</tspan><tspan class="k">’ in the Constitution should be replaced</tspan></text>
<text x="113" y="557"><tspan class="k">by the word ‘</tspan><tspan class="r">federal</tspan><tspan class="k">’;</tspan></text>
<text x="70" y="583" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="583"><tspan class="h" style="font-weight:700">Limited Central jurisdiction:</tspan><tspan class="k"> The jurisdiction of the Centre should be confined</tspan></text>
<text x="113" y="605"><tspan class="k">to</tspan><tspan class="b"> defence, foreign affairs, currency, communications and economic</tspan></text>
<text x="113" y="627"><tspan class="b">co-ordination</tspan><tspan class="k">;</tspan></text>
<text x="70" y="653" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="653"><tspan class="h" style="font-weight:700">Residuary to states:</tspan><tspan class="k"> All other subjects including the</tspan><tspan class="r"> residuary</tspan><tspan class="k"> should be</tspan></text>
<text x="113" y="675"><tspan class="k">vested in the states;</tspan></text>
<text x="70" y="701" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="701"><tspan class="h" style="font-weight:700">Repeal Arts. 356, 357, 360:</tspan><tspan class="r"> Articles 356 and 357 (President’s Rule) and 360</tspan></text>
<text x="113" y="723"><tspan class="r">(financial emergency) should be repealed</tspan><tspan class="k">;</tspan></text>
<text x="70" y="749" class="r" style="font-weight:700">(v)</text>
<text x="113" y="749"><tspan class="h" style="font-weight:700">States’ consent for reorganisation:</tspan><tspan class="r"> State’s consent</tspan><tspan class="k"> should be made</tspan></text>
<text x="113" y="771"><tspan class="k">obligatory for formation of new states or reorganisation of existing states;</tspan></text>
<text x="70" y="797" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="797"><tspan class="h" style="font-weight:700">75% revenue to states:</tspan><tspan class="k"> Of the total revenue raised by the Centre from all</tspan></text>
<text x="113" y="819"><tspan class="k">sources,</tspan><tspan class="r"> 75 per cent</tspan><tspan class="k"> should be allocated to the states;</tspan></text>
<text x="70" y="845" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="845"><tspan class="h" style="font-weight:700">Equal powers to Rajya Sabha:</tspan><tspan class="r"> Rajya Sabha should have equal powers</tspan><tspan class="k"> with</tspan></text>
<text x="113" y="867"><tspan class="k">that of the Lok Sabha; and</tspan></text>
<text x="70" y="893" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="893"><tspan class="h" style="font-weight:700">Abolish AIS:</tspan><tspan class="k"> There should be only Central and state services and the</tspan><tspan class="r"> All-India</tspan></text>
<text x="113" y="915"><tspan class="r">Services should be abolished</tspan><tspan class="k">.</tspan></text>

<text x="56" y="1061"><tspan class="k">the memorandum.</tspan></text>
