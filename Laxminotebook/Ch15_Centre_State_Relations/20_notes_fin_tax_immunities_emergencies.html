<div id="vis-container"><h2 class="sr-only">Inter-Governmental Tax Immunities and Emergencies</h2>
<svg class="n" width="100%" viewBox="0 0 680 1529" role="img"><title>Inter-Governmental Tax Immunities and Emergencies</title><desc>Inter-Governmental Tax Immunities and Emergencies</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="109" y="26" width="463" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Inter-Governmental Tax Immunities and Emergencies</text>
<text class="lb" x="40" y="98">9. Inter-Governmental Tax Immunities</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Mutual tax immunity:</tspan><tspan class="k"> Like any other federal Constitution, the Indian Constitution also</tspan></text>
<text x="56" y="150"><tspan class="k">contain the rule of ‘</tspan><tspan class="r">immunity from mutual taxation</tspan><tspan class="k">’ and makes the following provisions</tspan></text>
<text x="56" y="172"><tspan class="k">in this regard:</tspan></text>
<text class="sh" x="40" y="200"><tspan class="r" style="font-weight:700">A. Exemption of Central Property from State Taxation</tspan></text>
<text x="44" y="230"><tspan class="h" style="font-weight:700">Central property exempt:</tspan><tspan class="k"> The</tspan><tspan class="r"> property of Centre</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from all taxes imposed by</tspan></text>
<text x="56" y="252"><tspan class="r">a state</tspan><tspan class="k"> or any authority within a state like</tspan><tspan class="b"> municipalities, district boards, panchayats</tspan></text>
<text x="56" y="274"><tspan class="k">and so on. But, the</tspan><tspan class="r"> Parliament is empowered to remove this ban</tspan><tspan class="k">. The word ‘</tspan><tspan class="r">property</tspan><tspan class="k">’</tspan></text>
<text x="56" y="296"><tspan class="k">includes</tspan><tspan class="b"> lands, buildings, chattels, shares, debts, everything that has a money value</tspan><tspan class="k">, and</tspan></text>
<text x="56" y="318"><tspan class="k">every kind of property—</tspan><tspan class="b">movable or immovable and tangible or intangible</tspan><tspan class="k">. Further, the</tspan></text>
<text x="56" y="340"><tspan class="k">property may be used for</tspan><tspan class="b"> sovereign (like armed forces) or commercial purposes</tspan><tspan class="k">.</tspan></text>
<text x="44" y="368"><tspan class="h" style="font-weight:700">Central companies taxable:</tspan><tspan class="k"> The</tspan><tspan class="r"> corporations or the companies</tspan><tspan class="k"> created by the Central</tspan></text>
<text x="56" y="390"><tspan class="k">government are</tspan><tspan class="r"> not immune</tspan><tspan class="k"> from state taxation or local taxation. The reason is that a</tspan></text>
<text x="56" y="412"><tspan class="k">corporation or a company is a</tspan><tspan class="b"> separate legal entity</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="440"><tspan class="r" style="font-weight:700">B. Exemption of State Property or Income from Central Taxation</tspan></text>
<text x="44" y="470"><tspan class="h" style="font-weight:700">State property exempt:</tspan><tspan class="k"> The</tspan><tspan class="r"> property and income of a state</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from Central</tspan></text>
<text x="56" y="492"><tspan class="r">taxation</tspan><tspan class="k">. Such income may be derived from</tspan><tspan class="b"> sovereign functions or commercial functions</tspan><tspan class="k">.</tspan></text>
<text x="56" y="514"><tspan class="k">But the</tspan><tspan class="r"> Centre can tax the commercial operations</tspan><tspan class="k"> of a state if</tspan><tspan class="b"> Parliament so provides</tspan><tspan class="k">.</tspan></text>
<text x="56" y="536"><tspan class="k">However, the Parliament can declare any particular trade or business as</tspan><tspan class="b"> incidental to the</tspan></text>
<text x="56" y="558"><tspan class="b">ordinary functions of the government</tspan><tspan class="k"> and it would then</tspan><tspan class="r"> not be taxable</tspan><tspan class="k">.</tspan></text>
<text x="44" y="586"><tspan class="h" style="font-weight:700">Local bodies &amp; state companies:</tspan><tspan class="k"> Notably, the property and income of</tspan><tspan class="r"> local authorities</tspan></text>
<text x="56" y="608"><tspan class="k">situated within a state are</tspan><tspan class="r"> not exempted</tspan><tspan class="k"> from the Central taxation. Similarly, the</tspan></text>
<text x="56" y="630"><tspan class="k">property or income of</tspan><tspan class="r"> corporations and companies owned by a state</tspan><tspan class="k"> can be taxed by the</tspan></text>
<text x="56" y="652"><tspan class="k">Centre.</tspan></text>
<text x="44" y="680"><tspan class="h" style="font-weight:700">Customs &amp; excise – 1963:</tspan><tspan class="k"> The</tspan><tspan class="r"> Supreme Court</tspan><tspan class="k">, in an</tspan><tspan class="r"> advisory opinion¹⁸ (1963)</tspan><tspan class="k">, held</tspan></text>
<text x="56" y="702"><tspan class="k">that the immunity granted to a state in respect of Central taxation</tspan><tspan class="r"> does not extend to</tspan></text>
<text x="56" y="724"><tspan class="r">the duties of customs or duties of excise</tspan><tspan class="k">. In other words, the Centre can impose</tspan><tspan class="b"> customs</tspan></text>
<text x="56" y="746"><tspan class="b">duty on goods imported or exported by a state</tspan><tspan class="k">, or an</tspan><tspan class="b"> excise duty on goods produced or</tspan></text>
<text x="56" y="768"><tspan class="b">manufactured by a state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="782" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="800" text-anchor="middle"><tspan class="r" style="font-weight:700">Central property</tspan></text>
<line class="ln" x1="190" y1="810" x2="190" y2="824" marker-end="url(#ah)"/>
<text class="sm" x="190" y="845" text-anchor="middle"><tspan class="k">✔ exempt from state taxes</tspan></text>
<text class="sm" x="190" y="867" text-anchor="middle"><tspan class="b">Parliament can remove ban</tspan></text>
<text class="sm" x="190" y="889" text-anchor="middle"><tspan class="k">✘ Central corporations / companies</tspan></text>
<rect class="bx" x="346" y="782" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="800" text-anchor="middle"><tspan class="r" style="font-weight:700">State property / income</tspan></text>
<line class="ln" x1="490" y1="810" x2="490" y2="824" marker-end="url(#ah)"/>
<text class="sm" x="490" y="845" text-anchor="middle"><tspan class="k">✔ exempt from Central taxes</tspan></text>
<text class="sm" x="490" y="867" text-anchor="middle"><tspan class="k">✘ commercial ops (if Parliament provides)</tspan></text>
<text class="sm" x="490" y="889" text-anchor="middle"><tspan class="k">✘ local authorities, state companies</tspan></text>
<text class="sm" x="490" y="911" text-anchor="middle"><tspan class="k">✘ customs &amp; excise (1963)</tspan></text>
<line x1="340" y1="782" x2="340" y2="914" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="952">10. Effects of Emergencies</text>
<text x="44" y="982"><tspan class="h" style="font-weight:700">Changes in emergency:</tspan><tspan class="k"> The Centre–state financial relations in normal times (described</tspan></text>
<text x="56" y="1004"><tspan class="k">above) undergo changes during</tspan><tspan class="r"> emergencies</tspan><tspan class="k">. These are as follows:</tspan></text>
<text class="sh" x="40" y="1032"><tspan class="r" style="font-weight:700">A. National Emergency</tspan></text>
<text x="44" y="1062"><tspan class="h" style="font-weight:700">National Emergency – Art. 352:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under</tspan></text>
<text x="56" y="1084"><tspan class="r">Article 352</tspan><tspan class="k">) is in operation, the</tspan><tspan class="r"> President can modify the constitutional distribution of</tspan></text>
<text x="56" y="1106"><tspan class="r">revenues</tspan><tspan class="k"> between the Centre and the states. This means that the President can either</tspan></text>
<text x="56" y="1128"><tspan class="r">reduce or cancel the transfer of finances</tspan><tspan class="k"> (</tspan><tspan class="b">both tax sharing and grants-in-aid</tspan><tspan class="k">) from the</tspan></text>
<text x="56" y="1150"><tspan class="k">Centre to the states. Such modification continues</tspan><tspan class="r"> till the end of the financial year</tspan><tspan class="k"> in</tspan></text>
<text x="56" y="1172"><tspan class="k">which the emergency ceases to operate.</tspan></text>
<text class="sh" x="40" y="1200"><tspan class="r" style="font-weight:700">B. Financial Emergency</tspan></text>
<text x="44" y="1230"><tspan class="h" style="font-weight:700">Financial Emergency – Art. 360:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan></text>
<text x="56" y="1252"><tspan class="r">Article 360</tspan><tspan class="k">) is in operation, the Centre can give directions to the states:</tspan></text>
<text x="70" y="1278" class="r" style="font-weight:700">(i)</text>
<text x="107" y="1278"><tspan class="k">to observe the specified</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1304" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1304"><tspan class="k">to</tspan><tspan class="b"> reduce the salaries and allowances</tspan><tspan class="k"> of all class of persons serving in the</tspan></text>
<text x="107" y="1326"><tspan class="k">state; and</tspan></text>
<text x="70" y="1352" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1352"><tspan class="k">to</tspan><tspan class="b"> reserve all money bills and other financial bills</tspan><tspan class="k"> for the consideration of the</tspan></text>
<text x="107" y="1374"><tspan class="k">President.</tspan></text>

<text class="sm" x="188" y="1424" text-anchor="middle"><tspan class="k">reduce / cancel transfers</tspan></text>
<text class="sm" x="188" y="1442" text-anchor="middle"><tspan class="b">till end of financial year</tspan></text>

<text class="sm" x="492" y="1424" text-anchor="middle"><tspan class="k">financial propriety · salary cut</tspan></text>
