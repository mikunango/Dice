<div id="vis-container"><h2 class="sr-only">Inter-Governmental Tax Immunities and Emergencies</h2>
<svg class="n" width="100%" viewBox="0 0 680 1843" role="img"><title>Inter-Governmental Tax Immunities and Emergencies</title><desc>Inter-Governmental Tax Immunities and Emergencies</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="109" y="26" width="463" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Inter-Governmental Tax Immunities and Emergencies</text>
<text class="lb" x="40" y="98">9. Inter-Governmental Tax Immunities</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Immunity from mutual taxation:</tspan><tspan class="k"> Like any other federal Constitution, the Indian</tspan></text>
<text x="56" y="150"><tspan class="k">Constitution also contain the rule of ‘</tspan><tspan class="r">immunity from mutual taxation</tspan><tspan class="k">’ and makes the</tspan></text>
<text x="56" y="172"><tspan class="k">following provisions in this regard:</tspan></text>
<text class="sh" x="40" y="200"><tspan class="r" style="font-weight:700">A. Exemption of Central Property from State Taxation</tspan></text>
<text x="44" y="230"><tspan class="h" style="font-weight:700">Central property exempt:</tspan><tspan class="k"> The</tspan><tspan class="r"> property of Centre</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from all taxes imposed by</tspan></text>
<text x="56" y="252"><tspan class="r">a state</tspan><tspan class="k"> or any authority within a state like</tspan><tspan class="b"> municipalities, district boards, panchayats</tspan></text>
<text x="56" y="274"><tspan class="k">and so on.</tspan></text>
<text x="44" y="302"><tspan class="h" style="font-weight:700">Parliament can remove:</tspan><tspan class="k"> But, the</tspan><tspan class="r"> Parliament is empowered to remove this ban</tspan><tspan class="k">.</tspan></text>
<text x="44" y="330"><tspan class="h" style="font-weight:700">Property – meaning:</tspan><tspan class="k"> The word ‘</tspan><tspan class="r">property</tspan><tspan class="k">’ includes</tspan><tspan class="b"> lands, buildings, chattels, shares,</tspan></text>
<text x="56" y="352"><tspan class="b">debts, everything that has a money value</tspan><tspan class="k">, and every kind of property—</tspan><tspan class="b">movable or</tspan></text>
<text x="56" y="374"><tspan class="b">immovable and tangible or intangible</tspan><tspan class="k">.</tspan></text>
<text x="44" y="402"><tspan class="h" style="font-weight:700">Sovereign or commercial:</tspan><tspan class="k"> Further, the property may be used for</tspan><tspan class="b"> sovereign (like armed</tspan></text>
<text x="56" y="424"><tspan class="b">forces) or commercial purposes</tspan><tspan class="k">.</tspan></text>
<text x="44" y="452"><tspan class="h" style="font-weight:700">Central PSUs not immune:</tspan><tspan class="k"> The</tspan><tspan class="r"> corporations or the companies</tspan><tspan class="k"> created by the Central</tspan></text>
<text x="56" y="474"><tspan class="k">government are</tspan><tspan class="r"> not immune</tspan><tspan class="k"> from state taxation or local taxation.</tspan></text>
<text x="44" y="502"><tspan class="h" style="font-weight:700">Separate legal entity:</tspan><tspan class="k"> The reason is that a corporation or a company is a</tspan><tspan class="b"> separate legal</tspan></text>
<text x="56" y="524"><tspan class="b">entity</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="552"><tspan class="r" style="font-weight:700">B. Exemption of State Property or Income from Central Taxation</tspan></text>
<text x="44" y="582"><tspan class="h" style="font-weight:700">State property exempt:</tspan><tspan class="k"> The</tspan><tspan class="r"> property and income of a state</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from Central</tspan></text>
<text x="56" y="604"><tspan class="r">taxation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="632"><tspan class="h" style="font-weight:700">Sovereign or commercial:</tspan><tspan class="k"> Such income may be derived from</tspan><tspan class="b"> sovereign functions or</tspan></text>
<text x="56" y="654"><tspan class="b">commercial functions</tspan><tspan class="k">.</tspan></text>
<text x="44" y="682"><tspan class="h" style="font-weight:700">Commercial ops taxable:</tspan><tspan class="k"> But the</tspan><tspan class="r"> Centre can tax the commercial operations</tspan><tspan class="k"> of a state if</tspan></text>
<text x="56" y="704"><tspan class="b">Parliament so provides</tspan><tspan class="k">.</tspan></text>
<text x="44" y="732"><tspan class="h" style="font-weight:700">Incidental – not taxable:</tspan><tspan class="k"> However, the Parliament can declare any particular trade or</tspan></text>
<text x="56" y="754"><tspan class="k">business as</tspan><tspan class="b"> incidental to the ordinary functions of the government</tspan><tspan class="k"> and it would then</tspan><tspan class="r"> not</tspan></text>
<text x="56" y="776"><tspan class="r">be taxable</tspan><tspan class="k">.</tspan></text>
<text x="44" y="804"><tspan class="h" style="font-weight:700">Local authorities:</tspan><tspan class="k"> Notably, the property and income of</tspan><tspan class="r"> local authorities</tspan><tspan class="k"> situated within a</tspan></text>
<text x="56" y="826"><tspan class="k">state are</tspan><tspan class="r"> not exempted</tspan><tspan class="k"> from the Central taxation.</tspan></text>
<text x="44" y="854"><tspan class="h" style="font-weight:700">State companies:</tspan><tspan class="k"> Similarly, the property or income of</tspan><tspan class="r"> corporations and companies owned</tspan></text>
<text x="56" y="876"><tspan class="r">by a state</tspan><tspan class="k"> can be taxed by the Centre.</tspan></text>
<text x="44" y="904"><tspan class="h" style="font-weight:700">Advisory opinion 1963:</tspan><tspan class="k"> The</tspan><tspan class="r"> Supreme Court</tspan><tspan class="k">, in an</tspan><tspan class="r"> advisory opinion¹⁸ (1963)</tspan><tspan class="k">, held that</tspan></text>
<text x="56" y="926"><tspan class="k">the immunity granted to a state in respect of Central taxation</tspan><tspan class="r"> does not extend to the</tspan></text>
<text x="56" y="948"><tspan class="r">duties of customs or duties of excise</tspan><tspan class="k">.</tspan></text>
<text x="44" y="976"><tspan class="h" style="font-weight:700">Customs &amp; excise:</tspan><tspan class="k"> In other words, the Centre can impose</tspan><tspan class="b"> customs duty on goods</tspan></text>
<text x="56" y="998"><tspan class="b">imported or exported by a state</tspan><tspan class="k">, or an</tspan><tspan class="b"> excise duty on goods produced or manufactured by</tspan></text>
<text x="56" y="1020"><tspan class="b">a state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="1034" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1052" text-anchor="middle"><tspan class="r" style="font-weight:700">Central property</tspan></text>
<line class="ln" x1="190" y1="1062" x2="190" y2="1076" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1097" text-anchor="middle"><tspan class="k">✔ exempt from state taxes</tspan></text>
<text class="sm" x="190" y="1119" text-anchor="middle"><tspan class="b">Parliament can remove ban</tspan></text>
<text class="sm" x="190" y="1141" text-anchor="middle"><tspan class="k">✘ Central corporations / companies</tspan></text>
<rect class="bx" x="346" y="1034" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1052" text-anchor="middle"><tspan class="r" style="font-weight:700">State property / income</tspan></text>
<line class="ln" x1="490" y1="1062" x2="490" y2="1076" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1097" text-anchor="middle"><tspan class="k">✔ exempt from Central taxes</tspan></text>
<text class="sm" x="490" y="1119" text-anchor="middle"><tspan class="k">✘ commercial ops (if Parliament provides)</tspan></text>
<text class="sm" x="490" y="1141" text-anchor="middle"><tspan class="k">✘ local authorities, state companies</tspan></text>
<text class="sm" x="490" y="1163" text-anchor="middle"><tspan class="k">✘ customs &amp; excise (1963)</tspan></text>
<line x1="340" y1="1034" x2="340" y2="1166" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="1204">10. Effects of Emergencies</text>
<text x="44" y="1234"><tspan class="h" style="font-weight:700">Changes in emergency:</tspan><tspan class="k"> The Centre–state financial relations in normal times (described</tspan></text>
<text x="56" y="1256"><tspan class="k">above) undergo changes during</tspan><tspan class="r"> emergencies</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1284"><tspan class="h" style="font-weight:700">Two effects:</tspan><tspan class="k"> These are as follows:</tspan></text>
<text class="sh" x="40" y="1312"><tspan class="r" style="font-weight:700">A. National Emergency</tspan></text>
<text x="44" y="1342"><tspan class="h" style="font-weight:700">Art. 352 – modify revenues:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under</tspan></text>
<text x="56" y="1364"><tspan class="r">Article 352</tspan><tspan class="k">) is in operation, the</tspan><tspan class="r"> President can modify the constitutional distribution of</tspan></text>
<text x="56" y="1386"><tspan class="r">revenues</tspan><tspan class="k"> between the Centre and the states.</tspan></text>
<text x="44" y="1414"><tspan class="h" style="font-weight:700">Reduce or cancel:</tspan><tspan class="k"> This means that the President can either</tspan><tspan class="r"> reduce or cancel the</tspan></text>
<text x="56" y="1436"><tspan class="r">transfer of finances</tspan><tspan class="k"> (</tspan><tspan class="b">both tax sharing and grants-in-aid</tspan><tspan class="k">) from the Centre to the states.</tspan></text>
<text x="44" y="1464"><tspan class="h" style="font-weight:700">Till end of FY:</tspan><tspan class="k"> Such modification continues</tspan><tspan class="r"> till the end of the financial year</tspan><tspan class="k"> in which</tspan></text>
<text x="56" y="1486"><tspan class="k">the emergency ceases to operate.</tspan></text>
<text class="sh" x="40" y="1514"><tspan class="r" style="font-weight:700">B. Financial Emergency</tspan></text>
<text x="44" y="1544"><tspan class="h" style="font-weight:700">Art. 360 – directions:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article</tspan></text>
<text x="56" y="1566"><tspan class="r">360</tspan><tspan class="k">) is in operation, the Centre can give directions to the states:</tspan></text>
<text x="70" y="1592" class="r" style="font-weight:700">(i)</text>
<text x="107" y="1592"><tspan class="k">to observe the specified</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1618" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1618"><tspan class="k">to</tspan><tspan class="b"> reduce the salaries and allowances</tspan><tspan class="k"> of all class of persons serving in the</tspan></text>
<text x="107" y="1640"><tspan class="k">state; and</tspan></text>
<text x="70" y="1666" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1666"><tspan class="k">to</tspan><tspan class="b"> reserve all money bills and other financial bills</tspan><tspan class="k"> for the consideration of the</tspan></text>
<text x="107" y="1688"><tspan class="k">President.</tspan></text>
