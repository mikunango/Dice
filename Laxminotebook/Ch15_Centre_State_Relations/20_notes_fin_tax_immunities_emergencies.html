<div id="vis-container"><h2 class="sr-only">Inter-Governmental Tax Immunities and Emergencies</h2>
<svg class="n" width="100%" viewBox="0 0 680 1625" role="img"><title>Inter-Governmental Tax Immunities and Emergencies</title><desc>Inter-Governmental Tax Immunities and Emergencies</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="109" y="26" width="463" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Inter-Governmental Tax Immunities and Emergencies</text>
<text class="lb" x="40" y="98">9. Inter-Governmental Tax Immunities</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">Like any other federal Constitution, the Indian Constitution also contain the rule of</tspan></text>
<text x="58" y="148"><tspan class="k">‘</tspan><tspan class="r">immunity from mutual taxation</tspan><tspan class="k">’ and makes the following provisions in this regard:</tspan></text>
<text class="sh" x="40" y="176"><tspan class="r" style="font-weight:700">A. Exemption of Central Property from State Taxation</tspan></text>
<text x="44" y="204" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="204"><tspan class="k">The</tspan><tspan class="r"> property of Centre</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from all taxes imposed by a state</tspan><tspan class="k"> or any authority</tspan></text>
<text x="58" y="226"><tspan class="k">within a state like</tspan><tspan class="b"> municipalities, district boards, panchayats</tspan><tspan class="k"> and so on.</tspan></text>
<text x="44" y="252" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="252"><tspan class="k">But, the</tspan><tspan class="r"> Parliament is empowered to remove this ban</tspan><tspan class="k">.</tspan></text>
<text x="44" y="278" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="278"><tspan class="k">The word ‘</tspan><tspan class="r">property</tspan><tspan class="k">’ includes</tspan><tspan class="b"> lands, buildings, chattels, shares, debts, everything that</tspan></text>
<text x="58" y="300"><tspan class="b">has a money value</tspan><tspan class="k">, and every kind of property—</tspan><tspan class="b">movable or immovable and tangible or</tspan></text>
<text x="58" y="322"><tspan class="b">intangible</tspan><tspan class="k">.</tspan></text>
<text x="44" y="348" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="348"><tspan class="k">Further, the property may be used for</tspan><tspan class="b"> sovereign (like armed forces) or commercial</tspan></text>
<text x="58" y="370"><tspan class="b">purposes</tspan><tspan class="k">.</tspan></text>
<text x="44" y="396" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="396"><tspan class="k">The</tspan><tspan class="r"> corporations or the companies</tspan><tspan class="k"> created by the Central government are</tspan><tspan class="r"> not immune</tspan></text>
<text x="58" y="418"><tspan class="k">from state taxation or local taxation.</tspan></text>
<text x="44" y="444" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="444"><tspan class="k">The reason is that a corporation or a company is a</tspan><tspan class="b"> separate legal entity</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="472"><tspan class="r" style="font-weight:700">B. Exemption of State Property or Income from Central Taxation</tspan></text>
<text x="44" y="500" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="500"><tspan class="k">The</tspan><tspan class="r"> property and income of a state</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from Central taxation</tspan><tspan class="k">.</tspan></text>
<text x="44" y="526" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="526"><tspan class="k">Such income may be derived from</tspan><tspan class="b"> sovereign functions or commercial functions</tspan><tspan class="k">.</tspan></text>
<text x="44" y="552" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="552"><tspan class="k">But the</tspan><tspan class="r"> Centre can tax the commercial operations</tspan><tspan class="k"> of a state if</tspan><tspan class="b"> Parliament so provides</tspan><tspan class="k">.</tspan></text>
<text x="44" y="578" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="578"><tspan class="k">However, the Parliament can declare any particular trade or business as</tspan><tspan class="b"> incidental to</tspan></text>
<text x="58" y="600"><tspan class="b">the ordinary functions of the government</tspan><tspan class="k"> and it would then</tspan><tspan class="r"> not be taxable</tspan><tspan class="k">.</tspan></text>
<text x="44" y="626" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="626"><tspan class="k">Notably, the property and income of</tspan><tspan class="r"> local authorities</tspan><tspan class="k"> situated within a state are</tspan><tspan class="r"> not</tspan></text>
<text x="58" y="648"><tspan class="r">exempted</tspan><tspan class="k"> from the Central taxation.</tspan></text>
<text x="44" y="674" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="674"><tspan class="k">Similarly, the property or income of</tspan><tspan class="r"> corporations and companies owned by a state</tspan><tspan class="k"> can</tspan></text>
<text x="58" y="696"><tspan class="k">be taxed by the Centre.</tspan></text>
<text x="44" y="722" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="722"><tspan class="k">The</tspan><tspan class="r"> Supreme Court</tspan><tspan class="k">, in an</tspan><tspan class="r"> advisory opinion¹⁸ (1963)</tspan><tspan class="k">, held that the immunity granted</tspan></text>
<text x="58" y="744"><tspan class="k">to a state in respect of Central taxation</tspan><tspan class="r"> does not extend to the duties of customs or</tspan></text>
<text x="58" y="766"><tspan class="r">duties of excise</tspan><tspan class="k">.</tspan></text>
<text x="44" y="792" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="792"><tspan class="k">In other words, the Centre can impose</tspan><tspan class="b"> customs duty on goods imported or exported by</tspan></text>
<text x="58" y="814"><tspan class="b">a state</tspan><tspan class="k">, or an</tspan><tspan class="b"> excise duty on goods produced or manufactured by a state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="828" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="846" text-anchor="middle"><tspan class="r" style="font-weight:700">Central property</tspan></text>
<line class="ln" x1="190" y1="856" x2="190" y2="870" marker-end="url(#ah)"/>
<text class="sm" x="190" y="891" text-anchor="middle"><tspan class="k">✔ exempt from state taxes</tspan></text>
<text class="sm" x="190" y="913" text-anchor="middle"><tspan class="b">Parliament can remove ban</tspan></text>
<text class="sm" x="190" y="935" text-anchor="middle"><tspan class="k">✘ Central corporations / companies</tspan></text>
<rect class="bx" x="346" y="828" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="846" text-anchor="middle"><tspan class="r" style="font-weight:700">State property / income</tspan></text>
<line class="ln" x1="490" y1="856" x2="490" y2="870" marker-end="url(#ah)"/>
<text class="sm" x="490" y="891" text-anchor="middle"><tspan class="k">✔ exempt from Central taxes</tspan></text>
<text class="sm" x="490" y="913" text-anchor="middle"><tspan class="k">✘ commercial ops (if Parliament provides)</tspan></text>
<text class="sm" x="490" y="935" text-anchor="middle"><tspan class="k">✘ local authorities, state companies</tspan></text>
<text class="sm" x="490" y="957" text-anchor="middle"><tspan class="k">✘ customs &amp; excise (1963)</tspan></text>
<line x1="340" y1="828" x2="340" y2="960" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="998">10. Effects of Emergencies</text>
<text x="44" y="1026" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1026"><tspan class="k">The Centre–state financial relations in normal times (described above) undergo</tspan></text>
<text x="58" y="1048"><tspan class="k">changes during</tspan><tspan class="r"> emergencies</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1074" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1074"><tspan class="k">These are as follows:</tspan></text>
<text class="sh" x="40" y="1102"><tspan class="r" style="font-weight:700">A. National Emergency</tspan></text>
<text x="44" y="1130" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1130"><tspan class="k">While the proclamation of</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 352</tspan><tspan class="k">) is in operation, the</tspan></text>
<text x="58" y="1152"><tspan class="r">President can modify the constitutional distribution of revenues</tspan><tspan class="k"> between the Centre</tspan></text>
<text x="58" y="1174"><tspan class="k">and the states.</tspan></text>
<text x="44" y="1200" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1200"><tspan class="k">This means that the President can either</tspan><tspan class="r"> reduce or cancel the transfer of finances</tspan></text>
<text x="58" y="1222"><tspan class="k">(</tspan><tspan class="b">both tax sharing and grants-in-aid</tspan><tspan class="k">) from the Centre to the states.</tspan></text>
<text x="44" y="1248" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1248"><tspan class="k">Such modification continues</tspan><tspan class="r"> till the end of the financial year</tspan><tspan class="k"> in which the emergency</tspan></text>
<text x="58" y="1270"><tspan class="k">ceases to operate.</tspan></text>
<text class="sh" x="40" y="1298"><tspan class="r" style="font-weight:700">B. Financial Emergency</tspan></text>
<text x="44" y="1326" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1326"><tspan class="k">While the proclamation of</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 360</tspan><tspan class="k">) is in operation, the</tspan></text>
<text x="58" y="1348"><tspan class="k">Centre can give directions to the states:</tspan></text>
<text x="70" y="1374" class="r" style="font-weight:700">(i)</text>
<text x="107" y="1374"><tspan class="k">to observe the specified</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1400" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1400"><tspan class="k">to</tspan><tspan class="b"> reduce the salaries and allowances</tspan><tspan class="k"> of all class of persons serving in the</tspan></text>
<text x="107" y="1422"><tspan class="k">state; and</tspan></text>
<text x="70" y="1448" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1448"><tspan class="k">to</tspan><tspan class="b"> reserve all money bills and other financial bills</tspan><tspan class="k"> for the consideration of the</tspan></text>
<text x="107" y="1470"><tspan class="k">President.</tspan></text>

<rect class="bx" x="40" y="1482" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="188" y="1502" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 352</tspan></text>
<text class="sm" x="188" y="1520" text-anchor="middle"><tspan class="k">reduce / cancel transfers</tspan></text>
<text class="sm" x="188" y="1538" text-anchor="middle"><tspan class="b">till end of financial year</tspan></text>
<rect class="bx" x="345" y="1482" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="1502" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 360</tspan></text>
<text class="sm" x="492" y="1520" text-anchor="middle"><tspan class="k">financial propriety · salary cut</tspan></text>

<text class="xs" x="50" y="1586"><tspan class="r" style="font-weight:700">18</tspan><tspan class="k"> In Re. Sea Customs Act (1963).</tspan></text>
<rect x="40" y="1564" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
