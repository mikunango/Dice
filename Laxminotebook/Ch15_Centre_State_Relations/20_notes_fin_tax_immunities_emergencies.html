<div id="vis-container"><h2 class="sr-only">Inter-Governmental Tax Immunities and Emergencies</h2>
<svg class="n" width="100%" viewBox="0 0 680 1573" role="img"><title>Inter-Governmental Tax Immunities and Emergencies</title><desc>Inter-Governmental Tax Immunities and Emergencies</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="109" y="26" width="463" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Inter-Governmental Tax Immunities and Emergencies</text>
<text class="lb" x="40" y="98">9. Inter-Governmental Tax Immunities</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Immunity from mutual taxation:</tspan><tspan class="k"> Like any other federal Constitution, the Indian</tspan></text>
<text x="56" y="150"><tspan class="k">Constitution also contain the rule of ‘</tspan><tspan class="r">immunity from mutual taxation</tspan><tspan class="k">’ and makes the</tspan></text>
<text x="56" y="172"><tspan class="k">following provisions in this regard:</tspan></text>
<text class="sh" x="40" y="200"><tspan class="r" style="font-weight:700">A. Exemption of Central Property from State Taxation</tspan></text>
<text x="44" y="230"><tspan class="h" style="font-weight:700">Central property exempt (Art. 285):</tspan><tspan class="k"> The</tspan><tspan class="r"> property of Centre</tspan><tspan class="k"> is</tspan><tspan class="r"> exempted from all taxes</tspan></text>
<text x="56" y="252"><tspan class="r">imposed by a state</tspan><tspan class="k"> or any authority within a state like</tspan><tspan class="b"> municipalities, district boards,</tspan></text>
<text x="56" y="274"><tspan class="b">panchayats</tspan><tspan class="k"> and so on. But, the</tspan><tspan class="r"> Parliament is empowered to remove this ban</tspan><tspan class="k">. The word</tspan></text>
<text x="56" y="296"><tspan class="k">‘</tspan><tspan class="r">property</tspan><tspan class="k">’ includes</tspan><tspan class="b"> lands, buildings, chattels, shares, debts, everything that has a money</tspan></text>
<text x="56" y="318"><tspan class="b">value</tspan><tspan class="k">, and every kind of property—</tspan><tspan class="b">movable or immovable and tangible or intangible</tspan><tspan class="k">.</tspan></text>
<text x="56" y="340"><tspan class="k">Further, the property may be used for</tspan><tspan class="b"> sovereign (like armed forces) or commercial</tspan></text>
<text x="56" y="362"><tspan class="b">purposes</tspan><tspan class="k">.</tspan></text>
<text x="44" y="390"><tspan class="h" style="font-weight:700">Central PSUs taxable:</tspan><tspan class="k"> The</tspan><tspan class="r"> corporations or the companies</tspan><tspan class="k"> created by the Central</tspan></text>
<text x="56" y="412"><tspan class="k">government are</tspan><tspan class="r"> not immune</tspan><tspan class="k"> from state taxation or local taxation. The reason is that a</tspan></text>
<text x="56" y="434"><tspan class="k">corporation or a company is a</tspan><tspan class="b"> separate legal entity</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="462"><tspan class="r" style="font-weight:700">B. Exemption of State Property or Income from Central Taxation</tspan></text>
<text x="44" y="492"><tspan class="h" style="font-weight:700">State property &amp; income exempt (Art. 289):</tspan><tspan class="k"> The</tspan><tspan class="r"> property and income of a state</tspan><tspan class="k"> is</tspan></text>
<text x="56" y="514"><tspan class="r">exempted from Central taxation</tspan><tspan class="k">. Such income may be derived from</tspan><tspan class="b"> sovereign functions or</tspan></text>
<text x="56" y="536"><tspan class="b">commercial functions</tspan><tspan class="k">. But the</tspan><tspan class="r"> Centre can tax the commercial operations</tspan><tspan class="k"> of a state if</tspan></text>
<text x="56" y="558"><tspan class="b">Parliament so provides</tspan><tspan class="k">. However, the Parliament can declare any particular trade or</tspan></text>
<text x="56" y="580"><tspan class="k">business as</tspan><tspan class="b"> incidental to the ordinary functions of the government</tspan><tspan class="k"> and it would then</tspan><tspan class="r"> not</tspan></text>
<text x="56" y="602"><tspan class="r">be taxable</tspan><tspan class="k">.</tspan></text>
<text x="44" y="630"><tspan class="h" style="font-weight:700">Local bodies &amp; state PSUs taxable:</tspan><tspan class="k"> Notably, the property and income of</tspan><tspan class="r"> local</tspan></text>
<text x="56" y="652"><tspan class="r">authorities</tspan><tspan class="k"> situated within a state are</tspan><tspan class="r"> not exempted</tspan><tspan class="k"> from the Central taxation. Similarly,</tspan></text>
<text x="56" y="674"><tspan class="k">the property or income of</tspan><tspan class="r"> corporations and companies owned by a state</tspan><tspan class="k"> can be taxed by</tspan></text>
<text x="56" y="696"><tspan class="k">the Centre.</tspan></text>
<text x="44" y="724"><tspan class="h" style="font-weight:700">Sea Customs case (1963):</tspan><tspan class="k"> The</tspan><tspan class="r"> Supreme Court</tspan><tspan class="k">, in an</tspan><tspan class="r"> advisory opinion¹⁸ (1963)</tspan><tspan class="k">, held</tspan></text>
<text x="56" y="746"><tspan class="k">that the immunity granted to a state in respect of Central taxation</tspan><tspan class="r"> does not extend to</tspan></text>
<text x="56" y="768"><tspan class="r">the duties of customs or duties of excise</tspan><tspan class="k">. In other words, the Centre can impose</tspan><tspan class="b"> customs</tspan></text>
<text x="56" y="790"><tspan class="b">duty on goods imported or exported by a state</tspan><tspan class="k">, or an</tspan><tspan class="b"> excise duty on goods produced or</tspan></text>
<text x="56" y="812"><tspan class="b">manufactured by a state</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="826" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="844" text-anchor="middle"><tspan class="r" style="font-weight:700">Central property</tspan></text>
<line class="ln" x1="190" y1="854" x2="190" y2="868" marker-end="url(#ah)"/>
<text class="sm" x="190" y="889" text-anchor="middle"><tspan class="k">✔ exempt from state taxes</tspan></text>
<text class="sm" x="190" y="911" text-anchor="middle"><tspan class="b">Parliament can remove ban</tspan></text>
<text class="sm" x="190" y="933" text-anchor="middle"><tspan class="k">✘ Central corporations / companies</tspan></text>
<rect class="bx" x="346" y="826" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="844" text-anchor="middle"><tspan class="r" style="font-weight:700">State property / income</tspan></text>
<line class="ln" x1="490" y1="854" x2="490" y2="868" marker-end="url(#ah)"/>
<text class="sm" x="490" y="889" text-anchor="middle"><tspan class="k">✔ exempt from Central taxes</tspan></text>
<text class="sm" x="490" y="911" text-anchor="middle"><tspan class="k">✘ commercial ops (if Parliament provides)</tspan></text>
<text class="sm" x="490" y="933" text-anchor="middle"><tspan class="k">✘ local authorities, state companies</tspan></text>
<text class="sm" x="490" y="955" text-anchor="middle"><tspan class="k">✘ customs &amp; excise (1963)</tspan></text>
<line x1="340" y1="826" x2="340" y2="958" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="996">10. Effects of Emergencies</text>
<text x="44" y="1026"><tspan class="h" style="font-weight:700">Fiscal effect of emergencies:</tspan><tspan class="k"> The Centre–state financial relations in normal times</tspan></text>
<text x="56" y="1048"><tspan class="k">(described above) undergo changes during</tspan><tspan class="r"> emergencies</tspan><tspan class="k">. These are as follows:</tspan></text>
<text class="sh" x="40" y="1076"><tspan class="r" style="font-weight:700">A. National Emergency</tspan></text>
<text x="44" y="1106"><tspan class="h" style="font-weight:700">National Emergency – revenue modified:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> national emergency</tspan></text>
<text x="56" y="1128"><tspan class="k">(under</tspan><tspan class="r"> Article 352</tspan><tspan class="k">) is in operation, the</tspan><tspan class="r"> President can modify the constitutional</tspan></text>
<text x="56" y="1150"><tspan class="r">distribution of revenues</tspan><tspan class="k"> between the Centre and the states. This means that the</tspan></text>
<text x="56" y="1172"><tspan class="k">President can either</tspan><tspan class="r"> reduce or cancel the transfer of finances</tspan><tspan class="k"> (</tspan><tspan class="b">both tax sharing and</tspan></text>
<text x="56" y="1194"><tspan class="b">grants-in-aid</tspan><tspan class="k">) from the Centre to the states. Such modification continues</tspan><tspan class="r"> till the end of</tspan></text>
<text x="56" y="1216"><tspan class="r">the financial year</tspan><tspan class="k"> in which the emergency ceases to operate.</tspan></text>
<text class="sh" x="40" y="1244"><tspan class="r" style="font-weight:700">B. Financial Emergency</tspan></text>
<text x="44" y="1274"><tspan class="h" style="font-weight:700">Financial Emergency – directions:</tspan><tspan class="k"> While the proclamation of</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan></text>
<text x="56" y="1296"><tspan class="r">Article 360</tspan><tspan class="k">) is in operation, the Centre can give directions to the states:</tspan></text>
<text x="70" y="1322" class="r" style="font-weight:700">(i)</text>
<text x="107" y="1322"><tspan class="h" style="font-weight:700">Financial propriety:</tspan><tspan class="k"> to observe the specified</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1348" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1348"><tspan class="h" style="font-weight:700">Salary cuts:</tspan><tspan class="k"> to</tspan><tspan class="b"> reduce the salaries and allowances</tspan><tspan class="k"> of all class of persons</tspan></text>
<text x="107" y="1370"><tspan class="k">serving in the state; and</tspan></text>
<text x="70" y="1396" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1396"><tspan class="h" style="font-weight:700">Reservation of money bills:</tspan><tspan class="k"> to</tspan><tspan class="b"> reserve all money bills and other financial bills</tspan></text>
<text x="107" y="1418"><tspan class="k">for the consideration of the President.</tspan></text>

<text class="sm" x="188" y="1468" text-anchor="middle"><tspan class="k">reduce / cancel transfers</tspan></text>
<text class="sm" x="188" y="1486" text-anchor="middle"><tspan class="b">till end of financial year</tspan></text>
<rect class="bx" x="345" y="1430" width="295" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="492" y="1450" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 360</tspan></text>
<text class="sm" x="492" y="1468" text-anchor="middle"><tspan class="k">financial propriety · salary cut</tspan></text>
