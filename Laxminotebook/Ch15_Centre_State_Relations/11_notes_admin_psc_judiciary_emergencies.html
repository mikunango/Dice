<div id="vis-container"><h2 class="sr-only">Administrative Relations – III</h2>

<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – III</text>
<text class="lb" x="40" y="98">7. Public Service Commissions</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">In the field of</tspan><tspan class="r"> public service commissions</tspan><tspan class="k">, the Centre–state relations are as follows:</tspan></text>
<text x="56" y="152" class="r" style="font-weight:700">(i)</text>
<text x="93" y="152"><tspan class="k">The</tspan><tspan class="r"> Chairman and members of a state public service commission</tspan><tspan class="k">, though</tspan></text>
<text x="93" y="174"><tspan class="b">appointed by the governor</tspan><tspan class="k"> of the state, can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="200" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="200"><tspan class="k">The Parliament can establish a</tspan><tspan class="r"> Joint State Public Service Commission (JSPSC)</tspan></text>
<text x="93" y="222"><tspan class="k">for two or more states on the</tspan><tspan class="b"> request of the state legislatures</tspan><tspan class="k"> concerned.</tspan></text>
<text x="93" y="246" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="246"><tspan class="k">The chairman and members of the JSPSC are</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="272" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="272"><tspan class="k">The</tspan><tspan class="r"> Union Public Service Commission (UPSC)</tspan><tspan class="k"> can serve the needs of a state on</tspan></text>
<text x="93" y="294"><tspan class="k">the</tspan><tspan class="b"> request of the state governor</tspan><tspan class="k"> and with the</tspan><tspan class="b"> approval of the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="320" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="320"><tspan class="k">The UPSC assists the states (</tspan><tspan class="b">when requested by two or more states</tspan><tspan class="k">) in framing</tspan></text>
<text x="93" y="342"><tspan class="k">and operating schemes of</tspan><tspan class="r"> joint recruitment</tspan><tspan class="k"> for any services for which candidates</tspan></text>
<text x="93" y="364"><tspan class="k">possessing special qualifications are required.</tspan></text>
<path d="M50 132 L44 132 L44 370 L50 370" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="378" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="396" text-anchor="middle"><tspan class="r" style="font-weight:700">SPSC</tspan></text>
<line class="ln" x1="140" y1="406" x2="140" y2="420" marker-end="url(#ah)"/>
<text class="sm" x="140" y="441" text-anchor="middle"><tspan class="k">appointed:</tspan><tspan class="r"> Governor</tspan></text>
<text class="sm" x="140" y="463" text-anchor="middle"><tspan class="k">removed:</tspan><tspan class="r"> President</tspan></text>
<rect class="bx" x="246" y="378" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="396" text-anchor="middle"><tspan class="r" style="font-weight:700">JSPSC</tspan></text>
<line class="ln" x1="340" y1="406" x2="340" y2="420" marker-end="url(#ah)"/>
<text class="sm" x="340" y="441" text-anchor="middle"><tspan class="k">created: Parliament</tspan></text>
<text class="sm" x="340" y="463" text-anchor="middle"><tspan class="k">appointed:</tspan><tspan class="r"> President</tspan></text>
<line x1="240" y1="378" x2="240" y2="466" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="378" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="396" text-anchor="middle"><tspan class="r" style="font-weight:700">UPSC</tspan></text>
<line class="ln" x1="540" y1="406" x2="540" y2="420" marker-end="url(#ah)"/>
<text class="sm" x="540" y="441" text-anchor="middle"><tspan class="k">serves a state</tspan></text>
<text class="sm" x="540" y="463" text-anchor="middle"><tspan class="b">Governor’s request +</tspan></text>
<text class="sm" x="540" y="482" text-anchor="middle"><tspan class="b">President’s approval</tspan></text>
<line x1="440" y1="378" x2="440" y2="485" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="523">8. Integrated Judicial System</text>
<text x="44" y="551" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="551"><tspan class="k">Though India has a</tspan><tspan class="r"> dual polity</tspan><tspan class="k">, there is</tspan><tspan class="r"> no dual system of administration of justice</tspan><tspan class="k">.</tspan></text>
<text x="44" y="577" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="577"><tspan class="k">The Constitution, on the other hand, established an</tspan><tspan class="r"> integrated judicial system</tspan><tspan class="k"> with the</tspan></text>
<text x="58" y="599"><tspan class="b">Supreme Court at the top</tspan><tspan class="k"> and the</tspan><tspan class="b"> state high courts below it</tspan><tspan class="k">.</tspan></text>
<text x="44" y="625" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="625"><tspan class="k">This</tspan><tspan class="r"> single system of courts</tspan><tspan class="k"> enforces both the Central laws as well as the state laws.</tspan></text>
<text x="44" y="651" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="651"><tspan class="k">This is done to</tspan><tspan class="b"> eliminate diversities in the remedial procedure</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="133" y="663" width="114" height="30" rx="3"/>
<text class="sm" x="190" y="682" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court</tspan></text>
<line class="ln" x1="250" y1="678" x2="270" y2="678" marker-end="url(#ah)"/>
<rect class="bx" x="273" y="663" width="98" height="30" rx="3"/>
<text class="sm" x="322" y="682" text-anchor="middle"><tspan class="r" style="font-weight:700">High Courts</tspan></text>
<line class="ln" x1="374" y1="678" x2="394" y2="678" marker-end="url(#ah)"/>
<rect class="bx" x="397" y="663" width="151" height="30" rx="3"/>
<text class="sm" x="472" y="682" text-anchor="middle"><tspan class="b">Central + state laws</tspan></text>
<text x="44" y="719" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="719"><tspan class="k">The judges of a state high court are</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k"> in consultation with</tspan></text>
<text x="58" y="741"><tspan class="k">the</tspan><tspan class="b"> Chief Justice of India</tspan><tspan class="k"> and the</tspan><tspan class="b"> governor of the state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="767" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="767"><tspan class="k">They can also be</tspan><tspan class="r"> transferred and removed by the President</tspan><tspan class="k">.</tspan></text>
<text x="44" y="793" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="793"><tspan class="k">The Parliament can establish a</tspan><tspan class="r"> common high court for two or more states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="819" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="819"><tspan class="k">For example,</tspan><tspan class="b"> Maharashtra and goa</tspan><tspan class="k"> or</tspan><tspan class="b"> Punjab and Haryana</tspan><tspan class="k"> have a common high court.</tspan></text>
<text class="lb" x="40" y="851">9. Relations During Emergencies</text>
<text x="56" y="879" class="r" style="font-weight:700">(i)</text>
<text x="93" y="879"><tspan class="k">During the operation of a</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 352</tspan><tspan class="k">), the Centre</tspan></text>
<text x="93" y="901"><tspan class="k">becomes entitled to give executive directions to a state on ‘</tspan><tspan class="r">any</tspan><tspan class="k">’ matter.</tspan></text>
<text x="93" y="925" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="107" y="925"><tspan class="k">Thus, the state governments are brought under the</tspan><tspan class="r"> complete control of the</tspan></text>
<text x="107" y="947"><tspan class="r">Centre</tspan><tspan class="k">, though they are</tspan><tspan class="b"> not suspended</tspan><tspan class="k">.</tspan></text>
<text x="56" y="973" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="973"><tspan class="k">When the</tspan><tspan class="r"> President’s Rule</tspan><tspan class="k"> is imposed in a state (under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">), the</tspan></text>
<text x="93" y="995"><tspan class="k">President can assume to himself/herself the</tspan><tspan class="b"> functions of the state government</tspan></text>
<text x="93" y="1017"><tspan class="k">and powers vested in the Governor or any other executive authority in the state.</tspan></text>
<text x="56" y="1043" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1043"><tspan class="k">During the operation of a</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 360</tspan><tspan class="k">), the Centre</tspan></text>
<text x="93" y="1065"><tspan class="k">can direct the states to observe</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k"> and can give other</tspan></text>
<text x="93" y="1087"><tspan class="k">necessary directions including the</tspan><tspan class="r"> reduction of salaries</tspan><tspan class="k"> of persons serving in the</tspan></text>
<text x="93" y="1109"><tspan class="k">state.</tspan></text>
