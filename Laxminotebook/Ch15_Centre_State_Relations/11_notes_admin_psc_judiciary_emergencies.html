<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – III</text>
<text class="lb" x="40" y="98">7. Public Service Commissions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">PSC relations:</tspan><tspan class="k"> In the field of</tspan><tspan class="r"> public service commissions</tspan><tspan class="k">, the Centre–state relations are</tspan></text>
<text x="56" y="150"><tspan class="k">as follows:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="k">The</tspan><tspan class="r"> Chairman and members of a state public service commission</tspan><tspan class="k">, though</tspan></text>
<text x="93" y="198"><tspan class="b">appointed by the governor</tspan><tspan class="k"> of the state, can be</tspan><tspan class="r"> removed only by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="224" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="224"><tspan class="k">The Parliament can establish a</tspan><tspan class="r"> Joint State Public Service Commission (JSPSC)</tspan></text>
<text x="93" y="246"><tspan class="k">for two or more states on the</tspan><tspan class="b"> request of the state legislatures</tspan><tspan class="k"> concerned. The</tspan></text>
<text x="93" y="268"><tspan class="k">chairman and members of the JSPSC are</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="294" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="294"><tspan class="k">The</tspan><tspan class="r"> Union Public Service Commission (UPSC)</tspan><tspan class="k"> can serve the needs of a state on</tspan></text>
<text x="93" y="316"><tspan class="k">the</tspan><tspan class="b"> request of the state governor</tspan><tspan class="k"> and with the</tspan><tspan class="b"> approval of the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="342" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="342"><tspan class="k">The UPSC assists the states (</tspan><tspan class="b">when requested by two or more states</tspan><tspan class="k">) in framing</tspan></text>
<text x="93" y="364"><tspan class="k">and operating schemes of</tspan><tspan class="r"> joint recruitment</tspan><tspan class="k"> for any services for which candidates</tspan></text>
<text x="93" y="386"><tspan class="k">possessing special qualifications are required.</tspan></text>
<path d="M50 156 L44 156 L44 392 L50 392" fill="none" stroke="#D93A3A" stroke-width="1.6"/>

<line class="ln" x1="140" y1="428" x2="140" y2="442" marker-end="url(#ah)"/>

<text class="sm" x="140" y="485" text-anchor="middle"><tspan class="k">removed:</tspan><tspan class="r"> President</tspan></text>
<rect class="bx" x="246" y="400" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="418" text-anchor="middle"><tspan class="r" style="font-weight:700">JSPSC</tspan></text>
<line class="ln" x1="340" y1="428" x2="340" y2="442" marker-end="url(#ah)"/>
<text class="sm" x="340" y="463" text-anchor="middle"><tspan class="k">created: Parliament</tspan></text>
<text class="sm" x="340" y="485" text-anchor="middle"><tspan class="k">appointed:</tspan><tspan class="r"> President</tspan></text>
<line x1="240" y1="400" x2="240" y2="488" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="400" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="418" text-anchor="middle"><tspan class="r" style="font-weight:700">UPSC</tspan></text>
<line class="ln" x1="540" y1="428" x2="540" y2="442" marker-end="url(#ah)"/>
<text class="sm" x="540" y="463" text-anchor="middle"><tspan class="k">serves a state</tspan></text>
<text class="sm" x="540" y="485" text-anchor="middle"><tspan class="b">Governor’s request +</tspan></text>
<text class="sm" x="540" y="504" text-anchor="middle"><tspan class="b">President’s approval</tspan></text>
<line x1="440" y1="400" x2="440" y2="507" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="545">8. Integrated Judicial System</text>
<text x="44" y="575"><tspan class="h" style="font-weight:700">Integrated judiciary:</tspan><tspan class="k"> Though India has a</tspan><tspan class="r"> dual polity</tspan><tspan class="k">, there is</tspan><tspan class="r"> no dual system of</tspan></text>
<text x="56" y="597"><tspan class="r">administration of justice</tspan><tspan class="k">. The Constitution, on the other hand, established an</tspan><tspan class="r"> integrated</tspan></text>
<text x="56" y="619"><tspan class="r">judicial system</tspan><tspan class="k"> with the</tspan><tspan class="b"> Supreme Court at the top</tspan><tspan class="k"> and the</tspan><tspan class="b"> state high courts below it</tspan><tspan class="k">.</tspan></text>
<text x="56" y="641"><tspan class="k">This</tspan><tspan class="r"> single system of courts</tspan><tspan class="k"> enforces both the Central laws as well as the state laws.</tspan></text>
<text x="56" y="663"><tspan class="k">This is done to</tspan><tspan class="b"> eliminate diversities in the remedial procedure</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="133" y="675" width="114" height="30" rx="3"/>
<text class="sm" x="190" y="694" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court</tspan></text>
<line class="ln" x1="250" y1="690" x2="270" y2="690" marker-end="url(#ah)"/>
<rect class="bx" x="273" y="675" width="98" height="30" rx="3"/>
<text class="sm" x="322" y="694" text-anchor="middle"><tspan class="r" style="font-weight:700">High Courts</tspan></text>
<line class="ln" x1="374" y1="690" x2="394" y2="690" marker-end="url(#ah)"/>
<rect class="bx" x="397" y="675" width="151" height="30" rx="3"/>
<text class="sm" x="472" y="694" text-anchor="middle"><tspan class="b">Central + state laws</tspan></text>
<text x="44" y="733"><tspan class="h" style="font-weight:700">HC judges:</tspan><tspan class="k"> The judges of a state high court are</tspan><tspan class="r"> appointed by the President</tspan><tspan class="k"> in</tspan></text>
<text x="56" y="755"><tspan class="k">consultation with the</tspan><tspan class="b"> Chief Justice of India</tspan><tspan class="k"> and the</tspan><tspan class="b"> governor of the state</tspan><tspan class="k">. They can also</tspan></text>
<text x="56" y="777"><tspan class="k">be</tspan><tspan class="r"> transferred and removed by the President</tspan><tspan class="k">.</tspan></text>
<text x="44" y="805"><tspan class="h" style="font-weight:700">Common high court:</tspan><tspan class="k"> The Parliament can establish a</tspan><tspan class="r"> common high court for two or more</tspan></text>
<text x="56" y="827"><tspan class="r">states</tspan><tspan class="k">. For example,</tspan><tspan class="b"> Maharashtra and goa</tspan><tspan class="k"> or</tspan><tspan class="b"> Punjab and Haryana</tspan><tspan class="k"> have a common high</tspan></text>
<text x="56" y="849"><tspan class="k">court.</tspan></text>
<text class="lb" x="40" y="881">9. Relations During Emergencies</text>
<text x="56" y="909" class="r" style="font-weight:700">(i)</text>
<text x="93" y="909"><tspan class="k">During the operation of a</tspan><tspan class="r"> national emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 352</tspan><tspan class="k">), the Centre</tspan></text>
<text x="93" y="931"><tspan class="k">becomes entitled to give executive directions to a state on ‘</tspan><tspan class="r">any</tspan><tspan class="k">’ matter. Thus,</tspan></text>
<text x="93" y="953"><tspan class="k">the state governments are brought under the</tspan><tspan class="r"> complete control of the Centre</tspan><tspan class="k">,</tspan></text>
<text x="93" y="975"><tspan class="k">though they are</tspan><tspan class="b"> not suspended</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1001" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1001"><tspan class="k">When the</tspan><tspan class="r"> President’s Rule</tspan><tspan class="k"> is imposed in a state (under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">), the</tspan></text>
<text x="93" y="1023"><tspan class="k">President can assume to himself/herself the</tspan><tspan class="b"> functions of the state government</tspan></text>
<text x="93" y="1045"><tspan class="k">and powers vested in the Governor or any other executive authority in the state.</tspan></text>
<text x="56" y="1071" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1071"><tspan class="k">During the operation of a</tspan><tspan class="r"> financial emergency</tspan><tspan class="k"> (under</tspan><tspan class="r"> Article 360</tspan><tspan class="k">), the Centre</tspan></text>
<text x="93" y="1093"><tspan class="k">can direct the states to observe</tspan><tspan class="b"> canons of financial propriety</tspan><tspan class="k"> and can give other</tspan></text>
<text x="93" y="1115"><tspan class="k">necessary directions including the</tspan><tspan class="r"> reduction of salaries</tspan><tspan class="k"> of persons serving in the</tspan></text>
<text x="93" y="1137"><tspan class="k">state.</tspan></text>

<text class="sm" x="340" y="1205" text-anchor="middle"><tspan class="b">state functions</tspan></text>
