<div id="vis-container"><h2 class="sr-only">Administrative Relations – III</h2>
<svg class="n" width="100%" viewBox="0 0 680 1335" role="img"><title>Administrative Relations – III</title><desc>Administrative Relations – III</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Administrative Relations – III</text>
<text class="lb" x="40" y="98">7. Public Service Commissions</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Public Service Commissions:</tspan><tspan class="k"> In the field of</tspan><tspan class="r"> public service commissions</tspan><tspan class="k">, the Centre–state</tspan></text>
<text x="56" y="150"><tspan class="k">relations are as follows:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(i)</text>
<text x="93" y="176"><tspan class="h" style="font-weight:700">SPSC – removal by President:</tspan><tspan class="k"> The</tspan><tspan class="r"> Chairman and members of a state public</tspan></text>
<text x="93" y="198"><tspan class="r">service commission</tspan><tspan class="k">, though</tspan><tspan class="b"> appointed by the governor</tspan><tspan class="k"> of the state, can be</tspan></text>
<text x="93" y="220"><tspan class="r">removed only by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="246" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="246"><tspan class="h" style="font-weight:700">JSPSC – created by Parliament:</tspan><tspan class="k"> The Parliament can establish a</tspan><tspan class="r"> Joint State</tspan></text>
<text x="93" y="268"><tspan class="r">Public Service Commission (JSPSC)</tspan><tspan class="k"> for two or more states on the</tspan><tspan class="b"> request of the</tspan></text>
<text x="93" y="290"><tspan class="b">state legislatures</tspan><tspan class="k"> concerned. The chairman and members of the JSPSC are</tspan></text>
<text x="93" y="312"><tspan class="r">appointed by the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="338" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="338"><tspan class="h" style="font-weight:700">UPSC serving states:</tspan><tspan class="k"> The</tspan><tspan class="r"> Union Public Service Commission (UPSC)</tspan><tspan class="k"> can serve the</tspan></text>
<text x="93" y="360"><tspan class="k">needs of a state on the</tspan><tspan class="b"> request of the state governor</tspan><tspan class="k"> and with the</tspan><tspan class="b"> approval of</tspan></text>
<text x="93" y="382"><tspan class="b">the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="408" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="408"><tspan class="h" style="font-weight:700">Joint recruitment:</tspan><tspan class="k"> The UPSC assists the states (</tspan><tspan class="b">when requested by two or more</tspan></text>
<text x="93" y="430"><tspan class="b">states</tspan><tspan class="k">) in framing and operating schemes of</tspan><tspan class="r"> joint recruitment</tspan><tspan class="k"> for any services</tspan></text>
<text x="93" y="452"><tspan class="k">for which candidates possessing special qualifications are required.</tspan></text>
<path d="M50 156 L44 156 L44 458 L50 458" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="466" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">SPSC</tspan></text>
<line class="ln" x1="140" y1="494" x2="140" y2="508" marker-end="url(#ah)"/>
<text class="sm" x="140" y="529" text-anchor="middle"><tspan class="k">appointed:</tspan><tspan class="r"> Governor</tspan></text>
<text class="sm" x="140" y="551" text-anchor="middle"><tspan class="k">removed:</tspan><tspan class="r"> President</tspan></text>
<rect class="bx" x="246" y="466" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">JSPSC</tspan></text>
<line class="ln" x1="340" y1="494" x2="340" y2="508" marker-end="url(#ah)"/>
<text class="sm" x="340" y="529" text-anchor="middle"><tspan class="k">created: Parliament</tspan></text>
<text class="sm" x="340" y="551" text-anchor="middle"><tspan class="k">appointed:</tspan><tspan class="r"> President</tspan></text>
<line x1="240" y1="466" x2="240" y2="554" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="466" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="484" text-anchor="middle"><tspan class="r" style="font-weight:700">UPSC</tspan></text>
<line class="ln" x1="540" y1="494" x2="540" y2="508" marker-end="url(#ah)"/>
<text class="sm" x="540" y="529" text-anchor="middle"><tspan class="k">serves a state</tspan></text>
<text class="sm" x="540" y="551" text-anchor="middle"><tspan class="b">Governor’s request +</tspan></text>
<text class="sm" x="540" y="570" text-anchor="middle"><tspan class="b">President’s approval</tspan></text>
<line x1="440" y1="466" x2="440" y2="573" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="611">8. Integrated Judicial System</text>
<text x="44" y="641"><tspan class="h" style="font-weight:700">Integrated judicial system:</tspan><tspan class="k"> Though India has a</tspan><tspan class="r"> dual polity</tspan><tspan class="k">, there is</tspan><tspan class="r"> no dual system of</tspan></text>
<text x="56" y="663"><tspan class="r">administration of justice</tspan><tspan class="k">. The Constitution, on the other hand, established an</tspan><tspan class="r"> integrated</tspan></text>
<text x="56" y="685"><tspan class="r">judicial system</tspan><tspan class="k"> with the</tspan><tspan class="b"> Supreme Court at the top</tspan><tspan class="k"> and the</tspan><tspan class="b"> state high courts below it</tspan><tspan class="k">.</tspan></text>
<text x="56" y="707"><tspan class="k">This</tspan><tspan class="r"> single system of courts</tspan><tspan class="k"> enforces both the Central laws as well as the state laws.</tspan></text>
<text x="56" y="729"><tspan class="k">This is done to</tspan><tspan class="b"> eliminate diversities in the remedial procedure</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="133" y="741" width="114" height="30" rx="3"/>
<text class="sm" x="190" y="760" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court</tspan></text>
<line class="ln" x1="250" y1="756" x2="270" y2="756" marker-end="url(#ah)"/>
<rect class="bx" x="273" y="741" width="98" height="30" rx="3"/>
<text class="sm" x="322" y="760" text-anchor="middle"><tspan class="r" style="font-weight:700">High Courts</tspan></text>
<line class="ln" x1="374" y1="756" x2="394" y2="756" marker-end="url(#ah)"/>
<rect class="bx" x="397" y="741" width="151" height="30" rx="3"/>
<text class="sm" x="472" y="760" text-anchor="middle"><tspan class="b">Central + state laws</tspan></text>
<text x="44" y="799"><tspan class="h" style="font-weight:700">Appointment of HC judges:</tspan><tspan class="k"> The judges of a state high court are</tspan><tspan class="r"> appointed by the</tspan></text>
<text x="56" y="821"><tspan class="r">President</tspan><tspan class="k"> in consultation with the</tspan><tspan class="b"> Chief Justice of India</tspan><tspan class="k"> and the</tspan><tspan class="b"> governor of the state</tspan><tspan class="k">.</tspan></text>
<text x="56" y="843"><tspan class="k">They can also be</tspan><tspan class="r"> transferred and removed by the President</tspan><tspan class="k">.</tspan></text>
<text x="44" y="871"><tspan class="h" style="font-weight:700">Common High Court:</tspan><tspan class="k"> The Parliament can establish a</tspan><tspan class="r"> common high court for two or more</tspan></text>
<text x="56" y="893"><tspan class="r">states</tspan><tspan class="k">. For example,</tspan><tspan class="b"> Maharashtra and goa</tspan><tspan class="k"> or</tspan><tspan class="b"> Punjab and Haryana</tspan><tspan class="k"> have a common high</tspan></text>
<text x="56" y="915"><tspan class="k">court.</tspan></text>
<text class="lb" x="40" y="947">9. Relations During Emergencies</text>
<text x="56" y="975" class="r" style="font-weight:700">(i)</text>
<text x="93" y="975"><tspan class="h" style="font-weight:700">National Emergency (Art. 352):</tspan><tspan class="k"> During the operation of a</tspan><tspan class="r"> national emergency</tspan></text>
<text x="93" y="997"><tspan class="k">(under</tspan><tspan class="r"> Article 352</tspan><tspan class="k">), the Centre becomes entitled to give executive directions to a</tspan></text>
<text x="93" y="1019"><tspan class="k">state on ‘</tspan><tspan class="r">any</tspan><tspan class="k">’ matter. Thus, the state governments are brought under the</tspan></text>
<text x="93" y="1041"><tspan class="r">complete control of the Centre</tspan><tspan class="k">, though they are</tspan><tspan class="b"> not suspended</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1067" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1067"><tspan class="h" style="font-weight:700">President’s Rule (Art. 356):</tspan><tspan class="k"> When the</tspan><tspan class="r"> President’s Rule</tspan><tspan class="k"> is imposed in a state</tspan></text>
<text x="93" y="1089"><tspan class="k">(under</tspan><tspan class="r"> Article 356</tspan><tspan class="k">), the President can assume to himself/herself the</tspan><tspan class="b"> functions of</tspan></text>
<text x="93" y="1111"><tspan class="b">the state government</tspan><tspan class="k"> and powers vested in the Governor or any other executive</tspan></text>
<text x="93" y="1133"><tspan class="k">authority in the state.</tspan></text>
<text x="56" y="1159" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1159"><tspan class="h" style="font-weight:700">Financial Emergency (Art. 360):</tspan><tspan class="k"> During the operation of a</tspan><tspan class="r"> financial emergency</tspan></text>
<text x="93" y="1181"><tspan class="k">(under</tspan><tspan class="r"> Article 360</tspan><tspan class="k">), the Centre can direct the states to observe</tspan><tspan class="b"> canons of</tspan></text>
<text x="93" y="1203"><tspan class="b">financial propriety</tspan><tspan class="k"> and can give other necessary directions including the</tspan><tspan class="r"> reduction</tspan></text>
<text x="93" y="1225"><tspan class="r">of salaries</tspan><tspan class="k"> of persons serving in the state.</tspan></text>

<text class="sm" x="137" y="1293" text-anchor="middle"><tspan class="b">state govt not suspended</tspan></text>
<rect class="bx" x="243" y="1237" width="193" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="340" y="1257" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 356</tspan></text>
<text class="sm" x="340" y="1275" text-anchor="middle"><tspan class="k">President assumes</tspan></text>
<text class="sm" x="340" y="1293" text-anchor="middle"><tspan class="b">state functions</tspan></text>

<text class="sm" x="543" y="1257" text-anchor="middle"><tspan class="r" style="font-weight:700">Art. 360</tspan></text>
<text class="sm" x="543" y="1275" text-anchor="middle"><tspan class="k">financial propriety</tspan></text>
<text class="sm" x="543" y="1293" text-anchor="middle"><tspan class="b">cut salaries</tspan></text>
