<div id="vis-container"><h2 class="sr-only">Scheme of Lists and Predominance</h2>
<svg class="n" width="100%" viewBox="0 0 680 1576" role="img"><title>Scheme of Lists and Predominance</title><desc>Scheme of Lists and Predominance</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Scheme of Lists and Predominance</text>
<text class="lb" x="40" y="98">1. Logic of the three lists</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">From the above scheme, it is clear that the matters of</tspan><tspan class="r"> national importance</tspan><tspan class="k"> and the</tspan></text>
<text x="58" y="148"><tspan class="k">matters which require</tspan><tspan class="b"> uniformity of legislation nationwide</tspan><tspan class="k"> are included in the</tspan><tspan class="r"> Union</tspan></text>
<text x="58" y="170"><tspan class="r">List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="196" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="196"><tspan class="k">The matters of</tspan><tspan class="r"> regional and local importance</tspan><tspan class="k"> and the matters which permit</tspan><tspan class="b"> diversity</tspan></text>
<text x="58" y="218"><tspan class="b">of interest</tspan><tspan class="k"> are specified in the</tspan><tspan class="r"> State List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="244" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="244"><tspan class="k">The matters on which uniformity of legislation throughout the country is</tspan><tspan class="b"> desirable but</tspan></text>
<text x="58" y="266"><tspan class="b">not essential</tspan><tspan class="k"> are enumerated in the</tspan><tspan class="r"> concurrent list</tspan><tspan class="k">.</tspan></text>
<text x="44" y="292" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="292"><tspan class="k">Thus, it permits</tspan><tspan class="r"> diversity along with uniformity</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="306" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="324" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="334" x2="140" y2="348" marker-end="url(#ah)"/>
<text class="sm" x="140" y="369" text-anchor="middle"><tspan class="k">national importance</tspan></text>
<text class="sm" x="140" y="391" text-anchor="middle"><tspan class="b">uniformity nationwide</tspan></text>
<rect class="bx" x="246" y="306" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="324" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="334" x2="340" y2="348" marker-end="url(#ah)"/>
<text class="sm" x="340" y="369" text-anchor="middle"><tspan class="k">regional &amp; local importance</tspan></text>
<text class="sm" x="340" y="391" text-anchor="middle"><tspan class="b">diversity of interest</tspan></text>
<line x1="240" y1="306" x2="240" y2="394" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="306" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="324" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="334" x2="540" y2="348" marker-end="url(#ah)"/>
<text class="sm" x="540" y="369" text-anchor="middle"><tspan class="k">uniformity desirable</tspan></text>
<text class="sm" x="540" y="391" text-anchor="middle"><tspan class="b">but not essential</tspan></text>
<line x1="440" y1="306" x2="440" y2="394" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="432">2. Other federations</text>
<text x="44" y="460" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="460"><tspan class="k">In</tspan><tspan class="r"> US</tspan><tspan class="k">, only the powers of the</tspan><tspan class="b"> Federal Government</tspan><tspan class="k"> are enumerated in the Constitution</tspan></text>
<text x="58" y="482"><tspan class="k">and the</tspan><tspan class="r"> residuary powers are left to the states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="508" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="508"><tspan class="k">The</tspan><tspan class="r"> Australian Constitution</tspan><tspan class="k"> followed the American pattern of</tspan><tspan class="b"> single enumeration</tspan><tspan class="k"> of</tspan></text>
<text x="58" y="530"><tspan class="k">powers.</tspan></text>
<text x="44" y="556" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="556"><tspan class="k">In</tspan><tspan class="r"> Canada</tspan><tspan class="k">, on the other hand, there is a</tspan><tspan class="b"> double enumeration</tspan><tspan class="k">—Federal and Provincial,</tspan></text>
<text x="58" y="578"><tspan class="k">and the</tspan><tspan class="r"> residuary powers are vested in the Centre</tspan><tspan class="k">.</tspan></text>
<text x="44" y="604" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="604"><tspan class="k">The</tspan><tspan class="r"> Government of India Act of 1935</tspan><tspan class="k"> provided for a</tspan><tspan class="r"> three-fold enumeration</tspan><tspan class="k">, viz.,</tspan></text>
<text x="58" y="626"><tspan class="b">federal, provincial and concurrent</tspan><tspan class="k">.</tspan></text>
<text x="44" y="652" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="652"><tspan class="k">The present Constitution follows the scheme of this act but with</tspan><tspan class="r"> one difference</tspan><tspan class="k">, that</tspan></text>
<text x="58" y="674"><tspan class="k">is, under this act, the residuary powers were given neither to the federal legislature nor</tspan></text>
<text x="58" y="696"><tspan class="k">to the provincial legislature but to the</tspan><tspan class="r"> Governor-General of India</tspan><tspan class="k">.</tspan></text>
<text x="44" y="722" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="722"><tspan class="k">In this respect, India follows the</tspan><tspan class="r"> Canadian precedent</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="125" y="752" text-anchor="middle"><tspan class="r" style="font-weight:700">Country / Act</tspan></text>
<text class="sm" x="330" y="752" text-anchor="middle"><tspan class="r" style="font-weight:700">Enumeration</tspan></text>
<text class="sm" x="545" y="752" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary powers</tspan></text>
<line class="gx" x1="40" y1="763" x2="640" y2="763"/>
<text class="sm" x="47" y="783"><tspan class="k">USA</tspan></text>
<text class="sm" x="217" y="783"><tspan class="k">single (federal only)</tspan></text>
<text class="sm" x="457" y="783"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="794" x2="640" y2="794"/>
<text class="sm" x="47" y="814"><tspan class="k">Australia</tspan></text>
<text class="sm" x="217" y="814"><tspan class="k">single (American pattern)</tspan></text>
<text class="sm" x="457" y="814"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="825" x2="640" y2="825"/>
<text class="sm" x="47" y="845"><tspan class="k">Canada</tspan></text>
<text class="sm" x="217" y="845"><tspan class="k">double (federal + provincial)</tspan></text>
<text class="sm" x="457" y="845"><tspan class="r">Centre</tspan></text>
<line class="gx" x1="40" y1="856" x2="640" y2="856"/>
<text class="sm" x="47" y="876"><tspan class="k">GoI Act 1935</tspan></text>
<text class="sm" x="217" y="876"><tspan class="k">three-fold</tspan></text>
<text class="sm" x="457" y="876"><tspan class="r">Governor-General</tspan></text>
<line class="gx" x1="40" y1="887" x2="640" y2="887"/>
<text class="sm" x="47" y="907"><tspan class="k">India</tspan></text>
<text class="sm" x="217" y="907"><tspan class="k">three-fold (7th Schedule)</tspan></text>
<text class="sm" x="457" y="907"><tspan class="r">Parliament (Centre)</tspan></text>
<line class="gx" x1="40" y1="918" x2="640" y2="918"/>
<rect class="gx" x="40" y="732" width="600" height="186"/>
<line class="gx" x1="210" y1="732" x2="210" y2="763"/>
<line class="gx" x1="210" y1="763" x2="210" y2="794"/>
<line class="gx" x1="210" y1="794" x2="210" y2="825"/>
<line class="gx" x1="210" y1="825" x2="210" y2="856"/>
<line class="gx" x1="210" y1="856" x2="210" y2="887"/>
<line class="gx" x1="210" y1="887" x2="210" y2="918"/>
<line class="gx" x1="450" y1="732" x2="450" y2="763"/>
<line class="gx" x1="450" y1="763" x2="450" y2="794"/>
<line class="gx" x1="450" y1="794" x2="450" y2="825"/>
<line class="gx" x1="450" y1="825" x2="450" y2="856"/>
<line class="gx" x1="450" y1="856" x2="450" y2="887"/>
<line class="gx" x1="450" y1="887" x2="450" y2="918"/>
<text class="lb" x="40" y="950">3. Predominance of lists</text>
<text x="44" y="978" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="978"><tspan class="k">The Constitution expressly secures the</tspan><tspan class="r"> predominance of the Union List</tspan><tspan class="k"> over the State</tspan></text>
<text x="58" y="1000"><tspan class="k">List and the Concurrent List and that of the</tspan><tspan class="r"> Concurrent List over the State List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1026" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1026"><tspan class="k">Thus, in case of overlapping between the Union List and the State List, the</tspan><tspan class="b"> former</tspan></text>
<text x="58" y="1048"><tspan class="b">should prevail</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1074" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1074"><tspan class="k">In case of overlapping between the Union List and the Concurrent List, it is again the</tspan></text>
<text x="58" y="1096"><tspan class="b">former which should prevail</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1122" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1122"><tspan class="k">Where there is a conflict between the Concurrent List and the State List, it is the</tspan></text>
<text x="58" y="1144"><tspan class="b">former that should prevail</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="166" y="1156" width="89" height="30" rx="3"/>
<text class="sm" x="211" y="1175" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="r" x="268" y="1176" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="281" y="1156" width="120" height="30" rx="3"/>
<text class="sm" x="341" y="1175" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="r" x="414" y="1176" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="427" y="1156" width="87" height="30" rx="3"/>
<text class="sm" x="470" y="1175" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text class="lb" x="40" y="1218">4. Conflict on a Concurrent subject</text>
<text x="44" y="1246" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1246"><tspan class="k">In case of a conflict between the</tspan><tspan class="r"> Central law</tspan><tspan class="k"> and the</tspan><tspan class="r"> state law</tspan><tspan class="k"> on a subject</tspan></text>
<text x="58" y="1268"><tspan class="k">enumerated in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">, the</tspan><tspan class="r"> central law prevails</tspan><tspan class="k"> over the state law.</tspan></text>
<text x="44" y="1294" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1294"><tspan class="k">But, there is an</tspan><tspan class="r"> exception</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1320" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1320"><tspan class="k">If the state law has been</tspan><tspan class="b"> reserved for the consideration of the President</tspan><tspan class="k"> and has</tspan></text>
<text x="58" y="1342"><tspan class="b">received his/her assent</tspan><tspan class="k">, then the</tspan><tspan class="r"> state law prevails in that state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1368" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1368"><tspan class="k">But, it would still be competent for the</tspan><tspan class="r"> Parliament to override</tspan><tspan class="k"> such a law by</tspan></text>
<text x="58" y="1390"><tspan class="k">subsequently making a law on the same matter.</tspan></text>
<rect class="bx" x="151" y="1402" width="209" height="30" rx="3"/>
<text class="sm" x="255" y="1421" text-anchor="middle"><tspan class="k">Conflict on Concurrent subject</tspan></text>
<line class="ln" x1="362" y1="1417" x2="382" y2="1417" marker-end="url(#ah)"/>
<rect class="bx" x="385" y="1402" width="144" height="30" rx="3"/>
<text class="sm" x="457" y="1421" text-anchor="middle"><tspan class="r">Central law prevails</tspan></text>
<rect class="bx" x="90" y="1444" width="260" height="48" rx="3"/>
<text class="sm" x="220" y="1463" text-anchor="middle"><tspan class="b">Exception</tspan><tspan class="k">: State law reserved +</tspan></text>
<text class="sm" x="220" y="1481" text-anchor="middle"><tspan class="k">President’s assent</tspan></text>
<line class="ln" x1="353" y1="1468" x2="373" y2="1468" marker-end="url(#ah)"/>
<rect class="bx" x="376" y="1444" width="215" height="48" rx="3"/>
<text class="sm" x="483" y="1472" text-anchor="middle"><tspan class="r">State law prevails in that state</tspan></text>
<line class="ln" x1="340" y1="1493" x2="340" y2="1514" marker-end="url(#ah)"/>
<rect class="bx" x="227" y="1516" width="226" height="30" rx="3"/>
<text class="sm" x="340" y="1535" text-anchor="middle"><tspan class="k">Parliament can still</tspan><tspan class="r"> override</tspan><tspan class="k"> later</tspan></text>
</svg>
