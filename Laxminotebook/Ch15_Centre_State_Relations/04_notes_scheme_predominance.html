<div id="vis-container"><h2 class="sr-only">Scheme of Lists and Predominance</h2>
<svg class="n" width="100%" viewBox="0 0 680 1634" role="img"><title>Scheme of Lists and Predominance</title><desc>Scheme of Lists and Predominance</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Scheme of Lists and Predominance</text>
<text class="lb" x="40" y="98">1. Logic of the three lists</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Union List logic:</tspan><tspan class="k"> From the above scheme, it is clear that the matters of</tspan><tspan class="r"> national</tspan></text>
<text x="56" y="150"><tspan class="r">importance</tspan><tspan class="k"> and the matters which require</tspan><tspan class="b"> uniformity of legislation nationwide</tspan><tspan class="k"> are</tspan></text>
<text x="56" y="172"><tspan class="k">included in the</tspan><tspan class="r"> Union List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="200"><tspan class="h" style="font-weight:700">State List logic:</tspan><tspan class="k"> The matters of</tspan><tspan class="r"> regional and local importance</tspan><tspan class="k"> and the matters which</tspan></text>
<text x="56" y="222"><tspan class="k">permit</tspan><tspan class="b"> diversity of interest</tspan><tspan class="k"> are specified in the</tspan><tspan class="r"> State List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="250"><tspan class="h" style="font-weight:700">Concurrent List logic:</tspan><tspan class="k"> The matters on which uniformity of legislation throughout the</tspan></text>
<text x="56" y="272"><tspan class="k">country is</tspan><tspan class="b"> desirable but not essential</tspan><tspan class="k"> are enumerated in the</tspan><tspan class="r"> concurrent list</tspan><tspan class="k">.</tspan></text>
<text x="44" y="300"><tspan class="h" style="font-weight:700">Diversity + uniformity:</tspan><tspan class="k"> Thus, it permits</tspan><tspan class="r"> diversity along with uniformity</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="314" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="332" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="342" x2="140" y2="356" marker-end="url(#ah)"/>
<text class="sm" x="140" y="377" text-anchor="middle"><tspan class="k">national importance</tspan></text>
<text class="sm" x="140" y="399" text-anchor="middle"><tspan class="b">uniformity nationwide</tspan></text>
<rect class="bx" x="246" y="314" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="332" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="342" x2="340" y2="356" marker-end="url(#ah)"/>
<text class="sm" x="340" y="377" text-anchor="middle"><tspan class="k">regional &amp; local importance</tspan></text>
<text class="sm" x="340" y="399" text-anchor="middle"><tspan class="b">diversity of interest</tspan></text>
<line x1="240" y1="314" x2="240" y2="402" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="314" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="332" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="342" x2="540" y2="356" marker-end="url(#ah)"/>
<text class="sm" x="540" y="377" text-anchor="middle"><tspan class="k">uniformity desirable</tspan></text>
<text class="sm" x="540" y="399" text-anchor="middle"><tspan class="b">but not essential</tspan></text>
<line x1="440" y1="314" x2="440" y2="402" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="lb" x="40" y="440">2. Other federations</text>
<text x="44" y="470"><tspan class="h" style="font-weight:700">US model:</tspan><tspan class="k"> In</tspan><tspan class="r"> US</tspan><tspan class="k">, only the powers of the</tspan><tspan class="b"> Federal Government</tspan><tspan class="k"> are enumerated in the</tspan></text>
<text x="56" y="492"><tspan class="k">Constitution and the</tspan><tspan class="r"> residuary powers are left to the states</tspan><tspan class="k">.</tspan></text>
<text x="44" y="520"><tspan class="h" style="font-weight:700">Australia:</tspan><tspan class="k"> The</tspan><tspan class="r"> Australian Constitution</tspan><tspan class="k"> followed the American pattern of</tspan><tspan class="b"> single</tspan></text>
<text x="56" y="542"><tspan class="b">enumeration</tspan><tspan class="k"> of powers.</tspan></text>
<text x="44" y="570"><tspan class="h" style="font-weight:700">Canada:</tspan><tspan class="k"> In</tspan><tspan class="r"> Canada</tspan><tspan class="k">, on the other hand, there is a</tspan><tspan class="b"> double enumeration</tspan><tspan class="k">—Federal and</tspan></text>
<text x="56" y="592"><tspan class="k">Provincial, and the</tspan><tspan class="r"> residuary powers are vested in the Centre</tspan><tspan class="k">.</tspan></text>
<text x="44" y="620"><tspan class="h" style="font-weight:700">GoI Act 1935:</tspan><tspan class="k"> The</tspan><tspan class="r"> Government of India Act of 1935</tspan><tspan class="k"> provided for a</tspan><tspan class="r"> three-fold</tspan></text>
<text x="56" y="642"><tspan class="r">enumeration</tspan><tspan class="k">, viz.,</tspan><tspan class="b"> federal, provincial and concurrent</tspan><tspan class="k">.</tspan></text>
<text x="44" y="670"><tspan class="h" style="font-weight:700">One difference:</tspan><tspan class="k"> The present Constitution follows the scheme of this act but with</tspan><tspan class="r"> one</tspan></text>
<text x="56" y="692"><tspan class="r">difference</tspan><tspan class="k">, that is, under this act, the residuary powers were given neither to the federal</tspan></text>
<text x="56" y="714"><tspan class="k">legislature nor to the provincial legislature but to the</tspan><tspan class="r"> Governor-General of India</tspan><tspan class="k">.</tspan></text>
<text x="44" y="742"><tspan class="h" style="font-weight:700">Canadian precedent:</tspan><tspan class="k"> In this respect, India follows the</tspan><tspan class="r"> Canadian precedent</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="125" y="772" text-anchor="middle"><tspan class="r" style="font-weight:700">Country / Act</tspan></text>
<text class="sm" x="330" y="772" text-anchor="middle"><tspan class="r" style="font-weight:700">Enumeration</tspan></text>
<text class="sm" x="545" y="772" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary powers</tspan></text>
<line class="gx" x1="40" y1="783" x2="640" y2="783"/>
<text class="sm" x="47" y="803"><tspan class="k">USA</tspan></text>
<text class="sm" x="217" y="803"><tspan class="k">single (federal only)</tspan></text>
<text class="sm" x="457" y="803"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="814" x2="640" y2="814"/>
<text class="sm" x="47" y="834"><tspan class="k">Australia</tspan></text>
<text class="sm" x="217" y="834"><tspan class="k">single (American pattern)</tspan></text>
<text class="sm" x="457" y="834"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="845" x2="640" y2="845"/>
<text class="sm" x="47" y="865"><tspan class="k">Canada</tspan></text>
<text class="sm" x="217" y="865"><tspan class="k">double (federal + provincial)</tspan></text>
<text class="sm" x="457" y="865"><tspan class="r">Centre</tspan></text>
<line class="gx" x1="40" y1="876" x2="640" y2="876"/>
<text class="sm" x="47" y="896"><tspan class="k">GoI Act 1935</tspan></text>
<text class="sm" x="217" y="896"><tspan class="k">three-fold</tspan></text>
<text class="sm" x="457" y="896"><tspan class="r">Governor-General</tspan></text>
<line class="gx" x1="40" y1="907" x2="640" y2="907"/>
<text class="sm" x="47" y="927"><tspan class="k">India</tspan></text>
<text class="sm" x="217" y="927"><tspan class="k">three-fold (7th Schedule)</tspan></text>
<text class="sm" x="457" y="927"><tspan class="r">Parliament (Centre)</tspan></text>
<line class="gx" x1="40" y1="938" x2="640" y2="938"/>
<rect class="gx" x="40" y="752" width="600" height="186"/>
<line class="gx" x1="210" y1="752" x2="210" y2="783"/>
<line class="gx" x1="210" y1="783" x2="210" y2="814"/>
<line class="gx" x1="210" y1="814" x2="210" y2="845"/>
<line class="gx" x1="210" y1="845" x2="210" y2="876"/>
<line class="gx" x1="210" y1="876" x2="210" y2="907"/>
<line class="gx" x1="210" y1="907" x2="210" y2="938"/>
<line class="gx" x1="450" y1="752" x2="450" y2="783"/>
<line class="gx" x1="450" y1="783" x2="450" y2="814"/>
<line class="gx" x1="450" y1="814" x2="450" y2="845"/>
<line class="gx" x1="450" y1="845" x2="450" y2="876"/>
<line class="gx" x1="450" y1="876" x2="450" y2="907"/>
<line class="gx" x1="450" y1="907" x2="450" y2="938"/>
<text class="lb" x="40" y="970">3. Predominance of lists</text>
<text x="44" y="1000"><tspan class="h" style="font-weight:700">Predominance:</tspan><tspan class="k"> The Constitution expressly secures the</tspan><tspan class="r"> predominance of the Union List</tspan></text>
<text x="56" y="1022"><tspan class="k">over the State List and the Concurrent List and that of the</tspan><tspan class="r"> Concurrent List over the</tspan></text>
<text x="56" y="1044"><tspan class="r">State List</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1072"><tspan class="h" style="font-weight:700">Union &gt; State:</tspan><tspan class="k"> Thus, in case of overlapping between the Union List and the State List,</tspan></text>
<text x="56" y="1094"><tspan class="k">the</tspan><tspan class="b"> former should prevail</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1122"><tspan class="h" style="font-weight:700">Union &gt; Concurrent:</tspan><tspan class="k"> In case of overlapping between the Union List and the Concurrent</tspan></text>
<text x="56" y="1144"><tspan class="k">List, it is again the</tspan><tspan class="b"> former which should prevail</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1172"><tspan class="h" style="font-weight:700">Concurrent &gt; State:</tspan><tspan class="k"> Where there is a conflict between the Concurrent List and the</tspan></text>
<text x="56" y="1194"><tspan class="k">State List, it is the</tspan><tspan class="b"> former that should prevail</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="166" y="1206" width="89" height="30" rx="3"/>
<text class="sm" x="211" y="1225" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="r" x="268" y="1226" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="281" y="1206" width="120" height="30" rx="3"/>
<text class="sm" x="341" y="1225" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="r" x="414" y="1226" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="427" y="1206" width="87" height="30" rx="3"/>
<text class="sm" x="470" y="1225" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text class="lb" x="40" y="1268">4. Conflict on a Concurrent subject</text>
<text x="44" y="1298"><tspan class="h" style="font-weight:700">Central law prevails:</tspan><tspan class="k"> In case of a conflict between the</tspan><tspan class="r"> Central law</tspan><tspan class="k"> and the</tspan><tspan class="r"> state law</tspan><tspan class="k"> on</tspan></text>
<text x="56" y="1320"><tspan class="k">a subject enumerated in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">, the</tspan><tspan class="r"> central law prevails</tspan><tspan class="k"> over the state law.</tspan></text>
<text x="44" y="1348"><tspan class="h" style="font-weight:700">Exception:</tspan><tspan class="k"> But, there is an</tspan><tspan class="r"> exception</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1376"><tspan class="h" style="font-weight:700">President’s assent:</tspan><tspan class="k"> If the state law has been</tspan><tspan class="b"> reserved for the consideration of the</tspan></text>
<text x="56" y="1398"><tspan class="b">President</tspan><tspan class="k"> and has</tspan><tspan class="b"> received his/her assent</tspan><tspan class="k">, then the</tspan><tspan class="r"> state law prevails in that state</tspan><tspan class="k">.</tspan></text>
<text x="44" y="1426"><tspan class="h" style="font-weight:700">Parliament can override:</tspan><tspan class="k"> But, it would still be competent for the</tspan><tspan class="r"> Parliament to override</tspan></text>
<text x="56" y="1448"><tspan class="k">such a law by subsequently making a law on the same matter.</tspan></text>
<rect class="bx" x="151" y="1460" width="209" height="30" rx="3"/>
<text class="sm" x="255" y="1479" text-anchor="middle"><tspan class="k">Conflict on Concurrent subject</tspan></text>
<line class="ln" x1="362" y1="1475" x2="382" y2="1475" marker-end="url(#ah)"/>
<rect class="bx" x="385" y="1460" width="144" height="30" rx="3"/>
<text class="sm" x="457" y="1479" text-anchor="middle"><tspan class="r">Central law prevails</tspan></text>
<rect class="bx" x="90" y="1502" width="260" height="48" rx="3"/>
<text class="sm" x="220" y="1521" text-anchor="middle"><tspan class="b">Exception</tspan><tspan class="k">: State law reserved +</tspan></text>
<text class="sm" x="220" y="1539" text-anchor="middle"><tspan class="k">President’s assent</tspan></text>
<line class="ln" x1="353" y1="1526" x2="373" y2="1526" marker-end="url(#ah)"/>
<rect class="bx" x="376" y="1502" width="215" height="48" rx="3"/>
<text class="sm" x="483" y="1530" text-anchor="middle"><tspan class="r">State law prevails in that state</tspan></text>
<line class="ln" x1="340" y1="1551" x2="340" y2="1572" marker-end="url(#ah)"/>
<rect class="bx" x="227" y="1574" width="226" height="30" rx="3"/>
<text class="sm" x="340" y="1593" text-anchor="middle"><tspan class="k">Parliament can still</tspan><tspan class="r"> override</tspan><tspan class="k"> later</tspan></text>
</svg>
