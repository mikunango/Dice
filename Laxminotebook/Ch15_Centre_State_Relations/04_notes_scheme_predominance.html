<div id="vis-container"><h2 class="sr-only">Scheme of Lists and Predominance</h2>
<svg class="n" width="100%" viewBox="0 0 680 1266" role="img"><title>Scheme of Lists and Predominance</title><desc>Scheme of Lists and Predominance</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Scheme of Lists and Predominance</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Rationale of three lists:</tspan><tspan class="k"> From the above scheme, it is clear that the matters of</tspan></text>
<text x="56" y="116"><tspan class="r">national importance</tspan><tspan class="k"> and the matters which require</tspan><tspan class="b"> uniformity of legislation nationwide</tspan></text>
<text x="56" y="138"><tspan class="k">are included in the</tspan><tspan class="r"> Union List</tspan><tspan class="k">. The matters of</tspan><tspan class="r"> regional and local importance</tspan><tspan class="k"> and the</tspan></text>
<text x="56" y="160"><tspan class="k">matters which permit</tspan><tspan class="b"> diversity of interest</tspan><tspan class="k"> are specified in the</tspan><tspan class="r"> State List</tspan><tspan class="k">. The matters on</tspan></text>
<text x="56" y="182"><tspan class="k">which uniformity of legislation throughout the country is</tspan><tspan class="b"> desirable but not essential</tspan><tspan class="k"> are</tspan></text>
<text x="56" y="204"><tspan class="k">enumerated in the</tspan><tspan class="r"> concurrent list</tspan><tspan class="k">. Thus, it permits</tspan><tspan class="r"> diversity along with uniformity</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="218" width="188" height="28" rx="3"/>
<text class="sm" x="140" y="236" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<line class="ln" x1="140" y1="246" x2="140" y2="260" marker-end="url(#ah)"/>
<text class="sm" x="140" y="281" text-anchor="middle"><tspan class="k">national importance</tspan></text>
<text class="sm" x="140" y="303" text-anchor="middle"><tspan class="b">uniformity nationwide</tspan></text>
<rect class="bx" x="246" y="218" width="188" height="28" rx="3"/>
<text class="sm" x="340" y="236" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<line class="ln" x1="340" y1="246" x2="340" y2="260" marker-end="url(#ah)"/>
<text class="sm" x="340" y="281" text-anchor="middle"><tspan class="k">regional &amp; local importance</tspan></text>
<text class="sm" x="340" y="303" text-anchor="middle"><tspan class="b">diversity of interest</tspan></text>
<line x1="240" y1="218" x2="240" y2="306" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect class="bx" x="446" y="218" width="188" height="28" rx="3"/>
<text class="sm" x="540" y="236" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<line class="ln" x1="540" y1="246" x2="540" y2="260" marker-end="url(#ah)"/>
<text class="sm" x="540" y="281" text-anchor="middle"><tspan class="k">uniformity desirable</tspan></text>
<text class="sm" x="540" y="303" text-anchor="middle"><tspan class="b">but not essential</tspan></text>
<line x1="440" y1="218" x2="440" y2="306" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="340"><tspan class="h" style="font-weight:700">Comparative federalism – US, Australia, Canada:</tspan><tspan class="k"> In</tspan><tspan class="r"> US</tspan><tspan class="k">, only the powers of the</tspan><tspan class="b"> Federal</tspan></text>
<text x="56" y="362"><tspan class="b">Government</tspan><tspan class="k"> are enumerated in the Constitution and the</tspan><tspan class="r"> residuary powers are left to the</tspan></text>
<text x="56" y="384"><tspan class="r">states</tspan><tspan class="k">. The</tspan><tspan class="r"> Australian Constitution</tspan><tspan class="k"> followed the American pattern of</tspan><tspan class="b"> single enumeration</tspan></text>
<text x="56" y="406"><tspan class="k">of powers. In</tspan><tspan class="r"> Canada</tspan><tspan class="k">, on the other hand, there is a</tspan><tspan class="b"> double enumeration</tspan><tspan class="k">—Federal and</tspan></text>
<text x="56" y="428"><tspan class="k">Provincial, and the</tspan><tspan class="r"> residuary powers are vested in the Centre</tspan><tspan class="k">.</tspan></text>
<text x="44" y="456"><tspan class="h" style="font-weight:700">GoI Act 1935 &amp; Canadian precedent:</tspan><tspan class="k"> The</tspan><tspan class="r"> Government of India Act of 1935</tspan><tspan class="k"> provided for</tspan></text>
<text x="56" y="478"><tspan class="k">a</tspan><tspan class="r"> three-fold enumeration</tspan><tspan class="k">, viz.,</tspan><tspan class="b"> federal, provincial and concurrent</tspan><tspan class="k">. The present Constitution</tspan></text>
<text x="56" y="500"><tspan class="k">follows the scheme of this act but with</tspan><tspan class="r"> one difference</tspan><tspan class="k">, that is, under this act, the</tspan></text>
<text x="56" y="522"><tspan class="k">residuary powers were given neither to the federal legislature nor to the provincial</tspan></text>
<text x="56" y="544"><tspan class="k">legislature but to the</tspan><tspan class="r"> Governor-General of India</tspan><tspan class="k">. In this respect, India follows the</tspan></text>
<text x="56" y="566"><tspan class="r">Canadian precedent</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="125" y="596" text-anchor="middle"><tspan class="r" style="font-weight:700">Country / Act</tspan></text>
<text class="sm" x="330" y="596" text-anchor="middle"><tspan class="r" style="font-weight:700">Enumeration</tspan></text>
<text class="sm" x="545" y="596" text-anchor="middle"><tspan class="r" style="font-weight:700">Residuary powers</tspan></text>
<line class="gx" x1="40" y1="607" x2="640" y2="607"/>
<text class="sm" x="47" y="627"><tspan class="k">USA</tspan></text>
<text class="sm" x="217" y="627"><tspan class="k">single (federal only)</tspan></text>
<text class="sm" x="457" y="627"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="638" x2="640" y2="638"/>
<text class="sm" x="47" y="658"><tspan class="k">Australia</tspan></text>
<text class="sm" x="217" y="658"><tspan class="k">single (American pattern)</tspan></text>
<text class="sm" x="457" y="658"><tspan class="r">states</tspan></text>
<line class="gx" x1="40" y1="669" x2="640" y2="669"/>
<text class="sm" x="47" y="689"><tspan class="k">Canada</tspan></text>
<text class="sm" x="217" y="689"><tspan class="k">double (federal + provincial)</tspan></text>
<text class="sm" x="457" y="689"><tspan class="r">Centre</tspan></text>
<line class="gx" x1="40" y1="700" x2="640" y2="700"/>
<text class="sm" x="47" y="720"><tspan class="k">GoI Act 1935</tspan></text>
<text class="sm" x="217" y="720"><tspan class="k">three-fold</tspan></text>
<text class="sm" x="457" y="720"><tspan class="r">Governor-General</tspan></text>
<line class="gx" x1="40" y1="731" x2="640" y2="731"/>
<text class="sm" x="47" y="751"><tspan class="k">India</tspan></text>
<text class="sm" x="217" y="751"><tspan class="k">three-fold (7th Schedule)</tspan></text>
<text class="sm" x="457" y="751"><tspan class="r">Parliament (Centre)</tspan></text>
<line class="gx" x1="40" y1="762" x2="640" y2="762"/>
<rect class="gx" x="40" y="576" width="600" height="186"/>
<line class="gx" x1="210" y1="576" x2="210" y2="607"/>
<line class="gx" x1="210" y1="607" x2="210" y2="638"/>
<line class="gx" x1="210" y1="638" x2="210" y2="669"/>
<line class="gx" x1="210" y1="669" x2="210" y2="700"/>
<line class="gx" x1="210" y1="700" x2="210" y2="731"/>
<line class="gx" x1="210" y1="731" x2="210" y2="762"/>
<line class="gx" x1="450" y1="576" x2="450" y2="607"/>
<line class="gx" x1="450" y1="607" x2="450" y2="638"/>
<line class="gx" x1="450" y1="638" x2="450" y2="669"/>
<line class="gx" x1="450" y1="669" x2="450" y2="700"/>
<line class="gx" x1="450" y1="700" x2="450" y2="731"/>
<line class="gx" x1="450" y1="731" x2="450" y2="762"/>
<text x="44" y="790"><tspan class="h" style="font-weight:700">Hierarchy of lists:</tspan><tspan class="k"> The Constitution expressly secures the</tspan><tspan class="r"> predominance of the Union</tspan></text>
<text x="56" y="812"><tspan class="r">List</tspan><tspan class="k"> over the State List and the Concurrent List and that of the</tspan><tspan class="r"> Concurrent List over</tspan></text>
<text x="56" y="834"><tspan class="r">the State List</tspan><tspan class="k">. Thus, in case of overlapping between the Union List and the State List,</tspan></text>
<text x="56" y="856"><tspan class="k">the</tspan><tspan class="b"> former should prevail</tspan><tspan class="k">. In case of overlapping between the Union List and the</tspan></text>
<text x="56" y="878"><tspan class="k">Concurrent List, it is again the</tspan><tspan class="b"> former which should prevail</tspan><tspan class="k">. Where there is a conflict</tspan></text>
<text x="56" y="900"><tspan class="k">between the Concurrent List and the State List, it is the</tspan><tspan class="b"> former that should prevail</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="166" y="912" width="89" height="30" rx="3"/>
<text class="sm" x="211" y="931" text-anchor="middle"><tspan class="r" style="font-weight:700">Union List</tspan></text>
<text class="r" x="268" y="932" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="281" y="912" width="120" height="30" rx="3"/>
<text class="sm" x="341" y="931" text-anchor="middle"><tspan class="r" style="font-weight:700">Concurrent List</tspan></text>
<text class="r" x="414" y="932" text-anchor="middle" style="font-weight:700">&gt;</text>
<rect class="bx" x="427" y="912" width="87" height="30" rx="3"/>
<text class="sm" x="470" y="931" text-anchor="middle"><tspan class="r" style="font-weight:700">State List</tspan></text>
<text x="44" y="970"><tspan class="h" style="font-weight:700">Doctrine of repugnancy (Art. 254):</tspan><tspan class="k"> In case of a conflict between the</tspan><tspan class="r"> Central law</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="992"><tspan class="k">the</tspan><tspan class="r"> state law</tspan><tspan class="k"> on a subject enumerated in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">, the</tspan><tspan class="r"> central law prevails</tspan></text>
<text x="56" y="1014"><tspan class="k">over the state law. But, there is an</tspan><tspan class="r"> exception</tspan><tspan class="k">. If the state law has been</tspan><tspan class="b"> reserved for the</tspan></text>
<text x="56" y="1036"><tspan class="b">consideration of the President</tspan><tspan class="k"> and has</tspan><tspan class="b"> received his/her assent</tspan><tspan class="k">, then the</tspan><tspan class="r"> state law</tspan></text>
<text x="56" y="1058"><tspan class="r">prevails in that state</tspan><tspan class="k">. But, it would still be competent for the</tspan><tspan class="r"> Parliament to override</tspan></text>
<text x="56" y="1080"><tspan class="k">such a law by subsequently making a law on the same matter.</tspan></text>
<rect class="bx" x="151" y="1092" width="209" height="30" rx="3"/>
<text class="sm" x="255" y="1111" text-anchor="middle"><tspan class="k">Conflict on Concurrent subject</tspan></text>
<line class="ln" x1="362" y1="1107" x2="382" y2="1107" marker-end="url(#ah)"/>
<rect class="bx" x="385" y="1092" width="144" height="30" rx="3"/>
<text class="sm" x="457" y="1111" text-anchor="middle"><tspan class="r">Central law prevails</tspan></text>
<rect class="bx" x="90" y="1134" width="260" height="48" rx="3"/>
<text class="sm" x="220" y="1153" text-anchor="middle"><tspan class="b">Exception</tspan><tspan class="k">: State law reserved +</tspan></text>
<text class="sm" x="220" y="1171" text-anchor="middle"><tspan class="k">President’s assent</tspan></text>
<line class="ln" x1="353" y1="1158" x2="373" y2="1158" marker-end="url(#ah)"/>
<rect class="bx" x="376" y="1134" width="215" height="48" rx="3"/>
<text class="sm" x="483" y="1162" text-anchor="middle"><tspan class="r">State law prevails in that state</tspan></text>
<line class="ln" x1="340" y1="1183" x2="340" y2="1204" marker-end="url(#ah)"/>
<rect class="bx" x="227" y="1206" width="226" height="30" rx="3"/>
<text class="sm" x="340" y="1225" text-anchor="middle"><tspan class="k">Parliament can still</tspan><tspan class="r"> override</tspan><tspan class="k"> later</tspan></text>
</svg>
