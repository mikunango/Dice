<div id="vis-container"><h2 class="sr-only">State Taxes and Non-tax Revenues</h2>
<svg class="n" width="100%" viewBox="0 0 680 1743" role="img"><title>State Taxes and Non-tax Revenues</title><desc>State Taxes and Non-tax Revenues</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="177" y="26" width="327" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">State Taxes and Non-tax Revenues</text>
<text class="sh" x="40" y="94"><tspan class="r" style="font-weight:700">F. Taxes Levied and Collected and Retained by the States:</tspan></text>
<text x="44" y="122" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="122"><tspan class="k">These are the taxes belonging to the</tspan><tspan class="r"> states exclusively</tspan><tspan class="k">.</tspan></text>
<text x="44" y="148" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="148"><tspan class="k">They are enumerated in the</tspan><tspan class="r"> state list</tspan><tspan class="k"> and are</tspan><tspan class="r"> 18 in number</tspan><tspan class="k">.</tspan></text>
<text x="44" y="174" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="174"><tspan class="k">These are¹⁴:</tspan></text>
<text x="56" y="200" class="r" style="font-weight:700">(i)</text>
<text x="106" y="200"><tspan class="k">land revenue;</tspan></text>
<text x="56" y="226" class="r" style="font-weight:700">(ii)</text>
<text x="106" y="226"><tspan class="k">taxes on agricultural income;</tspan></text>
<text x="56" y="252" class="r" style="font-weight:700">(iii)</text>
<text x="106" y="252"><tspan class="k">duties in respect of succession to agricultural land;</tspan></text>
<text x="56" y="278" class="r" style="font-weight:700">(iv)</text>
<text x="106" y="278"><tspan class="k">estate duty in respect of agricultural land;</tspan></text>
<text x="56" y="304" class="r" style="font-weight:700">(v)</text>
<text x="106" y="304"><tspan class="k">taxes on lands and buildings;</tspan></text>
<text x="56" y="330" class="r" style="font-weight:700">(vi)</text>
<text x="106" y="330"><tspan class="k">taxes on mineral rights;</tspan></text>
<text x="56" y="356" class="r" style="font-weight:700">(vii)</text>
<text x="106" y="356"><tspan class="k">Duties of excise on</tspan><tspan class="r"> alcoholic liquors for human consumption</tspan><tspan class="k">;</tspan><tspan class="r"> opium, Indian</tspan></text>
<text x="106" y="378"><tspan class="r">hemp and other narcotic drugs and narcotics</tspan><tspan class="k">, but</tspan><tspan class="b"> not including medicinal and</tspan></text>
<text x="106" y="400"><tspan class="b">toilet preparations containing alcohol or narcotics</tspan><tspan class="k">;</tspan></text>
<text x="56" y="426" class="r" style="font-weight:700">(viii)</text>
<text x="106" y="426"><tspan class="k">taxes on the consumption or sale or electricity;</tspan></text>
<text x="56" y="452" class="r" style="font-weight:700">(ix)</text>
<text x="106" y="452"><tspan class="k">taxes on the sale of</tspan><tspan class="r"> petroleum crude, high speed diesel, motor spirit (commonly</tspan></text>
<text x="106" y="474"><tspan class="r">known as petrol), natural gas, aviation turbine fuel and alcoholic liquor for</tspan></text>
<text x="106" y="496"><tspan class="r">human consumption</tspan><tspan class="k">, but</tspan><tspan class="b"> not including sale in the course of inter-state trade or</tspan></text>
<text x="106" y="518"><tspan class="b">commerce or sale in the course of international trade or commerce of such</tspan></text>
<text x="106" y="540"><tspan class="b">goods</tspan><tspan class="k">;</tspan></text>
<text x="56" y="566" class="r" style="font-weight:700">(x)</text>
<text x="106" y="566"><tspan class="k">taxes on goods and passengers carried by road or inland waterways;</tspan></text>
<text x="56" y="592" class="r" style="font-weight:700">(xi)</text>
<text x="106" y="592"><tspan class="k">taxes on vehicles;</tspan></text>
<text x="56" y="618" class="r" style="font-weight:700">(xii)</text>
<text x="106" y="618"><tspan class="k">taxes on animals and boats;</tspan></text>
<text x="56" y="644" class="r" style="font-weight:700">(xiii)</text>
<text x="106" y="644"><tspan class="k">tolls;</tspan></text>
<text x="56" y="670" class="r" style="font-weight:700">(xiv)</text>
<text x="106" y="670"><tspan class="k">taxes on professions, trades, callings and employments;</tspan></text>
<text x="56" y="696" class="r" style="font-weight:700">(xv)</text>
<text x="106" y="696"><tspan class="k">capitation taxes;</tspan></text>
<text x="56" y="722" class="r" style="font-weight:700">(xvi)</text>
<text x="106" y="722"><tspan class="k">taxes on</tspan><tspan class="r"> entertainments and amusements</tspan><tspan class="k"> to the extent levied and collected by</tspan></text>
<text x="106" y="744"><tspan class="k">a</tspan><tspan class="b"> Panchayat or a Municipality or a Regional Council or a District Council</tspan><tspan class="k">;</tspan></text>
<text x="56" y="770" class="r" style="font-weight:700">(xvii)</text>
<text x="106" y="770"><tspan class="k">stamp duty on documents (</tspan><tspan class="b">except those specified in the Union List</tspan><tspan class="k">); and</tspan></text>
<text x="56" y="796" class="r" style="font-weight:700">(xviii)</text>
<text x="106" y="796"><tspan class="k">fees on the matters enumerated in the State List (</tspan><tspan class="b">except court fees</tspan><tspan class="k">).</tspan></text>
<path d="M50 180 L44 180 L44 802 L50 802" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="147" y="808" width="100" height="30" rx="3"/>
<text class="sm" x="197" y="827" text-anchor="middle"><tspan class="k">levied:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<line class="ln" x1="250" y1="823" x2="270" y2="823" marker-end="url(#ah)"/>
<rect class="bx" x="273" y="808" width="119" height="30" rx="3"/>
<text class="sm" x="333" y="827" text-anchor="middle"><tspan class="k">collected:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<line class="ln" x1="395" y1="823" x2="415" y2="823" marker-end="url(#ah)"/>
<rect class="bx" x="418" y="808" width="115" height="30" rx="3"/>
<text class="sm" x="476" y="827" text-anchor="middle"><tspan class="k">retained:</tspan><tspan class="r" style="font-weight:700"> State</tspan></text>
<text class="lb" x="40" y="870">3. Distribution of Non-tax Revenues</text>
<text class="sh" x="40" y="900"><tspan class="r" style="font-weight:700">A. The Centre</tspan></text>
<text x="44" y="928" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="928"><tspan class="k">The receipts from the following form the major sources of</tspan><tspan class="r"> non-tax revenues of the</tspan></text>
<text x="58" y="950"><tspan class="r">Centre</tspan><tspan class="k">:</tspan></text>
<text x="70" y="976" class="r" style="font-weight:700">(i)</text>
<text x="113" y="976"><tspan class="b">posts and telegraphs</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1002" class="r" style="font-weight:700">(ii)</text>
<text x="113" y="1002"><tspan class="b">railways</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1028" class="r" style="font-weight:700">(iii)</text>
<text x="113" y="1028"><tspan class="b">banking</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1054" class="r" style="font-weight:700">(iv)</text>
<text x="113" y="1054"><tspan class="b">broadcasting</tspan></text>
<text x="70" y="1080" class="r" style="font-weight:700">(v)</text>
<text x="113" y="1080"><tspan class="b">coinage and currency</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1106" class="r" style="font-weight:700">(vi)</text>
<text x="113" y="1106"><tspan class="b">central public sector enterprises</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1132" class="r" style="font-weight:700">(vii)</text>
<text x="113" y="1132"><tspan class="b">escheat and lapse</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1158" class="r" style="font-weight:700">(viii)</text>
<text x="113" y="1158"><tspan class="k">others.</tspan></text>
<path d="M64 956 L58 956 L58 1164 L64 1164" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1186"><tspan class="r" style="font-weight:700">B. The States</tspan></text>
<text x="44" y="1214" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="1214"><tspan class="k">The receipts from the following form the major sources of</tspan><tspan class="r"> non-tax revenues of the</tspan></text>
<text x="58" y="1236"><tspan class="r">states</tspan><tspan class="k">:</tspan></text>
<text x="70" y="1262" class="r" style="font-weight:700">(i)</text>
<text x="107" y="1262"><tspan class="b">irrigation</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1288" class="r" style="font-weight:700">(ii)</text>
<text x="107" y="1288"><tspan class="b">forests</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1314" class="r" style="font-weight:700">(iii)</text>
<text x="107" y="1314"><tspan class="b">fisheries</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1340" class="r" style="font-weight:700">(iv)</text>
<text x="107" y="1340"><tspan class="b">state public sector enterprises</tspan><tspan class="k">;</tspan></text>
<text x="70" y="1366" class="r" style="font-weight:700">(v)</text>
<text x="107" y="1366"><tspan class="b">escheat and lapse</tspan><tspan class="k">; and</tspan></text>
<text x="70" y="1392" class="r" style="font-weight:700">(vi)</text>
<text x="107" y="1392"><tspan class="k">others.</tspan></text>
<path d="M64 1242 L58 1242 L58 1398 L64 1398" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="46" y="1406" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="1424" text-anchor="middle"><tspan class="r" style="font-weight:700">Centre – non-tax</tspan></text>
<line class="ln" x1="190" y1="1434" x2="190" y2="1448" marker-end="url(#ah)"/>
<text class="sm" x="190" y="1469" text-anchor="middle"><tspan class="k">posts &amp; telegraphs</tspan></text>
<text class="sm" x="190" y="1491" text-anchor="middle"><tspan class="k">railways</tspan></text>
<text class="sm" x="190" y="1513" text-anchor="middle"><tspan class="k">banking</tspan></text>
<text class="sm" x="190" y="1535" text-anchor="middle"><tspan class="k">broadcasting</tspan></text>
<text class="sm" x="190" y="1557" text-anchor="middle"><tspan class="k">coinage &amp; currency</tspan></text>
<text class="sm" x="190" y="1579" text-anchor="middle"><tspan class="k">central PSEs</tspan></text>
<text class="sm" x="190" y="1601" text-anchor="middle"><tspan class="r">escheat &amp; lapse</tspan></text>
<text class="sm" x="190" y="1623" text-anchor="middle"><tspan class="k">others</tspan></text>
<rect class="bx" x="346" y="1406" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="1424" text-anchor="middle"><tspan class="r" style="font-weight:700">States – non-tax</tspan></text>
<line class="ln" x1="490" y1="1434" x2="490" y2="1448" marker-end="url(#ah)"/>
<text class="sm" x="490" y="1469" text-anchor="middle"><tspan class="k">irrigation</tspan></text>
<text class="sm" x="490" y="1491" text-anchor="middle"><tspan class="k">forests</tspan></text>
<text class="sm" x="490" y="1513" text-anchor="middle"><tspan class="k">fisheries</tspan></text>
<text class="sm" x="490" y="1535" text-anchor="middle"><tspan class="k">state PSEs</tspan></text>
<text class="sm" x="490" y="1557" text-anchor="middle"><tspan class="r">escheat &amp; lapse</tspan></text>
<text class="sm" x="490" y="1579" text-anchor="middle"><tspan class="k">others</tspan></text>
<line x1="340" y1="1406" x2="340" y2="1626" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1668"><tspan class="r" style="font-weight:700">14</tspan><tspan class="k"> Entry 52 (taxes on the entry of goods into a local area for consumption, use or sale therein)</tspan></text>
<text class="xs" x="50" y="1686"><tspan class="k">and entry 55 (taxes on advertisements other than advertisements published in the newspapers and</tspan></text>
<text class="xs" x="50" y="1704"><tspan class="k">advertisements broadcast by radio or television) were omitted by the 101st Amendment Act of 2016.</tspan></text>
