<div id="vis-container"><h2 class="sr-only">Punchhi Commission – II (Governors)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1504" role="img"><title>Punchhi Commission – II (Governors)</title><desc>Punchhi Commission – II (Governors)</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="169" y="26" width="342" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – II (Governors)</text>
<text x="56" y="92" class="r" style="font-weight:700">8.</text>
<text x="78" y="92"><tspan class="h" style="font-weight:700">Criteria for Governor:</tspan><tspan class="k"> While</tspan><tspan class="r"> selecting Governors</tspan><tspan class="k">, the Central Government should</tspan></text>
<text x="78" y="114"><tspan class="k">adopt the following</tspan><tspan class="r"> strict guidelines</tspan><tspan class="k"> as recommended in the</tspan><tspan class="b"> Sarkaria Commission</tspan></text>
<text x="78" y="136"><tspan class="b">report</tspan><tspan class="k"> and follow its mandate in letter and spirit:</tspan></text>
<path d="M50 72 L44 72 L44 142 L50 142" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="86" y="162" class="r" style="font-weight:700">(i)</text>
<text x="123" y="162"><tspan class="h" style="font-weight:700">Eminence:</tspan><tspan class="k"> He/she should be</tspan><tspan class="r"> eminent in some walk of life</tspan></text>
<text x="86" y="188" class="r" style="font-weight:700">(ii)</text>
<text x="123" y="188"><tspan class="h" style="font-weight:700">Outsider:</tspan><tspan class="k"> He/she should be a</tspan><tspan class="r"> person from outside the state</tspan></text>
<text x="86" y="214" class="r" style="font-weight:700">(iii)</text>
<text x="123" y="214"><tspan class="h" style="font-weight:700">Detached figure:</tspan><tspan class="k"> He/she should be a</tspan><tspan class="r"> detached figure</tspan><tspan class="k"> and not too intimately</tspan></text>
<text x="123" y="236"><tspan class="k">connected with the local politics of the state</tspan></text>
<text x="86" y="262" class="r" style="font-weight:700">(iv)</text>
<text x="123" y="262"><tspan class="h" style="font-weight:700">Non-political:</tspan><tspan class="k"> He/she should be a person who has</tspan><tspan class="r"> not taken too great a part</tspan></text>
<text x="123" y="284"><tspan class="r">in politics</tspan><tspan class="k"> generally and particularly in the recent past</tspan></text>
<path d="M80 142 L74 142 L74 290 L80 290" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="316" text-anchor="middle"><tspan class="r">eminent</tspan></text>
<rect class="bx" x="192" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="316" text-anchor="middle"><tspan class="r">outsider</tspan></text>
<rect class="bx" x="345" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="316" text-anchor="middle"><tspan class="r">detached</tspan></text>
<rect class="bx" x="498" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="316" text-anchor="middle"><tspan class="r">not too political</tspan></text>
<text x="56" y="354" class="r" style="font-weight:700">9.</text>
<text x="83" y="354"><tspan class="h" style="font-weight:700">Fixed five-year tenure:</tspan><tspan class="r"> Governors should be given a fixed tenure of five years</tspan><tspan class="k"> and</tspan></text>
<text x="83" y="376"><tspan class="k">their removal should</tspan><tspan class="b"> not be at the sweet will</tspan><tspan class="k"> of the Government at the Centre.</tspan></text>
<text x="56" y="402" class="r" style="font-weight:700">10.</text>
<text x="83" y="402"><tspan class="h" style="font-weight:700">Impeachment of Governor:</tspan><tspan class="k"> The procedure laid down for</tspan><tspan class="r"> impeachment of President</tspan><tspan class="k">,</tspan></text>
<text x="83" y="424"><tspan class="b">mutatis mutandis</tspan><tspan class="k"> can be made applicable for</tspan><tspan class="r"> impeachment of Governors</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="450" class="r" style="font-weight:700">11.</text>
<text x="83" y="450"><tspan class="h" style="font-weight:700">Limited discretion (Art. 163):</tspan><tspan class="r"> Article 163</tspan><tspan class="k"> does</tspan><tspan class="r"> not give the Governor a general</tspan></text>
<text x="83" y="472"><tspan class="r">discretionary power</tspan><tspan class="k"> to act against or without the advice of his/her Council of</tspan></text>
<text x="83" y="494"><tspan class="k">Ministers. In fact, the area for the exercise of discretion is</tspan><tspan class="b"> limited</tspan><tspan class="k"> and even in this</tspan></text>
<text x="83" y="516"><tspan class="k">limited area, his/her choice of action should not be arbitrary or fanciful. It must be</tspan></text>
<text x="83" y="538"><tspan class="k">a choice</tspan><tspan class="b"> dictated by reason, activated by good faith and tempered by caution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="564" class="r" style="font-weight:700">12.</text>
<text x="83" y="564"><tspan class="h" style="font-weight:700">Six-month limit on assent:</tspan><tspan class="k"> In respect of bills passed by the Legislative Assembly</tspan></text>
<text x="83" y="586"><tspan class="k">of a state, the Governor should take the decision</tspan><tspan class="r"> within six months</tspan><tspan class="k"> whether to</tspan></text>
<text x="83" y="608"><tspan class="k">grant assent or to reserve it for consideration of the President.</tspan></text>
<text x="56" y="634" class="r" style="font-weight:700">13.</text>
<text x="83" y="634"><tspan class="h" style="font-weight:700">Hung assembly guidelines:</tspan><tspan class="k"> On the question of Governor’s role in</tspan><tspan class="r"> appointment of</tspan></text>
<text x="83" y="656"><tspan class="r">Chief Minister</tspan><tspan class="k"> in the case of an</tspan><tspan class="r"> hung assembly</tspan><tspan class="k">, it is necessary to lay down certain</tspan></text>
<text x="83" y="678"><tspan class="k">clear guidelines to be followed as</tspan><tspan class="b"> Constitutional conventions</tspan><tspan class="k">. These guidelines may</tspan></text>
<text x="83" y="700"><tspan class="k">be as follows:</tspan></text>
<path d="M50 334 L44 334 L44 706 L50 706" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="86" y="726" class="r" style="font-weight:700">(i)</text>
<text x="123" y="726"><tspan class="h" style="font-weight:700">Widest support:</tspan><tspan class="k"> The party or combination of parties which commands the</tspan></text>
<text x="123" y="748"><tspan class="r">widest support</tspan><tspan class="k"> in the Legislative Assembly should be called upon to form the</tspan></text>
<text x="123" y="770"><tspan class="k">Government.</tspan></text>
<text x="86" y="796" class="r" style="font-weight:700">(ii)</text>
<text x="123" y="796"><tspan class="h" style="font-weight:700">Pre-poll alliance as one party:</tspan><tspan class="k"> If there is a</tspan><tspan class="r"> pre-poll alliance or coalition</tspan><tspan class="k">, it</tspan></text>
<text x="123" y="818"><tspan class="k">should be treated as</tspan><tspan class="r"> one political party</tspan><tspan class="k"> and if such coalition obtains a</tspan></text>
<text x="123" y="840"><tspan class="k">majority, the leader of such coalition shall be called by the Governor to form</tspan></text>
<text x="123" y="862"><tspan class="k">the Government.</tspan></text>
<text x="86" y="888" class="r" style="font-weight:700">(iii)</text>
<text x="123" y="888"><tspan class="h" style="font-weight:700">Order of preference:</tspan><tspan class="k"> In case no party or pre-poll coalition has a clear</tspan></text>
<text x="123" y="910"><tspan class="k">majority, the Governor should select the Chief Minister in the</tspan><tspan class="r"> order of</tspan></text>
<text x="123" y="932"><tspan class="r">preference</tspan><tspan class="k"> indicated here.</tspan></text>
<path d="M80 706 L74 706 L74 938 L80 938" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="116" y="958" class="r" style="font-weight:700">(a)</text>
<text x="149" y="958"><tspan class="h" style="font-weight:700">Pre-poll alliance:</tspan><tspan class="k"> The group of parties which had</tspan><tspan class="r"> pre-poll alliance</tspan></text>
<text x="149" y="980"><tspan class="k">commanding the largest number</tspan></text>
<text x="116" y="1006" class="r" style="font-weight:700">(b)</text>
<text x="149" y="1006"><tspan class="h" style="font-weight:700">Largest single party:</tspan><tspan class="k"> The</tspan><tspan class="r"> largest single party</tspan><tspan class="k"> staking a claim to form</tspan></text>
<text x="149" y="1028"><tspan class="k">the government with the support of others</tspan></text>
<text x="116" y="1054" class="r" style="font-weight:700">(c)</text>
<text x="149" y="1054"><tspan class="h" style="font-weight:700">Post-poll coalition:</tspan><tspan class="k"> A</tspan><tspan class="r"> post-electoral coalition</tspan><tspan class="k"> with all partners joining</tspan></text>
<text x="149" y="1076"><tspan class="k">the government</tspan></text>
<text x="116" y="1102" class="r" style="font-weight:700">(d)</text>
<text x="149" y="1102"><tspan class="h" style="font-weight:700">Post-poll alliance with outside support:</tspan><tspan class="k"> A</tspan><tspan class="r"> post-electoral alliance</tspan><tspan class="k"> with</tspan></text>
<text x="149" y="1124"><tspan class="k">some parties joining the government and the remaining including</tspan></text>
<text x="149" y="1146"><tspan class="k">independents supporting the government from outside</tspan></text>
<path d="M110 938 L104 938 L104 1152 L110 1152" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="48" y="1158" width="147" height="30" rx="3"/>
<text class="sm" x="121" y="1177" text-anchor="middle"><tspan class="k">(a) pre-poll alliance</tspan></text>
<line class="ln" x1="198" y1="1173" x2="218" y2="1173" marker-end="url(#ah)"/>
<rect class="bx" x="221" y="1158" width="168" height="30" rx="3"/>
<text class="sm" x="305" y="1177" text-anchor="middle"><tspan class="k">(b) largest single party</tspan></text>
<line class="ln" x1="392" y1="1173" x2="412" y2="1173" marker-end="url(#ah)"/>
<rect class="bx" x="415" y="1158" width="218" height="30" rx="3"/>
<text class="sm" x="523" y="1177" text-anchor="middle"><tspan class="k">(c) post-poll coalition (all join)</tspan></text>
<line class="ln" x1="340" y1="1189" x2="340" y2="1210" marker-end="url(#ah)"/>
<rect class="bx" x="215" y="1212" width="250" height="30" rx="3"/>
<text class="sm" x="340" y="1231" text-anchor="middle"><tspan class="k">(d) post-poll alliance (some outside)</tspan></text>
<text x="56" y="1268" class="r" style="font-weight:700">14.</text>
<text x="82" y="1268"><tspan class="h" style="font-weight:700">Floor test:</tspan><tspan class="k"> On the question of</tspan><tspan class="r"> dismissal of a Chief Minister</tspan><tspan class="k">, the Governor should</tspan></text>
<text x="82" y="1290"><tspan class="k">invariably insist on the Chief Minister</tspan><tspan class="r"> proving his/her majority on the floor of the</tspan></text>
<text x="82" y="1312"><tspan class="r">House</tspan><tspan class="k"> for which he/she should prescribe a</tspan><tspan class="b"> time limit</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1338" class="r" style="font-weight:700">15.</text>
<text x="82" y="1338"><tspan class="h" style="font-weight:700">Sanction for prosecution:</tspan><tspan class="k"> The Governor should have the right to</tspan><tspan class="r"> sanction for</tspan></text>
<text x="82" y="1360"><tspan class="r">prosecution of a state minister</tspan><tspan class="k"> against the advice of the Council of Ministers, if</tspan></text>
<text x="82" y="1382"><tspan class="k">the Cabinet decision appears to the Governor to be</tspan><tspan class="b"> motivated by bias</tspan><tspan class="k"> in the face</tspan></text>
<text x="82" y="1404"><tspan class="k">of overwhelming material.</tspan></text>
<text x="56" y="1430" class="r" style="font-weight:700">16.</text>
<text x="82" y="1430"><tspan class="h" style="font-weight:700">No Chancellor role:</tspan><tspan class="k"> The convention of</tspan><tspan class="r"> Governors acting as Chancellors of</tspan></text>
<text x="82" y="1452"><tspan class="r">Universities</tspan><tspan class="k"> and holding other statutory positions should be</tspan><tspan class="r"> done away with</tspan><tspan class="k">.</tspan></text>
<text x="82" y="1474"><tspan class="k">His/her role should be confined to the</tspan><tspan class="b"> Constitutional provisions only</tspan><tspan class="k">.</tspan></text>
<path d="M50 1248 L44 1248 L44 1480 L50 1480" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
</svg>
</div></body></html>
