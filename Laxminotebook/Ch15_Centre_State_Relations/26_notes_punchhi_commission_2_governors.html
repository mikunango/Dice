<div id="vis-container"><h2 class="sr-only">Punchhi Commission – II (Governors)</h2>
<svg class="n" width="100%" viewBox="0 0 680 1424" role="img"><title>Punchhi Commission – II (Governors)</title><desc>Punchhi Commission – II (Governors)</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="169" y="26" width="342" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – II (Governors)</text>
<text x="56" y="92" class="r" style="font-weight:700">8.</text>
<text x="78" y="92"><tspan class="k">While</tspan><tspan class="r"> selecting Governors</tspan><tspan class="k">, the Central Government should adopt the following</tspan><tspan class="r"> strict</tspan></text>
<text x="78" y="114"><tspan class="r">guidelines</tspan><tspan class="k"> as recommended in the</tspan><tspan class="b"> Sarkaria Commission report</tspan><tspan class="k"> and follow its</tspan></text>
<text x="78" y="136"><tspan class="k">mandate in letter and spirit:</tspan></text>
<path d="M50 72 L44 72 L44 142 L50 142" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="86" y="162" class="r" style="font-weight:700">(i)</text>
<text x="123" y="162"><tspan class="k">He/she should be</tspan><tspan class="r"> eminent in some walk of life</tspan></text>
<text x="86" y="188" class="r" style="font-weight:700">(ii)</text>
<text x="123" y="188"><tspan class="k">He/she should be a</tspan><tspan class="r"> person from outside the state</tspan></text>
<text x="86" y="214" class="r" style="font-weight:700">(iii)</text>
<text x="123" y="214"><tspan class="k">He/she should be a</tspan><tspan class="r"> detached figure</tspan><tspan class="k"> and not too intimately connected with</tspan></text>
<text x="123" y="236"><tspan class="k">the local politics of the state</tspan></text>
<text x="86" y="262" class="r" style="font-weight:700">(iv)</text>
<text x="123" y="262"><tspan class="k">He/she should be a person who has</tspan><tspan class="r"> not taken too great a part in politics</tspan></text>
<text x="123" y="284"><tspan class="k">generally and particularly in the recent past</tspan></text>
<path d="M80 142 L74 142 L74 290 L80 290" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="111" y="316" text-anchor="middle"><tspan class="r">eminent</tspan></text>
<rect class="bx" x="192" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="264" y="316" text-anchor="middle"><tspan class="r">outsider</tspan></text>
<rect class="bx" x="345" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="416" y="316" text-anchor="middle"><tspan class="r">detached</tspan></text>
<rect class="bx" x="498" y="296" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="sm" x="569" y="316" text-anchor="middle"><tspan class="r">not too political</tspan></text>
<text x="56" y="354" class="r" style="font-weight:700">9.</text>
<text x="83" y="354"><tspan class="r">Governors should be given a fixed tenure of five years</tspan><tspan class="k"> and their removal should</tspan><tspan class="b"> not</tspan></text>
<text x="83" y="376"><tspan class="b">be at the sweet will</tspan><tspan class="k"> of the Government at the Centre.</tspan></text>
<text x="56" y="402" class="r" style="font-weight:700">10.</text>
<text x="83" y="402"><tspan class="k">The procedure laid down for</tspan><tspan class="r"> impeachment of President</tspan><tspan class="k">,</tspan><tspan class="b"> mutatis mutandis</tspan><tspan class="k"> can be</tspan></text>
<text x="83" y="424"><tspan class="k">made applicable for</tspan><tspan class="r"> impeachment of Governors</tspan><tspan class="k"> as well.</tspan></text>
<text x="56" y="450" class="r" style="font-weight:700">11.</text>
<text x="83" y="450"><tspan class="r">Article 163</tspan><tspan class="k"> does</tspan><tspan class="r"> not give the Governor a general discretionary power</tspan><tspan class="k"> to act against</tspan></text>
<text x="83" y="472"><tspan class="k">or without the advice of his/her Council of Ministers.</tspan></text>
<text x="83" y="496" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="496"><tspan class="k">In fact, the area for the exercise of discretion is</tspan><tspan class="b"> limited</tspan><tspan class="k"> and even in this limited</tspan></text>
<text x="97" y="518"><tspan class="k">area, his/her choice of action should not be arbitrary or fanciful.</tspan></text>
<text x="83" y="542" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="542"><tspan class="k">It must be a choice</tspan><tspan class="b"> dictated by reason, activated by good faith and tempered by</tspan></text>
<text x="97" y="564"><tspan class="b">caution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="590" class="r" style="font-weight:700">12.</text>
<text x="83" y="590"><tspan class="k">In respect of bills passed by the Legislative Assembly of a state, the Governor</tspan></text>
<text x="83" y="612"><tspan class="k">should take the decision</tspan><tspan class="r"> within six months</tspan><tspan class="k"> whether to grant assent or to reserve it</tspan></text>
<text x="83" y="634"><tspan class="k">for consideration of the President.</tspan></text>
<text x="56" y="660" class="r" style="font-weight:700">13.</text>
<text x="83" y="660"><tspan class="k">On the question of Governor’s role in</tspan><tspan class="r"> appointment of Chief Minister</tspan><tspan class="k"> in the case of</tspan></text>
<text x="83" y="682"><tspan class="k">an</tspan><tspan class="r"> hung assembly</tspan><tspan class="k">, it is necessary to lay down certain clear guidelines to be</tspan></text>
<text x="83" y="704"><tspan class="k">followed as</tspan><tspan class="b"> Constitutional conventions</tspan><tspan class="k">.</tspan></text>
<text x="83" y="728" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="97" y="728"><tspan class="k">These guidelines may be as follows:</tspan></text>
<path d="M50 334 L44 334 L44 734 L50 734" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="86" y="754" class="r" style="font-weight:700">(i)</text>
<text x="123" y="754"><tspan class="k">The party or combination of parties which commands the</tspan><tspan class="r"> widest support</tspan><tspan class="k"> in</tspan></text>
<text x="123" y="776"><tspan class="k">the Legislative Assembly should be called upon to form the Government.</tspan></text>
<text x="86" y="802" class="r" style="font-weight:700">(ii)</text>
<text x="123" y="802"><tspan class="k">If there is a</tspan><tspan class="r"> pre-poll alliance or coalition</tspan><tspan class="k">, it should be treated as</tspan><tspan class="r"> one political</tspan></text>
<text x="123" y="824"><tspan class="r">party</tspan><tspan class="k"> and if such coalition obtains a majority, the leader of such coalition</tspan></text>
<text x="123" y="846"><tspan class="k">shall be called by the Governor to form the Government.</tspan></text>
<text x="86" y="872" class="r" style="font-weight:700">(iii)</text>
<text x="123" y="872"><tspan class="k">In case no party or pre-poll coalition has a clear majority, the Governor</tspan></text>
<text x="123" y="894"><tspan class="k">should select the Chief Minister in the</tspan><tspan class="r"> order of preference</tspan><tspan class="k"> indicated here.</tspan></text>
<path d="M80 734 L74 734 L74 900 L80 900" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="116" y="920" class="r" style="font-weight:700">(a)</text>
<text x="149" y="920"><tspan class="k">The group of parties which had</tspan><tspan class="r"> pre-poll alliance</tspan><tspan class="k"> commanding the largest</tspan></text>
<text x="149" y="942"><tspan class="k">number</tspan></text>
<text x="116" y="968" class="r" style="font-weight:700">(b)</text>
<text x="149" y="968"><tspan class="k">The</tspan><tspan class="r"> largest single party</tspan><tspan class="k"> staking a claim to form the government with the</tspan></text>
<text x="149" y="990"><tspan class="k">support of others</tspan></text>
<text x="116" y="1016" class="r" style="font-weight:700">(c)</text>
<text x="149" y="1016"><tspan class="k">A</tspan><tspan class="r"> post-electoral coalition</tspan><tspan class="k"> with all partners joining the government</tspan></text>
<text x="116" y="1042" class="r" style="font-weight:700">(d)</text>
<text x="149" y="1042"><tspan class="k">A</tspan><tspan class="r"> post-electoral alliance</tspan><tspan class="k"> with some parties joining the government and</tspan></text>
<text x="149" y="1064"><tspan class="k">the remaining including independents supporting the government from</tspan></text>
<text x="149" y="1086"><tspan class="k">outside</tspan></text>
<path d="M110 900 L104 900 L104 1092 L110 1092" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="48" y="1098" width="147" height="30" rx="3"/>
<text class="sm" x="121" y="1117" text-anchor="middle"><tspan class="k">(a) pre-poll alliance</tspan></text>
<line class="ln" x1="198" y1="1113" x2="218" y2="1113" marker-end="url(#ah)"/>
<rect class="bx" x="221" y="1098" width="168" height="30" rx="3"/>
<text class="sm" x="305" y="1117" text-anchor="middle"><tspan class="k">(b) largest single party</tspan></text>
<line class="ln" x1="392" y1="1113" x2="412" y2="1113" marker-end="url(#ah)"/>
<rect class="bx" x="415" y="1098" width="218" height="30" rx="3"/>
<text class="sm" x="523" y="1117" text-anchor="middle"><tspan class="k">(c) post-poll coalition (all join)</tspan></text>
<line class="ln" x1="340" y1="1129" x2="340" y2="1150" marker-end="url(#ah)"/>
<rect class="bx" x="215" y="1152" width="250" height="30" rx="3"/>
<text class="sm" x="340" y="1171" text-anchor="middle"><tspan class="k">(d) post-poll alliance (some outside)</tspan></text>
<text x="56" y="1208" class="r" style="font-weight:700">14.</text>
<text x="82" y="1208"><tspan class="k">On the question of</tspan><tspan class="r"> dismissal of a Chief Minister</tspan><tspan class="k">, the Governor should invariably</tspan></text>
<text x="82" y="1230"><tspan class="k">insist on the Chief Minister</tspan><tspan class="r"> proving his/her majority on the floor of the House</tspan><tspan class="k"> for</tspan></text>
<text x="82" y="1252"><tspan class="k">which he/she should prescribe a</tspan><tspan class="b"> time limit</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1278" class="r" style="font-weight:700">15.</text>
<text x="82" y="1278"><tspan class="k">The Governor should have the right to</tspan><tspan class="r"> sanction for prosecution of a state minister</tspan></text>
<text x="82" y="1300"><tspan class="k">against the advice of the Council of Ministers, if the Cabinet decision appears to</tspan></text>
<text x="82" y="1322"><tspan class="k">the Governor to be</tspan><tspan class="b"> motivated by bias</tspan><tspan class="k"> in the face of overwhelming material.</tspan></text>
<text x="56" y="1348" class="r" style="font-weight:700">16.</text>
<text x="82" y="1348"><tspan class="k">The convention of</tspan><tspan class="r"> Governors acting as Chancellors of Universities</tspan><tspan class="k"> and holding other</tspan></text>
<text x="82" y="1370"><tspan class="k">statutory positions should be</tspan><tspan class="r"> done away with</tspan><tspan class="k">.</tspan></text>
<text x="82" y="1394" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="96" y="1394"><tspan class="k">His/her role should be confined to the</tspan><tspan class="b"> Constitutional provisions only</tspan><tspan class="k">.</tspan></text>
<path d="M50 1188 L44 1188 L44 1400 L50 1400" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
</svg>
