<div id="vis-container"><h2 class="sr-only">Punchhi Commission – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1479" role="img"><title>Punchhi Commission – I</title><desc>Punchhi Commission – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>

<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – I</text>
<text class="lb" x="40" y="98">Punchhi Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Punchhi Commission (2007):</tspan><tspan class="k"> The</tspan><tspan class="r"> Second commission on Centre-State Relations</tspan><tspan class="k"> was</tspan></text>
<text x="56" y="150"><tspan class="k">set-up by the Government of India in</tspan><tspan class="r"> 2007</tspan><tspan class="k"> under the Chairmanship of</tspan><tspan class="r"> Madan Mohan</tspan></text>
<text x="56" y="172"><tspan class="r">Punchhi</tspan><tspan class="k">,</tspan><tspan class="b"> former Chief Justice of India</tspan><tspan class="k">.²¹ It was required to look into the issues of</tspan></text>
<text x="56" y="194"><tspan class="k">Centre-State relations keeping in view the</tspan><tspan class="b"> sea-changes</tspan><tspan class="k"> that have taken place in the</tspan></text>
<text x="56" y="216"><tspan class="k">polity and economy of India since the Sarkaria Commission had last looked at the issue</tspan></text>
<text x="56" y="238"><tspan class="k">of Centre-State relations over two decades ago.</tspan></text>
<text x="44" y="266"><tspan class="h" style="font-weight:700">Report (2010):</tspan><tspan class="k"> The Commission submitted its report to the government in</tspan><tspan class="r"> 2010</tspan><tspan class="k">. In</tspan></text>
<text x="56" y="288"><tspan class="k">finalising the</tspan><tspan class="r"> 1,456 page report, in seven volumes</tspan><tspan class="k">, the Commission took extensive help</tspan></text>
<text x="56" y="310"><tspan class="k">from the</tspan><tspan class="b"> Sarkaria Commission report</tspan><tspan class="k">, the</tspan><tspan class="b"> National Commission to Review the Working of</tspan></text>
<text x="56" y="332"><tspan class="b">the Constitution (NCRWC) report</tspan><tspan class="k"> and the</tspan><tspan class="b"> Second Administrative Reforms Commission</tspan></text>
<text x="56" y="354"><tspan class="b">report</tspan><tspan class="k">. However, in a number of areas, the Commission report</tspan><tspan class="r"> differed from the Sarkaria</tspan></text>
<text x="56" y="376"><tspan class="r">Commission</tspan><tspan class="k"> recommendations.</tspan></text>
<rect class="bx" x="133" y="388" width="99" height="30" rx="3"/>
<text class="sm" x="183" y="407" text-anchor="middle"><tspan class="k">set up</tspan><tspan class="r"> 2007</tspan></text>
<line class="ln" x1="235" y1="403" x2="255" y2="403" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="388" width="94" height="30" rx="3"/>
<text class="sm" x="305" y="407" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 2010</tspan></text>
<line class="ln" x1="355" y1="403" x2="375" y2="403" marker-end="url(#ah)"/>
<rect class="bx" x="378" y="388" width="169" height="30" rx="3"/>
<text class="sm" x="463" y="407" text-anchor="middle"><tspan class="r">1,456 pages · 7 volumes</tspan></text>
<line class="ln" x1="340" y1="419" x2="340" y2="440" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="442" width="163" height="30" rx="3"/>
<text class="sm" x="340" y="461" text-anchor="middle"><tspan class="r">310+</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="340" y1="478" x2="340" y2="490"/>
<line class="ln" x1="140" y1="490" x2="540" y2="490"/>
<line class="ln" x1="140" y1="490" x2="140" y2="506" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="490" x2="340" y2="506" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="490" x2="540" y2="506" marker-end="url(#ah)"/>
<text class="sm" x="140" y="526" text-anchor="middle"><tspan class="b">Sarkaria report</tspan></text>
<text class="sm" x="340" y="526" text-anchor="middle"><tspan class="b">NCRWC report</tspan></text>
<text class="sm" x="540" y="526" text-anchor="middle"><tspan class="b">2nd ARC report</tspan></text>
<text x="44" y="558"><tspan class="h" style="font-weight:700">Cooperative federalism:</tspan><tspan class="k"> After examining at length the issues raised in its Terms of</tspan></text>
<text x="56" y="580"><tspan class="k">Reference and the related aspects in all their hues and shades, the Commission came to</tspan></text>
<text x="56" y="602"><tspan class="k">the conclusion that ‘</tspan><tspan class="r" style="font-weight:700">cooperative federalism</tspan><tspan class="k">’ will be the key for sustaining India’s</tspan><tspan class="b"> unity,</tspan></text>
<text x="56" y="624"><tspan class="b">integrity and social and economic development</tspan><tspan class="k"> in future. The principles of cooperative</tspan></text>
<text x="56" y="646"><tspan class="k">federalism thus may have to act as a</tspan><tspan class="b"> practical guide</tspan><tspan class="k"> for Indian polity and governance.</tspan></text>
<text x="44" y="674"><tspan class="h" style="font-weight:700">310+ recommendations:</tspan><tspan class="k"> In all, the Commission made</tspan><tspan class="r"> over 310 recommendations</tspan><tspan class="k">,</tspan></text>
<text x="56" y="696"><tspan class="k">touching upon several significant areas in the working of Centre-state relations. The</tspan></text>
<text x="56" y="718"><tspan class="k">important recommendations are mentioned below:</tspan></text>
<text x="56" y="744" class="r" style="font-weight:700">1.</text>
<text x="78" y="744"><tspan class="h" style="font-weight:700">Prior consensus on Concurrent laws:</tspan><tspan class="k"> To facilitate effective implementation of the</tspan></text>
<text x="78" y="766"><tspan class="k">laws on</tspan><tspan class="r"> List III subjects</tspan><tspan class="k">, it is necessary that some</tspan><tspan class="r"> broad agreement</tspan><tspan class="k"> is reached</tspan></text>
<text x="78" y="788"><tspan class="k">between the Union and states before introducing legislation in Parliament on</tspan></text>
<text x="78" y="810"><tspan class="k">matters in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="836" class="r" style="font-weight:700">2.</text>
<text x="78" y="836"><tspan class="h" style="font-weight:700">Restraint on parliamentary supremacy:</tspan><tspan class="k"> The Union should be</tspan><tspan class="r"> extremely restrained</tspan></text>
<text x="78" y="858"><tspan class="r">in asserting Parliamentary supremacy</tspan><tspan class="k"> in matters assigned to the states.</tspan><tspan class="b"> Greater</tspan></text>
<text x="78" y="880"><tspan class="b">flexibility to states</tspan><tspan class="k"> in relation to subjects in the State List and “</tspan><tspan class="b">transferred items</tspan><tspan class="k">”</tspan></text>
<text x="78" y="902"><tspan class="k">in the Concurrent List is the key for better Centre-state relations.</tspan></text>
<text x="56" y="928" class="r" style="font-weight:700">3.</text>
<text x="78" y="928"><tspan class="h" style="font-weight:700">Minimal occupation of Concurrent field:</tspan><tspan class="k"> The Union should occupy only that many</tspan></text>
<text x="78" y="950"><tspan class="k">of subjects in concurrent or overlapping jurisdiction which are</tspan><tspan class="r"> absolutely necessary</tspan></text>
<text x="78" y="972"><tspan class="k">to achieve uniformity of policy in</tspan><tspan class="b"> demonstrable national interest</tspan><tspan class="k">.</tspan></text>
<text x="56" y="998" class="r" style="font-weight:700">4.</text>
<text x="78" y="998"><tspan class="h" style="font-weight:700">ISC as auditor:</tspan><tspan class="k"> There should be a</tspan><tspan class="r"> continuing auditing role for the Inter-state</tspan></text>
<text x="78" y="1020"><tspan class="r">Council</tspan><tspan class="k"> in the management of matters in concurrent or overlapping jurisdiction.</tspan></text>
<text x="56" y="1046" class="r" style="font-weight:700">5.</text>
<text x="78" y="1046"><tspan class="h" style="font-weight:700">Time limit for President’s assent:</tspan><tspan class="k"> The period of</tspan><tspan class="r"> six months</tspan><tspan class="k"> prescribed in</tspan><tspan class="r"> Article</tspan></text>
<text x="78" y="1068"><tspan class="r">201</tspan><tspan class="k"> for State Legislature to act when the bill is returned by the President can be</tspan></text>
<text x="78" y="1090"><tspan class="k">made applicable for the</tspan><tspan class="r"> President also</tspan><tspan class="k"> to decide on assenting or withholding assent</tspan></text>
<text x="78" y="1112"><tspan class="k">to a state bill reserved for consideration of the President.</tspan></text>
<text x="56" y="1138" class="r" style="font-weight:700">6.</text>
<text x="78" y="1138"><tspan class="h" style="font-weight:700">Treaty-making law (Entry 14):</tspan><tspan class="k"> Parliament should make a law on the subject of</tspan></text>
<text x="78" y="1160"><tspan class="r">Entry 14 of List I</tspan><tspan class="k"> (</tspan><tspan class="b">treaty making and implementing it through Parliamentary</tspan></text>
<text x="78" y="1182"><tspan class="b">legislation</tspan><tspan class="k">) to streamline the procedures involved. The exercise of the power</tspan></text>
<text x="78" y="1204"><tspan class="k">obviously cannot be absolute or unchartered in view of the federal structure of</tspan></text>
<text x="78" y="1226"><tspan class="k">legislative and executive powers.</tspan></text>
<text x="56" y="1252" class="r" style="font-weight:700">7.</text>
<text x="78" y="1252"><tspan class="h" style="font-weight:700">Treaty costs in FC ToR:</tspan><tspan class="k"> Financial obligations and its implications on state finances</tspan></text>
<text x="78" y="1274"><tspan class="k">arising out of</tspan><tspan class="r"> treaties and agreements</tspan><tspan class="k"> should be a</tspan><tspan class="r"> permanent term of reference to</tspan></text>
<text x="78" y="1296"><tspan class="r">the Finance Commissions</tspan><tspan class="k"> constituted from time to time.</tspan></text>
<path d="M50 724 L44 724 L44 1302 L50 1302" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1332"><tspan class="r" style="font-weight:700">21</tspan><tspan class="k"> The other four Members of the Commission were Dhirendra Singh (Former Secretary to the</tspan></text>
<text class="xs" x="50" y="1350"><tspan class="k">Government of India), Vinod Kumar Duggal (Former Secretary to the Government of India), Prof.</tspan></text>
<text class="xs" x="50" y="1368"><tspan class="k">N.R. Madhava Menon (Former Director, National Judicial Academy, Bhopal and National Law School</tspan></text>
<text class="xs" x="50" y="1386"><tspan class="k">of India, Bangalore) and Dr. Amaresh Bagchi (Emeritus Professor, National Institute of Public</tspan></text>
<text class="xs" x="50" y="1404"><tspan class="k">Finance and Policy, New Delhi). With the passing away of Dr. Bagchi in February 2008, Vijay</tspan></text>
<text class="xs" x="50" y="1422"><tspan class="k">Shanker (Former Director, Central Bureau of Investigation, Government of India) was appointed in</tspan></text>
<text class="xs" x="50" y="1440"><tspan class="k">his place as a Member of the Commission in October 2008.</tspan></text>
<rect x="40" y="1310" width="600" height="139" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
