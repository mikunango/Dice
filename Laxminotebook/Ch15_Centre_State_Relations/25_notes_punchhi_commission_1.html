<div id="vis-container"><h2 class="sr-only">Punchhi Commission – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1581" role="img"><title>Punchhi Commission – I</title><desc>Punchhi Commission – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="219" y="26" width="242" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – I</text>
<text class="lb" x="40" y="98">Punchhi Commission</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Punchhi 2007:</tspan><tspan class="k"> The</tspan><tspan class="r"> Second commission on Centre-State Relations</tspan><tspan class="k"> was set-up by the</tspan></text>
<text x="56" y="150"><tspan class="k">Government of India in</tspan><tspan class="r"> 2007</tspan><tspan class="k"> under the Chairmanship of</tspan><tspan class="r"> Madan Mohan Punchhi</tspan><tspan class="k">,</tspan><tspan class="b"> former</tspan></text>
<text x="56" y="172"><tspan class="b">Chief Justice of India</tspan><tspan class="k">.²¹</tspan></text>
<text x="44" y="200"><tspan class="h" style="font-weight:700">Sea-changes:</tspan><tspan class="k"> It was required to look into the issues of Centre-State relations keeping in</tspan></text>
<text x="56" y="222"><tspan class="k">view the</tspan><tspan class="b"> sea-changes</tspan><tspan class="k"> that have taken place in the polity and economy of India since the</tspan></text>
<text x="56" y="244"><tspan class="k">Sarkaria Commission had last looked at the issue of Centre-State relations over two</tspan></text>
<text x="56" y="266"><tspan class="k">decades ago.</tspan></text>
<text x="44" y="294"><tspan class="h" style="font-weight:700">Report 2010:</tspan><tspan class="k"> The Commission submitted its report to the government in</tspan><tspan class="r"> 2010</tspan><tspan class="k">.</tspan></text>
<text x="44" y="322"><tspan class="h" style="font-weight:700">1,456 pages:</tspan><tspan class="k"> In finalising the</tspan><tspan class="r"> 1,456 page report, in seven volumes</tspan><tspan class="k">, the Commission took</tspan></text>
<text x="56" y="344"><tspan class="k">extensive help from the</tspan><tspan class="b"> Sarkaria Commission report</tspan><tspan class="k">, the</tspan><tspan class="b"> National Commission to Review</tspan></text>
<text x="56" y="366"><tspan class="b">the Working of the Constitution (NCRWC) report</tspan><tspan class="k"> and the</tspan><tspan class="b"> Second Administrative Reforms</tspan></text>
<text x="56" y="388"><tspan class="b">Commission report</tspan><tspan class="k">.</tspan></text>
<text x="44" y="416"><tspan class="h" style="font-weight:700">Differed from Sarkaria:</tspan><tspan class="k"> However, in a number of areas, the Commission report</tspan><tspan class="r"> differed</tspan></text>
<text x="56" y="438"><tspan class="r">from the Sarkaria Commission</tspan><tspan class="k"> recommendations.</tspan></text>
<rect class="bx" x="133" y="450" width="99" height="30" rx="3"/>
<text class="sm" x="183" y="469" text-anchor="middle"><tspan class="k">set up</tspan><tspan class="r"> 2007</tspan></text>
<line class="ln" x1="235" y1="465" x2="255" y2="465" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="450" width="94" height="30" rx="3"/>
<text class="sm" x="305" y="469" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 2010</tspan></text>
<line class="ln" x1="355" y1="465" x2="375" y2="465" marker-end="url(#ah)"/>
<rect class="bx" x="378" y="450" width="169" height="30" rx="3"/>
<text class="sm" x="463" y="469" text-anchor="middle"><tspan class="r">1,456 pages · 7 volumes</tspan></text>
<line class="ln" x1="340" y1="481" x2="340" y2="502" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="504" width="163" height="30" rx="3"/>
<text class="sm" x="340" y="523" text-anchor="middle"><tspan class="r">310+</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="340" y1="540" x2="340" y2="552"/>
<line class="ln" x1="140" y1="552" x2="540" y2="552"/>
<line class="ln" x1="140" y1="552" x2="140" y2="568" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="552" x2="340" y2="568" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="552" x2="540" y2="568" marker-end="url(#ah)"/>
<text class="sm" x="140" y="588" text-anchor="middle"><tspan class="b">Sarkaria report</tspan></text>
<text class="sm" x="340" y="588" text-anchor="middle"><tspan class="b">NCRWC report</tspan></text>
<text class="sm" x="540" y="588" text-anchor="middle"><tspan class="b">2nd ARC report</tspan></text>
<text x="44" y="620"><tspan class="h" style="font-weight:700">Cooperative federalism:</tspan><tspan class="k"> After examining at length the issues raised in its Terms of</tspan></text>
<text x="56" y="642"><tspan class="k">Reference and the related aspects in all their hues and shades, the Commission came to</tspan></text>
<text x="56" y="664"><tspan class="k">the conclusion that ‘</tspan><tspan class="r" style="font-weight:700">cooperative federalism</tspan><tspan class="k">’ will be the key for sustaining India’s</tspan><tspan class="b"> unity,</tspan></text>
<text x="56" y="686"><tspan class="b">integrity and social and economic development</tspan><tspan class="k"> in future.</tspan></text>
<text x="44" y="714"><tspan class="h" style="font-weight:700">Practical guide:</tspan><tspan class="k"> The principles of cooperative federalism thus may have to act as a</tspan></text>
<text x="56" y="736"><tspan class="b">practical guide</tspan><tspan class="k"> for Indian polity and governance.</tspan></text>
<text x="44" y="764"><tspan class="h" style="font-weight:700">310+ recommendations:</tspan><tspan class="k"> In all, the Commission made</tspan><tspan class="r"> over 310 recommendations</tspan><tspan class="k">,</tspan></text>
<text x="56" y="786"><tspan class="k">touching upon several significant areas in the working of Centre-state relations.</tspan></text>
<text x="44" y="814"><tspan class="h" style="font-weight:700">Important ones:</tspan><tspan class="k"> The important recommendations are mentioned below:</tspan></text>
<text x="56" y="840" class="r" style="font-weight:700">1.</text>
<text x="78" y="840"><tspan class="k">To facilitate effective implementation of the laws on</tspan><tspan class="r"> List III subjects</tspan><tspan class="k">, it is</tspan></text>
<text x="78" y="862"><tspan class="k">necessary that some</tspan><tspan class="r"> broad agreement</tspan><tspan class="k"> is reached between the Union and states</tspan></text>
<text x="78" y="884"><tspan class="k">before introducing legislation in Parliament on matters in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="910" class="r" style="font-weight:700">2.</text>
<text x="78" y="910"><tspan class="k">The Union should be</tspan><tspan class="r"> extremely restrained in asserting Parliamentary supremacy</tspan><tspan class="k"> in</tspan></text>
<text x="78" y="932"><tspan class="k">matters assigned to the states.</tspan></text>
<text x="78" y="957"><tspan class="h" style="font-weight:700">Flexibility to states:</tspan><tspan class="b"> Greater flexibility to states</tspan><tspan class="k"> in relation to subjects in the</tspan></text>
<text x="90" y="979"><tspan class="k">State List and “</tspan><tspan class="b">transferred items</tspan><tspan class="k">” in the Concurrent List is the key for better</tspan></text>
<text x="90" y="1001"><tspan class="k">Centre-state relations.</tspan></text>
<text x="56" y="1027" class="r" style="font-weight:700">3.</text>
<text x="78" y="1027"><tspan class="k">The Union should occupy only that many of subjects in concurrent or overlapping</tspan></text>
<text x="78" y="1049"><tspan class="k">jurisdiction which are</tspan><tspan class="r"> absolutely necessary</tspan><tspan class="k"> to achieve uniformity of policy in</tspan></text>
<text x="78" y="1071"><tspan class="b">demonstrable national interest</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1097" class="r" style="font-weight:700">4.</text>
<text x="78" y="1097"><tspan class="k">There should be a</tspan><tspan class="r"> continuing auditing role for the Inter-state Council</tspan><tspan class="k"> in the</tspan></text>
<text x="78" y="1119"><tspan class="k">management of matters in concurrent or overlapping jurisdiction.</tspan></text>
<text x="56" y="1145" class="r" style="font-weight:700">5.</text>
<text x="78" y="1145"><tspan class="k">The period of</tspan><tspan class="r"> six months</tspan><tspan class="k"> prescribed in</tspan><tspan class="r"> Article 201</tspan><tspan class="k"> for State Legislature to act when</tspan></text>
<text x="78" y="1167"><tspan class="k">the bill is returned by the President can be made applicable for the</tspan><tspan class="r"> President also</tspan></text>
<text x="78" y="1189"><tspan class="k">to decide on assenting or withholding assent to a state bill reserved for</tspan></text>
<text x="78" y="1211"><tspan class="k">consideration of the President.</tspan></text>
<text x="56" y="1237" class="r" style="font-weight:700">6.</text>
<text x="78" y="1237"><tspan class="k">Parliament should make a law on the subject of</tspan><tspan class="r"> Entry 14 of List I</tspan><tspan class="k"> (</tspan><tspan class="b">treaty making</tspan></text>
<text x="78" y="1259"><tspan class="b">and implementing it through Parliamentary legislation</tspan><tspan class="k">) to streamline the procedures</tspan></text>
<text x="78" y="1281"><tspan class="k">involved.</tspan></text>
<text x="78" y="1306"><tspan class="h" style="font-weight:700">Not absolute:</tspan><tspan class="k"> The exercise of the power obviously cannot be absolute or</tspan></text>
<text x="90" y="1328"><tspan class="k">unchartered in view of the federal structure of legislative and executive powers.</tspan></text>
<text x="56" y="1354" class="r" style="font-weight:700">7.</text>
<text x="78" y="1354"><tspan class="k">Financial obligations and its implications on state finances arising out of</tspan><tspan class="r"> treaties</tspan></text>
<text x="78" y="1376"><tspan class="r">and agreements</tspan><tspan class="k"> should be a</tspan><tspan class="r"> permanent term of reference to the Finance</tspan></text>
<text x="78" y="1398"><tspan class="r">Commissions</tspan><tspan class="k"> constituted from time to time.</tspan></text>
<path d="M50 820 L44 820 L44 1404 L50 1404" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1434"><tspan class="r" style="font-weight:700">21</tspan><tspan class="k"> The other four Members of the Commission were Dhirendra Singh (Former Secretary to the</tspan></text>
<text class="xs" x="50" y="1452"><tspan class="k">Government of India), Vinod Kumar Duggal (Former Secretary to the Government of India), Prof.</tspan></text>
<text class="xs" x="50" y="1470"><tspan class="k">N.R. Madhava Menon (Former Director, National Judicial Academy, Bhopal and National Law School</tspan></text>
<text class="xs" x="50" y="1488"><tspan class="k">of India, Bangalore) and Dr. Amaresh Bagchi (Emeritus Professor, National Institute of Public</tspan></text>
<text class="xs" x="50" y="1506"><tspan class="k">Finance and Policy, New Delhi). With the passing away of Dr. Bagchi in February 2008, Vijay</tspan></text>
<text class="xs" x="50" y="1524"><tspan class="k">Shanker (Former Director, Central Bureau of Investigation, Government of India) was appointed in</tspan></text>
<text class="xs" x="50" y="1542"><tspan class="k">his place as a Member of the Commission in October 2008.</tspan></text>
<rect x="40" y="1412" width="600" height="139" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
