<div id="vis-container"><h2 class="sr-only">Punchhi Commission – I</h2>
<svg class="n" width="100%" viewBox="0 0 680 1561" role="img"><title>Punchhi Commission – I</title><desc>Punchhi Commission – I</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="219" y="26" width="242" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Punchhi Commission – I</text>
<text class="lb" x="40" y="98">Punchhi Commission</text>
<text x="44" y="126" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="126"><tspan class="k">The</tspan><tspan class="r"> Second commission on Centre-State Relations</tspan><tspan class="k"> was set-up by the Government of</tspan></text>
<text x="58" y="148"><tspan class="k">India in</tspan><tspan class="r"> 2007</tspan><tspan class="k"> under the Chairmanship of</tspan><tspan class="r"> Madan Mohan Punchhi</tspan><tspan class="k">,</tspan><tspan class="b"> former Chief Justice</tspan></text>
<text x="58" y="170"><tspan class="b">of India</tspan><tspan class="k">.²¹</tspan></text>
<text x="44" y="196" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="196"><tspan class="k">It was required to look into the issues of Centre-State relations keeping in view the</tspan></text>
<text x="58" y="218"><tspan class="b">sea-changes</tspan><tspan class="k"> that have taken place in the polity and economy of India since the</tspan></text>
<text x="58" y="240"><tspan class="k">Sarkaria Commission had last looked at the issue of Centre-State relations over two</tspan></text>
<text x="58" y="262"><tspan class="k">decades ago.</tspan></text>
<text x="44" y="288" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="288"><tspan class="k">The Commission submitted its report to the government in</tspan><tspan class="r"> 2010</tspan><tspan class="k">.</tspan></text>
<text x="44" y="314" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="314"><tspan class="k">In finalising the</tspan><tspan class="r"> 1,456 page report, in seven volumes</tspan><tspan class="k">, the Commission took extensive</tspan></text>
<text x="58" y="336"><tspan class="k">help from the</tspan><tspan class="b"> Sarkaria Commission report</tspan><tspan class="k">, the</tspan><tspan class="b"> National Commission to Review the</tspan></text>
<text x="58" y="358"><tspan class="b">Working of the Constitution (NCRWC) report</tspan><tspan class="k"> and the</tspan><tspan class="b"> Second Administrative Reforms</tspan></text>
<text x="58" y="380"><tspan class="b">Commission report</tspan><tspan class="k">.</tspan></text>
<text x="44" y="406" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="406"><tspan class="k">However, in a number of areas, the Commission report</tspan><tspan class="r"> differed from the Sarkaria</tspan></text>
<text x="58" y="428"><tspan class="r">Commission</tspan><tspan class="k"> recommendations.</tspan></text>
<rect class="bx" x="133" y="440" width="99" height="30" rx="3"/>
<text class="sm" x="183" y="459" text-anchor="middle"><tspan class="k">set up</tspan><tspan class="r"> 2007</tspan></text>
<line class="ln" x1="235" y1="455" x2="255" y2="455" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="440" width="94" height="30" rx="3"/>
<text class="sm" x="305" y="459" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 2010</tspan></text>
<line class="ln" x1="355" y1="455" x2="375" y2="455" marker-end="url(#ah)"/>
<rect class="bx" x="378" y="440" width="169" height="30" rx="3"/>
<text class="sm" x="463" y="459" text-anchor="middle"><tspan class="r">1,456 pages · 7 volumes</tspan></text>
<line class="ln" x1="340" y1="471" x2="340" y2="492" marker-end="url(#ah)"/>
<rect class="bx" x="258" y="494" width="163" height="30" rx="3"/>
<text class="sm" x="340" y="513" text-anchor="middle"><tspan class="r">310+</tspan><tspan class="k"> recommendations</tspan></text>
<line class="ln" x1="340" y1="530" x2="340" y2="542"/>
<line class="ln" x1="140" y1="542" x2="540" y2="542"/>
<line class="ln" x1="140" y1="542" x2="140" y2="558" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="542" x2="340" y2="558" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="542" x2="540" y2="558" marker-end="url(#ah)"/>
<text class="sm" x="140" y="578" text-anchor="middle"><tspan class="b">Sarkaria report</tspan></text>
<text class="sm" x="340" y="578" text-anchor="middle"><tspan class="b">NCRWC report</tspan></text>
<text class="sm" x="540" y="578" text-anchor="middle"><tspan class="b">2nd ARC report</tspan></text>
<text x="44" y="608" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="608"><tspan class="k">After examining at length the issues raised in its Terms of Reference and the related</tspan></text>
<text x="58" y="630"><tspan class="k">aspects in all their hues and shades, the Commission came to the conclusion that</tspan></text>
<text x="58" y="652"><tspan class="k">‘</tspan><tspan class="r" style="font-weight:700">cooperative federalism</tspan><tspan class="k">’ will be the key for sustaining India’s</tspan><tspan class="b"> unity, integrity and</tspan></text>
<text x="58" y="674"><tspan class="b">social and economic development</tspan><tspan class="k"> in future.</tspan></text>
<text x="44" y="700" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="700"><tspan class="k">The principles of cooperative federalism thus may have to act as a</tspan><tspan class="b"> practical guide</tspan><tspan class="k"> for</tspan></text>
<text x="58" y="722"><tspan class="k">Indian polity and governance.</tspan></text>
<text x="44" y="748" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="748"><tspan class="k">In all, the Commission made</tspan><tspan class="r"> over 310 recommendations</tspan><tspan class="k">, touching upon several</tspan></text>
<text x="58" y="770"><tspan class="k">significant areas in the working of Centre-state relations.</tspan></text>
<text x="44" y="796" style="fill:#D93A3A;font-weight:700">•</text>
<text x="58" y="796"><tspan class="k">The important recommendations are mentioned below:</tspan></text>
<text x="56" y="822" class="r" style="font-weight:700">1.</text>
<text x="78" y="822"><tspan class="k">To facilitate effective implementation of the laws on</tspan><tspan class="r"> List III subjects</tspan><tspan class="k">, it is</tspan></text>
<text x="78" y="844"><tspan class="k">necessary that some</tspan><tspan class="r"> broad agreement</tspan><tspan class="k"> is reached between the Union and states</tspan></text>
<text x="78" y="866"><tspan class="k">before introducing legislation in Parliament on matters in the</tspan><tspan class="r"> Concurrent List</tspan><tspan class="k">.</tspan></text>
<text x="56" y="892" class="r" style="font-weight:700">2.</text>
<text x="78" y="892"><tspan class="k">The Union should be</tspan><tspan class="r"> extremely restrained in asserting Parliamentary supremacy</tspan><tspan class="k"> in</tspan></text>
<text x="78" y="914"><tspan class="k">matters assigned to the states.</tspan></text>
<text x="78" y="938" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="92" y="938"><tspan class="b">Greater flexibility to states</tspan><tspan class="k"> in relation to subjects in the State List and</tspan></text>
<text x="92" y="960"><tspan class="k">“</tspan><tspan class="b">transferred items</tspan><tspan class="k">” in the Concurrent List is the key for better Centre-state</tspan></text>
<text x="92" y="982"><tspan class="k">relations.</tspan></text>
<text x="56" y="1008" class="r" style="font-weight:700">3.</text>
<text x="78" y="1008"><tspan class="k">The Union should occupy only that many of subjects in concurrent or overlapping</tspan></text>
<text x="78" y="1030"><tspan class="k">jurisdiction which are</tspan><tspan class="r"> absolutely necessary</tspan><tspan class="k"> to achieve uniformity of policy in</tspan></text>
<text x="78" y="1052"><tspan class="b">demonstrable national interest</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1078" class="r" style="font-weight:700">4.</text>
<text x="78" y="1078"><tspan class="k">There should be a</tspan><tspan class="r"> continuing auditing role for the Inter-state Council</tspan><tspan class="k"> in the</tspan></text>
<text x="78" y="1100"><tspan class="k">management of matters in concurrent or overlapping jurisdiction.</tspan></text>
<text x="56" y="1126" class="r" style="font-weight:700">5.</text>
<text x="78" y="1126"><tspan class="k">The period of</tspan><tspan class="r"> six months</tspan><tspan class="k"> prescribed in</tspan><tspan class="r"> Article 201</tspan><tspan class="k"> for State Legislature to act when</tspan></text>
<text x="78" y="1148"><tspan class="k">the bill is returned by the President can be made applicable for the</tspan><tspan class="r"> President also</tspan></text>
<text x="78" y="1170"><tspan class="k">to decide on assenting or withholding assent to a state bill reserved for</tspan></text>
<text x="78" y="1192"><tspan class="k">consideration of the President.</tspan></text>
<text x="56" y="1218" class="r" style="font-weight:700">6.</text>
<text x="78" y="1218"><tspan class="k">Parliament should make a law on the subject of</tspan><tspan class="r"> Entry 14 of List I</tspan><tspan class="k"> (</tspan><tspan class="b">treaty making</tspan></text>
<text x="78" y="1240"><tspan class="b">and implementing it through Parliamentary legislation</tspan><tspan class="k">) to streamline the procedures</tspan></text>
<text x="78" y="1262"><tspan class="k">involved.</tspan></text>
<text x="78" y="1286" style="fill:#2F6FDB;font-weight:700">•</text>
<text x="92" y="1286"><tspan class="k">The exercise of the power obviously cannot be absolute or unchartered in view of</tspan></text>
<text x="92" y="1308"><tspan class="k">the federal structure of legislative and executive powers.</tspan></text>
<text x="56" y="1334" class="r" style="font-weight:700">7.</text>
<text x="78" y="1334"><tspan class="k">Financial obligations and its implications on state finances arising out of</tspan><tspan class="r"> treaties</tspan></text>
<text x="78" y="1356"><tspan class="r">and agreements</tspan><tspan class="k"> should be a</tspan><tspan class="r"> permanent term of reference to the Finance</tspan></text>
<text x="78" y="1378"><tspan class="r">Commissions</tspan><tspan class="k"> constituted from time to time.</tspan></text>
<path d="M50 802 L44 802 L44 1384 L50 1384" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="xs" x="50" y="1414"><tspan class="r" style="font-weight:700">21</tspan><tspan class="k"> The other four Members of the Commission were Dhirendra Singh (Former Secretary to the</tspan></text>
<text class="xs" x="50" y="1432"><tspan class="k">Government of India), Vinod Kumar Duggal (Former Secretary to the Government of India), Prof.</tspan></text>
<text class="xs" x="50" y="1450"><tspan class="k">N.R. Madhava Menon (Former Director, National Judicial Academy, Bhopal and National Law School</tspan></text>
<text class="xs" x="50" y="1468"><tspan class="k">of India, Bangalore) and Dr. Amaresh Bagchi (Emeritus Professor, National Institute of Public</tspan></text>
<text class="xs" x="50" y="1486"><tspan class="k">Finance and Policy, New Delhi). With the passing away of Dr. Bagchi in February 2008, Vijay</tspan></text>
<text class="xs" x="50" y="1504"><tspan class="k">Shanker (Former Director, Central Bureau of Investigation, Government of India) was appointed in</tspan></text>
<text class="xs" x="50" y="1522"><tspan class="k">his place as a Member of the Commission in October 2008.</tspan></text>
<rect x="40" y="1392" width="600" height="139" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
