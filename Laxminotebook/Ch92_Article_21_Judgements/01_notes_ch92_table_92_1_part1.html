<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 92 Judgements Expanding the Scope of Article 21</text>
<text class="sm" x="40" y="88"><tspan class="b">Article 21 – “No person shall be deprived of his life or personal liberty except according to</tspan></text>
<text class="sm" x="40" y="110"><tspan class="b">procedure established by law” – has been widened by the Supreme Court into a source of many</tspan></text>
<text class="sm" x="40" y="132"><tspan class="b">unenumerated rights:</tspan></text>

<text class="xs" x="100" y="204" text-anchor="middle"><tspan class="r">accused</tspan></text>
<text class="xs" x="220" y="186" text-anchor="middle"><tspan class="r">Dignity &amp;</tspan></text>
<text class="xs" x="220" y="204" text-anchor="middle"><tspan class="r">livelihood</tspan></text>
<text class="xs" x="340" y="186" text-anchor="middle"><tspan class="r">Health &amp;</tspan></text>

<text class="xs" x="580" y="204" text-anchor="middle"><tspan class="r">in death</tspan></text>

<text x="40" y="258"><tspan class="r" style="font-weight:700">life and personal liberty under Article 21</tspan></text>

<text class="sm" x="542" y="288" text-anchor="middle"><tspan class="r" style="font-weight:700">Right declared by the</tspan></text>
<text class="sm" x="542" y="307" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court as an</tspan></text>
<text class="sm" x="542" y="326" text-anchor="middle"><tspan class="r" style="font-weight:700">integral part of Article 21</tspan></text>
<line class="gx" x1="40" y1="337" x2="640" y2="337"/>
<text class="sm" x="47" y="357"><tspan class="k">1.</tspan></text>
<text class="sm" x="92" y="357"><tspan class="k">Satwant Singh Sawhney vs. D.</tspan></text>
<text class="sm" x="92" y="376"><tspan class="k">Ramarathnam, Assistant Passport Officer,</tspan></text>
<text class="sm" x="92" y="395"><tspan class="k">New Delhi</tspan></text>
<text class="sm" x="382" y="357"><tspan class="r">1967</tspan></text>
<text class="sm" x="452" y="357"><tspan class="r" style="font-weight:700">Right to travel abroad</tspan></text>
<line class="gx" x1="40" y1="406" x2="640" y2="406"/>

<text class="sm" x="382" y="426"><tspan class="r">1978</tspan></text>
<text class="sm" x="452" y="426"><tspan class="r" style="font-weight:700">Right against solitary</tspan></text>
<text class="sm" x="452" y="445"><tspan class="r" style="font-weight:700">confinement</tspan></text>
<line class="gx" x1="40" y1="456" x2="640" y2="456"/>

<text class="sm" x="92" y="476"><tspan class="k">Charles Sobhraj vs. Superintendent, Central</tspan></text>

<text class="sm" x="382" y="476"><tspan class="r">1978</tspan></text>
<text class="sm" x="452" y="476"><tspan class="r" style="font-weight:700">Right against bar fetters</tspan></text>
<line class="gx" x1="40" y1="506" x2="640" y2="506"/>
<text class="sm" x="47" y="526"><tspan class="k">4.</tspan></text>
<text class="sm" x="92" y="526"><tspan class="k">M.H. Hoskot vs. State of Maharashtra</tspan></text>
<text class="sm" x="382" y="526"><tspan class="r">1978</tspan></text>
<text class="sm" x="452" y="526"><tspan class="r" style="font-weight:700">Right to free legal aid</tspan></text>
<line class="gx" x1="40" y1="537" x2="640" y2="537"/>
<text class="sm" x="47" y="557"><tspan class="k">5.</tspan></text>
<text class="sm" x="92" y="557"><tspan class="k">Hussainara Khatoon vs. Home Secretary,</tspan></text>
<text class="sm" x="92" y="576"><tspan class="k">State of Bihar</tspan></text>
<text class="sm" x="382" y="557"><tspan class="r">1979</tspan></text>
<text class="sm" x="452" y="557"><tspan class="r" style="font-weight:700">Right to speedy trial</tspan></text>
<line class="gx" x1="40" y1="587" x2="640" y2="587"/>

<text class="sm" x="382" y="607"><tspan class="r">1980</tspan></text>
<text class="sm" x="452" y="607"><tspan class="r" style="font-weight:700">Right against handcuffing</tspan></text>
<line class="gx" x1="40" y1="637" x2="640" y2="637"/>

<text class="sm" x="92" y="657"><tspan class="k">Kishore Singh Ravinder Dev vs. State of</tspan></text>
<text class="sm" x="92" y="676"><tspan class="k">Rajasthan</tspan></text>
<text class="sm" x="382" y="657"><tspan class="r">1980</tspan></text>
<text class="sm" x="452" y="657"><tspan class="r" style="font-weight:700">Right against inhuman</tspan></text>
<text class="sm" x="452" y="676"><tspan class="r" style="font-weight:700">treatment by the police</tspan></text>
<text class="sm" x="452" y="695"><tspan class="r" style="font-weight:700">(use of “third degree”</tspan></text>

<text class="sm" x="382" y="745"><tspan class="r">1981</tspan></text>
<text class="sm" x="452" y="745"><tspan class="r" style="font-weight:700">Right to live with human</tspan></text>
<text class="sm" x="452" y="764"><tspan class="r" style="font-weight:700">dignity &amp; Right of prisoner</tspan></text>
<text class="sm" x="452" y="783"><tspan class="r" style="font-weight:700">to have necessities of life.</tspan></text>
