<div id="vis-container"><h2 class="sr-only">Integrated judiciary, inauguration and constitutional provisions.</h2>
<svg class="n" width="100%" viewBox="0 0 680 769" role="img"><title>CHAPTER 26 Supreme Court</title><desc>Integrated judiciary, inauguration and constitutional provisions.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="204" y="26" width="273" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">CHAPTER 26 Supreme Court</text>
<text x="44" y="94"><tspan class="h" style="font-weight:700">Integrated judicial system:</tspan><tspan class="k"> Unlike the</tspan><tspan class="r"> American Constitution</tspan><tspan class="k">, the Indian Constitution</tspan></text>
<text x="56" y="116"><tspan class="k">has established an</tspan><tspan class="r"> integrated judicial system</tspan><tspan class="k"> with the</tspan><tspan class="b"> Supreme Court at the top</tspan><tspan class="k"> and the</tspan></text>
<text x="56" y="138"><tspan class="b">high courts below it</tspan><tspan class="k">. Under a high court (and below the state level), there is a hierarchy</tspan></text>
<text x="56" y="160"><tspan class="k">of</tspan><tspan class="r"> subordinate courts</tspan><tspan class="k">, that is,</tspan><tspan class="b"> district courts and other lower courts</tspan><tspan class="k">. This</tspan><tspan class="r"> single system</tspan></text>
<text x="56" y="182"><tspan class="r">of courts</tspan><tspan class="k">, adopted from the</tspan><tspan class="r"> Government of India Act of 1935</tspan><tspan class="k">, enforces both</tspan><tspan class="b"> Central laws</tspan></text>
<text x="56" y="204"><tspan class="b">as well as the state laws</tspan><tspan class="k">. In</tspan><tspan class="r"> USA</tspan><tspan class="k">, on the other hand, the federal laws are enforced by</tspan></text>
<text x="56" y="226"><tspan class="k">the federal judiciary and the state laws are enforced by the state judiciary. There is thus</tspan></text>
<text x="56" y="248"><tspan class="k">a</tspan><tspan class="r"> double system of courts</tspan><tspan class="k"> in USA—one for the centre and the other for the states. To</tspan></text>
<text x="56" y="270"><tspan class="k">sum up, India, although a federal country like the USA, has a</tspan><tspan class="r"> unified judiciary</tspan><tspan class="k"> and</tspan><tspan class="b"> one</tspan></text>
<text x="56" y="292"><tspan class="b">system of fundamental law and justice</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="87" y="304" width="114" height="30" rx="3"/>
<text class="sm" x="144" y="323" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court</tspan></text>
<line class="ln" x1="204" y1="319" x2="224" y2="319" marker-end="url(#ah)"/>
<rect class="bx" x="227" y="304" width="98" height="30" rx="3"/>
<text class="sm" x="276" y="323" text-anchor="middle"><tspan class="r" style="font-weight:700">High Courts</tspan></text>
<line class="ln" x1="328" y1="319" x2="348" y2="319" marker-end="url(#ah)"/>
<rect class="bx" x="351" y="304" width="112" height="30" rx="3"/>
<text class="sm" x="408" y="323" text-anchor="middle"><tspan class="r" style="font-weight:700">District courts</tspan></text>
<line class="ln" x1="467" y1="319" x2="487" y2="319" marker-end="url(#ah)"/>
<rect class="bx" x="490" y="304" width="103" height="30" rx="3"/>
<text class="sm" x="541" y="323" text-anchor="middle"><tspan class="r" style="font-weight:700">Lower courts</tspan></text>
<rect class="bx" x="46" y="348" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="366" text-anchor="middle"><tspan class="r" style="font-weight:700">India – single system</tspan></text>
<line class="ln" x1="190" y1="376" x2="190" y2="390" marker-end="url(#ah)"/>
<text class="sm" x="190" y="411" text-anchor="middle"><tspan class="k">one hierarchy of courts</tspan></text>
<text class="sm" x="190" y="433" text-anchor="middle"><tspan class="k">enforces</tspan><tspan class="r"> Central + state</tspan><tspan class="k"> laws</tspan></text>
<text class="sm" x="190" y="455" text-anchor="middle"><tspan class="b">from GoI Act 1935</tspan></text>
<rect class="bx" x="346" y="348" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="366" text-anchor="middle"><tspan class="r" style="font-weight:700">USA – double system</tspan></text>
<line class="ln" x1="490" y1="376" x2="490" y2="390" marker-end="url(#ah)"/>
<text class="sm" x="490" y="411" text-anchor="middle"><tspan class="k">federal courts → federal laws</tspan></text>
<text class="sm" x="490" y="433" text-anchor="middle"><tspan class="k">state courts → state laws</tspan></text>
<line x1="340" y1="348" x2="340" y2="458" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="492"><tspan class="h" style="font-weight:700">Successor of Federal Court &amp; Privy Council:</tspan><tspan class="k"> The Supreme Court of India was</tspan></text>
<text x="56" y="514"><tspan class="r">inaugurated on January 28, 1950</tspan><tspan class="k">. It succeeded the</tspan><tspan class="r"> Federal Court of India</tspan><tspan class="k">, established</tspan></text>
<text x="56" y="536"><tspan class="k">under the</tspan><tspan class="b"> Government of India Act of 1935</tspan><tspan class="k">. However, the jurisdiction of the Supreme</tspan></text>
<text x="56" y="558"><tspan class="k">Court is</tspan><tspan class="r"> greater than that of its predecessor</tspan><tspan class="k">. This is because, the Supreme Court has</tspan></text>
<text x="56" y="580"><tspan class="k">replaced the</tspan><tspan class="r"> British Privy Council</tspan><tspan class="k"> as the</tspan><tspan class="b"> highest court of appeal</tspan><tspan class="k">.¹</tspan></text>
<rect class="bx" x="55" y="592" width="153" height="30" rx="3"/>
<text class="sm" x="132" y="611" text-anchor="middle"><tspan class="k">Federal Court (1935)</tspan></text>
<line class="ln" x1="211" y1="607" x2="231" y2="607" marker-end="url(#ah)"/>
<rect class="bx" x="234" y="592" width="208" height="30" rx="3"/>
<text class="sm" x="338" y="611" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court – 28 Jan 1950</tspan></text>
<line class="ln" x1="445" y1="607" x2="465" y2="607" marker-end="url(#ah)"/>
<rect class="bx" x="468" y="592" width="156" height="30" rx="3"/>
<text class="sm" x="547" y="611" text-anchor="middle"><tspan class="b">replaced Privy Council</tspan></text>
<text x="44" y="650"><tspan class="h" style="font-weight:700">Constitutional basis (Arts. 124–147):</tspan><tspan class="r"> Articles 124 to 147</tspan><tspan class="k"> in</tspan><tspan class="r"> Part V</tspan><tspan class="k"> of the Constitution</tspan></text>
<text x="56" y="672"><tspan class="k">deal with the</tspan><tspan class="b"> organisation, independence, jurisdiction, powers, procedures</tspan><tspan class="k"> and so on of</tspan></text>
<text x="56" y="694"><tspan class="k">the Supreme Court. The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> is also authorised to regulate them.</tspan></text>
<text class="xs" x="50" y="730"><tspan class="r" style="font-weight:700">1</tspan><tspan class="k"> Before 1950, the British Privy Council had the jurisdiction to hear appeals from India.</tspan></text>
<rect x="40" y="708" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
