.n text{font-family:'Kalam',cursive;font-size:15px}.r{fill:#D93A3A}.b{fill:#2F6FDB}.k{fill:var(--text-primary)}.h{fill:#7A1F1F;text-decoration:underline}.hd{font-weight:700;font-size:17px!important}.sh{font-weight:700;font-size:16px!important}.ln{stroke:var(--text-secondary);stroke-width:1.2;fill:none}.lb{fill:var(--text-primary);font-weight:700;text-decoration:underline}.sm{font-size:14px!important}.xs{font-size:13px!important}.bx{fill:none;stroke:#D93A3A;stroke-width:1.2}.gx{fill:none;stroke:var(--text-secondary);stroke-width:1}

<div id="vis-container"><h2 class="sr-only">Qualifications, Oath and Salaries</h2>
<svg class="n" width="100%" viewBox="0 0 680 1161" role="img"><title>Qualifications, Oath and Salaries</title><desc>Qualifications, Oath and Salaries</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="187" y="26" width="306" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Qualifications, Oath and Salaries</text>
<text class="r hd" x="40" y="100">QUALIFICATIONS, OATH AND SALARIES</text>
<line x1="40" y1="106" x2="340" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="134"><tspan class="r" style="font-weight:700">Qualifications of Judges</tspan></text>
<text x="44" y="164"><tspan class="h" style="font-weight:700">Eligibility of SC judge:</tspan><tspan class="k"> A person to be appointed as a judge of the Supreme Court should</tspan></text>
<text x="56" y="186"><tspan class="k">have the following qualifications:</tspan></text>
<text x="56" y="212" class="r" style="font-weight:700">1.</text>
<text x="78" y="212"><tspan class="h" style="font-weight:700">Citizenship:</tspan><tspan class="k"> He/she should be a</tspan><tspan class="r"> citizen of India</tspan><tspan class="k">.</tspan></text>
<text x="56" y="238" class="r" style="font-weight:700">2.</text>
<text x="78" y="238"><tspan class="h" style="font-weight:700">Judicial / legal experience:</tspan><tspan class="k"> (a) He/she should have been a</tspan><tspan class="r"> judge of a High Court</tspan></text>
<text x="78" y="260"><tspan class="k">(or high courts in succession) for</tspan><tspan class="r"> five years</tspan><tspan class="k">; or (b) He/she should have been an</tspan></text>
<text x="78" y="282"><tspan class="r">advocate of a High Court</tspan><tspan class="k"> (or High Courts in succession) for</tspan><tspan class="r"> ten years</tspan><tspan class="k">; or (c)</tspan></text>
<text x="78" y="304"><tspan class="k">He/she should be a</tspan><tspan class="r"> distinguished jurist</tspan><tspan class="k"> in the opinion of the President.</tspan></text>
<path d="M50 192 L44 192 L44 310 L50 310" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="310" x2="340" y2="322"/>
<line class="ln" x1="140" y1="322" x2="540" y2="322"/>
<line class="ln" x1="140" y1="322" x2="140" y2="338" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="322" x2="340" y2="338" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="322" x2="540" y2="338" marker-end="url(#ah)"/>
<text class="sm" x="140" y="358" text-anchor="middle"><tspan class="r">HC judge – 5 years</tspan></text>
<text class="sm" x="340" y="358" text-anchor="middle"><tspan class="r">HC advocate – 10 years</tspan></text>
<text class="sm" x="540" y="358" text-anchor="middle"><tspan class="r">distinguished jurist</tspan></text>
<text x="44" y="390"><tspan class="h" style="font-weight:700">No minimum age:</tspan><tspan class="k"> From the above, it is clear that the Constitution has</tspan><tspan class="r"> not prescribed a</tspan></text>
<text x="56" y="412"><tspan class="r">minimum age</tspan><tspan class="k"> for appointment as a judge of the Supreme Court.</tspan></text>
<text class="sh" x="40" y="440"><tspan class="r" style="font-weight:700">Oath or Affirmation</tspan></text>
<text x="44" y="470"><tspan class="h" style="font-weight:700">Oath before President:</tspan><tspan class="k"> A person appointed as a judge of the Supreme Court, before</tspan></text>
<text x="56" y="492"><tspan class="k">entering upon his/her Office, has to make and subscribe an</tspan><tspan class="r"> oath or affirmation before</tspan></text>
<text x="56" y="514"><tspan class="r">the President</tspan><tspan class="k">, or some person appointed by him/her for this purpose. In his/her oath, a</tspan></text>
<text x="56" y="536"><tspan class="k">judge of the Supreme Court swears:</tspan></text>
<text x="56" y="562" class="r" style="font-weight:700">1.</text>
<text x="78" y="562"><tspan class="h" style="font-weight:700">Allegiance to Constitution:</tspan><tspan class="k"> to bear</tspan><tspan class="r"> true faith and allegiance to the Constitution</tspan><tspan class="k"> of</tspan></text>
<text x="78" y="584"><tspan class="k">India;</tspan></text>
<text x="56" y="610" class="r" style="font-weight:700">2.</text>
<text x="78" y="610"><tspan class="h" style="font-weight:700">Sovereignty and integrity:</tspan><tspan class="k"> to uphold the</tspan><tspan class="r"> sovereignty and integrity</tspan><tspan class="k"> of India;</tspan></text>
<text x="56" y="636" class="r" style="font-weight:700">3.</text>
<text x="78" y="636"><tspan class="h" style="font-weight:700">Impartial duty:</tspan><tspan class="k"> to duly and faithfully and to the best of his/her ability, knowledge</tspan></text>
<text x="78" y="658"><tspan class="k">and judgement perform the duties of the Office</tspan><tspan class="r"> without fear or favour, affection or</tspan></text>
<text x="78" y="680"><tspan class="r">ill-will</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="706" class="r" style="font-weight:700">4.</text>
<text x="78" y="706"><tspan class="h" style="font-weight:700">Uphold Constitution and laws:</tspan><tspan class="k"> to</tspan><tspan class="r"> uphold the Constitution and the laws</tspan><tspan class="k">.</tspan></text>
<path d="M50 542 L44 542 L44 712 L50 712" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="734"><tspan class="r" style="font-weight:700">Salaries and Allowances</tspan></text>
<text x="44" y="764"><tspan class="h" style="font-weight:700">Salaries fixed by Parliament:</tspan><tspan class="k"> The</tspan><tspan class="r"> salaries, allowances, privileges, leave and pension</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="786"><tspan class="k">the judges of the Supreme Court are determined from time to time by the</tspan><tspan class="r"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="808"><tspan class="k">They</tspan><tspan class="r"> cannot be varied to their disadvantage</tspan><tspan class="k"> after their appointment except during a</tspan></text>
<text x="56" y="830"><tspan class="r">financial emergency</tspan><tspan class="k">. In</tspan><tspan class="r"> 2018</tspan><tspan class="k">, the salary of the</tspan><tspan class="r"> chief justice</tspan><tspan class="k"> was increased from ₹1 lakh</tspan></text>
<text x="56" y="852"><tspan class="k">to</tspan><tspan class="r"> ₹2.80 lakh</tspan><tspan class="k"> per month and that of a</tspan><tspan class="r"> judge</tspan><tspan class="k"> from ₹90,000 to</tspan><tspan class="r"> ₹2.50 lakh</tspan><tspan class="k"> per month⁵.</tspan></text>
<text x="56" y="874"><tspan class="k">They are also paid</tspan><tspan class="b"> sumptuary allowance</tspan><tspan class="k"> and provided with</tspan><tspan class="b"> free accommodation</tspan><tspan class="k"> and other</tspan></text>
<text x="56" y="896"><tspan class="k">facilities like medical, car, telephone, etc.</tspan></text>
<rect class="bx" x="46" y="910" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="928" text-anchor="middle"><tspan class="r" style="font-weight:700">Chief Justice</tspan></text>
<line class="ln" x1="190" y1="938" x2="190" y2="952" marker-end="url(#ah)"/>
<text class="sm" x="190" y="973" text-anchor="middle"><tspan class="k">₹1 lakh →</tspan><tspan class="r"> ₹2.80 lakh</tspan><tspan class="k">/month (2018)</tspan></text>
<rect class="bx" x="346" y="910" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="928" text-anchor="middle"><tspan class="r" style="font-weight:700">Judge</tspan></text>
<line class="ln" x1="490" y1="938" x2="490" y2="952" marker-end="url(#ah)"/>
<text class="sm" x="490" y="973" text-anchor="middle"><tspan class="k">₹90,000 →</tspan><tspan class="r"> ₹2.50 lakh</tspan><tspan class="k">/month (2018)</tspan></text>
<line x1="340" y1="910" x2="340" y2="976" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="1010"><tspan class="h" style="font-weight:700">Pension – 50%:</tspan><tspan class="k"> The retired chief justice and judges are entitled to</tspan><tspan class="r"> 50 per cent of their</tspan></text>
<text x="56" y="1032"><tspan class="r">last drawn salary</tspan><tspan class="k"> as monthly pension.</tspan></text>
<text class="xs" x="50" y="1068"><tspan class="r" style="font-weight:700">5</tspan><tspan class="k"> In 1950, their salaries were fixed at ₹5,000 per month and ₹4,000 per month respectively. In</tspan></text>
<text class="xs" x="50" y="1086"><tspan class="k">1986, their salaries were raised to ₹10,000 per month and ₹9,000 per month respectively. In 1998,</tspan></text>
<text class="xs" x="50" y="1104"><tspan class="k">their salaries were raised to ₹33,000 per month and ₹30,000 per month respectively. In 2009, their</tspan></text>
<text class="xs" x="50" y="1122"><tspan class="k">salaries were raised to ₹1 lakh per month and ₹90,000 per month respectively.</tspan></text>
<rect x="40" y="1046" width="600" height="85" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
