<div id="vis-container"><h2 class="sr-only">Review, Interpretation and Other Powers</h2>
<svg class="n" width="100%" viewBox="0 0 680 1662" role="img"><title>Review, Interpretation and Other Powers</title><desc>Review, Interpretation and Other Powers</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="156" y="26" width="368" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Review, Interpretation and Other Powers</text>
<text class="lb" x="40" y="98">7. Review Jurisdiction</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Review petition – 30 days:</tspan><tspan class="k"> The Supreme Court has power to</tspan><tspan class="r"> review any judgement</tspan></text>
<text x="56" y="150"><tspan class="k">pronounced or order made by it. A review petition has to be filed</tspan><tspan class="r"> within thirty days</tspan><tspan class="k"> from</tspan></text>
<text x="56" y="172"><tspan class="k">the date of the judgement or order sought to be reviewed. Also, the review petition</tspan></text>
<text x="56" y="194"><tspan class="k">should be submitted to the</tspan><tspan class="r"> same judge or bench</tspan><tspan class="k"> that delivered the judgement or order.</tspan></text>
<text x="56" y="216"><tspan class="k">Further, a review petition is allowed on the following grounds:</tspan></text>
<text x="56" y="242" class="r" style="font-weight:700">(i)</text>
<text x="93" y="242"><tspan class="k">Discovery of</tspan><tspan class="r"> new and important matter or evidence</tspan><tspan class="k">.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="268"><tspan class="r">Mistake or error apparent</tspan><tspan class="k"> on the face of the record.</tspan></text>
<text x="56" y="294" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="294"><tspan class="k">Any other</tspan><tspan class="r"> sufficient reason</tspan><tspan class="k">.</tspan></text>
<path d="M50 222 L44 222 L44 300 L50 300" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="322"><tspan class="h" style="font-weight:700">Curative petition:</tspan><tspan class="k"> The court may either dismiss the review petition or direct notice to</tspan></text>
<text x="56" y="344"><tspan class="k">the opposite party. However, even after the dismissal of the review petition, the court</tspan></text>
<text x="56" y="366"><tspan class="k">can still reconsider its final judgement or order by way of a</tspan><tspan class="r"> curative petition</tspan><tspan class="k"> on limited</tspan></text>
<text x="56" y="388"><tspan class="k">grounds like:</tspan></text>
<text x="56" y="414" class="r" style="font-weight:700">(i)</text>
<text x="93" y="414"><tspan class="k">Violation of the</tspan><tspan class="r"> principles of natural justice</tspan><tspan class="k">.</tspan></text>
<text x="56" y="440" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="440"><tspan class="k">To cure a</tspan><tspan class="r"> gross miscarriage of justice</tspan><tspan class="k">.</tspan></text>
<text x="56" y="466" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="466"><tspan class="k">To prevent</tspan><tspan class="r"> abuse of the process</tspan><tspan class="k"> of the court.</tspan></text>
<text x="56" y="492" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="492"><tspan class="r">Bias</tspan><tspan class="k"> of the judge.</tspan></text>
<path d="M50 394 L44 394 L44 498 L50 498" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="98" y="504" width="89" height="30" rx="3"/>
<text class="sm" x="142" y="523" text-anchor="middle"><tspan class="k">judgement</tspan></text>
<line class="ln" x1="190" y1="519" x2="210" y2="519" marker-end="url(#ah)"/>
<rect class="bx" x="213" y="504" width="259" height="30" rx="3"/>
<text class="sm" x="342" y="523" text-anchor="middle"><tspan class="r">review petition</tspan><tspan class="k"> (30 days, same bench)</tspan></text>
<line class="ln" x1="475" y1="519" x2="495" y2="519" marker-end="url(#ah)"/>
<rect class="bx" x="498" y="504" width="84" height="30" rx="3"/>
<text class="sm" x="540" y="523" text-anchor="middle"><tspan class="k">dismissed</tspan></text>
<line class="ln" x1="340" y1="535" x2="340" y2="556" marker-end="url(#ah)"/>
<rect class="bx" x="278" y="558" width="123" height="30" rx="3"/>
<text class="sm" x="340" y="577" text-anchor="middle"><tspan class="r" style="font-weight:700">curative petition</tspan></text>
<text class="lb" x="40" y="620">8. Constitutional Interpretation</text>
<text x="44" y="650"><tspan class="h" style="font-weight:700">Ultimate interpreter:</tspan><tspan class="k"> The Supreme Court is the</tspan><tspan class="r"> ultimate interpreter of the Constitution</tspan><tspan class="k">.</tspan></text>
<text x="56" y="672"><tspan class="k">It can give final version to the</tspan><tspan class="b"> spirit and content</tspan><tspan class="k"> of the provisions of the constitution</tspan></text>
<text x="56" y="694"><tspan class="k">and the verbiage used in the constitution.</tspan></text>
<text x="44" y="722"><tspan class="h" style="font-weight:700">Doctrines of interpretation:</tspan><tspan class="k"> While interpreting the constitution, the Supreme Court is</tspan></text>
<text x="56" y="744"><tspan class="k">guided by a number of</tspan><tspan class="r"> doctrines</tspan><tspan class="k">. In other words, the Supreme Court applies various</tspan></text>
<text x="56" y="766"><tspan class="k">doctrines in interpreting the constitution. The important doctrines are mentioned below:</tspan></text>
<text x="56" y="792" class="r" style="font-weight:700">1.</text>
<text x="83" y="792"><tspan class="k">Doctrine of Severability</tspan></text>
<text x="56" y="818" class="r" style="font-weight:700">2.</text>
<text x="83" y="818"><tspan class="k">Doctrine of Waiver</tspan></text>
<text x="56" y="844" class="r" style="font-weight:700">3.</text>
<text x="83" y="844"><tspan class="k">Doctrine of Eclipse</tspan></text>
<text x="56" y="870" class="r" style="font-weight:700">4.</text>
<text x="83" y="870"><tspan class="k">Doctrine of Territorial Nexus</tspan></text>
<text x="56" y="896" class="r" style="font-weight:700">5.</text>
<text x="83" y="896"><tspan class="k">Doctrine of Pith and Substance</tspan></text>
<text x="56" y="922" class="r" style="font-weight:700">6.</text>
<text x="83" y="922"><tspan class="k">Doctrine of Colourable Legislation</tspan></text>
<text x="56" y="948" class="r" style="font-weight:700">7.</text>
<text x="83" y="948"><tspan class="k">Doctrine of Implied Powers</tspan></text>
<text x="56" y="974" class="r" style="font-weight:700">8.</text>
<text x="83" y="974"><tspan class="k">Doctrine of Incidental and Ancillary Powers</tspan></text>
<text x="56" y="1000" class="r" style="font-weight:700">9.</text>
<text x="83" y="1000"><tspan class="k">Doctrine of Precedent</tspan></text>
<text x="56" y="1026" class="r" style="font-weight:700">10.</text>
<text x="83" y="1026"><tspan class="k">Doctrine of Occupied Field</tspan></text>
<text x="56" y="1052" class="r" style="font-weight:700">11.</text>
<text x="83" y="1052"><tspan class="k">Doctrine of Prospective Overruling</tspan></text>
<text x="56" y="1078" class="r" style="font-weight:700">12.</text>
<text x="83" y="1078"><tspan class="k">Doctrine of Harmonious Construction</tspan></text>
<text x="56" y="1104" class="r" style="font-weight:700">13.</text>
<text x="83" y="1104"><tspan class="k">Doctrine of Liberal Interpretation</tspan></text>
<path d="M50 772 L44 772 L44 1110 L50 1110" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="lb" x="40" y="1136">9. Other Powers</text>
<text x="44" y="1166"><tspan class="h" style="font-weight:700">Other powers:</tspan><tspan class="k"> Besides the above, the Supreme Court has numerous other powers:</tspan></text>
<text x="56" y="1192" class="r" style="font-weight:700">(a)</text>
<text x="89" y="1192"><tspan class="h" style="font-weight:700">Presidential election disputes:</tspan><tspan class="k"> It decides the disputes regarding the</tspan><tspan class="r"> election of</tspan></text>
<text x="89" y="1214"><tspan class="r">the President and the vice-President</tspan><tspan class="k">. In this regard, it has the</tspan><tspan class="r"> original, exclusive</tspan></text>
<text x="89" y="1236"><tspan class="r">and final authority</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1262" class="r" style="font-weight:700">(b)</text>
<text x="89" y="1262"><tspan class="h" style="font-weight:700">PSC members’ conduct:</tspan><tspan class="k"> It enquires into the conduct and behaviour of the</tspan></text>
<text x="89" y="1284"><tspan class="r">chairman and members of the UPSC or SPSC or JSPSC</tspan><tspan class="k"> on a reference made by</tspan></text>
<text x="89" y="1306"><tspan class="k">the President. If it finds them guilty of misbehaviour, it can recommend to the</tspan></text>
<text x="89" y="1328"><tspan class="k">President for their removal. The advice tendered by the Supreme Court in this</tspan></text>
<text x="89" y="1350"><tspan class="k">regard is</tspan><tspan class="r"> binding on the President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1376" class="r" style="font-weight:700">(c)</text>
<text x="89" y="1376"><tspan class="h" style="font-weight:700">Transfer of cases:</tspan><tspan class="k"> It is authorised to</tspan><tspan class="r"> withdraw the cases pending before the high</tspan></text>
<text x="89" y="1398"><tspan class="r">courts</tspan><tspan class="k"> and dispose them by itself. It can also</tspan><tspan class="r"> transfer a case or appeal</tspan><tspan class="k"> pending</tspan></text>
<text x="89" y="1420"><tspan class="k">before one high court to another high court.</tspan></text>
<text x="56" y="1446" class="r" style="font-weight:700">(d)</text>
<text x="89" y="1446"><tspan class="h" style="font-weight:700">Law binding on all courts (Art. 141):</tspan><tspan class="k"> Its</tspan><tspan class="r"> law is binding on all courts in India</tspan><tspan class="k">. Its</tspan></text>
<text x="89" y="1468"><tspan class="k">decree or order is</tspan><tspan class="r"> enforceable throughout the country</tspan><tspan class="k">. All authorities (civil and</tspan></text>
<text x="89" y="1490"><tspan class="k">judicial) in the country should</tspan><tspan class="b"> act in aid of the Supreme Court</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1516" class="r" style="font-weight:700">(e)</text>
<text x="89" y="1516"><tspan class="h" style="font-weight:700">Judicial superintendence:</tspan><tspan class="k"> It has power of</tspan><tspan class="r"> judicial superintendence and control</tspan></text>
<text x="89" y="1538"><tspan class="k">over all the courts and tribunals functioning in the entire territory of the country.</tspan></text>
<path d="M50 1172 L44 1172 L44 1544 L50 1544" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1566"><tspan class="h" style="font-weight:700">Enlargement of jurisdiction:</tspan><tspan class="k"> The Supreme Court’s jurisdiction and powers with respect</tspan></text>
<text x="56" y="1588"><tspan class="k">to matters in the</tspan><tspan class="r"> Union list</tspan><tspan class="k"> can be</tspan><tspan class="r"> enlarged by the Parliament</tspan><tspan class="k">. Further, its jurisdiction</tspan></text>
<text x="56" y="1610"><tspan class="k">and powers with respect to other matters can be enlarged by a</tspan><tspan class="r"> special agreement of the</tspan></text>
<text x="56" y="1632"><tspan class="r">Centre and the states</tspan><tspan class="k">.</tspan></text>
</svg>
