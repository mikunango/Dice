<text class="r hd" x="40" y="100">ACTING, ADHOC AND RETIRED JUDGES</text>
<line x1="40" y1="106" x2="338" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="134"><tspan class="r" style="font-weight:700">Acting Chief Justice</tspan></text>
<text x="44" y="164"><tspan class="h" style="font-weight:700">Acting CJI:</tspan><tspan class="k"> The</tspan><tspan class="r"> President</tspan><tspan class="k"> can appoint a judge of the Supreme Court as an</tspan><tspan class="r"> acting Chief</tspan></text>
<text x="56" y="186"><tspan class="r">Justice of India</tspan><tspan class="k"> when:</tspan></text>
<text x="56" y="212" class="r" style="font-weight:700">1.</text>
<text x="78" y="212"><tspan class="h" style="font-weight:700">Vacancy:</tspan><tspan class="k"> the office of Chief Justice of India is</tspan><tspan class="r"> vacant</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="238" class="r" style="font-weight:700">2.</text>
<text x="78" y="238"><tspan class="h" style="font-weight:700">Temporary absence:</tspan><tspan class="k"> the Chief Justice of India is</tspan><tspan class="r"> temporarily absent</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="264" class="r" style="font-weight:700">3.</text>
<text x="78" y="264"><tspan class="h" style="font-weight:700">Inability:</tspan><tspan class="k"> the Chief Justice of India is</tspan><tspan class="r"> unable to perform</tspan><tspan class="k"> the duties of his/her</tspan></text>
<text x="78" y="286"><tspan class="k">office.</tspan></text>
<path d="M50 192 L44 192 L44 292 L50 292" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="314"><tspan class="r" style="font-weight:700">Ad hoc Judge</tspan></text>
<text x="44" y="344"><tspan class="h" style="font-weight:700">Ad hoc judge – lack of quorum:</tspan><tspan class="k"> When there is a</tspan><tspan class="r"> lack of quorum</tspan><tspan class="k"> of the permanent</tspan></text>
<text x="56" y="366"><tspan class="k">judges to hold or continue any session of the Supreme Court, the</tspan><tspan class="r"> Chief Justice of India</tspan></text>
<text x="56" y="388"><tspan class="k">can appoint a</tspan><tspan class="r"> judge of a High Court</tspan><tspan class="k"> as an</tspan><tspan class="r"> ad hoc judge</tspan><tspan class="k"> of the Supreme Court for a</tspan></text>
<text x="56" y="410"><tspan class="b">temporary period</tspan><tspan class="k">. He/she can do so only after consultation with the</tspan><tspan class="b"> chief justice of the</tspan></text>
<text x="56" y="432"><tspan class="b">High Court concerned</tspan><tspan class="k"> and with the</tspan><tspan class="r"> previous consent of the President</tspan><tspan class="k">. The judge so</tspan></text>
<text x="56" y="454"><tspan class="k">appointed should be</tspan><tspan class="b"> qualified for appointment as a judge of the Supreme Court</tspan><tspan class="k">. It is the</tspan></text>
<text x="56" y="476"><tspan class="k">duty of the judge so appointed to attend the sittings of the Supreme Court,</tspan><tspan class="b"> in priority to</tspan></text>
<text x="56" y="498"><tspan class="b">other duties</tspan><tspan class="k"> of his/her office. While so attending, he/she enjoys all the jurisdiction,</tspan></text>
<text x="56" y="520"><tspan class="k">powers and privileges (and discharges the duties) of a judge of the Supreme Court.</tspan></text>
<text class="sh" x="40" y="548"><tspan class="r" style="font-weight:700">Retired Judge</tspan></text>
<text x="44" y="578"><tspan class="h" style="font-weight:700">Retired judge on request:</tspan><tspan class="k"> At any time, the</tspan><tspan class="r"> chief justice of India</tspan><tspan class="k"> can request a</tspan><tspan class="r"> retired</tspan></text>
<text x="56" y="600"><tspan class="r">judge of the Supreme Court</tspan><tspan class="k"> or a</tspan><tspan class="r"> retired judge of a high court</tspan><tspan class="k"> (who is duly qualified for</tspan></text>
<text x="56" y="622"><tspan class="k">appointment as a judge of the Supreme Court) to act as a judge of the Supreme Court</tspan></text>
<text x="56" y="644"><tspan class="k">for a</tspan><tspan class="b"> temporary period</tspan><tspan class="k">. He/she can do so only with the</tspan><tspan class="r"> previous consent of the President</tspan></text>
<text x="56" y="666"><tspan class="k">and also of the</tspan><tspan class="r"> person to be so appointed</tspan><tspan class="k">. Such a judge is entitled to such allowances as</tspan></text>
<text x="56" y="688"><tspan class="k">the President may determine. He/she will also enjoy all the jurisdiction, powers and</tspan></text>
<text x="56" y="710"><tspan class="k">privileges of a judge of Supreme Court. But, he/she will</tspan><tspan class="r"> not otherwise be deemed to be a</tspan></text>
<text x="56" y="732"><tspan class="r">judge</tspan><tspan class="k"> of the Supreme Court.</tspan></text>
<text class="sm" x="115" y="762" text-anchor="middle"><tspan class="r" style="font-weight:700">Type</tspan></text>
<text class="sm" x="265" y="762" text-anchor="middle"><tspan class="r" style="font-weight:700">Appointed by</tspan></text>
<text class="sm" x="490" y="762" text-anchor="middle"><tspan class="r" style="font-weight:700">Condition / consent</tspan></text>
<line class="gx" x1="40" y1="773" x2="640" y2="773"/>
<text class="sm" x="47" y="793"><tspan class="k">Acting CJI</tspan></text>
<text class="sm" x="197" y="793"><tspan class="r">President</tspan></text>
<text class="sm" x="347" y="793"><tspan class="k">CJI post vacant / absent / unable</tspan></text>
<line class="gx" x1="40" y1="804" x2="640" y2="804"/>
<text class="sm" x="47" y="824"><tspan class="k">Ad hoc judge</tspan></text>
<text class="sm" x="197" y="824"><tspan class="r">CJI</tspan></text>
<text class="sm" x="347" y="824"><tspan class="k">lack of quorum · consult HC CJ ·</tspan><tspan class="b"> President’s</tspan></text>
<text class="sm" x="347" y="843"><tspan class="b">consent</tspan></text>
<line class="gx" x1="40" y1="854" x2="640" y2="854"/>
<text class="sm" x="47" y="874"><tspan class="k">Retired judge</tspan></text>
<text class="sm" x="197" y="874"><tspan class="r">CJI</tspan></text>
<text class="sm" x="347" y="874"><tspan class="b">President’s consent</tspan><tspan class="k"> + person’s consent</tspan></text>

<text class="r hd" x="40" y="919">SEAT AND PROCEDURE</text>
<line x1="40" y1="925" x2="215" y2="925" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="953"><tspan class="r" style="font-weight:700">Seat of Supreme Court</tspan></text>
<text x="44" y="983"><tspan class="h" style="font-weight:700">Seat – Delhi:</tspan><tspan class="k"> The Constitution declares</tspan><tspan class="r"> Delhi as the seat</tspan><tspan class="k"> of the Supreme Court. But, it</tspan></text>
<text x="56" y="1005"><tspan class="k">also authorises the</tspan><tspan class="r"> chief justice of India</tspan><tspan class="k"> to appoint</tspan><tspan class="b"> other place or places</tspan><tspan class="k"> as seat of the</tspan></text>
<text x="56" y="1027"><tspan class="k">Supreme Court. He/she can take decision in this regard only with the</tspan><tspan class="r"> approval of the</tspan></text>
<text x="56" y="1049"><tspan class="r">President</tspan><tspan class="k">. This provision is only</tspan><tspan class="r"> optional and not compulsory</tspan><tspan class="k">. This means that no court</tspan></text>
<text x="56" y="1071"><tspan class="k">can give any direction either to the President or to the Chief Justice to appoint any</tspan></text>
<text x="56" y="1093"><tspan class="k">other place as a seat of the Supreme Court.</tspan></text>
<text class="sh" x="40" y="1121"><tspan class="r" style="font-weight:700">Procedure of the Court</tspan></text>
<text x="44" y="1151"><tspan class="h" style="font-weight:700">Rules and benches:</tspan><tspan class="k"> The Supreme Court can, with the</tspan><tspan class="r"> approval of the President</tspan><tspan class="k">, make</tspan></text>
<text x="56" y="1173"><tspan class="k">rules for regulating generally the practice and procedure of the Court. The</tspan><tspan class="r"> Constitutional</tspan></text>
<text x="56" y="1195"><tspan class="r">cases</tspan><tspan class="k"> or references made by the President under</tspan><tspan class="r"> Article 143</tspan><tspan class="k"> are decided by a Bench</tspan></text>
<text x="56" y="1217"><tspan class="k">consisting of</tspan><tspan class="r"> at least five judges</tspan><tspan class="k">. All other cases are decided by</tspan><tspan class="b"> single judges and</tspan></text>
<text x="56" y="1239"><tspan class="b">division benches</tspan><tspan class="k">. The judgements are delivered by the</tspan><tspan class="r"> open court</tspan><tspan class="k">. All judgements are by</tspan></text>
<text x="56" y="1261"><tspan class="r">majority vote</tspan><tspan class="k"> but if differing, then judges can give</tspan><tspan class="b"> dissenting judgements or opinions</tspan><tspan class="k">.</tspan></text>
