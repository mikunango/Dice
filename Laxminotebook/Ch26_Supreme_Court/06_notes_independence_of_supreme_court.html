<div id="vis-container"><h2 class="sr-only">Independence of Supreme Court</h2>
<svg class="n" width="100%" viewBox="0 0 680 1458" role="img"><title>Independence of Supreme Court</title><desc>Independence of Supreme Court</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="189" y="26" width="301" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Independence of Supreme Court</text>
<text class="r hd" x="40" y="100">INDEPENDENCE OF SUPREME COURT</text>
<line x1="40" y1="106" x2="318" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Need for judicial independence:</tspan><tspan class="k"> The Supreme Court has been assigned a very significant</tspan></text>
<text x="56" y="156"><tspan class="k">role in the Indian democratic political system. It is a</tspan><tspan class="r"> federal court</tspan><tspan class="k">, the</tspan><tspan class="r"> highest court of</tspan></text>
<text x="56" y="178"><tspan class="r">appeal</tspan><tspan class="k">, the</tspan><tspan class="r"> guarantor of the fundamental rights</tspan><tspan class="k"> of the citizens and</tspan><tspan class="r"> guardian of the</tspan></text>
<text x="56" y="200"><tspan class="r">Constitution</tspan><tspan class="k">. Therefore, its</tspan><tspan class="r"> independence</tspan><tspan class="k"> becomes very essential for the effective</tspan></text>
<text x="56" y="222"><tspan class="k">discharge of the duties assigned to it. It should be free from the encroachments,</tspan></text>
<text x="56" y="244"><tspan class="k">pressures and interferences of the</tspan><tspan class="b"> executive (council of ministers)</tspan><tspan class="k"> and the</tspan><tspan class="b"> Legislature</tspan></text>
<text x="56" y="266"><tspan class="b">(Parliament)</tspan><tspan class="k">. It should be allowed to do justice</tspan><tspan class="r"> without fear or favour</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="272" x2="340" y2="284"/>
<line class="ln" x1="115" y1="284" x2="565" y2="284"/>
<line class="ln" x1="115" y1="284" x2="115" y2="300" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="284" x2="265" y2="300" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="284" x2="415" y2="300" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="284" x2="565" y2="300" marker-end="url(#ah)"/>
<text class="sm" x="115" y="320" text-anchor="middle"><tspan class="r">federal court</tspan></text>
<text class="sm" x="265" y="320" text-anchor="middle"><tspan class="r">highest court of</tspan></text>
<text class="sm" x="265" y="338" text-anchor="middle"><tspan class="r">appeal</tspan></text>
<text class="sm" x="415" y="320" text-anchor="middle"><tspan class="r">guarantor of FRs</tspan></text>
<text class="sm" x="565" y="320" text-anchor="middle"><tspan class="r">guardian of</tspan></text>
<text class="sm" x="565" y="338" text-anchor="middle"><tspan class="r">Constitution</tspan></text>
<text x="44" y="370"><tspan class="h" style="font-weight:700">Safeguards of independence:</tspan><tspan class="k"> The Constitution has made the following provisions to</tspan></text>
<text x="56" y="392"><tspan class="k">safeguard and ensure the</tspan><tspan class="r"> independent and impartial functioning</tspan><tspan class="k"> of the Supreme Court:</tspan></text>
<text x="56" y="418" class="r" style="font-weight:700">1.</text>
<text x="78" y="418"><tspan class="h" style="font-weight:700">Mode of Appointment:</tspan><tspan class="k"> The judges of the Supreme Court are appointed by the</tspan></text>
<text x="78" y="440"><tspan class="r">President (which means the cabinet)</tspan><tspan class="k"> in consultation with the</tspan><tspan class="r"> members of the</tspan></text>
<text x="78" y="462"><tspan class="r">judiciary itself</tspan><tspan class="k"> (ie, judges of the Supreme Court and the high courts). This provision</tspan></text>
<text x="78" y="484"><tspan class="b">curtails the absolute discretion of the executive</tspan><tspan class="k"> as well as ensures that the judicial</tspan></text>
<text x="78" y="506"><tspan class="k">appointments are not based on any political or practical considerations.</tspan></text>
<text x="56" y="532" class="r" style="font-weight:700">2.</text>
<text x="78" y="532"><tspan class="h" style="font-weight:700">Security of Tenure:</tspan><tspan class="k"> The judges of the Supreme Court are provided with the</tspan><tspan class="r"> Security</tspan></text>
<text x="78" y="554"><tspan class="r">of Tenure</tspan><tspan class="k">. They can be removed from office by the President only in the manner</tspan></text>
<text x="78" y="576"><tspan class="k">and on the grounds mentioned in the Constitution. This means that they</tspan><tspan class="r"> do not</tspan></text>
<text x="78" y="598"><tspan class="r">hold their office during the pleasure of the President</tspan><tspan class="k">, though they are appointed by</tspan></text>
<text x="78" y="620"><tspan class="k">him/her. This is obvious from the fact that</tspan><tspan class="b"> no judge of the Supreme Court has</tspan></text>
<text x="78" y="642"><tspan class="b">been removed (or impeached) so far</tspan><tspan class="k">.</tspan></text>
<text x="56" y="668" class="r" style="font-weight:700">3.</text>
<text x="78" y="668"><tspan class="h" style="font-weight:700">Fixed Service Conditions:</tspan><tspan class="k"> The salaries, allowances, privileges, leave and pension of</tspan></text>
<text x="78" y="690"><tspan class="k">the judges of the Supreme Court are determined from time to time by the</tspan></text>
<text x="78" y="712"><tspan class="k">Parliament. They</tspan><tspan class="r"> cannot be changed to their disadvantage</tspan><tspan class="k"> after their appointment</tspan></text>
<text x="78" y="734"><tspan class="k">except during a</tspan><tspan class="r"> financial emergency</tspan><tspan class="k">. Thus, the conditions of service of the judges of</tspan></text>
<text x="78" y="756"><tspan class="k">the Supreme Court remain same during their term of Office.</tspan></text>
<text x="56" y="782" class="r" style="font-weight:700">4.</text>
<text x="78" y="782"><tspan class="h" style="font-weight:700">Expenses Charged on Consolidated Fund:</tspan><tspan class="k"> The salaries, allowances and pensions of</tspan></text>
<text x="78" y="804"><tspan class="k">the judges and the staff as well as all the administrative expenses of the Supreme</tspan></text>
<text x="78" y="826"><tspan class="k">Court are</tspan><tspan class="r"> charged on the Consolidated Fund of India</tspan><tspan class="k">. Thus, they are</tspan><tspan class="r"> non-votable</tspan><tspan class="k"> by</tspan></text>
<text x="78" y="848"><tspan class="k">the Parliament (</tspan><tspan class="b">though they can be discussed by it</tspan><tspan class="k">).</tspan></text>
<text x="56" y="874" class="r" style="font-weight:700">5.</text>
<text x="78" y="874"><tspan class="h" style="font-weight:700">Conduct of Judges cannot be Discussed:</tspan><tspan class="k"> The Constitution</tspan><tspan class="r"> prohibits any discussion</tspan></text>
<text x="78" y="896"><tspan class="k">in Parliament or in a State Legislature with respect to the conduct of the judges of</tspan></text>
<text x="78" y="918"><tspan class="k">the Supreme Court in the discharge of their duties, except when an</tspan><tspan class="r"> impeachment</tspan></text>
<text x="78" y="940"><tspan class="r">motion</tspan><tspan class="k"> is under consideration of the Parliament.</tspan></text>
<text x="56" y="966" class="r" style="font-weight:700">6.</text>
<text x="78" y="966"><tspan class="h" style="font-weight:700">Ban on Practice after Retirement:</tspan><tspan class="k"> The retired judges of the Supreme Court are</tspan></text>
<text x="78" y="988"><tspan class="r">prohibited from pleading or acting in any Court</tspan><tspan class="k"> or before any authority within the</tspan></text>
<text x="78" y="1010"><tspan class="k">territory of India. This ensures that they do not favour any one in the hope of</tspan></text>
<text x="78" y="1032"><tspan class="k">future favour.</tspan></text>
<text x="56" y="1058" class="r" style="font-weight:700">7.</text>
<text x="78" y="1058"><tspan class="h" style="font-weight:700">Power to Punish for its Contempt:</tspan><tspan class="k"> The Supreme Court can</tspan><tspan class="r"> punish any person for</tspan></text>
<text x="78" y="1080"><tspan class="r">its contempt</tspan><tspan class="k">. Thus, its actions and decisions cannot be criticised and opposed by</tspan></text>
<text x="78" y="1102"><tspan class="k">any body. This power is vested in the Supreme Court to maintain its</tspan><tspan class="b"> authority,</tspan></text>
<text x="78" y="1124"><tspan class="b">dignity and honour</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1150" class="r" style="font-weight:700">8.</text>
<text x="78" y="1150"><tspan class="h" style="font-weight:700">Freedom to Appoint its Staff:</tspan><tspan class="k"> The</tspan><tspan class="r"> Chief Justice of India</tspan><tspan class="k"> can appoint officers and</tspan></text>
<text x="78" y="1172"><tspan class="k">servants of the Supreme Court</tspan><tspan class="r"> without any interference from the executive</tspan><tspan class="k">. He/she</tspan></text>
<text x="78" y="1194"><tspan class="k">can also prescribe their conditions of service.</tspan></text>
<text x="56" y="1220" class="r" style="font-weight:700">9.</text>
<text x="78" y="1220"><tspan class="h" style="font-weight:700">Its Jurisdiction cannot be Curtailed:</tspan><tspan class="k"> The Parliament is</tspan><tspan class="r"> not authorised to curtail</tspan></text>
<text x="78" y="1242"><tspan class="k">the jurisdiction and powers of the Supreme Court. The Constitution has guaranteed</tspan></text>
<text x="78" y="1264"><tspan class="k">to the Supreme Court, jurisdiction of various kinds. However, the</tspan><tspan class="r"> Parliament can</tspan></text>
<text x="78" y="1286"><tspan class="r">extend the same</tspan><tspan class="k">.</tspan></text>
<path d="M50 398 L44 398 L44 1292 L50 1292" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="1298" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="96" y="1327" text-anchor="middle"><tspan class="r">appointment</tspan></text>
<text class="xs" x="96" y="1345" text-anchor="middle"><tspan class="k">with judiciary</tspan></text>
<rect class="bx" x="162" y="1298" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="218" y="1327" text-anchor="middle"><tspan class="r">tenure</tspan></text>
<text class="xs" x="218" y="1345" text-anchor="middle"><tspan class="k">not at pleasure</tspan></text>
<rect class="bx" x="284" y="1298" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="340" y="1318" text-anchor="middle"><tspan class="r">service</tspan></text>
<text class="xs" x="340" y="1336" text-anchor="middle"><tspan class="k">no adverse</tspan></text>
<text class="xs" x="340" y="1354" text-anchor="middle"><tspan class="k">change</tspan></text>
<rect class="bx" x="406" y="1298" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="462" y="1327" text-anchor="middle"><tspan class="r">expenses</tspan></text>
<text class="xs" x="462" y="1345" text-anchor="middle"><tspan class="k">charged on CFI</tspan></text>
<rect class="bx" x="528" y="1298" width="112" height="68" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="584" y="1327" text-anchor="middle"><tspan class="r">conduct</tspan></text>
<text class="xs" x="584" y="1345" text-anchor="middle"><tspan class="k">no discussion</tspan></text>
<rect class="bx" x="40" y="1378" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="1398" text-anchor="middle"><tspan class="r">no practice</tspan></text>
<text class="xs" x="111" y="1416" text-anchor="middle"><tspan class="k">after retirement</tspan></text>
<rect class="bx" x="192" y="1378" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="1398" text-anchor="middle"><tspan class="r">contempt</tspan></text>
<text class="xs" x="264" y="1416" text-anchor="middle"><tspan class="k">power to punish</tspan></text>
<rect class="bx" x="345" y="1378" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="1398" text-anchor="middle"><tspan class="r">staff</tspan></text>
<text class="xs" x="416" y="1416" text-anchor="middle"><tspan class="k">CJI appoints</tspan></text>
<rect class="bx" x="498" y="1378" width="142" height="50" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="1398" text-anchor="middle"><tspan class="r">jurisdiction</tspan></text>
<text class="xs" x="569" y="1416" text-anchor="middle"><tspan class="k">cannot be curtailed</tspan></text>
</svg>
