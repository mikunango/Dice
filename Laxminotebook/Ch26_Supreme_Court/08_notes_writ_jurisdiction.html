<div id="vis-container"><h2 class="sr-only">Writ Jurisdiction</h2>
<svg class="n" width="100%" viewBox="0 0 680 1112" role="img"><title>Writ Jurisdiction</title><desc>Writ Jurisdiction</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="248" y="26" width="184" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Writ Jurisdiction</text>
<text class="lb" x="40" y="98">2. Writ Jurisdiction</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Guarantor of Fundamental Rights:</tspan><tspan class="k"> The Constitution has constituted the Supreme Court</tspan></text>
<text x="56" y="150"><tspan class="k">as the</tspan><tspan class="r"> guarantor and defender of the fundamental rights</tspan><tspan class="k"> of the citizens. The Supreme</tspan></text>
<text x="56" y="172"><tspan class="k">Court is empowered to issue</tspan><tspan class="r"> writs</tspan><tspan class="k"> including</tspan><tspan class="b"> habeas corpus, mandamus, prohibition, quo</tspan></text>
<text x="56" y="194"><tspan class="b">warranto and certiorari</tspan><tspan class="k"> for the enforcement of the fundamental rights of an aggrieved</tspan></text>
<text x="56" y="216"><tspan class="k">citizen. In this regard, the Supreme Court has</tspan><tspan class="r"> original jurisdiction</tspan><tspan class="k"> in the sense that an</tspan></text>
<text x="56" y="238"><tspan class="k">aggrieved citizen can</tspan><tspan class="b"> directly go to the Supreme Court</tspan><tspan class="k">, not necessarily by way of appeal.</tspan></text>
<text x="56" y="260"><tspan class="k">However, the writ jurisdiction of the Supreme Court is</tspan><tspan class="r"> not exclusive</tspan><tspan class="k">. The</tspan><tspan class="r"> high courts</tspan><tspan class="k"> are</tspan></text>
<text x="56" y="282"><tspan class="k">also empowered to issue writs for the enforcement of the Fundamental Rights. It means,</tspan></text>
<text x="56" y="304"><tspan class="k">when the Fundamental Rights of a citizen are violated, the aggrieved party has the</tspan></text>
<text x="56" y="326"><tspan class="b">option of moving either the high court or the Supreme Court directly</tspan><tspan class="k">.</tspan></text>
<line class="ln" x1="340" y1="332" x2="340" y2="344"/>
<line class="ln" x1="100" y1="344" x2="580" y2="344"/>
<line class="ln" x1="100" y1="344" x2="100" y2="360" marker-end="url(#ah)"/>
<line class="ln" x1="220" y1="344" x2="220" y2="360" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="344" x2="340" y2="360" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="344" x2="460" y2="360" marker-end="url(#ah)"/>
<line class="ln" x1="580" y1="344" x2="580" y2="360" marker-end="url(#ah)"/>
<text class="xs" x="100" y="380" text-anchor="middle"><tspan class="b">habeas corpus</tspan></text>
<text class="xs" x="220" y="380" text-anchor="middle"><tspan class="b">mandamus</tspan></text>
<text class="xs" x="340" y="380" text-anchor="middle"><tspan class="b">prohibition</tspan></text>
<text class="xs" x="460" y="380" text-anchor="middle"><tspan class="b">quo warranto</tspan></text>
<text class="xs" x="580" y="380" text-anchor="middle"><tspan class="b">certiorari</tspan></text>
<text x="44" y="412"><tspan class="h" style="font-weight:700">Exclusive vs concurrent original jurisdiction:</tspan><tspan class="k"> Therefore, the original jurisdiction of the</tspan></text>
<text x="56" y="434"><tspan class="k">Supreme Court with regard to</tspan><tspan class="r"> federal disputes</tspan><tspan class="k"> is different from its original jurisdiction</tspan></text>
<text x="56" y="456"><tspan class="k">with regard to disputes relating to</tspan><tspan class="r"> fundamental rights</tspan><tspan class="k">. In the first case, it is</tspan><tspan class="r"> exclusive</tspan></text>
<text x="56" y="478"><tspan class="k">and in the second case, it is</tspan><tspan class="r"> concurrent with high courts</tspan><tspan class="k"> jurisdiction. Moreover, the</tspan></text>
<text x="56" y="500"><tspan class="k">parties involved in the first case are</tspan><tspan class="b"> units of the federation (Centre and states)</tspan><tspan class="k"> while</tspan></text>
<text x="56" y="522"><tspan class="k">the dispute in the second case is between a</tspan><tspan class="b"> citizen and the Government (Central or</tspan></text>
<text x="56" y="544"><tspan class="b">state)</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="558" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="576" text-anchor="middle"><tspan class="r" style="font-weight:700">Federal disputes</tspan></text>
<line class="ln" x1="190" y1="586" x2="190" y2="600" marker-end="url(#ah)"/>
<text class="sm" x="190" y="621" text-anchor="middle"><tspan class="r">exclusive</tspan></text>
<text class="sm" x="190" y="643" text-anchor="middle"><tspan class="k">Centre vs states</tspan></text>
<rect class="bx" x="346" y="558" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="576" text-anchor="middle"><tspan class="r" style="font-weight:700">Fundamental Rights</tspan></text>
<line class="ln" x1="490" y1="586" x2="490" y2="600" marker-end="url(#ah)"/>
<text class="sm" x="490" y="621" text-anchor="middle"><tspan class="r">concurrent</tspan><tspan class="k"> with HCs</tspan></text>
<text class="sm" x="490" y="643" text-anchor="middle"><tspan class="k">citizen vs Government</tspan></text>
<line x1="340" y1="558" x2="340" y2="646" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="680"><tspan class="h" style="font-weight:700">SC vs HC writ jurisdiction:</tspan><tspan class="k"> There is also a difference between the writ jurisdiction of</tspan></text>
<text x="56" y="702"><tspan class="k">the Supreme Court and that of the high court. The Supreme Court can issue writs</tspan><tspan class="r"> only</tspan></text>
<text x="56" y="724"><tspan class="r">for the enforcement of the Fundamental Rights</tspan><tspan class="k"> and not for other purposes. The high</tspan></text>
<text x="56" y="746"><tspan class="k">court, on the other hand, can issue writs not only for the enforcement of the</tspan></text>
<text x="56" y="768"><tspan class="k">fundamental rights but also</tspan><tspan class="r"> for other purposes</tspan><tspan class="k">. It means that the writ jurisdiction of the</tspan></text>
<text x="56" y="790"><tspan class="r">high court is wider</tspan><tspan class="k"> than that of the Supreme Court. But, the</tspan><tspan class="b"> Parliament can confer on</tspan></text>
<text x="56" y="812"><tspan class="b">the Supreme Court, the power to issue writs for other purposes also</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="46" y="826" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="844" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court writs</tspan></text>
<line class="ln" x1="190" y1="854" x2="190" y2="868" marker-end="url(#ah)"/>
<text class="sm" x="190" y="889" text-anchor="middle"><tspan class="k">only Fundamental Rights</tspan></text>
<text class="sm" x="190" y="911" text-anchor="middle"><tspan class="b">Parliament may widen</tspan></text>
<rect class="bx" x="346" y="826" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="844" text-anchor="middle"><tspan class="r" style="font-weight:700">High Court writs</tspan></text>
<line class="ln" x1="490" y1="854" x2="490" y2="868" marker-end="url(#ah)"/>
<text class="sm" x="490" y="889" text-anchor="middle"><tspan class="k">FRs</tspan><tspan class="r"> + other purposes</tspan></text>
<text class="sm" x="490" y="911" text-anchor="middle"><tspan class="r">wider</tspan></text>
<line x1="340" y1="826" x2="340" y2="914" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<ellipse cx="340" cy="998" rx="250" ry="58" fill="none" stroke="#2F6FDB" stroke-width="1.5"/>
<ellipse cx="435" cy="998" rx="125" ry="38" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="sm" x="190" y="994" text-anchor="middle"><tspan class="r" style="font-weight:700">High Court writs</tspan><tspan class="k"> – FRs +</tspan></text>
<text class="sm" x="190" y="1012" text-anchor="middle"><tspan class="k">other purposes</tspan></text>
<text class="sm" x="435" y="1003" text-anchor="middle"><tspan class="r" style="font-weight:700">Supreme Court writs</tspan><tspan class="k"> – only FRs</tspan></text>
<text class="xs" x="340" y="1068" text-anchor="middle"><tspan class="b">writ jurisdiction of the high court is wider than that of the Supreme Court (Parliament may widen SC’s</tspan></text>
<text class="xs" x="340" y="1086" text-anchor="middle"><tspan class="b">power)</tspan></text>
</svg>
</div></body></html>
