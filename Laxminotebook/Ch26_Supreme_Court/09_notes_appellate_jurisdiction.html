<div id="vis-container"><h2 class="sr-only">Appellate Jurisdiction</h2>
<svg class="n" width="100%" viewBox="0 0 680 1786" role="img"><title>Appellate Jurisdiction</title><desc>Appellate Jurisdiction</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="228" y="26" width="224" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Appellate Jurisdiction</text>
<text class="lb" x="40" y="98">3. Appellate Jurisdiction</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Highest court of appeal:</tspan><tspan class="k"> As mentioned earlier, the Supreme Court has not only</tspan></text>
<text x="56" y="150"><tspan class="k">succeeded the</tspan><tspan class="r"> Federal Court of India</tspan><tspan class="k"> but also replaced the</tspan><tspan class="r"> British Privy Council</tspan><tspan class="k"> as the</tspan></text>
<text x="56" y="172"><tspan class="r">highest court of appeal</tspan><tspan class="k">. The Supreme Court is primarily a</tspan><tspan class="r"> court of appeal</tspan><tspan class="k"> and hears</tspan></text>
<text x="56" y="194"><tspan class="k">appeals against the judgements of the High courts. It enjoys a wide appellate jurisdiction</tspan></text>
<text x="56" y="216"><tspan class="k">which can be classified under</tspan><tspan class="r"> four heads</tspan><tspan class="k">:</tspan></text>
<text x="56" y="242" class="r" style="font-weight:700">(a)</text>
<text x="89" y="242"><tspan class="k">Appeals in constitutional matters.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(b)</text>
<text x="89" y="268"><tspan class="k">Appeals in civil matters.</tspan></text>
<text x="56" y="294" class="r" style="font-weight:700">(c)</text>
<text x="89" y="294"><tspan class="k">Appeals in criminal matters.</tspan></text>
<text x="56" y="320" class="r" style="font-weight:700">(d)</text>
<text x="89" y="320"><tspan class="k">Appeals by special leave.</tspan></text>
<path d="M50 222 L44 222 L44 326 L50 326" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="326" x2="340" y2="338"/>
<line class="ln" x1="115" y1="338" x2="565" y2="338"/>
<line class="ln" x1="115" y1="338" x2="115" y2="354" marker-end="url(#ah)"/>
<line class="ln" x1="265" y1="338" x2="265" y2="354" marker-end="url(#ah)"/>
<line class="ln" x1="415" y1="338" x2="415" y2="354" marker-end="url(#ah)"/>
<line class="ln" x1="565" y1="338" x2="565" y2="354" marker-end="url(#ah)"/>
<text class="sm" x="115" y="374" text-anchor="middle"><tspan class="r">Constitutional</tspan></text>
<text class="sm" x="265" y="374" text-anchor="middle"><tspan class="r">Civil</tspan></text>
<text class="sm" x="415" y="374" text-anchor="middle"><tspan class="r">Criminal</tspan></text>
<text class="sm" x="565" y="374" text-anchor="middle"><tspan class="r">Special leave</tspan></text>
<text class="sh" x="40" y="406"><tspan class="r" style="font-weight:700">(a) Constitutional Matters</tspan></text>
<text x="44" y="436"><tspan class="h" style="font-weight:700">HC certificate – constitutional question:</tspan><tspan class="k"> In the constitutional cases, an appeal can be</tspan></text>
<text x="56" y="458"><tspan class="k">made to the Supreme Court against the judgement of a high court if the</tspan><tspan class="r"> high court</tspan></text>
<text x="56" y="480"><tspan class="r">certifies</tspan><tspan class="k"> that the case involves a</tspan><tspan class="r"> substantial question of law that requires the</tspan></text>
<text x="56" y="502"><tspan class="r">interpretation of the Constitution</tspan><tspan class="k">. Based on the certificate, the party in the case can</tspan></text>
<text x="56" y="524"><tspan class="k">appeal to the Supreme Court on the ground that the question has been wrongly decided.</tspan></text>
<text class="sh" x="40" y="552"><tspan class="r" style="font-weight:700">(b) Civil Matters</tspan></text>
<text x="44" y="582"><tspan class="h" style="font-weight:700">HC certificate – civil cases:</tspan><tspan class="k"> In civil cases, an appeal lies to the Supreme Court from</tspan></text>
<text x="56" y="604"><tspan class="k">any judgement of a high court if the high court certifies—</tspan></text>
<text x="56" y="630" class="r" style="font-weight:700">(i)</text>
<text x="89" y="630"><tspan class="h" style="font-weight:700">Question of general importance:</tspan><tspan class="k"> that the case involves a</tspan><tspan class="r"> substantial question of</tspan></text>
<text x="89" y="652"><tspan class="r">law of general importance</tspan><tspan class="k">; and</tspan></text>
<text x="56" y="678" class="r" style="font-weight:700">(ii)</text>
<text x="89" y="678"><tspan class="h" style="font-weight:700">Needs SC decision:</tspan><tspan class="k"> that the question</tspan><tspan class="r"> needs to be decided by the Supreme Court</tspan><tspan class="k">.</tspan></text>
<path d="M50 610 L44 610 L44 684 L50 684" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="706"><tspan class="h" style="font-weight:700">30th Amendment – no monetary limit:</tspan><tspan class="k"> Originally, only those civil cases that involved a</tspan></text>
<text x="56" y="728"><tspan class="k">sum of</tspan><tspan class="r"> not less than ₹20,000</tspan><tspan class="k"> could be appealed before the Supreme Court. But this</tspan></text>
<text x="56" y="750"><tspan class="k">monetary limit was</tspan><tspan class="r"> removed by the 30th Constitutional Amendment Act of 1972</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="778"><tspan class="r" style="font-weight:700">(c) Criminal Matters</tspan></text>
<text x="44" y="808"><tspan class="h" style="font-weight:700">Criminal appeals:</tspan><tspan class="k"> The Supreme Court hears appeals against the judgement in a criminal</tspan></text>
<text x="56" y="830"><tspan class="k">proceeding of a high court if the high court—</tspan></text>
<text x="56" y="856" class="r" style="font-weight:700">(i)</text>
<text x="93" y="856"><tspan class="h" style="font-weight:700">Acquittal reversed – death sentence:</tspan><tspan class="k"> has on appeal</tspan><tspan class="r"> reversed an order of</tspan></text>
<text x="93" y="878"><tspan class="r">acquittal</tspan><tspan class="k"> of an accused person and</tspan><tspan class="r"> sentenced him/her to death</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="904" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="904"><tspan class="h" style="font-weight:700">Case withdrawn – death sentence:</tspan><tspan class="k"> has</tspan><tspan class="r"> taken before itself any case</tspan><tspan class="k"> from any</tspan></text>
<text x="93" y="926"><tspan class="k">subordinate court and convicted the accused person and</tspan><tspan class="r"> sentenced him/her to</tspan></text>
<text x="93" y="948"><tspan class="r">death</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="974" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="974"><tspan class="h" style="font-weight:700">Fit case certificate:</tspan><tspan class="r"> certifies</tspan><tspan class="k"> that the case is a fit one for appeal to the Supreme</tspan></text>
<text x="93" y="996"><tspan class="k">Court.</tspan></text>
<path d="M50 836 L44 836 L44 1002 L50 1002" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1024"><tspan class="h" style="font-weight:700">Appeal as of right:</tspan><tspan class="k"> In the</tspan><tspan class="r"> first two cases</tspan><tspan class="k">, an appeal lies to the Supreme Court</tspan><tspan class="r"> as a</tspan></text>
<text x="56" y="1046"><tspan class="r">matter of right</tspan><tspan class="k"> (ie, without any certificate of the high court). But if the high court has</tspan></text>
<text x="56" y="1068"><tspan class="b">reversed the order of conviction and has ordered the acquittal</tspan><tspan class="k"> of the accused, there is</tspan><tspan class="r"> no</tspan></text>
<text x="56" y="1090"><tspan class="r">right to appeal</tspan><tspan class="k"> to the Supreme Court.</tspan></text>
<text x="44" y="1118"><tspan class="h" style="font-weight:700">1970 enlargement:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1970</tspan><tspan class="k">, the Parliament had</tspan><tspan class="r"> enlarged the Criminal Appellate</tspan></text>
<text x="56" y="1140"><tspan class="r">Jurisdiction</tspan><tspan class="k"> of the Supreme Court. Accordingly, an appeal lies to the Supreme Court from</tspan></text>
<text x="56" y="1162"><tspan class="k">the judgement of a high court if the high court:</tspan></text>
<text x="56" y="1188" class="r" style="font-weight:700">(i)</text>
<text x="89" y="1188"><tspan class="h" style="font-weight:700">Acquittal reversed – life/10 years:</tspan><tspan class="k"> has on appeal, reversed an order of acquittal</tspan></text>
<text x="89" y="1210"><tspan class="k">of an accused person and sentenced him/her to</tspan><tspan class="r"> imprisonment for life or for ten</tspan></text>
<text x="89" y="1232"><tspan class="r">years</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="1258" class="r" style="font-weight:700">(ii)</text>
<text x="89" y="1258"><tspan class="h" style="font-weight:700">Case withdrawn – life/10 years:</tspan><tspan class="k"> has taken before itself any case from any</tspan></text>
<text x="89" y="1280"><tspan class="k">subordinate court and convicted the accused person and sentenced him/her to</tspan></text>
<text x="89" y="1302"><tspan class="r">imprisonment for life or for ten years</tspan><tspan class="k">.</tspan></text>
<path d="M50 1168 L44 1168 L44 1308 L50 1308" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="1330"><tspan class="r" style="font-weight:700">(d) Appeal by Special Leave</tspan></text>
<text x="44" y="1360"><tspan class="h" style="font-weight:700">Special Leave Petition (Art. 136):</tspan><tspan class="k"> The Supreme Court is authorised to grant in its</tspan></text>
<text x="56" y="1382"><tspan class="r">discretion special leave to appeal</tspan><tspan class="k"> from any judgement in any matter passed by</tspan><tspan class="r"> any court</tspan></text>
<text x="56" y="1404"><tspan class="r">or tribunal</tspan><tspan class="k"> in the country (</tspan><tspan class="b">except military tribunal and court martial</tspan><tspan class="k">). This provision</tspan></text>
<text x="56" y="1426"><tspan class="k">contains the four aspects as under:</tspan></text>
<text x="56" y="1452" class="r" style="font-weight:700">(i)</text>
<text x="93" y="1452"><tspan class="h" style="font-weight:700">Discretionary:</tspan><tspan class="k"> It is a</tspan><tspan class="r"> discretionary power</tspan><tspan class="k"> and hence, cannot be claimed as a</tspan></text>
<text x="93" y="1474"><tspan class="k">matter of right.</tspan></text>
<text x="56" y="1500" class="r" style="font-weight:700">(ii)</text>
<text x="93" y="1500"><tspan class="h" style="font-weight:700">Final or interlocutory:</tspan><tspan class="k"> It can be granted in any judgement whether</tspan><tspan class="r"> final or</tspan></text>
<text x="93" y="1522"><tspan class="r">interlocutory</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1548" class="r" style="font-weight:700">(iii)</text>
<text x="93" y="1548"><tspan class="h" style="font-weight:700">Any subject matter:</tspan><tspan class="k"> It may be related to</tspan><tspan class="r"> any matter</tspan><tspan class="k">—constitutional, civil,</tspan></text>
<text x="93" y="1570"><tspan class="k">criminal, income-tax, labour, revenue, advocates, etc.</tspan></text>
<text x="56" y="1596" class="r" style="font-weight:700">(iv)</text>
<text x="93" y="1596"><tspan class="h" style="font-weight:700">Any court or tribunal:</tspan><tspan class="k"> It can be granted against</tspan><tspan class="r"> any court or tribunal</tspan><tspan class="k"> and not</tspan></text>
<text x="93" y="1618"><tspan class="k">necessarily against a high court (</tspan><tspan class="b">of course, except a military court</tspan><tspan class="k">).</tspan></text>
<path d="M50 1432 L44 1432 L44 1624 L50 1624" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1646"><tspan class="h" style="font-weight:700">Plenary jurisdiction – used sparingly:</tspan><tspan class="k"> Thus, the scope of this provision is very wide and</tspan></text>
<text x="56" y="1668"><tspan class="k">it vests the Supreme Court with a</tspan><tspan class="r"> plenary jurisdiction</tspan><tspan class="k"> to hear appeals. On the exercise of</tspan></text>
<text x="56" y="1690"><tspan class="k">this power, the Supreme Court itself held that ‘</tspan><tspan class="b">being an exceptional and overriding</tspan></text>
<text x="56" y="1712"><tspan class="b">power, it has to be exercised sparingly and with caution and only in special extraordinary</tspan></text>
<text x="56" y="1734"><tspan class="b">situations. Beyond that it is not possible to fetter the exercise of this power by any set</tspan></text>
<text x="56" y="1756"><tspan class="b">formula or rule</tspan><tspan class="k">’.</tspan></text>
</svg>
