<title>Tenure and Removal</title>

<div id="vis-container"><h2 class="sr-only">Tenure and Removal</h2>
<svg class="n" width="100%" viewBox="0 0 680 1321" role="img"><title>Tenure and Removal</title><desc>Tenure and Removal</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="235" y="26" width="211" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Tenure and Removal</text>
<text class="r hd" x="40" y="100">TENURE AND REMOVAL</text>
<line x1="40" y1="106" x2="217" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text class="sh" x="40" y="134"><tspan class="r" style="font-weight:700">Tenure of Judges</tspan></text>
<text x="44" y="164"><tspan class="h" style="font-weight:700">No fixed tenure:</tspan><tspan class="k"> The Constitution has</tspan><tspan class="r"> not fixed the tenure</tspan><tspan class="k"> of a judge of the Supreme</tspan></text>
<text x="56" y="186"><tspan class="k">Court. However, it makes the following three provisions in this regard:</tspan></text>
<text x="56" y="212" class="r" style="font-weight:700">1.</text>
<text x="78" y="212"><tspan class="h" style="font-weight:700">Age 65:</tspan><tspan class="k"> He/she holds office until he/she attains the</tspan><tspan class="r"> age of 65 years</tspan><tspan class="k">. Any question</tspan></text>
<text x="78" y="234"><tspan class="k">regarding his/her age is to be determined by such authority and in such manner as</tspan></text>
<text x="78" y="256"><tspan class="k">provided by</tspan><tspan class="b"> Parliament</tspan><tspan class="k">.</tspan></text>
<text x="56" y="282" class="r" style="font-weight:700">2.</text>
<text x="78" y="282"><tspan class="h" style="font-weight:700">Resignation:</tspan><tspan class="k"> He/she can</tspan><tspan class="r"> resign</tspan><tspan class="k"> from his/her office by writing to the</tspan><tspan class="r"> President</tspan><tspan class="k">.</tspan></text>
<text x="56" y="308" class="r" style="font-weight:700">3.</text>
<text x="78" y="308"><tspan class="h" style="font-weight:700">Removal:</tspan><tspan class="k"> He/she can be</tspan><tspan class="r"> removed</tspan><tspan class="k"> from his/her office by the President on the</tspan></text>
<text x="78" y="330"><tspan class="r">recommendation of the Parliament</tspan><tspan class="k">.</tspan></text>
<path d="M50 192 L44 192 L44 336 L50 336" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="358"><tspan class="r" style="font-weight:700">Removal of Judges</tspan></text>
<text x="44" y="388"><tspan class="h" style="font-weight:700">Removal by special majority:</tspan><tspan class="k"> A judge of the Supreme Court can be removed from</tspan></text>
<text x="56" y="410"><tspan class="k">his/her Office by an</tspan><tspan class="r"> order of the President</tspan><tspan class="k">. The President can issue the removal order</tspan></text>
<text x="56" y="432"><tspan class="k">only after an</tspan><tspan class="r"> address by Parliament</tspan><tspan class="k"> has been presented to him/her in the</tspan><tspan class="b"> same session</tspan></text>
<text x="56" y="454"><tspan class="k">for such removal. The address must be supported by a</tspan><tspan class="r"> special majority of each House</tspan><tspan class="k"> of</tspan></text>
<text x="56" y="476"><tspan class="k">Parliament (</tspan><tspan class="b">ie, a majority of the total membership of that House and a majority of not</tspan></text>
<text x="56" y="498"><tspan class="b">less than two-thirds of the members of that House present and voting</tspan><tspan class="k">). The grounds of</tspan></text>
<text x="56" y="520"><tspan class="k">removal are two—</tspan><tspan class="r">proved misbehaviour or incapacity</tspan><tspan class="k">.</tspan></text>
<text x="44" y="548"><tspan class="h" style="font-weight:700">Judges Enquiry Act, 1968:</tspan><tspan class="k"> The</tspan><tspan class="r"> Judges Enquiry Act (1968)</tspan><tspan class="k"> regulates the procedure</tspan></text>
<text x="56" y="570"><tspan class="k">relating to the removal of a judge of the Supreme Court by the process of</tspan></text>
<text x="56" y="592"><tspan class="r">impeachment⁶</tspan><tspan class="k">:</tspan></text>
<text x="56" y="618" class="r" style="font-weight:700">1.</text>
<text x="78" y="618"><tspan class="h" style="font-weight:700">Removal motion – 100 LS / 50 RS:</tspan><tspan class="k"> A removal motion signed by</tspan><tspan class="r"> 100 members</tspan><tspan class="k"> (in</tspan></text>
<text x="78" y="640"><tspan class="k">the case of Lok Sabha) or</tspan><tspan class="r"> 50 members</tspan><tspan class="k"> (in the case of Rajya Sabha) is to be given</tspan></text>
<text x="78" y="662"><tspan class="k">to the</tspan><tspan class="b"> Speaker/Chairman</tspan><tspan class="k">.</tspan></text>
<text x="56" y="688" class="r" style="font-weight:700">2.</text>
<text x="78" y="688"><tspan class="h" style="font-weight:700">Admission of motion:</tspan><tspan class="k"> The Speaker/Chairman may</tspan><tspan class="r"> admit the motion or refuse</tspan><tspan class="k"> to</tspan></text>
<text x="78" y="710"><tspan class="k">admit it.</tspan></text>
<text x="56" y="736" class="r" style="font-weight:700">3.</text>
<text x="78" y="736"><tspan class="h" style="font-weight:700">Three-member inquiry committee:</tspan><tspan class="k"> If it is admitted, then the Speaker/Chairman is</tspan></text>
<text x="78" y="758"><tspan class="k">to constitute a</tspan><tspan class="r"> three-member committee</tspan><tspan class="k"> to investigate into the charges.</tspan></text>
<text x="56" y="784" class="r" style="font-weight:700">4.</text>
<text x="78" y="784"><tspan class="h" style="font-weight:700">Composition of committee:</tspan><tspan class="k"> The committee should consist of (a) the</tspan><tspan class="b"> chief justice</tspan></text>
<text x="78" y="806"><tspan class="b">or a judge of the Supreme Court</tspan><tspan class="k">, (b) a</tspan><tspan class="b"> chief justice of a high court</tspan><tspan class="k">, and (c) a</tspan></text>
<text x="78" y="828"><tspan class="b">distinguished jurist</tspan><tspan class="k">.</tspan></text>
<text x="56" y="854" class="r" style="font-weight:700">5.</text>
<text x="78" y="854"><tspan class="h" style="font-weight:700">Finding of guilt:</tspan><tspan class="k"> If the committee finds the judge to be</tspan><tspan class="r"> guilty of misbehaviour or</tspan></text>
<text x="78" y="876"><tspan class="r">suffering from an incapacity</tspan><tspan class="k">, the House can take up the consideration of the</tspan></text>
<text x="78" y="898"><tspan class="k">motion.</tspan></text>
<text x="56" y="924" class="r" style="font-weight:700">6.</text>
<text x="78" y="924"><tspan class="h" style="font-weight:700">Special majority in both Houses:</tspan><tspan class="k"> After the motion is passed by each House of</tspan></text>
<text x="78" y="946"><tspan class="k">Parliament by</tspan><tspan class="r"> special majority</tspan><tspan class="k">, an address is presented to the President for removal</tspan></text>
<text x="78" y="968"><tspan class="k">of the judge.</tspan></text>
<text x="56" y="994" class="r" style="font-weight:700">7.</text>
<text x="78" y="994"><tspan class="h" style="font-weight:700">President’s removal order:</tspan><tspan class="k"> Finally, the</tspan><tspan class="r"> President passes an order</tspan><tspan class="k"> removing the</tspan></text>
<text x="78" y="1016"><tspan class="k">judge.</tspan></text>
<path d="M50 598 L44 598 L44 1022 L50 1022" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="63" y="1028" width="168" height="30" rx="3"/>
<text class="sm" x="147" y="1047" text-anchor="middle"><tspan class="k">motion:</tspan><tspan class="r"> 100 LS / 50 RS</tspan></text>
<line class="ln" x1="234" y1="1043" x2="254" y2="1043" marker-end="url(#ah)"/>
<rect class="bx" x="257" y="1028" width="178" height="30" rx="3"/>
<text class="sm" x="346" y="1047" text-anchor="middle"><tspan class="k">Speaker/Chairman admits</tspan></text>
<line class="ln" x1="438" y1="1043" x2="458" y2="1043" marker-end="url(#ah)"/>
<rect class="bx" x="461" y="1028" width="157" height="30" rx="3"/>
<text class="sm" x="539" y="1047" text-anchor="middle"><tspan class="r">3-member committee</tspan></text>
<line class="ln" x1="340" y1="1059" x2="340" y2="1080" marker-end="url(#ah)"/>
<rect class="bx" x="118" y="1082" width="67" height="30" rx="3"/>
<text class="sm" x="152" y="1101" text-anchor="middle"><tspan class="k">guilty?</tspan></text>
<line class="ln" x1="188" y1="1097" x2="208" y2="1097" marker-end="url(#ah)"/>
<rect class="bx" x="211" y="1082" width="198" height="30" rx="3"/>
<text class="sm" x="310" y="1101" text-anchor="middle"><tspan class="r">special majority</tspan><tspan class="k"> both Houses</tspan></text>
<line class="ln" x1="413" y1="1097" x2="433" y2="1097" marker-end="url(#ah)"/>
<rect class="bx" x="436" y="1082" width="126" height="30" rx="3"/>
<text class="sm" x="499" y="1101" text-anchor="middle"><tspan class="r" style="font-weight:700">President’s order</tspan></text>
<text x="44" y="1140"><tspan class="h" style="font-weight:700">No judge impeached – Ramaswami case:</tspan><tspan class="k"> It is interesting to know that</tspan><tspan class="r"> no judge of the</tspan></text>
<text x="56" y="1162"><tspan class="r">Supreme Court has been impeached so far</tspan><tspan class="k">. The first case of impeachment is that of</tspan></text>
<text x="56" y="1184"><tspan class="r">Justice V. Ramaswami</tspan><tspan class="k"> of the Supreme Court (</tspan><tspan class="r">1991–1993</tspan><tspan class="k">). Though the enquiry Committee</tspan></text>
<text x="56" y="1206"><tspan class="k">found him/her guilty of misbehaviour, he/she could not be removed as the impeachment</tspan></text>
<text x="56" y="1228"><tspan class="k">motion was</tspan><tspan class="r"> defeated in the Lok Sabha</tspan><tspan class="k">. The</tspan><tspan class="b"> Congress Party abstained from voting</tspan><tspan class="k">.</tspan></text>
<text class="xs" x="50" y="1264"><tspan class="r" style="font-weight:700">6</tspan><tspan class="k"> The word ‘impeachment’ is not used in the constitution in relation to the removal of judges.</tspan></text>
<text class="xs" x="50" y="1282"><tspan class="k">However, it is used only in the case of the removal of the President.</tspan></text>
<rect x="40" y="1242" width="600" height="49" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
