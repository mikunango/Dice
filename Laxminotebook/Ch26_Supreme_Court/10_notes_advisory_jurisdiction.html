<title>Advisory Jurisdiction</title>

<style>
:root{--text-primary:#1f1e1d;--text-secondary:#73726c}
html,body{margin:0;padding:0;background:#ffffff}

.n{display:block}
.n text{font-family:'Kalam',cursive;font-size:15px}.r{fill:#D93A3A}.b{fill:#2F6FDB}.k{fill:var(--text-primary)}.h{fill:#7A1F1F;text-decoration:underline}.hd{font-weight:700;font-size:17px!important}.sh{font-weight:700;font-size:16px!important}.ln{stroke:var(--text-secondary);stroke-width:1.2;fill:none}.lb{fill:var(--text-primary);font-weight:700;text-decoration:underline}.sm{font-size:14px!important}.xs{font-size:13px!important}.bx{fill:none;stroke:#D93A3A;stroke-width:1.2}.gx{fill:none;stroke:var(--text-secondary);stroke-width:1}

</style></head><body>
<div id="vis-container"><h2 class="sr-only">Advisory Jurisdiction</h2>
<svg class="n" width="100%" viewBox="0 0 680 1114" role="img"><title>Advisory Jurisdiction</title><desc>Advisory Jurisdiction</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="233" y="26" width="215" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Advisory Jurisdiction</text>
<text class="lb" x="40" y="98">4. Advisory Jurisdiction</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Article 143 – President’s reference:</tspan><tspan class="k"> The Constitution (</tspan><tspan class="r">Article 143</tspan><tspan class="k">) authorises the</tspan></text>
<text x="56" y="150"><tspan class="r">President</tspan><tspan class="k"> to seek the</tspan><tspan class="r"> opinion of the Supreme Court</tspan><tspan class="k"> in the two categories of matters:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(a)</text>
<text x="89" y="176"><tspan class="h" style="font-weight:700">Question of public importance:</tspan><tspan class="k"> On any</tspan><tspan class="r"> question of law or fact of public</tspan></text>
<text x="89" y="198"><tspan class="r">importance</tspan><tspan class="k"> which has arisen or which is likely to arise.</tspan></text>
<text x="56" y="224" class="r" style="font-weight:700">(b)</text>
<text x="89" y="224"><tspan class="h" style="font-weight:700">Pre-constitution treaty disputes:</tspan><tspan class="k"> On any dispute arising out of any</tspan></text>
<text x="89" y="246"><tspan class="r">pre-constitution treaty, agreement, covenant, engagement, sanad</tspan><tspan class="k"> or other similar</tspan></text>
<text x="89" y="268"><tspan class="k">instrument, which is excluded from the original jurisdiction of the Supreme Court.</tspan></text>
<path d="M50 156 L44 156 L44 274 L50 274" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="296"><tspan class="h" style="font-weight:700">Opinion not binding:</tspan><tspan class="k"> In the first case, the Supreme Court</tspan><tspan class="r"> may tender or may refuse</tspan><tspan class="k"> to</tspan></text>
<text x="56" y="318"><tspan class="k">tender its opinion to the President. But, in the second case, the Supreme Court ‘</tspan><tspan class="r">must</tspan><tspan class="k">’</tspan></text>
<text x="56" y="340"><tspan class="k">tender its opinion to the President. In both the cases, the opinion expressed by the</tspan></text>
<text x="56" y="362"><tspan class="k">Supreme Court is</tspan><tspan class="r"> only advisory and not a judicial pronouncement</tspan><tspan class="k">. Hence, it is</tspan><tspan class="r"> not binding</tspan></text>
<text x="56" y="384"><tspan class="r">on the President</tspan><tspan class="k">; he/she may follow or may not follow the opinion. However, it</tspan></text>
<text x="56" y="406"><tspan class="k">facilitates the government to have an</tspan><tspan class="b"> authoritative legal opinion</tspan><tspan class="k"> on a matter to be</tspan></text>
<text x="56" y="428"><tspan class="k">decided by it.</tspan></text>
<rect class="bx" x="46" y="442" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="460" text-anchor="middle"><tspan class="r" style="font-weight:700">(a) Question of law / fact</tspan></text>
<line class="ln" x1="190" y1="470" x2="190" y2="484" marker-end="url(#ah)"/>
<text class="sm" x="190" y="505" text-anchor="middle"><tspan class="k">SC</tspan><tspan class="r"> may</tspan><tspan class="k"> or may not answer</tspan></text>
<rect class="bx" x="346" y="442" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="460" text-anchor="middle"><tspan class="r" style="font-weight:700">(b) Pre-constitution treaty dispute</tspan></text>
<line class="ln" x1="490" y1="470" x2="490" y2="484" marker-end="url(#ah)"/>
<text class="sm" x="490" y="505" text-anchor="middle"><tspan class="k">SC</tspan><tspan class="r"> must</tspan><tspan class="k"> answer</tspan></text>
<line x1="340" y1="442" x2="340" y2="508" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<line class="ln" x1="340" y1="520" x2="340" y2="536" marker-end="url(#ah)"/>
<text class="sm" x="352" y="552"><tspan class="k">both:</tspan><tspan class="r"> advisory only</tspan><tspan class="k"> ·</tspan><tspan class="b"> not binding on President</tspan></text>
<text x="44" y="584"><tspan class="h" style="font-weight:700">Fifteen references so far:</tspan><tspan class="k"> So far, the President has made</tspan><tspan class="r"> fifteen references</tspan><tspan class="k"> to the</tspan></text>
<text x="56" y="606"><tspan class="k">Supreme Court under its advisory jurisdiction (</tspan><tspan class="b">also known as consultative jurisdiction</tspan><tspan class="k">).</tspan></text>
<text x="56" y="628"><tspan class="k">These are mentioned below in the chronological order.</tspan></text>
<text x="56" y="654" class="r" style="font-weight:700">1.</text>
<text x="83" y="654"><tspan class="k">Delhi Laws Act in</tspan><tspan class="r"> 1951</tspan></text>
<text x="56" y="680" class="r" style="font-weight:700">2.</text>
<text x="83" y="680"><tspan class="k">Kerala Education Bill in</tspan><tspan class="r"> 1958</tspan></text>
<text x="56" y="706" class="r" style="font-weight:700">3.</text>
<text x="83" y="706"><tspan class="k">Berubari Union in</tspan><tspan class="r"> 1960</tspan></text>
<text x="56" y="732" class="r" style="font-weight:700">4.</text>
<text x="83" y="732"><tspan class="k">Sea Customs Act in</tspan><tspan class="r"> 1963</tspan></text>
<text x="56" y="758" class="r" style="font-weight:700">5.</text>
<text x="83" y="758"><tspan class="k">Keshav Singh’s case relating to the privileges of the Legislature in</tspan><tspan class="r"> 1964</tspan></text>
<text x="56" y="784" class="r" style="font-weight:700">6.</text>
<text x="83" y="784"><tspan class="k">Presidential Election in</tspan><tspan class="r"> 1974</tspan></text>
<text x="56" y="810" class="r" style="font-weight:700">7.</text>
<text x="83" y="810"><tspan class="k">Special Courts Bill in</tspan><tspan class="r"> 1978</tspan></text>
<text x="56" y="836" class="r" style="font-weight:700">8.</text>
<text x="83" y="836"><tspan class="k">Jammu and Kashmir Resettlement Act in</tspan><tspan class="r"> 1982</tspan></text>
<text x="56" y="862" class="r" style="font-weight:700">9.</text>
<text x="83" y="862"><tspan class="k">Cauvery Water Disputes Tribunal in</tspan><tspan class="r"> 1992</tspan></text>
<text x="56" y="888" class="r" style="font-weight:700">10.</text>
<text x="83" y="888"><tspan class="k">Rama Janma Bhumi case in</tspan><tspan class="r"> 1993</tspan></text>
<text x="56" y="914" class="r" style="font-weight:700">11.</text>
<text x="83" y="914"><tspan class="k">Consultation process to be adopted by the chief justice of India in</tspan><tspan class="r"> 1998</tspan></text>
<text x="56" y="940" class="r" style="font-weight:700">12.</text>
<text x="83" y="940"><tspan class="k">Legislative competence of the Centre and States on the subject of natural gas and</tspan></text>
<text x="83" y="962"><tspan class="k">liquefied natural gas in</tspan><tspan class="r"> 2001</tspan></text>
<text x="56" y="988" class="r" style="font-weight:700">13.</text>
<text x="83" y="988"><tspan class="k">The constitutional validity of the Election Commission’s decision on deferring the</tspan></text>
<text x="83" y="1010"><tspan class="k">Gujarat Assembly Elections in</tspan><tspan class="r"> 2002</tspan></text>
<text x="56" y="1036" class="r" style="font-weight:700">14.</text>
<text x="83" y="1036"><tspan class="k">Punjab Termination of Agreements Act in</tspan><tspan class="r"> 2004</tspan></text>
<text x="56" y="1062" class="r" style="font-weight:700">15.</text>
<text x="83" y="1062"><tspan class="k">2G spectrum case verdict and the mandatory auctioning of natural resources across</tspan></text>
<text x="83" y="1084"><tspan class="k">all sectors in</tspan><tspan class="r"> 2012</tspan></text>
<path d="M50 634 L44 634 L44 1090 L50 1090" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
</svg>
</div></body></html>
