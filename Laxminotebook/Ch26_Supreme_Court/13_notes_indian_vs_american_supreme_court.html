<div id="vis-container"><h2 class="sr-only">Indian and American Supreme Courts Compared</h2>
<svg class="n" width="100%" viewBox="0 0 680 695" role="img"><title>Indian and American Supreme Courts Compared</title><desc>Indian and American Supreme Courts Compared</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="129" y="26" width="422" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Indian and American Supreme Courts Compared</text>
<text class="r hd" x="40" y="100">INDIAN AND AMERICAN SUPREME COURTS COMPARED</text>
<line x1="40" y1="106" x2="455" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">India vs USA:</tspan><tspan class="k"> There are differences in the jurisdiction and powers of the</tspan><tspan class="r"> Supreme Court</tspan></text>
<text x="56" y="156"><tspan class="r">of India</tspan><tspan class="k"> and that of the</tspan><tspan class="r"> Supreme Court of USA</tspan><tspan class="k">. These are summarised in</tspan><tspan class="r"> Table 26.1</tspan><tspan class="k">.</tspan></text>
<text x="40" y="186"><tspan class="r" style="font-weight:700">Table 26.1 Comparing Indian and American Supreme Courts</tspan></text>
<text class="sm" x="190" y="216" text-anchor="middle"><tspan class="r" style="font-weight:700">Indian Supreme Court</tspan></text>
<text class="sm" x="490" y="216" text-anchor="middle"><tspan class="r" style="font-weight:700">American Supreme Court</tspan></text>
<line class="gx" x1="40" y1="227" x2="640" y2="227"/>
<text class="sm" x="47" y="247"><tspan class="k">1. Its original jurisdiction is</tspan><tspan class="r"> confined to</tspan></text>
<text class="sm" x="47" y="266"><tspan class="r">federal cases</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="247"><tspan class="k">1. Its original jurisdiction covers not only</tspan></text>
<text class="sm" x="347" y="266"><tspan class="k">federal cases but also cases relating to</tspan><tspan class="r"> naval</tspan></text>
<text class="sm" x="347" y="285"><tspan class="r">forces, maritime activities, ambassadors</tspan><tspan class="k">, etc.</tspan></text>
<line class="gx" x1="40" y1="296" x2="640" y2="296"/>
<text class="sm" x="47" y="316"><tspan class="k">2. Its appellate jurisdiction covers</tspan></text>
<text class="sm" x="47" y="335"><tspan class="r">constitutional, civil and criminal</tspan><tspan class="k"> cases.</tspan></text>
<text class="sm" x="347" y="316"><tspan class="k">2. Its appellate jurisdiction is confined to</tspan></text>
<text class="sm" x="347" y="335"><tspan class="r">constitutional cases only</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="346" x2="640" y2="346"/>
<text class="sm" x="47" y="366"><tspan class="k">3. It has a very wide discretion to grant</tspan></text>
<text class="sm" x="47" y="385"><tspan class="r">special leave to appeal</tspan><tspan class="k"> in any matter against</tspan></text>
<text class="sm" x="47" y="404"><tspan class="k">the judgement of any court or tribunal</tspan></text>
<text class="sm" x="47" y="423"><tspan class="k">(except military).</tspan></text>
<text class="sm" x="347" y="366"><tspan class="k">3. It has</tspan><tspan class="r"> no such plenary power</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="434" x2="640" y2="434"/>
<text class="sm" x="47" y="454"><tspan class="k">4. It has</tspan><tspan class="r"> advisory jurisdiction</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="454"><tspan class="k">4. It has</tspan><tspan class="r"> no advisory jurisdiction</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="465" x2="640" y2="465"/>
<text class="sm" x="47" y="485"><tspan class="k">5. Its scope of judicial review is</tspan><tspan class="r"> limited</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="485"><tspan class="k">5. Its scope of judicial review is</tspan><tspan class="r"> very wide</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="496" x2="640" y2="496"/>
<text class="sm" x="47" y="516"><tspan class="k">6. It defends rights of the citizen according</tspan></text>
<text class="sm" x="47" y="535"><tspan class="k">to the ‘</tspan><tspan class="r">procedure established by law</tspan><tspan class="k">’.</tspan></text>
<text class="sm" x="347" y="516"><tspan class="k">6. It defends rights of the citizen according</tspan></text>
<text class="sm" x="347" y="535"><tspan class="k">to the ‘</tspan><tspan class="r">due process of law</tspan><tspan class="k">’.</tspan></text>
<line class="gx" x1="40" y1="546" x2="640" y2="546"/>
<text class="sm" x="47" y="566"><tspan class="k">7. Its jurisdiction and powers</tspan><tspan class="r"> can be enlarged</tspan></text>
<text class="sm" x="47" y="585"><tspan class="r">by Parliament</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="566"><tspan class="k">7. Its jurisdiction and powers are</tspan><tspan class="r"> limited to</tspan></text>
<text class="sm" x="347" y="585"><tspan class="r">that conferred by the Constitution</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="596" x2="640" y2="596"/>
<text class="sm" x="47" y="616"><tspan class="k">8. It has power of judicial superintendence</tspan></text>
<text class="sm" x="47" y="635"><tspan class="k">and control over state high courts due to</tspan></text>
<text class="sm" x="47" y="654"><tspan class="r">integrated judicial system</tspan><tspan class="k">.</tspan></text>
<text class="sm" x="347" y="616"><tspan class="k">8. It has no such power due to</tspan><tspan class="r"> double (or</tspan></text>
<text class="sm" x="347" y="635"><tspan class="r">separated) judicial system</tspan><tspan class="k">.</tspan></text>
<line class="gx" x1="40" y1="665" x2="640" y2="665"/>
