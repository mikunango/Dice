<div id="vis-container"><h2 class="sr-only">Court of Record, Contempt and Judicial Review</h2>
<svg class="n" width="100%" viewBox="0 0 680 1318" role="img"><title>Court of Record, Contempt and Judicial Review</title><desc>Court of Record, Contempt and Judicial Review</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="131" y="26" width="417" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Court of Record, Contempt and Judicial Review</text>
<text class="lb" x="40" y="98">5. A Court of Record</text>
<text x="44" y="128"><tspan class="h" style="font-weight:700">Two powers of a Court of Record:</tspan><tspan class="k"> As a</tspan><tspan class="r"> Court of Record</tspan><tspan class="k">, the Supreme Court has</tspan><tspan class="r"> two</tspan></text>
<text x="56" y="150"><tspan class="r">powers</tspan><tspan class="k">:</tspan></text>
<text x="56" y="176" class="r" style="font-weight:700">(a)</text>
<text x="89" y="176"><tspan class="h" style="font-weight:700">Records as precedents:</tspan><tspan class="k"> The judgements, proceedings and acts of the Supreme</tspan></text>
<text x="89" y="198"><tspan class="k">Court are</tspan><tspan class="r"> recorded for perpetual memory and testimony</tspan><tspan class="k">. These records are</tspan></text>
<text x="89" y="220"><tspan class="k">admitted to be of</tspan><tspan class="b"> evidentiary value</tspan><tspan class="k"> and cannot be questioned when produced</tspan></text>
<text x="89" y="242"><tspan class="k">before any court. They are recognised as</tspan><tspan class="r"> legal precedents and legal references</tspan><tspan class="k">.</tspan></text>
<text x="56" y="268" class="r" style="font-weight:700">(b)</text>
<text x="89" y="268"><tspan class="h" style="font-weight:700">Contempt power:</tspan><tspan class="k"> It has</tspan><tspan class="r"> power to punish for contempt of itself</tspan><tspan class="k">. In</tspan><tspan class="r"> 1991</tspan><tspan class="k">, the</tspan></text>
<text x="89" y="290"><tspan class="k">Supreme Court has ruled that it has power to punish for contempt not only of</tspan></text>
<text x="89" y="312"><tspan class="k">itself but also of</tspan><tspan class="r"> high courts, subordinate courts and tribunals</tspan><tspan class="k"> functioning in the</tspan></text>
<text x="89" y="334"><tspan class="k">entire country.</tspan></text>
<path d="M50 156 L44 156 L44 340 L50 340" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text class="sh" x="40" y="362"><tspan class="r" style="font-weight:700">Contempt of Courts Act (1971)</tspan></text>
<text x="44" y="392"><tspan class="h" style="font-weight:700">Sanyal Committee → 1971 Act:</tspan><tspan class="k"> In</tspan><tspan class="r"> 1961</tspan><tspan class="k">, the government appointed a special committee</tspan></text>
<text x="56" y="414"><tspan class="k">under the chairmanship of</tspan><tspan class="r"> H.N. Sanyal</tspan><tspan class="k">, the then Additional Solicitor General of India, to</tspan></text>
<text x="56" y="436"><tspan class="k">examine the law relating to the contempt of courts. This committee submitted its report</tspan></text>
<text x="56" y="458"><tspan class="k">in</tspan><tspan class="r"> 1963</tspan><tspan class="k">. Based on the recommendations made by the committee, the</tspan><tspan class="r"> Contempt of</tspan></text>
<text x="56" y="480"><tspan class="r">Courts Act, 1971</tspan><tspan class="k"> was enacted by the Parliament.</tspan></text>
<rect class="bx" x="85" y="492" width="164" height="48" rx="3"/>
<text class="sm" x="167" y="520" text-anchor="middle"><tspan class="k">Sanyal Committee</tspan><tspan class="r"> 1961</tspan></text>
<line class="ln" x1="252" y1="516" x2="272" y2="516" marker-end="url(#ah)"/>
<rect class="bx" x="275" y="492" width="95" height="48" rx="3"/>
<text class="sm" x="323" y="520" text-anchor="middle"><tspan class="k">report</tspan><tspan class="r"> 1963</tspan></text>
<line class="ln" x1="373" y1="516" x2="393" y2="516" marker-end="url(#ah)"/>
<rect class="bx" x="396" y="492" width="199" height="48" rx="3"/>
<text class="sm" x="496" y="511" text-anchor="middle"><tspan class="r" style="font-weight:700">Contempt of Courts Act</tspan></text>
<text class="sm" x="496" y="529" text-anchor="middle"><tspan class="r" style="font-weight:700">1971</tspan></text>
<text x="44" y="568"><tspan class="h" style="font-weight:700">Civil vs criminal contempt:</tspan><tspan class="k"> Under the Act, the contempt of court may be</tspan><tspan class="r"> civil or</tspan></text>
<text x="56" y="590"><tspan class="r">criminal</tspan><tspan class="k">. The</tspan><tspan class="r"> civil contempt</tspan><tspan class="k"> means</tspan><tspan class="b"> wilful disobedience</tspan><tspan class="k"> to any judgement, order, writ or</tspan></text>
<text x="56" y="612"><tspan class="k">other process of a court or</tspan><tspan class="b"> wilful breach of an undertaking</tspan><tspan class="k"> given to a court. The</tspan><tspan class="r"> criminal</tspan></text>
<text x="56" y="634"><tspan class="r">contempt</tspan><tspan class="k">, on the other hand, means the publication of any matter or doing an act</tspan></text>
<text x="56" y="656"><tspan class="k">which—(i)</tspan><tspan class="b"> scandalises or lowers the authority</tspan><tspan class="k"> of a court; or (ii)</tspan><tspan class="b"> prejudices or interferes</tspan></text>
<text x="56" y="678"><tspan class="k">with the due course of a judicial proceeding; or (iii)</tspan><tspan class="b"> interferes or obstructs the</tspan></text>
<text x="56" y="700"><tspan class="b">administration of justice</tspan><tspan class="k"> in any other manner.</tspan></text>
<rect class="bx" x="46" y="714" width="288" height="28" rx="3"/>
<text class="sm" x="190" y="732" text-anchor="middle"><tspan class="r" style="font-weight:700">Civil contempt</tspan></text>
<line class="ln" x1="190" y1="742" x2="190" y2="756" marker-end="url(#ah)"/>
<text class="sm" x="190" y="777" text-anchor="middle"><tspan class="k">wilful disobedience of order</tspan></text>
<text class="sm" x="190" y="799" text-anchor="middle"><tspan class="k">wilful breach of undertaking</tspan></text>
<rect class="bx" x="346" y="714" width="288" height="28" rx="3"/>
<text class="sm" x="490" y="732" text-anchor="middle"><tspan class="r" style="font-weight:700">Criminal contempt</tspan></text>
<line class="ln" x1="490" y1="742" x2="490" y2="756" marker-end="url(#ah)"/>
<text class="sm" x="490" y="777" text-anchor="middle"><tspan class="k">scandalises / lowers authority</tspan></text>
<text class="sm" x="490" y="799" text-anchor="middle"><tspan class="k">prejudices proceedings</tspan></text>
<text class="sm" x="490" y="821" text-anchor="middle"><tspan class="k">obstructs justice</tspan></text>
<line x1="340" y1="714" x2="340" y2="824" stroke="var(--text-secondary)" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="44" y="858"><tspan class="h" style="font-weight:700">Not contempt:</tspan><tspan class="k"> However,</tspan><tspan class="r"> innocent publication</tspan><tspan class="k"> and distribution of matter,</tspan><tspan class="r"> fair and</tspan></text>
<text x="56" y="880"><tspan class="r">accurate report</tspan><tspan class="k"> of judicial proceedings and</tspan><tspan class="r"> fair criticism</tspan><tspan class="k"> of judicial acts</tspan><tspan class="b"> do not amount to</tspan></text>
<text x="56" y="902"><tspan class="b">contempt of court</tspan><tspan class="k">.</tspan></text>
<text x="44" y="930"><tspan class="h" style="font-weight:700">Punishment:</tspan><tspan class="k"> Under the Act, a contempt of court is punishable with</tspan><tspan class="r"> simple imprisonment</tspan></text>
<text x="56" y="952"><tspan class="r">for a term upto six months</tspan><tspan class="k"> or with</tspan><tspan class="r"> fine upto ₹2,000</tspan><tspan class="k"> or with both.</tspan></text>
<text x="44" y="980"><tspan class="h" style="font-weight:700">Limitation – one year:</tspan><tspan class="k"> The Act also provides that no court shall initiate any proceedings</tspan></text>
<text x="56" y="1002"><tspan class="k">of contempt after the</tspan><tspan class="r"> expiry of one year</tspan><tspan class="k"> from the date on which the contempt is alleged</tspan></text>
<text x="56" y="1024"><tspan class="k">to have been committed.</tspan></text>
<text x="44" y="1052"><tspan class="h" style="font-weight:700">Not for Nyaya Panchayats:</tspan><tspan class="k"> Further, this Act is</tspan><tspan class="r"> not applicable to contempt of Nyaya</tspan></text>
<text x="56" y="1074"><tspan class="r">Panchayats</tspan><tspan class="k"> or other village courts which have been established for the administration of</tspan></text>
<text x="56" y="1096"><tspan class="k">justice.</tspan></text>
<text class="lb" x="40" y="1128">6. Power of Judicial Review</text>
<text x="44" y="1158"><tspan class="h" style="font-weight:700">Judicial review:</tspan><tspan class="r"> Judicial review</tspan><tspan class="k"> is the power of the Supreme Court to examine the</tspan></text>
<text x="56" y="1180"><tspan class="r">constitutionality of legislative enactments and executive orders</tspan><tspan class="k"> of both the Central and</tspan></text>
<text x="56" y="1202"><tspan class="k">state governments. On examination, if they are found to be violative of the Constitution</tspan></text>
<text x="56" y="1224"><tspan class="k">(</tspan><tspan class="r">ultra-vires</tspan><tspan class="k">), they can be declared as</tspan><tspan class="r"> illegal, unconstitutional and invalid (null and void)</tspan></text>
<text x="56" y="1246"><tspan class="k">by the Supreme Court. Consequently, they cannot be enforced by the Government.</tspan></text>
<rect class="bx" x="65" y="1258" width="151" height="30" rx="3"/>
<text class="sm" x="140" y="1277" text-anchor="middle"><tspan class="k">law / executive order</tspan></text>
<line class="ln" x1="219" y1="1273" x2="239" y2="1273" marker-end="url(#ah)"/>
<rect class="bx" x="242" y="1258" width="123" height="30" rx="3"/>
<text class="sm" x="303" y="1277" text-anchor="middle"><tspan class="k">examined by SC</tspan></text>
<line class="ln" x1="368" y1="1273" x2="388" y2="1273" marker-end="url(#ah)"/>
<rect class="bx" x="391" y="1258" width="95" height="30" rx="3"/>
<text class="sm" x="438" y="1277" text-anchor="middle"><tspan class="r">ultra-vires</tspan><tspan class="k">?</tspan></text>
<line class="ln" x1="488" y1="1273" x2="508" y2="1273" marker-end="url(#ah)"/>
<rect class="bx" x="511" y="1258" width="104" height="30" rx="3"/>
<text class="sm" x="563" y="1277" text-anchor="middle"><tspan class="r" style="font-weight:700">null and void</tspan></text>
</svg>
