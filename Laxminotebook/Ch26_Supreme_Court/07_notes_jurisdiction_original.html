<div id="vis-container"><h2 class="sr-only">Jurisdiction – Overview and Original Jurisdiction</h2>
<svg class="n" width="100%" viewBox="0 0 680 1571" role="img"><title>Jurisdiction – Overview and Original Jurisdiction</title><desc>Jurisdiction – Overview and Original Jurisdiction</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="128" y="26" width="423" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Jurisdiction – Overview and Original Jurisdiction</text>
<text class="r hd" x="40" y="100">JURISDICTION AND POWERS OF SUPREME COURT</text>
<line x1="40" y1="106" x2="415" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Most powerful Supreme Court:</tspan><tspan class="k"> The Constitution has conferred a very</tspan><tspan class="r"> extensive</tspan></text>
<text x="56" y="156"><tspan class="r">jurisdiction and vast powers</tspan><tspan class="k"> on the Supreme Court. It is not only a</tspan><tspan class="r"> Federal Court</tspan><tspan class="k"> like the</tspan></text>
<text x="56" y="178"><tspan class="b">American Supreme Court</tspan><tspan class="k"> but also a</tspan><tspan class="r"> final court of appeal</tspan><tspan class="k"> like the</tspan><tspan class="b"> British House of Lords</tspan></text>
<text x="56" y="200"><tspan class="k">(the Upper House of the British Parliament). It is also the</tspan><tspan class="r"> final interpreter and guardian</tspan></text>
<text x="56" y="222"><tspan class="r">of the Constitution</tspan><tspan class="k"> and</tspan><tspan class="r"> guarantor of the fundamental rights</tspan><tspan class="k"> of the citizens. Further, it</tspan></text>
<text x="56" y="244"><tspan class="k">has</tspan><tspan class="r"> advisory and supervisory powers</tspan><tspan class="k">. Therefore,</tspan><tspan class="r"> Alladi Krishnaswamy Ayyar</tspan><tspan class="k">, a member of</tspan></text>
<text x="56" y="266"><tspan class="k">the Drafting Committee of the Constituent Assembly, rightly remarked: “</tspan><tspan class="b">The Supreme</tspan></text>
<text x="56" y="288"><tspan class="b">Court of India has more powers than any other Supreme Court in any part of the world.</tspan><tspan class="k">”</tspan></text>
<text x="56" y="310"><tspan class="k">The jurisdiction and powers of the Supreme Court can be classified into the following:</tspan></text>
<text x="56" y="336" class="r" style="font-weight:700">1.</text>
<text x="78" y="336"><tspan class="k">Original Jurisdiction.</tspan></text>
<text x="56" y="362" class="r" style="font-weight:700">2.</text>
<text x="78" y="362"><tspan class="k">Writ Jurisdiction.</tspan></text>
<text x="56" y="388" class="r" style="font-weight:700">3.</text>
<text x="78" y="388"><tspan class="k">Appellate Jurisdiction.</tspan></text>
<text x="56" y="414" class="r" style="font-weight:700">4.</text>
<text x="78" y="414"><tspan class="k">Advisory Jurisdiction.</tspan></text>
<text x="56" y="440" class="r" style="font-weight:700">5.</text>
<text x="78" y="440"><tspan class="k">A Court of Record.</tspan></text>
<text x="56" y="466" class="r" style="font-weight:700">6.</text>
<text x="78" y="466"><tspan class="k">Power of Judicial Review.</tspan></text>
<text x="56" y="492" class="r" style="font-weight:700">7.</text>
<text x="78" y="492"><tspan class="k">Constitutional Interpretation</tspan></text>
<text x="56" y="518" class="r" style="font-weight:700">8.</text>
<text x="78" y="518"><tspan class="k">Other Powers.</tspan></text>
<path d="M50 316 L44 316 L44 524 L50 524" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<rect class="bx" x="40" y="530" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="550" text-anchor="middle"><tspan class="r">Original</tspan></text>
<rect class="bx" x="192" y="530" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="550" text-anchor="middle"><tspan class="r">Writ</tspan></text>
<rect class="bx" x="345" y="530" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="550" text-anchor="middle"><tspan class="r">Appellate</tspan></text>
<rect class="bx" x="498" y="530" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="550" text-anchor="middle"><tspan class="r">Advisory</tspan></text>
<rect class="bx" x="40" y="574" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="111" y="594" text-anchor="middle"><tspan class="r">Court of Record</tspan></text>
<rect class="bx" x="192" y="574" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="264" y="594" text-anchor="middle"><tspan class="r">Judicial Review</tspan></text>
<rect class="bx" x="345" y="574" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="416" y="594" text-anchor="middle"><tspan class="r">Interpretation</tspan></text>
<rect class="bx" x="498" y="574" width="142" height="32" rx="3" style="stroke:#D93A3A"/>
<text class="xs" x="569" y="594" text-anchor="middle"><tspan class="r">Other</tspan></text>
<text class="lb" x="40" y="638">1. Original Jurisdiction</text>
<text x="44" y="668"><tspan class="h" style="font-weight:700">Federal disputes:</tspan><tspan class="k"> As a</tspan><tspan class="r"> federal court</tspan><tspan class="k">, the Supreme Court decides the</tspan><tspan class="r"> disputes between</tspan></text>
<text x="56" y="690"><tspan class="r">different units of the Indian Federation</tspan><tspan class="k">. More elaborately, any dispute:</tspan></text>
<text x="56" y="716" class="r" style="font-weight:700">(a)</text>
<text x="89" y="716"><tspan class="h" style="font-weight:700">Centre vs state(s):</tspan><tspan class="k"> Between the</tspan><tspan class="r"> Centre and one or more states</tspan><tspan class="k">; or</tspan></text>
<text x="56" y="742" class="r" style="font-weight:700">(b)</text>
<text x="89" y="742"><tspan class="h" style="font-weight:700">Centre &amp; states vs states:</tspan><tspan class="k"> Between the</tspan><tspan class="r"> Centre and any state or states on one</tspan></text>
<text x="89" y="764"><tspan class="r">side</tspan><tspan class="k"> and</tspan><tspan class="r"> one or more other states</tspan><tspan class="k"> on the other side; or</tspan></text>
<text x="56" y="790" class="r" style="font-weight:700">(c)</text>
<text x="89" y="790"><tspan class="h" style="font-weight:700">Inter-state dispute:</tspan><tspan class="k"> Between</tspan><tspan class="r"> two or more states</tspan><tspan class="k">.</tspan></text>
<path d="M50 696 L44 696 L44 796 L50 796" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<line class="ln" x1="340" y1="796" x2="340" y2="808"/>
<line class="ln" x1="140" y1="808" x2="540" y2="808"/>
<line class="ln" x1="140" y1="808" x2="140" y2="824" marker-end="url(#ah)"/>
<line class="ln" x1="340" y1="808" x2="340" y2="824" marker-end="url(#ah)"/>
<line class="ln" x1="540" y1="808" x2="540" y2="824" marker-end="url(#ah)"/>
<text class="sm" x="140" y="844" text-anchor="middle"><tspan class="r">Centre vs state(s)</tspan></text>
<text class="sm" x="340" y="844" text-anchor="middle"><tspan class="r">Centre + state(s) vs state(s)</tspan></text>
<text class="sm" x="540" y="844" text-anchor="middle"><tspan class="r">state vs state</tspan></text>
<text x="44" y="876"><tspan class="h" style="font-weight:700">Exclusive original jurisdiction:</tspan><tspan class="k"> In the above federal disputes, the Supreme Court has</tspan></text>
<text x="56" y="898"><tspan class="r">exclusive original jurisdiction</tspan><tspan class="k">.</tspan><tspan class="b"> Exclusive</tspan><tspan class="k"> means, no other court can decide such disputes</tspan></text>
<text x="56" y="920"><tspan class="k">and</tspan><tspan class="b"> original</tspan><tspan class="k"> means, the power to hear such disputes in the first instance, not by way of</tspan></text>
<text x="56" y="942"><tspan class="k">appeal.</tspan></text>
<text x="44" y="970"><tspan class="h" style="font-weight:700">Legal right, not political:</tspan><tspan class="k"> With regard to the exclusive original jurisdiction of the</tspan></text>
<text x="56" y="992"><tspan class="k">Supreme Court, two points should be noted. One, the dispute must involve a question</tspan></text>
<text x="56" y="1014"><tspan class="k">(</tspan><tspan class="b">whether of law or fact</tspan><tspan class="k">) on which the existence or extent of a</tspan><tspan class="r"> legal right</tspan><tspan class="k"> depends.</tspan></text>
<text x="56" y="1036"><tspan class="k">Thus, the</tspan><tspan class="r"> questions of political nature are excluded</tspan><tspan class="k"> from it. Two, any suit brought before</tspan></text>
<text x="56" y="1058"><tspan class="k">the Supreme Court by a</tspan><tspan class="r"> private citizen against the Centre or a state cannot be</tspan></text>
<text x="56" y="1080"><tspan class="r">entertained</tspan><tspan class="k"> under this.</tspan></text>
<text x="44" y="1108"><tspan class="h" style="font-weight:700">Exclusions from original jurisdiction:</tspan><tspan class="k"> Further, this jurisdiction of the Supreme Court does</tspan></text>
<text x="56" y="1130"><tspan class="k">not extend to the following:</tspan></text>
<text x="56" y="1156" class="r" style="font-weight:700">(a)</text>
<text x="89" y="1156"><tspan class="h" style="font-weight:700">Pre-constitution treaties:</tspan><tspan class="k"> A dispute arising out of any</tspan><tspan class="r"> treaty, agreement,</tspan></text>
<text x="89" y="1178"><tspan class="r">covenant, engagement, sanad</tspan><tspan class="k"> or other similar instrument which, having been</tspan></text>
<text x="89" y="1200"><tspan class="k">entered into or executed</tspan><tspan class="b"> before the commencement of the constitution</tspan><tspan class="k">, continues</tspan></text>
<text x="89" y="1222"><tspan class="k">in operation after such commencement, or which provides that the said</tspan></text>
<text x="89" y="1244"><tspan class="k">jurisdiction shall not extend to such a dispute.</tspan></text>
<text x="56" y="1270" class="r" style="font-weight:700">(b)</text>
<text x="89" y="1270"><tspan class="h" style="font-weight:700">River water disputes (Art. 262):</tspan><tspan class="r"> Inter-state river water disputes</tspan><tspan class="k">.⁷</tspan></text>
<text x="56" y="1296" class="r" style="font-weight:700">(c)</text>
<text x="89" y="1296"><tspan class="h" style="font-weight:700">Finance Commission matters:</tspan><tspan class="k"> Matters referred to the</tspan><tspan class="r"> Finance Commission</tspan><tspan class="k">.</tspan></text>
<text x="56" y="1322" class="r" style="font-weight:700">(d)</text>
<text x="89" y="1322"><tspan class="h" style="font-weight:700">Expenses &amp; pensions:</tspan><tspan class="r"> Adjustment of certain expenses and pensions</tspan><tspan class="k"> between the</tspan></text>
<text x="89" y="1344"><tspan class="k">Centre and the states.</tspan></text>
<path d="M50 1136 L44 1136 L44 1350 L50 1350" fill="none" stroke="#D93A3A" stroke-width="1.6"/>
<text x="44" y="1372"><tspan class="h" style="font-weight:700">First suit – West Bengal vs Centre (1961):</tspan><tspan class="k"> In</tspan><tspan class="r"> 1961</tspan><tspan class="k">, the</tspan><tspan class="r"> first suit</tspan><tspan class="k">, under the original</tspan></text>
<text x="56" y="1394"><tspan class="k">jurisdiction of the Supreme Court, was brought by</tspan><tspan class="r"> West Bengal against the Centre</tspan><tspan class="k">. The</tspan></text>
<text x="56" y="1416"><tspan class="k">State Government challenged the Constitutional validity of the</tspan><tspan class="b"> Coal Bearing Areas</tspan></text>
<text x="56" y="1438"><tspan class="b">(Acquisition and Development) Act, 1957</tspan><tspan class="k">, passed by the Parliament. However, the</tspan></text>
<text x="56" y="1460"><tspan class="k">Supreme Court</tspan><tspan class="r"> dismissed the suit</tspan><tspan class="k"> by upholding the validity of the Act.</tspan></text>
<text class="xs" x="50" y="1496"><tspan class="r" style="font-weight:700">7</tspan><tspan class="k"> The Inter-State River Water Disputes Act of 1956 has excluded the original jurisdiction of the</tspan></text>
<text class="xs" x="50" y="1514"><tspan class="k">Supreme Court in disputes between states with respect to the use, distribution or control of the</tspan></text>
<text class="xs" x="50" y="1532"><tspan class="k">water of inter-state river or river valley.</tspan></text>
<rect x="40" y="1474" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
