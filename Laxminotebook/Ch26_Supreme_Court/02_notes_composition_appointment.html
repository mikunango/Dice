<div id="vis-container"><h2 class="sr-only">Composition and Appointment</h2>
<svg class="n" width="100%" viewBox="0 0 680 2041" role="img"><title>Composition and Appointment</title><desc>Composition and Appointment</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="196" y="26" width="289" height="40" rx="3" fill="none" stroke="#D93A3A" stroke-width="1.5"/>
<text class="r hd" x="340" y="53" text-anchor="middle">Composition and Appointment</text>
<text class="r hd" x="40" y="100">COMPOSITION AND APPOINTMENT</text>
<line x1="40" y1="106" x2="297" y2="106" stroke="#D93A3A" stroke-width="1"/>
<text x="44" y="134"><tspan class="h" style="font-weight:700">Strength – 34 judges:</tspan><tspan class="k"> At present, the Supreme Court consists of</tspan><tspan class="r"> thirty-four judges</tspan><tspan class="k"> (</tspan><tspan class="b">one</tspan></text>
<text x="56" y="156"><tspan class="b">chief justice and thirty three other judges</tspan><tspan class="k">). Originally, the strength of the Supreme</tspan></text>
<text x="56" y="178"><tspan class="k">Court was fixed at</tspan><tspan class="r"> eight</tspan><tspan class="k"> (</tspan><tspan class="b">one chief justice and seven other judges</tspan><tspan class="k">). The</tspan><tspan class="r"> Parliament</tspan><tspan class="k"> has</tspan></text>
<text x="56" y="200"><tspan class="k">increased this number of other judges progressively to</tspan><tspan class="r"> ten in 1956</tspan><tspan class="k">, to</tspan><tspan class="r"> thirteen in 1960</tspan><tspan class="k">, to</tspan></text>
<text x="56" y="222"><tspan class="r">seventeen in 1977</tspan><tspan class="k">, to</tspan><tspan class="r"> twenty-five in 1986</tspan><tspan class="k">, to</tspan><tspan class="r"> thirty in 2008</tspan><tspan class="k"> and to</tspan><tspan class="r"> thirty-three in 2019</tspan><tspan class="k">.</tspan></text>
<rect class="bx" x="48" y="234" width="69" height="30" rx="3"/>
<text class="sm" x="82" y="253" text-anchor="middle"><tspan class="k">1950:</tspan><tspan class="r"> 7</tspan></text>
<line class="ln" x1="120" y1="249" x2="140" y2="249" marker-end="url(#ah)"/>
<rect class="bx" x="143" y="234" width="75" height="30" rx="3"/>
<text class="sm" x="181" y="253" text-anchor="middle"><tspan class="k">1956:</tspan><tspan class="r"> 10</tspan></text>
<line class="ln" x1="221" y1="249" x2="241" y2="249" marker-end="url(#ah)"/>
<rect class="bx" x="244" y="234" width="75" height="30" rx="3"/>
<text class="sm" x="282" y="253" text-anchor="middle"><tspan class="k">1960:</tspan><tspan class="r"> 13</tspan></text>
<line class="ln" x1="322" y1="249" x2="342" y2="249" marker-end="url(#ah)"/>
<rect class="bx" x="345" y="234" width="72" height="30" rx="3"/>
<text class="sm" x="381" y="253" text-anchor="middle"><tspan class="k">1977:</tspan><tspan class="r"> 17</tspan></text>
<line class="ln" x1="420" y1="249" x2="440" y2="249" marker-end="url(#ah)"/>
<rect class="bx" x="443" y="234" width="80" height="30" rx="3"/>
<text class="sm" x="484" y="253" text-anchor="middle"><tspan class="k">1986:</tspan><tspan class="r"> 25</tspan></text>
<line class="ln" x1="527" y1="249" x2="547" y2="249" marker-end="url(#ah)"/>
<rect class="bx" x="550" y="234" width="83" height="30" rx="3"/>
<text class="sm" x="591" y="253" text-anchor="middle"><tspan class="k">2008:</tspan><tspan class="r"> 30</tspan></text>
<line class="ln" x1="340" y1="265" x2="340" y2="286" marker-end="url(#ah)"/>
<rect class="bx" x="300" y="288" width="79" height="30" rx="3"/>
<text class="sm" x="340" y="307" text-anchor="middle"><tspan class="k">2019:</tspan><tspan class="r"> 33</tspan></text>
<line class="ln" x1="340" y1="324" x2="340" y2="340" marker-end="url(#ah)"/>
<text class="sm" x="352" y="356"><tspan class="k">other judges (excluding CJI) · today</tspan><tspan class="r"> 33 +</tspan></text>
<text class="sm" x="352" y="375"><tspan class="r">CJI = 34</tspan></text>
<text x="44" y="407"><tspan class="h" style="font-weight:700">Acts on strength:</tspan><tspan class="k"> The various Acts relating to the composition of the Supreme Court</tspan></text>
<text x="56" y="429"><tspan class="k">are summarised in</tspan><tspan class="r"> Table 26.2</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="457"><tspan class="r" style="font-weight:700">Appointment of Judges</tspan></text>
<text x="44" y="487"><tspan class="h" style="font-weight:700">Appointment by President:</tspan><tspan class="k"> The judges of the Supreme Court are</tspan><tspan class="r"> appointed by the</tspan></text>
<text x="56" y="509"><tspan class="r">President</tspan><tspan class="k">. The</tspan><tspan class="r"> chief justice</tspan><tspan class="k"> is appointed by the President after consultation with such</tspan></text>
<text x="56" y="531"><tspan class="k">judges of the Supreme Court and high courts as he/she deems necessary. The</tspan><tspan class="r"> other</tspan></text>
<text x="56" y="553"><tspan class="r">judges</tspan><tspan class="k"> are appointed by President after consultation with the</tspan><tspan class="b"> chief justice</tspan><tspan class="k"> and such</tspan></text>
<text x="56" y="575"><tspan class="k">other judges of the Supreme Court and the high courts as he/she deems necessary. The</tspan></text>
<text x="56" y="597"><tspan class="k">consultation with the chief justice is</tspan><tspan class="r"> obligatory</tspan><tspan class="k"> in the case of appointment of a judge</tspan></text>
<text x="56" y="619"><tspan class="k">other than Chief justice.</tspan></text>
<text class="sh" x="40" y="647"><tspan class="r" style="font-weight:700">Controversy over Consultation</tspan></text>
<text x="44" y="677"><tspan class="h" style="font-weight:700">Judges cases – meaning of ‘consultation’:</tspan><tspan class="k"> The Supreme Court has given different</tspan></text>
<text x="56" y="699"><tspan class="k">interpretation of the word ‘</tspan><tspan class="r">consultation</tspan><tspan class="k">’ in the above provision. In the</tspan><tspan class="r"> First Judges</tspan></text>
<text x="56" y="721"><tspan class="r">case¹ᵃ (1981)</tspan><tspan class="k">, the Court held that consultation</tspan><tspan class="b"> does not mean concurrence</tspan><tspan class="k"> and it only</tspan></text>
<text x="56" y="743"><tspan class="k">implies</tspan><tspan class="b"> exchange of views</tspan><tspan class="k">. But, in the</tspan><tspan class="r"> Second Judges case¹ᵇ (1993)</tspan><tspan class="k">, the Court reversed</tspan></text>
<text x="56" y="765"><tspan class="k">its earlier ruling and changed the meaning of the word consultation to</tspan><tspan class="r"> concurrence</tspan><tspan class="k">.</tspan></text>
<text x="56" y="787"><tspan class="k">Hence, it ruled that the advice tendered by the Chief Justice of India is</tspan><tspan class="r"> binding on the</tspan></text>
<text x="56" y="809"><tspan class="r">President</tspan><tspan class="k"> in the matters of appointment of the judges of the Supreme Court. But, the</tspan></text>
<text x="56" y="831"><tspan class="k">Chief Justice would tender his/her advice on the matter after consulting</tspan><tspan class="b"> two of his/her</tspan></text>
<text x="56" y="853"><tspan class="b">seniormost colleagues</tspan><tspan class="k">. Similarly, in the</tspan><tspan class="r"> Third Judges case² (1998)</tspan><tspan class="k">, the Court opined that</tspan></text>
<text x="56" y="875"><tspan class="k">the consultation process to be adopted by the Chief justice of India requires</tspan></text>
<text x="56" y="897"><tspan class="k">‘</tspan><tspan class="r">consultation of plurality judges</tspan><tspan class="k">’. The sole opinion of the chief justice of India does not</tspan></text>
<text x="56" y="919"><tspan class="k">constitute the consultation process. He/she should consult a</tspan><tspan class="r"> collegium of four seniormost</tspan></text>
<text x="56" y="941"><tspan class="r">judges</tspan><tspan class="k"> of the Supreme Court and even if</tspan><tspan class="b"> two judges give an adverse opinion</tspan><tspan class="k">, he/she</tspan></text>
<text x="56" y="963"><tspan class="k">should not send the recommendation to the government. The court held that the</tspan></text>
<text x="56" y="985"><tspan class="k">recommendation made by the chief justice of India without complying with the norms</tspan></text>
<text x="56" y="1007"><tspan class="k">and requirements of the consultation process are</tspan><tspan class="r"> not binding</tspan><tspan class="k"> on the government.</tspan></text>
<rect class="bx" x="67" y="1019" width="260" height="48" rx="3"/>
<text class="sm" x="197" y="1038" text-anchor="middle"><tspan class="r" style="font-weight:700">1st Judges (1981)</tspan><tspan class="k">: consultation ≠</tspan></text>
<text class="sm" x="197" y="1056" text-anchor="middle"><tspan class="k">concurrence</tspan></text>
<line class="ln" x1="330" y1="1043" x2="350" y2="1043" marker-end="url(#ah)"/>
<rect class="bx" x="353" y="1019" width="260" height="48" rx="3"/>
<text class="sm" x="483" y="1038" text-anchor="middle"><tspan class="r" style="font-weight:700">2nd Judges (1993)</tspan><tspan class="k">: concurrence · CJI</tspan></text>
<text class="sm" x="483" y="1056" text-anchor="middle"><tspan class="k">+ 2</tspan></text>
<line class="ln" x1="340" y1="1068" x2="340" y2="1089" marker-end="url(#ah)"/>
<rect class="bx" x="71" y="1091" width="253" height="30" rx="3"/>
<text class="sm" x="198" y="1110" text-anchor="middle"><tspan class="r" style="font-weight:700">3rd Judges (1998)</tspan><tspan class="k">: collegium CJI + 4</tspan></text>
<line class="ln" x1="327" y1="1106" x2="347" y2="1106" marker-end="url(#ah)"/>
<rect class="bx" x="350" y="1091" width="259" height="30" rx="3"/>
<text class="sm" x="480" y="1110" text-anchor="middle"><tspan class="r" style="font-weight:700">4th Judges (2015)</tspan><tspan class="k">: NJAC struck down</tspan></text>
<text x="44" y="1149"><tspan class="h" style="font-weight:700">NJAC and Fourth Judges case:</tspan><tspan class="k"> The</tspan><tspan class="r"> 99th Constitutional Amendment Act of 2014</tspan><tspan class="k"> and</tspan></text>
<text x="56" y="1171"><tspan class="k">the</tspan><tspan class="r"> National Judicial Appointments Commission Act of 2014</tspan><tspan class="k"> have replaced the</tspan><tspan class="b"> collegium</tspan></text>
<text x="56" y="1193"><tspan class="b">system</tspan><tspan class="k"> of appointing judges to the Supreme Court and High Courts with a new body</tspan></text>
<text x="56" y="1215"><tspan class="k">called the</tspan><tspan class="r"> National Judicial Appointments Commission (NJAC)</tspan><tspan class="k">. However, in</tspan><tspan class="r"> 2015</tspan><tspan class="k">, the</tspan></text>
<text x="56" y="1237"><tspan class="k">Supreme Court has declared both the 99th Constitutional Amendment as well as the</tspan></text>
<text x="56" y="1259"><tspan class="k">NJAC Act as</tspan><tspan class="r"> unconstitutional and void</tspan><tspan class="k">. Consequently, the earlier</tspan><tspan class="r"> collegium system</tspan></text>
<text x="56" y="1281"><tspan class="r">became operative again</tspan><tspan class="k">. This verdict was delivered by the Supreme Court in the</tspan><tspan class="r"> Fourth</tspan></text>
<text x="56" y="1303"><tspan class="r">Judges case²ᵃ (2015)</tspan><tspan class="k">. The court opined that the new system (i.e., NJAC) would affect</tspan></text>
<text x="56" y="1325"><tspan class="k">the</tspan><tspan class="b"> independence of the judiciary</tspan><tspan class="k">.</tspan></text>
<text class="sh" x="40" y="1353"><tspan class="r" style="font-weight:700">Appointment of Chief Justice</tspan></text>
<text x="44" y="1383"><tspan class="h" style="font-weight:700">Seniority convention for CJI:</tspan><tspan class="k"> From</tspan><tspan class="r"> 1950 to 1973</tspan><tspan class="k">, the practice has been to appoint the</tspan></text>
<text x="56" y="1405"><tspan class="r">seniormost judge</tspan><tspan class="k"> of the Supreme Court as the chief justice of India. This established</tspan></text>
<text x="56" y="1427"><tspan class="k">convention was violated in</tspan><tspan class="r"> 1973</tspan><tspan class="k"> when</tspan><tspan class="r"> A.N. Ray</tspan><tspan class="k"> was appointed as the Chief Justice of</tspan></text>
<text x="56" y="1449"><tspan class="k">India by</tspan><tspan class="b"> superseding three senior judges</tspan><tspan class="k">.³ Again in</tspan><tspan class="r"> 1977</tspan><tspan class="k">,</tspan><tspan class="r"> M.U. Beg</tspan><tspan class="k"> was appointed as the</tspan></text>
<text x="56" y="1471"><tspan class="k">chief justice of India by</tspan><tspan class="b"> superseding the then senior-most judge</tspan><tspan class="k">.⁴ This discretion of the</tspan></text>
<text x="56" y="1493"><tspan class="k">government was curtailed by the Supreme Court in the</tspan><tspan class="r"> Second Judges case (1993)</tspan><tspan class="k">, in</tspan></text>
<text x="56" y="1515"><tspan class="k">which the Supreme Court ruled that the</tspan><tspan class="r"> seniormost judge</tspan><tspan class="k"> of the Supreme Court should</tspan></text>
<text x="56" y="1537"><tspan class="k">alone be appointed to the office of the chief justice of India.</tspan></text>
<rect class="bx" x="154" y="1549" width="135" height="30" rx="3"/>
<text class="sm" x="222" y="1568" text-anchor="middle"><tspan class="k">1950–73:</tspan><tspan class="r"> seniority</tspan></text>
<line class="ln" x1="292" y1="1564" x2="312" y2="1564" marker-end="url(#ah)"/>
<rect class="bx" x="315" y="1549" width="210" height="30" rx="3"/>
<text class="sm" x="421" y="1568" text-anchor="middle"><tspan class="k">1973:</tspan><tspan class="r"> A.N. Ray</tspan><tspan class="k"> (3 superseded)</tspan></text>
<line class="ln" x1="340" y1="1580" x2="340" y2="1601" marker-end="url(#ah)"/>
<rect class="bx" x="143" y="1603" width="207" height="30" rx="3"/>
<text class="sm" x="247" y="1622" text-anchor="middle"><tspan class="k">1977:</tspan><tspan class="r"> M.U. Beg</tspan><tspan class="k"> (1 superseded)</tspan></text>
<line class="ln" x1="353" y1="1618" x2="373" y2="1618" marker-end="url(#ah)"/>
<rect class="bx" x="376" y="1603" width="161" height="30" rx="3"/>
<text class="sm" x="457" y="1622" text-anchor="middle"><tspan class="k">1993:</tspan><tspan class="r" style="font-weight:700"> seniority binding</tspan></text>
<text class="xs" x="50" y="1669"><tspan class="r" style="font-weight:700">1a</tspan><tspan class="k"> S.P. Gupta vs. Union of India (1981).</tspan></text>
<rect x="40" y="1647" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1714"><tspan class="r" style="font-weight:700">1b</tspan><tspan class="k"> Supreme Court Advocates-on-Record Association vs. Union of India (1993).</tspan></text>
<rect x="40" y="1692" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1759"><tspan class="r" style="font-weight:700">2</tspan><tspan class="k"> In Re-Presidential Reference (1998). The President sought the Supreme Court’s opinion (under</tspan></text>
<text class="xs" x="50" y="1777"><tspan class="k">Article 143) on certain doubts over the Consultation process to be adopted by the chief justice of</tspan></text>
<text class="xs" x="50" y="1795"><tspan class="k">India as stipulated in the 1993 case.</tspan></text>
<rect x="40" y="1737" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1840"><tspan class="r" style="font-weight:700">2a</tspan><tspan class="k"> Supreme Court Advocates-on-Record Association vs. Union of India (2015).</tspan></text>
<rect x="40" y="1818" width="600" height="31" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1885"><tspan class="r" style="font-weight:700">3</tspan><tspan class="k"> A.N. Ray was fourth in seniority. The three superseded judges were J.M. Shelat, K.S. Hegde and</tspan></text>
<text class="xs" x="50" y="1903"><tspan class="k">A.N. Grover. All the three judges resigned from the Supreme Court. They were superseded due to</tspan></text>
<text class="xs" x="50" y="1921"><tspan class="k">their judgement in Kesavananda Bharati case (1973), which was not favourable to the Government.</tspan></text>
<rect x="40" y="1863" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="xs" x="50" y="1966"><tspan class="r" style="font-weight:700">4</tspan><tspan class="k"> He was H.R. Khanna and he too resigned. His dissenting judgement upholding the right to life</tspan></text>
<text class="xs" x="50" y="1984"><tspan class="k">even during emergency in the ADM Jabalpur vs. Shivkant Shukla case (1976) was not appreciated</tspan></text>
<text class="xs" x="50" y="2002"><tspan class="k">by the Government.</tspan></text>
<rect x="40" y="1944" width="600" height="67" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="4 3"/>
</svg>
</div></body></html>
